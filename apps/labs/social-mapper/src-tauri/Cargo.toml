[package]
name = "social_mapper"
version = "0.0.0"
description = "Maps, keeps and downloads social profiles through a signed-in browser"
edition = "2021"

[lib]
name = "social_mapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
