[package]
name = "semantica"
version = "0.0.0"
description = "Semantica port canary: headless Document→KG→eval chain over F1 + W1"
edition = "2021"

[lib]
name = "semantica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
