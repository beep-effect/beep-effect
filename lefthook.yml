pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      exclude: ".beep/**|goals/**|outputs/**|scratchpad/**"
      run: bunx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    jsdoc:
      glob: "packages/tooling/*/*/src/**/*.ts"
      exclude:
        - "packages/tooling/*/*/src/internal/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/*.d.ts"
      # --no-error-on-unmatched-pattern: a staged file can sit under one of the docs config's
      # ignorePatterns (for example src/test/**); oxlint then lints nothing and must not fail.
      run: bunx oxlint --config .oxlintrc.docs.json --no-error-on-unmatched-pattern {staged_files}
    gitleaks:
      run: gitleaks protect --staged --verbose --config .gitleaks.toml
    typos:
      glob: "*.{ts,tsx,js,jsx,md,json}"
      exclude: ".beep/**|goals/**|outputs/**|scratchpad/**"
      run: typos --exclude '.beep/**' --exclude 'scratchpad/**'
    cache-profile:
      glob: "{biome.jsonc,biome.identity.jsonc}"
      run: bun run beep cache profile
    # The no-tracked-python law (`bun run beep laws no-tracked-python --check`) has no allowlist,
    # so a staged add or edit of a Python file fails without starting bun. Deletions are not staged
    # files here, so commits that remove Python pass.
    no-tracked-python:
      glob: "*.{py,pyi,pyw,ipynb}"
      run: printf '%s  port it to TypeScript or run it outside the repository; tracked Python is banned\n' {staged_files} >&2; exit 1
    instructions-drift:
      glob: "{CLAUDE.md,AGENTS.md}"
      run: bun run instructions:drift
    # Generated catalog shards (standards/schema-catalog, standards/instrumentation-catalog) are
    # checked hosted-only (Repo Sanity) and by the cheap gates `yeet publish` runs, so a PR pushed
    # with package-scoped checks only learned about a stale shard after its first hosted run and the
    # S11 merge carried it to main (#2522, #2526, #2540 on 2026-11-02). These hooks refresh the
    # shards of the packages owning the staged sources and stage them so the commit carries them.
    # The schema-catalog hook parses only the staged files and splices their entries into the
    # owners' shards, so a commit costs about the bun + ts-morph floor (~0.6 GB) whatever the package
    # size; entries never cross files, so the splice is byte for byte what the full writer produces.
    # The instrumentation hook still regenerates each owning package whole. `files` replaces
    # lefthook's {staged_files} (ACMR) so a deleted or moved module drops its entries too;
    # `--no-renames` lists both sides of a move.
    # Worker-profile hosts (`beep compute profile --is worker` exits 0) skip both writers; the hosted
    # regeneration job (keyed on the `compute-profile-worker` label) or the owner's workstation
    # regenerates the shards.
    schema-catalog:
      files: git diff --name-only --cached --no-renames --diff-filter=ACMD
      glob: "{apps,packages,infra}/**/*.{ts,tsx}"
      exclude:
        - "**/docs/**"
        - "**/*.d.ts"
        - "**/node_modules/**"
      skip:
        - run: bun run beep compute profile --is worker
      run: bun run beep lint schema-catalog --write --stage {files}
    instrumentation-catalog:
      files: git diff --name-only --cached --no-renames --diff-filter=ACMD
      glob: "{apps,packages}/**/src/**/*.{ts,tsx}"
      exclude:
        - "**/test/**"
        - "**/*.d.ts"
        - "**/node_modules/**"
      skip:
        - run: bun run beep compute profile --is worker
      run: bun run beep observability catalog --write --stage {files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

post-merge:
  commands:
    version-sync-check:
      run: bun run beep version-sync --skip-network

pre-push:
  commands:
    bun-version-check:
      run: bun run beep version-sync --check-runtime
