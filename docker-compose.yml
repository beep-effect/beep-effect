services:
  redis:
    image: redis:8.10.1
    container_name: beep-redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
  postgres:
    container_name: beep-db
    image: pgvector/pgvector:pg17
    restart: always
    shm_size: 1g
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U postgres -d postgres'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: |
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=5
      -c hot_standby=on
      -c hot_standby_feedback=on
      -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${DB_PG_PORT:-5432}:${DB_PG_PORT:-5432}"

  grafana:
    image: grafana/otel-lgtm:0.32.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-4000}:3000"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - grafana_lgtm_data:/data
      - ./docker/grafana/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./docker/grafana/datasources.yaml:/otel-lgtm/grafana-datasources.yaml:ro
      - ./docker/grafana/chat-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/professional-desktop.yaml:ro
      - ./docker/grafana/chat-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/professional-desktop/chat-dashboard.json:ro
volumes:
  grafana_lgtm_data:
  redis_data:
