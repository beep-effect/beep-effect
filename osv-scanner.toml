# OSV Scanner configuration shared by the GitHub security workflow and local
# repo sanity checks.
#
# Keep this file present even when there are no accepted vulnerability ignores:
# the workflow passes it explicitly with `--config=osv-scanner.toml`, and the
# local Bun audit wrapper mirrors ignored vulnerability ids found here.
#
# Add exceptions only after review, with a reason and expiry date. Prefer an
# exact `PackageOverrides` match when the exception is specific to one package
# artifact; reserve `IgnoredVulns` for advisory-wide exceptions. OSV Scanner
# enforces both expiry forms natively. The local Bun audit wrapper (runBunAudit
# in packages/tooling/tool/cli/src/commands/Quality/Quality.command.ts) mirrors
# active `IgnoredVulns` ids and mirrors exact `PackageOverrides` only while
# every resolution of that package in bun.lock matches the reviewed version.
#
# Retired dependency-refresh ignores are intentionally absent when the lockfile
# resolves fixed versions. The current lock resolves esbuild 0.25.12, form-data
# 4.0.6, protobufjs 8.6.5, nested protobufjs 7.6.4, and image-size 2.0.4
# naturally from dependency ranges; lodash-es 4.18.1 comes from the root
# package.json `overrides` entry because mermaid 12's chevrotain ~11.1.2 pins the
# vulnerable 4.17.23 (GHSA-f23m-r3pf-42rh, GHSA-r5fr-rjxr-66jc); basic-ftp 6.2.1
# comes from the same `overrides` block because get-uri (box-node-sdk ->
# proxy-agent -> pac-proxy-agent) pins ^5.0.2, which GHSA-c475-qrg2-pj4r
# (fixed in 6.2.1) covers; postcss-selector-parser 7.1.6 comes from the same
# block because @tailwindcss/typography pins 6.0.10 and the hoisted copy sat at
# 7.1.5, both covered by GHSA-rj75-hqrm-r3gf (fixed in 7.1.6). The H1 receipt records why http-cache-semantics 4.3.0 did not satisfy the
# behavioral proof despite falling outside the advisory affected range.

# No proven patched npm releases exist as of 2026-10-09. These exact lockfile artifacts
# enter through development and infrastructure tooling, not application runtime
# dependencies. Reassess promptly when upstream publishes patched versions.
[[PackageOverrides]]
name = "braces"
version = "3.0.3"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-10-30T00:00:00Z
reason = "GHSA-vfj7-8cjw-p6xm: no fixed npm release on 2026-10-09. Consumer/owner: @beep/storybook, shadcn -> fast-glob -> micromatch. Exit: fixed braces release passes install and OSV, or shadcn dependency path is removed. Recheck by 2026-10-30; receipt: stage-4-h1-catalog.md#osv-exceptions."

[[PackageOverrides]]
name = "http-cache-semantics"
version = "4.2.0"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-10-30T00:00:00Z
reason = "GHSA-ch52-4w7c-c8xp. Consumer/owner: @beep/infra, Pulumi -> npm tooling -> make-fetch-happen. 4.3.0 reuses a stored public no-cache response under max-stale through make-fetch-happen without required revalidation in the corrected H1 proof; upstream kornelski/http-cache-semantics#56. Exit: fixed release passes that proof and OSV, or dependency path is removed. Recheck by 2026-10-30; receipt: stage-4-h1-catalog.md#osv-exceptions."

# GHSA-hp3w-g68c-fv3c has no patched release as of 2026-10-05. The only
# lockfile parent of sprintf-js is argparse 1.0.10, used by the mammoth and
# remarkable CLI entrypoints. Their help/usage templates are package-authored
# constants; document contents and argv values are substitution arguments,
# never format strings. Their library entrypoints do not load argparse, and
# repository source has no direct sprintf-js or argparse import. Reassess if
# these entrypoints or the dependency graph change, or a patch is released.
[[PackageOverrides]]
name = "sprintf-js"
version = "1.0.3"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-10-30T00:00:00Z
reason = "GHSA-hp3w-g68c-fv3c: no fixed npm release on 2026-10-09. Consumers/owners: @beep/doc-text (mammoth) and @beep/repo-docgen (remarkable via markdown-toc), both via argparse 1.0.10. Exit: fixed sprintf-js passes consumers and OSV, or both CLI dependency paths are removed. Templates are trusted constants. Recheck by 2026-10-30; receipt: stage-4-h1-catalog.md#osv-exceptions."

# Bun audit mirrors active exact PackageOverrides and IgnoredVulns. These ids match the package overrides
# above so repo-sanity:bun-audit honors the same accepted exceptions.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-10-30T00:00:00Z
reason = "GHSA-vfj7-8cjw-p6xm; owner @beep/storybook. Same reviewed braces 3.0.3 exception above, including its fixed-release or dependency-removal exit and 2026-10-30 recheck."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2026-10-30T00:00:00Z
reason = "GHSA-hp3w-g68c-fv3c; owners @beep/doc-text and @beep/repo-docgen. Same reviewed sprintf-js 1.0.3 exception above, including its fixed-release or dependency-removal exit and 2026-10-30 recheck."

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-10-30T00:00:00Z
reason = "GHSA-ch52-4w7c-c8xp; owner @beep/infra. Same reviewed http-cache-semantics 4.2.0 exception above, including its behavioral-proof and OSV exit and 2026-10-30 recheck."
