# OSV Scanner configuration shared by the GitHub security workflow and local
# repo sanity checks.
#
# Keep this file present even when there are no accepted vulnerability ignores:
# the workflow passes it explicitly with `--config=osv-scanner.toml`, and the
# local Bun audit wrapper mirrors ignored vulnerability ids found here.
#
# Add exceptions only after review, with a reason and expiry date. Prefer an
# exact `PackageOverrides` match when the exception is specific to one package
# artifact; reserve `IgnoredVulns` for advisory-wide exceptions. OSV Scanner
# enforces both expiry forms natively. The local Bun audit wrapper (runBunAudit
# in packages/tooling/tool/cli/src/commands/Quality/Quality.command.ts) mirrors
# active `IgnoredVulns` ids and mirrors exact `PackageOverrides` only while
# every resolution of that package in bun.lock matches the reviewed version.
#
# Retired dependency-refresh ignores are intentionally absent when the lockfile
# resolves fixed versions. The current lock resolves esbuild 0.25.12, form-data
# 4.0.6, protobufjs 8.6.5, nested protobufjs 7.6.4, and image-size 2.0.4
# naturally from dependency ranges; lodash-es 4.18.1 comes from the root
# package.json `overrides` entry because mermaid 12's chevrotain ~11.1.2 pins the
# vulnerable 4.17.23 (GHSA-f23m-r3pf-42rh, GHSA-r5fr-rjxr-66jc); basic-ftp 6.2.1
# comes from the same `overrides` block because get-uri (box-node-sdk ->
# proxy-agent -> pac-proxy-agent) pins ^5.0.2, which GHSA-c475-qrg2-pj4r
# (fixed in 6.2.1) covers; postcss-selector-parser 7.1.6 comes from the same
# block because @tailwindcss/typography pins 6.0.10 and the hoisted copy sat at
# 7.1.5, both covered by GHSA-rj75-hqrm-r3gf (fixed in 7.1.6). `resolutions#`
# is a comment-only note key.

# effect is pinned to a pkg.pr.new snapshot of Effect-TS/effect main (commit
# b5a2d4c1d6, two commits after the 4.0.0 tag). OSV cannot parse the URL
# as a version, so it matches GHSA-38f7-945m-qr2g (fixed in 3.20.0), which only
# affects the effect 3.x line. Scoped to that exact artifact; re-key it at every
# snapshot bump and retire it if the catalog ever returns to a plain version.
[[PackageOverrides]]
name = "effect"
version = "https://pkg.pr.new/Effect-TS/effect/effect@b5a2d4c1d62c9620a68d72b7f20248c69ef7663b"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-10-31T00:00:00Z
reason = "pkg.pr.new snapshot of effect main (4.0.0-rc.118+1); GHSA-38f7-945m-qr2g is a 3.x advisory and OSV cannot version-match the URL pin. Re-key at every snapshot bump."

# No patched npm releases exist as of 2026-10-02. These exact lockfile artifacts
# enter through development and infrastructure tooling, not application runtime
# dependencies. Reassess promptly when upstream publishes patched versions.
[[PackageOverrides]]
name = "braces"
version = "3.0.3"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-10-16T00:00:00Z
reason = "GHSA-vfj7-8cjw-p6xm has no patched npm release. This lockfile instance comes only through shadcn/Storybook fast-glob and micromatch tooling; revisit by 2026-10-16."

[[PackageOverrides]]
name = "http-cache-semantics"
version = "4.2.0"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-10-16T00:00:00Z
reason = "GHSA-ch52-4w7c-c8xp has no patched npm release. This lockfile instance comes through Pulumi/npm install tooling via make-fetch-happen, not a shared application response cache; revisit by 2026-10-16."

# Bun audit mirrors only IgnoredVulns. These ids match the package overrides
# above so repo-sanity:bun-audit honors the same accepted exceptions.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-10-16T00:00:00Z
reason = "No patched npm release. Same exception as the braces 3.0.3 package override; tooling-only via shadcn/Storybook fast-glob."

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-10-16T00:00:00Z
reason = "No patched npm release. Same exception as the http-cache-semantics 4.2.0 package override; Pulumi install tooling only."
