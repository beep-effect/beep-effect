# OSV Scanner configuration shared by the GitHub security workflow and local
# repo sanity checks.
#
# Keep this file present even when there are no accepted vulnerability ignores:
# the workflow passes it explicitly with `--config=osv-scanner.toml`, and the
# local Bun audit wrapper mirrors ignored vulnerability ids found here.
#
# Add exceptions only after review, with a reason and expiry date. Prefer an
# exact `PackageOverrides` match when the exception is specific to one package
# artifact; reserve `IgnoredVulns` for advisory-wide exceptions. OSV Scanner
# enforces both expiry forms natively. The local Bun audit wrapper (runBunAudit
# in packages/tooling/tool/cli/src/commands/Quality/Quality.command.ts) mirrors
# active `IgnoredVulns` ids and mirrors exact `PackageOverrides` only while
# every resolution of that package in bun.lock matches the reviewed version, so
# an exact override needs no `IgnoredVulns` twin (OSV reports one as unused).
#
# Retired dependency-refresh ignores are intentionally absent when the lockfile
# resolves fixed versions. The current lock resolves esbuild 0.25.12 and 0.28.2,
# form-data 4.0.6, lodash-es 4.18.1 and image-size 2.0.4 naturally from
# dependency ranges. Three fixed versions come from the root package.json
# `overrides` block instead:
#   - protobufjs 7.6.6 (`^7.6.6`), because onnx-proto pins ^6.8.8 and would
#     otherwise resolve 6.11.6, which carries 11 GHSAs;
#   - basic-ftp 6.2.1, because get-uri (box-node-sdk -> proxy-agent ->
#     pac-proxy-agent) pins ^5.0.2, which GHSA-c475-qrg2-pj4r (fixed in 6.2.1)
#     covers;
#   - postcss-selector-parser 7.1.6, because @tailwindcss/typography pins 6.0.10,
#     covered by GHSA-rj75-hqrm-r3gf (fixed in 7.1.6).
# The residue hold register records all three as retained overrides. The lock
# resolves http-cache-semantics 4.3.0, outside GHSA-ch52-4w7c-c8xp's range; the
# register records why its max-stale path is unchanged and not exploitable here.

# No patched npm releases exist as of the 2026-10-17 recheck (npm latest braces
# 3.0.3 and sprintf-js 1.1.3 are both inside the advisory ranges). These exact
# lockfile artifacts enter through development tooling, not application runtime
# dependencies. Reassess promptly when upstream publishes patched versions.
[[PackageOverrides]]
name = "braces"
version = "3.0.3"
ecosystem = "npm"
ignore = true
effectiveUntil = 2027-01-14T00:00:00Z
reason = "GHSA-vfj7-8cjw-p6xm: no fixed npm release at the 2026-10-17 recheck (micromatch/braces#70 open). Consumer/owner: @beep/storybook; the only lockfile parent is fast-glob 3.3.3 under the shadcn CLI (shadcn, @shadcn/registry, shadcn's nested @ts-morph/common 0.27.0). Patterns are CLI-authored globs over local files, never untrusted input. Exit: fixed braces release passes install and OSV, or the shadcn path is removed. Recheck by 2027-01-14; receipt: goals/repository-simplification-residue/history/receipts/hold-register.md."

# GHSA-hp3w-g68c-fv3c has no patched release as of the 2026-10-17 recheck. The
# only lockfile parent of sprintf-js is argparse 1.0.10, used by the mammoth,
# remarkable and js-yaml 3 (gray-matter) CLI entrypoints. Their help/usage
# templates are package-authored constants; document contents and argv values
# are substitution arguments, never format strings. Their library entrypoints do
# not load argparse, and repository source has no direct sprintf-js or argparse
# import. Reassess if these entrypoints or the dependency graph change, or a
# patch is released.
[[PackageOverrides]]
name = "sprintf-js"
version = "1.0.3"
ecosystem = "npm"
ignore = true
effectiveUntil = 2027-01-14T00:00:00Z
reason = "GHSA-hp3w-g68c-fv3c: no fixed npm release at the 2026-10-17 recheck (alexei/sprintf.js#237 open; latest 1.1.3 is affected). Consumers/owners: @beep/doc-text (mammoth) and @beep/repo-docgen (remarkable and gray-matter's js-yaml 3 via markdown-toc), all via argparse 1.0.10 CLI entrypoints with package-authored templates. Exit: fixed sprintf-js passes consumers and OSV, or every argparse 1 path is removed. Recheck by 2027-01-14; receipt: goals/repository-simplification-residue/history/receipts/hold-register.md."

# GHSA-gcqx-w48m-w2h4 (deepmerge prototype pollution) has no patched release as
# of the 2026-10-27 recheck: npm latest is 4.3.1, inside the 4.2.0-4.3.1 range,
# and TehShrike/deepmerge#273 is open. The only lockfile parents are the shadcn
# CLI (shadcn 4.22.1 and @shadcn/registry 0.2.0); shadcn 4.23.0 and
# @shadcn/registry 0.2.1 still depend on ^4.3.1. The CLI merges the local
# components.json config with registry item JSON from developer-configured
# registries, only when a developer runs it; its output is source reviewed in a
# PR, and no application runtime path loads deepmerge.
[[PackageOverrides]]
name = "deepmerge"
version = "4.3.1"
ecosystem = "npm"
ignore = true
effectiveUntil = 2027-01-14T00:00:00Z
reason = "GHSA-gcqx-w48m-w2h4: no fixed npm release at the 2026-10-27 recheck (TehShrike/deepmerge#273 open; latest 4.3.1 is affected). Consumer/owner: @beep/storybook; the only lockfile parents are shadcn 4.22.1 and @shadcn/registry 0.2.0 (the shadcn CLI; 4.23.0 and 0.2.1 still require ^4.3.1). Inputs are the local components.json and registry items from developer-configured registries, merged only when a developer runs the CLI; no runtime path. Exit: fixed deepmerge passes install and OSV, or the shadcn path is removed. Recheck by 2027-01-14; receipt: goals/repository-simplification-residue/history/receipts/hold-register.md."
