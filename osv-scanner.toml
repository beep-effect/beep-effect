[[IgnoredVulns]]
id = "GHSA-38f7-945m-qr2g"
ignoreUntil = 2026-10-15T00:00:00Z
reason = "effect v3 advisory (fixed in 3.20.0) reported against the deliberate pkg.pr.new snapshot pin https://pkg.pr.new/Effect-TS/effect/effect@c8349ed: OSV cannot order a URL specifier against the advisory range and falls back to flagged. The pinned snapshot is the 4.0.0-rc lineage (main commit c8349ed, well past the v3 fix), so the vulnerable code is not present. Kept narrow to this advisory id rather than a package-wide override so future effect advisories still surface. Revisit when the catalog returns to registry semver pins."
