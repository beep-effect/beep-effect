# OSV Scanner configuration shared by the GitHub security workflow and local
# repo sanity checks.
#
# Keep this file present even when there are no accepted vulnerability ignores:
# the workflow passes it explicitly with `--config=osv-scanner.toml`, and the
# local Bun audit wrapper mirrors ignored vulnerability ids found here.
#
# Add exceptions only after review, with a reason and expiry date. Prefer an
# exact `PackageOverrides` match when the exception is specific to one package
# artifact; reserve `IgnoredVulns` for advisory-wide exceptions. OSV Scanner
# enforces both expiry forms natively. The local Bun audit wrapper (runBunAudit
# in packages/tooling/tool/cli/src/commands/Quality/Quality.command.ts) mirrors
# only active `IgnoredVulns` ids because Bun audit has no package-scoped ignore.
#
# Retired dependency-refresh ignores are intentionally absent when the lockfile
# resolves fixed versions. The current lock resolves esbuild 0.25.12, form-data
# 4.0.6, protobufjs 8.6.5, and nested protobufjs 7.6.4 naturally from dependency
# ranges. Root package.json has no active overrides object; `resolutions#` is a
# comment-only note key.

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-09-15T00:00:00Z
reason = "image-size ICNS-parser infinite-loop DoS affecting <=2.0.2; 2.0.2 IS the npm latest, so no fixed release exists to bump to (verified against the registry 2026-08-08). image-size is a direct dependency of @beep/repo-cli used only by the operator-invoked media tooling (Files/internal/Media*) over locally produced QA artifacts; the DoS requires attacker-supplied ICNS input and no CI lane feeds untrusted files to it, so worst case is an infinite loop inside a timeboxed job. Newly published advisory, not introduced by the current PR (identical version on main; main's Security lane is red on the same finding). Revisit when image-size publishes a release above 2.0.2."

