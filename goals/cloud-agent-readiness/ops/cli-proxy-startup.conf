# Install as ~/.config/systemd/user/cli-proxy-api.service.d/startup.conf, with
# cli-proxy-startup-check.ts at ~/.local/lib/beep/cli-proxy-startup-check.ts.
# User network-online.target does not wait for the system network manager.
# Bun resolves from this fixed PATH: ~/.bun/bin on fleet workers, the mise shim
# on the workstation.
[Service]
ExecStartPre=/usr/bin/env PATH=%h/.bun/bin:%h/.local/share/mise/shims:%h/.local/bin:/usr/local/bin:/usr/bin:/bin bun %h/.local/lib/beep/cli-proxy-startup-check.ts network
ExecStartPost=/usr/bin/env PATH=%h/.bun/bin:%h/.local/share/mise/shims:%h/.local/bin:/usr/local/bin:/usr/bin:/bin bun %h/.local/lib/beep/cli-proxy-startup-check.ts registered
TimeoutStartSec=120
