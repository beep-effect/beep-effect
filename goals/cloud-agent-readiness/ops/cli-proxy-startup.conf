# Install as ~/.config/systemd/user/cli-proxy-api.service.d/startup.conf
# User network-online.target does not wait for the system network manager.
[Service]
ExecStartPre=/usr/bin/python3 %h/.local/lib/beep/cli-proxy-startup-check.py network
ExecStartPost=/usr/bin/python3 %h/.local/lib/beep/cli-proxy-startup-check.py registered
TimeoutStartSec=120
