[project]
name = "beep-skillopt-runner"
version = "0.0.0"
description = "Pinned SkillOpt environment for the skillopt-training-pilot goal (goals/skillopt-training-pilot). Not a published package."
requires-python = ">=3.11"
dependencies = ["skillopt==0.2.0"]

[project.scripts]
beep-skillopt-train = "beep_skillopt.train:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
