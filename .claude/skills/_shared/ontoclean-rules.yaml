# OntoClean checks over a proposed taxonomy + class meta-properties, applied by
# the adversary seat along each is-a edge. They are a checklist, not automation:
# the auditor's validator does not read this file or compare meta-properties
# across `parents` edges. Assigning meta-properties remains conceptual work.
# Encode class_meta as {rigidity: rigid|anti_rigid|semi_rigid|unresolved,
# identity: supplies|carries|none|unresolved,
# unity: unity|anti_unity|non_unity|unresolved   (+U | ~U | -U),
# dependence: none|relational|intrinsic|unresolved}.
checks:
  - rule: anti-rigid superclass with rigid subclass
    action: BLOCK
  - rule: conflicting supplied identity criteria in one taxonomy
    action: BLOCK
  - rule: Role with no declared relational-dependence rationale
    action: BLOCK
  - rule: Phase classified as relationally defined
    action: REVIEW
  - rule: sortal with no kind ancestor (itself included) that supplies identity
    action: BLOCK
  - rule: class marked both identity-supplying and identity-free
    action: BLOCK
  - rule: unresolved rigidity on a core sortal in a proposal SUBMITTED FOR RATIFICATION (fires at the step-8 gate, not at acceptance)
    action: BLOCK
  - rule: subclass edge whose child can leave the parent while persisting
    action: REVIEW   # anti-rigidity smell on the edge itself
  - rule: anti-unity (~U) superclass with a unity (+U) subclass
    action: REVIEW
  - rule: relationally dependent superclass (dependence relational, +D) with a non-dependent subclass (dependence none, -D)
    action: REVIEW
