<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>graph-3d P0 bench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111111;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #9ee;
        font-size: 12px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
        z-index: 10;
      }
      #controls {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }
      button {
        background: #223;
        color: #cde;
        border: 1px solid #446;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">boot…</div>
    <div id="controls">
      <button id="bench">run 20s benchmark</button>
      <button id="select">select hub</button>
      <button id="clear">clear selection</button>
      <button id="remount">destroy + double remount</button>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
