lockfileVersion: '9.0'

settings:
  autoInstallPeers: false
  excludeLinksFromLockfile: false

importers:

  packages/a: {}

  packages/b:
    dependencies:
      probe-a:
        specifier: workspace:*
        version: link:../a
      react:
        specifier: file:../../vendor/react
        version: file:vendor/react

packages:

  react@file:vendor/react:
    resolution: {directory: vendor/react, type: directory}

snapshots:

  react@file:vendor/react: {}
