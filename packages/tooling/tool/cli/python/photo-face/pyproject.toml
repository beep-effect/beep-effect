[project]
name = "beep-photo-face"
version = "0.1.0"
description = "Local InsightFace worker for person matching in photo collections"
requires-python = "==3.12.*"
dependencies = [
  "insightface==1.0.1",
  "numpy==1.26.4",
  "onnxruntime==1.23.2",
  "opencv-python==4.11.0.86",
]

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beep_photo_face"]
