[default.extend-words]
# @beep/glob keeps minimatch's upstream method name (adjascentGlobstarOptimize) and
# the glob test vectors "abd"; "compilability" is a glob design term. The
# @beep/yaml lexer tests name an anchor "anc".
adjascent = "adjascent"
abd = "abd"
compilability = "compilability"
anc = "anc"
# @beep/markdown tests name the HTML entity "&curren;".
curren = "curren"
# @beep/commands quotes "raison d'etre"; @beep/schema-org tests reference the
# vendored vocabulary's "fnd" namespace.
raison = "raison"
fnd = "fnd"
optin = "optin" # Models manifest role muse.optin
wdth = "wdth" # OpenType variable-font width axis tag (font-variation-settings)
certifi = "certifi" # Python CA-bundle package in the #1882 dependency-review fixtures
# Effect-TS vocabulary
Struct = "Struct"
Fnc = "Fnc"
Ser = "Ser"
Eff = "Eff"

# Effect-TS API names (not typos)
Somes = "Somes"
annote = "annote"
bimap = "bimap"
# OCCT surface type name as replicad reports it (Face.geomType)
CYLINDRE = "CYLINDRE"
# PDF stream filter name (ISO 32000 FlateDecode) and pdf-lib's `flateStream`
Flate = "Flate"
flate = "flate"
# GnuPG --with-colons record tag for a key fingerprint line (scripts/cloud/bootstrap.sh)
fpr = "fpr"
retriev = "retriev"
Uncommited = "Uncommited"
Overrideable = "Overrideable"
libpff = "libpff"
tika = "tika"
Tika = "Tika"
ALIS = "ALIS"
Definely = "Definely"
LOV = "LOV"
# Intentional misspelling in identity Vocab negative test (asserts typo'd predicate is rejected)
Clas = "Clas"

# Biome rule names
Inferrable = "Inferrable"
noInferrableTypes = "noInferrableTypes"

# Domain terms
exat = "exat"
pxat = "pxat"
cose = "cose"
Cose = "Cose"
unparseable = "unparseable"
sherif = "sherif"
beep = "beep"
monorepo = "monorepo"
turborepo = "turborepo"
bunfig = "bunfig"
syncpack = "syncpack"
lefthook = "lefthook"
vitest = "vitest"
tstyche = "tstyche"
docgen = "docgen"
dedup = "dedup"
dtslint = "dtslint"
tsbuildinfo = "tsbuildinfo"
Compensacion = "Compensacion"
IST = "IST"
JOD = "JOD"
Nam = "Nam"
ND = "ND"
Som = "Som"
HPE = "HPE"
BA = "BA"
# GES: Ant Group's Graph Engine Service algorithm library (docs/graphs/graph-databases.md), not a typo.
GES = "GES"
PN = "PN"
AKS = "AKS"
mis = "mis"

# MIME/file-extension tokens and generated doc anchors.
validat = "validat" # jsdoc inventory anchor for the epistemics export validAt
aas = "aas"
anser = "anser"
aso = "aso"
caf = "caf"
colorts = "colorts"
commonspace = "commonspace"
exstream = "exstream"
fo = "fo"
gam = "gam"
iif = "iif"
nervana = "nervana"
odf = "odf"
opf = "opf"
recordare = "recordare"
sycle = "sycle"
ue = "ue"
uper = "uper"
vas = "vas"
vor = "vor"

# 3D / Three.js material API names (not typos)
metalness = "metalness"

[files]
extend-exclude = [
  # Vendored conformance suites promoted from the effected kit: byte-faithful
  # upstream text (yaml-test-suite, toml-test).
  "packages/foundation/modeling/yaml/test/fixtures/yaml-test-suite/**",
  "packages/foundation/modeling/toml/test/fixtures/toml-test/**",
  # Vendored data lists promoted from the effected kit: byte-faithful upstream
  # text (the schema.org vocabulary, the SPDX license and exception lists).
  "packages/foundation/modeling/schema-org/src/internal/vocabulary.ts",
  "packages/foundation/modeling/spdx/src/internal/licenseIds.ts",
  "packages/foundation/modeling/spdx/src/internal/licenseMeta.ts",
  # The SPDX license-id schema vendored for @beep/sbom's CycloneDX oracle:
  # byte-faithful upstream text pinned by sha256 in test/fixtures/VENDORED.md.
  "packages/foundation/modeling/sbom/test/fixtures/spdx.SNAPSHOT.schema.json",
  # The HTML5 named-character-reference table generated for @beep/markdown (entity names).
  "packages/foundation/modeling/markdown/src/internal/entityMap.ts",
  # Licensed GLib source is retained from the upstream crate for a safety backport.
  # Preserve upstream spellings; authored maintenance docs live in vendor/rust/README.md.
  "vendor/rust/glib-0.18.5/**",
  # graft per-file wiring cards mirror every source file (including excluded
  # trees such as scratchpad/); graft .ignore re-admits them to ignore-aware tools.
  "graft/**",
  # Vendored upstream API documents drivers generate from (OpenAPI / JSON Schema);
  # kept byte-faithful to upstream, so their spelling is not ours to fix.
  "packages/drivers/*/openapi.json",
  "packages/drivers/*/spec/*.json",
  # Generated Pulumi terraform-module bridge SDK — vendored upstream text.
  "infra/ci-runners/sdks/**",
  # Exploration capture files are verbatim, append-only human dumps
  # (explorations/README.md conventions) — never spell-gated.
  "explorations/*/CAPTURE.md",
  # Public USPTO claims and semantic reference receipts preserve source spelling
  # and exact offsets. Correcting their typos would invalidate provenance/anchors.
  "packages/law-practice/domain/test/fixtures/claim-element/**",
  "packages/law-practice/server/test/fixtures/claim-element/**",
  # Semantica gold labels quote source papers verbatim (anchors verify
  # byte-exact against the corpus text) — their spelling is not ours to fix.
  "apps/labs/semantica/fixtures/gold/**",
  # Dependency patches: unified-diff context lines truncate mid-word by
  # format design, which reads as a typo to the checker.
  "patches/*.patch",
  # Nightly research packets contain sanitized machine-generated source excerpts.
  "research/**",
  "bun.lock",
  "*.snap",
  ".repos/**",
  "node_modules/**",
  "build/**",
  "tmp/**",
  "dist/**",
  "coverage/**",
  ".next/**",
  "**/storybook-static/**",
  ".beep/**",
  "scratchpad/**",
  "explorations/**",
  "outputs/agent-reliability/**",
  "goals/**",
  "standards/repo-exports.catalog.jsonc",
  "standards/repo-exports.catalog.md",
  # Detector evidence quotes source excerpts truncated at fixed character limits.
  # Their partial identifiers are machine output, not authored prose.
  "standards/effect-vitest.inventory.jsonc",
  # schema-inventory/v1 rows cap upstream signatures and summaries at fixed
  # lengths, so truncated identifiers are machine output, not authored prose.
  "packages/tooling/tool/cli/test/fixtures/effect-schema-rc118/inventory/*.jsonl",
  "**/internal/data/**",
  "packages/law-practice/domain/src/internal/generated/free-law-project/**",
  "**/src-tauri/gen/**",
  "**/src-tauri/target/**",
  # Vendored, version-pinned WHATWG/webref spec data for @beep/html (see data/SOURCES.md).
  "packages/foundation/modeling/html/data/**",
  # Generated registered BCP 47 subtags are machine-owned identifiers, not prose.
  "packages/foundation/modeling/html/src/internal/Html.language-tag-registry.generated.ts",
  # Bun patch files truncate identifiers at line-wrap boundaries (`effect_Schem`),
  # which is not prose and trips the dictionary on context hunk headers.
  "patches/**",
]

# Immutable harness rows store Git refs as hex, including abbreviated refs.
# Check their prose normally; dictionary words inside ref fields are not prose.
[type.harness-ledger]
extend-glob = ["*.jsonl"]
extend-ignore-re = ['"(?:ref|repoRevision)":"[0-9a-f]{7,40}"']
