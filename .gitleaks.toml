description = "Verified immutable Boolean-creep prose false positives; exact path and line only."
condition = "AND"
regexTarget = "line"
paths = ['''^(?:/repo/)?goals/boolean-creep/history/designs/2026-09-09-r28-cli-l-q/effect-import-rules-summary-operation\.md$''']
regexes = [
  '''^\n?[\t ]*leaking the decoded key into public JSON, moving/defaulting neighboring keys,$''',
]

