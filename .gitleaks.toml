[extend]
useDefault = true

[[allowlists]]
description = "Vendored subtrees (openclaw, effect) contain upstream docs and test fixtures with placeholder secrets"
paths = [
  '''^\.repos/openclaw/.*$''',
  '''^\.repos/effect/.*$''',
]

[[allowlists]]
description = "Venice OpenAPI operation id is not a secret"
regexes = [
  '''getApiKeyGenerateWeb3Key''',
]

[[allowlists]]
description = "CauseRedaction is a secret-redaction helper; its JSDoc @example blocks and tests intentionally contain placeholder secret-shaped strings (sk-/token=/API_KEY=) to demonstrate redaction. These are not real secrets. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path like evil/packages/.../CauseRedaction.ts cannot inherit the allowlist."
paths = [
  '''^(?:/repo/)?packages/foundation/capability/observability/src/CauseRedaction\.ts$''',
  '''^(?:/repo/)?packages/foundation/capability/observability/test/CauseRedaction\.test\.ts$''',
]

[[allowlists]]
description = "law-practice slice test fixtures are synthetic/public-only by mandate (privilege wall: a fixture is never a real client matter). Synthetic fixture keys such as \"rejection.102\" (a §102 rejection key) trip the generic-api-key entropy heuristic but are not secrets."
paths = [
  '''(^|/)packages/law-practice/[^/]+/test/.*$''',
]

[[allowlists]]
description = "@beep/data generated dataset modules are machine-generated by `bun run beep sync-data-to-ts` from public official registries (IANA media types, IANA tzdb, Unicode CLDR, ISO 4217). Long technical identifiers in these public datasets trip the generic-api-key entropy heuristic but are not secrets. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path cannot inherit the allowlist."
paths = [
  '''^(?:/repo/)?packages/foundation/primitive/data/src/generated/.*$''',
]

[[allowlists]]
description = "Gold-intake provenance ledgers (research/SOURCES.md under explorations/ and goals/) curate mined code snippets and crypto/token-format references (Fernet, PASETO, iron-webcrypto, @noble/ciphers, etc.). Long technical identifiers in these curated reference lists trip the generic-api-key entropy heuristic but are not secrets. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path cannot inherit the allowlist. Path/rule allowlist (survives squash-merge), replacing the earlier commit-fingerprint entry."
targetRules = ["generic-api-key"]
paths = [
  '''^(?:/repo/)?explorations/[^/]+/research/SOURCES\.md$''',
  '''^(?:/repo/)?goals/[^/]+/research/SOURCES\.md$''',
]

[[allowlists]]
description = "Archived P0/phase spike evidence under goals/*/history/ records content-addressed inventory digests (bare sha256 hex) as the proof that an immutable root did not change. Where a case name contains a keyword such as \"token\" (e.g. `writer case: token-swap root_before=<sha256>`), the adjacent digest trips the generic-api-key entropy heuristic. Scoped with condition=AND so ONLY bare 64-char lowercase hex under an evidence path is exempt: any real key shape (sk-, ghp_, base64, JWT) in the same files still fails. Spike harnesses additionally run their own exact-value and token-shape scans before archiving. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path cannot inherit the allowlist. Path/rule allowlist (survives squash-merge) rather than a commit fingerprint."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^(?:/repo/)?goals/[^/]+/history/.*$''',
]
regexes = [
  '''^[a-f0-9]{64}$''',
]
