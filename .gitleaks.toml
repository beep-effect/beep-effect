[[allowlists]]
description = "Qualification runtime-key evidence stores public SHA-256 computation digests, not credentials. Restrict the exception to the three digest fields in the four reviewed receipts."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^runtimeKey(?:Digest|Value|ObservationSha256)"\s*:\s*"[0-9a-f]{64}"$''']
paths = ['''^(?:/repo/)?goals/turborepo-task-qualification/research/(?:runtime-key-checkpoint|runtime-keyed-invalidation-observation|pilot-runtime-key-v5-stable|pilot-runtime-key-v5-canary)\.json$''']

[[allowlists]]
description = "Exact public synthetic canary used to verify cache capture rejection; never an operator credential."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^QUALIFICATION_SYNTHETIC_SECRET_629a94d2$''']
paths = ['''^(?:/repo/)?packages/tooling/tool/cli/src/commands/Cache/Cache\.experiment\.ts$''']

[[allowlists]]
description = "Vendored subtrees (openclaw, effect) contain upstream docs and test fixtures with placeholder secrets"
paths = [
  '''^\.repos/openclaw/.*$''',
  '''^\.repos/effect/.*$''',
]

[[allowlists]]
description = "Venice OpenAPI operation id is not a secret"
regexes = [
  '''getApiKeyGenerateWeb3Key''',
]

[[allowlists]]
description = "CauseRedaction is a secret-redaction helper; its JSDoc @example blocks and tests intentionally contain placeholder secret-shaped strings (sk-/token=/API_KEY=) to demonstrate redaction. These are not real secrets. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path like evil/packages/.../CauseRedaction.ts cannot inherit the allowlist."
paths = [
  '''^(?:/repo/)?packages/foundation/capability/observability/src/CauseRedaction\.ts$''',
  '''^(?:/repo/)?packages/foundation/capability/observability/test/CauseRedaction\.test\.ts$''',
]

[[allowlists]]
description = "law-practice slice test fixtures are synthetic/public-only by mandate (privilege wall: a fixture is never a real client matter). Synthetic fixture keys such as \"rejection.102\" (a §102 rejection key) trip the generic-api-key entropy heuristic but are not secrets."
paths = [
  '''(^|/)packages/law-practice/[^/]+/test/.*$''',
]

[[allowlists]]
description = "@beep/data generated dataset modules are machine-generated by `bun run beep sync-data-to-ts` from public official registries (IANA media types, IANA tzdb, Unicode CLDR, ISO 4217). Long technical identifiers in these public datasets trip the generic-api-key entropy heuristic but are not secrets. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path cannot inherit the allowlist."
paths = [
  '''^(?:/repo/)?packages/foundation/primitive/data/src/generated/.*$''',
]

[[allowlists]]
description = "Gold-intake provenance ledgers (research/SOURCES.md under explorations/ and goals/) curate mined code snippets and crypto/token-format references (Fernet, PASETO, iron-webcrypto, @noble/ciphers, etc.). Long technical identifiers in these curated reference lists trip the generic-api-key entropy heuristic but are not secrets. Anchored at the repo root (with an optional /repo/ CI-mount prefix) so a nested attacker-controlled path cannot inherit the allowlist. Path/rule allowlist (survives squash-merge), replacing the earlier commit-fingerprint entry."
targetRules = ["generic-api-key"]
paths = [
  '''^(?:/repo/)?explorations/[^/]+/research/SOURCES\.md$''',
  '''^(?:/repo/)?goals/[^/]+/research/SOURCES\.md$''',
]

[[allowlists]]
description = "The packet-system redesign's immutable Firecrawl transcript mentions Sourcegraph once alongside public Git commit hashes. The Sourcegraph detector treats any 40-hex token in the same JSONL record as a candidate even though the record contains no sgp_ token prefix."
targetRules = ["sourcegraph-access-token"]
paths = [
  '''^(?:/repo/)?explorations/packet-system-redesign/research/grok/raw/2-agent-plan-gates\.jsonl$''',
]

# Immutable Boolean-creep evidence: independently reproduced SHA-256 values
# and one ordinary-prose match. Require exact path AND complete known line.
# Per-rule syntax also supports Gitleaks 8.24.3.
# These three entries extend default rules without replacing their detectors.

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "beep-ci-ops auditor run records (hypotheses, analyses, proposals, reviews, dockets, the archived dispositions index) quote validator config facts verbatim; the config_key_value predicate name trips this rule's keyword prefilter on admission journal fields already committed in the corpus pins (nonce and attemptId UUIDs, _tag=admission-<event>, <event>AtMillis epoch stamps). The records are digest-bound (review chain_sha256) and cannot be reworded. Scoped to this rule and these trees, and only to findings whose matched secret is exactly one of those field shapes; any other secret on the same line still fires, and every other detector still scans the trees."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^(?:/repo/)?explorations/beep-ci-operational-ontology/ontology/extraction/s4/beep-ci-ops/work/(?:hypotheses|foundational|alternative|proposals|sittings|review-audit|denotation-batches)/[^/]+$''',
  '''^(?:/repo/)?explorations/beep-ci-operational-ontology/ontology/extraction/s4/beep-ci-ops/work-run3/impl-report\.md$''',
  '''^(?:/repo/)?explorations/beep-ci-operational-ontology/ontology/extraction/s4/beep-ci-ops/runs/orun-[^/]+\.(?:index|manifest)\.yaml$''',
  '''^(?:/repo/)?explorations/beep-ci-operational-ontology/ontology/extraction/s4/archives/beep-ci-ops/orun-[^/]+\.(?:observations|work)/.*$''',
]
regexes = [
  '''^(?:nonce|attemptId)=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  '''^_tag=admission-[a-z-]+$''',
  '''^[A-Za-z]+AtMillis=[0-9]{13}$''',
]

[[rules.allowlists]]
description = "Verified immutable Boolean-creep digest false positives; exact path and line only."
condition = "AND"
regexTarget = "line"
paths = ['''^(?:/repo/)?goals/boolean-creep/data/r28-agent-app-integration\.json$''']
regexes = [
  '''^\n?[\t ]*"r3-apps-desktop-shell-rpc-access": "cf7f92ffc986a815e5d415b86729eb1c6ac32182b72b10aa37a1a4e00c4cfd4e"$''',
]

[[rules.allowlists]]
description = "Verified immutable Boolean-creep prose false positives; exact path and line only."
condition = "AND"
regexTarget = "line"
