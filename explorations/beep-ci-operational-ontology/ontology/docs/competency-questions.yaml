# beep-ci-ops — competency questions (S2 v2, post-grill application pass 2026-08-27)
# Admission law (TWO-KIND, capped — final-grill round 2): a term enters the T-Box as a
# DECISION TERM (a Must/Should CQ requires it) OR a SEMANTIC-SUPPORT TERM (required to
# define/constrain/disambiguate a NAMED decision term through a checkable dependency;
# recorded as `supports=` in the pre-glossary notes, validator-reachable from CQ roots).
# This suite is the ontology's acceptance suite; certainty = CQ regression green under
# KGCL-managed evolution.
# Terminology (final-grill round 1): VerificationEvidence (vernacular altLabel "proof"),
# AssuranceTier (vernacular altLabel "certainty tier"), OperationalChangeEvent
# (vernacular altLabel "control intervention"). Vernacular survives in prose/NL; the
# ontology TERM is the reasoner-facing name.
# Prefix: ciops: <https://oip.law/ontology/ci-ops#> (namespace settled by operator
# ruling 2026-08-27 — see DECISIONS.md; the TERM SET still ratifies at S8)
#
# PARAMETER-BINDING CONVENTION (round-1 repair; hardened round 2 after seat E's
# executed counterexamples): a CQ whose natural language says "a given X" is
# PARAMETERIZED. Its query carries VALUES block(s) holding example individuals, each
# marked "# harness binds"; at execution the harness replaces EVERY marked block's rows
# with the caller's actual values. RULES: (1) ONE ROW ONLY — the harness substitutes
# exactly one parameter tuple per invocation; batching multiple givens into one VALUES
# is FORBIDDEN (seat E proved it merges aggregate answers and collapses ASK results);
# (2) datatypes are preserved — parameters are RDF terms, and typed literals (e.g.
# xsd:dateTime) must be substituted WITH their datatype or FILTER comparisons silently
# drop solutions; (3) when a query contains multiple marked blocks (e.g. CQ-012's
# subquery), the harness substitutes the SAME tuple into all of them. A VALUES block
# NOT marked "# harness binds" (e.g. CQ-008's grant-state restriction) is a fixed
# domain restriction, never replaced. The committed rows double as seeded-A-Box smoke
# inputs.

- id: CQ-001
  source_use_case: UC-001
  natural_language: "What verification lanes exist, and of what kind is each (turbo task, script, collected gate)?"
  type: enumerative
  priority: must_have
  sample_answer:
    - lane: ciops:LaneBuild
      kind: ciops:TurboTaskLane
    - lane: ciops:LaneCheapGates
      kind: ciops:CollectedGateLane
  derivation_method: direct_lookup
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?lane ?kind WHERE {
      ?lane rdf:type ciops:VerificationLane ;
            ciops:hasLaneKind ?kind .
    }
  expected_result: non_empty
  required_classes: [VerificationLane, LaneKind]
  required_properties: [hasLaneKind]

- id: CQ-002
  source_use_case: UC-001
  natural_language: "Which WorkUnits (lane x scope) are admissible for a given episode's diff and target tier?"
  type: relational
  priority: must_have
  sample_answer:
    - workUnit: "ciops:wu-lint-affected-from-main"
      lane: "ciops:LaneLint"
      tier: ciops:TierLocalFullProof
  derivation_method: inference
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?workUnit ?lane ?tier WHERE {
      VALUES ?episode { ciops:ep-example }  # harness binds
      ?workUnit rdf:type ciops:WorkUnit ;
                ciops:admissibleFor ?episode ;
                ciops:executesLane ?lane .
      ?episode ciops:targetsTier ?tier .
      ?tier ciops:requiresLane ?lane .
    }
  expected_result: non_empty
  required_classes: [WorkUnit, VerificationEpisode, AssuranceTier]
  required_properties: [admissibleFor, executesLane, targetsTier, requiresLane]

- id: CQ-003
  source_use_case: UC-001
  natural_language: "What is the measured cost estimate (P50/P95 wall ms, memory class, provenance) of a WorkUnit?"
  type: quantitative
  priority: must_have
  sample_answer:
    - workUnit: "ciops:wu-test-schema"
      p50Ms: 143000
      provenance: measured
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?workUnit ?p50 ?p95 ?mem ?prov WHERE {
      ?workUnit ciops:hasCostEstimate ?c .
      ?c ciops:p50Ms ?p50 ; ciops:p95Ms ?p95 ;
         ciops:hasMemoryClass ?mem ; ciops:hasCostProvenance ?prov .
    }
  expected_result: non_empty
  required_classes: [CostEstimate, MemoryClass, CostProvenance]
  required_properties: [hasCostEstimate, p50Ms, p95Ms, hasMemoryClass, hasCostProvenance]

- id: CQ-004
  source_use_case: UC-001
  natural_language: "Which packages are affected by a given change set via dependency closure (touched packages included)? Hash-surface radiation is CQ-011's question."
  type: relational
  priority: must_have
  sample_answer:
    - package: "ciops:pkg-beep-schema"
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT DISTINCT ?pkg WHERE {
      VALUES ?change { ciops:cs-example }  # harness binds
      {
        ?change ciops:touchesPackage ?pkg .
      }
      UNION
      {
        ?change ciops:touchesPackage ?touched .
        ?pkg ciops:dependsOnTransitive ?touched .
      }
    }
  expected_result: non_empty
  required_classes: [ChangeSet, PackageRef]
  required_properties: [touchesPackage, dependsOnTransitive]
  notes: "dependsOnTransitive is the Datalog fixpoint over dependsOn — the closed-world transitive closure OWL RL cannot enumerate natively; rule-compiled per the reasoning-stack ruling. Touched packages are affected by definition (round-1 seat A repair). Round-2 seat E repair (Oxigraph-proven): the previous BIND(?touched AS ?pkg) arm evaluated bottom-up without the outer solution mapping and returned UNBOUND rows — the touched pattern is now repeated inside each UNION arm."

- id: CQ-005
  source_use_case: UC-003
  natural_language: "Which verification evidence records (vernacular: proofs) remain valid for a given tree state and cache epoch?"
  type: relational
  priority: must_have
  sample_answer:
    - proof: "ciops:proof-build-abc123"
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?proof WHERE {
      VALUES (?tree ?epoch) { (ciops:tree-example ciops:epoch-example) }  # harness binds
      ?proof ciops:validInEpoch ?epoch ;
             ciops:provesTree ?tree .
      FILTER NOT EXISTS { ?event ciops:invalidates ?proof }
    }
  expected_result: non_empty
  required_classes: [VerificationEvidence, CacheEpoch, TreeState, InvalidationEvent]
  required_properties: [validInEpoch, provesTree, invalidates]

- id: CQ-006
  source_use_case: UC-004
  natural_language: "For a given tree state and cache epoch, which lane obligations remain unmet toward a given target assurance tier (vernacular: certainty tier)? (Held tier = the highest tier whose remainder is empty, computed by evaluating this query per tier — documented external iteration.)"
  type: relational
  priority: must_have
  sample_answer:
    - missing: "ciops:LaneFullPrePush"
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?lane WHERE {
      VALUES (?target ?tree ?epoch) { (ciops:TierCiMergeGreen ciops:tree-example ciops:epoch-example) }  # harness binds
      ?target ciops:requiresLane ?lane .
      FILTER NOT EXISTS {
        ?proof ciops:dischargesObligation ?lane ;
               ciops:provesTree ?tree ;
               ciops:validInEpoch ?epoch .
        FILTER NOT EXISTS { ?event ciops:invalidates ?proof }
      }
    }
  expected_result: non_empty
  required_classes: [AssuranceTier, VerificationEvidence, TreeState, CacheEpoch]
  required_properties: [requiresLane, dischargesObligation, provesTree, validInEpoch, invalidates]
  notes: "Obligation discharge is now correlated to the GIVEN tree x epoch (round-1 seat A: any-tree proofs previously suppressed obligations). Round-2 seat E repair (Oxigraph-proven): an INVALIDATED proof could still discharge — the inner pattern now excludes proofs with an invalidates edge, aligning with CQ-005's validity semantics. S6 completeness precondition (seat D, Won't-IDE audit): a VerificationEvidence may dischargesObligation ONLY when produced by an in-scope VerificationLane execution — SHACL-enforced at S6 so out-of-scope greens cannot close obligations. S4 normalization mandate (final grill): the tier→lane obligation (requiresLane) conflates VerificationObligation with procedure — the obligation/procedure split is worksheet-decided at S4."

- id: CQ-007
  source_use_case: UC-005
  natural_language: "For a given episode, what is the time-to-certainty and its decomposition into queue wait, lock wait, execution, repair gap, and CI wait?"
  type: quantitative
  priority: must_have
  sample_answer:
    - episode: "ciops:ep-2026-08-13-committed-idea"
      totalMs: 630000
      queueWaitMs: 45000
      lockWaitMs: 120000
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?ep ?total ?queue ?lock ?exec ?repair ?ci WHERE {
      VALUES ?ep { ciops:ep-example }  # harness binds
      ?ep ciops:timeToCertaintyMs ?total ;
          ciops:queueWaitMs ?queue ;
          ciops:lockWaitMs ?lock ; ciops:executionMs ?exec ;
          ciops:repairGapMs ?repair ; ciops:ciWaitMs ?ci .
    }
  expected_result: non_empty
  required_classes: [VerificationEpisode]
  required_properties: [timeToCertaintyMs, queueWaitMs, lockWaitMs, executionMs, repairGapMs, ciWaitMs]
  notes: "Round-1 repairs (seat A): queue wait was in the NL but absent from query and glossary — queueWaitMs admitted (this Must CQ requires it; also closes seat D's queue-wait-vanishes KPI game). Derivation relabeled direct_lookup: the decomposition values are MATERIALIZED by the KPI ETL (documented external aggregation); SPARQL reads them."

- id: CQ-008
  source_use_case: UC-002
  natural_language: "Which contended resources exist, and which ACTIVE seat grants currently hold each? (queued waiters are SeatRequests — CQ-021's question, never a grant state)"
  type: relational
  priority: must_have
  sample_answer:
    - resource: ciops:MachineProofLock
      holder: "ciops:grant-beep-effect6-1443"
  derivation_method: direct_lookup
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?res ?grant WHERE {
      ?res rdf:type ciops:ContendedResource .
      ?grant rdf:type ciops:SeatGrant ;
             ciops:contendsFor ?res ;
             ciops:hasGrantState ciops:ActiveGrant .
    }
  expected_result: non_empty
  required_classes: [ContendedResource, SeatGrant, GrantState]
  required_properties: [contendsFor, hasGrantState]
  notes: "Round-3 seat H repair (H-10, Oxigraph-proven): the old query left ?grant untyped and enumerated WaitingGrant, so a bare SeatRequest satisfied the Must grant query and the settled ticket/lease split was prose, not semantics. The holder branch now requires rdf:type SeatGrant and ActiveGrant only; WaitingGrant is REMOVED from the GrantState domain (a waiting contender IS a SeatRequest under the split — the deployed store has no waiting lease record). Regression fixture: cq008-ticket-not-grant.ttl (rows_eq_0)."

- id: CQ-009
  source_use_case: UC-002
  natural_language: "Are any two active origin-keyed admission grants sharing the same origin? (deployed origin-exclusion law; must be zero)"
  type: constraint
  priority: must_have
  sample_answer: []
  derivation_method: inference
  notes: "Round-3 CORRECTION (seats H+J convergent, both source- and Oxigraph-proven): the deployed #870 exclusion is ORIGIN-keyed, never checkout-keyed — originKey derives from the per-origin proof lock (remote.origin.url basename, ProofState.ts proofLockPathForContext), isTicketSkippable blocks admission when ANY lease shares a nonempty originKey (QualityScheduler.ts:614-628, kind-independent), and checkoutRoot is a separate owner attribute with NO uniqueness check. Two full-proofs on different checkouts of one origin are illegal deployed state; the old checkout-joined query returned zero rows on exactly that state. The query now joins on hasOriginKey (verbatim originKey; empty string = origin-exempt, e.g. review-fix, which is only class-capped). This is kind-independent: merged-preview also carries the origin key (seat J U2). occupiesCheckout is REMOVED from the model (no CQ requires it; S4 may re-propose checkoutRoot with a warrant). Regression fixture: cq009-two-grants.ttl (same origin, DIFFERENT checkouts)."
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?g1 ?g2 ?origin WHERE {
      ?g1 rdf:type ciops:SeatGrant ; ciops:hasGrantState ciops:ActiveGrant ;
          ciops:hasOriginKey ?origin .
      ?g2 rdf:type ciops:SeatGrant ; ciops:hasGrantState ciops:ActiveGrant ;
          ciops:hasOriginKey ?origin .
      FILTER (?g1 != ?g2)
      FILTER (?origin != "")
    }
  expected_result: zero_rows
  required_classes: [SeatGrant, GrantState]
  required_properties: [hasOriginKey, hasGrantState]

- id: CQ-010
  source_use_case: UC-002
  natural_language: "Was any WorkUnit admitted whose admission charge exceeded the remaining token capacity at admission? (deployed-policy invariant; must be zero)"
  type: constraint
  priority: must_have
  sample_answer: []
  derivation_method: direct_lookup
  notes: "TRI-SPLIT RESHAPE (final-grill round 2): predictedP95Duration (distribution fact) != AdmissionCharge (policy quantity; deployed carrier = #870 weightTokens) != hard execution limit (guarantee; S7 projection-contract territory, never OWL). The old form compared p95Ms against an invented maxGrantCostMs and called it a Must invariant — a category error. This Must CQ now audits the DEPLOYED charge-vs-capacity invariant: admissionChargeTokens comes from the lease record verbatim; capacityAtAdmissionTokens is ETL-materialized from the admission snapshot at grant time (external-computation precedent). The p95-vs-budget comparison survives as CQ-026, a separately-named Should-level heuristic screen, explicitly non-guarantee. The numeric comparison is a SPARQL FILTER at query level (round-1 relabel retained). Round-3 seat H repairs (Oxigraph-proven): (H-02) plain-string quantities compared lexically and made overruns green — the FILTER now treats a non-numeric datatype as a violation (isNumeric guard; fixture cq010-string-tokens.ttl); (W-06 family) capacityAtAdmissionTokens is PINNED as remaining capacity BEFORE the new charge (the deployed check is activeTokenTotal + weight <= capacityTokens, QualityScheduler.ts:661-663; a post-grant snapshot already includes the new lease in activeTokens and would false-red this CQ — the ETL must reconstruct the pre-grant remainder, never subtract from a post-grant snapshot)."
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?wu ?charge ?capacity WHERE {
      ?wu ciops:admittedBy ?grant .
      ?grant ciops:admissionChargeTokens ?charge ;
             ciops:capacityAtAdmissionTokens ?capacity .
      FILTER ( !isNumeric(?charge) || !isNumeric(?capacity) || ?charge > ?capacity )
    }
  expected_result: zero_rows
  required_classes: [WorkUnit, SeatGrant]
  required_properties: [admittedBy, admissionChargeTokens, capacityAtAdmissionTokens]

- id: CQ-011
  source_use_case: UC-003
  natural_language: "What invalidation events occurred in a window, and what is each one's blast radius (lanes x packages)?"
  type: relational
  priority: must_have
  sample_answer:
    - event: "ciops:ev-biome-bump-2026-08-20"
      lane: ciops:LaneLint
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    SELECT ?event ?lane ?pkg WHERE {
      VALUES (?since ?until) { ("2026-08-01T00:00:00Z"^^xsd:dateTime "2026-08-31T23:59:59Z"^^xsd:dateTime) }  # harness binds
      ?event ciops:occurredAt ?at .
      FILTER (?at >= ?since && ?at <= ?until)
      ?event ciops:touchesHashSurface ?surface .
      ?surface ciops:feedsLane ?lane .
      ?event ciops:radiatesToPackage ?pkg .
    }
  expected_result: non_empty
  required_classes: [InvalidationEvent, HashSurface, VerificationLane, PackageRef]
  required_properties: [touchesHashSurface, feedsLane, radiatesToPackage, occurredAt]
  notes: "Encodes the biome-bump insight: a root tool pin's surface feeds ONLY its lane; global.inputs membership is a HashSurface fact, not fate. Round-1 repair (seat A): the NL's window had no query support — occurredAt (xsd:dateTime on InvalidationEvent) admitted via this Must CQ."

- id: CQ-012
  source_use_case: UC-005
  natural_language: "Within a given window, what fraction of total episode time is queue wait, lock contention, execution, repair, and CI wait? (Shares are void unless decomposedEpisodes = windowEpisodes.)"
  type: quantitative
  priority: must_have
  sample_answer:
    - queueShare: 0.08
      lockShare: 0.17
      execShare: 0.47
      decomposedEpisodes: 23
      windowEpisodes: 23
  derivation_method: aggregation
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    SELECT (SUM(?queue)/SUM(?total) AS ?queueShare)
           (SUM(?lock)/SUM(?total) AS ?lockShare)
           (SUM(?exec)/SUM(?total) AS ?execShare)
           (SUM(?repair)/SUM(?total) AS ?repairShare)
           (SUM(?ci)/SUM(?total) AS ?ciShare)
           (SUM(?total) AS ?grandTotalMs)
           (COUNT(?ep) AS ?decomposedEpisodes)
           (MAX(?windowN) AS ?windowEpisodes) WHERE {
      VALUES (?since ?until) { ("2026-08-01T00:00:00Z"^^xsd:dateTime "2026-08-31T23:59:59Z"^^xsd:dateTime) }  # harness binds
      {
        SELECT (COUNT(?ep2) AS ?windowN) WHERE {
          VALUES (?since2 ?until2) { ("2026-08-01T00:00:00Z"^^xsd:dateTime "2026-08-31T23:59:59Z"^^xsd:dateTime) }  # harness binds
          ?ep2 ciops:episodeStartedAt ?at2 .
          FILTER (?at2 >= ?since2 && ?at2 <= ?until2)
        }
      }
      ?ep ciops:episodeStartedAt ?at .
      FILTER (?at >= ?since && ?at <= ?until)
      ?ep ciops:queueWaitMs ?queue ;
          ciops:lockWaitMs ?lock ; ciops:executionMs ?exec ;
          ciops:repairGapMs ?repair ; ciops:ciWaitMs ?ci ;
          ciops:timeToCertaintyMs ?total .
    }
    HAVING (SUM(?total) > 0)
  expected_result: non_empty
  required_classes: [VerificationEpisode]
  required_properties: [queueWaitMs, lockWaitMs, executionMs, repairGapMs, ciWaitMs, timeToCertaintyMs, episodeStartedAt]
  notes: "Round-1 repair (seat A): window + in-query shares; episodeStartedAt admitted for window membership. Round-2 repairs: (seat G) queueWaitMs — the property admitted to close the queue-wait game — is now IN the attribution instrument, decisive post-#870 where queue replaces bounce; (seat E, Oxigraph-proven) partially decomposed episodes silently vanished from every sum, so the query now reports decomposedEpisodes vs windowEpisodes (subquery with its own harness-bound window per the multi-block convention) and the harness FAILS the run when they differ; HAVING SUM(?total) > 0 kills the all-unbound zero-denominator row. One-row binding contract prevents cross-window merging."

- id: CQ-013
  source_use_case: UC-005
  natural_language: "Which failure signatures most delay certainty (ranked by attributed delay), and which lane surfaces each signature cheapest? (Cheapest = earliest under the ascending-cost execution order.)"
  type: relational
  priority: must_have
  sample_answer:
    - signature: "ciops:sig-full-pre-push-step-exit"
      attributedDelayMs: 5400000
      cheapestLane: ciops:LaneCheapGates
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?sig ?delay ?lane ?p50 WHERE {
      ?sig ciops:attributedDelayMs ?delay .
      OPTIONAL {
        ?sig ciops:surfacedByLane ?lane .
        ?lane ciops:hasCostEstimate ?c . ?c ciops:p50Ms ?p50 .
        FILTER NOT EXISTS {
          ?sig ciops:surfacedByLane ?lane2 .
          ?lane2 ciops:hasCostEstimate ?c2 . ?c2 ciops:p50Ms ?p502 .
          FILTER (?p502 < ?p50)
        }
      }
    } ORDER BY DESC(?delay)
  expected_result: non_empty
  required_classes: [FailureSignature, VerificationLane]
  required_properties: [surfacedByLane, attributedDelayMs, hasCostEstimate, p50Ms]
  notes: "Round-1 repair (seat A): the old MIN-per-group neither ranked by delay nor selected a lane. attributedDelayMs (data property on FailureSignature, computed by the KPI ETL — external-computation boundary like estimatedFailureProbability) admitted via this Must CQ; the cheapest surfacing lane is selected in-query (ties: all minimal lanes survive, set-valued argmin — seat E verified). Round-2 seat E repair (Oxigraph-proven): the lane join is now OPTIONAL so a delayed signature with NO surfacing lane appears with unbound ?lane — the strongest coverage hole is visible instead of silently excluded. Round-3 seat H (H-11): the argmin's inner NOT-EXISTS also assumes every candidate lane's estimate carries p50Ms — that predicate is now DECLARED CLOSED in closed-world.yaml (census/default provenance fills, an estimate without a P50 violates the ingestion contract; SHACL-shaped at S6). HONEST FLAG (seat G): the NL was rewritten in the same round-1 pass that minted attributedDelayMs — mild retroactive-CQ per the ORSD hazard; S5 must ratify or strike this term explicitly. The full projection-ordering question is now CQ-020 (final-grill admission)."

- id: CQ-014
  source_use_case: UC-003
  natural_language: "When did a given tree state's current cache epoch begin, relative to its held proofs?"
  type: temporal
  priority: should_have
  sample_answer:
    - epoch: "ciops:epoch-abc"
      beganAt: "2026-08-27T09:00:00Z"
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?epoch ?began ?proof ?provedAt WHERE {
      VALUES ?tree { ciops:tree-example }  # harness binds
      ?tree ciops:hasCurrentEpoch ?epoch .
      ?epoch ciops:beganAt ?began .
      ?proof ciops:validInEpoch ?epoch ; ciops:recordedAt ?provedAt .
    }
  expected_result: non_empty
  required_classes: [CacheEpoch, VerificationEvidence, TreeState]
  required_properties: [beganAt, recordedAt, hasCurrentEpoch]
  notes: "Round-1 repair (seat A): the old query joined EVERY epoch to its proofs with no branch criterion — hasCurrentEpoch (TreeState -> CacheEpoch) admitted via this Should CQ to make 'current' queryable."

- id: CQ-015
  source_use_case: UC-004
  natural_language: "Is a given proof transferable to another checkout (same epoch, shared cache) so one agent's green licenses another's skip?"
  type: boolean
  priority: should_have
  sample_answer:
    - transferable: true
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    ASK {
      VALUES (?proof ?other) { (ciops:proof-example ciops:checkout-example) }  # harness binds
      ?proof ciops:validInEpoch ?epoch ; ciops:cachedIn ?cache .
      ?other ciops:mountsCache ?cache ; ciops:inEpoch ?epoch .
    }
  expected_result: boolean
  required_classes: [VerificationEvidence, Checkout, SharedCache]
  required_properties: [cachedIn, mountsCache, inEpoch]
  notes: "Round-1 repair (seat A): both the proof and the target checkout are caller-bound givens; the caller supplies a checkout other than the proof's origin (origin-checkout modeling deferred — no term admitted without a CQ needing it). Partner-review caveat (B11, verified against turbo.json): same-epoch + shared-cache is NECESSARY, not sufficient — turbo task validity keys on declared task-input/hash surfaces (global.inputs + per-task inputs). CacheEpoch identity must be pinned at task-hash granularity during S4/S5, or this ASK overclaims and licenses unsafe skips. Round-2 seat E: expected_result 'boolean' checks TYPE only — the fixture harness must assert the VALUE against both a transferable seed (true) and a non-transferable seed (false); a type-only oracle passes any legal ASK."

- id: CQ-016
  source_use_case: UC-005
  natural_language: "For each tagged operational change event (vernacular: control intervention), when did it land — the KPI-series partition point? (Before/after KPI distributions are computed by the ETL over episodes partitioned at landedAt; the ontology supplies the partition points.)"
  type: quantitative
  priority: should_have
  sample_answer:
    - intervention: "ciops:iv-shared-turbo-cache"
      landedAt: "2026-08-20T00:00:00Z"
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?iv ?landedAt WHERE {
      ?iv a ciops:OperationalChangeEvent ; ciops:landedAt ?landedAt .
    }
  expected_result: non_empty
  required_classes: [OperationalChangeEvent]
  required_properties: [landedAt]
  notes: "Round-1 repair (seat A): the NL previously promised the distributions themselves and the sample carried unbindable p50Before/AfterMs — reshaped so the CQ asks exactly what the query answers, with the ETL boundary documented (external-computation precedent). Final-grill round 3 (observational naming): class renamed OperationalChangeEvent — OBSERVATIONAL by default; causal ControlIntervention status requires supporting design (paired pre/post evidence + adoption census), never the mere fact of landing. 'Control intervention' survives as DECISIONS vernacular / altLabel. Wall-clock landedAt is the partition point, but INTERVENTION MEMBERSHIP is adoption-qualified (HEAD ancestry), per kpi-measurement-rules.md."

- id: CQ-017
  source_use_case: UC-004
  natural_language: "Which lane obligations are required for CI-merge assurance but not local-full assurance, and vice versa (the asymmetry map)?"
  type: relational
  priority: should_have
  sample_answer:
    - lane: "ciops:LaneSecretScanBaseRef"
      onlyIn: ciops:TierCiMergeGreen
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?lane ?onlyIn WHERE {
      {
        ciops:TierCiMergeGreen ciops:requiresLane ?lane .
        FILTER NOT EXISTS { ciops:TierLocalFullProof ciops:requiresLane ?lane }
        BIND(ciops:TierCiMergeGreen AS ?onlyIn)
      }
      UNION
      {
        ciops:TierLocalFullProof ciops:requiresLane ?lane .
        FILTER NOT EXISTS { ciops:TierCiMergeGreen ciops:requiresLane ?lane }
        BIND(ciops:TierLocalFullProof AS ?onlyIn)
      }
    }
  expected_result: non_empty
  notes: "Round-1 repair (seat A): the old query implemented only the CI-minus-local half and never bound onlyIn — both directions of the asymmetry map now project."
  required_classes: [AssuranceTier, VerificationLane]
  required_properties: [requiresLane]

- id: CQ-018
  source_use_case: UC-001
