      failureProbability: 0.62
  derivation_method: external_join
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?wu ?p WHERE {
      ?wu ciops:estimatedFailureProbability ?p .
    }
  expected_result: non_empty
  required_classes: [WorkUnit]
  required_properties: []
  notes: "Expressivity boundary (scope.md): the probability is COMPUTED by the external cost model and stored as a data property; OWL never infers it. Round-3 (seats H+I convergent, I-03/H-09): a could_have CQ licenses NO T-Box term under the two-kind law — estimatedFailureProbability is DEFERRED (removed from required_properties and the pre-glossary) until this CQ is promoted to Must/Should by a real scheduling decision that consumes the probability. The sparql sketch stays as design intent only."

- id: CQ-019
  source_use_case: UC-003
  natural_language: "Does any subject trust the affected set of a fail-open computation — and does any verification evidence or schedule proposal carry a narrowed scope (materialized OR derived through its steps' WorkUnits) without scope provenance, or a provenance edge pointing at a non-computation? (must be zero on all arms)"
  type: constraint
  priority: must_have
  sample_answer: []
  derivation_method: inference
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?subject ?violation WHERE {
      {
        ?computation ciops:hasAffectedOutcome ?failureMode .
        ?failureMode a ciops:FailOpenOutcome .
        ?subject ciops:scopedByComputation ?computation .
        BIND("fail-open-trust" AS ?violation)
      }
      UNION
      {
        VALUES ?stype { ciops:VerificationEvidence ciops:ScheduleProposal }
        ?subject a ?stype ; ciops:hasScope ?scope .
        FILTER (?scope != ciops:FullRepoScope)
        FILTER NOT EXISTS { ?subject ciops:scopedByComputation ?comp }
        BIND("scope-provenance-gap" AS ?violation)
      }
      UNION
      {
        ?subject a ciops:ScheduleProposal ; ciops:hasStep ?st .
        ?st ciops:schedulesWorkUnit ?swu .
        ?swu ciops:hasScope ?sscope .
        FILTER (?sscope != ciops:FullRepoScope)
        FILTER NOT EXISTS { ?subject ciops:scopedByComputation ?c2 }
        BIND("derived-scope-provenance-gap" AS ?violation)
      }
      UNION
      {
        ?subject a ciops:ScheduleProposal ; ciops:hasStep ?taggedStep .
        ?taggedStep ciops:schedulesSeatRequest ?seatRequest ; ciops:hasScopeTag ?scopeTag .
        FILTER (isLiteral(?scopeTag))
        FILTER NOT EXISTS { ?subject ciops:scopedByComputation ?c3 }
        BIND("step-scope-provenance-gap" AS ?violation)
      }
      UNION
      {
        ?subject ciops:scopedByComputation ?target .
        FILTER NOT EXISTS { ?target ciops:hasAffectedOutcome ?outcome }
        BIND("dangling-provenance-target" AS ?violation)
      }
    }
  expected_result: zero_rows
  required_classes: [AffectedComputation, FailOpenOutcome, VerificationEvidence, ScheduleProposal, Scope]
  required_properties: [hasAffectedOutcome, scopedByComputation, hasScope]
  notes: "Added 2026-08-27 from R4-deep contrarian finding 3: turbo affected reasons are typed (__typename) and several are fail-open (select the whole graph). Round-1 repairs (seats A + D): (1) NL reshaped to the constraint clauses only — the fail-open INVENTORY is the diagnostic obtained by dropping the ?subject clause, not part of this test; (2) scopedByComputation DEFINED as 'trusts the affected set of' — an honest fail-open response (epoch-invalidating FullRepoScope re-verification) does NOT carry scopedByComputation and therefore stays green. APPLICATION PASS (final-grill Q2): hasScope + ScheduleProposal are ADMITTED, so seat G's CLOSED SCOPE-PROVENANCE is now EXECUTABLE — arm 1 catches any subject trusting a fail-open set; arm 2 catches a typed VerificationEvidence/ScheduleProposal whose scope is narrower than FullRepoScope with NO scopedByComputation edge (the laundering seat G proved the round-1 letter permitted). hasScope is DERIVED FROM THE SUBJECT'S WORKUNITS' SCOPES at ingestion, never from the trust edge; every AffectedComputation carries a typed outcome from the closed pair FailOpenOutcome/FailClosedOutcome (FailClosedOutcome is a semantic-support term). Arm 2's negation runs under the closed-world declaration for scopedByComputation (closed-world.yaml). The schedule half is no longer unenforced. BIND-in-UNION-arm is legal here (each BIND references only constants — the round-2 CQ-004 bug pattern needed the OUTER solution mapping; Oxigraph-verified by the suite run). ROUND-3 seat H repairs (all Oxigraph-proven): (H-01) arm 3 added — a ScheduleProposal whose STEPS schedule narrowed WorkUnits is caught even when the materialized proposal-level hasScope edge was omitted (the derived-edge laundering hole; fixture cq019-derived-scope-gap.ttl); (W-01) the NL's first clause is universal again — arm 1 deliberately catches ANY subject trusting fail-open, matching the round-2 no-type-guard disposition; (W-02) arm 4 added — a scopedByComputation edge whose target carries no typed outcome is itself a violation (dangling-provenance laundering; fixture cq019-dangling-target.ttl), running under closed hasAffectedOutcome (closed-world.yaml). 2026-09-03 step-shape correction: arm 5 additionally covers a ScheduleProposal whose hasStep-reached ScheduleStep schedules a SeatRequest and carries a literal hasScopeTag but lacks scopedByComputation (fixture cq019-step-scope-gap.ttl)."

- id: CQ-020
  source_use_case: UC-001
  natural_language: "For a given episode, what ordered SeatRequest sequence does its CURRENT schedule proposal prescribe under its governing projection specification, and what scope tag does each step carry?"
  type: relational
  priority: must_have
  sample_answer:
    - proposal: "ciops:sp-2026-08-27-1443"
      spec: "ciops:aps-v1"
      step: "ciops:st-1"
      idx: 1
      req: "ciops:req-lint-affected-from-main"
      scope: "admission"
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?proposal ?spec ?step ?idx ?req ?scope WHERE {
      VALUES ?ep { ciops:ep-example }  # harness binds
      ?ep ciops:hasCurrentProposal ?proposal .
      ?proposal a ciops:ScheduleProposal ; ciops:hasProjectionSpecification ?spec ; ciops:hasStep ?step .
      ?spec a ciops:AdmissionProjectionSpecification .
      ?step ciops:stepIndex ?idx ; ciops:schedulesSeatRequest ?req ; ciops:hasScopeTag ?scope .
      ?req a ciops:SeatRequest .
    } ORDER BY ?idx
  expected_result: non_empty
  required_classes: [ScheduleProposal, ScheduleStep, SeatRequest, VerificationEpisode, AdmissionProjectionSpecification]
  required_properties: [hasCurrentProposal, hasProjectionSpecification, hasStep, stepIndex, schedulesSeatRequest, hasScopeTag]
  notes: "Final-grill Q1/Q2 admission (projection-ordering Must CQ + schedule-as-A-Box). The projection's OUTPUT becomes A-Box: an emitted ScheduleProposal records the ordered WorkUnits with per-step scope, making the schedule auditable by CQ (this query) and governable by CQ-019's closed scope-provenance. direct_lookup: ordering is COMPUTED by the deterministic S7 projection (NFR-1) and materialized; SPARQL reads it — OWL never computes the order. Round-3 seat H repair (H-03, Oxigraph-proven): the old query matched EVERY proposal ever emitted for the episode and merged their step sequences without projecting the proposal — 'current' was unqueryable. hasCurrentProposal (VerificationEpisode -> ScheduleProposal; the hasCurrentEpoch precedent) makes currency queryable; the projection re-points it when a new proposal supersedes; ?proposal is projected so no cross-proposal merge can hide. proposedFor was REMOVED (no CQ requires the inverse edge). Run-2 amendment (2026-09-03, steward-sanctioned at sittings 1 and 3, applied post-merge because the run manifest pinned the suite digest): schedulesWorkUnit -> schedulesSeatRequest (the journal grounds SeatRequest identity, not WorkUnitSpecification — the admittedBy finding class); scope moved to the STEP as a literal tag matching the deployed S7 emission; the governing AdmissionProjectionSpecification is now required, licensing the run-3 re-proposal of the withdrawn ordering cluster (ScheduleStep and its relations ratify together at run 3). 2026-09-03 no-punning correction: ciops:hasScope remains the object property for Scope individuals; ciops:hasScopeTag is the step's literal tag mirroring the deployed emission; run 3 reconciles the provisional ciops-prov:hasScope spelling."

- id: CQ-021
  source_use_case: UC-002
  natural_language: "Which seat requests are queued for admission — with what work kind, priority class, admission charge, enqueue time — and which agent owns each?"
  type: relational
  priority: must_have
  sample_answer:
    - req: "ciops:req-2026-08-27-full-proof"
      agent: "ciops:agent-beep-effect8"
      kind: ciops:FullProofWork
      priority: ciops:VerifyPriority
      charge: 3
  derivation_method: direct_lookup
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?req ?agent ?kind ?priority ?charge ?enqueuedAt WHERE {
      ?req rdf:type ciops:SeatRequest ;
           ciops:requestedBy ?agent ;
           ciops:hasWorkKind ?kind ;
           ciops:hasPriorityClass ?priority ;
           ciops:admissionChargeTokens ?charge ;
           ciops:enqueuedAt ?enqueuedAt .
    }
  expected_result: non_empty
  required_classes: [SeatRequest, Agent, AdmissionWorkKind, AdmissionPriorityClass]
  required_properties: [requestedBy, hasWorkKind, hasPriorityClass, admissionChargeTokens, enqueuedAt]
  notes: "Final-grill Q1 admission (seat-queue Must CQ). DEPLOYED carriers, extracted never invented: SeatRequest = YeetAdmissionTicket (yeet-admission-ticket/v1; enqueuedAtMillis -> enqueuedAt xsd:dateTime, ETL-converted), admissionChargeTokens = weightTokens verbatim (the tri-split's AdmissionCharge carrier: full-proof 3, merged-preview 5, review-fix 1, publish 1 per admissionTokenWeight — the 'one token ~ 5 GiB' gloss is the DEFAULT slotSizeGib in a capacity formula that also subtracts reserveGib and hard-floors, never a per-token physical measurement [seat J W1]; the publish kind is RESERVED and UNUSED by deployed callers — a publish's embedded proof requests full-proof at publish priority [seat J W4]), work kind / priority = the deployed AdmissionWorkKind/AdmissionPriority LiteralKits (closed domains; see literal-domains.md). This admits Agent + SeatRequest as decision terms, closing the round-0 admission-law warns; Agent identity is PROCESS-grain (pid+procStart+checkoutRoot — many invocations of one coding agent are distinct pairs [seat J N4]). ROUND-3 CORRECTION (seats H+J convergent, H-05/J-B4 — proven against the running scheduler): there is NO stored ticket->lease edge — admission COPIES owner fields into the lease, DELETES the ticket file, and the lease body carries neither nonce nor enqueuedAtMillis (linkage survives only in the lease FILENAME stem nonce-pid); ticket and lease never coexist in an atomic store snapshot. The invented grantedFrom edge and its NOT-EXISTS are REMOVED: an ingested SeatRequest IS a queued ticket (the store's own semantics), so the query needs no granted-exclusion. Granted-wait history is NOT promised from the live store (self-erasing handoff — recorded as a measurement limitation in kpi-measurement-rules.md and as a candidate scheduler improvement). The ticket/lease record split is the ruled SeatRequest/SeatGrant split — S4 worksheet refines, the split itself is settled."

- id: CQ-022
  source_use_case: UC-002
  natural_language: "Which in-flight WorkUnit executions does a given committed failure obsolete, and is each a clean or dirty cancel candidate?"
  type: relational
  priority: must_have
  sample_answer:
    - exec: "ciops:exec-lint-run-1"
      cancelClass: ciops:CleanCancel
  derivation_method: inference
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?exec ?cancelClass WHERE {
      VALUES ?failure { ciops:fail-example }  # harness binds
      ?failure rdf:type ciops:CommittedFailure ; ciops:inAttempt ?attempt .
      ?exec rdf:type ciops:WorkUnitExecution ;
            ciops:inAttempt ?attempt ;
            ciops:hasExecutionState ciops:RunningExecution ;
            ciops:hasCancelClass ?cancelClass .
    }
  expected_result: non_empty
  required_classes: [CommittedFailure, WorkUnitExecution, VerificationAttempt, ExecutionState, CancelClass]
  required_properties: [inAttempt, hasExecutionState, hasCancelClass]
  notes: "Final-grill Q1 admission (stopping Must CQ). Obsoletion is STRUCTURAL: once a failure commits in an attempt, every still-running execution OF THAT ATTEMPT can no longer improve its verdict — the query derives the cancel-candidate set; S7's stopping rule consumes it. ROUND-3 seat H repair (H-06, Oxigraph-proven): the old query joined failure and execution only through the EPISODE, and an episode is a multi-attempt red streak — a healthy retry in attempt 2 was returned as a cancel candidate because attempt 1 had failed. VerificationAttempt is admitted (carrier: attemptId UUID on yeet-attempt-journal/v1 events) with inAttempt on both CommittedFailure and WorkUnitExecution; the join is now attempt-scoped (regression fixture cq022-cross-attempt.ttl, rows_eq_0). failsEpisode/servesEpisode were REMOVED (no CQ requires them post-repair; attempt->episode membership is ETL bookkeeping until a CQ needs the edge). Carrier precision (seat J W3): the committed-failure signal is verdict.failedStepId NESTED in the attempt-finished event — optional, on the verdict record, NOT a journal step record. CancelClass is the clean/dirty split from the ruling: CleanCancel = interruption leaves no corrupt state (read-only verification lanes); DirtyCancel = mutating executions (e.g. publish phases) that must drain. WorkUnitExecution vs WorkUnit is the ruled spec/execution split. ExecutionState/CancelClass are closed domains (literal-domains.md)."

- id: CQ-023
  source_use_case: UC-002
  natural_language: "Is any seat request waiting beyond its policy's declared starvation bound without a modeled exception? (starvation invariant; must be zero — good P95 does not imply no starvation)"
  type: constraint
  priority: must_have
  sample_answer: []
  derivation_method: direct_lookup
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?req ?waited ?bound WHERE {
      ?req rdf:type ciops:SeatRequest ;
           ciops:observedQueueWaitMs ?waited ;
           ciops:governedBy ?policy .
      ?policy ciops:starvationBoundMs ?bound .
      FILTER ( !isNumeric(?waited) || !isNumeric(?bound) || ?waited > ?bound )
      FILTER NOT EXISTS { ?req ciops:hasStarvationException ciops:HardFloorException }
    }
  expected_result: zero_rows
  required_classes: [SeatRequest, AdmissionPolicy, StarvationException]
  required_properties: [observedQueueWaitMs, governedBy, starvationBoundMs, hasStarvationException]
  notes: "Final-grill round 2 (starvation HARD INVARIANT + Must CQ; review 2's 96-fast/4-starved counterexample). ROUND-3 CORRECTIONS (seats H+J convergent): (1) BOUND SOURCE — the deployed scheduler provides NO waiting-time guarantee: publishAgingSeconds only promotes a verify ticket's SORT RANK after 120s (effectivePriorityRank, QualityScheduler.ts:600-601), and seat H proved a ticket still queued after five aging windows with capacity occupied. starvationBoundMs is therefore a DECLARED OPERATIONAL POLICY fact the packet/S7 sets (v1 example 120000ms in the seed; the operator declares the fleet value) — it is the MONITOR'S threshold, precisely because the scheduler cannot guarantee it; a violation row is an operational finding to act on, which is what the ruled hard invariant means (S7 inherits it as admissibility). publishAgingSeconds remains an extracted A-Box fact but is NOT the bound's carrier. (2) EXCEPTIONS — QuarantineException was REMOVED (seat J B1: deployed 'quarantined' is corrupt-record file paths, reaped-dead owners are deleted — no owner-quarantine state exists); the domain is {HardFloorException} and the negation is PINNED to that closed member so an invented exception IRI cannot suppress a violation (seat H-12; fixture cq023-invented-exception.ttl). HardFloorException is ETL-DERIVED per-request from the snapshot-GLOBAL hardFloorEngaged flag (availableGib < hardFloorGib => capacity 0 for everyone — legal degradation) [seat J W5]. (3) NUMERIC GUARD (seat H-02): non-numeric quantities are violations, never lexically-green. (4) SCOPE — this CQ covers QUEUED requests at snapshot; granted-wait history is not promised (the store handoff self-erases; CQ-021 notes). observedQueueWaitMs = snapshot_instant - enqueuedAtMillis, ETL-materialized, NOW-free in-query. KPI reporting carries starvation BESIDE percentiles, never inside them (kpi-measurement-rules.md)."

- id: CQ-024
  source_use_case: UC-004
  natural_language: "Under what resolved cache posture did each WorkUnit execution run (local-only, local-write-remote-read, or caller-controlled)?"
  type: relational
  priority: should_have
  sample_answer:
    - exec: "ciops:exec-lint-run-2"
      posture: ciops:LocalWriteRemoteRead
  derivation_method: direct_lookup
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?exec ?posture WHERE {
      ?exec rdf:type ciops:WorkUnitExecution ;
            ciops:hasCachePosture ?posture .
    }
  expected_result: non_empty
  required_classes: [WorkUnitExecution, CachePosture]
  required_properties: [hasCachePosture]
  notes: "Final-grill round 3 (cache-posture Should CQ). ROUND-3 CORRECTIONS (seats H W-04 + J W2): (1) posture is resolved PER INVOCATION (resolveTurboCachePlan), so hasCachePosture lives on WorkUnitExecution, never on the reusable WorkUnit specification; (2) the deployed plan union has THREE arms, not two — LocalOnly ('local:rw'), LocalWriteRemoteRead ('local:rw,remote:r'), and CallerControlled (CI or an explicit --cache= argument, where the CLI does NOT rewrite the flags); the closed domain gains CallerControlled. Fail-closed precision: 'every other configuration fails closed to local-only' applies to the ENV-QUAD resolution path only — CI and explicit cache args are caller-controlled, not rewritten (TurboCache.ts resolver; the TURBO_CACHE env accepts only the remote-read posture as input, 'local:rw' is the fail-closed OUTPUT). Posture decides evidence transferability economics (CQ-015's shared-cache reads) and remote-hit scheduling value."

- id: CQ-025
  source_use_case: UC-005
  natural_language: "For each completed WorkUnit execution, what was the actual wall cost versus the estimated P50/P95 (cost-calibration pairs)?"
  type: quantitative
  priority: should_have
  sample_answer:
    - exec: "ciops:exec-lint-run-2"
      actual: 150000
      p50: 143000
      p95: 200000
  derivation_method: direct_lookup
  sparql: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?exec ?actual ?p50 ?p95 WHERE {
      ?exec rdf:type ciops:WorkUnitExecution ;
            ciops:hasExecutionState ciops:CompletedExecution ;
            ciops:actualWallMs ?actual ;
            ciops:usedCostEstimate ?c .
      ?c ciops:p50Ms ?p50 ; ciops:p95Ms ?p95 .
    }
  expected_result: non_empty
  required_classes: [WorkUnitExecution, CostEstimate]
  required_properties: [actualWallMs, usedCostEstimate, hasExecutionState, p50Ms, p95Ms]
  notes: "Final-grill round 3 (cost-charging Should CQ). Calibration is the honesty loop for every estimate the projection consumes. ROUND-3 CORRECTIONS: (seat J B2) the actualWallMs carrier is verdict.lanes[].durationMs (per-lane wall, nested in the attempt-finished verdict) — journal 'step records with elapsedMs' DO NOT EXIST; attempt-level verdict.elapsedMs charges the whole attempt (prepare+feedback+proof+publish) and may map to actualWallMs ONLY when the WorkUnitExecution is the whole attempt. (seat H W-05, Oxigraph-proven) joining any hasCostEstimate currently attached to the WorkUnit produced multiple calibration pairs per execution when estimates were revised — usedCostEstimate now links each execution to the IMMUTABLE estimate snapshot recorded at admission (ETL stamps it; estimates are never edited in place). The calibration STATISTICS (bias, P95 coverage) are ETL territory; this CQ supplies the pairs. Rides the spec/execution split."

- id: CQ-026
  source_use_case: UC-002
  natural_language: "Does any admitted WorkUnit's predicted P95 duration exceed its budget's soft P95 screen? (heuristic screen, explicitly NON-GUARANTEE — a distribution fact compared to an advisory budget, never a hard limit)"
  type: constraint
  priority: should_have
  sample_answer: []
  derivation_method: direct_lookup
  sparql: |
    PREFIX ciops: <https://oip.law/ontology/ci-ops#>
    SELECT ?grant ?p95 ?softMax WHERE {
      ?grant ciops:usedCostEstimate ?c .
      ?c ciops:p95Ms ?p95 .
      ?grant ciops:hasBudget ?b . ?b ciops:softP95BudgetMs ?softMax .
      FILTER ( !isNumeric(?p95) || !isNumeric(?softMax) || ?p95 > ?softMax )
    }
  expected_result: zero_rows
  required_classes: [SeatGrant, ResourceBudget, CostEstimate]
  required_properties: [usedCostEstimate, hasBudget, softP95BudgetMs, p95Ms]
  notes: "The DEMOTED half of old CQ-010 (tri-split ruling): the p95-vs-budget comparison survives as this separately-named Should-level heuristic screen. softP95BudgetMs (né maxGrantCostMs — renamed because 'max' claimed a guarantee) is an ADVISORY duration budget: exceeding it flags a scheduling smell, licenses nothing, and guarantees nothing — predictedP95Duration is a distribution fact, the admission charge is CQ-010's token quantity, and hard execution limits are S7 projection-contract territory that never enter OWL. ROUND-3 repairs: (seat H W-05) the screen now reads the grant's usedCostEstimate — the immutable estimate snapshot that governed admission — never whatever estimate is currently attached to the WorkUnit; (seat H-02) isNumeric guard so a plain-string p95 cannot be lexically green (fixture cq026-string-budget.ttl)."

