waived_constraints_proposed:
- id: con:affected-typenames-I01
  reason: No accepted term carries an affected-reason or typename domain, so the unconstrained decoder cannot bind until a
    closed schema is admitted.
- id: con:literalkits-I07
  reason: RepoGraphHealthStatus and scopedByComputation are unaccepted, and FallowHealthLane is a distinct diagnostic prescription,
    so no accepted record can host a graph-health outcome mapping.
- id: con:literalkits-I18
  reason: FailureSignature is parked, so flake and infrastructure classifiers have no accepted identity to map onto without
    minting a new referent.
- id: con:turbo-tasks-I06
  reason: No accepted selector-grammar term exists; hasOriginKey is origin-exclusion, not a Turbo input-selector model.
- id: con:turbo-tasks-I07
  reason: Pass-through and hash-environment variables have no accepted terms, so their cache-key semantics cannot be parameterized
    here.
- id: con:yeet-internals-I01
  reason: YeetProofTier and AssuranceTierId remain unratified parked domains, so S5 cannot ratify a source-tier-to-assurance
    mapping without new referents.
