bindings:
  - constraint: "con:fallow-laws-I06"
    term: "WorkUnitSpecification"
    note: "Architecture enforcement labels remain outside the executable work-unit lane domain unless a ratified mapping is added."
  - constraint: "con:literalkits-I01"
    term: "WorkUnitSpecification"
    note: "CiLaneClass remains a distinct source classification and does not type WorkUnitSpecification without an explicit mapping."
  - constraint: "con:admission-scheduler-I08"
    term: "admissionChargeTokens"
    note: "Instance charges come from ticket or lease weightTokens; configured token weights remain AdmissionPolicy defaults."
  - constraint: "con:literalkits-I03"
    term: "WorkUnitSpecification"
    note: "A missing docgen lane is not a scope value; affected and full modes require an explicit scope mapping."
  - constraint: "con:literalkits-I09"
    term: "VerificationEvidence"
    note: "Manifest current, missing, or stale observations do not establish evidence validity without cache-epoch and tree provenance."
  - constraint: "con:fallow-laws-I02"
    term: "WorkUnitSpecification"
    note: "Base-relative finding attribution does not imply that the work unit itself executes with affected scope."
  - constraint: "con:literalkits-I11"
    term: "VerificationEvidence"
    note: "Cached artifact kinds bear the evidence role only after production, cache-epoch, and tree provenance are established."
  - constraint: "con:literalkits-I19"
    term: "VerificationPlanSpecification"
    note: "Command modes and proof-surface members remain source-qualified; any mode-to-surface relation must be ratified."
  - constraint: "con:literalkits-I12"
    term: "MachineProofLock"
    note: "Proof-lock actions are not grant states; only a checked contention relation may connect them to MachineProofLock."
  - constraint: "con:admission-scheduler-I06"
    term: "StarvationException"
    note: "Corrupt ticket or lease isolation is neither an Agent state nor a StarvationException and introduces no QuarantineException."
  - constraint: "con:admission-scheduler-I01"
    term: "SeatRequest"
    note: "SeatRequest denotes the durable YeetAdmissionTicket; the in-memory AdmissionRequest DTO remains outside the taxonomy."
  - constraint: "con:turbo-tasks-I07"
    term: "WorkUnitSpecification"
    note: "Pass-through environment variables remain distinct from hash-environment inputs until transfer semantics are verified."
  - constraint: "con:turbo-tasks-I06"
    term: "WorkUnitSpecification"
    note: "Turbo selector spellings remain xsd:string parameter facts until a selector grammar is accepted."
  - constraint: "con:yeet-internals-I01"
    term: "VerificationPlanSpecification"
    note: "YeetProofTier remains a plan-selection source domain, distinct from AssuranceTierId until an explicit mapping is ratified."
  - constraint: "con:fallow-laws-I12"
    term: "VerificationObligation"
    note: "The source merge obligation remains unmapped to TierCiMergeGreen because no S5 tier mapping was ratified."
  - constraint: "con:admission-scheduler-I05"
    term: "PublishWork"
    note: "PublishWork remains a closed AdmissionWorkKind member marked reserved and currently uninstantiated."
  - constraint: "con:admission-scheduler-I04"
    term: "AdmissionPolicy"
    note: "publishAgingSeconds is a policy fact; starvationBoundMs must come from the separately declared operational policy."
  - constraint: "con:turbo-tasks-I02"
    term: "CachePosture"
    note: "A taskCacheEnabled boolean is not a CachePosture member and does not denote any of its three governed individuals."
  - constraint: "con:literalkits-I04"
    term: "WorkUnitSpecification"
    note: "FallowQualityFeatureFamily and FallowFeatureFamily remain distinct; matrix rows require ratified lane mappings."
  - constraint: "con:literalkits-I15"
    term: "VerificationResultArtifact"
    note: "Artifact production is distinct from gate outcome; written does not denote a passed, blocked, or execution state."
  - constraint: "con:admission-scheduler-I03"
    term: "capacityAtAdmissionTokens"
    note: "The value records pre-grant remaining capacity only; post-grant snapshots cannot carry it without explicit ETL provenance."
  - constraint: "con:yeet-internals-I05"
    term: "LocalWriteRemoteRead"
    note: "A remote-read decoded plan denotes this individual only when constrained to local:rw,remote:r."
  - constraint: "con:literalkits-I07"
    term: "WorkUnitSpecification"
    note: "Repo graph-health status cannot determine a work unit's computed scope until a deterministic outcome mapping exists."
  - constraint: "con:literalkits-I06"
    term: "VerificationPlanSpecification"
    note: "RepoPlanStepScope remains implementation metadata and is not equated with canonical plan scope without a checked mapping."
  - constraint: "con:literalkits-I18"
    term: "VerificationResultArtifact"
    note: "Infrastructure classifier signatures remain distinct from result failure identity until an explicit normalization mapping is ratified."
  - constraint: "con:affected-typenames-I01"
    term: "WorkUnitSpecification"
    note: "Affected-reason members do not constrain work-unit scope until a pinned closed typename schema and fail-open mapping exist."
  - constraint: "con:yeet-internals-I03"
    term: "VerificationResultArtifact"
    note: "Lane-status ETL excludes never-executed lanes and does not reinterpret not-run as cancellation."
waived_constraints_proposed: []
