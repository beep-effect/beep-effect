issues:
  - id: yeet-internals-I01
    kind: ambiguity
    claim: "YeetProofTier selects local proof plans, but this corpus does not state a one-to-one mapping from those source tiers to AssuranceTier individuals."
    evidence: "packages/tooling/tool/cli/src/commands/Yeet/internal/Planner.ts:380-385 — 'YeetProofTier.$match(tier, {'"
    suggested_disposition: "Ratify an explicit source-tier-to-assurance mapping in S5, preserving YeetProofTier and AssuranceTierId as distinct domains."
    status: open
  - id: yeet-internals-I02
    kind: missing-cq
    claim: "The attempt journal enforces a 50-attempt retention limit, but no Must/Should CQ admits a retention-policy term or fact."
    evidence: "packages/tooling/tool/cli/src/commands/Yeet/internal/AttemptJournal.ts:24-25 — 'const RETAINED_ATTEMPTS = 50;'"
    suggested_disposition: "Either classify retention as implementation-only or extend the requirements if CQ window completeness must expose this limit."
    status: open
  - id: yeet-internals-I03
    kind: schema-conflict
    claim: "YeetLaneStatus is a terminal planned-lane status domain and does not directly encode the RunningExecution, CompletedExecution, and CancelledExecution lifecycle."
    evidence: "packages/tooling/tool/cli/src/commands/Yeet/internal/Verdict.ts:48-53 — 'export const YeetLaneStatus = LiteralKit([\"passed\", \"failed\", \"skipped\", \"not-run\", \"not-run-early-stop\"]).pipe('"
    suggested_disposition: "Specify the ETL mapping explicitly, excluding never-executed lanes and sourcing running or cancelled state without treating not-run as cancellation."
    status: open
  - id: yeet-internals-I04
    kind: schema-conflict
    claim: "The lane-level durationMs source schema admits any finite number, while actualWallMs is frozen as an xsd:integer measured duration."
    evidence: "packages/tooling/tool/cli/src/commands/Yeet/internal/Verdict.ts:143-152 — 'durationMs: S.optionalKey(S.Finite),'"
    suggested_disposition: "Require ETL validation to a non-negative integer and preserve durationMs as lane-grain cost, using elapsedMs only for whole-attempt executions."
    status: open
  - id: yeet-internals-I05
    kind: schema-conflict
    claim: "RemoteReadTurboCache accepts the whole two-member TurboCacheMode schema even though the resolver constructs remote-read only from local:rw,remote:r."
    evidence: "packages/tooling/tool/cli/src/internal/cli/TurboCache.ts:397-402 — 'mode: TurboCacheMode,'"
    suggested_disposition: "Constrain or validate the remote-read variant to LocalWriteRemoteRead before using decoded plans as CachePosture assertions."
    status: open

