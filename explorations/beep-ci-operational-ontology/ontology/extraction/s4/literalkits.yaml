issues:
  - id: literalkits-I01
    kind: ambiguity
    claim: 'CiLaneClass encodes local parity classes, not the frozen LaneKind distinction between turbo task, script, and collected gate.'
    evidence: 'packages/tooling/tool/cli/src/commands/Ci/CiLane.ts:57 — ''export const CI_LANE_CLASS_VALUES = ["cli-runnable", "workflow-gated", "ci-native"] as const;'''
    suggested_disposition: 'Keep the source domain distinct and require an explicit mapping property before any LaneKind alignment.'
    status: open
  - id: literalkits-I02
    kind: missing-cq
    claim: 'CiLaneReplay carries exact, approximate, and no-replay fidelity, but no Must or Should CQ asks for replay fidelity as a T-Box term.'
    evidence: 'packages/tooling/tool/cli/src/commands/Ci/CiLane.ts:110 — ''export const CI_LANE_REPLAY_VALUES = ["exact", "approximate", "none"] as const;'''
    suggested_disposition: 'Retain as source telemetry unless a CQ needs replay fidelity for tier or transferability decisions.'
    status: open
  - id: literalkits-I03
    kind: ambiguity
    claim: 'DocgenLaneMode mixes absence of a scheduled lane with affected and full scope choices.'
    evidence: 'packages/tooling/tool/cli/src/commands/Ci/CiLane.ts:242 — ''export const DOCGEN_LANE_MODE_VALUES = ["none", "affected", "full"] as const;'''
    suggested_disposition: 'Model lane omission separately from Scope before mapping affected or full to canonical scope members.'
    status: open
  - id: literalkits-I04
    kind: schema-conflict
    claim: 'FallowQualityFeatureFamily contains matrix-only members beyond the smaller FallowFeatureFamily implemented by the quality wrapper.'
    evidence: 'packages/tooling/tool/cli/src/commands/Quality/Quality.schemas.ts:533-543 — ''"runtime-coverage", "editor-mcp-hooks"'''
    suggested_disposition: 'Preserve the two source domains separately and ratify which matrix rows denote deployed VerificationLanes.'
    status: open
  - id: literalkits-I05
    kind: missing-cq
    claim: 'GitHub lane stage, wave, and failure-policy labels configure execution but are not queried as ontology terms by a Must or Should CQ.'
    evidence: 'packages/tooling/tool/cli/src/commands/Quality/Quality.schemas.ts:777-806 — ''LiteralKit(["fail-fast", "collect-all"]) ... LiteralKit(["preflight", "heavy", "test", "documentation"])'''
    suggested_disposition: 'Keep them as projection configuration unless a CQ requires their semantics beyond materialized stepIndex.'
    status: open
  - id: literalkits-I06
    kind: schema-conflict
    claim: 'RepoPlanStepScope uses package, repo, and git, which is not the frozen ScopeKind domain of full, affected, filter, and shard scopes.'
    evidence: 'packages/tooling/tool/cli/src/internal/repo-run/RepoRun.models.ts:98-101 — ''LiteralKit(["package", "repo", "git"])'''
    suggested_disposition: 'Do not equate these domains; define a checked mapping or retain RepoPlanStepScope as implementation metadata.'
    status: open
  - id: literalkits-I07
    kind: schema-conflict
    claim: 'RepoGraphHealthStatus is a trust-level enum and does not state the typed FailOpenOutcome or FailClosedOutcome required by CQ-019.'
    evidence: 'packages/tooling/tool/cli/src/internal/repo-run/RepoRun.models.ts:154-157 — ''LiteralKit(["ok", "warning", "error"])'''
    suggested_disposition: 'Require a deterministic outcome mapping before graph-health status can affect scopedByComputation.'
    status: open
  - id: literalkits-I08
    kind: missing-concept
    claim: 'QualityHardwareProfile and CiRunnerClass condition scheduling measurements, but the frozen glossary has no execution-environment bearer or attachment property.'
    evidence: 'packages/tooling/tool/cli/src/commands/Quality/Quality.schemas.ts:341-344 — ''LiteralKit(["current", "workstation", "ci"])'''
    suggested_disposition: 'Ratify an environment model only if cost calibration requires it; define the context-dependent current member explicitly.'
    status: open
  - id: literalkits-I09
    kind: ambiguity
    claim: 'DocgenProofManifestStatus says current, missing, or stale without binding that status to CacheEpoch and TreeState.'
    evidence: 'packages/tooling/tool/docgen/src/ProofManifest.ts:111-114 — ''LiteralKit(["current", "missing", "stale"])'''
    suggested_disposition: 'Treat these as manifest observations, not VerificationEvidence validity, until epoch and tree provenance are attached.'
    status: open
  - id: literalkits-I10
    kind: missing-cq
    claim: 'Docgen proof-manifest format and schema-version markers are verification representations with no CQ or support dependency licensing T-Box members.'
    evidence: 'packages/tooling/tool/docgen/src/ProofManifest.ts:37-39 — ''LiteralKit(["docgen-proof-manifest"])'''
    suggested_disposition: 'Keep the format markers in ingestion metadata rather than minting ontology terms.'
    status: open
  - id: literalkits-I11
    kind: ambiguity
    claim: 'GateArtifactKind names cached file forms, which are information artifacts and are not automatically VerificationEvidence.'
    evidence: 'packages/tooling/tool/cli/src/commands/Yeet/internal/GateStaleness.ts:88-91 — ''LiteralKit(["baseline", "inventory", "manifest", "snapshot", "tsbuildinfo"])'''
    suggested_disposition: 'Require evidence-production and epoch-tree provenance before mapping an artifact instance to VerificationEvidence.'
    status: open
  - id: literalkits-I12
    kind: ambiguity
    claim: 'ProofLockDisposition classifies fail-closed actions on proof-lock generations, not SeatGrant lifecycle states.'
    evidence: 'packages/tooling/tool/cli/src/commands/Yeet/internal/ProofState.ts:126-129 — ''LiteralKit(["replace-stale", "refuse-active", "refuse-legacy", "refuse-unreadable"])'''
    suggested_disposition: 'Keep proof-lock actions distinct from scheduler grants and model only a checked relation to MachineProofLock contention.'
    status: open
  - id: literalkits-I13
    kind: missing-cq
    claim: 'QualityIssue category, severity, parser-confidence, and attribution domains normalize diagnostics but are not required by any Must or Should CQ.'
    evidence: 'packages/tooling/tool/cli/src/commands/Yeet/Yeet.schemas.ts:29-49 — ''export const QualityIssueCategory = LiteralKit(['''
    suggested_disposition: 'Retain them in diagnostic payloads unless a CQ explicitly requires issue taxonomy or attribution.'
    status: open
  - id: literalkits-I14
    kind: missing-cq
    claim: 'Fallow envelope status and defect domains describe producer and report handling, not a CQ-licensed failure or invalidation taxonomy.'
    evidence: 'packages/tooling/tool/cli/src/commands/Quality/internal/FallowEnvelope.schema.ts:99-107 — ''"tool-failed", "invalid-json", "invalid-report", "base-resolution-failed"'''
    suggested_disposition: 'Keep them as lane-output diagnostics until a decision CQ requires their distinctions.'
    status: open
  - id: literalkits-I15
    kind: schema-conflict
    claim: 'PrCloseoutGateStatus mixes outcome states with written, which denotes artifact production rather than pass or block state.'
    evidence: 'packages/tooling/tool/cli/src/commands/Yeet/internal/closeout/Closeout.schemas.ts:66-69 — ''LiteralKit(["passed", "blocked", "unknown", "written"])'''
    suggested_disposition: 'Split evidence production from gate outcome before any mapping to VerificationEvidence or ExecutionState.'
    status: open
  - id: literalkits-I16
    kind: missing-cq
    claim: 'Changeset applicability, check registration, optional-artifact reads, and monitor termination are operational control states without a CQ warrant.'
    evidence: 'packages/tooling/tool/cli/src/commands/Quality/ChangesetStatus.ts:154-157 — ''LiteralKit(["lab-exempt", "enforced"])'''
    suggested_disposition: 'Leave these values in runtime telemetry unless a Must or Should CQ needs the control-state distinction.'
    status: open
  - id: literalkits-I17
    kind: schema-conflict
    claim: 'RepoPlanStepResume permits fingerprint-based skipping without stating the CacheEpoch by TreeState validity conditions required for reusable evidence.'
    evidence: 'packages/tooling/tool/cli/src/internal/repo-run/RepoRun.models.ts:126-129 — ''LiteralKit(["never", "fingerprint-match"])'''
    suggested_disposition: 'Treat fingerprint-match as a candidate carrier only; prohibit direct proof-validity equivalence until the fingerprint semantics are audited.'
    status: open
  - id: literalkits-I18
    kind: schema-conflict
    claim: 'Source flake and infrastructure classifiers name failure signatures that are not visibly normalized to the frozen failedStepId by failureKind identity.'
    evidence: 'packages/tooling/tool/cli/src/internal/github/JobShape.ts:76-80 — ''LiteralKit(["setup-5xx", "runner-loss", "install-failure"])'''
    suggested_disposition: 'Ratify a mapping or a separate infrastructure-signature model; do not silently merge the identities.'
    status: open
  - id: literalkits-I19
    kind: ambiguity
    claim: 'GithubCheckMode and RepoProofSurface overlap on four spellings while denoting a command mode and a named proof surface respectively.'
    evidence: 'packages/tooling/tool/cli/src/internal/repo-run/RepoRun.proofs.ts:74-77 — ''LiteralKit(["cheap-gates", "quality", "review-fix", "pre-push"])'''
    suggested_disposition: 'Keep source_domain-qualified members distinct and ratify the mode-to-surface relation.'
    status: open
  - id: literalkits-I20
    kind: assumption
    claim: 'FleetCheckoutKind distinguishes clone from linked worktree but supplies no deployed admission-exclusion identity.'
    evidence: 'packages/tooling/tool/cli/src/commands/Worktree/Worktree.schemas.ts:616-619 — ''LiteralKit(["clone", "linked-worktree"])'''
    suggested_disposition: 'Use the members only to constrain Checkout; never infer origin or checkout exclusion from them.'
    status: open
  - id: literalkits-I21
    kind: ambiguity
    claim: 'GithubCheckLaneRunStatus not-run-early-stop establishes non-execution but does not state whether the cancellation is clean or dirty.'
    evidence: 'packages/tooling/tool/cli/src/commands/Quality/Quality.schemas.ts:895-898 — ''LiteralKit(["passed", "failed", "not-run-early-stop"])'''
    suggested_disposition: 'Map it to execution state only; derive CancelClass independently from step mutability.'
    status: open

