quote: "- **SeatRequest / WorkUnitSpecification split.** Request nodes are typed\n  `ciops:SeatRequest`\
  \ only; the double-typing collapsed two ratified\n  identity criteria. The provisional edge was renamed\n\
  \  `ciops-prov:schedulesSeatRequest` because the journal carries no\n  work-unit-specification identity\
  \ — `schedulesWorkUnit` joins the same\n  run-2 finding class as `admittedBy` (unusable from journal\
  \ bytes). The\n  run-2 re-proposal queue tracks the renamed edge in place of ruling 2's\n  original\
  \ `schedulesWorkUnit` spelling."
