quote: "### 3.3 Determinism rules (NFR-1)\n\n- No `Date.now`/clock in the core — the projection instant\
  \ is an argument.\n- Canonical request ordering before any iteration: sort by\n  (priority rank, enqueuedAtMillis,\
  \ originKey, nonce) — total and stable.\n- `Graph` construction (planner seam, v2) inserts nodes in\
  \ canonical order —\n  `Graph.topo` (Kahn's over CSR) is deterministic only for a fixed insertion\n\
  \  order; cyclic input fails typed after an `isAcyclic` pre-check.\n- Emission is byte-deterministic:\
  \ same input → byte-equal Turtle."
