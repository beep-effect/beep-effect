no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents. Exact reuse of the ratified FallowAuditLane
    individual is not a new is-a edge; no further subsumption relation is
    licensed by the lane label.
revision_requests:
  - >-
    Analyze this specification with an IdentityCard keyed to command, base rule,
    gate, and verdict semantics rather than reusing the unresolved composite-
    evidence card shared by the three rival proposals.
  - >-
    Demonstrate why CQ-001's inventory cannot be complete without this named
    individual, rather than relying on a listing CQ to warrant any observed
    command automatically.
  - >-
    Provide evidence that the command is a governed lane prescription outside
    the inventory carrier, including its lane kind and decision use.
attacks:
  - surface: identity
    rule: identity-card-cross-wired-to-composite-evidence
    counterexample: >-
      One FallowAuditLane prescription can be run many times and produce many
      result records, but the shared card makes procedure, execution provenance,
      tree, and result all potential parts of one unresolved evidence identity;
      it cannot reidentify the reusable named specification.
    outcome: landed
  - surface: warrant
    rule: listing-cq-does-not-require-specific-lane
    counterexample: >-
      CQ-001 asks for lanes and their kinds but does not name FallowAuditLane,
      and a nonempty answer containing other lanes satisfies its stated oracle;
      mere appearance of a command in an inventory does not make this individual
      logically required by the CQ.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-command-inventory
    counterexample: >-
      A configuration inventory can store the exact fallow:audit command as a
      string even when it is only an implementation hook and no independently
      governed WorkUnitSpecification individual is recognized.
    outcome: landed
rival_models_still_viable:
