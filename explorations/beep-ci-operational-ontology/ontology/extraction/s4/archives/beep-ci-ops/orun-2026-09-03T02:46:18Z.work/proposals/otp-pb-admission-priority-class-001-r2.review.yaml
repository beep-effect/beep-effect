      current observations do not decide whether those copies realize one
      enduring governed vocabulary or distinct vocabulary objects.
    outcome: landed
  - surface: warrant
    rule: decision-cq-requires-term
    counterexample: >-
      CQ-021 explicitly projects each queued request's AdmissionPriorityClass
      through hasPriorityClass. Eliminating the controlled domain would leave
      a required answer component untyped, so the warrant survives even while
      the domain's identity remains deferred.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-enum-dispatch
    counterexample: >-
      Enum dispatch defeated the former request-role claim, but the revision
      now asserts only governed controlled-vocabulary content. A LiteralKit can
      carry that content without reducing it to a role token, so the old null
      no longer chooses against the revised category.
