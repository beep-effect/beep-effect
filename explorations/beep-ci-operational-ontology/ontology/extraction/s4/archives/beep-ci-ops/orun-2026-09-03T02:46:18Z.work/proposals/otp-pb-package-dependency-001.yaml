operational_warrant:
  competency_questions: []
  semantic_support_for: ["otp:pa-package-dependency-closure:001"]
alternatives_rejected:
  - >-
    The architecture-arrow convention is rejected as the relation itself
    because a copied or stale diagram can exist without the operative edge.
  - >-
    The dependsOn spelling alone is rejected because lexical identity does not
    determine the directed graph relation.
open_issues:
  - >-
    Steward must choose whether edge-local provenance or version constraints
    require a reified dependency relator in addition to this binary relation.
  - >-
    The package-manifest dependency declaration remains a viable, distinct
    information-object model and needs its own warranted hypothesis before
    admission.
