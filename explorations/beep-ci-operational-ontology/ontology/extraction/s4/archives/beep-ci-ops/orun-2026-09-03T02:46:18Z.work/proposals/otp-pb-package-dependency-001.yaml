term:
  preferred_label: "depends on"
  local_name: dependsOn
  proposed_iri: "https://oip.law/ontology/ci-ops#dependsOn"
  owl_entity_kind: object_property
definition:
  text: >-
    A context-indexed package relation that holds from one importing workspace
    package to one imported workspace package when a direct dependency edge
    connects that ordered pair in one pinned repository dependency graph.
  source:
