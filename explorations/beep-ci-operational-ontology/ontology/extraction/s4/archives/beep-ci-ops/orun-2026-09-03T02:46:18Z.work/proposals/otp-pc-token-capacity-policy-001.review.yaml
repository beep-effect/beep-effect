revision_requests:
  - >-
    Address clause-is-part-not-kind by replacing the AdmissionPolicy is-a edge
    with a clause/component relation or folding the capacity rule into the
    complete policy specification.
  - >-
    Address clause-identity-lineage-unobserved and
    semantic-support-not-necessary with independent policy-clause authority
    and a Must/Should CQ that actually requires this rule; CQ-010 may ground a
    revised decision term only if the CQ suite names and consumes it.
  - >-
    Address discriminator-true-of-replay-implementation with a fact false of
    the arithmetic-and-replay-only null world, or leave that null unrejected.
attacks:
  - surface: taxonomy
    rule: taxonomy-rigidity-compatible
    counterexample: >-
      Both an immutable policy specification and an immutable clause can be
      rigid information objects, so rigidity alone does not block the edge.
    outcome: survived
  - surface: taxonomy
    rule: clause-is-part-not-kind
    counterexample: >-
      A token-capacity clause says nothing about the parent policy's priority,
      aging, class-cap, or starvation rules. It can be a proper component of
      AdmissionPolicy without being an instance of the complete policy class,
      so no valid subsumption relation has been shown.
    outcome: landed
  - surface: identity
    rule: clause-identity-lineage-unobserved
    counterexample: >-
      The same inequality can be embedded in two complete policies with
      different charge-accounting semantics, and one policy revision can
      change the inequality without issuing a separately versioned clause.
      The replay and source expressions do not establish the assumed lineage.
    outcome: landed
  - surface: warrant
    rule: semantic-support-not-necessary
    counterexample: >-
      The supported AdmissionPolicy is required by CQ-023 for its starvation
      bound, not for token capacity. CQ-010 directly compares recorded charge
      and capacity properties and does not require a TokenCapacityAdmissionRule
      class, so neither route makes this support term necessary.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-replay-implementation
    counterexample: >-
      A scheduler implementation can compute Math.min, assign token weights,
      replay its journal, and report that removing a stale charge makes grants
      feasible. Every cited fact remains true while no independently governed
      token-capacity policy-clause individual exists.
    outcome: landed
rival_models_still_viable:
  - "The inequality is only a clause within AdmissionPolicy."
  - "A request-feasibility situation is the world-side referent."
  - "The replay artifact records compliance but is not the policy."
