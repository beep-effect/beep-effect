    rule: direct-cq-warrant
    counterexample: >-
      Without VerificationAttempt, CQ-022 cannot require a committed failure and
      in-flight executions to share one attempt context. The class is directly
      required even though a future process model may be represented separately.
    outcome: survived
  - surface: null_discriminator
    rule: recorded-attempt-not-unfolding-process
    counterexample: >-
      A journal DTO can carry attemptId and temporal bounds without being the
      unfolding process. The revision now denotes precisely the provenance-bound
      recorded-attempt information object, so that counterexample confirms the
      world/information separation rather than defeating the proposal.
    outcome: survived
