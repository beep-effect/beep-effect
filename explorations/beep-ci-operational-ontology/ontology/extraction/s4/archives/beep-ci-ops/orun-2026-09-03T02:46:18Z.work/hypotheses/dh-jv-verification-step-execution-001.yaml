null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    Concrete steps are recorded with run-specific phases and statuses, which
    supports an execution occurrence distinct from the reusable step
    specification and from its serialized result.
  discriminator: >-
    One cited observation records prepare:01-effect-imports as passed with a
    measured duration and zero exit code, while the other records
    closeout:01-pr-context as not-run in a failed closeout; those are concrete
    execution outcomes, not representation declarations.
