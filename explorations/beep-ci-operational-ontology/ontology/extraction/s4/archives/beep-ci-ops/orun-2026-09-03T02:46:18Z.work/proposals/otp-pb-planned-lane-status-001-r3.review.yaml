      A result artifact can record an outcome without satisfying the
      applicability and provenance conditions for VerificationEvidence, while
      evidence needs a result-bearing information object on which those
      conditions depend. The broad class therefore supplies the necessary
      bearer side of the role distinction for the cited decision term.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A transient DTO may carry lane-result content without retained issuance.
      The revised proposal makes no issuance claim and accommodates a retained
      lane record only as a possible instance of the broad information-object
      class, so the DTO twin does not narrow or reidentify that class.
    outcome: survived
