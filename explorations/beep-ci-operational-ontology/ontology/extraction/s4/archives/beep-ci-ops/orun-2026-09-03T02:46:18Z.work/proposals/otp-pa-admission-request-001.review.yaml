surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents. Its collision with the ratified SeatRequest
    identity is tested on identity and reuse compatibility, not through a new
    subsumption edge.
revision_requests:
  - >-
    Narrow exact reuse to the ratified durable queued-ticket identity, or emit a
    separate proposal for the replay-derived PendingRequest view with its own
    identity and relationship to the queued request.
  - >-
    Replace the unresolved shared-carrier criterion with evidence that states
    when live DTO, journal event, and replay view are the same content, distinct
    tokens, or records about one world-side request.
  - >-
    Supply a discriminator based on operational reidentification or treatment
    of the request, not merely on DTO fields and derivation code.
attacks:
  - surface: identity
    rule: exact-reuse-identity-unresolved
    counterexample: >-
      A live queued ticket is deleted on admission, after which replay derives a
      PendingRequest-shaped row from journal history with the same kind, charge,
      origin, and enqueue values. The ratified ticket and later view can be two
      artifacts, but this proposal exact-reuses one IRI while its card cannot say.
    outcome: landed
  - surface: warrant
    rule: direct-cq-warrant
    counterexample: >-
      Removing SeatRequest makes CQ-021 unable to type and enumerate queued
      requests with their owner, kind, priority, charge, and enqueue time, so the
      class itself is directly required despite the identity overreach.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-request-dto
    counterexample: >-
      A pure scheduler DTO and a replay projection can both carry the listed
      fields and derive one row from journal events without either being the
      durable queued-ticket individual ratified by the taxonomy.
    outcome: landed
rival_models_still_viable:
  - "Distinct live-request and replay-view information artifacts."
  - "A world-side requesting relator represented by both artifacts."
