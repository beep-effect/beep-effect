no_surface_reasons:
  taxonomy: The revised proposal asserts no parents edges; there is no is-a edge to test, and no valid subsumption relation
    is proposed.
attacks:
- surface: identity
  rule: content-lineage-identity-conflict
  counterexample: Two repositories can carry semantically identical Fallow audit prescriptions while their policy lineages
    differ. The card makes lineage and revision identity-defining even though the proposal defines the individual by the prescription's
    content, wrongly separating equal information content.
  outcome: landed
- surface: warrant
  rule: listing-cq-warrant
  counterexample: CQ-001 requires the generic VerificationLane and LaneKind vocabulary needed to enumerate data. It neither
    names FallowAuditLane nor requires its base, gate, or command prescription as an ontology individual.
  outcome: landed
- surface: warrant
  rule: obligation-procedure-split
  counterexample: The same Fallow procedure can realize different policy obligations, but the revised definition now denotes
    only the audit instruction and gate and explicitly excludes the obligation, finding, execution, and organizing lane. That
    counterexample no longer contradicts the revised term shape.
  outcome: survived
- surface: null_discriminator
  rule: discriminator-true-of-config-entry
  counterexample: A command catalog entry can bind origin/main and new-only and remain only executable configuration. That
    pure config twin has the same command and gate facts without a separately individuated verification-lane artifact.
  outcome: landed
rival_models_still_viable:
- Parameterized Fallow audit plan information content
- Abstract Fallow audit process type instantiated by dated activities
- Inventory command-entry information object only
