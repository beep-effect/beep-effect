attacks:
  - surface: identity
    rule: unresolved-takes-precedence
    counterexample: >-
      The `full` member selects one pre-push step in proofStep but a full verify request
      expands to cheap-gates plus pre-push. Those prescriptions have different parts
      and unity conditions; treating them as one individual wrongly identifies a
      component with a composite, while treating them as different contradicts the
      proposal's hybrid definition. The FA correctly remains explicitly_deferred, so
      no settled identity criterion is available.
    outcome: landed
  - surface: identity
    rule: identity-and-foundational-record-agreement
    counterexample: >-
      A proposal marked `carries` whose IdentityCard supplied a different identity criterion or carried none, or a
      proposal marked `explicitly_deferred` over an FA with a different verdict, would
      launder an unresolved identity decision. Here the card records
      supplies_identity=false and carries_identity=true, and the FA
      verdict is `explicitly_deferred`; both agree with the proposal, so this
      consistency attack is survived.
    outcome: survived
  - surface: warrant
    rule: support-term-not-necessary
    counterexample: >-
      CQ-005 and CQ-006 require VerificationEvidence and its applicability and
      discharge relations. Evidence produced by any in-scope lane answers them; neither
      query requires this particular full-plan specification or its selector.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A pure dispatcher maps the string `full` to a freshly constructed pre-push step
      DTO exactly as quoted. That implementation behavior is true even when no enduring
      plan-specification individual exists, so it cannot reject the null.
    outcome: landed
