alternatives_rejected:
  - >-
    Serialization-only DTO rejected by the hardened discriminator: the
    deployed scheduler orders live queued tickets, promotes the first fitting
    contender, and raises a waiting verify ticket to publish priority after
    the configured aging window.
open_issues:
  - >-
    Steward must decide whether the ticket information artifact is itself the
    deployed SeatRequest or records a distinct queued request in the
    operational world; the scheduler's ordering and aging behavior does not
    settle that world-versus-information choice.
