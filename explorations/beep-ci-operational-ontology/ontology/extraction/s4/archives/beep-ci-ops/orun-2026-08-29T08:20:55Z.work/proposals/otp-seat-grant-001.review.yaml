  taxonomy: "The proposal asserts no parents edges, so there is no proposed subsumption relation to test; no valid subsumption relation is the present result."
attacks:
  - surface: identity
    rule: "identifier-is-not-identity"
    counterexample: "The same process can receive two grants with equal encoded owner and work fields. The card distinguishes them by exclusive creation lineage and treats path and timestamps as supporting evidence, so it does not reduce grant identity to a technical key."
    outcome: survived
  - surface: identity
    rule: "analysis-card-consistency"
    counterexample: "The proposal supplies identity and says analyzed, matching ic:sched-core:002 and fa:sched-core:002."
    outcome: survived
  - surface: warrant
    rule: "decision-term-warrant"
    counterexample: "CQ-008, CQ-009, and CQ-010 explicitly require SeatGrant to identify active holders, detect origin conflicts, and bind admission charge and capacity. A correctly modeled SeatGrant term is necessary for those decisions."
    outcome: survived
  - surface: null_discriminator
    rule: "discriminator-true-of-lease-dto"
    counterexample: "A mutable JSON lease used only for interprocess bookkeeping can truthfully be described as active while its weight is counted against capacity. The quoted operational use therefore remains true in the pure-DTO null world and does not prove independent record identity or a grant beyond the carrier."
    outcome: landed
  - surface: identity
    rule: "ticket-lease-split"
    counterexample: "A queued ticket is deleted before the active lease exists and the lease carries no ticket nonce. The proposal models only the active lease and does not call waiting tickets SeatGrants, so the mandated ticket/lease split survives."
    outcome: survived
  - surface: identity
    rule: "rival-model-disclosure"
    counterexample: "The operational grant-relation model remains viable and is explicitly named in open_issues."
    outcome: survived
rival_models_still_viable:
  - "A SeatGrant is a relational grant or lease in the operational world, with the lease file only recording it."
