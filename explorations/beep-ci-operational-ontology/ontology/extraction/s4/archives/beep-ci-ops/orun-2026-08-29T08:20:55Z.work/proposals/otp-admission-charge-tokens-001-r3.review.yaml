  - surface: identity
    rule: property-value-not-identity
    counterexample: >-
      Requests R1 and R2 can each carry a charge of three tokens while being
      distinct requests under distinct policy assignments. The revised card
      treats subject, assignment provenance, magnitude, and convention as the
      assertion context and does not identify either subject by the number.
    outcome: survived
  - surface: warrant
    rule: cq-required-term
    counterexample: >-
      Removing admissionChargeTokens leaves CQ-010 unable to bind the grant's
      charge and leaves CQ-021 unable to return the queued request's charge.
      Both CQs project or compare this property, so the warrant is necessary.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      A DTO can copy an integer named weightTokens, but an implementation-only
      counter with no admission-charge meaning cannot preserve the observed
      scheduler rule that this exact value is added to live charges and decides
      whether the contender may stage. The runtime fact defeats the null twin.
    outcome: survived
