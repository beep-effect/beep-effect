id: ic:alt2:051
hypothesis_ref: dh:turbo-cache:020
identity:
  supplies_identity: true
  identity_criterion: >-
    Two test:storybook task specifications are the same iff they prescribe the same repeatable Storybook-test work with the
    same observed upstream build dependency; the task name is evidence rather than the criterion.
  reidentification_key:
  - turbo.json tasks.test:storybook
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: One specification per distinct Turbo task prescription named test:storybook.
  dependence: none
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - kind
  - process
  existential_dependencies: []
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: A Storybook test execution that used a cached build is not this specification.
- description: >-
    Editing outputs or env of the test:storybook entry while keeping the same prescribed work is state change of one specification,
    not a second task.
status: proposed
