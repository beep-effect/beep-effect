surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The object-property proposal asserts no parents edge; no is-a or
    subproperty relation exists to test, so no valid subsumption relation is
    presumed.
attacks:
  - surface: identity
    rule: execution-assertion-individuation
    counterexample: >-
      One reusable WorkUnit specification can execute twice under the same
      SeatGrant. The revised property uses the two execution occurrences as
      distinct subjects and supplies no identity of its own, so it no longer
      collapses those assertions.
    outcome: survived
  - surface: warrant
    rule: cq-domain-mismatch
    counterexample: >-
      CQ-010 ranges admittedBy from the reusable WorkUnit scheduling object,
      while this proposal expressly limits the property's subject to a WorkUnit
      execution occurrence. A graph containing specification W, execution E,
      and only E admittedBy G cannot answer the cited query for W; the revised
      definition and open issue acknowledge that mismatch without repairing it.
    outcome: landed
  - surface: null_discriminator
    rule: deployed-admission-relation
    counterexample: >-
      A generic acquire-use-release wrapper could be plumbing, but it would not
      preserve the deployed rule that an overshooting lease is rolled back
      before the guarded work begins and that accepted work remains charged
      while the grant is heartbeated. The execution-to-grant relation survives
      the implementation-only twin.
    outcome: survived
rival_models_still_viable:
  - "A reified admission occurrence can connect WorkUnit specification, execution occurrence, and SeatGrant."
