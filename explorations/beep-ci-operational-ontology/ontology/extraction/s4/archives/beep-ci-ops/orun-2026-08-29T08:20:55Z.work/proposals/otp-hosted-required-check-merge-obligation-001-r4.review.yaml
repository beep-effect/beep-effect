attacks:
  - surface: identity
    rule: activation-lineage-deferred
    counterexample: >-
      One candidate can satisfy a required-check designation and later reacquire
      it under the same target and policy. The card now separates activations at
      discharge and reacquisition and honestly defers reidentification pending
      the named provenance.
    outcome: survived
  - surface: identity
    rule: relational-mode-alignment-conflict
    counterexample: >-
      The obligation cannot exist without a candidate transition, required-check
      designation, and governing merge policy. The proposal therefore declares
      relational dependence but aligns the class to gufo:IntrinsicMode, which
      cannot express that externally dependent normative unity.
    outcome: landed
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      CQ-006 can relate VerificationEvidence directly to a generic verification
      obligation or required-check designation. The revised definition and open
      issue concede that this specialized class is unnecessary while the warrant
      continues to assert necessary support for VerificationEvidence.
    outcome: landed
  - surface: null_discriminator
    rule: normative-gate-discriminator
    counterexample: >-
      A passive check-status DTO can report success or failure but cannot make
      an unsatisfied required check block a merge transition. The governing rule
      assigns that consequence, so the normative gate survives the null twin.
    outcome: survived
