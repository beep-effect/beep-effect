no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: designation-vs-obligation-activation
    counterexample: >-
      One check can retain its required designation while successive candidate
      obligations are discharged and later reacquired. The adopted class is the
      check-relative designation, not any activation; the definition and open
      issues separate those entities and leave designation individuation relative
      to check, governed target, and policy unresolved.
    outcome: survived
  - surface: identity
    rule: relational-mode-alignment
    counterexample: >-
      A required-check designation cannot exist independently of its check,
      governed transition, and policy. The revision declares relational
      dependence and gufo:ExtrinsicMode alignment, while openly retaining a
      normative-relator alternative.
    outcome: survived
  - surface: warrant
    rule: required-vs-optional-distinction
    counterexample: >-
      CQ-006 cannot determine which unsatisfied checks constitute unmet
      obligations if required and optional check results are indistinguishable.
      The generic designation supplies that mandatory-status distinction and
      constrains when VerificationEvidence can discharge the merge gate.
    outcome: survived
  - surface: null_discriminator
    rule: normative-gate-discriminator
    counterexample: >-
      A passive check-status DTO can report success or failure but cannot make
      an unsatisfied required check block a merge transition. The governing
      repository rule assigns that consequence, so the designation is not
      exhausted by its status carrier.
    outcome: survived
rival_models_still_viable:
  - "Represent RequiredCheckDesignation as a normative relator connecting check, target, and policy."
  - "Model standing merge policy and generic VerificationObligation activations as distinct entities."
