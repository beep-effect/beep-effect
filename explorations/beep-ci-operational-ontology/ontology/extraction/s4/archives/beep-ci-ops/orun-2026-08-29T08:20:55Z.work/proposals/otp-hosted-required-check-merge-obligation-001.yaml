  local_name: RequiredCheckDesignation
  preferred_label: required-check designation
  proposed_iri: https://oip.law/ontology/ci-ops#RequiredCheckDesignation
  owl_entity_kind: class
definition:
  text: A relationally dependent normative mode borne by a check relative to a governed target, designating successful evidence
    from that check as mandatory before the target transition may occur. CQ-006 needs this generic required-versus-optional
    distinction when determining unmet obligations; a hosted merge check is one bearer, not a separate hosted-check-specific
    obligation kind. Discharge and waiver concern the associated generic VerificationObligation, not the designation's identity.
