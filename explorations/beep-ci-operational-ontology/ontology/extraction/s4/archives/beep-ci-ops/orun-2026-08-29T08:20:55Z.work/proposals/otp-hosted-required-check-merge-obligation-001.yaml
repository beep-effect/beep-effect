alternatives_rejected:
- 'Implementation-only null rejected by the hardened discriminator: The governing repository rule makes satisfaction of hosted
  required checks a condition of merge, so an unsatisfied required check blocks the candidate branch from merging.'
open_issues:
- 'Steward choice remains open between the selected extrinsic-mode representation and a normative relator connecting check,
  governing target, and policy; both represent the generic RequiredCheckDesignation rather than a hosted-specific obligation.'
- 'The standing merge-policy specification and each generic VerificationObligation activation are distinct from this designation;
