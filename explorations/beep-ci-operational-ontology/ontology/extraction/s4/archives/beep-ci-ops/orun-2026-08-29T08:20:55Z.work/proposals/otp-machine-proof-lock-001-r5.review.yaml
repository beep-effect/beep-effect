no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: role-bearer-identity
    counterexample: >-
      A gate service can be recreated and holders can change while one origin
      coordination target remains contended. The card makes ContendedResource
      anti-rigid, carries the bearer's identity, and follows the underlying
      target and continuous coordination regime rather than service object,
      holder, or lock-path identity.
    outcome: survived
  - surface: warrant
    rule: cq-required-generic-resource-class
    counterexample: >-
      CQ-008 explicitly asks which contended resources exist and which active
      SeatGrants hold them. Removing the generic class leaves those resource
      individuals untyped; the revision avoids the unwarranted proof-lock
      subclass while preserving the class the query genuinely requires.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-contention-discriminator
    counterexample: >-
      A service interface can expose acquire and release without real
      contention, but it cannot preserve the attempt journal's lock-contention
      verdicts and the KPI's counted proof-lock bounces with owner and lock-path
      evidence. The origin-scoped contended resource survives the interface twin.
    outcome: survived
