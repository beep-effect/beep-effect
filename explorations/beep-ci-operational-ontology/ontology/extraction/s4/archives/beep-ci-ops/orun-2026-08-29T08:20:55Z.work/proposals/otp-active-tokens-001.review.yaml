no_surface_reasons:
  taxonomy: "The proposal asserts no parents edge, so there is no proposed is-a relation to test."
attacks:
  - surface: identity
    rule: "identity-bearer-mismatch"
    counterexample: "Two AdmissionSnapshot records produced in the same continuous machine admission context can be distinct capture artifacts even when both report the same total. The card keys an enduring quality to the context and interval, while the proposal defines a data relation whose subject is each snapshot, so it applies one quality identity criterion to two different kinds of bearer."
    outcome: landed
  - surface: warrant
    rule: "support-term-not-necessary"
    counterexample: "CQ-010 can compare a grant's admissionChargeTokens directly with its capacityAtAdmissionTokens. Removing activeTokens leaves that query and the definition of the pre-grant remainder answerable, so this term is not necessary semantic support for the cited decision term."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "A pure status-DTO helper can reduce lease.weightTokens into a numeric field and use that field in a capacity check. The cited artifacts contain only the activeTokenTotal declaration and the reduction expression, so the claimed capacity-test and snapshot roles neither appear as observation facts nor become false in the implementation-only world."
    outcome: landed
rival_models_still_viable:
  - "A timestamped snapshot value rather than an enduring aggregate quality"
  - "A time-indexed admission situation constituted by the live lease set"
