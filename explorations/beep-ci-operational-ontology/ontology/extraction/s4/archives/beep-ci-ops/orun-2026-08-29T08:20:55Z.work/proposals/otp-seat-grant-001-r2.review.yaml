attacks:
- surface: identity
  rule: identifier-is-not-identity
  counterexample: The same process can receive two grants with equal encoded owner and work fields. The card distinguishes
    them by exclusive creation lineage and treats path and timestamps as supporting evidence, so it does not reduce grant
    identity to a technical key.
  outcome: survived
- surface: warrant
  rule: decision-term-warrant
  counterexample: CQ-008, CQ-009, and CQ-010 explicitly require SeatGrant to identify active holders, detect origin conflicts,
    and bind admission charge and capacity. A correctly modeled SeatGrant term is necessary for those decisions.
  outcome: survived
- surface: null_discriminator
  rule: discriminator-true-of-lease-dto
  counterexample: A mutable JSON lease used only for interprocess bookkeeping can truthfully be described as active while
    its weight is counted against capacity. The quoted operational use therefore remains true in the pure-DTO null world and
    does not prove independent record identity or a grant beyond the carrier.
  outcome: landed
rival_models_still_viable:
- A SeatGrant is a relational grant or lease in the operational world, with the lease file only recording it.
