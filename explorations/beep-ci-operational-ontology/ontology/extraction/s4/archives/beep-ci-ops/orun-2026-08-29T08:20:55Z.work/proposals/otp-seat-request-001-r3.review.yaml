no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: ticket-lineage-identity
    counterexample: >-
      A byte-for-byte copy of a queued ticket in another carrier is a second
      record token, while heartbeat updates mutate the original ticket without
      replacing it. The card follows the exclusive enqueue and carrier lineage
      rather than nonce, process coordinates, or serialized equality, so it
      distinguishes both cases.
    outcome: survived
  - surface: warrant
    rule: cq-requires-queued-request
    counterexample: >-
      CQ-021 and CQ-023 require the queued contender whose priority, enqueue
      time, wait, and eventual promotion are evaluated. Neither an Agent nor a
      SeatGrant can stand in for that waiting ticket, so SeatRequest is directly
      necessary for both questions.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-queue-lifecycle-discriminator
    counterexample: >-
      A persistence DTO could store request-shaped fields without affecting
      admission. The deployed scheduler orders the live queued tickets,
      promotes the first fitting contender, and ages a waiting verify ticket
      into publish priority, which is false in the storage-only twin.
    outcome: survived
rival_models_still_viable:
  - "The queued ticket artifact may record a distinct world-side request."
