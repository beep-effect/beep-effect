attacks:
  - surface: identity
    rule: "identifier-is-not-vocabulary-identity"
    counterexample: "Two schedulers can reuse the four literal spellings while assigning different meanings and policy versions. The criterion relies on governed lineage, stipulated meanings, and versioned authority rather than the strings, so it separates those vocabularies and survives the identifier attack."
