  - surface: warrant
    rule: "cq-required-term"
    counterexample: "Without an AdmissionWorkKind domain, CQ-021 cannot type or return the work kind of each queued SeatRequest. The CQ explicitly lists the class and uses hasWorkKind, so this is not a mere lexical mention."
    outcome: survived
  - surface: null_discriminator
    rule: "discriminator-not-in-observations"
    counterexample: "The closure records the four LiteralKit members and the declaration of admissionTokenWeight, but no branch values. A function that returns one for every member satisfies every cited observation while making the claimed differential treatment false."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "Even if different branch values were later observed, a pure enum used only as a scheduler switch key can assign different numbers without becoming an independently governed information object. The claimed behavior is therefore also true in a DTO-only null world."
    outcome: landed
