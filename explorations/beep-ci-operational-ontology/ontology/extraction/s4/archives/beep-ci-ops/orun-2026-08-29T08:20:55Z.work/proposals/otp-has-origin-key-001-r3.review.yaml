no_surface_reasons:
  taxonomy: >-
    The data-property proposal asserts no parents edge; no is-a or subproperty
    relation exists to test, so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: property-information-object-category-conflict
    counterexample: >-
      Two grants can carry equal strings under different naming schemes, and
      two origins can collide under a basename scheme. The revised card
      analyzes assertions rather than key objects or origins and supplies no
      identity, so lexical equality is only scheme-scoped join evidence.
    outcome: survived
  - surface: warrant
    rule: cq-requires-term
    counterexample: >-
      Removing hasOriginKey makes CQ-009 unable to join two active grants on
      their nonempty origin and therefore unable to detect the deployed
      origin-exclusion violation. The relation is used in the query itself.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      An arbitrary string field could be implementation-only, but it would not
      preserve the observed shared-order behavior in which a blocked origin's
      contender becomes skippable and later origins advance. The operational
      exclusion join defeats the arbitrary-field null twin.
    outcome: survived
