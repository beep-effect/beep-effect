definition:
  text: A governed policy-specification information artifact that declares the starvation bound and weighted-admission rules
    for SeatRequests. CQ-023 requires the governing policy and its bound; the chartered defaults, priority-aging branch, and
    review-fix class-cap branch establish the operative rule content rather than merely the shape of AdmissionConfig.
