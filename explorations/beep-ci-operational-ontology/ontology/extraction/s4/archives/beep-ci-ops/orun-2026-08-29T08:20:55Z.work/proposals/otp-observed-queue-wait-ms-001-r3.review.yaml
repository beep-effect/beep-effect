no_surface_reasons:
  taxonomy: >-
    The data-property proposal asserts no parents edge; no is-a relation exists
    to test, so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: property-assertion-identity
    counterexample: >-
      Two collectors can compute the same duration for one request and one
      observation boundary, while the same number observed for that request at
      a later boundary is a different fact. The card correctly uses request,
      enqueue boundary, observation boundary, and clock basis rather than a
      technical record or numeric value as identity.
    outcome: survived
  - surface: warrant
    rule: cq-requires-time-indexed-wait
    counterexample: >-
      CQ-023 cannot decide whether a queued request is nearing or exceeding its
      starvation bound from enqueue time alone. It requires the request's
      elapsed wait at a stated observation boundary, which is precisely the
      proposed data relation.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-aging-discriminator
    counterexample: >-
      A logging DTO could display elapsed milliseconds without affecting
      scheduling. The cited deployed queue uses elapsed waiting to promote an
      eligible verify request after the aging window, so the operational fact
      changes ordering and is false in the logging-only twin.
    outcome: survived
rival_models_still_viable:
