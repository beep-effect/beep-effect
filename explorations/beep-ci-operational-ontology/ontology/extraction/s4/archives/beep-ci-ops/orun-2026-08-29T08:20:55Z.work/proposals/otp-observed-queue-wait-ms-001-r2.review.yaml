attacks:
  - surface: identity
    rule: "identity-card-entity-kind-mismatch"
    counterexample: >-
      Collector A and collector B can compute the same waitedMillis for one request at the same
      boundaries. The revised proposal correctly makes one data-property assertion and denies a
      distinct quality token, but its analyzed IdentityCard still individuates observation-bound
      qualities. The closure therefore analyzes entities the proposed property expressly does not
      introduce.
    outcome: landed
  - surface: identity
    rule: "identifier-is-identity"
    counterexample: >-
      Equal numeric duration, request id, or collector key cannot identify a quality observation.
      The card correctly requires request, enqueue boundary, observation boundary, and clock
      convention, so the identifier shortcut is rejected even though the card targets the wrong
      entity kind.
    outcome: survived
  - surface: warrant
    rule: "cq-term-required"
    counterexample: >-
      Without observedQueueWaitMs, CQ-023 cannot bind waited or compare it with starvationBoundMs,
      and the property is listed as required. The Must constraint genuinely requires this data
      relation.
    outcome: survived
  - surface: null_discriminator
    rule: "discriminator-true-of-logging-value"
    counterexample: >-
      A progress logger can compute nowMillis minus startMillis into a temporary waitedMillis and
      use it for logging or escalation without persisting a semantic assertion. The revised proposal
      asks for an ETL contract but retains an analyzed closure and rejected null, so the pure
      logging twin still defeats the discriminator.
    outcome: landed
