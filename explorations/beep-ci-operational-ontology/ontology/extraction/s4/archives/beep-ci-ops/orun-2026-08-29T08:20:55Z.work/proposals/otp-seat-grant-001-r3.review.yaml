no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: lease-lineage-identity
    counterexample: >-
      The same process can receive two grants with identical encoded fields
      before and after cleanup, while heartbeat rewrites change one live
      grant's bytes. The card separates the repeated lease-creation lineages
      and preserves the one lineage through heartbeat updates; path and field
      values remain evidence rather than identity.
    outcome: survived
  - surface: warrant
    rule: cq-requires-active-grant
    counterexample: >-
      CQ-008, CQ-009, and CQ-010 require the active admission entity that owns
      capacity, can be reaped, and exposes the pre-grant accounting context.
      A request or bare status value cannot answer those questions, so
      SeatGrant is directly warranted rather than a support-chain convenience.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-lease-lifecycle-discriminator
    counterexample: >-
      A lease-shaped DTO could serialize owner and charge fields without
      governing capacity. The deployed scheduler stages this lease, charges
      it, heartbeats it, reaps it on owner failure, and rolls it back after an
      overshoot; those transitions are false in the serialization-only twin.
    outcome: survived
rival_models_still_viable:
  - "The active lease artifact may record a distinct world-side grant relator."
