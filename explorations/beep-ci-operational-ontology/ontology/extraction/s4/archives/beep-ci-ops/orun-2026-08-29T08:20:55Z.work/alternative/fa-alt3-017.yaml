strongest_counterexample: The cited observation is only the capture line naming @beep/brand
  plus a rank. File contents of @beep/brand can change while the workspace still treats it
  as the same affected-closure participant, which the kind reading uses; a content-addressed
  tarball with another name would favor the information-object reading.
verdict: analyzed
needed_evidence: Whether CI reidentifies @beep/brand across content change via the workspace
  name (kind) or treats a content-identical artifact as the same information object independently
  of the name; and whether @beep/brand outside this workspace is still the same entity (role
  versus kind). The models are observationally equivalent on the topo-sort line alone.
