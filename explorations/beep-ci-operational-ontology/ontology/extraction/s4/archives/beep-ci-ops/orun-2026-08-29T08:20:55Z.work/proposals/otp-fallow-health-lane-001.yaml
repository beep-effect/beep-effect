alternatives_rejected:
- 'Rejected unconnected-config-pair model: The lane denotes the invocable health diagnostic in the required CQ-001 inventory;
  complexity ceilings remain a separate policy unless evidence connects them to the diagnostic.'
open_issues:
- 'Steward choice remains open only for a future relation to the separate threshold policy: tool documentation or an execution
  trace may justify linking the diagnostic to ceilings, but the current FallowHealthLane identity is the inventory-declared
  health prescription and does not depend on that unobserved linkage.'
