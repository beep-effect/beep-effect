no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: result-content-vs-record-token
    counterexample: >-
      Two executions can produce byte-equal results, while one result content
      can be copied into several carriers. The generic VerificationResultArtifact
      commits only to information content, carries rather than supplies identity,
      and openly defers the choice between content identity and issued record-token
      identity.
    outcome: survived
  - surface: warrant
    rule: evidence-role-requires-result-bearer
    counterexample: >-
      If every result artifact is identified with VerificationEvidence, a
      diagnostic result with no applicability or provenance can discharge an
      obligation. CQ-005 and CQ-006 require an evidence record with result
      content, while the adopted bearer class permits non-evidentiary results;
      that role-bearer distinction is necessary semantic support.
    outcome: survived
  - surface: null_discriminator
    rule: transient-carrier-does-not-erase-result-content
    counterexample: >-
      The structural observations alone do not establish retention or evidence
      use, and the revision makes neither claim. A transient split-stream value
      can nevertheless carry information about an execution outcome; the term
      now denotes that generic result content and treats evidentiary status as a
      contingent role rather than inferring it from the DTO shape.
    outcome: survived
rival_models_still_viable:
  - "VerificationResultArtifact identity may follow result content or an issued record-token lineage."
  - "A result artifact bears VerificationEvidence only under policy, applicability, and provenance context."
