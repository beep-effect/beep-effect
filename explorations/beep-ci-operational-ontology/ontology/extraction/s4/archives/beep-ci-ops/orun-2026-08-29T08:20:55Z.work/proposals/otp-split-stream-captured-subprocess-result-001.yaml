id: otp:split-stream-captured-subprocess-result:001
hypothesis_ref: dh:reporun:037
identity_card_ref: ic:reporun:014
foundational_status: explicitly_deferred
term:
  local_name: VerificationResultArtifact
  preferred_label: verification result artifact
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationResultArtifact
  owl_entity_kind: class
definition:
  text: >-
    An information object recording the outcome of a verification execution in a
    form that may bear the contingent VerificationEvidence role when policy-required
    applicability and provenance are present. CQ-005 and CQ-006 require an evidence
    record to have such result content, while allowing diagnostic result artifacts
    that do not bear the role. A transient or retained split-stream carrier containing
    exit status, bounded stdout and stderr, and truncation state is one accommodated
    representation; this proposal makes no unobserved retention or evidence-use claim.
  source:
    - CQ-005
    - CQ-006
    - so:sha256:d6da940a42fe3f10b270c35bafa732393f880e72d9f71994a334d87ac56f373d
    - so:sha256:ca5e01bb598282d204b571b9567ae92a62782dc0dea487b412200725b31fde49
    - so:sha256:8e9ac56f7faaa4343dc5e43ba0d5db57423412ece68eb4b5d65adbce396d5976
foundational:
  ufo_category: information_object
  gufo_alignment: gufo:Endurant
ontoclean:
  rigidity: rigid
  identity: carries
  dependence: intrinsic
reuse:
  searched: true
  exact_reuse_found: false
  mappings: []
operational_warrant:
  semantic_support_for:
    - otp:verification-evidence:001
alternatives_rejected:
  - >-
    Rejected category collapse: the subprocess execution is an occurrence,
    whereas VerificationResultArtifact is information content about that
    occurrence. Retention is a carrier property, and evidentiary status is a
    contingent role, so neither changes the selected generic denotation.
open_issues:
  - >-
    Steward choice remains open between result-content identity and issued record-token
    identity. A split-stream return is classified as VerificationEvidence only when
    an instance-level trace supplies the policy, applicability, and provenance for
    that contingent role; otherwise it remains a VerificationResultArtifact.
