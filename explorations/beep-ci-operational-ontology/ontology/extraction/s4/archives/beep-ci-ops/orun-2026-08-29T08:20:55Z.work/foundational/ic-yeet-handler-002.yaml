id: "ic:yeet-handler:002"
hypothesis_ref: "dh:yeet-handler:010"
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    Unresolved: sameness must distinguish the information-content object
    generated by one terminal recording act from its concrete serialized
    tokens; neither attempt provenance nor byte equality alone decides whether
    the verdict.json copy and the journal-embedded copy are one individual or
    two.
  reidentification_key:
    - "the terminal verdict-recording act for one Yeet attempt"
    - "the schema-framed assertional content and its provenance"
    - "the storage occurrence, subject to the information-content-versus-record-token ruling"
ontoclean:
  rigidity: rigid
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: >-
    The schema-versioned bundle of attempt context, terminal outcome, lane
    summaries, timing, and repair facts produced by one recording act forms one
    verdict assertion.
  dependence: unresolved
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "situation: the terminal outcome state of affairs for one Yeet attempt"
    - "information_object: one content object with verdict.json and the journal entry as concretizations"
    - "information_object: distinct record tokens for the standalone file and journal embedding"
    - "process: the Yeet run or verification attempt itself"
  existential_dependencies:
    - >-
      As information, it requires at least one faithful digital or material
      bearer, but the source does not settle generic dependence on any bearer
      versus specific dependence of each serialized token.
    - >-
      Its interpretation and reidentification require provenance to a terminal
      recording act and represented attempt; the record does not existentially
      depend on that attempt as a concrete event because a false record could
      still exist.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states:
    - "superseded by a corrected or later verdict without becoming that verdict"
    - "no longer concretized after destruction of its final faithful bearer"
counterexamples:
  - description: >-
      writeRunVerdict serializes one verdict into verdict.json and also embeds
      it in an attempt-finished journal event; a path-based criterion splits
      what may be one content object, while a content-only criterion collapses
      what may be two record tokens.
  - description: >-
      Two separately recorded attempts could produce byte-equal verdict
      contents, yet their distinct terminal recording acts prevent provenance-
      sensitive records from being the same individual.
status: proposed
