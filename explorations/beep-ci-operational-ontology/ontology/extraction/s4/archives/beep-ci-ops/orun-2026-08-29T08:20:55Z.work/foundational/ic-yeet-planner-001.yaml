id: "ic:yeet-planner:001"
hypothesis_ref: "dh:yeet-planner:007"
identity:
  supplies_identity: false
  identity_criterion: >-
    Domain worksheet for the Yeet proof-tier procedure-specification domain:
    two tier-level specifications are the same information object only when
    they preserve the same authored mapping from planning inputs to proof
    surface, argument-transformation semantics, lane-and-wave selection
    semantics, applicability context, and version lineage. Re-encoding that
    prescription does not create another individual, while changing a defining
    mapping creates a different versioned specification. Cheap-gates membership
    further requires the cheap-gates proof definition, its argument rule, and
    its context-sensitive cheap-lane rule; the literal spelling is only
    evidence.
  reidentification_key:
    - "repository policy and version lineage"
    - "selected proof surface and argument-transformation rule"
    - "lane-and-wave selection rule and its planning-context parameters"
    - "cheap-gates literal and generated step metadata as supporting evidence"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    One parameterized prescription joins a cheap-gates proof-step definition,
    its argument rule, and the rule that selects changeset-status and cheap-gate
    lanes for an applicable planning context. Concrete plan steps and runs are
    not parts of this information object's identity.
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "subkind: an operational cheap-gates verification procedure realized by executions"
    - "information_object: a family of context-bound RepoPlanStep specifications generated by the tier rule"
    - "process: one dated cheap-gates verification execution"
    - "none: the cheap-gates literal as a selector with no domain referent"
    - "quality: an assurance-tier individual rather than a planning prescription"
  existential_dependencies:
    - >-
      The information content generically depends on at least one faithful
      digital or material bearer; it does not depend on this particular source
      token.
    - >-
      Its status as the current Yeet prescription depends relationally on a
      repository policy and revision, but that current-status role does not
      supply the content object's identity.
    - >-
      It has no existential dependence on a plan execution. The prescription
      can exist without ever being run.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "superseded while retained as a historical specification"
    - "withdrawn"
    - "ceased when no faithful bearer remains"
counterexamples:
  - description: >-
      The same cheap-gates literal selects a changeset-status lane off main but
      not on main, so the token cannot identify one concrete lane collection or
      plan-step individual.
  - description: >-
      A repository revision can retain the cheap-gates spelling while changing
      the selected proof definition or lane rule; unchanged spelling would then
      mask a different versioned prescription.
status: proposed
