id: "ic:yeet-planner:002"
hypothesis_ref: "dh:yeet-planner:008"
identity:
  supplies_identity: false
  identity_criterion: >-
    Membership check against the Yeet proof-tier procedure-specification domain
    in ic:yeet-planner:001: two occurrences represent the same full
    member-level specification only when they preserve the same pre-push proof
    definition, conditional collect-all argument rule, context-sensitive full
    lane-and-wave rule, applicability context, and version lineage. The word
    full is only evidence. The source does not settle whether the member-level
    specification and the composite cheap-gates-plus-pre-push plan are one
    information object.
  reidentification_key:
    - "repository policy and version lineage"
    - "pre-push proof definition selected by the full member"
    - "conditional collect-all and full lane-selection rules"
    - "full literal and generated step metadata as supporting evidence"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    The primary model unifies the pre-push proof definition, conditional
    collect-all behavior, and full lane-and-wave selection as one parameterized
    member-level prescription. The planner also expands a full verify request
    into an ordered cheap-gates and pre-push sequence, so the boundary of that
    information object remains unresolved.
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "information_object: the composite cheap-gates-plus-pre-push full-proof plan specification"
    - "subkind: an operational full verification procedure realized by executions"
    - "information_object: a family of context-bound RepoPlanStep specifications generated by the tier rule"
    - "process: one dated pre-push or full-proof verification execution"
    - "quality: the local-full-proof assurance tier itself"
    - "none: the full literal as a selector with no domain referent"
  existential_dependencies:
    - >-
      The information content generically depends on at least one faithful
      digital or material bearer; no particular full token or source file is
      necessary.
    - >-
      Its status as the current Yeet prescription depends relationally on a
      repository policy and revision, while its prescriptive content does not
      depend on a particular run.
    - >-
      Concrete plan steps depend on a RepoRunContext and collect-all choice, but
      the reusable prescription can exist without any execution.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "superseded while retained as a historical specification"
    - "withdrawn"
    - "ceased when no faithful bearer remains"
counterexamples:
  - description: >-
      The member-level dispatcher maps full to a pre-push proof step, while
      verify-mode planning maps the same full selection to a two-step sequence
      containing cheap-gates before pre-push. A pre-push-only unity criterion
      cannot identify both structures without another rule.
  - description: >-
      Two full selections can differ in collect-all behavior and branch-sensitive
      lane waves while sharing the same literal, so the spelling identifies no
      concrete plan or execution.
status: proposed
