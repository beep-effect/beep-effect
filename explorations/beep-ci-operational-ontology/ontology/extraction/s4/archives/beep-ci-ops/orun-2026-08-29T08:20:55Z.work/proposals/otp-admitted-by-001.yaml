term:
  local_name: admittedBy
  preferred_label: admitted by
  proposed_iri: https://oip.law/ontology/ci-ops#admittedBy
  owl_entity_kind: object_property
definition:
  text: >-
    An object relation from a reusable WorkUnit specification to the SeatGrant
    under which an execution realizing that specification is admitted and remains
    capacity-charged. The binary assertion is the CQ-010 projection: an admission
    occurrence may witness it by connecting the specification, its execution, and
    the grant, but the property's declared subject remains the WorkUnit specification
    used by CQ-002 and CQ-010.
