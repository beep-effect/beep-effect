definition:
  text: The reusable CachePosture individual whose normative content permits local cache reads and writes plus remote reads
    while forbidding remote writes, operationalized by local:rw,remote:r. CQ-024 requires this named effective execution posture;
    the remote-read tag and cache string are evidence for its authority semantics rather than its identity criterion.
