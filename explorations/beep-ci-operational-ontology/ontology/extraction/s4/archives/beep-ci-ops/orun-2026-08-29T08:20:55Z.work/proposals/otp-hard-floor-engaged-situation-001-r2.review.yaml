no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge, so it proposes no is-a relation
    whose rigidity, identity inheritance, dependence, unity, or absence can be
    evaluated.
attacks:
  - surface: identity
    rule: rigidity-identity-conflict
    counterexample: >-
      Situation S ends when memory recovers above the hard floor and a later
      below-floor episode is a new situation. S therefore cannot leave
      HardFloorEngagedSituation and persist as the same individual, yet the
      referenced card still marks the class anti_rigid. Changing only the proposal
      field to unresolved does not repair that card-level contradiction.
    outcome: landed
  - surface: identity
    rule: identity-continuity-evidence-gap
    counterexample: >-
      Snapshot A at 10:00 and snapshot B at 10:02 can both report true and zero
      capacity although memory recovered at 10:01. The cited snapshots contain no
      continuous machine-and-policy interval, so the card cannot tell whether A
      and B concern one situation or two.
    outcome: landed
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Two separate episodes share hardFloorEngaged=true and can even report the
      same availableGib value. The card attempts to use machine, policy, and a
      maximal interval rather than the Boolean key, so the identifier shortcut
      itself is resisted.
    outcome: survived
  - surface: warrant
    rule: support-not-necessary-for-decision-term
    counterexample: >-
      CQ-023 needs AdmissionPolicy, its starvation bound, and a modeled
      HardFloorException. It can derive the exception directly from the snapshot
      Boolean as its notes prescribe; neither the policy class nor the query needs
      a reified HardFloorEngagedSituation class.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-boolean-branch
    counterexample: >-
      A pure control-flow branch can compare availableGib with hardFloorGib,
      return zero, and serialize hardFloorEngaged=true in a snapshot DTO. All cited
      facts remain true without a world-level situation individual.
    outcome: landed
rival_models_still_viable:
