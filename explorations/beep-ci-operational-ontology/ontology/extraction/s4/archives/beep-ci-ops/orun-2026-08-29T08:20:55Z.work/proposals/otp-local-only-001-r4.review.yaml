attacks:
  - surface: identity
    rule: content-identity-not-tag-identity
    counterexample: >-
      Two invocations can emit distinct resolver records containing local:rw
      while referring to one governed local-only posture, whereas the same label
      under a policy permitting remote writes denotes different content. The
      card uses cache authority and vocabulary version rather than the tag or
      string as identity.
    outcome: survived
  - surface: warrant
    rule: cq-required-domain-member
    counterexample: >-
      Removing LocalOnly leaves CQ-024 unable to classify executions whose
      effective posture permits local reads and writes while forbidding remote
      cache access. The named value is required by the closed three-arm answer
      domain, not merely mentioned in prose.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-cache-posture-discriminator
    counterexample: >-
      A lexical DTO can carry local:rw, but it cannot preserve the deployed
      resolver behavior that selects the local-only branch and supplies that
      effective cache argument to Turbo. The runtime transfer posture is not
      exhausted by the DTO or string that represents it.
    outcome: survived
