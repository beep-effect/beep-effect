definition:
  text: The reusable CachePosture individual whose normative content leaves effective Turbo cache arguments under CI or explicit
    caller control and injects no local cache override. CQ-024 requires this named execution posture; the two resolver reasons
    are evidence for when the same governed value applies, not separate posture identities.
