id: "ic:reporun:014"
hypothesis_ref: "dh:reporun:037"
identity:
  supplies_identity: false
  identity_criterion: >-
    Two split-stream captured-subprocess result records are the same only when
    they are the same result assertion produced by the same capture act about
    the same subprocess execution; equal exitCode, stdout, stderr, and
    truncated values from separate captures do not identify one record token.
  reidentification_key:
    - "capture-invocation provenance, which this record shape does not carry"
    - "the subprocess execution occurrence recorded by the capture"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    One record is unified by the exit observation and the two bounded stream
    folds co-produced in one split-stream capture act.
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "subprocess execution occurrence recorded by the values"
    - "retained diagnostic or verification-evidence artifact"
    - "transient return object with no retained operational role"
  existential_dependencies:
    - "at least one in-memory or persisted realization of the record"
    - "the capture act as historical provenance, not as a continuing bearer"
    - "the subprocess occurrence as recorded referent, not as an ongoing existential dependency"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
    - "discarded"
    - "superseded by a corrected record"
counterexamples:
  - description: >-
      Two independent version probes can return the same exit code and
      identical stdout and stderr; separating the streams does not make those
      two capture-result records one individual.
status: proposed
