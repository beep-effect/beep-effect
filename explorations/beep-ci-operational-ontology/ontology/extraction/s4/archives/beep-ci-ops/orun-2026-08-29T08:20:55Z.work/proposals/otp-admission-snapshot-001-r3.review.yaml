no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: unresolved-snapshot-token-identity
    counterexample: >-
      Two independent status reads can return byte-identical payloads, while one
      captured payload can be copied into two carriers. The proposal correctly
      defers token identity because no capture act or observation instant in the
      record distinguishes those cases; it does not launder field equality into
      identity.
    outcome: survived
  - surface: warrant
    rule: support-term-not-necessary
    counterexample: >-
      An ingestion boundary can compute observedQueueWaitMs from a request's
      enqueue instant and the collector instant and store that time-indexed
      assertion directly. CQ-023 never ranges over AdmissionSnapshot, so the
      decision property remains reproducible without admitting this class.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A status-response DTO can be documented as a point-in-time view and can
      materialize capacity, charges, leases, tickets, and memory while no
      independently reidentifiable snapshot token is retained. Every cited
      discriminator fact is true in that null world.
    outcome: landed
rival_models_still_viable:
  - "The live admission-state situation is the referent and the response is only its projection."
  - "The response is an extensional value without token identity."
