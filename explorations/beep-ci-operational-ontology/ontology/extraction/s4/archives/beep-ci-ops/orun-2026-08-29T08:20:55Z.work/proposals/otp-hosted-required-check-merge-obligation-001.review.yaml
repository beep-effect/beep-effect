  - surface: warrant
    rule: "support-term-not-necessary"
    counterexample: "YeetMonitorLane can test hosted-check status as a termination condition without admitting obligation tokens. CQ-001 lists lanes, while CQ-006 and CQ-017 concern tier-to-lane requiresLane relations; none requires a HostedRequiredCheckMergeObligation class, so the cited decision term remains answerable without it."
    outcome: landed
  - surface: null_discriminator
    rule: "normative-prose-discriminator"
    counterexample: "A passive hosted-check DTO does not make checks gate merge. The policy quotation explicitly assigns that normative consequence, so an implementation-only record with the same check labels but no governing rule would not preserve the cited fact."
    outcome: survived
  - surface: identity
    rule: "obligation-procedure-split"
    counterexample: "A monitor process can stop or restart while the merge obligation borne by a candidate persists. The proposal keeps the obligation distinct from YeetMonitorLane, so it does not collapse the mandated obligation/procedure split."
    outcome: survived
