attacks:
  - surface: identity
    rule: "identity-activation-conflict"
    counterexample: "The same candidate head can fail, satisfy, and later reacquire the same required-check condition after the required set is re-evaluated under one policy version. Candidate, target, check designation, and policy version can remain equal while two obligation activations have distinct lifecycles; the card lacks activation and discharge provenance to distinguish them."
