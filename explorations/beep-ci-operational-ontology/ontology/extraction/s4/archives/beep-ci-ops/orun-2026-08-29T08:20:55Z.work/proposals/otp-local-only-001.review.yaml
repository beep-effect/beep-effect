  taxonomy: "The proposal asserts no parents edge; no is-a edge or valid subsumption relation is proposed to test."
attacks:
  - surface: identity
    rule: unresolved-takes-precedence
    counterexample: >-
      Two executions can both emit `local:rw`. The IdentityCard calls them two
      invocation-borne posture particulars, while the proposal mints one named LocalOnly
      individual and the FA keeps a reusable controlled-vocabulary individual viable.
      The same term therefore both merges and separates those two executions depending
      on which unresolved model is silently chosen.
    outcome: landed
  - surface: identity
    rule: identity-and-foundational-record-agreement
    counterexample: >-
      A proposal marked `none` whose IdentityCard supplied or carried identity despite the proposal declaring none, or a
      proposal marked `analyzed` over an FA with a different verdict, would
      launder an unresolved identity decision. Here the card records
      supplies_identity=false and carries_identity=false, and the FA
      verdict is `analyzed`; both agree with the proposal, so this
      consistency attack is survived.
    outcome: survived
  - surface: warrant
    rule: cq-required-domain-member
    counterexample: >-
      CQ-024 explicitly asks whether each execution ran local-only,
      local-write-remote-read, or caller-controlled, and its notes declare that closed
      three-arm domain. Removing LocalOnly leaves executions emitting `local:rw`
      unclassifiable under the stated answer contract, so the direct warrant survives.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A tagged cache-plan DTO can map `LocalOnly` to `local:rw` and emit that CLI
      argument without a posture particular or reusable ontology individual. The
      mapping and branch emission are precisely implementation behavior and remain true
      under the null.
    outcome: landed
