strongest_counterexample: The cited observation is only the capture line naming @beep/practice-kg-mcp
  plus a rank. File contents of @beep/practice-kg-mcp can change while the workspace still
  treats it as the same affected-closure participant, which the kind reading uses; a content-addressed
  tarball with another name would favor the information-object reading.
verdict: analyzed
needed_evidence: Whether CI reidentifies @beep/practice-kg-mcp across content change via the
  workspace name (kind) or treats a content-identical artifact as the same information object
  independently of the name; and whether @beep/practice-kg-mcp outside this workspace is still
  the same entity (role versus kind). The models are observationally equivalent on the topo-sort
  line alone.
