id: "ic:reporun:007"
hypothesis_ref: "dh:reporun:010"
identity:
  supplies_identity: false
  identity_criterion: >-
    Applying the shared proof-surface domain criterion in ic:reporun:004, two
    pre-push procedure specifications are the same when they preserve the same
    authoritative pre-push verification prescription, applicability context,
    ordered arguments, and revision lineage; the pre-push token or a Git hook
    name alone cannot establish sameness.
  reidentification_key:
    - "pre-push proof-surface designation and step-definition identifier"
    - "repository policy revision and ordered executable arguments"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    One information object is unified by one prescription for the repository
    verification required before a push is attempted.
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "controlled-vocabulary individual for a proof-surface domain"
    - "pre-push verification lane or execution family"
    - "particular pre-push verification execution"
  existential_dependencies:
    - "at least one digital realization of the prescription"
    - "the repository policy and revision defining pre-push verification"
    - "the proof obligation the prescription is intended to discharge"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "superseded"
    - "withdrawn"
counterexamples:
  - description: >-
      The same pre-push prescription can be run before many different pushes,
      while a Git hook with the same name can prescribe different checks; a
      label therefore identifies neither the specification nor its executions.
status: proposed
