definition:
  text: The reusable verification-lane procedure specification that invokes Fallow against a selected base with the new-only
    finding gate and produces a gate verdict. CQ-001 requires the governed VerificationLane inventory, and the distinct Fallow
    audit command, base selection, and new-only gate make this named lane part of a complete inventory rather than an optional
    example. Dated audit runs realize the reusable prescription without changing its identity.
