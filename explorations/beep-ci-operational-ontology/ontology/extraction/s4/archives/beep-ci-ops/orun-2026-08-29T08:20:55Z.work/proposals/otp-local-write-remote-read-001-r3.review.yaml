no_surface_reasons:
  taxonomy: >-
    The individual proposal asserts no parents edge; no is-a relation exists
    to test, so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: identifier-is-not-identity
    counterexample: >-
      Two runs can carry distinct plan records with the same
      local:rw,remote:r string while referring to one governed posture, whereas
      the same label under a policy that permits remote writes denotes
      different authority. The card keys identity to the authority content and
      vocabulary version rather than the technical tag or string.
    outcome: survived
  - surface: warrant
    rule: cq-requires-effective-posture
    counterexample: >-
      CQ-024 cannot be answered from a generic remote-enabled marker because
      it asks for the effective execution posture and the authority difference
      between remote read and remote write. This named posture supplies the
      required local-write, remote-read, and no-remote-write decision value.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-cache-posture-discriminator
    counterexample: >-
      A configuration DTO could pair a tag with local:rw,remote:r without
      influencing execution. Here the cited resolver selects the sanctioned
      remote-read plan for an invocation and hands that exact mode to Turbo,
      which is false in the pure-DTO twin.
    outcome: survived
