term:
  local_name: CachePosture
  preferred_label: cache posture
  proposed_iri: https://oip.law/ontology/ci-ops#CachePosture
  owl_entity_kind: class
definition:
  text: A class of governed cache-posture specifications used to classify the effective local and remote cache authority of
    a WorkUnit execution as caller-controlled, local-only, or local-write-remote-read. Without this class, the three CQ-024
    posture values have no common operational semantics or closed range and can be confused with transient resolver DTO tags
    rather than the effective posture asserted for the execution.
