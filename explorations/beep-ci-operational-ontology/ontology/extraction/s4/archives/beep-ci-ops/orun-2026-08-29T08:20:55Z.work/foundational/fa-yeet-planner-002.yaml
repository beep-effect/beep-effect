id: "fa:yeet-planner:002"
hypothesis_ref: "dh:yeet-planner:008"
identity_card_ref: "ic:yeet-planner:002"
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
  - label: "Composite full-proof plan specification containing cheap-gates and pre-push steps"
    still_viable: true
  - label: "Operational full verification procedure subkind realized by each run"
    still_viable: true
  - label: "Family of context-bound RepoPlanStep specification individuals generated by one tier rule"
    still_viable: true
  - label: "Particular pre-push or full-proof verification execution"
    still_viable: false
  - label: "Local-full-proof assurance-tier individual identical to the full selector"
    still_viable: false
  - label: "Literal selector token with no domain referent"
    still_viable: false
strongest_counterexample: >-
  The full member selects a pre-push definition inside proofStep, but a full
  verify request expands to an ordered cheap-gates-plus-pre-push sequence. Those
  have different unities. Treating either one as the obvious referent silently
  merges a component prescription with a composite plan, even though neither is
  a dated execution.
verdict: explicitly_deferred
needed_evidence: >-
  An authoritative YeetProofTier semantics and artifact-identity contract must
  state whether full denotes the single pre-push member prescription or the
  composite sequence returned for a full verify request, and must define when
  revisions or context-bound copies remain the same specification.
