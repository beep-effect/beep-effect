no_surface_reasons:
  taxonomy: The revised proposal asserts no parents edges; there is no is-a edge to test, and no valid subsumption relation
    is proposed.
attacks:
- surface: identity
  rule: missing-bearer-continuity
  counterexample: A lease file can be deleted and a later lease created with equal owner fields while ETL emits active and
    released rows. Without a durable grant reference or release event, the card cannot decide whether those rows are phases
    of one SeatGrant or the end and creation of different bearers.
  outcome: landed
- surface: warrant
  rule: decision-term-warrant
  counterexample: CQ-008 and CQ-009 explicitly require GrantState and hasGrantState to restrict their active-grant answers,
    so the operational warrant itself survives.
  outcome: survived
- surface: null_discriminator
  rule: discriminator-true-of-lease-presence-dto
  counterexample: A live-store DTO can be called active while its file exists, charge capacity, and be deleted in a finalizer.
    Those facts are all true when deletion ends the record and no persisting grant changes phase.
  outcome: landed
rival_models_still_viable:
- The lease record is itself the SeatGrant, so deletion ends the individual rather than moving a persisting grant to a released
  phase.
- Snapshots carry only lease-presence assertions and no lifecycle-state individuals.
- The ontology should model a release event but not a persisting ReleasedGrant phase.
