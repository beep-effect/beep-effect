id: otp:active-tokens:001
hypothesis_ref: dh:sched-core:014
identity_card_ref: ic:sched-core:013
foundational_status: analyzed
term:
  local_name: activeTokens
  preferred_label: active admission tokens
  proposed_iri: https://oip.law/ontology/ci-ops#activeTokens
  owl_entity_kind: data_property
definition:
  text: 'A data relation from a machine-wide admission context, as captured at an immediately pre-grant AdmissionSnapshot
    boundary, to the sum of admission charges borne by its live SeatGrants under the governing token convention. The
    capacityAtAdmissionTokens decision value is computed from that same snapshot as capacityTokens minus activeTokens.
    Without this named operand, CQ-010 can still compare a stored remainder, but cannot check from the AdmissionSnapshot
    whether that value is the deployed pre-grant remainder rather than a post-grant or otherwise miscomputed ETL value.'
