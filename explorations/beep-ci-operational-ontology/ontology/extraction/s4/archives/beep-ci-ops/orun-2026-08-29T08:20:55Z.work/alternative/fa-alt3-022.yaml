tests:
  spec_vs_execution: not_applicable
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: false
rival_models:
- label: 'kind: @beep/epistemic-client as an identity-providing workspace package unit'
  still_viable: true
- label: 'information_object: @beep/epistemic-client as a software information artifact'
  still_viable: true
- label: 'role: being a member of this workspace, borne by a package named @beep/epistemic-client'
  still_viable: true
strongest_counterexample: The cited observation is only the capture line naming @beep/epistemic-client
  plus a rank. File contents of @beep/epistemic-client can change while the workspace still
  treats it as the same affected-closure participant, which the kind reading uses; a content-addressed
  tarball with another name would favor the information-object reading.
verdict: analyzed
needed_evidence: Whether CI reidentifies @beep/epistemic-client across content change via
  the workspace name (kind) or treats a content-identical artifact as the same information
  object independently of the name; and whether @beep/epistemic-client outside this workspace
  is still the same entity (role versus kind). The models are observationally equivalent on
  the topo-sort line alone.
