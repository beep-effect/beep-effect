surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edges, so it proposes no is-a or
    subsumption relation to test, including the possibility of no valid
    subsumption relation.
attacks:
  - surface: identity
    rule: identity-criterion-counterexample
    counterexample: >-
      Fleet A and fleet B can deploy byte-identical AdmissionConfig values
      while different authorities govern different applicability scopes.
      The criterion keeps those policy specifications distinct through
      authority, scope, and lineage, so value equality does not collapse them.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Two independently forked authorities can both label a policy
      "admission-v1" and use the same technical version key. The card does not
      identify them on that key alone; authoritative lineage and normative
      context must also agree.
    outcome: survived
  - surface: identity
    rule: ontoclean-identity-agreement
    counterexample: >-
      If the card merely carried another sortal's criterion while the proposal
      claimed to supply one, the proposal would inherit incompatible identity.
      Here the card and proposal both say that this rigid information object
      supplies the policy-specification criterion.
    outcome: survived
  - surface: identity
    rule: foundational-status-and-rival-disclosure
    counterexample: >-
      Treating the analyzed verdict as resolution would hide the viable deployed
      policy-regime and configuration-value-object models. The proposal's open
      issue names both rivals and its foundational_status matches the FA verdict.
    outcome: survived
  - surface: warrant
    rule: cq-term-necessity
    counterexample: >-
      CQ-023 types the governing policy as AdmissionPolicy and reads its declared
      starvation bound. Removing that decision class leaves the policy node
      untyped and the requested invariant cannot be stated as written.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-config-dto
    counterexample: >-
      A pure AdmissionConfig DTO can feed effectivePriorityRank and
      isTicketSkippable, changing queue rank and enforcing a review-fix cap,
      without denoting an authoritative policy specification. Every claimed
      discriminating fact therefore remains true in the null world.
    outcome: landed
rival_models_still_viable:
  - "A deployed admission-policy regime as a situation or normative mode"
  - "An AdmissionConfig value object without normative force"
