  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
  - label: "Structural subkind of failed hosted jobs whose install step failed before lane work"
    still_viable: true
  - label: "Anti-rigid rerun-eligible role borne by a matching failed job under current policy"
    still_viable: true
  - label: "Transient environment-caused installation-failure subkind"
    still_viable: false
  - label: "Particular dependency-installation failure or detector execution"
    still_viable: false
