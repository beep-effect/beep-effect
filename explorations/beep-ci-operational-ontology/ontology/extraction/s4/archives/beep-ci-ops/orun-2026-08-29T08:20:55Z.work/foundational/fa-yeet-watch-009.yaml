strongest_counterexample: >-
  A broken lockfile satisfies the exact failed-install-before-lane predicate on
  every attempt, so the member neither proves a transient environmental cause
  nor identifies an occurrence that rerunning will cure. The repeatable
  specification remains distinct from its job bearer and execution, while a
  structural failed-job subkind and a current-policy role remain viable.
verdict: analyzed
