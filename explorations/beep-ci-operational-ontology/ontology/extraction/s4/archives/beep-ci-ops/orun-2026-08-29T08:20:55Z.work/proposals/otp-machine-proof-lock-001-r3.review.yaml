no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: role-bearer-identity
    counterexample: >-
      A gate service can be recreated and several holders can acquire in turn
      while the same repository-origin coordination target continues bearing
      one proof-resource role. The revised criterion follows the origin target
      and continuous coordination regime, not service-object, holder, or lock
      path identity, so it survives.
    outcome: survived
  - surface: warrant
    rule: support-term-not-necessary
    counterexample: >-
      CQ-008 can distinguish contenders by relating each SeatGrant to a generic
      origin-scoped ContendedResource identified by originKey. The question
      does not require those resources to instantiate the specialized
      MachineProofLock class, so the named support term is not necessary for
      SeatGrant or for the CQ answer.
    outcome: landed
  - surface: null_discriminator
    rule: deployed-contention-discriminator
    counterexample: >-
      A service DTO could expose acquire and release methods without recording
      real contention, but the branch attempt journal records lock-contention
      verdicts and the KPI counts proof-lock bounces with owner and lock-path
      evidence. That deployed fact is false in the pure-interface twin.
    outcome: survived
rival_models_still_viable:
  - "A generic origin-scoped contended resource without a proof-lock subclass."
  - "A lock-acquisition relator between a holder and repository origin."
