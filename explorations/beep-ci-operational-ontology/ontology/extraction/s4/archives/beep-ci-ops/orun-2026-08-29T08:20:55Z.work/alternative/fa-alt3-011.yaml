strongest_counterexample: admissionInstantOrder sorts by admittedAtMillis, then pid, then
  startedAt, and isOvershootLoser uses that order so the newest admission rolls back. The
  comment forbids using heartbeat. A tie-breaker-only field that never decided rollback would
  not be this instant.
verdict: analyzed
needed_evidence: Whether sameness tracks the staging occurrence (event) or the numeric stamp
  as a quality of the lease. Two leases staged in the same millisecond already split on pid
  and startedAt, which slightly favors the occurrence reading but does not close the quality
  reading.
