term:
  local_name: ScheduleProposal
  preferred_label: schedule proposal
  proposed_iri: https://oip.law/ontology/ci-ops#ScheduleProposal
  owl_entity_kind: class
definition:
  text: An ordered schedule information artifact that, when materialized for a VerificationEpisode, is linked as
    that episode's current proposal and prescribes the applicable WorkUnit sequence and scope. CQ-020 requires this
    current ordered prescription; the present closure does not settle whether deployed RepoRunPlan values are retained
    as its A-Box instances.
