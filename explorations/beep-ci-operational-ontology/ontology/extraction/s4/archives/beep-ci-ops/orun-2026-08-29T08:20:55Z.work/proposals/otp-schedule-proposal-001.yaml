alternatives_rejected:
- 'Implementation-artifact-only null rejected. Rationale: The proposed referent is a repeatable prescription whose
  steps may be executed more than once; it is not the dated run that follows the prescription. Discriminator: The
  cited plan composes a run context with an array of planned command specifications, and the cited comparator gives
  those specifications a deterministic phase-then-identifier ordering used by the plan.'
- 'Rejected weak denotation alternative: VerificationEpisode execution.'
- 'Rejected non-viable foundational model: VerificationEpisode execution.'
open_issues:
- Steward choice remains open between a materialized current schedule artifact and a transient planner DTO. A retention
  trace linking a RepoRunPlan output to a persisted ScheduleProposal and the episode's hasCurrentProposal update
  would decide the deployed A-Box claim.
