attacks:
  - surface: identity
    rule: "deferred-component-composite-identity"
    counterexample: "A pre-push-only prescription and a cheap-gates-plus-pre-push composite have different parts and unity. The revision now marks identity unresolved, sets foundational status explicitly_deferred, and names that exact choice, so it no longer silently identifies the component with the composite."
