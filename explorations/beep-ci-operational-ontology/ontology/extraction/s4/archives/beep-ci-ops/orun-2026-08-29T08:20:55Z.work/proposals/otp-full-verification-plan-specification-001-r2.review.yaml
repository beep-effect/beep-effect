  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "A pure dispatcher can map the full string to a freshly constructed pre-push step DTO exactly as quoted. That fact remains true without an enduring plan-specification referent, so the current discriminator does not settle the deferred denotation."
    outcome: landed
