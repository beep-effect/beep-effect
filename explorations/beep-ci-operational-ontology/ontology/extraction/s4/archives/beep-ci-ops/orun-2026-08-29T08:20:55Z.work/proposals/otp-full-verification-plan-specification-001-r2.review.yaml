  - surface: warrant
    rule: "semantic-support-necessity"
    counterexample: "If evidence from only the pre-push member is treated as evidence for the composite full plan, it can over-discharge a verification obligation. A plan-specification distinction is therefore genuinely needed to constrain VerificationEvidence, even though the selected identity remains deferred."
