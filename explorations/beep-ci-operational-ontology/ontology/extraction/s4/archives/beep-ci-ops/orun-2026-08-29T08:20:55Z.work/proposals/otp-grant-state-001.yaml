definition:
  text: A governed grant-state vocabulary specification whose deployed ActiveGrant value classifies a live SeatGrant lease
    while it is heartbeated and charged against capacity. CQ-008 and CQ-009 require that active classification; queued contenders
    are SeatRequests, and lease deletion ends the deployed grant record rather than supplying evidence for a ReleasedGrant
    phase.
