no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: deferred-snapshot-token-individuation
    counterexample: >-
      Two independent status reads can return byte-identical payloads, while one
      captured payload can be copied into two carriers. The proposal and card
      correctly leave capture-token identity unresolved and name the timestamp,
      scope, and provenance needed to distinguish those cases.
    outcome: survived
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      CQ-023 can compute observedQueueWaitMs from a SeatRequest enqueue instant
      and a collector boundary retained directly, or can retain the computed
      assertion itself. The revised definition and open issue expressly concede
      that no AdmissionSnapshot individual is needed, while operational_warrant
      still asserts necessary semantic support for observedQueueWaitMs.
    outcome: landed
  - surface: null_discriminator
    rule: runtime-capture-not-inert-dto
    counterexample: >-
      A schema declaration alone would be implementation-only, but the closure
      also identifies the deployed admissionStatus and snapshotAdmissionState
      procedures and the governed point-in-time machine-state content. A transient
      carrier can still realize an information artifact, so DTO transience alone
      does not erase the runtime capture referent.
    outcome: survived
rival_models_still_viable:
  - "The live admission-state situation is the world-side referent and the snapshot is its information projection."
  - "The capture is an extensional response value whose token identity remains unresolved."
