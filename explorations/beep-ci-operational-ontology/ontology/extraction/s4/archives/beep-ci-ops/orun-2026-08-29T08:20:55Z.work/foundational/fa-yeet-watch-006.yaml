strongest_counterexample: >-
  The configured text patterns also match deterministic deadlocks and
  consistently under-budgeted suites. Thus a ci-timeout match records
  satisfaction of a repeatable recognition rule; it does not establish one
  transient cause, one occurrence, or even flakiness. An extensional
  occurrence-subkind model and a policy-role model nevertheless remain viable.
verdict: analyzed
