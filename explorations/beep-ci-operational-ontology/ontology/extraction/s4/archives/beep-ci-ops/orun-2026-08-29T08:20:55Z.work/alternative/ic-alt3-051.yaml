id: ic:alt3:051
hypothesis_ref: dh:turbo-cache:021
identity:
  supplies_identity: true
  identity_criterion: Two cache-plan decisions are the same iff they are the resolved cache
    decision for the same Turbo invocation, with one of the three observed outcomes caller-controlled,
    local-only, or remote-read. The tag vocabulary is evidence rather than the criterion.
  reidentification_key:
  - TurboCachePlan._tag
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: one invocation-scoped cache decision
  dependence: relational
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - quality
  - relator
  existential_dependencies:
  - the Turbo invocation
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states: []
counterexamples:
- description: A second invocation that happens to resolve to the same tag is a different
    decision; the schema describes the resolved decision for one invocation, not a global
    cache mode.
status: proposed
