strongest_counterexample: >-
  Skip groups neutral bucket evidence with skipped or skipping evidence. A
  neutral check may have executed, whereas a skipped check may not have done
  so, and each produces its own record. The member therefore cannot identify a
  single nonexecution event, though a broad terminal phase and distinct
  snapshot-bound information assignments remain viable rivals.
verdict: analyzed
