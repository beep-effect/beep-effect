no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: identity-criterion-counterexample
    counterexample: >-
      Fleet A and fleet B can deploy byte-identical parameter values while
      different authorities govern different applicability scopes. The card
      requires authoritative lineage, normative rule content, scope, and
      version, so value equality does not wrongly identify their policies.
    outcome: survived
  - surface: warrant
    rule: cq-term-necessity
    counterexample: >-
      A SeatRequest with a measured wait cannot be evaluated by CQ-023 unless
      it is linked to the governing AdmissionPolicy whose starvation bound the
      query reads. Removing the policy term destroys that requested comparison.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-config-dto
    counterexample: >-
      An arbitrary config DTO can feed branches, but it cannot also preserve
      the cited characterization of these values as chartered production
      defaults governing live priority aging and review-fix admission refusal.
      The authority plus deployed behavior makes the null twin non-equivalent.
    outcome: survived
rival_models_still_viable:
