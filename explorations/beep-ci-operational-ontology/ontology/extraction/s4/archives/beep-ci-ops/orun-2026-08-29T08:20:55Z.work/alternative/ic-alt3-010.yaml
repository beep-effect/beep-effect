  carries_identity: true
  supplies_identity: true
  unity: one admission file payload relocated as a quarantine object
  dependence: none
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - phase
  - event
  existential_dependencies: []
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
  - removed by hand from quarantine
  - successfully decoded and live
counterexamples:
- description: A dead-but-decodable lease is reaped, not quarantined; an empty file is skipped.
    Neither is this record.
