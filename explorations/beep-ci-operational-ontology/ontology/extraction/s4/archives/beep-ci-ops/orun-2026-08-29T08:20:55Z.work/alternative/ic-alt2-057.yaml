  unity: One specification per distinct review-fix proof-plan prescription in the planner.
  dependence: none
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - kind
  existential_dependencies: []
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: >-
    This planner specification binds --base and --head and contributes an empty GithubCheckLaneSpec collection; the RepoProofSurface
