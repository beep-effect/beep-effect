no_surface_reasons:
  taxonomy: >-
    The data-property proposal asserts no parents edge; no is-a or subproperty
    relation exists to test, so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: identity-card-entity-kind-mismatch
    counterexample: >-
      One request can be enqueued twice within a millisecond, and two requests
      can share a timestamp. The revised card supplies no event identity and
      treats each subject-plus-enqueue occurrence assertion separately, so the
      data property does not merge the occurrences by numeric value.
    outcome: survived
  - surface: warrant
    rule: cq-term-required
    counterexample: >-
      Removing enqueuedAt prevents CQ-021 from returning the enqueue instant
      for each queued SeatRequest. The value is projected, not merely named in
      explanatory prose.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      An unused timestamp field could be implementation-only, but it would not
      preserve the cited queue behavior that stamps the durable ticket and then
      compares that instant with current time to change effective priority.
      The operational temporal relation defeats the null twin.
    outcome: survived
  - surface: null_discriminator
    rule: prior-landed-attack-not-retired
    counterexample: >-
      The immediately preceding review of proposal digest
      2b6de0c2d8e73d8b6044d4718bf5803f29f54e4cab5ad3731ae8fa169889c7de
      landed discriminator-true-of-ticket-dto and an entity-kind attack. The
      current proposal's revision_log names only digest
      4ade3c9a294939800f1cbe7c0d3cbdeb7b0634d6f87cd17416c7f230a6042e42,
      so the chain does not record a synthesis response to the later landed
      rules; granting PASS would contradict the preserved review history.
    outcome: landed
rival_models_still_viable:
