no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: activation-continuity-deferred
    counterexample: >-
      One bearer can discharge an architecture contradiction and later incur
      the same kind of contradiction under the same rule version. The criterion
      now requires one continuing normative position and openly defers token
      reidentification pending case provenance, so it does not merge the two
      activations merely by equal participant fields.
    outcome: survived
  - surface: identity
    rule: relational-mode-alignment-conflict
    counterexample: >-
      The proposed obligation cannot exist without an obligated bearer, a
      governing norm, and a triggering contradiction. The proposal accordingly
      declares relational dependence, yet aligns the class to gufo:IntrinsicMode;
      an intrinsic mode cannot encode that externally dependent normative unity.
    outcome: landed
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      VerificationEvidence can record the generic obligation, producing
      procedure, and provenance needed by CQ-006 without instantiating an
      ArchitectureBoundaryObligation. The revised definition and open issue
      concede that this specialized class is unnecessary while the warrant
      continues to assert necessary support for VerificationEvidence.
    outcome: landed
  - surface: null_discriminator
    rule: normative-prose-discriminator
    counterexample: >-
      A passive label or DTO cannot require correction of a contradicting
      proposal or amendment of the governing architecture. The quoted rule
      imposes exactly that normative consequence, so the obligation is not
      exhausted by its textual carrier.
    outcome: survived
