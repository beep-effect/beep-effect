null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: "Runtime evidence shows that a live lease is weighted and heartbeated, is subject to owner-liveness reaping, and can be rolled back when concurrent promotion overshoots capacity. Those governed transitions support the active admission-lease record as an information artifact; a separate world-side grant relator remains a foundational rival."
  discriminator: "After admission the scheduler charges the lease's configured weight, refreshes its heartbeat, reaps it on owner-liveness failure, and rolls back a capacity overshoot."
