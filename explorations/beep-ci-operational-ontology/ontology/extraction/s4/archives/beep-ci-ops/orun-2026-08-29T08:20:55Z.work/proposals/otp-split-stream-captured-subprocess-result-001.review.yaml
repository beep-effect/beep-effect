no_surface_reasons:
  taxonomy: "The proposal asserts no parents edge; no is-a edge or valid subsumption relation is proposed to test."
attacks:
  - surface: identity
    rule: identity-criterion-unobservable
    counterexample: >-
      Two subprocess captures can yield identical exitCode, stdout, stderr, and
      truncated values. The criterion says they are distinct when produced by distinct
      capture acts, but the proposed record carries neither capture provenance nor a
      subprocess identifier, so no pair of records can be tested against that criterion;
      the FA correctly leaves identity explicitly deferred.
    outcome: landed
  - surface: identity
    rule: identity-and-foundational-record-agreement
    counterexample: >-
      A proposal marked `carries` whose IdentityCard supplied a different identity criterion or carried none, or a
      proposal marked `explicitly_deferred` over an FA with a different verdict, would
      launder an unresolved identity decision. Here the card records
      supplies_identity=false and carries_identity=true, and the FA
      verdict is `explicitly_deferred`; both agree with the proposal, so this
      consistency attack is survived.
    outcome: survived
  - surface: warrant
    rule: support-term-not-necessary
    counterexample: >-
      CQ-005 and CQ-006 require retained VerificationEvidence with applicability and
      discharge relations. A transient CapturedStreams return value is unnecessary,
      and the observations show no persistence or evidence use that would make this
      result class part of VerificationEvidence semantics.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-not-in-observations
    counterexample: >-
      The three observations expose a CapturedStreams class, a runCapturedStreams
      function declaration, and an options alias. They do not state that a child is
      spawned, streams are folded separately, an exit code is obtained, or a record is
      constructed. A pure transient return DTO with a stub runner satisfies them all.
    outcome: landed
