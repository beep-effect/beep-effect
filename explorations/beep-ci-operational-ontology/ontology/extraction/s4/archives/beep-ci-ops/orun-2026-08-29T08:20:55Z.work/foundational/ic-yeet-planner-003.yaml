id: "ic:yeet-planner:003"
hypothesis_ref: "dh:yeet-planner:009"
identity:
  supplies_identity: false
  identity_criterion: >-
    Membership check against the Yeet proof-tier procedure-specification domain
    in ic:yeet-planner:001: two occurrences represent the same review-fix
    tier-level specification only when they preserve the same review-fix proof
    definition, base-and-head parameter-binding rule, empty GitHub-check lane
    rule, applicability context, and version lineage. Concrete endpoint values
    help reidentify generated plan-step specifications, not the reusable
    tier-level prescription; the review-fix literal is only evidence.
  reidentification_key:
    - "repository policy and version lineage"
    - "review-fix proof definition"
    - "base-and-head parameter-binding rule"
    - "empty GitHub-check lane-selection rule"
    - "review-fix literal and generated step metadata as supporting evidence"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    One parameterized prescription joins the review-fix proof-step definition,
    the rule that appends base and head endpoints, and the decision to create no
    GitHub-check lane waves. Bound plan steps and their executions remain
    separate individuals.
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "subkind: an operational review-fix verification procedure realized by executions"
    - "information_object: a family of base-and-head-bound RepoPlanStep specifications generated by the tier rule"
    - "process: one repair or review-fix verification execution"
    - "none: absence of a verification procedure because the GitHub-check lane collection is empty"
    - "none: the review-fix literal as a selector with no domain referent"
  existential_dependencies:
    - >-
      The information content generically depends on at least one faithful
      digital or material bearer; no particular source token is necessary.
    - >-
      Its status as the current Yeet prescription depends relationally on a
      repository policy and revision, but that role does not supply identity.
    - >-
      The reusable rule does not existentially depend on particular base and
      head revisions or on an execution. Generated plan steps do depend on those
      endpoint values.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "superseded while retained as a historical specification"
    - "withdrawn"
    - "ceased when no faithful bearer remains"
counterexamples:
  - description: >-
      Applying review-fix to two different base and head pairs creates plan
      steps with different argument content and later distinct executions even
      though both were selected by the same tier literal.
  - description: >-
      The empty GitHub-check lane collection does not mean no verification is
      prescribed; the planner still constructs a local review-fix proof step
      with bound revision endpoints.
status: proposed
