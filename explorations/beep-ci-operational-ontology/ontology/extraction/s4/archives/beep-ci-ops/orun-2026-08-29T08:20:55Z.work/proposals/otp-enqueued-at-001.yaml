  preferred_label: enqueued at
  proposed_iri: https://oip.law/ontology/ci-ops#enqueuedAt
  owl_entity_kind: data_property
definition:
  text: A data relation from a SeatRequest to the instant at which its durable admission ticket enters the shared queue and
    from which elapsed waiting and priority aging are measured. CQ-021 requires this enqueue instant for every queued request;
    equal millisecond values do not identify enqueue events or request individuals.
