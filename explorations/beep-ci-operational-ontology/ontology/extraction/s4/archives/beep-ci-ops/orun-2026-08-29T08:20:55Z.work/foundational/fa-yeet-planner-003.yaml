strongest_counterexample: >-
  The same review-fix member can bind different base and head pairs, producing
  different concrete plan content and different executions. Conversely, its
  empty GitHub-check lane list does not suppress the local review-fix proof
  step. Any model that equates the member with one bound plan, one run, or no
  procedure at all therefore fails.
