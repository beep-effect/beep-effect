attacks:
  - surface: identity
    rule: deferred-capture-provenance-identity
    counterexample: >-
      Two subprocess executions can produce identical exit status, stdout,
      stderr, and truncation values. The card distinguishes them by capture act
      and recorded execution and explicitly defers reidentification because the
      present record shape does not expose that provenance.
    outcome: survived
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      CQ-005 and CQ-006 can be answered by other retained VerificationEvidence
      records with applicability and discharge provenance. The revised definition
      and open issue concede that this specialized result class is not necessary,
      while the warrant still asserts necessary support for VerificationEvidence.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-not-in-observations
    counterexample: >-
      The cited observations establish only the CapturedStreams class declaration,
      the runCapturedStreams function declaration, and the options alias. They do
      not observe a child spawn, separate stream folds, exit-code acquisition,
      record construction, retention, or evidence use; a transient stub-return DTO
      therefore satisfies the closure without the proposed retained artifact.
    outcome: landed
