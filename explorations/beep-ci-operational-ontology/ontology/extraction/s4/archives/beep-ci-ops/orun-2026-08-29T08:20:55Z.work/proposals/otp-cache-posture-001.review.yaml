  taxonomy: "The proposal asserts no parents edges, so there is no proposed subsumption relation to test; no valid subsumption relation is the present result."
attacks:
  - surface: identity
    rule: "token-content-identity-conflict"
    counterexample: "One resolver episode can produce a plan value, a serialized copy, and a deserialized copy. Treating records as tokens makes those three distinct, while the card merges them by episode, invocation, and content; treating them as abstract content instead makes the episode requirement wrongly separate equivalent decisions from repeated resolutions."
    outcome: landed
  - surface: identity
    rule: "analysis-card-consistency"
    counterexample: "The proposal's supplies identity and analyzed values agree with ic:turbo-cache:019 and fa:turbo-cache:019; a none or deferred declaration would fail, but is not present."
    outcome: survived
  - surface: warrant
    rule: "cq-referent-mismatch"
    counterexample: "CQ-024 asks for the posture under which a WorkUnitExecution actually ran. A remote-read resolution record can later be downgraded to local-only, so the proposed resolver-decision artifact can exist while the CQ's actual execution posture is different."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-tagged-dto"
    counterexample: "A pure tagged-union DTO can be invocation-scoped and enumerate caller-controlled, local-only, and remote-read branches. Those facts do not require a separately identifiable decision information object."
    outcome: landed
  - surface: identity
    rule: "rival-model-disclosure"
    counterexample: "Execution-borne posture and resolution-event outcome models remain viable and are both named in open_issues rather than silently merged."
    outcome: survived
rival_models_still_viable:
  - "The referent is a cache-posture mode borne by the WorkUnit execution rather than a decision information object."
  - "The referent is the outcome of a cache-plan resolution event rather than an enduring decision record."
