  rationale: "The runtime gate makes the pre-grant remainder an actual boundary condition of the admission situation: a candidate that fits may start, while a concurrent overshoot is rolled back before work. The value may still be ETL-derived rather than separately persisted, but derivation does not erase the contextual capacity referent."
