term:
  local_name: ContendedResource
  preferred_label: contended resource
  proposed_iri: https://oip.law/ontology/ci-ops#ContendedResource
  owl_entity_kind: class
definition:
  text: 'An anti-rigid resource role borne by a coordination target while multiple agents or executions can compete for its
    exclusive or capacity-limited use. CQ-008 directly requires this generic class so SeatGrants can identify which resource
    they hold. A repository-origin proof lock is one grounded bearer identified by originKey; holder changes leave the resource
    role intact and do not require a MachineProofLock subclass.'
