term:
  local_name: Agent
  preferred_label: admission owner agent
  proposed_iri: https://oip.law/ontology/ci-ops#Agent
  owl_entity_kind: class
definition:
  text: An admission-owner role borne by one causally continuous operating-system process while that process owns a queued
    SeatRequest or active SeatGrant. CQ-021 requires the owner of each queued request; pid and process-start values are reidentification
    evidence, while scheduler liveness checks against the operating-system process establish the world-side bearer.
