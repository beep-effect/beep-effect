alternatives_rejected:
- 'Implementation-only null rejected by the hardened discriminator: The scheduler ends lease ownership when the recorded pid
  is no longer live or its recorded process-start value no longer matches the current operating-system process.'
- 'Rejected weak alternative: uninterpreted fields copied between records.'
