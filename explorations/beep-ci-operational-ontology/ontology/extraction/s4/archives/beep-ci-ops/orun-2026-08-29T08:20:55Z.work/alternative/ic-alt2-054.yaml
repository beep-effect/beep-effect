id: ic:alt2:054
hypothesis_ref: dh:worktree-config:012
identity:
  supplies_identity: true
  identity_criterion: >-
    Two docgen verification-lane procedures are the same iff they are the same documentation-generation verification activity
    that binds edit-loop work to docgen:local and repository-wide work to full docgen; the command strings are evidence rather
    than the criterion.
  reidentification_key:
  - bun run docgen:local
  - bun run docgen
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: One procedure with two scoped work-specification variants.
  dependence: none
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - kind
  - process
  existential_dependencies: []
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: >-
    The pair of command descriptions is not two procedures: edit-loop versus repo-wide are scoped variants of one documentation-generation
    verification activity.
- description: >-
    A dated docgen run is not this procedure; the quotations prescribe which command to invoke, they do not timestamp an occurrence.
status: proposed
