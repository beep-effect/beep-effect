verdict: INDETERMINATE
needed_evidence: An independent governance or version-lineage artifact showing whether the closed publish/verify vocabulary is retained and revised separately from the aging comparator, plus the replacement identity card for whichever information object that evidence establishes.
surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: The proposal asserts no parents edge; no subsumption relation is proposed, so no valid subsumption relation is available to test.
attacks:
- surface: identity
  rule: identifier-is-identity
  counterexample: Two independently governed priority-vocabulary specifications can both contain the publish and verify labels while having different revision histories. Literal equality therefore cannot identify the specification; the revised proposal does not claim that it can and instead keeps the identity card unresolved pending governance evidence.
  outcome: survived
- surface: identity
  rule: unresolved-core-sortal-identity
  counterexample: One closed publish/verify vocabulary can remain unchanged while several independently versioned aging procedures rank its labels differently. The revision now limits the term to the vocabulary, leaves identity and rigidity unresolved, and explicitly requires a replacement card before reidentification, so it no longer forces the vocabulary and comparator to share one identity criterion.
  outcome: survived
- surface: identity
  rule: identity-card-consistency
  counterexample: Treating the term as identity-carrying or identity-supplying would resolve the card's unresolved provider booleans by fiat; the proposal also says unresolved, so that polarity inconsistency does not occur.
  outcome: survived
- surface: identity
  rule: foundational-status-mismatch
  counterexample: An analyzed status would conceal the foundational record's request for a governance or versioning artifact; both records instead say explicitly_deferred.
  outcome: survived
- surface: identity
  rule: rival-model-hidden
  counterexample: A separate controlled vocabulary plus ranking procedure, or a temporary effective-priority role, changes both individuation and category; both rivals are named in open_issues rather than silently merged.
  outcome: survived
- surface: warrant
  rule: cq-requires-term
  counterexample: CQ-021 explicitly projects each queued request's priority and declares AdmissionPriorityClass required, so removing the priority-class term would leave the requested priority binding untyped.
  outcome: survived
- surface: null_discriminator
  rule: discriminator-true-of-implementation
  counterexample: A queue implementation can store publish or verify strings and compute an aged numeric sort rank exactly as observed while those values remain only comparator codes; the rank expression is therefore true in the implementation-only null world and does not establish the narrowed vocabulary as an independently retained information object.
  outcome: landed
rival_models_still_viable:
- AdmissionPriority is one controlled vocabulary, while effectivePriorityRank is a separately versioned procedure.
- Effective queue priority is an anti-rigid role or phase of a queued request under elapsed-time context.
