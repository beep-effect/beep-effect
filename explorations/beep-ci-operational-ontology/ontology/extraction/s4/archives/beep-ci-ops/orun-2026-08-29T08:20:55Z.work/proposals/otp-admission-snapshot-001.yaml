foundational_status: explicitly_deferred
term:
  local_name: AdmissionSnapshot
  preferred_label: admission snapshot
  proposed_iri: https://oip.law/ontology/ci-ops#AdmissionSnapshot
  owl_entity_kind: class
definition:
  text: An admission-state capture information artifact that groups capacity, active charges, live leases, queued tickets,
    memory availability, and exceptional records at one observation boundary. It is necessary semantic support for
    capacityAtAdmissionTokens because CQ-010 defines that value as remaining capacity immediately before the new charge; the
    co-temporal capacity and active-charge content of the pre-grant capture distinguishes that value from a post-grant or
    otherwise mis-scoped remainder. The term denotes the point-in-time information content whether its carrier is transient or
    retained and does not claim that equal response values identify one durable capture token.
