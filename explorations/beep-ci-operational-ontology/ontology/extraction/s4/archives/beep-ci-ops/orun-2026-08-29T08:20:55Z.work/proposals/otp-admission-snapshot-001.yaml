open_issues:
- 'Steward choice remains open: A capture timestamp or event reference, machine and policy scope, and provenance showing whether
  repeated status values are distinct snapshot tokens would decide individuation.'
- 'Steward must choose whether to adopt the still-viable rival model: The referent is the live admission-state situation,
  and AdmissionSnapshot is only its information projection.'
- 'Steward choice remains open: AdmissionSnapshot may be an extensional response value rather than an independently
  reidentifiable record token; this proposal covers that rival by committing only to the capture information content and
  leaving carrier-token identity unresolved.'
