seat: ontoclean-adversary
verdict: INDETERMINATE
needed_evidence: >-
  Capture the effective Turbo cache arguments for caller-controlled executions
  and obtain a steward ruling on whether the occurrences are invocation modes,
  control-allocation situations, record content, or one reusable vocabulary value.
surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The individual proposal asserts no parents edge, so it proposes no is-a or
    subsumption relation and there is no candidate parent to retain instead of no
    valid subsumption relation.
attacks:
  - surface: identity
    rule: unresolved-takes-precedence
    counterexample: >-
      CI execution E1 can retain sanctioned remote access while explicit-argument
      execution E2 can disable caching, although both receive the same tag. The
      revision now correctly leaves category, rigidity, identity, and dependence
      unresolved and marks the proposal explicitly_deferred rather than identifying
      E1 and E2 as one homogeneous posture.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      E1 and E2 share the caller-controlled tag and proposed IRI while having
      incompatible effective permissions. The revised card explicitly says the
      shared tag does not decide whether they are two particulars or occurrences
      of one vocabulary value, so the technical identifier is not the criterion.
    outcome: survived
  - surface: warrant
    rule: cq-term-necessity
    counterexample: >-
      A CQ-024 answer that represents only LocalOnly and LocalWriteRemoteRead
      cannot classify CI or explicit-cache-argument executions under the three-arm
      closed posture domain. The caller-controlled value is therefore necessary,
      even though its foundational interpretation remains unsettled.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-tagged-dto
    counterexample: >-
      A resolver can emit {_tag: caller-controlled, reason: ci} and the same tag
      with reason explicit-cache-arg solely to decide whether the CLI rewrites
      flags. Both branches vary with invocation conditions while remaining a pure
      tagged DTO, so the cited facts still do not falsify the null.
    outcome: landed
rival_models_still_viable:
  - "An invocation-scoped cache mode"
  - "A control-allocation situation among caller, CLI, and execution"
  - "One controlled-vocabulary value in the CachePosture domain"
  - "Information content in a resolved cache-plan record"
