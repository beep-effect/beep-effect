      lane, scope, parameters, and completion and failure semantics, which is
      exactly the proposed decision term.
    outcome: survived
  - surface: null_discriminator
    rule: governed-prescription-discriminator
    counterexample: >-
      Incidental command text could be copied into a DTO without prescribing
      agent behavior. The cited canonical policy governs which affected-scope
      and full-repository docgen prescriptions agents may execute, so the
      normative lane-and-scope content is false in the stale-text twin.
    outcome: survived
