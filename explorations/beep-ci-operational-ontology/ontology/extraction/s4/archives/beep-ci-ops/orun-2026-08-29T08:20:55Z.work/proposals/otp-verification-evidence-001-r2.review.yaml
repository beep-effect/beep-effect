target: "otp:verification-evidence:001"
target_sha256: "5602817ee959c2ea5aa9d1e2f5ae8b688564899ac9bf187bb7432722639ce9f3"
chain_sha256: "c8d9fe9660aa76da14b95ededf9c2be8998f49fbf286be28a1e9ba529a8b7b19"
seat: ontoclean-adversary
verdict: INDETERMINATE
needed_evidence: >-
  An artifact identity and custody contract must decide whether identity follows
  result content, issued record lineage, or a contingently borne evidence role,
  and specify the effects of copying, correction, invalidation, supersession,
  and loss of faithful bearers.
surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: content-token-identity-underdetermined
    counterexample: >-
      Two executions can issue byte-equal results that must remain distinct by
      provenance, while one issued result can be copied into two stores that
      should remain one content object but two record tokens. The card names
      both criteria without choosing the entity being classified, so it cannot
      yet decide whether either pair is one VerificationEvidence individual.
    outcome: landed
  - surface: warrant
    rule: cq-requires-evidence-record
    counterexample: >-
      CQ-005 and CQ-006 cannot establish applicability or discharge from an
      execution outcome alone; they require recorded evidence tied to tree
      state, cache epoch, procedure, and provenance. VerificationEvidence is
      therefore directly required rather than merely mentioned or supported
      through another term.
    outcome: survived
  - surface: null_discriminator
    rule: role-bearer-model-underdetermined
    counterexample: >-
      A generic persisted result record can be produced by record, extract, and
      judge stages and contingently serve as proof under policy without being a
      rigid kind of VerificationEvidence. All cited facts remain true in that
      role-bearer world, so they do not decide class identity, rigidity, or
      dependence.
    outcome: landed
rival_models_still_viable:
  - "One result-content object with multiple faithful concretizations."
  - "Distinct issued record tokens with custody histories."
  - "A generic result artifact contingently bearing an evidence role."
evidence:
  - "po:sha256:3208242164204b626fdec9ccef8311690ae6f88aa2054338d6cffee34f6d0a4a"
  - "po:sha256:c13db8addc9d014305ab9aee478dec45f03d3b3cc65a65889949dbaf72b49303"
  - "po:sha256:c51e70098e7cb7f6170bccb102a0436b5741f45bbba0c983f6c9461886ece32d"
  - "CQ-005"
  - "CQ-006"
