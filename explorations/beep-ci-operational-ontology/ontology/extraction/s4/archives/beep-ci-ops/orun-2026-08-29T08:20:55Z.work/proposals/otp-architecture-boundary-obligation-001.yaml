alternatives_rejected:
- 'Implementation-only null rejected by the hardened discriminator: When a proposed slice, package, adapter, or dependency
  contradicts the governing architecture, repository policy requires either correction of that proposal or amendment of the
  architecture rule.'
open_issues:
- 'Steward choice remains open between representing the generic obligation as the selected extrinsic mode or as a normative
  relator connecting policy authority, obligated bearer, required verification, and discharge; CQ-006 requires the generic
  obligation either way.'
- 'An architecture-policy information object is a distinct rule specification that may activate a VerificationObligation;
  architecture-specific obligation subclasses remain deferred unless later decision requirements need them.'
