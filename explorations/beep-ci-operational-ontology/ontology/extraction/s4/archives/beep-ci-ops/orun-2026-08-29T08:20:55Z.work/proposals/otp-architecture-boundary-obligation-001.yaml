term:
  local_name: VerificationObligation
  preferred_label: verification obligation
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationObligation
  owl_entity_kind: class
definition:
  text: A relationally dependent normative mode requiring a bearer to obtain or supply verification under a governing policy.
    CQ-006 necessarily distinguishes the obligation to be discharged from the verification procedure that realizes it; an
    architecture-boundary rule may activate one such generic obligation without requiring an architecture-specific subclass.
