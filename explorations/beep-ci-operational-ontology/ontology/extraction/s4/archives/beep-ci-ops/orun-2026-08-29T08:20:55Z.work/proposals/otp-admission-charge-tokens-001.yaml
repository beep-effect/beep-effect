  preferred_label: admission charge tokens
  proposed_iri: https://oip.law/ontology/ci-ops#admissionChargeTokens
  owl_entity_kind: data_property
definition:
  text: A data relation that assigns a SeatRequest or SeatGrant the policy-defined token charge used by the live admission
    gate. CQ-021 requires the charge on each queued request, and CQ-010 requires the copied charge on the admitted grant to
    test whether that WorkUnit exceeded its immediately pre-grant capacity.
