no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: role-bearer-identity
    counterexample: >-
      A gate service can be recreated and several holders can acquire in turn
      while the same repository-origin coordination target continues bearing
      one proof-resource role. The criterion follows the origin target and
      continuous regime, not service object, holder, or path identity.
    outcome: survived
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      CQ-008 can distinguish holders by relating SeatGrants to generic
      origin-scoped ContendedResources identified by originKey. The revised
      definition and open issue concede that the specialized MachineProofLock
      class is unnecessary while the warrant still claims necessary support
      for SeatGrant.
    outcome: landed
  - surface: null_discriminator
    rule: deployed-contention-discriminator
    counterexample: >-
      A service interface can expose acquire and release without real contention,
      but it cannot preserve the attempt journal's lock-contention verdicts and
      the KPI's counted proof-lock bounces with owner and lock-path evidence.
      The deployed origin-scoped resource survives the interface-only null.
    outcome: survived
rival_models_still_viable:
  - "A generic origin-scoped ContendedResource without a proof-lock subclass."
  - "A lock-acquisition relator between a holder and repository origin."
