definition:
  text: A governed closed-vocabulary specification whose publish and verify values classify the priority recorded
    on a queued SeatRequest for CQ-021. The elapsed-time effective-rank procedure is a separate specification candidate,
    so changing its aging threshold does not silently change the identity of this vocabulary.
