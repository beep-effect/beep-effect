alternatives_rejected:
- 'Implementation-only null rejected by the hardened discriminator: The observed rank expression promotes an aged
  verify ticket to the same rank as publish priority, so recorded priority and elapsed queue time govern which request
  is considered first.'
- 'Rejected weak alternative: sorting codes and comparator implementation only.'
open_issues:
- 'Steward choice remains open: A governance or versioning artifact must show whether the priority domain and ranking-plus-aging
  rule are one specification or two independently revised information objects.'
- 'Steward must choose whether to adopt the still-viable rival model: AdmissionPriority is one controlled vocabulary,
  while effectivePriorityRank is a separately versioned procedure.'
- 'Steward must choose whether to adopt the still-viable rival model: Effective queue priority is an anti-rigid
  role or phase of a queued request under elapsed-time context.'
