term:
  local_name: StarvationException
  preferred_label: starvation exception
  proposed_iri: https://oip.law/ontology/ci-ops#StarvationException
  owl_entity_kind: class
definition:
  text: A time-indexed admission situation recorded for a queued SeatRequest that policy recognizes as an exception to the
    declared starvation bound. CQ-023 directly requires this generic class and a closed HardFloorException member derived per
    request from the snapshot-global hardFloorEngaged assertion. The exception is scoped to that observation and does not
    reify or claim identity for a continuous below-floor interval across snapshots.
