  gufo_alignment: gufo:Endurant
ontoclean:
  rigidity: unresolved
  identity: unresolved
  dependence: unresolved
reuse:
  searched: true
  exact_reuse_found: false
  mappings: []
operational_warrant:
  competency_questions:
  - CQ-005
  - CQ-006
alternatives_rejected:
- 'Implementation-artifact-only null rejected. Rationale: The policy explicitly requires recorded evidence and identifies
  repository-wide output as proof, giving the record an evidentiary role. Discriminator: The browser-QA quotation
  requires evidence recorded through record, extract, and judge stages; that persisted result is distinct from the
  command or code producing it.'
- 'Rejected weak denotation alternative: verification execution outcome.'
- 'Rejected non-viable foundational model: Verification outcome situation or execution occurrence itself.'
open_issues:
- Steward must choose among one result-content object with multiple faithful concretizations, distinct issued record
  tokens with custody histories, and an existing result record contingently bearing the evidence role.
- An artifact identity and custody contract must state how copying, generation, correction, invalidation, supersession,
  and loss of faithful bearers affect identity before the explicitly deferred fields can close.
