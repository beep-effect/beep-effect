foundational_status: explicitly_deferred
term:
  local_name: VerificationEvidence
  preferred_label: verification evidence
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationEvidence
  owl_entity_kind: class
definition:
  text: An information artifact bearing an evidentiary role under a verification policy by recording a result together
    with the tree state, cache epoch, procedure, and provenance needed to determine applicability and discharge
    a verification obligation. CQ-005 and CQ-006 require the evidence record; its content-versus-token identity
    and custody semantics remain unresolved.
  source:
  - CQ-005
  - CQ-006
