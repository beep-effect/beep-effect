  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: role-bearer-and-identifier-test
    counterexample: >-
      A process can stop owning request R1 and later own R2 without ceasing to
      be that process, while a reused pid can belong to a different process.
      The card makes ownership anti-rigid, carries process identity, and treats
      pid and procStart as evidence rather than the identity criterion.
    outcome: survived
  - surface: warrant
    rule: cq-requires-term
    counterexample: >-
      CQ-021 explicitly asks which Agent owns each queued SeatRequest and
      requires Agent plus requestedBy. Removing the owner role makes that
      projected answer unavailable.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      A serialized owner tuple alone cannot preserve the cited liveness rule:
      the scheduler queries the actual operating-system process and terminates
      ownership when pid liveness or process-start continuity fails. That
      world-side bearer makes the implementation-only tuple insufficient.
    outcome: survived
rival_models_still_viable:
  - "The ontology may choose the underlying operating-system process rather than its admission-owner role."
  - "The serialized owner-coordinate tuple remains a distinct information artifact."
