id: ic:alt2:058
hypothesis_ref: dh:yeet-watch:016
identity:
  supplies_identity: false
  identity_criterion: >-
    Two skip check-outcome phases are the same iff they are the skipped condition of the same watched PR check, entered when
    raw skip/neutral (or skipped-state) evidence is classified as skip; the skip literal is evidence rather than the criterion.
  reidentification_key:
  - YeetCheckOutcome.skip
  - YeetWatchCheck.outcome
ontoclean:
  rigidity: anti_rigid
  carries_identity: true
  supplies_identity: false
  unity: One skip phase per watched check while its classified outcome is skip.
  dependence: intrinsic
ufo_analysis:
  candidate_category: phase
  alternatives:
  - information_object
  - quality
  existential_dependencies:
  - watched PR check
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
  - outcome transitions away from skip via snapshot differ
counterexamples:
- description: >-
    A check that never executed is not automatically in this phase: only skip/neutral buckets or skipped state classify as
    skip; unknown vocabulary falls through to pending.
- description: Two checks both classified skip are two phases (one per check), not one shared skip individual.
status: proposed
