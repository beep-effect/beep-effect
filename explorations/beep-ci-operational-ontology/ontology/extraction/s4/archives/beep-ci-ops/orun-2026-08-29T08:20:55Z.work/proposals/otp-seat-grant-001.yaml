term:
  local_name: "SeatGrant"
  preferred_label: "seat grant"
  proposed_iri: "https://oip.law/ontology/ci-ops#SeatGrant"
  owl_entity_kind: class
definition:
  text: >-
    An active admission-lease information artifact created by one successful
    promotion and counted against machine-wide capacity while its lease is
    live, heartbeated, and owned. Cleanup, owner reaping, or overshoot rollback
    terminates that active lease; whether it records a distinct world-side
    grant relator remains a steward choice.
