alternatives_rejected:
  - >-
    Serialization-only DTO rejected by the hardened discriminator: the runtime
    stages the live lease, charges its configured weight, refreshes its
    heartbeat, reaps it on owner-liveness failure, and rolls it back after a
    concurrent capacity overshoot.
open_issues:
  - >-
    Steward must decide whether the active lease artifact is the deployed
    SeatGrant or records a distinct relational grant in the operational world;
    the runtime transitions settle the artifact's governed role but not that
    world-versus-information choice.
