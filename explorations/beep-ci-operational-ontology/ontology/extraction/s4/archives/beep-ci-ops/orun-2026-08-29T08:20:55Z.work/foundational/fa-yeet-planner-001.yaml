id: "fa:yeet-planner:001"
hypothesis_ref: "dh:yeet-planner:007"
identity_card_ref: "ic:yeet-planner:001"
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
  - label: "Operational cheap-gates verification procedure subkind realized by each run"
    still_viable: true
  - label: "Family of context-bound RepoPlanStep specification individuals generated by one tier rule"
    still_viable: true
  - label: "Particular cheap-gates lane collection or verification execution"
    still_viable: false
  - label: "Assurance-tier individual identical to the cheap-gates selector"
    still_viable: false
  - label: "Literal selector token with no domain referent"
    still_viable: false
strongest_counterexample: >-
  One cheap-gates member yields different concrete lane collections on main and
  non-main branches, and the planner also embeds the rule in full-proof and
  repair contexts. The token therefore identifies neither one concrete plan nor
  one execution; the source also leaves an operational-procedure subkind viable
  unless governance treats the planning rule as an information object in its
  own right.
verdict: analyzed
