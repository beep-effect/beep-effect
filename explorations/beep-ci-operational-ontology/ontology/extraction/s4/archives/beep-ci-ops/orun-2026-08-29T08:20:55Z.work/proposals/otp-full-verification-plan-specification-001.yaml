alternatives_rejected:
- 'Rejected category collapse: The assurance tier itself is distinct from any member-level or composite plan specification.'
open_issues:
- 'Steward choice remains open for the internal full-selector boundary: define whether full identifies one composite plan,
  a member-level pre-push prescription, or a family of context-bound plan-step specifications. All are covered by the generic
  VerificationPlanSpecification class and do not affect its CQ-020 warrant.'
- 'An identity contract must define revision and contextual-copy identity; retention is a carrier concern because both retained
  artifacts and transient plan DTOs may concretize the same prescribed plan content.'
