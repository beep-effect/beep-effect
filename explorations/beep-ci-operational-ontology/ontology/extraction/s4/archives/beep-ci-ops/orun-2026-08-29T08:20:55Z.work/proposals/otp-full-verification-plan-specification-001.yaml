term:
  local_name: VerificationPlanSpecification
  preferred_label: verification plan specification
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationPlanSpecification
  owl_entity_kind: class
definition:
  text: A repeatable information object prescribing an ordered verification WorkUnit sequence and its applicable scope. CQ-020
    requires that plan content to distinguish an episode's current ScheduleProposal from the dated execution that realizes it.
    A full-proof selection, its cheap-gates and pre-push members, and context-bound plan steps are accommodated as plans or
    constituent specifications; a transient dispatcher DTO may carry the content without changing its denotation.
