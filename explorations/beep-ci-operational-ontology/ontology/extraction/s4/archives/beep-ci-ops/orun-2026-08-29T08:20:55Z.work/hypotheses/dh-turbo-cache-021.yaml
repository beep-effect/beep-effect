cq_warrants:
- CQ-024
proposed_referent:
  label: Resolved cache-plan decision for one Turbo invocation
  description: An invocation-specific information artifact whose observed alternatives are caller-controlled, local-only,
    and remote-read.
representation_status: information_artifact
alternatives:
- label: A cache posture borne by a WorkUnit execution rather than a decision information artifact
  representation_status: domain_referent
  plausibility: viable
- label: Only the tagged-union representation used by the CLI
  representation_status: implementation_artifact_only
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The resolver produces one exhaustive invocation decision and the argument formatter turns that result
    into Turbo cache arguments or deliberately injects nothing. LocalOnly and CallerControlled already survived
    as member terms, so leaving CachePosture non-denoting would orphan live members; conversely, a live domain with
    either member treated as non-denoting would contradict the resolver's exhaustive operational branches.
  discriminator: For each Turbo invocation, the resolved plan injects local-only cache arguments, carries the selected
    remote-read mode, or leaves CI and explicit cache arguments caller-controlled.
epistemic_status: proposed
