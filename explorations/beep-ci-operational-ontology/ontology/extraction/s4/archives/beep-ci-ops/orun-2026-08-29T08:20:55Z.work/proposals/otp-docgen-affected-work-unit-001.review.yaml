attacks:
  - surface: identity
    rule: identity-criterion-counterexample
    counterexample: >-
      origin/main can advance between invocation I1 and I2, changing the concrete
      file set while the symbolic docgen scope rule remains unchanged. The criterion
      correctly identifies one reusable specification and keeps the two bound
      execution contexts distinct.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      A second command named docgen:local can implement different completion or
      dirty-file semantics. The technical command key alone is insufficient under
      the card's procedure, scope-rule, applicability, and policy criteria.
    outcome: survived
  - surface: identity
    rule: specification-execution-split
    counterexample: >-
      Runs I1 and I2 have distinct resolved commits, dirty snapshots, and outputs,
      but the proposal and card treat the WorkUnit as the reusable prescription,
      not either dated execution.
    outcome: survived
  - surface: identity
    rule: foundational-status-and-rival-disclosure
    counterexample: >-
      An execution-bound plan with concrete base, target, and dirty snapshot remains
      viable alongside the symbolic plan. The analyzed status matches the FA and
      the open issue exposes that rival.
    outcome: survived
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: >-
      CQ-002 is answerable with any A-Box WorkUnit linked by admissibleFor,
      executesLane, targetsTier, and requiresLane. It requires the WorkUnit class
      and relations, not this named docgen individual; a lint work unit alone can
      satisfy the query. The listing CQ therefore does not license this term.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-command-config
    counterexample: >-
      A documentation-only command configuration can bind docgen:local to
      origin/main...HEAD plus dirty files and be invoked in edit loops while
      remaining an implementation instruction. That pure configuration twin makes
      the discriminator true without the proposed ontology individual.
    outcome: landed
