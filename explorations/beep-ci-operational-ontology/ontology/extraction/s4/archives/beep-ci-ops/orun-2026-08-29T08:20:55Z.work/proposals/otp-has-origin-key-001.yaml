  owl_entity_kind: data_property
definition:
  text: A data relation from a SeatRequest or SeatGrant to the nonempty, scheme-scoped origin key compared by the scheduler
    for concurrent-grant exclusion. CQ-009 requires this relation to detect two active grants sharing an origin; lexical equality
    is operational join evidence and does not identify the repository origin or a separate key object.
