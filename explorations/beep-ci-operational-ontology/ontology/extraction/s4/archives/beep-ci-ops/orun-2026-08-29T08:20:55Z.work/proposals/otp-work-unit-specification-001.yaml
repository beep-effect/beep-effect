  local_name: WorkUnitSpecification
  preferred_label: work unit specification
  proposed_iri: https://oip.law/ontology/ci-ops#WorkUnitSpecification
  owl_entity_kind: class
definition:
  text: >-
    A reusable verification prescription whose identity-bearing content fixes
    one lane, scope rule, parameters, ordering-relevant semantics, completion
    criteria, and failure semantics, independently of any dated execution or
    carrier copy. CQ-002 requires this lane-by-scope scheduling object; an
    unrelated governing-policy revision is provenance, not an identity change.
  source:
    - CQ-002
