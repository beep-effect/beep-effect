no_surface_reasons:
  taxonomy: The revised proposal asserts no parents edges; there is no is-a edge to test, and no valid subsumption relation
    is proposed.
attacks:
- surface: identity
  rule: token-content-identity-conflict
  counterexample: One resolver episode can produce a plan value, a serialized copy, and a deserialized copy. Treating records
    as tokens makes those three distinct, while the card merges them by episode, invocation, and content; treating them as
    abstract content instead makes the episode requirement wrongly separate equivalent decisions from repeated resolutions.
  outcome: landed
- surface: warrant
  rule: cq-referent-mismatch
  counterexample: An execution can be planned for remote reads and then run local-only after authorization fails. The three
    execution-borne posture terms can classify the actual run without any resolver-decision artifact, so changing the support
    targets does not make this planned classification necessary for CQ-024.
  outcome: landed
- surface: null_discriminator
  rule: discriminator-true-of-tagged-dto
  counterexample: A pure tagged-union DTO can be invocation-scoped and enumerate caller-controlled, local-only, and remote-read
    branches. Those facts do not require a separately identifiable decision information object.
  outcome: landed
rival_models_still_viable:
- The referent is a cache-posture mode borne by the WorkUnit execution rather than a decision information object.
- The referent is the outcome of a cache-plan resolution event rather than an enduring decision record.
