  - surface: warrant
    rule: "support-necessity-underdetermined"
    counterexample: "CQ-010 can be answered when the ETL writes the pre-grant remainder directly on SeatGrant and retains no AdmissionSnapshot, but a provenance-preserving ETL may require a snapshot reference to distinguish pre-grant from post-grant state. The supplied closure does not show which pipeline exists."
