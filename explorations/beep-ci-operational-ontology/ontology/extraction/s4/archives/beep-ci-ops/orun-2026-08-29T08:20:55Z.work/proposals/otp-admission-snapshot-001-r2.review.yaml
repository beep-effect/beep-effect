  - surface: null_discriminator
    rule: "discriminator-true-of-dto"
    counterexample: "An API response DTO can be documented as a point-in-time view and materialize capacity, charges, leases, tickets, and memory while possessing no independently reidentifiable snapshot token. That null-world twin preserves all cited facts."
    outcome: landed
rival_models_still_viable:
