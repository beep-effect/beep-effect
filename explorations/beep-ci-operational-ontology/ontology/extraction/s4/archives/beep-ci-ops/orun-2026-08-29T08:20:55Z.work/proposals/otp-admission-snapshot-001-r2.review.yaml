    rule: "unresolved-takes-precedence"
    counterexample: "One captured payload copied into two files and two independent status reads returning byte-identical payloads demand opposite token-identity answers. The revised card correctly leaves identity unresolved because no capture act, instant, or provenance distinguishes those cases."
