id: ic:ov-schedule-proposal:001
hypothesis_ref: dh:ov-schedule-proposal:001
referent_grain: Fixed prescription content for a particular represented projection problem and instant,
  including its ordered admission choices and explicit deferred partition; distinct from an emission occurrence
  and from actual admissions.
identity:
  supplies_identity: false
  identity_criterion: 'Proposed at fixed-prescription-content grain: sameness requires the same represented
    episode and projection problem at the same reference instant, with the same governing constraints
    and complete prescription of ordered request assignments, per-step scope, and deferred partition.
    Re-serialization can reproduce the same content; changing a constitutive prescription or context yields
    different content. A proposal identifier or digest tuple is a lookup carrier, not this criterion.'
  reidentification_key:
  - emitted proposal subject within its represented episode and projection input, for lookup only
  - proposal id and projection instant fields as reidentification evidence, with no uniqueness claim inferred
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: The prescription accounts for the input's pending requests as one coordinated ordering-and-deferral
    decision. This functional unity comes from the complete schedule content, not from a container class
    name or a generation event.
  dependence: relational
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - a transient projection-result information object with no durable plan lifecycle
  - a separately issued plan record individuated by issuance rather than fixed prescription content
  existential_dependencies:
  - The represented projection problem, governing constraints, reference instant, and represented requests
    give the prescription its meaning.
  - A physical execution of the prescribed work is not an existential requirement; an unexecuted or fully
    deferred prescription is still intelligible information.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: 'Hypothetical counterexample: invoking the projector twice on the same explicit input yields
    byte-equal output as the contract requires, but produces two computation occurrences. Counting two
    distinct prescriptions solely from those invocations confuses content with its production. Conversely,
    identical step lists for different represented episodes or input contexts need not constitute the
    same contextual prescription.'
