cq_warrants:
- CQ-020
proposed_referent:
  label: Governing admission-projection specification
  description: An information object stating the rules under which an admission sequence is projected.
    The emitted specification representation carries policy and journal-prefix digests. Whether this represents
    a repeatable specification or an input-bound application context remains a live alternative; the observed
    type name and digest tuple do not settle that distinction.
representation_status: information_artifact
alternatives:
- label: Input-bound record of a projection context rather than a repeatable specification
  representation_status: information_artifact
  plausibility: viable
- label: Occurrence of running the projection engine
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The contract constrains order, token admissibility, determinism, and replay comparison, and
    the emitter and fixture represent a typed specification carrying input digests. This supplies a candidate
    description governing the ordered output, not merely a schema name. The policy-digest and journal-prefix-digest
    fixture strings are placeholders for represented operational input bindings; capture metadata and
    placeholder values warrant no separate referents. The normative starvation rule is a rule of the described
    projection contract, not proof that the deployed scheduler guarantees a wait bound. The dependence
    on a journal prefix keeps specification-versus-application-context analysis open.
  discriminator: The emitter emits "${specificationNode} rdf:type ciops-prov:AdmissionProjectionSpecification
    .", plus "ciops-prov:policyDigest" from proposal.policyDigest and "ciops-prov:journalPrefixDigest"
    from proposal.journalPrefixDigest; the fixture records all three. The contract prescribes "activeTokenTotal
    + weightTokens <= capacityMaxTokens" and "same input → byte-equal Turtle". Under the null, there would
    be no represented governing description tying those prescribed output constraints to this specification
    subject.
epistemic_status: proposed
confidence:
  value: 0.84
  use_for_acceptance: false
