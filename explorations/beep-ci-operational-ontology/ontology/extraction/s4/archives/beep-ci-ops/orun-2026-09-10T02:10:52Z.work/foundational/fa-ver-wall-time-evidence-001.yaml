notes: >-
  Analysis is complete for recorded measurement content. The unresolved
  dependence and still-viable rivals must remain visible in synthesis; no true
  physical duration, unique nested join, additive accounting partition, cost
  calibration pair, or new ontology commitment is established by this verdict.
