proposed_referent:
  label: Reported execution wall-time evidence
  description: Recorded durations and temporal bounds for particular attempts and their reported lane
    or step results. This information supplies the observed-cost side of execution accounting; it is not
    a P50/P95 estimate, an admission charge, a resource limit, or an episode-level time-to-certainty value.
    Whole-attempt elapsedMs and nested durationMs values must retain different scopes. The flattened set
    of config facts does not license a cross-product assigning every duration to every lane id, summing
    parent and child durations, or assuming that all measured intervals are disjoint. No estimate snapshot,
    queue/lock/repair decomposition, or completion of an entire assurance episode is established by this
    batch.
representation_status: information_artifact
alternatives:
- label: The bounded execution occurrence whose duration is reported
  representation_status: domain_referent
  plausibility: viable
- label: Uninterpreted timestamp and numeric serialization fields
  representation_status: implementation_artifact_only
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The values record quantitative claims about elapsed operational time, the actual-cost evidence
    needed for calibration and time accounting. Two explicit start/end pairs independently match their
    reported elapsed milliseconds, providing evidence of measurement content beyond the existence of numeric
    fields. The hypothesis preserves the reports as evidence without certifying clock accuracy or inventing
    per-lane associations lost by flattening. A missing duration or missing queue interval is not a zero-duration
    claim. These timestamps describe the reported attempts, not corpus capture provenance.
  discriminator: One observation has config_key_value objects "startedAt=2026-08-24T01:31:38.047Z", "endedAt=2026-08-24T01:31:42.503Z",
    and "elapsedMs=4456"; another has "startedAt=2026-08-27T15:26:36.585Z", "endedAt=2026-08-27T15:26:36.596Z",
    and "elapsedMs=11". Each end-minus-start interval equals its reported elapsed value. Those are particular
    elapsed-time claims that contribute different actual costs; under a fields-only null with no measurement
    referent, there would be no reported operational interval to measure or compare with an estimate.
epistemic_status: proposed
confidence:
  value: 0.88
  use_for_acceptance: false
