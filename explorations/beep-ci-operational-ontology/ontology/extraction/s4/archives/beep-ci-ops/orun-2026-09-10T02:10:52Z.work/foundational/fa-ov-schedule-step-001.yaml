id: fa:ov-schedule-step:001
hypothesis_ref: dh:ov-schedule-step:001
identity_card_ref: ic:ov-schedule-step:001
referent_grain: Represented instruction component at a place in one fixed admission prescription; distinct
  from the same request in other plans, a raw ordinal, and an actual admission event.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
analysis:
  identity_and_category: The admitted-only sequence restriction and the instruction's contextual structure
    support a prescription-component reading. Information-object classification follows that content,
    not the programming-language ScheduleStep name.
  rigidity: Under the fixed-component model, the object remains a prescription component even if its plan
    is obsolete or never enacted. Its ordinal is constitutive of this component; moving it belongs to
    a different prescription version.
  dependence_and_temporality: The component depends on its containing plan content and can persist as
    archived information. There is no observed mutable-step lifecycle, execution onset, or completion
    state.
  spec_vs_execution: A prescribed admission instruction can be emitted without any actual grant. It is
    not a work execution or a completed scheduler step.
  world_vs_information: Fixture step nodes demonstrate represented components only. Realizations, if later
    observed, would have separate occurrence identity.
  role_vs_bearer: Being assigned to a step is a contextual role of a represented request; the instruction
    component is not that request or its requester.
  context_reification: The existing containing prescription and ordered position provide context. A sequence
    representation can preserve it without an independently minted step individual.
  evidence_limit: The contract keeps the deferred tail outside the admitted sequence. It does not establish
    how step identity behaves under editing or supersession of mutable plans.
rival_models:
- label: Contextual sequence position or tuple without a separately reified component object
  still_viable: true
- label: Persistent editable instruction whose identity survives relocation between plan revisions
  still_viable: true
- label: Actual execution or completed admission event
  still_viable: false
strongest_counterexample: 'Hypothetical counterexample: the same request is first in one proposal and
  second in a later proposal after priorities change. Identity by request alone merges two different contextual
  instructions; identity by the raw number zero merges first steps from unrelated proposals. Neither a
  type assertion nor a step-0 suffix establishes the same execution occurrence.'
verdict: analyzed
