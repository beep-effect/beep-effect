cq_warrants: ["CQ-008","CQ-009"]
proposed_referent:
  label: "Grant release occurrence"
  description: >-
    An instance is one relinquishment/termination of an admitted grant recorded by
    admission-released and releasedAtMillis. It supplies an endpoint for that grant's recorded
    holding, whose beginning is the admission-admitted boundary. Twenty-one chains positively
    pair admission and release. The occurrence is distinct from the holding itself, the
    admission that confers it, withdrawal of a request, and lease eviction. A release record
    does not say whether work succeeded, failed, or completed any particular lane; release also
    does not prove voluntary intent. Optional memoryPeakBytes is reported measurement content,
    not the token charge, a physical memory limit, a per-lane wall duration, or a reusable cost
    estimate. No uninterrupted interval is inferred between the two recorded boundaries.
representation_status: domain_referent
alternatives:
  - label: "Information asserting that a grant was released, distinct from the release occurrence"
    representation_status: information_artifact
    plausibility: viable
  - label: "The grant's released condition or end boundary, without a separate termination occurrence"
    representation_status: domain_referent
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    The primary reading denotes the release that changes whether a grant can be treated as a
    holder. The first batch's operational grant histories and second batch's information
    histories disagree at this boundary; the information reading remains viable. An
    independently correlated lease relinquishment and charge-removal receipt would distinguish
    occurrence from assertion, while a separately linked execution verdict would be required to
    say what happened to the work. No success inference or resource quantity is supplied by the
    release tag alone.
  discriminator: >-
    The verified observation for (config_key_value,
    "nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088") pairs (config_key_value,
    "_tag=admission-admitted") and (config_key_value, "admittedAtMillis=1788926595216") with
    (config_key_value, "_tag=admission-released") and (config_key_value,
    "releasedAtMillis=1788927008574"). In the second batch, (config_key_value,
    "nonce=0ff912cf-d69b-4cd8-bf68-27293f6c0cce") has (config_key_value,
    "releasedAtMillis=1788930321941") with the release tag after its positive admission. The
    asserted release endpoint would be false if no release occurrence were denoted. Retaining
    the admission assertion while extending its holding past the asserted release would
    contradict the release content. Neither current state nor a verification outcome is the
    discriminator.
epistemic_status: proposed
confidence:
