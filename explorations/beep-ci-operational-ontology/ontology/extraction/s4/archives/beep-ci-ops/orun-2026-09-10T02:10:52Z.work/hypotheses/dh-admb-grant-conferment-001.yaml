cq_warrants: ["CQ-008","CQ-010"]
proposed_referent:
  label: "Grant conferment occurrence"
  description: >-
    An instance is one admission occurrence that confers a particular charged grant on a
    request, dated by admission-admitted and admittedAtMillis. That event marks the change from
    the request's waiting history to the grant's holding history. It is not the holding interval
    that follows, the request that precedes it, a later release, or execution of a verification
    lane. All 28 positively admitted chains support this candidate, including five whose
    admission entry carries enqueuedAtMillis without a separately supplied enqueue event. Only a
    recorded conferment instant is available; the duration and atomicity of the scheduler
    operation remain unknown.
representation_status: domain_referent
alternatives:
  - label: "The journal assertion of admission, with occurrence truth awaiting independent corroboration"
    representation_status: information_artifact
    plausibility: viable
  - label: "A grant's beginning boundary represented without a separate conferment event referent"
    representation_status: domain_referent
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    The event reading preserves the source alternative that granting is an occurrence distinct
    from its result. The two batches' domain/information rivalry remains viable at this
    boundary. A correlated ticket-to-lease transition or charge-allocation receipt, separate
    from the journal assertion, would discriminate operational conferment from a recorded claim;
    whether consumers must address that transition independently of the resulting grant would
    discriminate event reification from a grant-boundary model. A pre-grant capacity snapshot
    would additionally be needed to judge admission legality. No such snapshot is invented here.
  discriminator: >-
    The observed pairs (config_key_value, "_tag=admission-admitted"), (config_key_value,
    "nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088"), (config_key_value,
    "admittedAtMillis=1788926595216"), and (config_key_value, "weightTokens=5") record a
    positive conferment, distinct from the same chain's (config_key_value,
    "_tag=admission-enqueued") at (config_key_value, "enqueuedAtMillis=1788926595182").
    Likewise, the second batch pairs (config_key_value,
    "nonce=50cf32d3-9ced-4f0e-a394-d5d850c221ea") with (config_key_value,
    "_tag=admission-admitted"), (config_key_value, "admittedAtMillis=1788941118852"), and
    (config_key_value, "weightTokens=3"). Under the null that no admission occurrence is
    denoted, the positive claim that a charge was conferred at those boundaries would be false;
    a request timestamp by itself would not supply this discriminator.
epistemic_status: proposed
