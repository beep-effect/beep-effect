cq_warrants: ["CQ-008","CQ-009","CQ-010","CQ-021"]
proposed_referent:
  label: "Admission history information object"
  description: >-
    An instance is a correlated collection of journal assertions describing one request and any
    resulting grant across their observed admission boundaries. Enqueue or an enqueue timestamp
    supplies an observed beginning when present; admission, withdrawal, release, and the two
    distinct eviction events supply intermediate or endpoint assertions according to their own
    tags. A ticket-eviction-only collection has an unknown beginning; an enqueue/admission
    collection with no supplied endpoint has an unknown later status. The collection is neither
    one journal entry nor a single operational entity joining request, grant, occurrence, and
    execution identities. The 53 source chains are individual examples of this
    information-object kind, not 53 different kinds. The collection may preserve a past boundary
    after the request leaves the queue or a grant terminates; the observed event times do not
    date the information object's retention lifetime. A journal as a whole can contain many such
    histories. Cross-chain fields from the journal-wide projection must not be joined into one
    history.
representation_status: information_artifact
alternatives:
  - label: "An operational admission lifecycle involving a request and distinct grant, with its events as participants in the history"
    representation_status: domain_referent
    plausibility: viable
  - label: "An extractor-created grouping with no information-object referent beyond its constituent entries"
    representation_status: implementation_artifact_only
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    The second batch's admission/withdrawal/release/eviction history reading is preserved as a
    kind of information collection. The first batch's operational reading remains viable as the
    history's subject; treating the collection as a process would require an occurrence-level
    temporal and participation account, separate from record retention. An independently
    warranted consumer that distinguishes a complete or partial correlated history from
    individual entries would discriminate history reification from an extractor-only grouping; a
    replay/copy and cross-store correlation test would discriminate the information collection
    from the lifecycle it describes. None of these tests is silently assumed. The positive,
    correctly associated temporal content is proposed as decision-relevant information, with
    completeness left open.
  discriminator: >-
    For (config_key_value, "nonce=0ff912cf-d69b-4cd8-bf68-27293f6c0cce"), the reverified
    observation jointly preserves (config_key_value, "_tag=admission-enqueued"),
    (config_key_value, "enqueuedAtMillis=1788929720146"), (config_key_value,
    "_tag=admission-admitted"), (config_key_value, "admittedAtMillis=1788929720160"),
    (config_key_value, "_tag=admission-released"), and (config_key_value,
    "releasedAtMillis=1788930321941"). The first batch also supplies a positively terminated
    request history for (config_key_value, "nonce=3234b861-792e-4cde-96b6-5ca188435021") through
    (config_key_value, "withdrawnAtMillis=1788927676757"). A null that denies any
    domain-relevant informational content to these correlated histories cannot preserve their
    distinct claims of request withdrawal versus post-admission release. The conjunction
    distinguishes a demand, conferment, and later endpoint without inventing an actual complete
    lifecycle or claiming the nonce is an identity criterion.
epistemic_status: proposed
