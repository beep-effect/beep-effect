cq_warrants: ["CQ-021"]
proposed_referent:
  label: "Seat request"
  description: >-
    An instance is one submitted demand for scheduler capacity for a work invocation. Its
    recorded queue participation begins at admission-enqueued, or is retrospectively dated by
    enqueuedAtMillis on an admission record, and ends at an observed admission-admitted,
    admission-withdrawn, or admission-ticket-evicted boundary. The demand, an act that registers
    it, a subsequent grant, and the work execution are different candidate referents. All 53
    nonce chains concern a request; the two ticket-eviction-only chains identify the removed
    contender but supply no enqueue time, work kind, priority, or charge. The five
    lease-eviction chains carry an enqueue time on admission without a separate enqueue entry.
    These gaps do not license invented entries. Requested weightTokens is a demand, not an
    allocated holding; an origin key on a request does not establish active origin exclusion.
    Kind and priority remain separate attributes: merged-preview occurs with verify and publish
    priority, and full-proof also occurs with publish priority. Nonces correlate supplied
    assertions without establishing an identity criterion. Historical boundaries establish
    neither present queue membership nor a starvation verdict; the latter would require the
    declared bound and a relevant complete snapshot.
representation_status: domain_referent
alternatives:
  - label: "Information about a submitted capacity demand, carried by an admission-history record"
    representation_status: information_artifact
    plausibility: viable
  - label: "The act of requesting capacity, with the enduring request treated as the act's content"
    representation_status: domain_referent
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    The proposed referent is the contender described by the positive enqueue, admission,
    withdrawal, and ticket-eviction assertions. This selects the operational reading for the
    request kind while retaining the source batches' information-artifact reading as viable. A
    contemporaneous ticket registration/removal trace independent of journal production would
    discriminate operational queue participation from an assertion-only account; registration
    followed by continued queue participation would also distinguish the request from the
    registration act. The supplied evidence supports a denotation hypothesis, not a ratified
    identity or complete queue reconstruction. Capture pseudonyms and location placeholders
    supply no requester identity.
  discriminator: >-
    The opened observations contain (config_key_value, "_tag=admission-enqueued"),
    (config_key_value, "enqueuedAtMillis=1788927435322"), (config_key_value,
    "nonce=3234b861-792e-4cde-96b6-5ca188435021"), (config_key_value, "kind=merged-preview"),
    (config_key_value, "priority=publish"), and (config_key_value, "weightTokens=5"), followed
    for that nonce by (config_key_value, "_tag=admission-withdrawn") and (config_key_value,
    "withdrawnAtMillis=1788927676757"). The second batch independently supplies the same
    positive boundary distinction for (config_key_value,
    "nonce=355f5fd7-c1d1-49f9-9801-b9fa3048ea05"), with (config_key_value,
    "enqueuedAtMillis=1788927786743") and (config_key_value, "withdrawnAtMillis=1788928062034").
    The recorded claim is that a particular demand entered contention and was subsequently
    withdrawn. Under the null that these entries denote no operational contender, that claim
    would be false. This is evidence about the contender the entries purport to record, not
    independent verification of every recorded transition.
epistemic_status: proposed
