  counterexample: Place a deferred request beside the two steps in the serialization and treat physical
    adjacency as membership. The contract restricts steps to prescribed admitted actions and excludes
    the deferred tail from their numbering. The fixture's explicit hasStep assertions select its two components
    independently of line order. A semantically empty adjacency field cannot preserve that admitted-component
    distinction; an information-bearing membership field is the candidate under review.
