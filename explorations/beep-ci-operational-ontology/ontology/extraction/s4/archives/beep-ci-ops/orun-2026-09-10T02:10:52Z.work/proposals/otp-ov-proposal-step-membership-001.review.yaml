  counterexample: Two prescriptions can each have ordinal zero and can schedule the same request. Identifying
    memberships by either ordinal or request would attribute one plan's component to the other. The card
    instead includes the containing fixed prescription and its component; re-encoding that same membership
    preserves content, while membership in a different prescription is distinct. This relational dependence
    concerns informational structure and supplies no admission occurrence.
