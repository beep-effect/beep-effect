cq_warrants:
- CQ-020
proposed_referent:
  label: Admission schedule proposal
  description: An information object prescribing an ordered admission sequence for an explicit projection
    input and instant, with pending requests accounted for as prescribed steps or an explicit deferred
    tail. The fixture is an example of this representation; it does not establish that its prescribed
    admissions were granted.
representation_status: information_artifact
alternatives:
- label: Transient projection result whose plan content has no independent persistence
  representation_status: information_artifact
  plausibility: viable
- label: Occurrence of actual scheduler admission
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The quoted emitter and fixture serialize a typed proposal, and the contract gives its contents
    a decision-bearing interpretation: every pending request must be accounted for and every prescribed
    step must satisfy admission constraints. This supports a schedule-description candidate beyond the
    implementation object. The same contract reserves real admission writes to the deployed scheduler.
    Provisional emission is evidence of represented content, without ratifying vocabulary or granting
    operational authority.'
  discriminator: The emitter includes "${proposalNode} rdf:type ciops:ScheduleProposal ." and the fixture
    records both "ciops-prov:defersSeatRequest" and proposal typing. The property-suite quote requires
    "every pending request appears in the proposal exactly once (admitted step or explicit deferred tail)".
    Under an implementation-only interpretation with no prescribed schedule content, that complete prescription
    and deferral partition would have no represented object.
epistemic_status: proposed
confidence:
  value: 0.91
  use_for_acceptance: false
