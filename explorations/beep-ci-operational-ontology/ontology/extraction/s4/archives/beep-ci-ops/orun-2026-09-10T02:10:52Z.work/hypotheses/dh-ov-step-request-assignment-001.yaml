null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The fixture assigns its first two steps to distinct request subjects and the emitter constructs
    that request-target edge. The quoted implementation report explicitly limits the target to SeatRequest
    because the journal lacks work-unit-specification identity. This supports assignment content while
    preserving uncertainty about how a projection-local request description connects to a real request
    occurrence.
  discriminator: The emitter states "${stepSubject} ciops-prov:schedulesSeatRequest ${proposalNode}-request-${index}
    ."; the fixture links step-0 to request-0 and step-1 to request-1 on that predicate. The report says
    "the journal carries no work-unit-specification identity". The null would erase the observed request
    assignment; reinterpreting it as a work specification would contradict the quoted target limitation.
epistemic_status: proposed
