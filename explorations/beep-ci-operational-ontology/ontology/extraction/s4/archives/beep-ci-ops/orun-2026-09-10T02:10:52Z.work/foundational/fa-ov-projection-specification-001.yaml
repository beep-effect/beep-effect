id: fa:ov-projection-specification:001
hypothesis_ref: dh:ov-projection-specification:001
identity_card_ref: ic:ov-projection-specification:001
referent_grain: Governing-description information object whose exact grain is unresolved between a repeatable
  projection rule specification and an input-bound application-context record.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
analysis:
  identity_and_category: Both surviving readings concern descriptive information, so information_object
    is defensible at the coarse category level. The type assertion alone does not establish repeatability,
    a particular rule-version identity, or the sameness of applications; that identity decision is explicitly
    deferred.
  rigidity: Both retained readings describe information. Whether the hypothesized governing-specification
    classification is essential to that description or is an anti-rigid use of a more general description
    remains unresolved; the coarse information_object category does not settle governing rigidity.
  dependence_and_temporality: No execution occurrence is needed for a repeatable rule object to persist.
    The input-bound rival depends on a represented application context. No two-version or two-input observation
    establishes which changes preserve the represented individual.
  spec_vs_execution: Neither a normative description nor an input-context record is the computation that
    produces a schedule. The remaining ambiguity is specification versus specification application context,
    not specification versus CPU activity.
  world_vs_information: The target's descriptive content is separated from actual compliance by a deployed
    scheduler. In particular, the stated starvation rule is normative contract content, not evidence of
    a guaranteed observed waiting bound.
  role_vs_bearer: A description can govern a proposal in a contextual role; that role does not make the
    description the projection engine or its execution.
  context_reification: The representation must distinguish reusable rules from the input binding if the
    latter is recorded. The target may currently carry both; the observations do not license silently
    merging their identities.
  evidence_limit: The fixture illustrates a target carrying two digest literals. Neither the example values
    nor capture/generator provenance supplies an ontological identity criterion.
rival_models:
- label: A repeatable projection rule specification whose applications cite different input states
  still_viable: true
- label: An application-context information record combining governing rules with a policy and journal-prefix
    binding
  still_viable: true
- label: An occurrence of executing the projection engine
  still_viable: false
strongest_counterexample: 'Hypothetical counterexample: the same ordering and admissibility rules are
  applied to two different journal prefixes. If the specification changes identity solely because journalPrefixDigest
  changes, input provenance is promoted into rule identity. Conversely, merging all subjects with the
  same policy digest can collapse application-context records for different inputs. Both interpretations
  fit the single illustrated target.'
verdict: explicitly_deferred
needed_evidence: Observe two emissions under the same governing ordering/admissibility rules with different
  journal prefixes, together with an observation-backed account of whether their targets denote one reusable
  rule version or two application contexts. Also observe a rule revision with unchanged input so rule
  identity can be distinguished from input identity. The comparison must identify rule content and application
  binding independently of digest strings.
