  counterexample: Append a deferred request as a third array element and call it a step. The contract
    expressly limits steps to prescribed admitted actions and prevents the deferred tail from extending
    or renumbering the sequence. The emitted fixture types the two instruction components separately.
    This discriminates prescription components from arbitrary array positions; a tuple implementation
    preserving those instruction semantics remains a viable representation of the same information.
