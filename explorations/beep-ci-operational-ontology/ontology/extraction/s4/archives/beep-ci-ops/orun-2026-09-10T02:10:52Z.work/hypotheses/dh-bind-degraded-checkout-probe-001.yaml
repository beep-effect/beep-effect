  rationale: >-
    The observation reports config_key_value "binding_probe_status=degraded",
    "status=unavailable", and "exit_code=128" for the supplementary Git probes.
    Its snapshot head and branch do not turn those failed probes into a confirmed
    binding at the later probe instant. "turbo_local_cache_present=false" and
    "turbo_configuration_status=absent" are bounded probe results; they do not
    establish deletion, invalidation, or the absence of every possible cache.
    No proof applicability decision or operational failure classification consuming
    this degraded result is supplied. Identity-key spelling, external-path
