id: dh:att-origin-block-marker:001
observation_refs:
- so:sha256:3579a1da6705f9faca54483a1aa157e5c334fbf6b86590dd28a9fc01e0b360a5
- so:sha256:abbce590491db2bd6b6e52d239f73f85199da2e23652785f350d9b71f8a10f58
cq_warrants: []
proposed_referent:
  label: No separately warranted referent for the zero origin-block marker
  description: The observed zero-valued blockedOnOriginAtMillis member is retained as an implementation
    representation. The batch does not establish a contention onset, a zero waiting duration, the
    absence of origin contention, or a timestamp at the Unix epoch. The surrounding ticket data do
    not by themselves settle what this particular zero means.
representation_status: implementation_artifact_only
alternatives:
- label: A missing-value sentinel for an origin-block onset timestamp
  representation_status: implementation_artifact_only
  plausibility: viable
- label: A recorded beginning of an origin-contention interval
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: Each observation supplies the same config_key_value fact "blockedOnOriginAtMillis=0".
    Neither provides a nonzero boundary or the rule interpreting zero. The surrounding excerpts have
    enqueue and heartbeat times, but they do not show when origin blocking began or ended. Consequently
    this field cannot support the requested wait/lock decomposition or a negative assertion that no
    contention occurred. A decision rule or a transition with an interpreted nonzero onset would be
    needed to reject the null. ownerRef, ownerRefVariant, and placeholder paths in the surrounding
    ticket excerpt are capture provenance and cannot fill that gap.
  discriminator: ''
epistemic_status: proposed
confidence:
  value: 0.97
  use_for_acceptance: false
