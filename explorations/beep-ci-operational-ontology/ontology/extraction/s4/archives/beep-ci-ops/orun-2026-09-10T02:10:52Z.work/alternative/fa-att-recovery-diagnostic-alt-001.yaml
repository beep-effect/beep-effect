strongest_counterexample: "Reading the policy name as a failed attempt or as CQ-013 FailureSignature membership: so:sha256:37968f126c464470a069ac2051cb358a0a29720dd49df7256625cb4d17bfa2c6 places the diagnostic inside attempt 95843714-fd19-4195-b260-93f7410b95b4 with outcome=success. The information-object and occurrence-event models are observationally equivalent on current evidence; only the dated measurements are observed, not an independent recovery process."
verdict: analyzed
needed_evidence: "An independent observation of the standalone rebuild versus the lane rerun (separate process timings not copied from this payload) would discriminate record from occurrence. A demonstrated overlap from this diagnostic to attributedDelayMs or to a FailureSignature taxonomy (CQ-013), or a recovery-policy specification that is reused across attempts, is absent and must not be minted from the label. The two captures must remain one cost."
