id: otp:att-verification-attempt:001
hypothesis_ref: dh:att-verification-attempt:001
identity_card_ref: ic:att-verification-attempt:001
foundational_status: analyzed
term:
  preferred_label: verification attempt
  local_name: VerificationAttempt
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationAttempt
  owl_entity_kind: class
definition:
  text: >-
    An information object recording the account of one putative operational command
    invocation, with its associated start, terminal assertions when supplied, component-status
    claims and whole-attempt timing values. The originating recorded attempt account and its
    asserted associations individuate the proposed information unit; faithful copies preserve
    it; an added boundary or correction creates another content version. Separate reported invocations remain
    distinct despite a shared command or run. The account can be incomplete, replayed or false
    and does not establish a causally continuous execution process.
  source:
