cq_warrants:
- CQ-007
- CQ-008
- CQ-021
proposed_referent:
  label: admission journal entry
  description: An informational assertion about one admission event, carried by one bounded journal entry.
    An instance is the content of a single event block asserting enqueue, admission, withdrawal, release,
    lease eviction, or ticket eviction. Its asserted occurrence time is supplied by that event's timestamp;
    no separate record-creation time is inferred. A nonce chain can witness several entry instances and
    several operational referents, so it is neither one entry nor an additional referent kind. The journal
    as a collection, the extraction's file-level projection, and the request, grant, or event being reported
    remain distinct. This is an information-artifact candidate for preserving the evidential basis and
    temporal limits of request, holder, and queue-wait claims. Its CQ warrants concern that evidential
    support, not a new requirement to enumerate journal entries or permission to infer current state from
    historical reports. Writing, copying, or removing an entry is not itself the operational event that
    its content asserts.
representation_status: information_artifact
alternatives:
- label: The operational request, grant, or occurrence described by the entry as the primary referent.
    Comparing an observed operation with its separately appended, copied, or corrected assertion would
    discriminate that bearer from the informational entry; both can coexist.
  representation_status: domain_referent
  plausibility: viable
- label: Serialization-only content with no decision-bearing assertion. This is weakened by the dated
    queue and holding transitions in the supplied entries; it would need evidence that these fields carry
    no claims about operational history.
  representation_status: implementation_artifact_only
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The entry''s positive claim content is directly observed even when the truth of the claimed
    event has not been independently established. Keeping the assertion distinct from its referent preserves
    the evidential limits of queue, holder, and timing decisions. This selects the information-artifact
    reading of the journal representations, while retaining domain events and their participants as distinct
    candidate referents. It supplies no automatic warrant to mint a journal class: any later proposal
    must show the specific dependency on a decision term. Capture annotations, schema-version strings,
    and placeholder values are not additional domain vocabulary.'
  discriminator: 'For nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-admitted'', ''admittedAtMillis=1788926595216'', ''weightTokens=5'',
    ''_tag=admission-released'', ''releasedAtMillis=1788927008574'', ''memoryPeakBytes=9904820224''. For
    nonce=acb0011d-82cf-4dfc-a812-72d10dbd566c, the config_key_value predicate has these rechecked objects:
    ''_tag=admission-ticket-evicted'', ''evictedAtMillis=1788498598672'', ''reason=queued-submitter-death''.
    The matched excerpts place these assertions in separate bounded event entries. Under a serialization-only
    null there is no informational assertion of acquiring or relinquishing charged admission, or of removing
    a queued ticket at a stated time. These predicate/object pairs establish precisely that claim content.
    They establish the informational referent without proving either that the asserted event occurred
    or that its stated reason was true.'
epistemic_status: proposed
