    preserves different demand-associated enqueue and withdrawal assertions, including different
    attemptId associations; replaying them preserves that informational difference. Sitting-1 Ruling
    2 permits this information-object remedy. The revision_log covers the failed r1 digest and discriminator-true-of-dto,
    and the revision names effective insertion/removal and queue-consumer evidence for any later
    operational reading.
