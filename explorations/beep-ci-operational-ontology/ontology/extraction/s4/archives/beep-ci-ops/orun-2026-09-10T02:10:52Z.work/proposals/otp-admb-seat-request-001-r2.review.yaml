- surface: identity
  rule: registration-versus-enduring-demand
  counterexample: Withdraw unchanged intended work and resubmit it, while separately making a faithful
    copy of the first account. Work-kind/priority/charge equality cannot tell those cases apart.
    The revision selects originating demand account plus asserted content, preserving a faithful
    unchanged copy and separating correction versions; it does not apply the linked IC's old registration-continuity
    criterion as an established information identity. Whether one enduring demand-content bearer
    spans renewed registrations remains an explicit steward choice. The matching captures and separate
    3234b861/355f5fd7 histories support the bounded associations, without proving copy/resubmission
    behavior or using capture aliases as participants.
