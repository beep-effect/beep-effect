cq_warrants:
- CQ-020
proposed_referent:
  label: Recorded origin key used in deterministic request ordering
  description: An information value associating an admission request with an origin grouping used as a
    tie-break component of canonical projection order. The fixture value origin-test is an example literal.
    The batch does not establish repository identity, origin normalization, or an active-grant exclusion
    violation.
representation_status: information_artifact
alternatives:
- label: Domain repository-origin identifier with a separately established sameness criterion
  representation_status: domain_referent
  plausibility: viable
- label: Decorative label with no effect on projection order
  representation_status: implementation_artifact_only
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The emitted request.originKey value has a decision-relevant use in the quoted canonical sort
    tuple, so it is more than a placeholder name in these observations. The request fixture contains repeated
    origin-test values, but the subjects are requests and the output is a prescription. That repetition
    supplies no evidence of simultaneous active grants. The ordering warrant is supported here; the grant-exclusion
    question would additionally need a grant binding and active-state evidence.
  discriminator: The emitter writes "${subject} ciops:hasOriginKey ${turtleLiteral(request.originKey)}
    ."; three fixture request subjects carry "ciops:hasOriginKey "origin-test"". The determinism rule
    requires sorting by "(priority rank, enqueuedAtMillis, originKey, nonce)". Under a null in which this
    were only a decorative field, originKey could not serve the quoted order-determining role.
epistemic_status: proposed
confidence:
  value: 0.86
  use_for_acceptance: false
