proposed_referent:
  label: Request for scheduler admission
  description: A candidate admission request represented in a projection, distinguishable from a reusable
    work specification and from an issued grant. The batch shows typed request representations and a nonce
    carrier, with the pending-set reconstruction described in prose. It does not prove that the fixture
    requests existed in the live scheduler.
representation_status: domain_referent
alternatives:
- label: Projection-local information object describing a request
  representation_status: information_artifact
  plausibility: viable
- label: Reusable work-unit specification or grant under a different name
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The evidence goes beyond a source type declaration: request subjects are explicitly typed
    in both an emission template and a fixture, and the contract reconstructs pending requests at admission
    instants before selecting an actual recorded admission for comparison. This supports a request candidate
    as what the representation is about. The information-object alternative remains viable because this
    batch contains no individual lifecycle journal chain and does not establish process ownership or request-to-grant
    identity.'
  discriminator: The emitter quote emits "${subject} rdf:type ciops:SeatRequest ." and the fixture types
    request-0, request-1, and request-2 that way. The replay property reconstructs pending membership
    with "enqueuedAtMillis <= t < admittedAtMillis" and compares a projected choice with "the event's
    actual admission". A null denying any request referent would leave that quoted pending-to-admission
    comparison without its represented subject.
epistemic_status: proposed
confidence:
  value: 0.83
  use_for_acceptance: false
