- so:sha256:e1936767a2458fe5eb08ac5e2ba0887e7ac51f70d06111cead6e54b854e39c17
- CQ-008
- CQ-009
- CQ-010
evidence_reading: One matched history asserts admission with weightTokens=5 and a nonempty origin followed
  by release; another asserts admission followed by lease eviction. The last two assert admission without
  a supplied terminal report. CQ-008 and CQ-009 require time-qualified active holdings; CQ-010 distinguishes
  charge from remaining capacity immediately before conferral. Neither charge, origin, nor a release-time
  memory peak supplies the grant identity or a complete accounting snapshot.
evidence_limits: Current-run observed journal assertions only. No synthetic observation is used, and no
  owner-reference, resanitization, corpus, capture, or generator annotation supplies participant identity.
