id: fa:ov-proposal-step-membership:001
hypothesis_ref: dh:ov-proposal-step-membership:001
identity_card_ref: ic:ov-proposal-step-membership:001
referent_grain: Recorded component-membership assertion connecting one immutable prescription to one of
  its represented steps; not an admission occurrence.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
analysis:
  identity_and_category: Explicit membership and the admitted-step restriction supply schedule-structure
    content. The primary analysis addresses its record, while direct parthood and sequence encodings remain
    viable; no autonomous relation class is required.
  rigidity: A fixed membership assertion remains that assertion throughout its retention. In the chosen
    immutable-content reading, changing the prescription's constitutive components yields different prescription
    content.
  dependence_and_temporality: Membership depends on the containing prescription and component. Its truth
    is contextual to that version, not a claim about all future versions or an event interval.
  spec_vs_execution: Belonging to the prescribed step set does not mean a request was granted or its work
    executed.
  world_vs_information: The fixture records two memberships; these are facts about represented schedule
    structure, not two observed real admissions.
  role_vs_bearer: The represented component bears the part-in-this-plan position. The membership assertion
    is neither that component nor the scheduled request.
  context_reification: The containing proposal provides the necessary context. CQ-019 and CQ-020 traverse
    this structure; joining across proposal versions would misattribute scope or sequence.
  evidence_limit: The contract prescribes an exactly-once partition between steps and deferred requests.
    It does not make this batch a complete live-queue inventory or prove a scope-provenance obligation
    satisfied.
rival_models:
- label: A structural part relation recorded directly as a proposal-to-step property
  still_viable: true
- label: An ordered prescription with membership implicit in contextual sequence entries
  still_viable: true
strongest_counterexample: 'Hypothetical counterexample: two proposals both contain a step at ordinal zero,
  perhaps scheduling the same request. Merging their membership assertions by ordinal or request erases
  which prescription each step belongs to. Adding a deferred request as a step would likewise change the
  prescribed component set, despite no actual admission having occurred.'
verdict: analyzed
