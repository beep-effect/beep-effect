proposed_referent:
  label: seat grant
  description: A temporary authorization to occupy admission capacity for requested work. An instance
    begins at the admission-admitted boundary and its reported holding ends at admission-released or admission-lease-evicted.
    It is distinct from the preceding request, the occurrence of granting, the terminating occurrence,
    any execution it authorizes, and every journal representation. The 28 cited grant histories include
    21 releases, five lease evictions, and two admissions with no supplied terminal report. Those two
    open histories do not establish activity at capture or now. Token charge and a recorded nonempty origin
    key qualify the authorization; neither gives the complete active-holder population or remaining capacity
    immediately before admission. A release-time memory peak is a different quantity from token charge,
    predicted duration, or a hard execution limit. Released and evicted are lifecycle descriptions, not
    additional grant kinds. The paired nonce is a local evidential join, not an identity criterion for
    request and grant.
representation_status: domain_referent
alternatives:
- label: A journal account of charged admission with a reported or unknown end, leaving a separate authorization
    bearer unestablished. Time-aligned lease-store evidence and admission decisions that count the allocation
    would discriminate this information-only reading.
  representation_status: information_artifact
  plausibility: viable
- label: Admission and termination occurrences sufficient for holder accounting without a persisting grant
    bearer. Evidence that later resource decisions re-identify the intervening authorization as the same
    holder would discriminate this event-centered model.
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: Positive admissions with token charges and origins, followed in most histories by a positive
    release or lease eviction, support a temporary authorization rather than a queue request or formatting
    object. Both the information-object and occurrence-centered readings remain viable; the journal alone
    does not settle the grant's foundational category or identity. The two histories lacking a terminal
    report contribute evidence of acquisition only. These hypotheses license no current-holder, origin-exclusion,
    or capacity-safety verdict without the additional decision context.
  discriminator: 'For nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-admitted'', ''admittedAtMillis=1788926595216'', ''weightTokens=5'',
    ''originKey=4cc31eeb4dec'', ''_tag=admission-released'', ''releasedAtMillis=1788927008574''. For nonce=fe8a685d-5b73-4f88-ae2e-c776af84fbb2,
    the config_key_value predicate has these rechecked objects: ''_tag=admission-admitted'', ''admittedAtMillis=1788926455356'',
    ''kind=merged-preview'', ''priority=verify'', ''weightTokens=5'', ''_tag=admission-released'', ''releasedAtMillis=1788928685035''.
    The matched admission and release blocks report acquisition and relinquishment of charged, origin-keyed
    authorization. Under the no-grant null there is no acquired holding to relinquish; that would negate
    the operational interpretation of these paired assertions. Their content supports the candidate authorization
    while the journal-only interpretation remains viable.'
epistemic_status: proposed
