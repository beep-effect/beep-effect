evidence_reading: The first cited history asserts distinct enqueue, admission, and release boundaries.
  The second asserts enqueue at 1788941626093 and admission at 1788941816511 with weightTokens=5 but supplies
  no terminal report. Thus a granting assertion can be analyzed without asserting later activity, and
  charge at the boundary remains different from remaining capacity before it.
