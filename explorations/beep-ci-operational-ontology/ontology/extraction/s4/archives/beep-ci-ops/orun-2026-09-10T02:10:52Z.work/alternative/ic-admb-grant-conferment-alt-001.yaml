id: "ic:admb-grant-conferment-alt:001"
hypothesis_ref: "dh:admb-grant-conferment:001"
identity:
  supplies_identity: true
  identity_criterion: >-
    Two conferment occurrences are the same when they are the same dated
    transition that authorizes a particular charged grant for a particular
    request. The timestamp admittedAtMillis is evidence of when the assertion
    places the transition, not the criterion. so:sha256:0cb159aa5cd447c7b42d80f0dcd792382db039de48f6cedab98b7fa24eefd929
    distinguishes admission-admitted (admittedAtMillis=1788926595216,
    weightTokens=5) from admission-enqueued (enqueuedAtMillis=1788926595182)
    for nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088. The conferment is not the
    subsequent holding interval and not the request. ownerRef is not identity.
  reidentification_key:
    - "admittedAtMillis (boundary evidence)"
    - "nonce (chain correlation only)"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: >-
    One atomic dated authorization transition; duration and atomicity of any
    scheduler operation remain unobserved.
  dependence: relational
ufo_analysis:
  candidate_category: event
  alternatives:
    - information_object
    - relator
  existential_dependencies:
    - "the seat request being admitted"
    - "the seat grant whose holding this occurrence begins"
    - "contended capacity against which a charge is recorded (CQ-010)"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
    - "completed (the transition has occurred)"
counterexamples:
  - description: >-
      Treating enqueue as conferment fails: the 411b3ba7 chain
      (so:sha256:0cb159aa5cd447c7b42d80f0dcd792382db039de48f6cedab98b7fa24eefd929)
      places enqueuedAtMillis before admittedAtMillis; po:sha256:a8408e04e6bb8f46e4ff90294a80b9ca6d03d3ad48e77577e11b887e0f56733a
      reconstructs pending membership in that open interval.
  - description: >-
      Treating conferment as the entire holding would extend the occurrence
      through admission-released (releasedAtMillis=1788927008574) and collapse
      event into relator.
  - description: >-
      Inferring CQ-010 legality from weightTokens=5 without a pre-grant
      remaining-capacity snapshot invents capacityAtAdmissionTokens.
status: proposed
