cq_warrants: ["CQ-021"]
proposed_referent:
  label: "Request withdrawal occurrence"
  description: >-
    An instance is one removal of a request from admission contention recorded by
    admission-withdrawn and withdrawnAtMillis. It closes the recorded waiting segment that began
    at the same request's enqueue boundary. The 23 chains with this tag support the withdrawal
    kind; all include an enqueue assertion. Withdrawal is separate from the request it affects,
    ticket eviction diagnosed as queued-submitter-death, lease eviction, and grant release.
    Neither voluntary intent, an interruption cause, process death, a verification failure, nor
    an unobserved grant is inferred. Positive withdrawal closes a recorded boundary without
    proving a complete prior history or a present queue census.
representation_status: domain_referent
alternatives:
  - label: "An information assertion that a request was withdrawn"
    representation_status: information_artifact
    plausibility: viable
  - label: "The request's withdrawn condition, represented without a separate removal occurrence"
    representation_status: domain_referent
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    Withdrawal is selected as the operational endpoint needed to keep a historical enqueue from
    being treated as an ongoing queue candidate. The alternative information reading from the
    second batch remains viable; the first batch's withdrawal-event alternative is given its own
    kind. A request removal trace correlated to the withdrawn entry, with the operation's reason
    or trigger observed independently, would distinguish an occurrence from a report and
    determine whether any stronger voluntary/cancellation interpretation is justified. The
    source only supplies the withdrawal boundary, so the cause remains open.
  discriminator: >-
    For (config_key_value, "nonce=3234b861-792e-4cde-96b6-5ca188435021"), (config_key_value,
    "_tag=admission-enqueued") and (config_key_value, "enqueuedAtMillis=1788927435322") are
    paired with (config_key_value, "_tag=admission-withdrawn") and (config_key_value,
    "withdrawnAtMillis=1788927676757"). The other batch pairs enqueue with (config_key_value,
    "nonce=355f5fd7-c1d1-49f9-9801-b9fa3048ea05") and (config_key_value,
    "withdrawnAtMillis=1788928062034"). These are positive assertions of withdrawal of a
    contender, whose truth would be denied by the implementation-only null for the removal
    occurrence. Keeping the enqueue content but discarding the withdrawal content would
    contradict that endpoint. The absence of an admission entry is not the discriminator.
epistemic_status: proposed
confidence:
  value: 0.8
  use_for_acceptance: false
