proposed_referent:
  label: unscoped admission journal extraction projection
  description: A file-level extraction artifact that collects key/value occurrences across a journal's
    many event entries. An instance is bounded by the extracted file span rather than by one enqueue,
    admission, withdrawal, release, or eviction. Its flat fact list does not preserve the pairing of all
    values with their originating entries, even though the source excerpt retains those separate blocks.
    No additional request, grant, event, or agent is denoted by combining the flat values. The journal
    collection and its event entries are possible information objects distinct from this unscoped extraction
    wrapper. A mixture of schema-version strings is not evidence of an operational protocol switch. Capture
    provenance and placeholder tokens remain representation details, not domain vocabulary.
representation_status: implementation_artifact_only
alternatives:
- label: The admission journal as a historical information collection with preserved entry boundaries.
    A concrete decision requiring the collection itself, together with evidence of its scope and completeness,
    would discriminate that information-object candidate from an unscoped extraction wrapper. No such
    collection-level warrant is supplied here.
  representation_status: information_artifact
  plausibility: viable
- label: One admission grant bearing all flattened values. The separate excerpt blocks contradict that
    conjunction, so sharing a projected field list cannot establish one bearer.
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: The re-opened observation's config_key_value facts include 'nonce=07df5dce-9165-43a3-80d5-0e50b31fc3b8'
    and 'attemptId=cc521c01-ee2d-4ffa-9c43-75308c5118b0'. Its excerpt places the nonce in record 0 and
    the attempt identifier in record 16 under a different nonce. Those values therefore cannot jointly
    characterize one admission. Other flat values likewise come from distinct event boundaries. The wrapper
    contributes no additional operational transition or decision-bearing bearer beyond the separately
    interpretable entries, and the supplied CQs require no independent collection term. The null stands
    for this projection; its information-collection alternative remains viable only with the named additional
    warrant and evidence.
