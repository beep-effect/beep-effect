definition:
  text: >-
    An information object recording one putative grant's charged-admission account, with its
    asserted founding boundary, associated charge and origin context, and any reported release
    or lease-eviction boundary. The selected unit is the grant account carried by those
    associated assertions, not each physical entry or an effective authorization relation.
    Faithful copies of the same originating account and unchanged claims preserve the
    information unit; a corrected account is a different content version. Its content can
    remain available when the reported holding has ended or never became effective.
