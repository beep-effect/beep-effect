alternatives_rejected:
- 'Assignment to a reusable WorkUnit specification: the cited journal limitation expressly withholds work-unit-specification
  identity. Neither the request target nor its later grant may be substituted for that specification.'
- 'Rejected in fa:ov-step-request-assignment:001: Assignment to a reusable WorkUnit specification inferred
  from the request target. The preceding rejection rationale and retained counterexample state the boundary.'
open_issues:
- 'Warrant justification: CQ-020 needs the request target for each indexed step; an index and scope alone
  cannot identify the prescribed request sequence. CQ-019 also traverses this request-targeted step shape
  when testing the literal-tag scope-provenance arm.'
- 'Identity criterion carried from ic:ov-step-request-assignment:001: Proposed at assignment-assertion
  grain: sameness requires the same represented step in the same prescription context to target the same
  represented request. Changing either target or contextual component changes the content. The criterion
  does not assert that request descriptions in different projections denote the same live request.'
- 'Steward choice required before ratification of otp:ov-step-request-assignment:001: The steward must
  choose the recorded request-target assignment proposed here, a direct prescriptive relation to an operational
  demand once its continuity is established, or a request-valued sequence field without a separate assignment
  individual. The field representation is compatible with retaining assignment information, but does not
  itself prove that the target has cross-projection operational identity. The SeatRequest choice must
  be resolved with this relation. Still-viable models retained from fa:ov-step-request-assignment:001:
  Direct prescriptive relation to an operational request, once that request''s denotation and continuity
  are established; Request-valued field of a contextual ordered instruction, with no separate assignment
  individual.'
- 'Cluster dependency: otp:ov-schedule-step:001, otp:ov-schedule-proposal:001, otp:ov-seat-request:001.
  Coordinate ratification or parking where endpoint grain, component identity, or the stated warrant depends
  on these proposals; no dependent choice is settled by emission spelling.'
- 'Reuse search: The S5 inventory has no schedulesSeatRequest property. The scout report''s OSLC request/plan
  and P-Plan execution/step relationships concern different participants and do not exactly express this
  prescription-component-to-admission-request assignment.'
- 'Evidence boundary: the concrete emission-v2 instances cited here are synthetic. The quoted emitter
  sites show represented content, and the cited S7 prose describes its contract. They do not establish
  that the example requests, selections, steps, or admissions occurred in the live scheduler.'
- 'Representation grain: the proposed property encodes contextual information content without requiring
  a separate assertion individual. The OntoClean fields are inherited from the joined identity card for
  that candidate content, not asserted as identity criteria for an RDF literal or for the OWL property
  universal.'
- The property encodes the information assertion analyzed by the identity card. It does not equate a projection-local
  request subject with a live demand solely through a matching nonce, and it does not report an executed
  admission.
- 'Strongest counterexample carried from fa:ov-step-request-assignment:001: Hypothetical counterexample:
  one request is assigned to a first step in an old proposal and a later step in a new proposal. Identifying
  the assignments by request alone merges distinct prescriptions. Reinterpreting either target as a reusable
  WorkUnit specification additionally claims an identity which the quoted journal limitation expressly
  does not supply.'
