issues:
  - id: admission-scheduler-I01
    kind: ambiguity
    claim: "Source AdmissionRequest is an in-memory run-mode DTO, whereas ontology SeatRequest denotes the durable queued YeetAdmissionTicket."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.schemas.ts:285-320 — 'One admission request derived from a Yeet run mode.'"
    suggested_disposition: "Map SeatRequest only to YeetAdmissionTicket and keep AdmissionRequest as an implementation artifact."
    status: open
  - id: admission-scheduler-I02
    kind: missing-concept
    claim: "Admission deletes the ticket after creating the lease, so no persisted ticket-to-lease edge survives in the live store."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:961-967 — 'yield* fs.remove(ticketPath, { force: true }).pipe(Effect.ignore);'"
    suggested_disposition: "Do not propose grantedFrom; model queued tickets and active leases as disjoint snapshot carriers unless telemetry is extended."
    status: open
  - id: admission-scheduler-I03
    kind: schema-conflict
    claim: "Remaining capacity before grant is evaluated transiently but is not persisted on YeetAdmissionLease as capacityAtAdmissionTokens."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:661-664 — 'activeTokenTotal(state) + ticket.weightTokens <= capacityTokens'"
    suggested_disposition: "Require ETL or new telemetry to capture the pre-grant remainder; never treat a post-grant snapshot as the carrier."
    status: open
  - id: admission-scheduler-I04
    kind: missing-concept
    claim: "The deployed aging window promotes sort rank but does not provide the declared starvationBoundMs required by CQ-023."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:600-601 — 'nowMillis - ticket.enqueuedAtMillis >= config.publishAgingSeconds * 1000 ? 0 : 1'"
    suggested_disposition: "Keep publishAgingSeconds as a policy fact and source starvationBoundMs from the separately declared operational policy."
    status: open
  - id: admission-scheduler-I05
    kind: assumption
    claim: "PublishWork is deployed as a schema member and weight default but has no caller; publish proofs request FullProofWork at PublishPriority."
    evidence: "goals/ship-velocity/research/d1-admission-scheduler.md:41-46 — 'The publish kind (1 token) remains in the schema ... both follow-ups.'"
    suggested_disposition: "Retain the closed-domain member while marking it reserved and uninstantiated by current admission call sites."
    status: open
  - id: admission-scheduler-I06
    kind: ambiguity
    claim: "Scheduler quarantine classifies undecodable ticket or lease files as corrupt records; dead owners are reaped through a separate branch."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:518-522 — 'outcome.kind === \"malformed\" ? quarantineEntry ... : outcome.kind === \"dead\" ? reapDeadAdmissionEntry'"
    suggested_disposition: "Model corrupt-record isolation separately from Agent state and StarvationException; do not mint QuarantineException."
    status: open
  - id: admission-scheduler-I07
    kind: assumption
    claim: "A stale heartbeat is only a suspicion diagnostic and does not release or invalidate an active grant."
    evidence: "goals/ship-velocity/research/d1-admission-scheduler.md:64-67 — 'stale heartbeats mark suspicion but never kill.'"
    suggested_disposition: "Derive live grant membership from pid plus process-start liveness and lease presence, not heartbeat age."
    status: open
  - id: admission-scheduler-I08
    kind: ambiguity
    claim: "Configured token weights are nominal defaults because small hosts may clamp the persisted charge or bypass machine-wide admission."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:1144-1150 — 'const weightTokens = Math.min(request.weightTokens, machineCeiling);'"
    suggested_disposition: "Use ticket or lease weightTokens for instance admissionChargeTokens and keep admissionTokenWeight assertions as policy defaults."
    status: open
  - id: admission-scheduler-I09
    kind: missing-concept
    claim: "YeetAdmissionLease carries originKey but no contended-resource identifier, so contendsFor is not a direct lease-record lookup."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.schemas.ts:111-120 — 'priority: AdmissionPriority, originKey: S.String, checkoutRoot: S.String'"
    suggested_disposition: "Define an explicit ETL derivation from admission kind and call-site gate, or add a resource identifier before treating contendsFor as stored."
    status: open
  - id: admission-scheduler-I10
    kind: missing-cq
    claim: "suspectAfterSeconds and progressSeconds are deployed diagnostic cadence knobs with no Must or Should CQ warrant."
    evidence: "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.schemas.ts:274-276 — 'suspectAfterSeconds ... progressSeconds'"
    suggested_disposition: "Keep these values outside the ontology unless requirements add a decision that consumes them."
    status: open

