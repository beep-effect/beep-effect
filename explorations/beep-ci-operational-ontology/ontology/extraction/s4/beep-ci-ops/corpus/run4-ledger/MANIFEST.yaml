excluded_sources:
- lane ledgers under linked worktrees (existence probe only; P1 Ruling 2)
- attempt journals (owned by the run4-fleet capture; P1 note f)
- torn ledger lines and the unterminated tail (tallied and located per ledger, never emitted)
- checkouts whose origin is not the public repository (counted, never labelled)
- lock files and symlinks
checkout_path_encoding: UTF-8 percent-encoded single component; checkout labels remain verbatim in receipts
capture_only_members:
- capture_head
- corpus_base (ancestry advisory)
- capture_instant
- capture_finished_at
- cut.capture_check
- discovery.checkouts
- discovery.by_kind
- discovery.by_layout
- discovery.excluded
- discovery.lane_ledgers_present_not_read
- ledgers[].observed_at
- ledgers[].empty_lines
- ledgers[].torn_rows
- ledgers[].torn_line_ranges
- ledgers[].unterminated_tail_bytes
- ledgers[].source_line_ranges
- census.join_coverage.origin_present_at_capture
- census.join_coverage.origin_gone_at_capture
- census.join_coverage.origin_present_without_git_at_capture
- census.join_coverage.origin_owner_unresolvable_at_capture
- census.join_coverage.origin_owner_differs_at_capture
projection_rules:
- 'config_key_value channel: one .properties sibling for every raw payload'
- '# record <zero-based-index>; eligible leaf_key=value in source traversal order'
- ASCII alphanumeric/underscore keys; nonempty single-line strings, JSON numbers and booleans
- null, empty strings and CR/LF values omitted; duplicate pairs and scalar array leaves retained
- events count raw JSON records once; projections do not double-count events
- 'reuse key members fact.key.key and decision.key pinned as 11-hex prefixes (P1 Ruling 3 as amended:
  no value that short can exceed the gitleaks generic-api-key entropy cut); every other digest verbatim'
- originKey mapped to <fleet>/<label> (P1 note d); merged-preview process components written <process>
- row id is (checkout label, one-based source line ordinal); each ledger receipt's source_line_ranges
  maps the pinned records, in order, onto source lines; whole ledgers pinned (P1 Ruling 6)
- pairing runs over decoded rows; an unpaired row whose neighbouring raw line toward its missing partner
  is torn (or is the unterminated tail after a shadow) stays in the payload as issuance history, is counted
  as unpaired_adjacent_to_tear per ledger and in census.pairing, and is left out of pairs, hit resolution,
  the gate count and the paired census (P1 Ruling 2 addendum, brief W4-A6); any other unpaired row fails
  the capture; torn_line_ranges locates each tear so verify recomputes the pairing from pinned bytes
redaction_rules:
- 'All families: longest host-root match at start, after a character outside ASCII alphanumeric, underscore,
  dot, tilde, slash and hyphen, or after a slash preceded by slash or colon; relative path continuations
  survive'
- URI authority pre-pass preserves scheme and authority, with a slash before the host-root token
- fleet root is <fleet>; home is <home>; temp roots are <session-tmp> and <tmp>; runtime is <runtime>;
  proc is <proc>; shared memory is <shm>
- Per-user systemd unit identifiers become <uid>; proc process-directory identifiers become <process>
- Process identity members dropped recursively; complete serialized process scalar values replaced
- JSON keys and values consume escaped character pairs; nested string serialization retains its depth
- Structural keys and non-process numbers, booleans, nulls retain their decoded values
- hostname and sha12(hostname) in string values become <host>; residue fails capture
- 'Ledger rows: any member other than originKey and the two reuse keys that changes under redaction fails
  capture closed'
- 'Residue at capture only: the capture deny list (every raw host path seen) and every hostname form,
  its sha12, the login and home-owner names, all in any letter case; verify runs only host-independent
  shape classes, so it replays on any host and login'
- 'Residue everywhere: bare home-relative paths, uid assignments, relative runtime-directory continuations,
  and GitHub, GitLab, Stripe, Google, npm, JWT, Slack webhook, sk-style, AWS and private-key credential
  shapes'
- The knowledge-refs encoded home marker (dash, home, dash) is refused wherever it starts a path component
  (not after an ASCII letter or digit), in every label, payload and MANIFEST.yaml; a mid-token occurrence
  in a branch or lane label stays legal, and identity tokens still catch an encoded home there (P1 call
  s)
- Emitted paths never carry a component that .gitignore swallows (.beep, .claude, docs, tmp, dist, build,
  coverage, trace, secrets, env files, key and certificate names); such a capture fails closed
- 'Out of scope: host bytes in an encoded form (base64 or hex) inside a free-text member; the exact-key-set
  decode fixes every member, and branch and runId are the only free-text members'
