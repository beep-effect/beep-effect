merged_preview_path_redaction:
  renamed_process_directory_tokens: 3
  rule: merged-preview process-number names become distinct capture-local owner ordinals; no raw mapping
    recorded
  source:
    file: packages/tooling/tool/cli/src/commands/Yeet/internal/MergedPreview.ts
    line: 74
    sha256: bb4069ead2b9724b1f101d7c411590305fade1342a4bf80e7389dc82948d25c6
cache_mounts:
  primary: Turbo proof-cache topology
  secondary: git-common-dir is a checkout-binding fact, not a proof cache
  necessary_not_sufficient: CQ-015 evidence transfer still requires task-hash granularity and one epoch
  remote_config_semantics: true only for an explicit enabled remoteCache object/true in turbo.json (global
    when enabled); omission is false, not proof of runtime disablement
  signature_semantics: true only for remoteCache.signature true; signature key and environment values
    never read
  env_presence_scope: generator process; not per-checkout; presence does not prove validity or activation
  turbo_remote_cache_env_present:
    TURBO_TOKEN: true
    TURBO_TEAM: true
    TURBO_API: true
  runtime_override_caveat: invocation-specific flags and TURBO_CACHE_DIR can override the config topology;
    no execution result is inferred
  install_roots: skipped by Ruling 12
temporal_limit: one logical inventory capture; git/cache probes are interval observations bound to scannedAt,
  not an atomic machine freeze
n_instant_change_evidence: deferred; no change-across-time or stable-rename inference
cross_corpus_join: identity_key <fleet>/<checkout> and runs_dir_listing join run3-fleet checkout/run paths
stage_b: loss-population and issuance capture gated on v3 journal PR, organic traffic and proof-ledger
  materialization
checkout_path_encoding: UTF-8 percent-encoded single component; checkout labels remain verbatim in receipts
projection_rules:
- 'config_key_value channel: one .properties sibling for every raw payload'
- '# record <zero-based-index>; eligible leaf_key=value in source traversal order'
- ASCII alphanumeric/underscore keys; nonempty single-line strings, JSON numbers and booleans
- null, empty strings and CR/LF values omitted; duplicate pairs and scalar array leaves retained
- events count raw JSON records once; projections do not double-count events
redaction_rules:
- 'All families: longest matching fleet, home, session-tmp, system-tmp, runtime, proc and shm prefixes
  rewritten'
- fleet root is <fleet>; home is <home>; temp roots are <session-tmp> and <tmp>; runtime is <runtime>;
  proc is <proc>; shared memory is <shm>
- Per-user systemd unit identifiers become <uid>; proc process-directory identifiers become <process>
- Process identity members dropped recursively; free-text pid numbers replaced
- Structural keys and non-process numbers, booleans, nulls retain their decoded values
- Lock files and proof-locks are excluded; hostname and sha12(hostname) in string values become <host>;
  residue fails capture
