revision_requests:
  - >-
    Non-blocking: the definition says a request is "opened by an admission-enqueued row", a journal
    row that exists only from the v3 journal on. A ticket granted under the v1 journal leaves only an
    admitted row that carries enqueuedAtMillis, kind, priority and weightTokens (the record-0 stanza
    so-0ddb10ca516c, which the hypothesis mentions but does not cite). Say the request is opened by
    the enqueue the row records, so the grain does not narrow the ratified queued ticket to
    journaled ones.
attacks:
  - surface: taxonomy
    rule: reuse-semantic-match
    counterexample: >-
      Tried a grain other than the ratified queued ticket: the enqueue rows carry the work kind,
      priority, weightTokens and enqueuedAtMillis plus an origin member (so-0d75ae7174ed), matching
      the ratified SeatRequest parameters (admissionChargeTokens, enqueuedAt, hasOriginKey). No
      parent asserted. Survived, with the journal-row wording as a non-blocking request.
    outcome: survived
  - surface: identity
    rule: identity-conflict
    counterexample: >-
      Tried resubmission: so-8528aeede357 and so-40e26d2f0672 come from one checkout and branch with
      separate nonces and attemptIds and no linking member. The enqueue criterion counts two
      requests, and one demand would count one. The card names the demand-continuity rival and the
      proposal claims no lift of the resubmission flag. Survived.
    outcome: survived
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: >-
      Tried whether CQ-021 or CQ-023 answers without the class: both type ?req rdf:type
      ciops:SeatRequest. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: capture-provenance-as-vocabulary
    counterexample: >-
      Tried ownerRef or ownerRefVariant used as a criterion or join: the card names them as capture
      surrogates that are never a join, and the criterion is the enqueue. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      Twin: bookkeeping with no domain counterpart. For a flagged ratified term reused with no lift
      claimed, the test is semantic match: so-29a5ac8607a2 ends a queued ticket with its own end tag
      (admission-ticket-evicted, reason queued-submitter-death), apart from the lease eviction of a
      held grant on so-860cff0d673e. That places the chain at the ratified queued-ticket grain.
      Survived.
    outcome: survived
rival_models_still_viable:
  - >-
    waiting phase of one admission engagement continuing as the grant; discriminating fact: an
    admitted row whose charge, owner or checkout differs from the same chain's enqueue row, or a
    lease whose nonce differs from its ticket's
