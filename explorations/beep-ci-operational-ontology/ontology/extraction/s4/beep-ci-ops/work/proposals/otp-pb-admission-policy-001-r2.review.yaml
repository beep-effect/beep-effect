attacks:
  - surface: identity
    rule: identifier-is-not-identity
    counterexample: >-
      Two deployments may serialize byte-equal AdmissionConfig values under
      different authorities, applicability scopes, or revision lineages. The
      proposal does not identify policies by configuration equality: its
      criterion uses governed normative content, authority, scope, and
      version lineage, so the counterexample remains separated.
    outcome: survived
  - surface: warrant
    rule: decision-cq-requires-term
    counterexample: >-
      CQ-023 explicitly asks which AdmissionPolicy governs a queued request
      and whether its wait exceeds that policy's declared starvation bound.
      Removing the policy bearer makes both required answer components
      unavailable, so the direct decision warrant survives.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-false-in-null-world
    counterexample: >-
      A passive AdmissionConfig DTO can contain the same numbers, but it cannot
      make an over-bound eligible request a normative violation or a projection
      error. The binding policy semantics supply consequences absent from the
      serialization-only null world.
    outcome: survived
