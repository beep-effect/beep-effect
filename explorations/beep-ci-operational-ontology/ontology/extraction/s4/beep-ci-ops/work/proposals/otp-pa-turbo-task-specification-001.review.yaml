attacks:
  - surface: identity
    rule: identifier-is-not-identity
    counterexample: >-
      Two repositories may both contain a task named build while prescribing
      different inputs and dependencies, and two executions of one task remain
      distinct; the criterion survives because it uses semantic content and
      repository interpretation rather than the task key or a run id.
    outcome: survived
  - surface: warrant
    rule: cq-term-not-required
    counterexample: >-
      CQ-002 queries individuals typed ciops:WorkUnit and never mentions or
      entails ciops:WorkUnitSpecification. An A-Box of opaque WorkUnit
      individuals with admissibleFor and executesLane relations can answer the
      CQ without this differently named class.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-false-in-null-world
    counterexample: >-
      A formatting-only turbo.json clone could repeat the task keys, but once
      the entries prescribe inputs, upstream dependencies, persistence, and
      completion behavior they carry repeatable work content; changing the
      carrier does not eliminate that information object.
    outcome: survived
rival_models_still_viable:
