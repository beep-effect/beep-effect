    Keep the exact-reused VerificationPlanSpecification definition broad and
    represent the Yeet plan as an instance or a separately deferred,
    separately warranted specialization; the concession does not license a
    Yeet-only definition on the broad reused class.
attacks:
  - surface: identity
    rule: exact-reuse-extension-narrowing
    counterexample: >-
      A non-Yeet verification plan can prescribe an ordered WorkUnit sequence
      and scope and remain a VerificationPlanSpecification, yet it fails the
      revised definition's Yeet proof-plan, monitor, and merge-ready clauses.
      Exact reuse therefore still narrows the broad class despite the new
      deferral language.
    outcome: landed
  - surface: identity
    rule: plan-unity-underdetermined
    counterexample: >-
      Cheap-gates, review-fix, and monitoring can be separately versioned
      subplans coordinated by policy. The revision now concedes that choice,
      marks the analysis deferred, and names authority and lineage evidence,
      so this unresolved unity question is not itself treated as a failed
      repair in round 2.
    outcome: survived
  - surface: warrant
    rule: semantic-support-not-necessary
    counterexample: >-
      VerificationLane remains definable and CQ-001/CQ-011 remain answerable
      without a higher-level Yeet selector. The revision expressly withdraws
      that helper pending a Must/Should CQ, so the honest warrant concession is
      not the basis of this FAIL.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-false-in-null-world
    counterexample: >-
      A CLI branch table alone would not establish canonical repository policy
      or a merge-ready terminal condition. The AGENTS prescriptions do supply
      that information content, so the implementation-only null remains
      rejected even though plan unity is deferred.
    outcome: survived
rival_models_still_viable:
