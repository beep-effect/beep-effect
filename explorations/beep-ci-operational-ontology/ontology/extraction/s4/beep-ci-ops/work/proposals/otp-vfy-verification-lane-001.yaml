alternatives_rejected:
- 'A label grouping ledger rows: rejected by the analysis; one command digest recurs under one lane id
  across seven clone ledgers.'
open_issues:
- 'Warrant: CQ-001 (must_have) types ?lane rdf:type ciops:VerificationLane and loses every lane row without
  it; CQ-006 (must_have) binds ?lane through requiresLane and dischargesObligation, and without the term
  no obligation has a lane to name.'
- 'Steward choice (rival still viable on fa:vfy-verification-lane:001): the lane as a process type its
  executions instantiate, against a procedure specification as an information object. A category rival,
  so not a second proposal.'
- 'Needed evidence (fa:vfy-verification-lane:001, verbatim): To settle the identity criterion: one laneId
  carrying two commandDigest values across ledgers or over time, or two laneIds sharing one commandDigest.
  To rule the category between information object and process type: a record that gives the lane properties
  of its own apart from its executions (a deployed lane definition with its command and obligations, revisable
  as a document) or a record that classifies executions under a lane type with no specification of its
  own. For lane kind (CQ-001): a second laneClass value, or the deployed lane-class domain.'
- 'Lane kind: laneClass cli-runnable is the only value cited, so no lane-kind term is proposed and CQ-001''s
  hasLaneKind stays ungrounded by this chain.'
- Lane-plan terms (Queue E) are not touched; no parents edge to a ratified ordering-cluster term is asserted.
