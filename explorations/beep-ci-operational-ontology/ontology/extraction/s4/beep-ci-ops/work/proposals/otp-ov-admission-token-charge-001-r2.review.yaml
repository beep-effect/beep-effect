    A persisting administrative quality on one independently reidentified request, whose token
    value changes under repricing.
  - >-
    A policy-specific assignment or relational mode replaced by a new charging decision.
  - >-
    Successive contextual information assertions only, with observation-backed
    repeated/corrected/replaced content semantics and no separately reified continuing charge
    individual.
