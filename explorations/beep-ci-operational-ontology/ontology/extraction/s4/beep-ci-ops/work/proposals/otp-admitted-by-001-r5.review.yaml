no_surface_reasons:
  taxonomy: >-
    The object-property proposal asserts no parents edge; no is-a or
    subproperty relation exists to test, so no valid subsumption relation is
    presumed.
attacks:
  - surface: identity
    rule: projection-does-not-individuate-executions
    counterexample: >-
      One WorkUnit specification can execute twice under the same SeatGrant,
      leaving one specification-to-grant projection. The adopted property
      supplies no identity and does not claim that the projection individuates
      either execution; it explicitly reserves a reified admission occurrence
      for execution-level multiplicity and provenance.
    outcome: survived
  - surface: warrant
    rule: cq-domain-and-projection-match
    counterexample: >-
      A graph containing only an execution-to-grant edge cannot satisfy
      CQ-010's WorkUnit subject. The revision declares the reusable WorkUnit
      specification as the property subject and the SeatGrant as its object,
      exactly matching the query's required projection.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-admission-relation
    counterexample: >-
      A generic acquire-use-release wrapper can be plumbing, but it cannot
      preserve the deployed rule that an overshooting admission is rolled back
      before guarded work begins and that admitted work remains capacity-charged
      under the live grant. The operational admission relation survives.
    outcome: survived
rival_models_still_viable:
  - "A reified admission occurrence can additionally connect the WorkUnit specification, execution, and SeatGrant."
