no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge; no is-a relation exists to test,
    so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: generic-plan-absorbs-component-composite-rivals
    counterexample: >-
      A pre-push member prescription and a cheap-gates-plus-pre-push composite
      have different parts and unity. The adopted VerificationPlanSpecification
      class does not identify them as one token; it accommodates both as plan
      specifications and leaves their internal boundary and revision identity
      expressly open.
    outcome: survived
  - surface: warrant
    rule: schedule-specification-execution-split
    counterexample: >-
      Without repeatable plan content, CQ-020's current ScheduleProposal can be
      collapsed into the dated execution that realizes it. The generic plan
      specification preserves the ordered WorkUnit prescription and applicable
      scope that the decision term must expose, so the support is necessary to
      its stated semantics.
    outcome: survived
  - surface: null_discriminator
    rule: operative-plan-content-not-literal-token
    counterexample: >-
      A bare full literal can be implementation-only, but the cited dispatcher
      constructs a pre-push proof-step prescription and the planner composes
      ordered verification content. A transient DTO may carry that information
      object without making the prescription identical to its carrier.
    outcome: survived
rival_models_still_viable:
