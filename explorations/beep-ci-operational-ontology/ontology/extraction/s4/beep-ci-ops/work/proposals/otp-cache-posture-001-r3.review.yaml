no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: token-content-identity-conflict
    counterexample: >-
      One resolver decision can be serialized into several records, while two
      policy versions can reuse one tag with different remote-write authority.
      The revised card identifies governed authority content, not resolver
      tokens, carrier copies, or tags, so it handles both cases correctly.
    outcome: survived
  - surface: warrant
    rule: semantic-support-necessity
    counterexample: >-
      Removing CachePosture leaves the three CQ-024 decision values without the
      common closed class that fixes their local and remote authority semantics.
      The member terms alone cannot state the required exhaustive range or
      disambiguate them from transient resolver tags.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      A tagged DTO can name a branch, but it cannot preserve the full cited fact
      that the resolved posture determines whether the CLI injects local-only
      cache arguments, hands Turbo remote-read mode, or leaves explicit and CI
      arguments caller-controlled. The effective invocation behavior defeats
      the implementation-only twin.
    outcome: survived
