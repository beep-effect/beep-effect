  - surface: identity
    rule: specification-execution-and-identifier-test
    counterexample: >-
      origin/main can advance between executions, and another command can reuse
      the docgen:local name with different semantics. The card identifies the
      symbolic procedure, affected-scope rule, applicability, and governing
      revision rather than a dated file set, execution, or command key.
    outcome: survived
  - surface: warrant
    rule: context-complete-cq-answer
    counterexample: >-
      Returning a lint WorkUnit can make CQ-002 non-empty but does not answer
      which WorkUnits are admissible for an affected-docgen episode. The
      governing policy fixes this distinct lane-by-scope prescription, so a
      complete answer for that parameterized context must identify it.
    outcome: survived
  - surface: null_discriminator
    rule: governing-prescription-not-inert-config
    counterexample: >-
      A stale command row could be implementation-only, but the canonical
      repository policy governs edit loops by requiring docgen:local over
      origin/main through HEAD plus dirty files. That operative prescription
      is an information object even when policy text is its carrier.
    outcome: survived
