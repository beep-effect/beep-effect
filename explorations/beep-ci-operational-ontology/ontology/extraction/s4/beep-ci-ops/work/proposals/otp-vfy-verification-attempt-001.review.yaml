attacks:
  - surface: taxonomy
    rule: reuse-semantic-match
    counterexample: >-
      Tried a grain other than the ratified VerificationAttempt (rigid): so-6390d5f857ae
      (attempt-started, startedAt 16:59:45.919Z) and so-ca8b3f90e57c (verdict, endedAt 17:01:07.524Z,
      elapsedMs=81605) share one attemptId, and 81605 ms is exactly that span: one started pipeline
      run. The gufo:Event alignment fits; the card's unresolved rigidity is a deferral, not an
      anti-rigid claim. No parent asserted. Survived.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Tried run file or attemptId as the criterion: two attempts of one runId start at different
      stages (so-eefbf95beb8d repair-loop, so-10c2570fe2f6 closeout) and are kept distinct; the card
      makes attemptId evidence and the start event the criterion. The seat-request alias rival is
      named with its discriminator. Survived.
    outcome: survived
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: >-
      Tried whether CQ-022 answers without the term: its query joins the committed failure and each
      execution through one ?attempt by inAttempt and lists VerificationAttempt in required_classes.
      Without an attempt node the attempt-scoped join is lost. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      Twin: a bookkeeping label grouping lane rows. A label has no start row or verdict of its own;
      so-6390d5f857ae and so-ca8b3f90e57c give the attempt its own start, end, outcome and an
      elapsedMs equal to the span between them. Survived.
    outcome: survived
