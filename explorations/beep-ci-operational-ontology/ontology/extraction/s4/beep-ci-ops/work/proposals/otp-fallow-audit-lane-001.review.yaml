attacks:
  - surface: identity
    rule: "content-lineage-identity-conflict"
    counterexample: "Two repositories can carry semantically identical Fallow audit prescriptions while their policy lineages differ. The card makes lineage and revision identity-defining even though the proposal defines the individual by the prescription's content, wrongly separating equal information content."
    outcome: landed
  - surface: identity
    rule: "analysis-card-consistency"
    counterexample: "The proposal supplies identity and says analyzed, agreeing with ic:worktree-config:011 and fa:worktree-config:011."
    outcome: survived
  - surface: warrant
    rule: "listing-cq-warrant"
    counterexample: "CQ-001 requires the generic VerificationLane and LaneKind vocabulary needed to enumerate data. It neither names FallowAuditLane nor requires its base, gate, or command prescription as an ontology individual."
    outcome: landed
  - surface: warrant
    rule: "obligation-procedure-split"
    counterexample: "The same Fallow procedure can realize different lane obligations under different tier policies, and one lane obligation can be discharged by a revised procedure. Calling the procedure-specification artifact the lane collapses the standing obligation/procedure distinction."
    outcome: landed
  - surface: null_discriminator
    rule: "discriminator-true-of-config-entry"
    counterexample: "A command catalog entry can bind origin/main and new-only and remain only executable configuration. That pure config twin has the same command and gate facts without a separately individuated verification-lane artifact."
    outcome: landed
  - surface: identity
    rule: "rival-model-disclosure"
    counterexample: "Parameterized plan, abstract process type, and inventory-entry models remain viable and all are presented in open_issues."
    outcome: survived
