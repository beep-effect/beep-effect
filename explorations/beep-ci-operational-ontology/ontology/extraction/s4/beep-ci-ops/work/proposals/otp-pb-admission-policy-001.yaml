  identity: supplies
  dependence: relational
parents: []
revision_log: []
reuse:
  searched: true
  exact_reuse_found: true
  mappings:
    - iri: "https://oip.law/ontology/ci-ops#AdmissionPolicy"
      compatibility: >-
        The ratified term already denotes the governed policy specification
        whose starvation and weighted-admission rules control SeatRequests;
        the new evidence refines its carriers without changing its referent.
