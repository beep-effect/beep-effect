attacks:
  - surface: identity
    rule: exact-reuse-identity-resolved
    counterexample: >-
      A live input DTO and a later replay-derived view can repeat every queue
      field without being the same artifact. The revision confines SeatRequest
      to the enqueue-created durable ticket and requires carrier lineage before
      either representation can be identified with it.
    outcome: survived
  - surface: warrant
    rule: direct-cq-warrant
    counterexample: >-
      Removing SeatRequest leaves CQ-021 unable to enumerate queued tickets and
      CQ-023 unable to relate pending demand to capacity. Both questions need
      the class directly, independently of any later SeatGrant lifecycle.
    outcome: survived
  - surface: null_discriminator
    rule: durable-ticket-not-request-dto
    counterexample: >-
      The ticket remains the same governed queue artifact as its age and order
      change, while equal-valued input and replay DTOs remain separate absent a
      lineage join. Its identity therefore is not just the current field shape.
    outcome: survived
