attacks:
  - surface: identity
    rule: deferred-procedure-policy-unity
    counterexample: >-
      The health command can remain unchanged while an external evaluator
      revises a complexity ceiling, whereas a command that consumes the ceiling
      internally would acquire changed prescriptive content. The card and
      proposal honestly defer unity and identity pending the named dataflow and
      versioning evidence.
    outcome: survived
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      CQ-001 can enumerate other VerificationLane individuals and CQ-002 can
      return other WorkUnitSpecifications. The revised proposal expressly says
      neither CQ requires this named health individual, yet operational_warrant
      still asserts necessary support for WorkUnitSpecification.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-unconnected-config-pair
    counterexample: >-
      A CLI inventory can list the Fallow health command while an unrelated
      configuration section lists complexity ceilings, even if the command
      never reads those ceilings and no unified threshold-governed procedure
      exists. The closure supplies no dataflow or execution fact that falsifies
      that implementation-only twin.
    outcome: landed
