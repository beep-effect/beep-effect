alternatives_rejected:
  - >-
    The query-spelling null is rejected because the sources define and apply a
    Datalog closure semantics between concrete package variables.
  - >-
    The rule specification and a particular fixpoint execution are rejected
    as identical to the relation they compute.
open_issues:
