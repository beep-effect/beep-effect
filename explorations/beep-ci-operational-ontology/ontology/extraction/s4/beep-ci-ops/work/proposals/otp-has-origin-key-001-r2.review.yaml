attacks:
- surface: identity
  rule: property-information-object-category-conflict
  counterexample: Two grants can bear equal scheme-scoped string values through one data property while the values are neither the same repository origin nor independently individuated sign objects. The revised term is a data relation, but its unchanged foundational block and card still classify the target as an identity-supplying information object; the predicate itself cannot be reidentified by the lexical-content criterion assigned to its values.
  outcome: landed
- surface: identity
  rule: identifier-is-identity
  counterexample: Two unrelated repository origins can collapse to the same basename-derived originKey; the card explicitly requires naming scheme, derivation version, lexical content, and intended reference and therefore does not confuse key equality with repository identity.
  outcome: survived
- surface: identity
  rule: identity-card-consistency
  counterexample: An identity-none proposal would contradict the card's information-object provider judgment; both records say supplies identity.
  outcome: survived
- surface: identity
  rule: foundational-status-mismatch
  counterexample: Both proposal and foundational record are analyzed, so no unresolved foundational verdict is suppressed.
  outcome: survived
- surface: identity
  rule: rival-model-hidden
  counterexample: A scheme-scoped data value and an arbitrary conditional string differ on persistence and naming semantics; both remain explicit alternatives in open_issues.
  outcome: survived
- surface: warrant
  rule: cq-requires-term
  counterexample: CQ-009 joins two active grants on hasOriginKey and lists the property as required; without it, the origin-exclusion violation cannot be stated or detected.
  outcome: survived
- surface: null_discriminator
  rule: discriminator-true-of-dto
  counterexample: Ticket and lease DTOs can copy an opaque originKey string and the scheduler can compare those fields to suppress concurrent work; that exact operational join is fully true even when originKey is only an implementation field with no governed naming-scheme semantics.
  outcome: landed
rival_models_still_viable:
- The ontology needs only a scheme-scoped string data value used for the exclusion join.
- The string is arbitrary implementation state with no stable naming-scheme semantics.
