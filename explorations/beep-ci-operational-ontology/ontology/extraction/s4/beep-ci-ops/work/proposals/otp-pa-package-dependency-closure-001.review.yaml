no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents, so no is-a edge exists to test and no
    subsumption relation is needed for this object property.
revision_requests: []
attacks:
  - surface: identity
    rule: contextual-reachability-fact-identity
    counterexample: >-
      Two different dependency paths in the same pinned graph can connect the
      same package pair, while a later graph can preserve the pair through a new
      path. The card treats paths as support rather than identity and includes
      the graph context, so it neither multiplies the first fact nor conflates
      assertions from different snapshots.
    outcome: survived
  - surface: warrant
    rule: direct-cq-warrant
    counterexample: >-
      Removing dependsOnTransitive makes CQ-004 unable to return packages reached
      through indirect dependencies; its SPARQL and required-properties list
      directly require the relation, rather than merely mentioning dependency.
    outcome: survived
  - surface: null_discriminator
    rule: formal-relation-independent-of-predicate-spelling
    counterexample: >-
      Renaming the Datalog predicate or changing the fixpoint engine leaves the
      same package reachable from another through the direct-dependency graph;
      the quoted closure semantics therefore survives the lexical/query-artifact
      null while remaining an unreified relation rather than an individual.
    outcome: survived
rival_models_still_viable:
  - "A materialized closure assertion set as a separate information object."
  - "Reified dependency paths if path provenance later becomes decision-bearing."
