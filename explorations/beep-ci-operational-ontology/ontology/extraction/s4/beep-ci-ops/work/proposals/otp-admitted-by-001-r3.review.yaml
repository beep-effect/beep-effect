no_surface_reasons:
  taxonomy: >-
    The object-property proposal asserts no parents edge; no is-a or
    subproperty relation exists to test, so no valid subsumption is presumed.
attacks:
  - surface: identity
    rule: property-assertion-identity
    counterexample: >-
      One reusable WorkUnit specification can execute twice as E1 and E2 under
      one grant. The revised card makes E1 and E2 separate subjects and gives
      the property no supplied identity, so it no longer merges their assertions.
    outcome: survived
  - surface: warrant
    rule: cq-domain-mismatch
    counterexample: >-
      CQ-010 names and requires WorkUnit, the lane-by-scope scheduling object
      used by CQ-002, whereas this proposal expressly excludes the reusable
      specification and makes only WorkUnit execution occurrences subjects.
      A graph with specification W, execution E, and only E admittedBy G does
      not answer which admitted WorkUnit specification the cited CQ asks about.
    outcome: landed
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      A generic wrapper could acquire and release a lock, but it would not
      preserve the cited scheduler behavior that an overshooting lease is
      rolled back before the guarded work callback begins and that accepted
      work remains capacity-charged. The runtime admission relation survives.
    outcome: survived
rival_models_still_viable:
  - "A reified admission occurrence can connect specification, execution, and grant without the CQ domain mismatch."
