term:
  preferred_label: committed failure
  local_name: CommittedFailure
  proposed_iri: https://oip.law/ontology/ci-ops#CommittedFailure
  owl_entity_kind: class
definition:
  text: 'An event inside one verification attempt: the exit of one step that commits the attempt to a
    failing verdict, as the attempt verdict records it (failedStepId naming the step, failureKind step-exit,
    under failurePolicy fail-fast with outcome failure, beside earlier steps at status passed); individuated
    by its attempt and that step. The verdict members record the failure and are not it.'
  source:
  - so:sha256:ca8b3f90e57c22461d21f2b3bf2dad01149119aa674f540e81317a908f3f0610
  - CQ-022
