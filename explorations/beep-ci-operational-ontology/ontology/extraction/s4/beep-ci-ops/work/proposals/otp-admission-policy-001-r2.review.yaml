no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge, so it proposes no is-a relation
    whose rigidity, inherited identity, dependence, unity, or no-valid-
    subsumption alternative can be tested.
attacks:
  - surface: identity
    rule: identity-criterion-counterexample
    counterexample: >-
      Fleet A and fleet B can deploy byte-identical AdmissionConfig values while
      different authorities govern different applicability scopes. The card
      correctly keeps the two policy specifications distinct through authority,
      scope, and lineage rather than identifying them by value equality.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Two independent authorities can both label a policy admission-v1. The card
      requires authoritative lineage, normative rule content, and applicability
      scope, so the shared version key remains evidence rather than identity.
    outcome: survived
  - surface: warrant
    rule: cq-term-necessity
    counterexample: >-
      Removing AdmissionPolicy from a CQ-023 dataset leaves the node carrying
      starvationBoundMs without the class the query explicitly requires as the
      governing policy. The decision invariant cannot retain its stated typing.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-config-dto
    counterexample: >-
      A pure AdmissionConfig DTO can feed effectivePriorityRank and
      isTicketSkippable, changing queue rank and enforcing the review-fix cap,
      without being issued by an authority as a policy specification. The revised
      open issue concedes this null twin, but the hypothesis still rejects it and
      the analyzed card still commits the information-object reading.
    outcome: landed
