definition:
  text: The WorkUnitSpecification individual that prescribes docgen:local for edit loops over origin/main through HEAD plus
    current dirty files. CQ-002 asks which lane-by-scope WorkUnits are admissible, so a complete answer for the affected-docgen
    context must identify this governed prescription rather than substituting a lint, test, or full-docgen work unit. Concrete
    base, target, and dirty-tree bindings belong to an execution-bound realization of this reusable specification.
