attacks:
  - surface: identity
    rule: exact-reuse-extension-narrowing
    counterexample: >-
      A non-Yeet plan can prescribe an ordered WorkUnit sequence and applicable
      scope without proof-tier, monitor, or merge-ready clauses. The revised
      definition includes it because those Yeet clauses are possible instance
      or constituent content rather than the broad class's differentia.
    outcome: survived
  - surface: identity
    rule: plan-unity-underdetermined
    counterexample: >-
      Cheap-gates, review-fix, and monitoring may be separately versioned
      constituent plans rather than one Yeet token. The exact-reused class no
      longer identifies them with each other and explicitly leaves that
      instance boundary open, so the unresolved Yeet unity does not narrow the
      broad extension.
    outcome: survived
  - surface: warrant
    rule: schedule-specification-execution-split
    counterexample: >-
      Treating VerificationLane only as whatever process happens to run would
      erase its reusable prescribed WorkUnits, scope, authority, and completion
      semantics. VerificationPlanSpecification supplies the repeatable
      specification category needed to define that CQ-001/CQ-011 decision term
      without equating it to a dated execution.
    outcome: survived
  - surface: null_discriminator
    rule: operative-plan-content-not-cli-token
    counterexample: >-
      A CLI branch label alone can be implementation-only, but repository law
      makes Yeet canonical, its planner constructs distinct prescribed plans,
      and monitoring has a governed terminal condition. A different carrier
      can preserve that plan content, so the broad information-object referent
      survives the null-world attempt.
    outcome: survived
rival_models_still_viable:
