term:
  local_name: capacityAtAdmissionTokens
  preferred_label: capacity at admission tokens
  proposed_iri: https://oip.law/ontology/ci-ops#capacityAtAdmissionTokens
  owl_entity_kind: data_property
definition:
  text: A data relation from a SeatGrant admission occurrence to the token capacity remaining immediately before the candidate
    charge is added, reconstructed as computed capacity minus active admission charges under the same token convention. CQ-010
    requires this pre-grant value; using a post-grant snapshot would change the intension and falsely report a compliant admission
    as an overrun.
