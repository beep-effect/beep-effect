    compatibility: The S5 inventory already defines admissionChargeTokens as an integer recorded-value
      property on SeatRequest or SeatGrant. The emitter copies request.weightTokens into that same integer
      predicate, and the contract uses the corresponding charge in the capacity comparison. This proposes
      reuse of the recorded policy-token amount, without minting a charge individual or identifying a
      queued assessment with a later grant assessment.
