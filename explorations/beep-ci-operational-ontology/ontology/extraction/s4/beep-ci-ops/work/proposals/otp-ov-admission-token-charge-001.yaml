term:
  preferred_label: admission charge tokens
  local_name: admissionChargeTokens
  proposed_iri: https://oip.law/ontology/ci-ops#admissionChargeTokens
  owl_entity_kind: data_property
definition:
  text: >-
    A recorded-charge property attributing an integer token amount to a represented request or
    grant in its assertion context. The supplied synthetic instances describe request-side
    charges only; the recorded value does not establish an effective policy application or a
    continuing charge assignment.
