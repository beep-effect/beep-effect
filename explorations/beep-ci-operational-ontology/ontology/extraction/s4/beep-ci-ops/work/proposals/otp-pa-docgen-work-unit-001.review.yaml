    Cite or add a decision CQ that specifically requires the
    DocgenAffectedWorkUnit individual, or treat its occurrence in answers as
    A-Box population rather than claiming CQ-002 mints every possible WorkUnit.
attacks:
  - surface: identity
    rule: work-unit-specification-identity
    counterexample: >-
      Two executions on different trees can invoke docgen:local under the same
      affected-scope rule, while full docgen uses a different repo-wide rule.
      The card preserves the reusable local specification across the former and
      separates it from the latter, so identifiers do not control identity.
    outcome: survived
  - surface: warrant
    rule: listing-cq-does-not-require-named-individual
    counterexample: >-
      CQ-002 can return an admissible lint or test WorkUnit for its bound episode
      and contains no DocgenAffectedWorkUnit constant or docgen condition. The
      generic WorkUnit query does not logically require this particular named
      individual to be minted or re-admitted.
    outcome: landed
  - surface: null_discriminator
    rule: governed-procedure-discriminator
    counterexample: >-
      Replacing the command spelling while preserving the repository's bounded
      edit-loop procedure would preserve the same work prescription, whereas
      changing its scope to repo-wide proof would change it; the governing scope
      distinction therefore survives the command-alias null.
    outcome: survived
