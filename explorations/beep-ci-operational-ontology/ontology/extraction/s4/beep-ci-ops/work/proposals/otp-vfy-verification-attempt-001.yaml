term:
  preferred_label: verification attempt
  local_name: VerificationAttempt
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationAttempt
  owl_entity_kind: class
definition:
  text: 'An event: one started run of the verification pipeline, opened by an attempt-started row that
    carries its mode (repair, verify or closeout) and closed by an attempt-finished verdict (outcome,
    elapsedMs) or by an attempt-terminated reason; individuated by its start, not by the run file that
    groups several attempts nor by the request it may submit. The verdict''s elapsedMs spans from the
    start row to the verdict''s end.'
