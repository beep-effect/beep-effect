  competency_questions: []
  semantic_support_for:
  - otp:vfy-committed-failure:001
  - otp:vfy-lane-execution:001
alternatives_rejected:
- 'The journal, ledger and admission rows about an attempt as the referent: rejected by the analysis;
  the rows record the run they bound.'
- 'A grouping label over lane runs: rejected by the analysis; the attempt has its own start and verdict,
  and elapsedMs equals the span between them (so-6390d5f857ae, so-ca8b3f90e57c).'
- 'The verification episode or run the attempt belongs to: rejected by the analysis; one run file holds
  several attempts that start at different stages (so-eefbf95beb8d, so-10c2570fe2f6).'
open_issues:
- flag VerificationAttempt persists; no lift claimed
- 'The recorded-value reuse deferral on VerificationAttempt (account-version identity, effective invocation
  continuity) is not settled by any cited run-4 observation: no record shows an attempt invoked again
  or copied, so the deferral stands.'
- 'Support warrant (revised under ruling 20, which found that CQ-022 joins executions to the attempt
  without typing it and so warrants no decision term): the class is necessary to define the decision
  term otp:vfy-committed-failure:001, an event inside one verification attempt individuated by its attempt
  and the failing step, and the decision term otp:vfy-lane-execution:001, one invocation of one lane''s
  procedure inside one verification attempt. Both definitions individuate their referent within an attempt,
  and neither can say which attempt without this class. No CQ is cited on this term.'
- 'Earlier decision warrant withdrawn, kept for the record: CQ-022 (must_have) joins the committed failure
  and each execution to one ?attempt by inAttempt and carries no rdf:type triple for it; ruling 20 holds
  that this warrants no decision term.'
- 'Steward choice (rival still viable): the attempt as an alias of the seat request, one individual under
  two names. Not stated as a second proposal because it differs in identity on this hypothesis''s one
  card. Needed evidence: an attempt-started row and an admission chain sharing one attemptId, or two admission
  chains under one attemptId.'
- 'Steward choice (rival still viable): the attempt as a process counted while running (CQ-022''s in-flight
  queries). Needed evidence: a record of an attempt while running, before its verdict.'
- 'Reach beyond the journal: no cited proof-ledger fact or admission chain carries an attemptId equal
  to a cited attempt-journal start row''s, so lane-execution parthood and the tie to a seat request are
  not shown.'
- 'Retention: the KPI law (po-fd56d2b008d1) evicts whole terminal attempts per run-id file; the criterion
  is not journal presence, so an evicted attempt still occurred.'
- 'VerificationEpisode keeps its flags: this chain carries no attempt-membership or closure record, so
  it touches no episode question.'
