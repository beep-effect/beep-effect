    compatibility: 'Same grain as the ratified VerificationAttempt, whose carrier CQ-022''s notes name
      as the attemptId on yeet-attempt-journal/v1 events: one started pipeline run from its start to its
      verdict or termination. This chain''s card leaves rigidity unresolved where the ratified row records
