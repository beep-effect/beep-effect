no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge; no is-a relation exists to test, so
    no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: property-assertion-identity
    counterexample: >-
      Machine A and machine B can each have five active tokens, and machine A
      can return to five after an intervening lease change. The revised card
      keys assertions to admission context, observation boundary, and token
      convention, so equal values do not merge those operational facts.
    outcome: survived
  - surface: warrant
    rule: support-term-not-necessary
    counterexample: >-
      A grant record can retain capacityAtAdmissionTokens as the immediately
      pre-grant remainder and admissionChargeTokens as the candidate charge,
      while the ETL computes that remainder directly from the live grants.
      CQ-010 remains answerable and the remainder remains definable without
      materializing any activeTokens assertion, so this support property is
      not necessary for the decision term.
    outcome: landed
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      A detached status DTO could display a summed number, but it would not
      preserve the cited runtime fact that the scheduler gates promotion on
      the live charge and rolls back a newly staged lease after an overshoot.
      The operational discriminator therefore survives the null-world test.
    outcome: survived
rival_models_still_viable:
  - "The pre-grant remainder can be retained without a separate activeTokens property."
