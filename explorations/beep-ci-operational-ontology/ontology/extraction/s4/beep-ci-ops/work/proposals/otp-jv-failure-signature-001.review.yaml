surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents, so no is-a edge exists to test and no
    subsumption relation follows from calling the referent a signature mode.
revision_requests:
  - >-
    Choose whether FailureSignature is a repeatable classification shared by
    failures or a particularized mode of one failure, then align the identity
    criterion, label, and CQ-013 aggregation semantics with that choice.
  - >-
    Add observation-backed evidence that the tuple is reused for clustering,
    matching, or attribution across occurrences; otherwise leave the DTO/null
    and unreified-fact models viable.
attacks:
  - surface: identity
    rule: failure-signature-grain-conflict
    counterexample: >-
      Two failures in different attempts can share failedStepId full:01-pre-push
      and failureKind step-exit. CQ-013 can aggregate them as one repeatable
      signature, but the card necessarily separates their occurrence-bound
      modes, so the proposed term has incompatible identity grains.
    outcome: landed
  - surface: warrant
    rule: direct-cq-warrant
    counterexample: >-
      Removing FailureSignature leaves CQ-013 unable to bind the signature whose
      delay and cheapest surfacing lane are requested; the CQ genuinely requires
      a signature term, although it does not settle that term's identity grain.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-result-dto
    counterexample: >-
      A pure result DTO can populate failedStepId and failureKind for every
      failed run without reifying either a reusable signature or a dependent
      signature mode, so the cited paired values are true in the null world.
    outcome: landed
rival_models_still_viable:
  - "A reusable classification information object keyed by tuple and vocabulary."
  - "An unreified contextual classification fact."
