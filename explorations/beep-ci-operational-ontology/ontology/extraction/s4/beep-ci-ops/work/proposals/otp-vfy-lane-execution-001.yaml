alternatives_rejected:
- 'The verdict lane entry or the ledger fact or shadow record as the referent: rejected by the analysis;
  two records of different kinds agree on one execution (so-2601c6b77d87 and so-b1c417f14329), so the
  execution is neither record.'
- 'The attempt as a whole with lanes as unindividuated parts: rejected by the analysis; lanes of one attempt
  carry separate verdicts (so-40abdcaf1156 passed, so-c997b4851faa failed).'
- 'The reusable lane specification: rejected by the analysis; the lane recurs across attempts and trees
  while its executions do not. The specification side is VerificationLane (otp:vfy-verification-lane:001)
  and WorkUnitSpecification in the ratified taxonomy.'
- 'Two referents, the journal verdict-lane step and the ledger lane run, as different occurrences: no
  longer viable in the repaired analysis (fa:vfy-lane-execution:001); the verdict record so-5d4b45aa3226
  and the ledger fact so-2601c6b77d87 carry one attemptId, one lane (quality:coverage), one durationMs
  and a failed verdict on each, which fits one run recorded twice. The join covers one lane in one attempt,
  and a joined pair that disagreed would revive this rival.'
- 'Mapping to p-plan:Activity, oslc_auto:AutomationRequest or spdx-build:Build (reuse scan close matches
  for an executed work unit): not recorded as a mapping; those IRIs are unpinned there and the P-Plan
  license is unsettled, so they stay documentation.'
open_issues:
- 'Warrant: CQ-022 (must_have) types ?exec rdf:type ciops:WorkUnitExecution and loses its cancel-candidate
  rows without it; CQ-024 (should_have) types ?exec the same way and loses every execution-posture row;
  CQ-025 (should_have) types ?exec the same way and loses every cost-calibration pair (its notes name
  the verdict lane durationMs as the actualWallMs carrier).'
- 'Naming: the local name is the class the pinned CQ-022, CQ-024 and CQ-025 queries bind. The cited records
  carry a lane id and no scope member, so whether a work unit adds a scope grain to the lane an execution
  runs is not shown; the definition claims only the lane.'
- 'Steward choice (rival still viable): the execution as a process counted while running (CQ-022''s RunningExecution)
  rather than an event. A category rival, so not a second proposal. Needed evidence: a running-state record
  of a lane execution, written before its verdict.'
- 'Upstream repair (rule lost-rival, fa:vfy-lane-execution:001): the two-referent rival is now not viable
  and moves to alternatives_rejected. Needed evidence beyond the one joined pair (FA, verbatim in substance):
  a further verdict lane entry and ledger fact of one attempt and lane, from another lane or clone, showing
  whether they agree on duration and verdict.'
- 'Rerun edge: the (attempt, lane) pair is evidence only while no rerun occurs; a rerun inside one attempt
  would be two executions under one pair. Needed evidence: a record of two invocations of one lane in
  one attempt.'
- 'Nesting (upstream repair, rule unity-contradicted-by-closure, ic:vfy-lane-execution:001): on so-5d4b45aa3226
  the wrapper lane full:01-pre-push and the lane entries naming it as parentLaneId are lane executions
  of one attempt, and the card shows by durations that the children ran inside the wrapper''s run (their
  span is shorter than the wrapper''s durationMs, and wrapper plus children exceed the attempt''s elapsedMs).
  Containment is shown; parthood is not: whether a child execution is a part of the wrapper execution
  or a separate execution only inside its interval stays open on the card. Counted as peers, the entries''
  durationMs values double-count the wrapper''s time as CQ-025 actualWallMs. Needed evidence: a wrapper
  entry with its own startedAt and endedAt, or a record of what the wrapper''s durationMs measures.'
- 'Membership (answer to definition-excludes-warrant-rows): the definition no longer makes an ended verdict
  a membership condition. A started invocation with no verdict yet (the rows CQ-022 selects with RunningExecution)
  is an instance, and one cancelled as a CQ-022 cancel candidate stays one. The card''s "ended by a verdict"
  is read as how the cited executions end, beside its terminal_states, which list cancellation or obsoletion
  by a committed failure as not shown; whether an execution changes state without losing identity stays
  unresolved on the card, and no running-state record is cited, so the process rival keeps its steward-choice
  issue below.'
- 'Records that are not executions: so-ca8b3f90e57c carries lane entries with status=not-run and no durationMs
  or exitCode (feedback:01-build and the later feedback lanes after the prepare:05-docgen failure under
  failurePolicy=fail-fast). A not-run entry records no invocation, so ETL mints no execution from a status
  alone.'
- 'Discriminator wording (non-blocking request, declined on the DH and answered here): the journal entry
  on so-5d4b45aa3226 and the fact so-2601c6b77d87 carry one durationMs and were written within a second
  of each other, which fits one measurement written twice, so their agreement is not taken as an independent
  second witness. This proposal rests the null discriminator on the exit codes (exitCode=0 on so-ca8b3f90e57c,
  exitCode=1 on the quality:coverage entry) and the started and ended instants. The hypothesis text
  (its "recorded independently" null rationale, its "no cited pair shows" sentence and its (attempt, lane
  id) individuation) predates the repaired analysis; the DH is not this seat''s to edit, and the card''s
  invocation criterion governs.'
- 'Not grounded by this chain: CQ-022''s hasExecutionState and RunningExecution, CQ-024''s hasCachePosture,
  CQ-025''s actualWallMs and usedCostEstimate. Each needs its own chain; no property is proposed here.'
- 'Cluster dependency: otp:vfy-verification-attempt:001 (the attempt it runs in), otp:vfy-verification-lane:001
  (the lane it runs) and otp:vfy-committed-failure:001 (CQ-022). No parents edge is asserted.'
