definition:
  text: 'An event: one started invocation of one verification lane''s procedure inside one verification
    attempt, an instance from its start, whether or not it has ended; it can end with a verdict (status
    on a verdict lane entry, outcome on a proof-ledger fact, observed on its shadow) or, as the card lists
    though no cited record shows it, by cancellation or obsoletion under a committed failure. An ended invocation
    in the cited records carries a per-lane wall duration (durationMs). Individuated by that invocation,
    not by the lane it runs nor by any record of it. A lane entry with status not-run and no durationMs
    or exitCode records no invocation and so no execution. A fact and its shadow that agree on lane, duration and verdict
    are two records of one execution. Executions of one attempt can run inside another: lane entries
    naming a wrapper lane as parentLaneId ran within the wrapper''s run, so executions are not disjoint
    in time.'
