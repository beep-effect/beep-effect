term:
  preferred_label: seat request
  local_name: SeatRequest
  proposed_iri: https://oip.law/ontology/ci-ops#SeatRequest
  owl_entity_kind: class
definition:
  text: >-
    An information object recording one putative capacity request's demand account, preserving
    only the supplied work kind, priority, requested charge and enqueue, admission, withdrawal
    or ticket-eviction assertions. The selected unit preserves
    the particular demand described by an originating account and its asserted content.
    Faithful copies of that unchanged account preserve the unit; correction or an added
    boundary creates a different content version. It remains distinct from the resulting grant account and can
    exist without effective queue registration.
  source:
  - CQ-021
  - CQ-023
