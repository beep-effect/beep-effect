  mappings:
  - iri: https://oip.law/ontology/ci-ops#SeatRequest
    compatibility: >-
      Exact reuse of the local SeatRequest term at recorded-value grain under sitting-1 Ruling
      2. The inventory's request/grant split, rigid classification, recorded
      admissionChargeTokens and enqueuedAt, and literal hasOriginKey match the demand
      account's subject and associated recorded values. The nonce-chain provenance preserves
      which request each assertion describes without making the nonce an identity axiom. This
      is a mapping to the existing term, not a new request-record subclass or an assertion
      that effective registration occurred. Current queue membership and requester identity
      need separate evidence.
