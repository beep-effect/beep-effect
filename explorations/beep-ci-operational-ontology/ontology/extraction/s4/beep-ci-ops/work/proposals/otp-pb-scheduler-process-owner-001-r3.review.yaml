revision_requests: []
attacks:
  - surface: identity
    rule: role-bearer-collapse-on-exact-reuse
    counterexample: >-
      One operating-system process exists before ownership, can own several
      requests or grants during one uninterrupted interval, and persists after
      its last ownership ends. The repaired card now makes Agent the anti-rigid
      owner role, carries process identity across changing items, and ends the
      role at a zero-ownership interval instead of identifying it with the
      rigid process bearer.
    outcome: survived
  - surface: warrant
    rule: decision-cq-requires-term
    counterexample: >-
      CQ-021 explicitly selects the Agent that owns each queued SeatRequest via
      requestedBy. Removing the anti-rigid owner role leaves the requested
      ?agent binding without its required class-level interpretation, so this
      is a decision term rather than an optional process helper.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-false-in-null-world
    counterexample: >-
      A numeric PID alone can be reused by causally distinct processes, while a
      pid and process-start coordinate is still only evidence for a bearer.
      The requirement to reidentify the process owner across PID reuse and its
      actual ownership of requests defeat the field-pair-only null without
      making the coordinate tuple the Agent.
    outcome: survived
rival_models_still_viable:
  - "A separate rigid OSProcess class supplies identity to the anti-rigid Agent role."
  - "A separately modeled owner-coordinate information object records pid and process-start evidence."
