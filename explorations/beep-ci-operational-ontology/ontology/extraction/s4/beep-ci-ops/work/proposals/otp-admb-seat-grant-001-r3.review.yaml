attacks:
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A replay-only DTO can contain the admitted and released rows for nonce
      411b3ba7-f32a-4d07-8a0c-c764dc5b8088 without allocating capacity. This still defeats the old
      operational discriminator, but the current proposal and repaired IC/FA select a fixed
      contextual grant-description information object and expressly allow ineffective or false
      reported holdings. The meaningful associated admission, charge and boundary assertions survive
