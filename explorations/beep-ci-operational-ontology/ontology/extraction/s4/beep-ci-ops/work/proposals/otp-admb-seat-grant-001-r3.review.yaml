  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Two accounts both charge five tokens to origin 4cc31eeb4dec, but the admissions at
      1788926595216 and 1788929720160 describe different founding contexts and holdings. Equal
      charge, origin or work kind cannot merge them. Conversely, copying the first account into
      another capture does not create a second information unit. The repaired card supplies identity
      through fixed contextual assertions; the proposal preserves originating-account association
      and explicitly leaves independently equal-content accounts as a steward choice. Nonces
      correlate the observed histories, while changing ownerRef values and capture locations are
      provenance, not identity criteria.
    outcome: survived
    evidence:
      - so:sha256:0cb159aa5cd447c7b42d80f0dcd792382db039de48f6cedab98b7fa24eefd929
      - so:sha256:fa3b258421f3351e59071c2e155362cfecf3f26f91deb6077508331c112a5732
  - surface: identity
    rule: information-object-versus-effective-grant
    counterexample: >-
      The admission-only histories could be replayed after an unobserved release, and an eviction
      report could describe an allocation that never became effective. They therefore cannot
      establish current ActiveGrant instances, capacity continuity or missing terminal events. The
      current information-object account permits these cases and remains an information object when
      its reported holding ends. A newly supplied or corrected boundary changes the content version
      rather than silently extending an effective relator. The retained relator, event and mode
      readings require effective-operation evidence; their survival as rivals does not create an
      incompatible inherited identity criterion.
