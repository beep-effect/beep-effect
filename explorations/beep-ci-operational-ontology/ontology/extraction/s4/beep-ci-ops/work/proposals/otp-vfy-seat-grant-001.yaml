alternatives_rejected:
- 'The lease file or journal rows as the referent: rejected by the analysis; the lease state record (so-a8d270b5e19d)
  and the rows record the hold.'
- 'A scheduler variable with no domain counterpart: rejected by the analysis on the lease-evicted chains,
  which carry a last heartbeat instant and an eviction reason of their own.'
open_issues:
- flag SeatGrant persists; no lift claimed
- No cited chain shows a renewal or a transfer of a grant, so effective allocation continuity stays deferred
  and the synthetic operational SeatGrant reading of the run-3 withdrawal is not re-presented.
- 'Warrant: CQ-008 (must_have) types ?grant rdf:type ciops:SeatGrant and loses every holder row without
  it; CQ-009 (must_have) types ?g1 and ?g2 the same way, and without it the exclusion invariant is vacuously
  zero on both arms. CQ-010 is not cited: its query reaches the grant only through admittedBy and admissionChargeTokens
  and types nothing (the charge is otp:vfy-admission-charge:001).'
- 'CQ-009: hasCheckout and hasCoordinationProtocol are seed-only predicates, which is not ratification.
  The protocol predicate carries the decoded value: a record without the field decodes as legacy-origin-lock/v1.
  The one cited lease state record carries scheduler-origin-concurrency/v1; the cited records show the
  legacy arm neither present nor absent, and a missing field is never read as no protocol.'
- 'Steward choice (category rivals still viable on fa:vfy-seat-grant:001): a rigid relator founded at
  admission, or the held phase of one admission engagement that began at enqueue. Not two proposals: the
  readings differ in category and rigidity on this hypothesis''s one card.'
- 'Needed evidence (fa:vfy-seat-grant:001, verbatim): The same discriminating chain as the seat-request
  pair: a grant released or evicted and then re-admitted under the same nonce, one request admitted into
  two grants, a lease whose nonce differs from its ticket''s, or a grant renewed or transferred to another
  holder while keeping its admission instant. For CQ-009''s legacy-origin arm, a grant record carrying
  the legacy-origin-lock/v1 protocol, or a grant persisted without the protocol field (which decodes as
  legacy-origin-lock/v1). For a dependence on a capacity pool: a record stating the capacity a grant is
  charged against (a pool or capacity snapshot member on a grant row).'
- 'Cluster dependency: one discriminating chain decides this term and otp:vfy-seat-request:001 together;
  the ratified admittedBy ranges over SeatGrant. Holder and checkout dependence is relational on the card;
  otp:vfy-checkout:001 is the held checkout.'
