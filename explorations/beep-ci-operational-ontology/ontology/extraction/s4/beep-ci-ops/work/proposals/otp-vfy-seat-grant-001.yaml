definition:
  text: 'A held admission to shared verification capacity: the held span of one admission chain, begun
    at an admission-admitted row (admittedAtMillis) of a chain first enqueued, holding one checkout (checkoutRoot)
    at one charge (weightTokens), carrying the holder''s last heartbeat (lastHeartbeatAtMillis) where
    recorded, and ended by release (admission-released, releasedAtMillis) or eviction (admission-lease-evicted,
    reason owner-dead-or-reused); individuated by the admission that began it.'
