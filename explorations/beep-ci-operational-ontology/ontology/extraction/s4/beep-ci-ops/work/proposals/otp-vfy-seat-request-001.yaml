open_issues:
- flag SeatRequest persists; no lift claimed
- 'No cited chain shows a repricing (enqueue and admit charges that differ) or a withdrawal and resubmission
  joined by a demand referent: the successive withdrawn chains from one checkout and branch (so-8528aeede357,
  so-40e26d2f0672) carry separate nonces and attemptIds and no linking member. The recorded-value deferrals
  (account-copy identity, effective queue participation, withdrawal and resubmission continuity) stand,
  and the synthetic SeatRequest reading of the run-3 withdrawal is not re-presented.'
- 'Warrant: CQ-021 (must_have) types ?req rdf:type ciops:SeatRequest and loses every queued-request row
  without it; CQ-023 (must_have) types ?req the same way, and without it the starvation invariant is vacuously
  zero.'
- 'Steward choice (category rivals still viable on fa:vfy-seat-request:001): a rigid relator ending at
  admission (two-relator split) or the waiting phase of one admission engagement that continues as the
  grant. Not two proposals: the readings differ in category and rigidity on this hypothesis''s one card.'
- 'Steward choice (identity rivals still viable): the verification attempt under another name, and one
  demand persisting across a withdrawal and a later resubmission.'
- 'Needed evidence (fa:vfy-seat-request:001, verbatim): An admission chain that separates the readings:
  a grant evicted or released and then re-queued or re-admitted under the same nonce (favours one engagement
  with phases), one request admitted into two grants or a lease whose nonce differs from its ticket''s
  (favours two relators), or an admitted row whose charge, owner or checkout differs from the same chain''s
  enqueue row. For the attempt rival: an attempt-journal end row joined to an admission chain by attemptId,
  showing whether the attempt ends where the request ends. For demand continuity: a record linking two
  chains, such as a shared demand id or a resubmission marker on a chain that follows a withdrawal. For
  relational dependence (the card leaves it unresolved): a record stating the capacity a request waits
  on (a pool, queue or capacity snapshot named on or joined to the enqueue row), which no cited record
  carries.'
- 'Cluster dependency: one discriminating chain decides this term and otp:vfy-seat-grant:001 together.
  The ratified schedulesSeatRequest ranges over SeatRequest within the joint ordering cluster, so whether
  this flag can lift singly is undecided.'
