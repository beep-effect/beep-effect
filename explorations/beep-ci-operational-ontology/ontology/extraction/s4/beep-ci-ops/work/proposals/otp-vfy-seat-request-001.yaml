definition:
  text: 'A queued claim on shared verification capacity: the waiting span of one admission chain, opened
    by an admission-enqueued row that carries the requested work kind (kind), priority class (priority),
    admission charge (weightTokens) and enqueue instant (enqueuedAtMillis), and ended by admission (admission-admitted),
    withdrawal (admission-withdrawn) or eviction while still queued (admission-ticket-evicted, reason
    queued-submitter-death); individuated by the enqueue that opened it, the chain nonce being evidence
    only.'
  source:
