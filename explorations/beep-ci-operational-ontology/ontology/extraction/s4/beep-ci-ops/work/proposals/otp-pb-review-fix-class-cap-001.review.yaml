revision_requests:
  - >-
    Address clause-is-part-not-kind by replacing the AdmissionPolicy is-a edge
    with an explicit clause/component relation, or fold the class-cap content
    into the policy instead of treating it as a policy subtype.
  - >-
    Address clause-identity-lineage-unobserved,
    semantic-support-not-necessary, and discriminator-true-of-guard by
    providing independent clause authority/version evidence plus a decision
    CQ that requires the clause, or withdraw the separate term.
attacks:
  - surface: taxonomy
    rule: taxonomy-rigidity-compatible
    counterexample: >-
      Both a policy specification and an immutable clause specification remain
      information objects throughout their existence, so the rigid-to-rigid
      edge creates no rigidity violation by itself.
    outcome: survived
  - surface: taxonomy
    rule: clause-is-part-not-kind
    counterexample: >-
      A class-cap clause specifies only the review-fix population and
      threshold; it lacks the capacity, aging, starvation, authority, and
      applicability bundle required by the parent AdmissionPolicy definition.
      It is a component of a policy, not a kind of complete policy.
    outcome: landed
  - surface: identity
    rule: clause-identity-lineage-unobserved
    counterexample: >-
      One AdmissionPolicy revision can change reviewFixClassCap together with
      other parameters without assigning the clause a separate issuance or
      version lineage. The code comparison and parameter name do not identify
      an independent policy-clause individual.
    outcome: landed
  - surface: warrant
    rule: semantic-support-not-necessary
    counterexample: >-
      CQ-023 requires AdmissionPolicy only to obtain its starvation bound; it
      never counts active review-fix grants or asks for the class cap. The
      decision term remains definable without a separate cap class.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-guard
    counterexample: >-
      A scheduler-only Boolean guard can block when activeReviewFix reaches a
      configured number, and an implementation contract can document that
      behavior, while no independently governed class-cap information object
      exists. The discriminator is true in that null world.
    outcome: landed
rival_models_still_viable:
  - "The cap is a clause or parameter within AdmissionPolicy."
  - "Being at the cap is a situation, not the reusable rule."
  - "A normative mode borne by the admission service is distinct from the clause text."
