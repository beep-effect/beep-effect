    the reused class to this one status shape.
attacks:
  - surface: identity
    rule: record-issuance-identity-unobserved
    counterexample: >-
      Equal transient status values may be allocated, copied, or reconstructed
      without a retained issuance. The revision expressly concedes that
      identity problem and names issuance, correction, parent-attempt,
      execution, and custody evidence for run 3, so that honest deferral is not
      itself the basis of this FAIL.
    outcome: survived
  - surface: identity
    rule: exact-reuse-extension-narrowing
    counterexample: >-
      An ordinary VerificationResultArtifact can record a completed
      verification result without being the status of one planned lane or
      carrying its repair instruction. It belongs to the broad reused class
      but fails this definition, so the exact-reused extension is narrowed.
    outcome: landed
  - surface: warrant
    rule: semantic-support-not-necessary
    counterexample: >-
      CQ-022 and CQ-025 remain answerable from WorkUnitExecution state,
      cancellation, duration, and estimate without a separate lane-status
      record. The revision explicitly withdraws the separate term pending a
      Must/Should CQ, so the concession is not treated as a failed repair.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A transient DTO can carry every cited field without acquiring issuance
      identity. The proposal now concedes precisely that possibility rather
      than using those fields to settle identity, so the DTO twin supplies the
      stated run-3 evidence need but does not add a second failure here.
    outcome: survived
