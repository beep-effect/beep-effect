surfaces:
  taxonomy: attacked
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons: {}
revision_requests:
  - >-
    Non-blocking: the identity card and analysis still give the referent grain as "one invocation
    ... ended by a verdict" and the unity as "from its start to its verdict", while the revised
    definition makes a started invocation an instance before any verdict. The proposal reads the
    card's phrase as how the cited executions end; an upstream pass should restate the grain so
    the card itself does not read as a membership condition.
  - >-
    Non-blocking: the definition's sentence "A fact and its shadow that agree on lane, duration and
    verdict are two records of one execution" omits the attempt; add attemptId (and recordedAt) to
    the agreement, as the card's reidentification key does.
  - >-
    Non-blocking: CQ-025's notes allow attempt-level elapsedMs as actualWallMs "ONLY when the
    WorkUnitExecution is the whole attempt", while this definition rejects the attempt as the
    referent; say in open_issues that whole-attempt executions are out of this class's grain, or
    that the choice is left open.
attacks:
  - surface: warrant
    rule: definition-excludes-warrant-rows
    counterexample: >-
      Re-attacked the revised bytes with the round-2 case: on so-5d4b45aa3226 quality:coverage
      started 2026-10-01T15:30:00.847Z and ended 15:40:19.556Z failed. The definition now makes it
      an instance from its start, whether or not it has ended, so at any instant between those two
      it is a running instance CQ-022 can select; a cancelled invocation stays an instance, and the
      card's terminal_states list cancellation. Tried the not-run exclusion against CQ-022's cancel
      set: on so-ca8b3f90e57c the feedback lanes after the prepare:05-docgen failure carry
      status=not-run with no durationMs or exitCode under failurePolicy=fail-fast, so they were
      never started and were never running cancel candidates. Survived.
    outcome: survived
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: >-
      Tried whether CQ-022, CQ-024 or CQ-025 answers without the class: each sparql types ?exec
      rdf:type ciops:WorkUnitExecution, so each loses every row without it, and CQ-025's notes name
      verdict.lanes[].durationMs, the per-lane entry this definition individuates, as the
      actualWallMs carrier. Survived.
    outcome: survived
  - surface: taxonomy
    rule: gufo-alignment-check
    counterexample: >-
      Tried gufo:Event against the state change CQ-022 and CQ-025 attach to one ?exec
      (RunningExecution, then CompletedExecution): an event bearing a changing state. The card
      leaves state change unresolved, the process reading is kept as a still-viable steward choice
      with its discriminator, and no parent edge is asserted to WorkUnitSpecification or
      VerificationLane. Survived.
    outcome: survived
  - surface: identity
    rule: identity-conflict
    counterexample: >-
      Tried the wrapper case on so-5d4b45aa3226: full:01-pre-push carries durationMs 3137528.733036
      and status failed, the attempt's failedStepId names it, and 32 entries name it as
      parentLaneId, the failing child being quality:coverage. The invocation criterion counts the
      wrapper and each child as distinct invocations, so none is merged; the definition states that
      executions nest, and parthood and the CQ-025 double-count stay open with needed evidence.
      Tried the cross-record join: the quality:coverage entry and the fact so-2601c6b77d87 share
      attemptId, inputDigest 910cb539f21b and durationMs 618708.236225, and the fact's recordedAt
      falls after the entry's endedAt, one execution recorded twice, which the criterion counts
      once. Survived.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Tried (attemptId, laneId) or the ledger key as the criterion: so-b1c417f14329 and
      so-2601c6b77d87 share key, attemptId and laneId as two records of one execution, and a rerun
      inside one attempt would be two executions under one pair. The card makes the invocation the
      criterion and keeps the pair and key as evidence that fails under reruns. Tried the shared
      recordedAt: so-40abdcaf1156 and so-c997b4851faa carry one attemptId and one recordedAt but
      different lanes, durations and outcomes, so a recording-instant key would merge them; the
      definition does not use it. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      Twin: one lane-result object serialized to the journal and the ledger, which makes the
      durationMs agreement true without a second witness. The discriminator the proposal rests on
      holds against that twin only through a run: the quality:coverage entry carries exitCode=1
      with startedAt and endedAt 618709 ms apart, matching its durationMs, and so-ca8b3f90e57c
      records exitCode=0 for prepare:01-effect-imports. A process exit over a measured interval is
      a run, not a label. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: hypothetical-read-as-realized
    counterexample: >-
      Tried a shadow read as realized reuse: so-b1c417f14329 is a miss shadow (reason
      changed-package-tripwire). The definition reads only its observed verdict as a record of the
      run that happened and makes no reuse, copy or transfer claim. Survived.
    outcome: survived
rival_models_still_viable:
  - >-
    execution as a process counted while running rather than an event; discriminating fact: a
    running-state record of a lane execution written before its verdict
