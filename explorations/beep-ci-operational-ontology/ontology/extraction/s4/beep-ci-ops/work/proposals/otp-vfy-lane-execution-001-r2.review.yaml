revision_requests:
  - >-
    Blocking (definition-excludes-warrant-rows): the definition makes "ended by a verdict" a
    membership condition, so an invocation that has started and has no verdict yet (the rows CQ-022's
    query selects with hasExecutionState RunningExecution) is not an instance, and an invocation
    cancelled as a CQ-022 cancel candidate never becomes one. Either restate membership as one started
    invocation of one lane's procedure inside one attempt, with a verdict (status, outcome, observed)
    or a cancellation as the ways it can end, in line with the card's terminal_states and its
    unresolved may_change_state_without_losing_identity; or drop CQ-022 from the warrant and say why
    the class is warranted without it.
  - >-
    Non-blocking: the hypothesis description still says "no cited pair shows a verdict lane entry and a
    ledger lane record of the same attempt" and individuates by "(attempt, lane id)", while the analysis
    joins so-5d4b45aa3226 to so-2601c6b77d87 and the card individuates by invocation. Align the
    hypothesis text with the repaired analysis.
  - >-
    Non-blocking: the null rationale calls the duration "recorded independently by two record kinds",
    but the journal entry on so-5d4b45aa3226 and the fact so-2601c6b77d87 carry one durationMs to the
    microsecond and were written within a second of each other, which fits one measurement written
    twice. Rest the discriminator on the exit code and the started/ended instants, not on independence.
  - >-
    Non-blocking: so-ca8b3f90e57c carries lane entries with status=not-run and no durationMs or exitCode
    (feedback:01-build and the rest after a fail-fast failure). Say that a not-run entry records no
    invocation and so no execution, so ETL does not mint one from a status alone.
attacks:
  - surface: warrant
    rule: definition-excludes-warrant-rows
    counterexample: >-
      CQ-022 (must_have) selects ?exec rdf:type ciops:WorkUnitExecution with hasExecutionState
      ciops:RunningExecution: invocations that have started and not ended. On so-5d4b45aa3226 the lane
      quality:coverage started 2026-10-01T15:30:00.847Z and ended 15:40:19.556Z with status failed; at
      any instant between those two it was such a running invocation with no verdict, and under the
      definition ("one invocation ... ended by a verdict") it was not yet an instance, so CQ-022 could
      not return it. An invocation the S7 stopping rule then cancels ends with no verdict at all and
      never becomes an instance, although the card lists cancellation as a terminal state. The cited
      must_have query therefore returns no row by construction under the definition as written, and its
      expected_result is non_empty. Landed.
    outcome: landed
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: >-
      Tried whether CQ-024 or CQ-025 answers without the class: both queries type ?exec rdf:type
      ciops:WorkUnitExecution, and CQ-025's notes name verdict.lanes[].durationMs, the per-lane entry
      this definition individuates, as the actualWallMs carrier, so the lane grain matches the CQ's
      own carrier. Neither is a listing warrant. Survived.
    outcome: survived
  - surface: taxonomy
    rule: gufo-alignment-check
    counterexample: >-
      Tried gufo:Event against the state change CQ-022 and CQ-025 attach (RunningExecution, then
      CompletedExecution): an immutable event bearing a changing state. The card leaves state change
      unresolved and the proposal names the process reading as a still-viable steward choice with its
      discriminator (a running-state record written before the verdict); a snapshot-indexed state on an
      event is a modelling option, so the alignment alone is not shown wrong. No parent edge is
      asserted. Survived.
    outcome: survived
  - surface: identity
    rule: identity-conflict
    counterexample: >-
      Tried the wrapper/child case on so-5d4b45aa3226: 32 entries name parentLaneId=full:01-pre-push,
      their start-to-end span is 3133022 ms, the wrapper's durationMs is 3137528.733036, and wrapper
      plus children sum to more than the attempt's elapsedMs 3814445; the attempt verdict's
      failedStepId names the wrapper while the failing child is quality:coverage. Under the invocation
      criterion the wrapper and each child are distinct invocations, so no two are merged; the
      definition states that executions nest and the proposal leaves parthood open with its needed
      evidence. Tried the journal/ledger join: the quality:coverage entry and so-2601c6b77d87 share
      attemptId, inputDigest and durationMs 618708.236225, one execution recorded twice, which the
      criterion counts once. Survived.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Tried the ledger key or (attemptId, laneId) as the criterion: so-b1c417f14329 and
      so-2601c6b77d87 share key, attemptId and laneId as two records of one execution, and a rerun
      inside one attempt would be two executions under one pair. The card makes the invocation the
      criterion and keeps the pair and key as evidence that fails under reruns. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      Twin: one lane-result object serialized to the journal and the ledger. That twin makes the
      fact/journal agreement on durationMs true without any second witness, so the agreement adds
      nothing. The rest of the discriminator holds against the twin only if a run occurred: the
      quality:coverage entry carries exitCode=1 with startedAt and endedAt 618709 ms apart, matching
      its durationMs, and so-ca8b3f90e57c records exitCode=0 for prepare:01-effect-imports. A process
      exit over a measured interval is a run, not a label. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: hypothetical-read-as-realized
    counterexample: >-
      Tried a shadow read as realized reuse: so-b1c417f14329 is a miss shadow (reason
      changed-package-tripwire). The proposal reads only its observed verdict and duration as a record
      of the run that happened, and claims no reuse, copy or transfer. Survived.
    outcome: survived
rival_models_still_viable:
  - >-
    execution as a process counted while running rather than an event; discriminating fact: a
    running-state record of a lane execution written before its verdict
