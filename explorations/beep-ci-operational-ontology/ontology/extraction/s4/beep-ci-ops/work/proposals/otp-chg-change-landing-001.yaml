term:
  preferred_label: "operational change event"
  local_name: "OperationalChangeEvent"
  proposed_iri: "https://oip.law/ontology/ci-ops#OperationalChangeEvent"
  owl_entity_kind: class
definition:
  text: "An event (a dated occurrence) that is the landing of one change set altering how an arrangement of verification works, such as the heavy CI pool, the pre-push wave or the gate-order ladder as the recorded rows title them. Membership rests on the occurrence alone: whether a ledger row records the landing, when it is tagged, and whether a KPI series is partitioned at its instant are facts about the record and its consumers, not differentia of the class. A comparison made at the landing is observational, a temporal association and never a cause, unless a supporting design upgrades it; whether a given checkout falls after the landing is a further, adoption-qualified relation between the landing and that checkout, not part of the landing."
  source:
  - "CQ-016"
  - "po:sha256:d63c0a7e9e45785273230beae335f469760cdbfe3af9bd3502d00d72ffd1ca7f"
