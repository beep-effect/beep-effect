verdict: INDETERMINATE
needed_evidence: A comparison that keeps ordering/admissibility rule content and rule version fixed while
  changing the journal input, followed by a comparison that changes rule content with the input fixed.
  Each must identify whether the emitted descriptive target is the same reusable rule object or a distinct
  application-context record independently of policyDigest, journalPrefixDigest, or IRI spelling.
surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: 'AdmissionProjectionSpecification asserts parents: []; no is-a edge is proposed. Participant,
    component, or governing-role relations supply no additional subsumption assertion to test.'
revision_requests:
- Use the paired rule/input observations to select repeatable rule content or an application-context description
  in a new synthesis. If both are represented, separate their identity accounts and coordinate hasProjectionSpecification's
  target semantics. Preserve the deferral until the observations distinguish them.
