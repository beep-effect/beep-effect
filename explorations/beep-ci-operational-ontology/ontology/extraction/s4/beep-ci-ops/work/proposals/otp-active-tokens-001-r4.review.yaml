no_surface_reasons:
  taxonomy: >-
    The data-property proposal asserts no parents edge; no is-a or subproperty
    relation exists to test, so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: property-assertion-individuation
    counterexample: >-
      Two machines can each have five active tokens, and one machine can return
      to five after an intervening grant change. The card identifies assertions
      by admission context, observation boundary, and token convention rather
      than numeric equality, so it separates all three operational facts.
    outcome: survived
  - surface: warrant
    rule: semantic-support-preserves-derived-value-correctness
    counterexample: >-
      A stale or post-grant ETL value can still populate
      capacityAtAdmissionTokens and make CQ-010 syntactically answerable. The
      revised property exposes the deployed pre-grant active-charge operand at
      the same snapshot boundary, so removing it loses the stated check that
      the decision value is the pre-grant remainder. That is correctness support,
      not a merely mentioned listing term.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-runtime-discriminator
    counterexample: >-
      An inert status DTO can display a sum, but it cannot preserve the cited
      scheduler behavior that tests the live charge during promotion and rolls
      back a newly staged lease after a concurrent overshoot. The runtime-grounded
      admission quantity is therefore not exhausted by its DTO representation.
    outcome: survived
