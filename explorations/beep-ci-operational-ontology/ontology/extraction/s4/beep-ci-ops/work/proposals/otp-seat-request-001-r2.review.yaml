surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The class proposal asserts no parents edge, so it proposes no is-a relation
    whose rigidity, inherited identity, dependence, unity, or absence can be
    tested.
attacks:
  - surface: identity
    rule: identity-criterion-counterexample
    counterexample: >-
      Ticket files T1 and T2 can contain byte-identical owner, kind, charge, and
      timestamp values while being created by two enqueue acts on separate
      carriers. The card separates them through creation provenance and continuous
      carrier lineage rather than wrongly identifying them by value equality.
    outcome: survived
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      Copying T1 to another path with the same nonce and process coordinates does
      not make the copy the original record token. The card treats those technical
      keys as supporting evidence and still requires provenance-bearing lineage.
    outcome: survived
  - surface: warrant
    rule: cq-term-necessity
    counterexample: >-
      CQ-021 explicitly ranges over queued SeatRequest records and CQ-023 quantifies
      waiting SeatRequest instances governed by policy. Removing the class makes
      both decision queries inexpressible as written.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-persistence-dto
    counterexample: >-
      A queue persistence DTO can be documented as a contender waiting for
      admission, persist while queued, and be deleted when a lease is staged
      without acquiring a separately governed information-object identity. The
      revised open issue concedes this twin, but the analyzed hypothesis still
      rejects it.
    outcome: landed
rival_models_still_viable:
  - "The queued operational request as distinct from its record"
  - "The ticket information object as the deployed SeatRequest"
  - "A persistence DTO without independent record-token identity"
