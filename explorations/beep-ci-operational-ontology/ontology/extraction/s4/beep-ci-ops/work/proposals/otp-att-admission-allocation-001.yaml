  mappings:
  - iri: https://oip.law/ontology/ci-ops#SeatGrant
    compatibility: >-
      Exact reuse of the local SeatGrant term at recorded-value grain under sitting-1 Ruling
      2. The inventory's recorded admissionChargeTokens and literal hasOriginKey match the
      putative grant subject and charge/origin assertions in these leases, distinct from
      requested capacity on a SeatRequest. Nonce and recorded admission context preserve the
      evidence association; the two report snapshots are not counted as two grants and are not
      equated with an operational relator. The mapping retains explicitly_deferred operational
      continuity and does not infer uninterrupted allocation, active capacity or liveness. It adds no
      lease-record subclass and supplies no external equivalence.
