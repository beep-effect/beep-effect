term:
  preferred_label: seat grant
  local_name: SeatGrant
  proposed_iri: https://oip.law/ontology/ci-ops#SeatGrant
  owl_entity_kind: class
definition:
  text: >-
    An information object recording a putative grant's admission, charge and origin context at
    a lease-report boundary, with the associated enqueue, heartbeat and attachment assertions.
    The two supplied records describe the same candidate allocation under matching recorded
    admission context and different heartbeat values. They are two informational snapshots,
    not two established capacity allocations. Copying one snapshot preserves its content;
    changing its heartbeat gives a distinct recorded value. Their subject's effective standing and
    continuity across release or renewed admission remain explicitly deferred; the records can
    exist without any effective allocation.
