attacks:
  - surface: identity
    rule: record-issuance-identity-unobserved
    counterexample: >-
      Two equal in-memory status values for the same planned lane can be
      allocated twice, copied, or reconstructed without any observed issuance
      or correction lineage. The cited fields do not decide whether those are
      one information content assertion, two record tokens, or no retained
      artifact at all.
    outcome: landed
  - surface: warrant
    rule: semantic-support-not-necessary
    counterexample: >-
      CQ-022 and CQ-025 attach execution state, cancel class, duration, and
      estimate directly to WorkUnitExecution. Both queries remain answerable
      without a separate planned-lane status record or
      VerificationResultArtifact class.
    outcome: landed
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      A transient DTO can be explicitly about one planned lane, carry its
      execution status, repair command, id, and optional duration, and never
      acquire independent persistence or issuance identity. All claimed facts
      are true in that implementation-only twin.
    outcome: landed
rival_models_still_viable:
  - "The source denotes only a transient verdict value object."
  - "The value carries an information assertion but is not a separately issued artifact."
