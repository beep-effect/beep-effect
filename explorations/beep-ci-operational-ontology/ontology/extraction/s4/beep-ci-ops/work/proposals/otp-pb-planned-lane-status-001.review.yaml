revision_requests:
  - >-
    Address record-issuance-identity-unobserved by providing retained record
    issuance, parent-attempt, and correction lineage evidence, or model the
    schema value only as a carrier of an existing result assertion.
  - >-
    Address semantic-support-not-necessary and discriminator-true-of-dto by
    adding a decision CQ that consumes a VerificationResultArtifact and a
