no_surface_reasons:
  taxonomy: >-
    The data-property proposal asserts no parents edge; no is-a or subproperty
    relation exists to test, so no valid subsumption relation is presumed.
attacks:
  - surface: identity
    rule: property-not-event-identity
    counterexample: >-
      One request can be enqueued twice within one millisecond, and two requests
      can share the same recorded instant. The card supplies no event identity
      and keys each assertion to its request and enqueue occurrence, so equal
      timestamp values merge neither requests nor occurrences.
    outcome: survived
  - surface: warrant
    rule: cq-term-required
    counterexample: >-
      Removing enqueuedAt prevents CQ-021 from returning the enqueue instant
      projected for every queued SeatRequest. The property is a required answer
      column and deployed carrier, not a word mentioned only in listing prose.
    outcome: survived
  - surface: null_discriminator
    rule: deployed-queue-time-discriminator
    counterexample: >-
      An unused timestamp field could be implementation-only, but it would not
      preserve the deployed behavior that stamps the durable ticket and later
      compares the enqueue instant with current time to change effective
      priority. The runtime temporal relation is not exhausted by its field.
    outcome: survived
