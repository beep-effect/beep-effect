attacks:
  - surface: identity
    rule: deferred-continuous-situation-identity
    counterexample: >-
      Snapshots at 10:00 and 10:02 can both report the hard floor while memory
      recovered at 10:01, creating two situations rather than one. The rigid
      class and card use uninterrupted below-floor continuity and explicitly
      defer reidentification because the snapshots cannot establish that interval.
    outcome: survived
  - surface: warrant
    rule: support-warrant-self-contradiction
    counterexample: >-
      CQ-023 derives HardFloorException from the snapshot-global
      hardFloorEngaged assertion and can link the request directly to
      AdmissionPolicy. The revised definition and open issue concede that the
      continuous situation class is unnecessary, while operational_warrant
      still claims necessary support for AdmissionPolicy.
    outcome: landed
  - surface: null_discriminator
    rule: deployed-machine-condition-discriminator
    counterexample: >-
      A Boolean DTO alone cannot preserve the cited machine-side fact that
      measured available memory below the governed floor forces live admission
      capacity to zero. The world-side control situation survives the null test,
      although its continuity across observations remains deferred.
    outcome: survived
rival_models_still_viable:
