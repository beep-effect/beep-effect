  counterexample: 'Try a DTO with a decorative weight of 5 while active tokens are 6 and capacity is 10.
    The cited contract instead uses activeTokenTotal + weightTokens <= capacityMaxTokens: weight 5 fails
    that comparison while weight 4 satisfies it. The emitted integer therefore records a policy quantity
    with an admission consequence, even without an independent charge individual. This defeats the decorative-field
    null at the recorded-value grain; neither this hypothetical arithmetic case nor the synthetic fixture
    proves an actual admission.'
