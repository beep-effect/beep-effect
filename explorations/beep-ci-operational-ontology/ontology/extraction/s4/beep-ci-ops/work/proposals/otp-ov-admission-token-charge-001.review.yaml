verdict: INDETERMINATE
needed_evidence: A paired observation of one independently reidentified admission request before and after
  a policy repricing, recording the effective policy, assessment instant, both token values, and whether
  the charge assignment persists or is replaced. If the intended subject is only recorded charge content,
  an observation-backed account must distinguish successive assertions from that continuing burden. A
  subsequent grant assessment is also needed before any request/grant charge continuity can be asserted.
surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: 'admissionChargeTokens asserts parents: []; no is-a edge is proposed. Participant, component,
    or governing-role relations supply no additional subsumption assertion to test. The exact-reuse mapping
    retains the same IRI and asserts no new subclass edge.'
revision_requests:
- Use the paired assessment observation to align the term's recorded-value grain and its IdentityCard.
  A new synthesis may retain the scalar property with an analysis of contextual charge assertions, or
  retain a deferred burden candidate; it must not use the existing unresolved burden criterion as an accepted
  criterion for either charge assertions or grant charges.
