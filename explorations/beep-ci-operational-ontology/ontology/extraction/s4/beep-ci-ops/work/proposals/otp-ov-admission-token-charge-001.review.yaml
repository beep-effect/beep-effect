  counterexample: 'Three fixture requests each carry 5; equating the charges by integer value would merge
    their distinct bearers. Now let one request be reassessed from 5 to 4 without resubmission: one persisting
    burden, two policy assignments, and two recorded assertions have different counts. The proposal expressly
    disclaims the first merge and carries an unresolved IdentityCard for the remaining choice, so no positive
    sameness assertion is falsified. Its scalar definition does not by itself resolve that joined card''s
    burden-versus-record grain; the named paired assessment observation is missing.'
- surface: warrant
  rule: listing-cq-warrant
  outcome: survived
  evidence:
  - CQ-010
  - CQ-021
  - po:sha256:2e21ce839f96febdf894e032e2ca261e4c23bf370efc690bf6693c8c5ecad944
  - po:sha256:311749b614c23138639131cb71b425997e745ddd05e189c7f2891f032756d4b8
  counterexample: 'Replace the emitted charge by P95 duration or delete admissionChargeTokens: CQ-021
    loses its required charge binding and CQ-010 cannot perform its grant-charge comparison. Both executable
    queries require this property, which is exact reuse rather than an optional charge subclass. CQ-010''s
    pre-admission grant assessment is a distinct context from the request assertion shown here; the proposal
    explicitly preserves that distinction and does not claim the fixture answers the whole CQ.'
