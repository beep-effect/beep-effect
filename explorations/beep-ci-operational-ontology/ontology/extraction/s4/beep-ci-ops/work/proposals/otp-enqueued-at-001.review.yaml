verdict: FAIL
needed_evidence: ""
surfaces:
  taxonomy: no_surface
  identity: attacked
  warrant: attacked
  null_discriminator: attacked
no_surface_reasons:
  taxonomy: >-
    The proposal asserts no parents edge, so there is no proposed is-a relation to test; no
    valid subsumption relation is asserted or inferred.
attacks:
  - surface: identity
    rule: identity-card-entity-kind-mismatch
    counterexample: >-
      The proposal is a data property, but its IdentityCard individuates enqueue boundaries. If
      the same request is enqueued twice within one millisecond, the two occurrences are
      distinct while the available subject-value assertion and finite timestamp cannot
      distinguish them. Proposal rigidity unresolved, identity none, and FA explicitly_deferred
      agree with the IC; the card still analyzes event identity rather than property semantics.
    outcome: landed
  - surface: warrant
    rule: cq-term-required
    counterexample: >-
      If enqueuedAt is removed, the CQ-021 SELECT cannot bind its enqueuedAt result for any
      queued SeatRequest, and the CQ explicitly lists enqueuedAt among required_properties.
      Unlike a mere listing mention, this property is projected and therefore necessary.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-ticket-dto
    counterexample: >-
      A queue implementation with no modeled enqueue occurrence can stamp a ticket DTO with the
      current millisecond and later subtract it for priority aging. The exact
      creation-and-comparison behavior therefore survives in the implementation-only null world.
    outcome: landed
rival_models_still_viable:
  - "The ontology should model an enqueue event, with the instant as its temporal boundary."
  - "The enqueue time is a dependent temporal quality of the SeatRequest."
  - "Only the recorded millisecond timestamp value is required."
