    compatibility: The S5 inventory defines hasOriginKey as a string-valued property on SeatRequest or
      SeatGrant. The emitter records that same property on request representations, and the contract uses
      it as an ordering key. This proposes exact reuse of the request-side recorded value; it neither
      redefines the grant-side use nor asserts an identity relation to a repository object.
