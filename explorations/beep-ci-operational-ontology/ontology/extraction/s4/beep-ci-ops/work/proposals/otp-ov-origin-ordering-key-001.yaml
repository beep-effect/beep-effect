alternatives_rejected:
- 'Decorative field with no ordering effect: the contract explicitly includes originKey in the canonical
  comparison tuple.'
open_issues:
- 'Warrant justification: The named decision terms require the ordering convention to disambiguate the
  prescription under its governing rules. For requests tied on priority and enqueue time, the contract
  uses the origin key before the nonce; omitting its comparison meaning leaves the prescription''s deterministic
  ordering semantics incomplete. CQ-020 reads the already materialized order and does not directly query
  this key, so this is a support warrant.'
- 'Identity criterion carried from ic:ov-origin-ordering-key:001: Proposed at contextual value-assignment
  grain: sameness requires the same represented request in the same projection input with the same origin-key
  comparison value under that input''s ordering convention. Equal literals on different requests are equal
  comparison values, not the same request assignment or proof of the same repository. No repository-origin
  identity criterion is supplied.'
- 'Steward choice required before ratification of otp:ov-origin-ordering-key:001: The steward must choose
  the contextual scalar property proposed here, an independently represented key-assignment information
  object, or a reference to a domain repository origin after normalization and sameness have been established.
  The repository-reference rival would require new evidence and a separate object-valued interpretation;
  a shared string is not sufficient to adopt it or equate requests. Still-viable models retained from
  fa:ov-origin-ordering-key:001: Direct scalar data property used by canonical sorting, with no independently
  instantiated key object; Reference to a domain repository origin after an independently observed normalization
  and sameness contract.'
- 'Cluster dependency: otp:ov-schedule-proposal:001, otp:ov-projection-specification:001, otp:ov-seat-request:001.
  Coordinate ratification or parking where endpoint grain, component identity, or the stated warrant depends
  on these proposals; no dependent choice is settled by emission spelling.'
- 'Reuse search: The local hasOriginKey property matches the observed recorded string assignment. DOAP
  repository descriptions in the scout report denote repositories, not comparison strings, and provide
  no exact replacement for this property.'
- 'Evidence boundary: the concrete emission-v2 instances cited here are synthetic. The quoted emitter
  sites show represented content, and the cited S7 prose describes its contract. They do not establish
  that the example requests, selections, steps, or admissions occurred in the live scheduler.'
- 'Representation grain: the proposed property encodes contextual information content without requiring
  a separate assertion individual. The OntoClean fields are inherited from the joined identity card for
  that candidate content, not asserted as identity criteria for an RDF literal or for the OWL property
  universal.'
- The same synthetic origin-test value appears on three requests. That supports equality of comparison
  values, not request identity, repository identity, active-grant status, or a violation of the origin-exclusion
  constraint.
- The identity card's fixed information-assignment reading and relational dependence concern contextual
  assertions. The S5 property row's unresolved rigidity is not resolved as a property-universal claim
  by this proposal.
- No origin normalization, canonical repository sameness, or grant binding is observed in this chain.
- 'Strongest counterexample carried from fa:ov-origin-ordering-key:001: The fixture repeats origin-test
  on three distinct requests. Treating the common literal as request identity merges all three; treating
  it as evidence of simultaneous active grants manufactures a grant-exclusion violation. Hypothetically,
  two spellings for one repository could also sort differently unless normalization is independently specified.'
