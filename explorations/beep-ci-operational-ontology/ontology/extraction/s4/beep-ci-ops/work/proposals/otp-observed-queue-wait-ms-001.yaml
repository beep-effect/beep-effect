alternatives_rejected:
  - >-
    Implementation-only logging value rejected by the hardened discriminator:
    the deployed queue uses elapsed waiting to promote an eligible verify
    request to publish priority after the configured aging window, so the
    time-indexed relation changes admission ordering rather than merely
    formatting a log message.
  - "Rejected category alternative: a separate reified queue-wait quality token."
