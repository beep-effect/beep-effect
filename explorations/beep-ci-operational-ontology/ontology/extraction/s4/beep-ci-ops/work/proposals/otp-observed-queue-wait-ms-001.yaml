term:
  local_name: "observedQueueWaitMs"
  preferred_label: "observed queue wait milliseconds"
  proposed_iri: "https://oip.law/ontology/ci-ops#observedQueueWaitMs"
  owl_entity_kind: data_property
definition:
  text: >-
    A data relation from a queued SeatRequest at a specified observation
    boundary to the elapsed milliseconds since its enqueue boundary. CQ-023
    requires this time-indexed operational fact so starvation analysis can
    compare the request's wait with the applicable bound; equal numeric values
    or duplicate collector records do not introduce distinct quality tokens.
  source:
    - "CQ-023"
    - "so:sha256:aae98d5927e0b5760e2cd21c7eb757857be3c4a618f5c59c83191a9311cff21b"
