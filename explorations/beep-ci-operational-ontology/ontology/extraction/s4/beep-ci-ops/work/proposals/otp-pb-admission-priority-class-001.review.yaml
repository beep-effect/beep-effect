attacks:
  - surface: identity
    rule: role-rigidity-unsupported
    counterexample: >-
      A request may receive verify or publish once at creation and retain that
      classification for its whole lifetime; the only observed later change
      is effective rank, not the recorded class. Such data are compatible
      with a rigid quality or controlled vocabulary, so the anti-rigid role
      assertion outruns the evidence.
    outcome: landed
  - surface: warrant
    rule: decision-cq-requires-term
    counterexample: >-
      CQ-021 explicitly projects the priority class of every queued request
      through hasPriorityClass; eliminating AdmissionPriorityClass would make
      that required answer component untyped.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-enum-dispatch
    counterexample: >-
      An implementation-only verify/publish field can be non-interchangeable,
      drive publish-before-verify sorting, and participate in an aging
      comparator. Those consequences do not distinguish a request-borne role
      from a LiteralKit plus branch logic.
    outcome: landed
