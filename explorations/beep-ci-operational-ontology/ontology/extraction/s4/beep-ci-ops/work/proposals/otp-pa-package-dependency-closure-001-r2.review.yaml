attacks:
  - surface: identity
    rule: contextual-reachability-fact-identity
    counterexample: >-
      Multiple paths in one pinned graph can connect the same package pair, and
      a later graph can preserve that pair through a different path. The card
      treats paths as support and includes graph context, so neither case
      confuses the contextual reachability fact.
    outcome: survived
  - surface: warrant
    rule: direct-cq-warrant
    counterexample: >-
      Removing dependsOnTransitive makes CQ-004 unable to return packages
      reachable through indirect declared dependencies. The CQ directly needs
      the relation rather than a name for the closure algorithm.
    outcome: survived
  - surface: null_discriminator
    rule: formal-relation-independent-of-predicate-spelling
    counterexample: >-
      Renaming the Datalog predicate or replacing the fixpoint engine preserves
      which package is reachable from which in the pinned graph. The relation
      therefore survives removal of its current query spelling.
    outcome: survived
