no_surface_reasons:
  taxonomy: >-
    The individual proposal asserts no parents edges, so there is no proposed
    is-a or subsumption relation, including no edge for which a no-relation result
    could be preferred.
attacks:
  - surface: identity
    rule: unresolved-takes-precedence
    counterexample: >-
      CI run E1 can preserve sanctioned remote cache access while explicit-argument
      run E2 can disable caching; both receive the caller-controlled tag. The card
      says it is unresolved whether these are two invocation modes, two situations,
      or occurrences of one vocabulary value, yet the proposal commits one
      individual and records identity as none rather than unresolved.
    outcome: landed
  - surface: identity
    rule: identifier-is-identity
    counterexample: >-
      E1 and E2 share the same _tag and proposed IRI while having incompatible
      effective permissions. The technical tag cannot decide whether they share a
      referent; using the tag as the individual before the reading is settled
      launders the identifier into identity.
    outcome: landed
  - surface: identity
    rule: foundational-status-and-rival-disclosure
    counterexample: >-
      Marking this proposal analyzed would suppress the unresolved mode, situation,
      controlled-vocabulary, and record-content readings. The proposal correctly
      remains explicitly_deferred, matches the FA verdict, and names the evidence
      and rivals, so the status portion of the attack survives.
    outcome: survived
  - surface: warrant
    rule: cq-term-necessity
    counterexample: >-
      CQ-024's notes close CachePosture over three deployed arms and explicitly
      distinguish CallerControlled for CI and explicit cache arguments. Omitting
      that value makes the required posture domain semantically incomplete.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-tagged-dto
    counterexample: >-
      A tagged resolver DTO can return {_tag: caller-controlled, reason: ci} or the
      same tag with reason explicit-cache-arg solely to control CLI flag injection.
      Both branches and their invocation dependence remain true without any
      world-level posture individual.
    outcome: landed
rival_models_still_viable:
  - "Information content in an invocation-scoped cache-plan record"
  - "A control-allocation situation among caller, CLI, and invocation"
  - "One controlled-vocabulary value in the CachePosture domain"
