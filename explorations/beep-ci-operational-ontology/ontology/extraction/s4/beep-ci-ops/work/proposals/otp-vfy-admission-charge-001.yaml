term:
  preferred_label: admission charge tokens
  local_name: admissionChargeTokens
  proposed_iri: https://oip.law/ontology/ci-ops#admissionChargeTokens
  owl_entity_kind: data_property
definition:
  text: 'The admission charge a seat request or seat grant carries, recorded as weightTokens: the share
    of shared verification capacity it claims, present from the enqueue row (a request withdrawn without
    a grant carries it) and equal on two full-proof grants whose release-time memory peaks differ about
    tenfold, so a claim on capacity and not a reading of use.'
