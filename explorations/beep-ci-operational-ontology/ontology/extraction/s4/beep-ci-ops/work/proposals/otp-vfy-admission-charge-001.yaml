alternatives_rejected:
- 'Measured resource use of the granted work: rejected by the analysis; equal charges co-occur with memory
  peaks about ten times apart (so-95b7d78a061f, so-363f9b7f07dc).'
open_issues:
- flag admissionChargeTokens persists; no lift claimed
- No cited chain shows a repricing (enqueue and admit rows carrying different weightTokens), an assertion
  replacement, a request-to-grant continuity join or pre-admission capacity evidence; each absence is
  a sample limit, so the flag's deferrals stand.
- 'Warrant: CQ-010 (must_have) reads ciops:admissionChargeTokens on the admitting grant and loses the
  charge side of its charge-against-capacity comparison without it; CQ-021 (must_have) reads it on each
  queued request and loses its charge column.'
- 'Steward choice (rivals still viable on fa:vfy-admission-charge:001): the charge as a quality individual
  inhering in its bearer, as a relational claim mode on a capacity pool, or as an attribute of the work
  kind, against the value-only reading this data property fits. A class-level charge on any of the first
  three readings would need its own proposal; none is made, and the entity kind is a data property on
  the ratified row, not on the card.'
- 'Needed evidence (fa:vfy-admission-charge:001, verbatim): The category stays unresolved among four viable
  readings. To retire one of the quality and value-only rivals: an admission chain whose weightTokens
  differs between its admission-enqueued and admission-admitted rows (repricing), or a deployed statement
  that the charge is recomputed at admission. To decide the relational claim mode: a record showing whether
  the charge can exist apart from a capacity pool or snapshot (a charge stated with no pool, or one restated
  against a second pool). To decide the work-kind attribute: one work kind carrying two weights, or a
  charge recomputed per request.'
- Depends on otp:vfy-seat-request:001 and otp:vfy-seat-grant:001 (its domain) and on otp:vfy-admission-work-kind:001
  (the member that fixes the value in every cited chain). capacityAtAdmissionTokens, CQ-010's other side,
  is not grounded by this chain.
