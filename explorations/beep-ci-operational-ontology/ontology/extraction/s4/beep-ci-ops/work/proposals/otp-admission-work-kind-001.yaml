definition:
  text: A governed closed-vocabulary specification whose full-proof, merged-preview, review-fix, and publish values classify
    queued admission work for CQ-021 and carry the deployed charge mapping of three, five, one, and one tokens respectively.
    Publish remains a reserved value even though current heavy publish proof requests use the full-proof kind.
