alternatives_rejected:
- A certificate whose green fields alone prove current correctness or transferable verification would
  erase the recorded assessment context and missing applicability conditions.
- The execution and assessment occurrence described by a verdict are not the persisted result object;
  an occurrence-centered rival must model the distinction explicitly.
- 'A projection containing several verdicts is not a single result artifact: the failed verification
  and successful monitoring belong to different attempts and heads.'
open_issues:
- Semantic support for otp:att-verification-attempt:001 is the grouping that keeps a reported failed
  step and unexecuted components on their own recorded invocation. The same grouping preserves
  measurement targets and whole-attempt versus component scope as attributes of that account.
  A consumer cannot move a later monitor result or its duration onto an earlier failed verification
  merely because the projection contains both. The retained target is a decision term; no separate
  wall-time evidence class is required by this support warrant.
- 'STEWARD CHOICE REQUIRED before ratification: choose this assessment-origin information unit, the
  still-viable dated assessment event with a separate informational result, or the still-viable assertion-content
  object that merges identical independent assessments. Do not identify those alternatives. Observe
  independent equal-content assessments and a correction/copy lifecycle to distinguish their sameness
  rules.'
- 'Direct identity-choice pair: otp:att-attempt-verdict:001 versus otp:ver-attempt-verdict:001. Both
  propose ciops:VerificationResultArtifact, but this card preserves assessment origin while the other
  selects a bounded assertion-content snapshot and leaves dependence unresolved. The steward must
  select a common compatible criterion, keep explicitly distinct shapes through revision, or park
  a mapping; accepting both as interchangeable would silently merge the rival models.'
- Ratify or park this support proposal together with otp:att-verification-attempt:001
  if its selected shape requires a result object. A qualified-assertion alternative can replace
  that dependency only through an explicit modeling choice that retains the same target and scope
  bindings.
- A selected proof tier and stored head/diff/environment/stage describe assessment context, not a
  demonstrated acceptance or transfer rule. Epoch validity, invalidation, complete readiness criteria,
  current eligibility, complete running-work inventory, and the cost estimate used at admission remain
  unestablished. The failed lane's recorded duration differs from the enclosing attempt elapsed time.
- 'Reuse search: the scout report''s PROV entity and OSLC automation-result candidates are broader
  alignments. They do not settle local report individuation or evidence validity; no external exact
  mapping or superclass is proposed.'
