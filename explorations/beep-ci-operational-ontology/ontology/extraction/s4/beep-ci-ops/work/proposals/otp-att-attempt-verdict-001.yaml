term:
  preferred_label: verification result artifact
  local_name: VerificationResultArtifact
  proposed_iri: https://oip.law/ontology/ci-ops#VerificationResultArtifact
  owl_entity_kind: class
definition:
  text: An information object originating in one assessment of an operational attempt and recording
    that assessment's outcome, component results, measurements, and asserted applicability context.
    Copies preserving the originating assessment and its asserted content are the same unit; a new
    assessment or corrected assertion is another unit. Findings from different finished-attempt records
    remain distinct even when collected in one projection. The artifact can remain available after
    its findings become stale or disputed, without being the execution, its failure event, or an authorization
    to reuse evidence.
