revision_requests:
  - >-
    Non-blocking: restate the null discriminator as what it shows, a claim made at enqueue and held
    fixed against measured use (it separates the charge from the measured-use reading), not a
    refutation of every implementation-only reading; a per-kind constant written at enqueue would
    show the same facts.
attacks:
  - surface: taxonomy
    rule: reuse-semantic-match
    counterexample: >-
      Tried a bearer outside the ratified domain (SeatRequest or SeatGrant, xsd:integer recorded
      value, flagged). The chain shows weightTokens on the enqueue row of a request withdrawn without
      a grant (so-0d75ae7174ed, 5) and on a lease state record of a held grant (so-a8d270b5e19d,
      schemaVersion yeet-admission-lease/v1, 5), both bearers inside the ratified domain, with integer
      values 1, 3 and 5 only. No placement beyond the ratified domain is asserted. Survived.
    outcome: survived
  - surface: identity
    rule: identity-conflict
    counterexample: >-
      Tried request-versus-grant charge continuity: so-95b7d78a061f carries one weightTokens=3 across
      enqueue, admit and release under one nonce; a bearer criterion counts two charges if request and
      grant are two bearers, the value-only reading one value. The card leaves this unresolved and the
      proposal claims no lift of the request/grant continuity flag, so no criterion conflicts with the
      ratified row. Survived.
    outcome: survived
  - surface: warrant
    rule: listing-cq-warrant
    counterexample: >-
      Tried whether either CQ answers without the term. CQ-010's query reads ?charge only through
      ciops:admissionChargeTokens on ?grant and filters it against capacity: without the property it
      returns zero rows on a must_have invariant whatever the data, a vacuous green. CQ-021's query
      projects ?charge through the same property on each queued ?req. Both queries bind it. Survived.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-true-of-dto
    counterexample: >-
      Built the twin of a per-kind constant written at enqueue with no domain meaning: it would also
      sit on a never-granted request and ignore memory use. For a flagged ratified term reused with
      no lift claimed, the attack is on semantic match: the discriminator shows the chain's value is
      a claim fixed before use (so-95b7d78a061f and so-363f9b7f07dc both full-proof with
      weightTokens=3, memoryPeakBytes 23492841472 against 2393948160), which is the ratified
      recorded-value charge grain and not a usage reading. Survived on that test.
    outcome: survived
rival_models_still_viable:
  - >-
    charge as an attribute of the work kind rather than of the bearer; discriminating fact: one work
    kind carrying two weightTokens values, or one chain whose enqueue and admit rows carry different
    values
