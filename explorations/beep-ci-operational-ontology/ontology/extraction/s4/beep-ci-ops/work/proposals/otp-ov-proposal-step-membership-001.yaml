alternatives_rejected:
- 'Serializer adjacency without membership meaning: explicit proposal-to-step assertions and the admitted-step
  restriction give the relation prescription structure.'
open_issues:
- 'Warrant justification: CQ-020 needs proposal-specific membership to select the steps of the current
  prescription. CQ-019 uses the same membership path to attribute a step scope tag or derived work scope
  to the responsible proposal; losing that path prevents the scope-provenance check.'
- 'Identity criterion carried from ic:ov-proposal-step-membership:001: Proposed at assertion-content grain:
  two representations express the same membership when the same step component belongs to the same containing
  prescription content and version. Membership is relative to that prescription; reusing a step identifier,
  request identifier, or ordinal in a different prescription does not identify the same membership.'
- 'Steward choice required before ratification of otp:ov-proposal-step-membership:001: The steward must
  choose a direct structural membership assertion in the proposal context, as proposed here, a separately
  reified assertion of that membership, or sequence entries whose membership is implicit. The direct property
  is a representation of the analyzed information content, not an independent membership individual. A
  sequence-only choice must preserve the proposal attribution required by both decision questions. Still-viable
  models retained from fa:ov-proposal-step-membership:001: A structural part relation recorded directly
  as a proposal-to-step property; An ordered prescription with membership implicit in contextual sequence
  entries.'
- 'Cluster dependency: otp:ov-schedule-proposal:001, otp:ov-schedule-step:001. Coordinate ratification
  or parking where endpoint grain, component identity, or the stated warrant depends on these proposals;
  no dependent choice is settled by emission spelling.'
- 'Reuse search: The S5 inventory has no hasStep property. The scout report offers P-Plan plan membership
  as a related structural pattern, but gives no exact match for this contextual admission-prescription
  membership and direction. No external identity or inverse axiom is proposed.'
- 'Evidence boundary: the concrete emission-v2 instances cited here are synthetic. The quoted emitter
  sites show represented content, and the cited S7 prose describes its contract. They do not establish
  that the example requests, selections, steps, or admissions occurred in the live scheduler.'
- 'Representation grain: the proposed property encodes contextual information content without requiring
  a separate assertion individual. The OntoClean fields are inherited from the joined identity card for
  that candidate content, not asserted as identity criteria for an RDF literal or for the OWL property
  universal.'
- The containing fixed prescription is constitutive context. Neither a shared request nor the integer
  zero permits merging step memberships from different proposals. The observed partition rule is not a
  declaration that the observation batch completely inventories pending requests.
- 'Strongest counterexample carried from fa:ov-proposal-step-membership:001: Hypothetical counterexample:
  two proposals both contain a step at ordinal zero, perhaps scheduling the same request. Merging their
  membership assertions by ordinal or request erases which prescription each step belongs to. Adding a
  deferred request as a step would likewise change the prescribed component set, despite no actual admission
  having occurred.'
