attacks:
  - surface: identity
    rule: identifier-is-not-identity
    counterexample: >-
      Two repositories can both name a task build while prescribing different
      inputs and dependencies, and many executions can realize one task. The
      criterion separates those cases by governed semantic lineage and content
      rather than by task key, configuration bytes, or run identifier.
    outcome: survived
  - surface: warrant
    rule: cq-term-required-under-specification-execution-split
    counterexample: >-
      Treating CQ-002's WorkUnit spelling as an opaque execution-bearing class
      would collapse the binding specification/execution split. The sitting
      struck that reading: the queried lane-by-scope WorkUnit is the repeatable
      WorkUnitSpecification, so the proposal's CQ-002 warrant survives.
    outcome: survived
  - surface: null_discriminator
    rule: discriminator-false-in-null-world
    counterexample: >-
      A formatting-only turbo.json entry can repeat a task label, but it does
      not thereby prescribe inputs, upstream dependencies, persistence,
      outputs, and completion behavior. The joined task clauses carry
      repeatable work content independently of any execution or carrier copy.
    outcome: survived
rival_models_still_viable:
  - "A concrete turbo.json entry token is distinct from its repeatable specification content."
  - "A VerificationLane can coordinate several WorkUnitSpecifications without being one of them."
