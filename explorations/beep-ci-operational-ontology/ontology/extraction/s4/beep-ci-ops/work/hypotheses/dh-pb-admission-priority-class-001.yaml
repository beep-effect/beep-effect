null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: "The two handler observations instantiate verify and publish values, while the contract assigns publish precedence over verify and the aging comparison can alter ordering rank. The classification therefore has consequences for request ordering beyond its string spelling."
  discriminator: "Requests carrying the quoted publish value precede verify requests under the contract, while elapsed queue time can change the verify request's rank; that ordering difference would be false if verify and publish were merely interchangeable handler literals."
