cq_warrants: []
proposed_referent:
  label: "change artifact (pull request and merge commit)"
  description: "The repository artifact that carries a change: the pull request each row names ('pr') and the commit that merged it ('mergeCommit'). Individuated by the merge commit, one per row. The records do not separate it from the landing (dh:chg-change-landing:001): every row carries a mergeCommit and a pr, the four whose titles add 'applied <date>' or 'live <date>' included, and no record gives the merge time apart from that date. KPI law section 2 names the merge commit in its membership rule (a checkout is in the post-period only when its HEAD ancestry includes the event's merge commit); that mention is recorded here, not argued as support for a CQ-warranted kind. All 44 rows instantiate it."
representation_status: unresolved
alternatives:
- label: "the landing occurrence (dh:chg-change-landing:001); discriminated by a record giving the merge time and the applied or live time separately for one change"
  representation_status: domain_referent
  plausibility: viable
- label: "pull-request and commit identifiers as ledger cross-references only"
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: false
  rationale: "The null stands, unresolved (no pinned Must/Should CQ needs the pull request or the merge commit: the CQ-016 query reads only the class and landedAt, and these members are not argued as support for a CQ-warranted kind). The decision a CQ would serve: which merge commit decides whether a checkout's episodes fall in a change's post-period, and which pull request carried a change. Named missing decision: a Must/Should CQ is required and run 4 admits no CQ edit beyond CQ-009. Needed evidence for the artifact/landing split: a record giving the merge time and the applied or live time separately for one change; for membership, an adoption census of checkout heads against a merge commit."
  discriminator: ""
epistemic_status: proposed
