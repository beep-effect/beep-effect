cq_warrants:
- CQ-010
- CQ-021
proposed_referent:
  label: admission charge (the share of shared capacity a request claims and a grant holds)
  description: 'One instance is the charge one request or grant carries (`weightTokens`), a quantity claimed against the shared
    capacity rather than a measure of what the work used. It is fixed by the work kind across these records (`kind=merged-preview`
    with `weightTokens=5`, `kind=full-proof` with `weightTokens=3`, `kind=review-fix` with `weightTokens=1`) and is present
    from the enqueue row, so requests that were withdrawn without a grant carry it. Individuated as the charge of one request
    or grant (it depends on its bearer and has no identity apart from it). Every chain record, the record-0 stanza and the
    lease state record so-a8d270b5e19d carry it. Answers CQ-021 (the admission charge of a queued request) and CQ-010 (the
    charge admitted against remaining capacity). Not shown: a chain whose enqueue and admit charges differ; the de-duplicated
    fact set would show two `weightTokens` values if one existed, and none does here, which is an absence and not evidence
    that repricing never happens.'
representation_status: domain_referent
alternatives:
- label: a plain attribute value of the seat request with no referent of its own (a field, not a quantity kind)
  representation_status: implementation_artifact_only
  plausibility: weak
- label: measured resource use of the granted work (see dh:vfy-peak-memory-use:001, which the records keep apart)
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The null reading is that `weightTokens` is a scheduler counter with no domain meaning. The records show a quantity
    claimed before any work runs and held constant while the work's measured consumption varies widely, which is what a claim
    on shared capacity is and what a counter mirroring execution would not be.
  discriminator: so-95b7d78a061f and so-363f9b7f07dc are both `kind=full-proof` grants carrying `weightTokens=3` while their
    `memoryPeakBytes` readings differ by about a factor of ten, and the never-granted request so-0d75ae7174ed already carries
    `weightTokens=5` beside `_tag=admission-withdrawn`; the charge is claimed at enqueue and is not a reading of use.
epistemic_status: proposed
confidence:
  value: 0.55
  use_for_acceptance: false
