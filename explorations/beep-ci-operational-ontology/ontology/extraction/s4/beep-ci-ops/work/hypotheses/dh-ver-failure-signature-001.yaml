cq_warrants:
- CQ-013
proposed_referent:
  label: Candidate cross-attempt failure signature
  description: A possible repeatable diagnostic pattern grounded in recorded failed-step and failure-kind
    values. The candidate concerns whether separate attempt failures can be grouped for attributed-delay
    ranking and comparison of surfacing lanes. It does not equate every step-exit report, every occurrence
    of the same failedStepId, or a pair of diagnostic codes with the same underlying fault. Individual
    failure reports already carry meaningful evidence even if a stable cross-attempt signature cannot
    be established.
representation_status: unresolved
alternatives:
- label: Per-attempt failure classification with no cross-attempt identity commitment
  representation_status: information_artifact
  plausibility: viable
- label: A recurring operational failure pattern shared by several occurrences
  representation_status: domain_referent
  plausibility: viable
- label: A pair of error-routing codes without a domain-level signature referent
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: '"failureKind=step-exit" occurs with distinct failedStepId values, while "failedStepId=full:00-cheap-gates"
    occurs with both "failureKind=handler-error" and "failureKind=step-exit". Those facts distinguish
    diagnostic reports, but do not establish what makes two reported failures the same signature. Nor
    does any elapsedMs field establish delay attributed to a signature or a cheapest surfacing lane. A
    supplied normalization/identity rule, applied examples separating same versus different signatures,
    and the attribution linkage would decide this candidate. Without that evidence the implementation-code
    interpretation survives; naming a CQ or a failed step cannot supply the missing discriminator.'
  discriminator: ''
epistemic_status: proposed
confidence:
  value: 0.53
  use_for_acceptance: false
