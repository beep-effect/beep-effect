proposed_referent:
  label: Prescribed admission step
  description: A represented component of an admission schedule, bearing an ordinal, a request assignment,
    and a scope tag. Its candidate referent is a component of a prescription; a step occurrence in a running
    verification is not established by these observations.
representation_status: information_artifact
alternatives:
- label: Position in an ordered prescription without a separately individuated step object
  representation_status: information_artifact
  plausibility: viable
- label: Actual execution or completed admission event
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The emitter and fixture assert step typing in the provisional output, while the contract
    restricts steps to admitted actions in the prescribed sequence. This is evidence for schedule components
    whose ordering is queried, rather than an inference from the schema name alone. Fixture steps demonstrate
    representational shape. The observations leave open whether component identity needs a separate object
    or can be supplied by the containing sequence.
  discriminator: The quoted emitter emits "${stepSubject} rdf:type ciops-prov:ScheduleStep ."; the fixture
    types both step-0 and step-1 accordingly. The determinism rule states "Only admitted actions get steps;
    the deferred tail never extends or renumbers that sequence". A purely incidental implementation element
    could not carry that asserted distinction between prescribed positions and deferred requests.
epistemic_status: proposed
confidence:
  value: 0.9
  use_for_acceptance: false
