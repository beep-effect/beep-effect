cq_warrants: 
- "CQ-016"
proposed_referent:
  label: "landing of a change to a verification mechanism"
  description: "A dated occurrence: one change to how verification, admission, ordering, caching, sharding, gate selection, lane assembly or hosted-runner capacity works lands. Answers the class term OperationalChangeEvent, the class side of the CQ-016 pair; the property side, landedAt, is dh:chg-landing-instant:001. The class and the property need distinct observations downstream (an index row references one proposal per observation): synthesis must assign distinct observations to the class and to the property. As the records give it, each row carries a title, a 'landedAt' instant, a 'mergeCommit' and a 'pr'; four titles add a date ('applied 2026-09-09', 'applied 2026-10-01', 'applied 2026-10-06', 'live 2026-09-15'), and those rows carry a mergeCommit and a pr like every other row. KPI law section 2 makes wall-clock landedAt the per-row series partition point and labels each comparison at it OBSERVATIONAL by default, so the occurrence is a temporal association, never a cause. When a change holds for a given checkout is left to the adoption hypothesis (dh:chg-adoption:001): a checkout is in the post-period only when its HEAD ancestry includes the event's merge commit. An instance is the change one row records together with its dated landing. Whether a later row that supersedes or retires an earlier one ('superseded by #1022' on the #1019 row; 'per-origin proof lock RETAINED (until #929)' on the #870 row and 'per-origin lock retired after drain' on the #929 row) records a distinct instance or a revision of the same change is not decided by the records; both readings are carried. All 44 change-event rows instantiate it."
representation_status: domain_referent
alternatives:
- label: "one change revised or superseded across rows: the #1019 row ('superseded by #1022') and the #870 row whose retained lock the #929 row retires would each record one change landing in several rows; discriminated by a record saying whether the earlier row's alteration still holds after the later row lands, or naming the later row a revision of the earlier change rather than a change of its own"
  representation_status: domain_referent
  plausibility: viable
- label: "curated ledger row about a change (dh:chg-change-record:001); discriminated by a record of a row corrected while the landed change stays the same"
  representation_status: information_artifact
  plausibility: viable
- label: "the change artifact itself, the pull request or merge commit (dh:chg-change-artifact:001); every row, the 'applied <date>' and 'live <date>' rows included, carries a mergeCommit and a pr, so the records do not split artifact from landing. Needed evidence: a record giving the merge time and the applied or live time separately for one change"
  representation_status: unresolved
  plausibility: viable
- label: "a causal control intervention; KPI law section 2 forbids this reading without a supporting design (paired pre/post cohorts under adoption qualification)"
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: "The null falls: the rows date alterations of verification mechanisms around which a measurement law partitions KPI series, which ledger bookkeeping alone would not supply. The self-applied label 'class: OperationalChangeEvent', the row id and the 'causalStatus' value are not used as evidence. Causal standing is not claimed: every row carries 'causalStatus: observational'. Needed evidence for the artifact/landing split: a record giving the merge time and the applied or live time separately for one change."
  discriminator: "Rows date a change to something the ledger does not hold, 'the heavy CI pool moves from Spot to On-Demand (applied 2026-09-09)' and 'the heavy CI pool contained to two Spot runners (live 2026-09-15)', and KPI law section 2 partitions KPI series at these events ('the KPI moved after X landed') with post-period membership tied to 'the event's merge commit'; a bookkeeping row has no pool that moves, no applied or live date and nothing that lands."
epistemic_status: proposed
confidence:
  value: 0.55
  use_for_acceptance: false
