proposed_referent:
  label: issued verification evidence record (a proof fact in a clone's proof ledger)
  description: 'One instance is one `kind=fact` record the proof ledger issues for one lane run: it records the run''s verdict
    (`outcome=passed` or `outcome=failed`), the tree it was run against (`headSha`), the epoch (`epochDigest`), the command
    (`commandDigest`), the declared inputs (`inputDigest`, `inputSource`), `envProfile`, `tier`, `stage`, `recordedAt` and
    an `expiresAt` thirty days later. What individuates an issued item is the issuing write (one ledger record, recordedAt
    plus laneId within its attempt), not its content: two facts with equal content issued at different writes would be two
    items, and a copy in another ledger would be a copy, not the item; no cited record shows a copy, a correction or a realized
    reuse. Presence in one clone''s ledger (the `ledgers/<clone>/` path) shows only where the record is held; custody as a
    relation (who may consult or transfer the item) is not shown by any cited record. `outcome=failed` facts (so-2601c6b77d87,
    so-c997b4851faa) are issued like passed ones. The `kind=hit` shadow so-dc1dce23ac11 (with its twin so-e66e1190087c) is
    cited because it consults a prior fact by `factRecordedAt`. Answers the VerificationEvidence term of CQ-005, CQ-006, CQ-014
    and CQ-015. Record pairs so-dc1dce23ac11/so-e66e1190087c, so-d6adeec15c79/so-fcbe894799ea are each one record span seen
    twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
representation_status: unresolved
alternatives:
- label: the lane-run verdict occurrence itself (what the record is about)
  representation_status: domain_referent
