- label: a build-cache entry kept only to skip work (bookkeeping; the null reading, which a cited fact consulted for something
    other than a skip decision would discriminate)
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The null stands. The `kind=hit` shadow so-dc1dce23ac11 names a prior fact by `factRecordedAt` some twenty-five
    minutes before its own `recordedAt`, and every cited fact carrying both stamps carries an `expiresAt` thirty days after
    `recordedAt`; both are equally true of a build-cache entry kept only to skip work, which a later run looks up and which
    carries its own expiry. The other cited members do not separate the two either: the verdict, head, epoch, command and
    input digests are what such an entry is keyed and validated on, and the `outcome=failed` facts (so-2601c6b77d87, so-c997b4851faa)
    are consistent with a cache that also holds negative results. The one cited consultation is a shadow skip decision, not
    a use of the fact as evidence for anything else. Needed evidence: a record of a fact consulted for something
    other than skipping work (a readiness or closeout verdict citing it, or a review naming it), or a fact copied to another
    ledger or corrected as the same item.'
  discriminator: ''
