null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The null falls on measured run properties recorded independently by two record kinds. Spec versus execution
    is kept: the lane id recurs across attempts and trees, the execution does not. Needed evidence for a bounded interval:
    a lane record with start and finish instants.'
  discriminator: 'so-ca8b3f90e57c records lane `prepare:01-effect-imports` with `exitCode=0` and `durationMs=7094.398349`,
    and the fact so-2601c6b77d87 (`laneId=quality:coverage`, `outcome=failed`) and its shadow so-b1c417f14329 (`observed=failed`)
    carry the same `durationMs=618708.236225`: an exit status, and a duration and verdict agreed by two records of different
    kind, would be false if no lane run occupied that time.'
epistemic_status: proposed
