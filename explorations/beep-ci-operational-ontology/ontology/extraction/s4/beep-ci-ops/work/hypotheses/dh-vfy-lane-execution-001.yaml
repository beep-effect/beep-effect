proposed_referent:
  label: lane execution (one run of one verification lane within one attempt)
  description: 'One instance is one run of one verification lane inside one attempt, individuated by (attempt, lane id); the
    lane id names the reusable lane (dh:vfy-verification-lane:001), the execution is its run. Two record classes carry it:
    verdict lane entries in the attempt journal (`id`, `label`, `phase`, `status`, `durationMs`, `exitCode` on so-ca8b3f90e57c;
    `peakRssKb` on so-bbe03a405b80; `inputDigest` and `parentLaneId` on so-5d4b45aa3226, a lane nested under `full:01-pre-push`),
    and proof-ledger fact/shadow pairs sharing attempt, laneId, key, durationMs and recordedAt (for example so-0d463294884b/so-e26c033721f6,
    so-1de864e5f2e5/so-12d5a26fbfac, so-5447e1434526/so-c997b4851faa, so-b1c417f14329/so-2601c6b77d87; so-7c5446b68304 and
    so-d649f17f1b97 show runs whose fact is not cited, and no absence is inferred). Each run is ended by a verdict (`status`
    on the lane entry, `outcome` on the fact, `observed` on the shadow). `durationMs` is a per-lane wall measure, not a bounded
    interval with known start and end. `parentLaneId` shows lane executions nested inside lane executions; no cited pair shows
    a verdict lane entry and a ledger lane record of the same attempt, so whether the two classes ever record one run is not
    shown. Answers the WorkUnitExecution term of CQ-022, CQ-024 and CQ-025 (CQ-025 names the verdict lane `durationMs` as
    the actualWallMs carrier). Record pairs so-1a2d6fd275d6/so-1dc3d062f26a, so-d6adeec15c79/so-fcbe894799ea are each one
    record span seen twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
