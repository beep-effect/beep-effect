cq_warrants: ["CQ-021"]
proposed_referent:
  label: "Request enqueue occurrence"
  description: >-
    An instance is one occurrence registering a request in the admission queue, dated by an
    admission-enqueued entry's enqueuedAtMillis. The occurrence marks the opening boundary of
    that request's recorded waiting segment; later admission, withdrawal, or ticket eviction
    concerns the request's subsequent history, not the duration of the enqueue occurrence
    itself. The 46 chains with an explicit admission-enqueued tag instantiate this candidate.
    The five admission records that merely retain an earlier enqueue timestamp support the
    request history but are not counted here as separately observed enqueue entries.
    Ticket-eviction-only records provide no opening boundary. Enqueue neither confers a grant
    nor reports the start of work execution.
representation_status: domain_referent
alternatives:
  - label: "The enqueue assertion in a journal entry, rather than the queue-registration occurrence it describes"
    representation_status: information_artifact
    plausibility: viable
  - label: "The request's queued condition, with no separately reified registration occurrence"
    representation_status: domain_referent
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    An explicit enqueue event supplies the recorded transition into contention needed to
    interpret a request's enqueue time. It is separated from the request that may remain queued.
    The source batches differ between operational and informational readings of chains
    containing this boundary; the informational reading remains viable. A correlated queue
    insertion observed independently of the enqueue emission would distinguish an occurrence
    from its assertion. A queue-membership trace before and after that insertion would
    discriminate the registering occurrence from the resulting condition. No source-consumption
    behavior or continuous waiting interval is assumed.
  discriminator: >-
    The verified facts include (config_key_value, "_tag=admission-enqueued"), (config_key_value,
    "nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088"), and (config_key_value,
    "enqueuedAtMillis=1788926595182"); a distinct entry for that nonce supplies
    (config_key_value, "_tag=admission-admitted") and (config_key_value,
    "admittedAtMillis=1788926595216"). The other batch supplies (config_key_value,
    "nonce=0ff912cf-d69b-4cd8-bf68-27293f6c0cce"), (config_key_value,
    "enqueuedAtMillis=1788929720146"), and (config_key_value, "admittedAtMillis=1788929720160")
    with both event tags. These positive assertions place registration before conferment. Under
    a null of no queue-registration referent, the recorded claim that registration occurred at
    the earlier boundary would be false. The distinction relies on event-specific content, not
    the presence of a timestamp field in a schema.
epistemic_status: proposed
