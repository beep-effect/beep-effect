    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: false
  rationale: >-
    The null stands for these records. The candidate fact against it is the contract's statement
    that the deployed pre-push runs one single-lane wave per lane in rank order, but that is the
    contract author's prose about deployed behaviour, not an observation of a lane run, and every
    other mention is a lane id string inside the planner's input or output. CQ-001 warrants the
    kind, so this is judged on evidence, and the evidence here is insufficient: no lane kind, no
    lane run and no lane outside a handoff or a plan. Needed evidence: source observations of
    deployed lane runs or lane facts (for example ledger facts carrying laneId and laneClass, which
    are not in this batch) and a lane-kind observation for CQ-001; likely a cross-batch duplicate of
    a lane kind denoted from the ledger or attempt records.
