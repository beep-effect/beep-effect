cq_warrants: ["CQ-001"]
proposed_referent:
  label: "verification lane (a lane of the pre-push gate that a handoff ranks and a lane step names)"
  description: >-
    One instance is one verification lane, the unit the handoff ranks and the lane step places,
    named by a lane id (the golden step names "fallow:audit"; the contract pattern-checks lane ids as
    colon-separated lowercase segments). Added in repair because laneIdRef and the handoff's lanes
    refer to it and no hypothesis of this batch denoted it. What the records show: a handoff lists
    lanes, each with a rank, a lane id and a declaration index, and a duplicate lane id is a decode
    failure, so a lane id is unique within one handoff; the pinned handoff carries 33 lanes, counted
    from the decoded document; the planner orders the handoff's existing lanes only (no lane
    admission, no lane execution); the contract says the deployed pre-push runs one single-lane wave
    per lane in rank order and that the deployed orderWaveLanes stays the only writer of real
    pre-push order; laneIdRef is lane-grain evidence with no lane IRI. Individuation the records
    support only within a handoff (by lane id); whether a lane is the same across handoffs, or is
    the lane id string only, no record shows. Warrant, weighed: CQ-001 (must_have) needs the
    verification lane kind, so the kind is CQ-warranted; but CQ-001's query also needs a lane kind
    (turbo task, script, collected gate) through hasLaneKind, and no record in this batch shows a
    lane kind, so these records cannot by themselves answer CQ-001 and serve only as partial,
    lane-id-grain evidence for its lane class. The never-used block's mention of VerificationLane
    typing is a mention and grounds nothing; no lane-plan document types a lane.
representation_status: unresolved
alternatives:
  - label: "a lane id string only (a key in the handoff and the plan, with no lane referent behind it in these records); discriminated by an observation of a lane carrying facts of its own beyond its id (its kind, its runs, its outcomes)"
