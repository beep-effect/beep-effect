proposed_referent:
  label: declared task-input state of one lane run (turbo task-hash grain)
  description: 'One instance would be the declared input surface a lane run consumed, named by `inputDigest` when `inputSource=turbo-task-hash`
    and recorded as `inputDigest=undeclared`, `inputSource=undeclared` otherwise (so-12d5a26fbfac, so-40abdcaf1156, so-c997b4851faa).
    Shadows with `reason=undeclared-inputs` are written for exactly such runs in these ledger records. It would constrain
    the validity of VerificationEvidence (CQ-005) and the grain of CacheEpoch named in CQ-015''s note; no pinned query needs
    it directly. Rival grain to the cache-epoch hypothesis. Record pairs so-d6adeec15c79/so-fcbe894799ea are each one record
    span seen twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
