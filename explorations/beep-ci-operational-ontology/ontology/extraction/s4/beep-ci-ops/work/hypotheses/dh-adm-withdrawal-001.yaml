proposed_referent:
  label: admission request withdrawal occurrence
  description: An occurrence of ending a request's queue participation by withdrawal. An instance is bounded
    by admission-withdrawn at withdrawnAtMillis, with the request's earlier enqueue providing temporal
    context. It is distinct from the request that participates in it, ticket eviction, lease eviction,
    and release of an admitted grant. The tag does not establish voluntary intent, a specific cancellation
    cause, proof failure, or an execution being stopped. The 23 positively withdrawn histories provide
    recorded queue-exit boundaries; absence of a grant in these histories is not proof that no other grant
    could ever have existed. Waiting thresholds, exceptions, and a complete snapshot remain necessary
    for a starvation decision.
representation_status: domain_referent
alternatives:
- label: A journal withdrawal assertion, with occurrence left unconfirmed. A trace of the waiting ticket's
    withdrawal operation or a time-aligned before/after queue observation would discriminate information
    about a queue exit from the exit itself.
  representation_status: information_artifact
  plausibility: viable
- label: A terminal boundary of request participation without a separately modeled event. Evidence that
    the withdrawal's actors, cause, or effects must be distinguished from the request's terminal state
    would discriminate this domain alternative.
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The observations positively report a distinct queue-exit mechanism after enqueue. A withdrawal
    does not remove an already granted holding, and it cannot be merged with either eviction simply because
    those reports also carry terminal times. A domain occurrence is proposed because the exit changes
    the reported contender population and closes a reported wait. The information-only reading remains
    viable, and the cause of withdrawal is not inferred.
  discriminator: 'For nonce=71181c10-f174-45cf-817e-0fdfa07295a8, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-enqueued'', ''enqueuedAtMillis=1788934640505'', ''_tag=admission-withdrawn'',
    ''withdrawnAtMillis=1788935102826''. For nonce=d7ec57f5-4157-46c1-9fca-b7a7775b75ef, the config_key_value
    predicate has these rechecked objects: ''_tag=admission-enqueued'', ''enqueuedAtMillis=1788940362521'',
    ''kind=review-fix'', ''_tag=admission-withdrawn'', ''withdrawnAtMillis=1788940437861''. Each matched
    terminal block asserts withdrawal of the previously enqueued request at its own instant. Under a null
    with no operational queue exit, that ending of contention would not occur; retaining the request as
    still waiting after the reported boundary would change queue accounting. This concerns the event asserted,
    not the effect of editing its journal line.'
epistemic_status: proposed
