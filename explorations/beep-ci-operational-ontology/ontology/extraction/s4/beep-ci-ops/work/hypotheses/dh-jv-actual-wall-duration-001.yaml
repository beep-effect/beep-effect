proposed_referent:
  label: "Recorded wall-duration measurement"
  description: >-
    A serialized millisecond duration associated with a lane or task execution
    or, for an elapsed value, with a whole verification attempt; the cited
    observations do not by themselves settle the measurement granularity.
representation_status: information_artifact
alternatives:
  - label: "Temporal quality of a verification execution"
    representation_status: domain_referent
    plausibility: viable
  - label: "Instrumentation timer output"
    representation_status: implementation_artifact_only
    plausibility: weak
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    Run-specific measured durations are evidence for time decomposition and
    actual-versus-estimated cost calibration, although their execution scope
    remains to be analyzed.
  discriminator: >-
    The cited observations contain concrete nonzero duration and elapsed
    measurements, including standalone and lane-rerun values and exact start
    and end instants; a timer representation alone would not record those
    particular measurements.
epistemic_status: proposed
confidence: {value: 0.89, use_for_acceptance: false}
