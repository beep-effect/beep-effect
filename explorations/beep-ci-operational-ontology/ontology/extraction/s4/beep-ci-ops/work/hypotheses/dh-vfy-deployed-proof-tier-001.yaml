cq_warrants: []
proposed_referent:
  label: deployed proof tier value (`proofTier` on attempts and leases, `tier` on verdict lanes and ledger facts)
  description: 'One instance would be one member of the deployed YeetProofTier domain (`full | cheap-gates | review-fix`,
    po-2b7cdf8babec) as the proof depth an attempt requests and its evidence records: `proofTier=full` on attempt-started
    rows (so-10c2570fe2f6, so-3bf9cacb55b4, so-eefbf95beb8d with its twin so-ff071fc9a2a9) and on the quarantined lease so-a8d270b5e19d;
    `tier=full` on the verdict lane entry so-5ecc4af84671 (a lexical variant of the same key) and on every cited proof-ledger
    fact. The value is `full` under `stage=repair-loop`, `stage=pre-push` and `stage=merged-preview` alike. Individuated,
    if at all, by the lane set it selects. po-2b7cdf8babec separates the domain from AssuranceTierId (dh:vfy-assurance-tier:001)
    and leaves the mapping between the two open; it bears on that CQ-warranted kind, but no pinned query reads a tier off
    an attempt or a fact. No member name or spelling is proposed. Record pairs so-d6adeec15c79/so-fcbe894799ea, so-eefbf95beb8d/so-ff071fc9a2a9
    are each one record span seen twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
