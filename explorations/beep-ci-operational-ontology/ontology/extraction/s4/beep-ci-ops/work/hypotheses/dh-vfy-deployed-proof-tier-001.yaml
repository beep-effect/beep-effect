  rationale: 'The null stands: every cited record carries the single value `full`, under every stage shown, so nothing here
    shows what the other members select or how the value maps onto assurance tiers; the shared word ''tier'' is lexical. Needed
    evidence: attempt-started rows or facts with `proofTier=cheap-gates` or `proofTier=review-fix` and their lane sets, or
    the recorded mapping from YeetProofTier into assurance tiers. Without that mapping the value supports no CQ-warranted
    kind, and the named missing decision is: a Must/Should CQ is required and run 4 admits no CQ edit beyond CQ-009.'
