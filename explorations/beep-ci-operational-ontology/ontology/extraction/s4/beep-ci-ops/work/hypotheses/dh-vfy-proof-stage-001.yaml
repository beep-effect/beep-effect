cq_warrants: []
proposed_referent:
  label: proof stage (the point in the verification workflow at which an attempt runs and its evidence is produced)
  description: 'One instance is one stage of the verification workflow: `repair-loop`, `pre-push`, `merged-preview` or `hosted`
    in the deployed `ProofStage` literal list (po-581b06759057, restated in po-fd56d2b008d1). It is carried as `stage` on
    attempt-started rows (so-eefbf95beb8d with its twin so-ff071fc9a2a9: `repair-loop`; so-10c2570fe2f6: `pre-push`; so-3bf9cacb55b4:
    `merged-preview`), on the quarantined lease so-a8d270b5e19d (`stage=pre-push`), and on proof-ledger facts and shadows
    (`stage=pre-push`, `stage=repair-loop`, for example so-3df0321fa230, so-40abdcaf1156, so-5447e1434526, so-c997b4851faa);
    both censuses index starts and facts by it (po-58c65850834f, po-563da43a9f12). Each attempt carries one stage, and the
    same tier value `full` occurs under every stage shown, so stage and tier vary apart. Individuated by its position in the
    stage order, not by the spelling. No pinned CQ needs the stage; it disambiguates the CQ-warranted assurance tier (dh:vfy-assurance-tier:001)
    by keeping where evidence is produced apart from the level it is produced toward, so it is judged on evidence with no
    warrant. The `hosted` stage has no fact, shadow or start in the capture-window censuses; merged preview is dormant in
    the capture window, never observed-and-empty (dh:vfy-merged-preview-stage:001). Record pairs so-1a2d6fd275d6/so-1dc3d062f26a,
    so-eefbf95beb8d/so-ff071fc9a2a9 are each one record span seen twice (the vocabulary record a strict subset of its twin):
    one individual, both cited.'
