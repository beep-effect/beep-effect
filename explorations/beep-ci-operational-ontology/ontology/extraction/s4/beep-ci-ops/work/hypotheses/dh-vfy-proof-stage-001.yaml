null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The null falls: within one run and over one resolved head, two attempts start in time order at different stages,
    each stage value going with a different workflow mode, so the stage marks where in the workflow a verification occurrence
    ran. The two attempts carry different `diffFingerprint` values, so the records do not show them over one identical working
    state; the discriminator rests on the shared run and head only. The ledger-only reading left the null standing for want
    of an attempt record or the stage census; both are among the cited records. Phase versus activity type is the foundational
    seat''s question.'
  discriminator: 'so-eefbf95beb8d (`stage=repair-loop`, `mode=repair`, `startedAt=2026-09-08T19:28:29.547Z`) and so-10c2570fe2f6
    (`stage=pre-push`, `mode=closeout`, `startedAt=2026-09-08T19:57:41.381Z`) carry one `runId` value and one `resolvedHeadSha`
    value and two different `diffFingerprint` values: within one run on one resolved head the earlier attempt runs at `repair-loop`
    in repair mode and the later at `pre-push` in closeout mode, which would be false if the stage value had no workflow counterpart.'
