null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: Both an emitter quotation and a fixture assert episode typing, and the contract requires
    a non-empty caller-supplied episode identity with no singleton default. The described purpose is occurrence
    context for the proposal. That supports a denotation candidate at episode grain, while the alternative
    of a correlation record remains viable and must be tested before an identity criterion is accepted.
    Fixture typing alone does not establish a real completed episode or the timing data required for episode
    KPIs.
  discriminator: The emitter emits "${episodeNode} rdf:type ciops-prov:VerificationEpisode ." and the
    fixture contains the corresponding type assertion. The contract requires "non-empty `episodeId`" and
    states "The caller supplies the occurrence identity; there is no singleton default." Under a null
    denying episode context, this asserted caller-specific occurrence anchoring would have no referent.
epistemic_status: proposed
confidence:
  value: 0.76
  use_for_acceptance: false
