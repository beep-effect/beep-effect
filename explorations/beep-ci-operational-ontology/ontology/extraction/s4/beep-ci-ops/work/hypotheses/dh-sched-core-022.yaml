  rationale: "Runtime promotion and overshoot rollback show that admission is a real precondition on whether the guarded heavy work begins, while the existing heartbeat-and-release bracket shows the grant remains in force during execution. Whether the ontology uses a binary property or a reified admission situation remains a foundational modeling issue."
