id: "dh:lpl-gate-order-handoff:001"
observation_refs: ["po:sha256:5d984d7d5554ac29feeb046f12f86766e6718df0a290e26bdc02023a86f55f21", "po:sha256:ef1a43d8c85966a859f010500e53f554d45e12f1e47b0ebc0190721829cf96ca", "po:sha256:4dbce15dff1835d2a389a08955fa50b18297b38040dee4bd8264d9992839eadd", "po:sha256:e97f691ea561b37b93db3bee1bdb0de54a0c40a1b9809a47a459e3ec3025e248", "po:sha256:fb56d336f45445d9d55b113ad26e30e87c04adfa1ac69204cc0edf969d2863d1"]
cq_warrants: []
proposed_referent:
  label: "gate-order handoff document (the pinned input a lane plan is computed from)"
  description: >-
    One instance is one gate-order-handoff/v1 document as a byte sequence, identified by its
    SHA-256 over raw bytes (the planner fails before decode when the digest differs), carrying a
    schema version, a scope, an order rule and a total order of lanes (rank, laneId,
    declarationIndex) with no edges. Read at a repo-relative path that, as the contract states, stays
    outside planId and specification identity; the contract counts its lanes from the decoded document, never from a
    literal. It is the value handoffDigest points at (answered by dh:lpl-lane-plan-application:001);
    it is not itself one of the eleven provisional terms. A candidate information artifact that
    supports the lane-plan kinds, none of which has a warranting CQ.
representation_status: unresolved
alternatives:
  - label: "an information artifact recording the deployed pre-push lane order"
    representation_status: information_artifact
    plausibility: viable
  - label: "a file input of the planner only (implementation plumbing)"
    representation_status: implementation_artifact_only
    plausibility: viable
  - label: "one total order encoded twice: the handoff's rank order and the lane plan (dh:lpl-lane-plan:001) are the same order, the plan a re-encoding (contextual copy) of it, since the planner orders existing lanes only and over a coherent rank set admits exactly one topological order; discriminated by an observation of a lane plan whose order or lane set differs from its handoff's rank order, which would refute it (reciprocal of the re-encoding alternative in dh:lpl-lane-plan:001)"
    representation_status: information_artifact
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: false
  rationale: >-
    The null stands. The records show the handoff only as the planner's file input and its digest
    as the planner's guard; the digest check is planner behaviour, not an occurrence outside the
    representation. It supports only lane-plan kinds that are themselves unwarranted, so under the
    no-CQ default it is null-standing and unresolved. The decision a CQ would serve is
    the missing lane-order CQ (a Must/Should CQ that needs a lane plan or its order); named missing decision: "a Must/Should CQ is required and run 4 admits no CQ edit beyond CQ-009". Needed evidence: a pinned Must/Should CQ needing the lane
    plan's input, and an observation of the handoff document's own records (not in this batch).
  discriminator: ""
epistemic_status: proposed
confidence: {value: 0.3, use_for_acceptance: false}
