    plausibility: viable
  - label: "plan per handoff ordering node: one plan for each handoff digest, shared by every episode planned over those bytes; discriminated by the same observation showing nothing said of the plan differs between the two documents"
    representation_status: domain_referent
    plausibility: viable
  - label: "re-encoding (contextual copy) of the handoff's total order: the plan carries no ordering content beyond the handoff's rank order, since the planner orders existing lanes only and over a coherent rank set admits exactly one topological order; discriminated by an observation of a lane plan whose order or lane set differs from its handoff's rank order, which would refute it (pairs with the handoff alternative in dh:lpl-gate-order-handoff:001)"
    representation_status: information_artifact
    plausibility: viable
  - label: "candidate instance of the ratified verification-plan specification kind"
    representation_status: domain_referent
    plausibility: viable
  - label: "candidate subclass of the ratified verification-plan specification kind"
    representation_status: domain_referent
    plausibility: viable
  - label: "provisional instrumentation vocabulary only (the contract calls lane plans provisional ciops-prov instrumentation)"
    representation_status: implementation_artifact_only
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: false
  rationale: >-
    The null stands. Every record in this batch is either the contract author's prose or the
    emitter's own golden Turtle; the emitter's typing triple and its predicate use are not alone a
    discriminator, and the content-derived plan id is declared a minting convention by the same
    contract. No record shows a plan occurrence outside the planner's own output, and no pinned
    Must/Should CQ needs a lane plan or its order (the CQ-019 mention is not a warrant: CQ-019 needs
    a schedule proposal and its steps), so under the no-CQ default this stays null-standing and
    unresolved whatever its discriminator. The decision a CQ would serve is the missing lane-order
    CQ (a Must/Should CQ that needs a lane plan or its order); named missing decision: "a Must/Should
    CQ is required and run 4 admits no CQ edit beyond CQ-009". Needed evidence: a pinned Must/Should
    CQ whose query needs a lane plan or its order, plus an observation of two lane-plan documents
    for distinct episodes over one handoff (per-document versus per-handoff plan, contextual copy)
    or of a plan replaced or revised for one episode, to decide the plan-identity question. A term
    listed as never used for a lane plan (schedulesWorkUnit, hasScope, Scope and the rest) is a
    mention and grounds nothing here.
  discriminator: ""
epistemic_status: proposed
