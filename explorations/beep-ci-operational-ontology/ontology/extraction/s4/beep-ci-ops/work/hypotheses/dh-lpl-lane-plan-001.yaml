proposed_referent:
  label: "lane-order plan (an ordering of the existing lanes of one pinned handoff)"
  description: >-
    One instance is one ordering of the verification lanes listed in one pinned gate-order handoff
    document, produced by the lane-order planner as a whole made of ordered lane steps; it orders
    existing lanes only (no admission, no execution, no reseed). Answers the provisional terms
    LanePlan (the class, typed in the golden Turtle), hasLanePlan (the episode-to-plan edge, with no
    current-selection reading and no re-pointing semantics per the contract) and hasLaneStep (the
    plan-to-step edge). What the records state about individuation: the plan id is
    lane-plan-${handoffSha256}, content derived with no clock, and the plan IRI is minted from it
    alone; the LanePlanProposal record carries episodeId, planId, handoffPath, handoffSha256,
    orderRule, scope and laneSteps; the plan and its emitted Turtle are byte-deterministic over
    (episodeId, handoff bytes); handoffPath is recorded but stays outside planId and specification
    identity; handoffPath, repoRoot, episodeId and planId do not change specification identity. No
    record states which members fix plan identity, and the same contract calls planId and the plan
    IRI a minting convention, not an identity criterion. Two plan readings therefore stay open and
    are carried below: a plan per (episode, handoff) document, since the proposal record and its
    document vary with episodeId; and a plan per handoff ordering node, since the plan node's IRI
    varies with the handoff digest only and would recur for another episode over the same handoff
    bytes. Discriminator between them: an observation of two lane-plan documents for distinct
    episodes over one handoff, and of whether anything said of the plan (a replacement, a revision,
    a count of plans) differs between the two. Plan-identity duty (content, contextual copy,
    replacement, revision): the records show content derivation only as a minting convention;
    contextual copy only as the open choice above, with no copy occurrence; replacement only as a
    document-level replace-the-document rule named in the never-used block, with no replacement
    occurrence; revision not at all. Relation to the ratified verification-plan specification kind
    is left open by the contract itself (candidate instance or candidate subclass), and both readings
    are carried below as viable. No pinned Must/Should CQ needs this referent: CQ-020 needs a
    schedule proposal of seat requests, and the contract says a lane plan is never a widened schedule
    proposal and lane steps are not admitted seat requests; CQ-013 orders lanes by cost estimate,
    not by a plan; the CQ-019 mention in a cited record (schedulesWorkUnit as the unratified CQ-019
    arm-3 carrier) is not a warrant, because CQ-019's query needs a schedule proposal and its steps
    (hasStep, schedulesWorkUnit, schedulesSeatRequest), none of which a lane plan or lane step is
    emitted as.
representation_status: unresolved
alternatives:
