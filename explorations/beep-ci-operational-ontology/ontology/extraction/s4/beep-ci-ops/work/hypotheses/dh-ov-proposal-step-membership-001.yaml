proposed_referent:
  label: Recorded membership of a step in a proposal
  description: The assertion that a particular represented step belongs to a particular schedule proposal.
    It supplies the proposal-specific step set from which ordering and per-step scope can be read.
representation_status: information_artifact
alternatives:
- label: Structural part relation between a prescription and its components
  representation_status: domain_referent
  plausibility: viable
- label: Serializer adjacency with no proposal membership meaning
  representation_status: implementation_artifact_only
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The quoted fixture associates two different step subjects with the same proposal, and the
    emitter explicitly serializes this association. The totality and admitted-step restrictions give membership
    consequences for which requests form a prescribed sequence and which scopes belong to that proposal.
    The information-artifact reading treats the assertion as represented schedule content; its relation-versus-record
    interpretation remains open for foundation analysis.
  discriminator: The emitter quote is "${proposalNode} ciops-prov:hasStep ${stepSubject} ."; two fixture
    observations place step-0 and step-1 on that predicate from the same proposal. The contract says "Only
    admitted actions get steps". Removing membership meaning would eliminate the observed proposal-specific
    collection on which the ordered-step and derived-scope questions depend.
epistemic_status: proposed
confidence:
  value: 0.87
  use_for_acceptance: false
