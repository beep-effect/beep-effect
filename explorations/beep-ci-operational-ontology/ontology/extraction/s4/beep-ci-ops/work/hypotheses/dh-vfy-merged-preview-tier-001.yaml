null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The null stands: no cited record shows merged preview as a level an episode is verified to. The one source record
    at this stage, so-3bf9cacb55b4, carries `stage=merged-preview` together with `proofTier=full`, and the quarantined lease
    so-a8d270b5e19d carries `kind=merged-preview` with `proofTier=full` and `stage=pre-push`; `proofTier` is the deployed
    proof-tier value, whose mapping into assurance tiers is open (dh:vfy-deployed-proof-tier:001), so neither record places
    anything in an assurance tier or favours one reading over another. The KPI law''s sub-partition of TierLocalFullProof
    is a reporting rule, quoted, not a category. The censuses (po-563da43a9f12, po-82648cf8d37a, po-58c65850834f) show merged
    preview dormant in the capture window, never observed-and-empty; dormancy is not disuse and is no evidence for or against
    this reading. Needed evidence, in assurance-tier terms: a record verifying an attempt or episode to a merged-preview level
    distinct from the three AssuranceTierId levels, or a lane obligation required for a merged-preview level but not for
    TierLocalFullProof (the CQ-017 asymmetry shape); against it, a record tying merged-preview attempts to one of the three
    levels as their target.'
