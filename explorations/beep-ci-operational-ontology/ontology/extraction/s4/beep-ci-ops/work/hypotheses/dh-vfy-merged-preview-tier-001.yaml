proposed_referent:
  label: merged preview as an assurance tier (reading a)
  description: 'Candidate: merged preview as a fourth level of assurance, a target state an episode is verified to, beside
    the three members of the AssuranceTierId row (po-6087c33b5bbd); it would be a member of the tier class kind dh:vfy-assurance-tier:001.
    The KPI law (po-fd56d2b008d1) says merged preview reports as a sub-partition of TierLocalFullProof and that the three-tier
    list stands until an auditor run ratifies a fourth tier, proposed to run 4; that is a reporting rule and a proposal, quoted,
    never a category or a licensing state. No pinned query needs a merged-preview tier member (CQ-017 names only TierCiMergeGreen
    and TierLocalFullProof; CQ-002 and CQ-006 bind a caller-given tier), so it could only reach analysis as support for the
    tier class. No member name or spelling is proposed. Rivals: dh:vfy-merged-preview-stage:001 and dh:vfy-merged-preview-work-kind:001.'
representation_status: unresolved
