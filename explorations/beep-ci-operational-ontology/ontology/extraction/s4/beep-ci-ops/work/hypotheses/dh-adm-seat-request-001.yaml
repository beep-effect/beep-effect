proposed_referent:
  label: seat request
  description: 'A solicitation for admission of one item of requested work. An instance is the contender
    whose queue participation begins at the reported enqueue and ends at admission, withdrawal, or ticket
    eviction; the later grant is a different candidate referent. The cited histories include 46 explicit
    enqueue chains, five admission chains carrying an enqueue time without a separate enqueue event, and
    two ticket-eviction reports referring to an earlier queued contender without its enqueue time. Those
    two reports support only an incompletely described prior request, not invented kind, priority, charge,
    owner, or waiting duration. Work kind, priority, and token charge qualify a request without supplying
    new kinds for each value: full-proof can have publish priority, and merged-preview can have verify
    priority. A history whose queue participation has ended is not a current queued-request answer. These
    observations supply neither the complete queue census nor the declared starvation threshold and exception
    context required for the cited decisions. Nonce equality aligns the supplied journal assertions locally;
    it is not an accepted identity criterion. Capture and resanitization metadata supply no agent identity.'
representation_status: domain_referent
alternatives:
- label: A journal account of a requested admission, with no independently established request bearer.
    A time-aligned ticket-store observation or an observed queue operation retaining the request boundaries
    would distinguish that information-only reading from the proposed contender.
  representation_status: information_artifact
  plausibility: viable
- label: Enqueue and queue-exit occurrences with the request represented only as their participant. Evidence
    that the same solicitation is re-identified across intermediate queue decisions would discriminate
    a persisting request from an occurrence-centered model.
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The positive entry and exit assertions concern requested work with a reported admission charge.
    They support the candidate contender needed to interpret queue membership and waiting, beyond the
    extraction wrapper's existence. The operational reading is proposed at kind level; the information-artifact
    reading remains viable because the journal is not independent confirmation of its own assertions.
    Ticket-eviction-only histories leave the earlier request properties open. No current membership or
    starvation result is inferred from an absent terminal event.
  discriminator: 'For nonce=71181c10-f174-45cf-817e-0fdfa07295a8, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-enqueued'', ''enqueuedAtMillis=1788934640505'', ''kind=merged-preview'',
    ''weightTokens=5'', ''_tag=admission-withdrawn'', ''withdrawnAtMillis=1788935102826''. For nonce=d7ec57f5-4157-46c1-9fca-b7a7775b75ef,
    the config_key_value predicate has these rechecked objects: ''_tag=admission-enqueued'', ''enqueuedAtMillis=1788940362521'',
    ''kind=review-fix'', ''priority=verify'', ''weightTokens=1'', ''_tag=admission-withdrawn'', ''withdrawnAtMillis=1788940437861''.
    Each same-nonce excerpt binds an entering contender to a later withdrawal. Under the null there is
    no requested admission whose queue participation can begin and end; that is precisely the operational
    content these dated pairs assert. This rejects the absence of any operational denotation, while leaving
    the truth of the reports open to the viable information-only reading.'
epistemic_status: proposed
