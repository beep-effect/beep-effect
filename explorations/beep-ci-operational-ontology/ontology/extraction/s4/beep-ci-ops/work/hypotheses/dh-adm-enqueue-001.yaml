proposed_referent:
  label: admission enqueue occurrence
  description: 'An occurrence of entering one request into admission contention. An instance is bounded
    by a single admission-enqueued report at enqueuedAtMillis; it is the entry boundary, not the entire
    waiting interval, request bearer, later admission, or journal entry. Its resulting queue participation
    may end through admission, withdrawal, or ticket eviction. Only the 46 chains with a positive enqueue
    tag are cited here: an enqueue timestamp carried by an admission report is retained on the request
    hypothesis without inventing a separately observed enqueue event. Queue-wait decomposition uses this
    start only with the appropriate endpoint and episode linkage; these records alone provide no complete
    episode accounting or snapshot-based starvation answer.'
representation_status: domain_referent
alternatives:
- label: An enqueue assertion in an admission journal. A contemporaneous observation of the ticket becoming
    eligible for queue selection, aligned to this report, would discriminate the occurrence from information
    that merely claims entry.
  representation_status: information_artifact
  plausibility: viable
- label: The beginning of a request's queue participation modeled as a dated boundary rather than a separately
    reified occurrence. Requiring participants or effects of enqueue independent of the resulting request
    state would discriminate the two domain models.
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: A dated report of entry is the positive boundary required to interpret queue waiting; it
    does not acquire a grant by itself. The paired records separate enqueue from admission or withdrawal,
    so a single nonce chain cannot stand in for this event kind. The source's report-only alternative
    remains viable pending an observation of the queue operation itself.
  discriminator: 'For nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-enqueued'', ''enqueuedAtMillis=1788926595182'', ''weightTokens=5'',
    ''_tag=admission-admitted'', ''admittedAtMillis=1788926595216''. For nonce=c334ff81-360e-4683-a084-8bf4bf0ed20f,
    the config_key_value predicate has these rechecked objects: ''_tag=admission-enqueued'', ''enqueuedAtMillis=1788928587012'',
    ''kind=full-proof'', ''priority=publish'', ''_tag=admission-withdrawn'', ''withdrawnAtMillis=1788928909789''.
    The matched event blocks distinguish entry from the later grant or withdrawal. If there were only
    a representation helper and no queue-entry denotation, no entering occurrence could supply the start
    of those reported waits. The discriminator is the asserted dated entry and its distinct endpoint,
    not the lexical tag alone or a claim that writing the log controls the queue.'
epistemic_status: proposed
