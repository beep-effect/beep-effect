proposed_referent:
  label: admission ticket eviction occurrence
  description: An occurrence of removing a waiting admission ticket through eviction. An instance is bounded
    by admission-ticket-evicted at evictedAtMillis and affects a formerly queued request, not an admitted
    grant. The two supplied histories report reason=queued-submitter-death, but supply no enqueue time,
    work kind, priority, admission charge, or preceding admission. Their limited earlier history leaves
    those properties unknown; it does not turn ticket eviction into lease eviction, request withdrawal,
    or evidence of a grant's release. The removal occurrence is proposed as what the positive report denotes,
    while the source's more conservative report-only reading remains viable. The stated cause is not independent
    evidence of a process death. The event provides a queue-exit boundary without enough context to calculate
    its prior wait or establish a starvation finding.
representation_status: domain_referent
alternatives:
- label: The ticket-eviction report as an information artifact, which is the source batch's primary reading
    for these sparse histories. A before/after ticket-store observation or an independently observed eviction
    operation aligned to the report would discriminate actual queue removal from the report alone; evidence
    of the submitter's death is a separate need.
  representation_status: information_artifact
  plausibility: viable
- label: A request's evicted terminal condition without a separately reified occurrence. Evidence that
    the eviction act or its participants matter independently of queue membership would distinguish this
    boundary-only domain alternative.
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The absence of an earlier enqueue report limits description of the request, but does not
    erase the positive dated assertion of ticket removal. The operational candidate is therefore the narrow
    removal occurrence, not a fully characterized request, a lease termination, or an owner death. This
    makes explicit the occurrence alternative already carried by the sparse source reports; their information-artifact
    reading remains viable rather than being silently discarded. The current queue population and the
    reported cause still require further evidence.
  discriminator: 'For nonce=acb0011d-82cf-4dfc-a812-72d10dbd566c, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-ticket-evicted'', ''evictedAtMillis=1788498598672'', ''reason=queued-submitter-death''.
    For nonce=90006bc5-d7e0-41a4-9224-813ac343ca6c, the config_key_value predicate has these rechecked
    objects: ''_tag=admission-ticket-evicted'', ''evictedAtMillis=1788920302811'', ''reason=queued-submitter-death''.
    Each single matching block asserts a dated removal from the queued-ticket population. Under the no-removal
    null there is no such operational exit; the reports positively assert one, with a target and mechanism
    different from relinquishing an admitted lease. The discriminator supports the removal denotation,
    while the independent truth of the occurrence and its stated cause remain open under the information-artifact
    alternative.'
epistemic_status: proposed
