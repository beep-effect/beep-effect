cq_warrants: []
proposed_referent:
  label: admission engagement (one nonce-bounded admission, from enqueue through grant to its end)
  description: 'Rival to the request/grant split. One instance would be the whole admission a single chain records: enqueued,
    admitted and then released or evicted, under one `nonce`, with the queued request and the held grant as its phases rather
    than two individuals. The chains that show both phases instantiate it: the five admitted-and-released chains, the two
    lease-evicted chains and the record-0 admitted stanza. No pinned CQ needs the whole engagement; it bears on how the CQ-warranted
    kinds dh:vfy-seat-request:001 (CQ-021, CQ-023) and dh:vfy-seat-grant:001 (CQ-008, CQ-009, CQ-010) are individuated, so
    it is judged on evidence with no warrant of its own.'
representation_status: unresolved
alternatives:
- label: two individuals, a seat request and a seat grant (dh:vfy-seat-request:001, dh:vfy-seat-grant:001)
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The shared `nonce` across the enqueued, admitted and ended rows of one chain is an identifier and decides nothing.
    Needed evidence: a record of one chain whose admitted row changes a member the enqueued row fixed (charge, owner, checkout),
    which would show two individuals, or a record showing the grant inheriting the request''s history (an enqueue instant
    carried as the grant''s own wait), which would favour one engagement.'
  discriminator: ''
