id: "dh:jv-admission-lifecycle:001"
observation_refs:
  - "so:sha256:c627961a8fcde9dca01027cbf052494763b5e6895805c1c0c50d8bf51ba3a7bb"
  - "so:sha256:d94bf0420d3457158959e6188c50d5949dc4fae4a48d07e7077f8c81df36fcb6"
cq_warrants: ["CQ-009", "CQ-010", "CQ-021", "CQ-023"]
proposed_referent:
  label: "Admission lifecycle occurrence"
  description: >-
    An operational occurrence in which verification work is admitted under a
    recorded work kind, priority, token weight, and origin key and is later
    released, with enqueue, admission, release, and resource telemetry.
representation_status: domain_referent
alternatives:
  - label: "Admission journal information object"
    representation_status: information_artifact
    plausibility: viable
  - label: "Scheduler-specific event serialization"
    representation_status: implementation_artifact_only
    plausibility: weak
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    The values record concrete admission and release telemetry needed to
    distinguish queued work, admitted charge, origin exclusion, and waiting
    time; they are not merely names in a scheduler representation.
  discriminator: >-
    The cited observations record an admission-admitted occurrence with
    concrete enqueue and admission instants and also record a release instant
    and peak-memory value; a serialization declaration alone would not assert
    those particular lifecycle measurements.
epistemic_status: proposed
confidence: {value: 0.91, use_for_acceptance: false}
