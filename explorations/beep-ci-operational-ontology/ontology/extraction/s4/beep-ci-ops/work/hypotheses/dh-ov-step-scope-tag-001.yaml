proposed_referent:
  label: Literal scope annotation on a prescribed step
  description: The information carried by a literal scope tag on each schedule step; the observed admission
    value describes the admission act itself. The batch does not establish a package-selection scope,
    affected-set computation, or scope individual behind that literal.
representation_status: information_artifact
alternatives:
- label: A simple controlled annotation value with no independent tag object
  representation_status: information_artifact
  plausibility: viable
- label: Verification scope or affected-package set
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: Two fixture step subjects carry the admission string, and the emitter serializes step.scope
    as a typed string. The contract explains the tag as the admission act for this projection version.
    Those facts support the scope content requested per step and relevant to the literal-tag provenance
    arm. They do not establish that scope-provenance obligations have been discharged.
  discriminator: 'The emitter quote is "${stepSubject} ciops-prov:hasScopeTag ${turtleLiteral(step.scope)}^^xsd:string
    ."; each fixture step asserts "ciops-prov:hasScopeTag "admission"^^xsd:string". The schema-description
    quote specifies "scope tag (v1: the admission act itself". The null would leave no represented per-step
    scope content for those explicit literals.'
epistemic_status: proposed
confidence:
  value: 0.9
  use_for_acceptance: false
