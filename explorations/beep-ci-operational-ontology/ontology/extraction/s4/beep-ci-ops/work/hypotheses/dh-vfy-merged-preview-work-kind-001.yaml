cq_warrants: []
proposed_referent:
  label: merged preview as an admission work kind (reading c)
  description: 'One instance is the merged-preview member of the admission work kind (dh:vfy-admission-work-kind:001): the
    kind of work a seat request asks capacity for, carried on its ticket as `kind=merged-preview` and spelled in the deployed
    AdmissionWorkKind list the literal-domains row quotes (po-2f209664dde0); the KPI law (po-fd56d2b008d1) notes that AdmissionWorkKind
    includes `merged-preview`. The admission chains carry it on enqueued-and-withdrawn requests, on a queued request evicted
    for its submitter''s death (so-29a5ac8607a2), on admitted-and-released chains (so-8fcf58cfd24c, so-d99a3c53086c), on lease-evicted
    chains (so-860cff0d673e, so-a9ed1352e2bc) and on the quarantined lease so-a8d270b5e19d, with `weightTokens=5` in every
    cited chain, against `weightTokens=3` on the cited `kind=full-proof` chains (so-95b7d78a061f, so-363f9b7f07dc, cited for the contrast). Individuated
    by its place in the closed work-kind domain. Fixed reading: the admission work kind is not stage activity, so no `kind=merged-preview`
    chain is counted as a stage occurrence; the lease so-a8d270b5e19d carries `kind=merged-preview` beside `stage=pre-push`
    and `proofTier=full`, so on one record the work kind is neither the stage nor the proof tier. No direct warrant: CQ-021
    binds the work kind of each queued request generically (its required class is AdmissionWorkKind) and names no merged-preview
    member, the same ground on which the tier member dh:vfy-merged-preview-tier:001 has no direct warrant from the tier CQs.
    The member supports the CQ-021-warranted work-kind class dh:vfy-admission-work-kind:001 (it is one of the values that
    class ranges over), so it is judged on evidence with `cq_warrants` empty; whether that support licenses it is the synthesis
    seat''s call. Rivals: dh:vfy-merged-preview-tier:001 (a) and dh:vfy-merged-preview-stage:001
    (b).'
representation_status: unresolved
alternatives:
- label: merged preview as a proof stage (dh:vfy-merged-preview-stage:001); told apart by whether the value is carried by
    an attempt or ledger `stage` member rather than a ticket `kind`, and so-a8d270b5e19d shows the two apart on one record
  representation_status: domain_referent
  plausibility: viable
- label: merged preview as an assurance tier (dh:vfy-merged-preview-tier:001); told apart by a record verifying an episode
    to a merged-preview level
  representation_status: unresolved
  plausibility: viable
- label: a shared word across two deployed domains with no work kind behind the ticket value
  representation_status: lexical_alias
  plausibility: weak
- label: 'a charge code: the ticket value fixes a capacity charge (`weightTokens=5`) and names no kind of work behind it.
    Every cited charge fact is true under it (a charge of 5 under `priority=verify`, so-d99a3c53086c, and under `priority=publish`,
    so-0d75ae7174ed, against 3 for `kind=full-proof`, so-95b7d78a061f, so-363f9b7f07dc), and the one record that shows the
    work behind a `kind=merged-preview` lease (so-a8d270b5e19d) carries `stage=pre-push` and `proofTier=full`, no work fact of
    its own. What would decide: a record where `kind=merged-preview` co-occurs with work no `kind=full-proof` record carries (a merged-preview
    stage or a merged-tree input on the lease or attempt it admits), or a `kind=merged-preview` chain whose charge is not 5'
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The null stands. The earlier discriminator (a charge of 5 under two priority classes against 3 for `kind=full-proof`)
    is true of a code that fixes a charge with no kind of work behind it, so it does not tell a work kind from a charge code;
    no cited record is false under that reading. The literal-domains row (po-2f209664dde0) grounds the member in a distinct
    scheduler weight, which the code reading also makes true, and its glosses and the KPI law (po-fd56d2b008d1) are naming,
    not discriminators. The member stays plausible as one of the values the CQ-021-warranted work-kind class ranges over
    (dh:vfy-admission-work-kind:001), so the status is unresolved, not implementation_artifact_only. Needed evidence: an
    admission chain, lease or attempt record on which `kind=merged-preview` co-occurs with a merged-preview stage, a merged-tree
    input or another work fact no `kind=full-proof` record carries; or a `kind=merged-preview` chain with a charge other
    than 5, which would be false of a code that fixes the charge.'
  discriminator: ''
