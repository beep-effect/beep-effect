proposed_referent:
  label: ledger record envelope and capture surrogates (key truncation, schemaVersion, originKey placeholder)
  description: 'The observed construct: the record-level fields that carry no referent of their own: the 11-hex truncation
    of `key` (shared by a fact and its shadow, a lookup handle), `schemaVersion=proof-fact/v1`, the `<fleet>`-placeholder
    `originKey` (a capture surrogate, never a join), and `envProfile=local` as a single constant across the ledger records.
    Key is evidenced as a field, not a referent (Queue B). Record pairs so-1a2d6fd275d6/so-1dc3d062f26a, so-d6adeec15c79/so-fcbe894799ea
    are each one record span seen twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
