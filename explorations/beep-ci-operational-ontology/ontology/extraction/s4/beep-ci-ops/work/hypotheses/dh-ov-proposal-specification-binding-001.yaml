proposed_referent:
  label: Recorded governing-specification binding of a proposal
  description: The assertion selecting the typed specification associated with a particular emitted schedule
    proposal. It enables a proposal-specific governing-description answer; it does not assert that the
    proposal has been executed, approved, or fully validated.
