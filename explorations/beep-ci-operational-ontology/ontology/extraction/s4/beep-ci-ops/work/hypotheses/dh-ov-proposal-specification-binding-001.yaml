  representation_status: information_artifact
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: An explicit serialized edge connects the proposal to a subject independently typed as a specification.
    The current-sequence question requires that binding to distinguish the governing description for the
    selected proposal. The fixture illustrates the assertion, while the accompanying contract states that
    even empty and fully deferred projections emit a typed specification. Whether the target is a repeatable
    rule object or a contextual record remains unresolved at the referent-model level.
  discriminator: The emitter writes "${proposalNode} ciops-prov:hasProjectionSpecification ${specificationNode}
    ."; the fixture asserts that same relation, and both emitter and fixture type its target as AdmissionProjectionSpecification.
    A null treating the link as semantically empty plumbing would remove the explicit proposal-to-governing-description
    answer carried by these assertions.
epistemic_status: proposed
