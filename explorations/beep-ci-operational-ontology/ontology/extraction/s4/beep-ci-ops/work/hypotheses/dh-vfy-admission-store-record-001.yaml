cq_warrants: []
proposed_referent:
  label: admission store record (a journal row, lease state record or protocol stanza, as against what it records)
  description: 'One instance would be one written record of the admission store: a journal row (`schemaVersion=yeet-admission-journal/v1`
    or `/v3`), a lease state record (`schemaVersion=yeet-admission-lease/v1`, here one under the quarantine path) or a protocol
    stanza, individuated by its store and position, distinct from the request, grant or end it records. Every admission-journal,
    protocol and lease record cited here is such a record; the stanza vocabulary records show only which keys first appear
    there and never a whole event. Capture provenance (`ownerRef*`, the `<fleet>` placeholder, the truncated keys) dominates
    many members and gets no referent. No pinned CQ needs the record itself; it disambiguates the CQ-021-warranted seat request
    (dh:vfy-seat-request:001) and the seat grant (dh:vfy-seat-grant:001) from the journal rows and lease records about them,
    the same way the peak memory use (dh:vfy-peak-memory-use:001) disambiguates the admission charge from the consumption it
    is not. One support test is applied to both: a referent that defines, constrains or disambiguates a CQ-warranted kind
    is judged on evidence with `cq_warrants` empty and the supported kind named, and is not parked on the CQ barrier. Judged
    so, this record differs from the peak memory use only in its evidence, below.'
representation_status: unresolved
alternatives:
- label: no referent beyond the events (the row is the request or grant itself)
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The null stands on evidence, not on the CQ barrier. The held fact: so-363f9b7f07dc, one nonce chain of one admission,
    carries both `schemaVersion=yeet-admission-journal/v1` and `schemaVersion=yeet-admission-journal/v3` beside `_tag=admission-enqueued`,
    `_tag=admission-admitted` and `_tag=admission-released`, so rows of two formats record one admission and the record is
    not the admission. That defeats the alias reading (the row is the request or grant itself) but not the null: a format
    version is a property of a serialization and is as true of a pure implementation record as of an information artifact,
    so it would not be false if the record were implementation-only. Needed evidence: a record consulted, retained or evicted
    as an item apart from the admission it records (for example a reading whose result depends on which journal format a
    row was written in, or a compaction record naming journal rows dropped while their admissions stay known).'
  discriminator: ''
epistemic_status: proposed
