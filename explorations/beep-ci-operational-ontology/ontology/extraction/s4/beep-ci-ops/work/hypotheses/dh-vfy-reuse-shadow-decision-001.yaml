proposed_referent:
  label: shadow reuse decision (a hypothetical would-reuse judgment recorded beside a lane run)
  description: 'One instance is one `kind=shadow` record: a decision `kind=hit` or `kind=miss`, a `reason` (`no-fact`, `undeclared-inputs`,
    `changed-package-tripwire`), the run''s `observed` verdict, and the same key, durationMs and recordedAt as the fact of
    the same lane run. A hit (so-dc1dce23ac11) names the fact it would have reused by `factRecordedAt`; it is a hypothetical
    would-reuse, never a realized skip. `reason=undeclared-inputs` (so-1de864e5f2e5, so-3df0321fa230, so-5447e1434526) co-occurs
    with facts whose `inputSource=undeclared`. Seat question (Queue B): a decision of its own or a member of what it shadows?
    The records fit both: it is written with the run it shadows and carries that run''s duration and verdict. No pinned CQ
    needs it; it would support VerificationEvidence validity (CQ-005) as a reuse-eligibility judgment if a later seat finds
    that license. Record pairs so-1a2d6fd275d6/so-1dc3d062f26a, so-dc1dce23ac11/so-e66e1190087c are each one record span seen
    twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
