proposed_referent:
  label: tree state a verification fact is about (the committed tree at headSha)
  description: 'One instance is one committed tree named by `headSha`, individuated by its content as the commit fixes it;
    several facts of one attempt share it (so-12d5a26fbfac, so-d6adeec15c79, so-fcbe894799ea; so-40abdcaf1156, so-c997b4851faa).
    Attempt-started rows and the quarantined lease carry the head an attempt resolves as `resolvedHeadSha` and, beside it,
    a `diffFingerprint`: so-eefbf95beb8d (with its twin so-ff071fc9a2a9) and so-10c2570fe2f6 share one `resolvedHeadSha` value
    across a repair attempt and a later closeout attempt while carrying different `diffFingerprint` values, and so-3bf9cacb55b4
    and so-a8d270b5e19d carry their own of each. At the head-commit grain this reading takes, those two attempts are about
    one tree; at the head-plus-diff grain (the viable rival below) they are about two states. Answers TreeState for CQ-005,
    CQ-006 and CQ-014. Whether the referent is the tree content or the commit (a commit can be re-made over the same tree)
    is not decided by these records. Record pairs so-d6adeec15c79/so-fcbe894799ea are each one record span seen twice (the
    vocabulary record a strict subset of its twin): one individual, both cited.'
representation_status: unresolved
