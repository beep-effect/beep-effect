    or one run (so-eefbf95beb8d, so-ff071fc9a2a9, so-10c2570fe2f6), so this reading makes every cited fact true. What would
    decide: one head value carried by records of two runs (or of two attempts that share no run)'
  representation_status: implementation_artifact_only
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The null stands. The earlier discriminator (one head value under opposite verdicts from two lanes, so-40abdcaf1156
    and so-c997b4851faa) is true of a per-attempt writer stamp, since both records share one `attemptId`; every other head
    value the batch shows recurring recurs only within one attempt or within one run (the repair and closeout attempt-started
    rows so-eefbf95beb8d and so-10c2570fe2f6 share one `runId`). One run carrying two head values (the `runId` shared by
    so-d6adeec15c79 and so-40abdcaf1156) is false of a purely run-scoped stamp, and two attempts of one run sharing one
    value is false of a purely attempt-scoped stamp, but a stamp the writer reissues at some attempts of a run and carries across others makes both true; no cited
    record carries one head value across two runs. The referent stays plausible for CQ-005,
    CQ-006 and CQ-014, so the status is unresolved, not implementation_artifact_only. Needed evidence: a ledger fact or
    attempt-started record of a second run (or of an attempt sharing no run) that carries a head value already seen under
    another run, which would be false of an attempt- or run-scoped writer stamp; and, for the tree/commit split, two headSha
    values with one tree content.'
  discriminator: ''
