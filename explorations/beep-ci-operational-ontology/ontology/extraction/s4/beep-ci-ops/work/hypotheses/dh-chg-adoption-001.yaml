  representation_status: unresolved
  plausibility: viable
- label: "a reporting rule of the KPI law, not a referent"
  representation_status: information_artifact
  plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: false
  rationale: "The null stands. Only the KPI law block states the rule; no record in this batch shows a checkout adopting a change, and the CQ-016 query does not read membership. Needed evidence: an adoption-census observation (checkout heads against a merge commit). A decision that needs adoption itself has no pinned query: a Must/Should CQ is required and run 4 admits no CQ edit beyond CQ-009."
