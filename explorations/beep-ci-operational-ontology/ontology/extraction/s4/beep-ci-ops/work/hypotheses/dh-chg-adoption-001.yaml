proposed_referent:
  label: "adoption of a landed change by a checkout"
  description: "A relation between one checkout and one change landing, individuated by the (checkout, landing) pair. KPI law section 2 states a necessary condition, not a sufficient one: a checkout is in the post-period ONLY when its HEAD ancestry includes the event's merge commit. The law calls change-event membership 'ADOPTION-QUALIFIED' and warns 'old binaries keep old behavior'. It would constrain the CQ-016 kind (dh:chg-change-landing:001) and is kept apart from the wall-clock partition point (dh:chg-landing-instant:001), as the law itself keeps them apart."
representation_status: unresolved
alternatives:
