cq_warrants:
- CQ-022
proposed_referent:
  label: verification attempt (one started run of the verification pipeline, as against the request it may submit and the
    lane runs it contains)
  description: 'One instance is one verification attempt: opened by an `_tag=attempt-started` row (so-6390d5f857ae, so-10c2570fe2f6,
    so-3bf9cacb55b4, and so-eefbf95beb8d with its twin so-ff071fc9a2a9) carrying `mode` (`repair`, `verify`, `closeout`) and,
    where present, `stage` and `proofTier`; closed by an attempt-finished verdict (so-ca8b3f90e57c: `outcome`, `elapsedMs`,
    `committed`, `pushed`) or by an attempt-terminated reason (so-f8f678d23c44, `reason=legacy-unowned-start`). Individuated
    by its attempt identifier (`attemptId`; the observation id is the citation), never by the run it belongs to: one run file
    holds several attempts (dh:vfy-run-grouping:001). The same identifier stamps the proof-ledger lane records written during
    the attempt (several lanes per attempt: so-1de864e5f2e5 and so-1dc3d062f26a; so-3df0321fa230 through so-c997b4851faa under
    `stage=repair-loop`) and the admission chains enqueued on its behalf, and the quarantined lease so-a8d270b5e19d carries
    attempt members (`startedAt`, `stage`, `proofTier`, `resolvedHeadSha`) beside admission members. Queue A: no cited record
    pair joins one `attemptId` value across two record classes (attempt journal, proof ledger, admission journal), every admission
    chain that carries an `attemptId` carries a different one, and successive withdrawn chains from one checkout and branch
    each carry a fresh one, so attempt and seat request are one to one wherever both show; this is a sample limit, not an
    absence. so-6390d5f857ae carries no `stage` key; that absence selected the row and is not a fact. The KPI law (po-fd56d2b008d1)
    counts a terminated attempt as red and evicts whole terminal attempts per run-id file. CQ-022 needs VerificationAttempt
    (inAttempt on CommittedFailure and WorkUnitExecution). Record pairs so-1a2d6fd275d6/so-1dc3d062f26a, so-d6adeec15c79/so-fcbe894799ea,
    so-eefbf95beb8d/so-ff071fc9a2a9, so-df1f4d8ba41f/so-3013eedf6f82 are each one record span seen twice (the vocabulary record
    a strict subset of its twin): one individual, both cited.'
representation_status: domain_referent
alternatives:
- label: the journal, ledger and admission rows about an attempt (records, not the occurrence)
  representation_status: information_artifact
  plausibility: viable
- label: an alias of the seat request (attemptId as a second identifier of one admission chain; see dh:vfy-seat-request:001);
    told apart by an attempt-started row sharing its attemptId with an admission chain, or by two chains under one attemptId
  representation_status: lexical_alias
  plausibility: viable
- label: the lane runs with the attempt as a grouping label only; told apart by the attempt-journal start row and verdict
    (so-6390d5f857ae, so-ca8b3f90e57c) whose `elapsedMs` spans from that start to the verdict's end, a span of the attempt
    itself that the proof-ledger and admission records, which show the attempt only as a stamp, lack
  representation_status: implementation_artifact_only
  plausibility: viable
- label: the episode the attempt belongs to (see dh:vfy-run-grouping:001)
  representation_status: unresolved
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The null falls: the attempt has its own start row and its own verdict, whose elapsed time spans exactly from
    that start to the verdict''s end, and the verdict locates a failure at one step while another step passed. The proof-ledger
    and admission readings left the null standing because those records show the attempt only as a stamp; the attempt-journal
    records supply its own events. Whether attempt and request are distinct individuals stays open. Needed evidence: an attempt-started
    row sharing its attemptId with an admission chain, or two admission chains under one attemptId.'
  discriminator: 'so-6390d5f857ae is an `_tag=attempt-started` row with `startedAt=2026-08-23T16:59:45.919Z`, and so-ca8b3f90e57c
    in the same attempt journal file carries `endedAt=2026-08-23T17:01:07.524Z`, `elapsedMs=81605`, `outcome=failure` and
    `failedStepId=prepare:05-docgen` beside lane `prepare:01-effect-imports` at `status=passed`: the verdict''s elapsed time
    is exactly the interval from the start row to the verdict''s end, which would be false if the attempt were only a bookkeeping
    label.'
epistemic_status: proposed
confidence:
  value: 0.6
  use_for_acceptance: false
