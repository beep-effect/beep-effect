cq_warrants: []
proposed_referent:
  label: admission termination (the dated end of a request or a grant)
  description: 'One instance would be one dated end of an admission: a withdrawal of a queued request (`_tag=admission-withdrawn`,
    `withdrawnAtMillis`), an eviction of a queued request (`_tag=admission-ticket-evicted`, `reason=queued-submitter-death`),
    a release of a grant (`_tag=admission-released`, `releasedAtMillis`) or an eviction of a grant (`_tag=admission-lease-evicted`,
    `reason=owner-dead-or-reused`), individuated by the chain it ends and its instant. Every chain record here carries one
    such end; the stanza records for `withdrawnAtMillis` (record 51), for the eviction members (record 249), for `releasedAtMillis`
    (record 1, and the record-10 pair read as one span) also show it. The eviction rule is set in the protocol stanza (`eviction=on`,
    so-a815a77c32ca); a ticket eviction (so-29a5ac8607a2) and a lease eviction (so-860cff0d673e) fall within milliseconds
    of each other, which reads as one application of the rule ending two admissions, the rule and its application being different
    things (see dh:vfy-coordination-protocol:001). The end kinds bound the active span of a grant (CQ-008, CQ-009) but no
    pinned query needs the end event itself.'
representation_status: unresolved
alternatives:
- label: phase transition of the request or grant (an end as a change of state, not an event individual)
  representation_status: unresolved
  plausibility: viable
- label: journal row only (the store's record of the end; see dh:vfy-admission-store-record:001)
  representation_status: information_artifact
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'A discriminating fact is held: so-29a5ac8607a2 and so-860cff0d673e end for different stated reasons (`reason=queued-submitter-death`
    against `reason=owner-dead-or-reused`), so the ends are not one undifferentiated bookkeeping step. It is not used: no
    pinned Must/Should query needs the termination as a referent, and the decision a CQ would serve (how often and why admissions
    end without completing, and whether withdrawn work returns under another chain) has none in the suite. Named missing decision:
    a Must/Should CQ is required and run 4 admits no CQ edit beyond CQ-009. Needed evidence for the resubmission reading:
    a later chain for the same attempt after a withdrawal, which no record here shows.'
  discriminator: ''
epistemic_status: proposed
