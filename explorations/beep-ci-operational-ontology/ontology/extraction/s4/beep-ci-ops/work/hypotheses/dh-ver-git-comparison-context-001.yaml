proposed_referent:
  label: Candidate baseline-comparison context for verification applicability
  description: A possible contextual comparison involving the checked-out branch, a comparison base, and
    reported divergence or path overlap. The candidate groups the stored behindCount, mergeBase, and overlappingPaths
    evidence without identifying the two compared change sets solely from field names. Whether this comparison
    is required to decide continued applicability of verification evidence remains unresolved. The listed
    overlap is not an affected-package closure, a cache-invalidation event, or a complete blast radius.
representation_status: unresolved
alternatives:
- label: A Git divergence summary supplied only for human diagnosis
  representation_status: information_artifact
  plausibility: viable
- label: Implementation metadata retained beside an unrelated verdict
  representation_status: implementation_artifact_only
  plausibility: viable
- label: A comparison relation whose result constrains acceptable verification evidence
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: The supplied config_key_value objects include "behindCount=0", nonzero behind counts, stored
    mergeBase hashes, and "overlappingPaths=standards/coverage.regression-baseline.jsonc". No supplied
    fact connects a change in any of these values to acceptance, invalidation, or transfer of evidence.
    In particular, the isolated overlap does not name the comparison operands or prove a dependency/hash-surface
    computation, and a zero behind count does not prove equal trees. Needed evidence is an explicit comparison-operand
    binding and an observed validity decision that depends on the result. The runtime mergeBase values
    must not be confused with corpus_base or capture provenance; the latter warrant no referents.
  discriminator: ''
epistemic_status: proposed
confidence:
  value: 0.5
  use_for_acceptance: false
