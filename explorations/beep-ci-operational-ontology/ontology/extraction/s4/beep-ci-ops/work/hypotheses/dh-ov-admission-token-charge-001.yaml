proposed_referent:
  label: Policy-assigned admission token charge
  description: The amount of token capacity charged for an admission request, represented by weightTokens
    and serialized as an integer. It participates in the admission comparison against remaining capacity.
    It is not a wall-time estimate, a measurement of physical memory, or an execution resource guarantee.
representation_status: domain_referent
alternatives:
- label: Information value recording a policy charge
  representation_status: information_artifact
  plausibility: viable
- label: Measured physical resource consumption
  representation_status: domain_referent
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The emitter carries request.weightTokens into an integer assertion and the quoted operational
    comparison uses weight in deciding admissibility. This is a policy quantity with decision consequences
    beyond the field representation. All three fixture requests happen to carry five tokens; this batch
    cannot justify generalizing that value to every work kind or deriving a memory-per-token equivalence.
    No actual over-capacity admission is established.
  discriminator: The emitter emits "ciops:admissionChargeTokens "${request.weightTokens}"^^xsd:integer"
    and the fixture shows integer charge 5 for each example request. The input contract quotes the deployed
    invariant "activeTokenTotal + weight <= capacityTokens"; the admission contract uses the corresponding
    weightTokens inequality. Denying any charge referent would deny the very quantity compared to decide
    whether a request fits.
epistemic_status: proposed
confidence:
  value: 0.9
  use_for_acceptance: false
