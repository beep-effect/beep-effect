proposed_referent:
  label: seat grant release occurrence
  description: An occurrence of relinquishing an acquired admission grant through release. An instance
    is bounded by admission-released at releasedAtMillis; the preceding admitted event establishes the
    grant whose reported holding it ends. Release is different from that grant, its acquisition, withdrawal
    of a queue request, and eviction of either a ticket or a lease. A memoryPeakBytes value in some release
    reports is associated reported context, not the meaning of release, a token charge, an execution limit,
    or a successful verification result. The 21 cited histories report release boundaries without providing
    a complete current resource or origin census.
representation_status: domain_referent
alternatives:
- label: A release assertion preserved in the journal. Observation of the lease relinquishment and the
    corresponding holder-accounting change would discriminate the release occurrence from a report whose
    assertion has not been independently checked.
  representation_status: information_artifact
  plausibility: viable
- label: The grant's terminal boundary without a distinct release event. Evidence requiring release-specific
    participants or effects beyond the grant's ending would discriminate this boundary-only domain interpretation.
  representation_status: domain_referent
  plausibility: viable
null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: A positive release following admission reports the end of an acquired holding, which is material
    to interpreting active-resource and origin-exclusion decisions. Its operational target differs from
    a queue withdrawal, and its reported mechanism differs from lease eviction. The occurrence reading
    is supported as a hypothesis; the report-only reading remains viable. Release carries no assertion
    that the authorized work completed successfully.
  discriminator: 'For nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088, the config_key_value predicate has these
    rechecked objects: ''_tag=admission-admitted'', ''admittedAtMillis=1788926595216'', ''_tag=admission-released'',
    ''releasedAtMillis=1788927008574'', ''memoryPeakBytes=9904820224''. For nonce=fe8a685d-5b73-4f88-ae2e-c776af84fbb2,
    the config_key_value predicate has these rechecked objects: ''_tag=admission-admitted'', ''admittedAtMillis=1788926455356'',
    ''_tag=admission-released'', ''releasedAtMillis=1788928685035''. Separate same-nonce blocks assert
    acquisition and then release of that holding. If there were no relinquishment denoted, the grant would
    have no reported release boundary and its holder interval would differ. Those dated assertions distinguish
    the operational release from pure formatting metadata; they do not independently establish the work''s
    outcome.'
epistemic_status: proposed
