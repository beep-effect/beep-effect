proposed_referent:
  label: Candidate verification applicability context
  description: A possible information binding between a reported result, its resolved source revision,
    a diff fingerprint, and a selected proof tier. All four observations carry these members, but their
    conjunction is not yet evidence of an enforced validity or transferability relation. This candidate
    does not authorize reuse, cross-checkout skips, interpretation of a source commit as a task-input
    hash, or treatment of a fingerprint as a tree-state identity criterion.
