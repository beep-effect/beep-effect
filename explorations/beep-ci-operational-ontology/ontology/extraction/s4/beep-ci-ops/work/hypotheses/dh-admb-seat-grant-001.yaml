cq_warrants: ["CQ-008","CQ-009","CQ-010"]
proposed_referent:
  label: "Seat grant"
  description: >-
    An instance is one authorization to hold charged scheduler capacity resulting from admission
    of a request. Its recorded holding begins at admission-admitted and has an observed endpoint
    at admission-released or admission-lease-evicted when one is supplied. The conferment
    occurrence, the resulting holding, its termination occurrence, and any work execution are
    separate candidate referents. Twenty-eight chains positively record admission: 21 also
    record release, five record lease eviction, and two supply no endpoint. Missing endpoints do
    not establish current activity, indefinite persistence, or uninterrupted holding. Charge and
    originKey qualify the recorded grant; requested charge on an unadmitted ticket is not such a
    holding. No remaining-capacity-at-admission snapshot, complete concurrent grant census, or
    execution linkage is established, so no capacity/exclusion verdict or successful execution
    follows.
representation_status: domain_referent
alternatives:
  - label: "Information asserting an admission holding and its recorded boundaries"
    representation_status: information_artifact
    plausibility: viable
  - label: "The dated conferment occurrence, with no separately reified persisting authorization"
    representation_status: domain_referent
    plausibility: viable
null_hypothesis:
  label: "implementation artifact only"
  rejected: true
  rationale: >-
    The primary reading denotes the charged holding that holder and origin-exclusion decisions
    concern. It consolidates the first batch's grant reading while preserving the second batch's
    information-history reading. A contemporaneous lease/active-charge trace correlated to
    admission and termination would distinguish an operational holding from its report, and
    evidence of authorization persisting after conferment would distinguish the holding from the
    conferment occurrence. The supplied journal alone does not prove that trace or an invariant
    verdict. The two positive admissions without endpoints remain in this kind with later status
    unknown.
  discriminator: >-
    For (config_key_value, "nonce=411b3ba7-f32a-4d07-8a0c-c764dc5b8088"), the re-opened
    observation supplies (config_key_value, "_tag=admission-admitted"), (config_key_value,
    "admittedAtMillis=1788926595216"), (config_key_value, "weightTokens=5"), and
    (config_key_value, "originKey=4cc31eeb4dec"), plus (config_key_value,
    "_tag=admission-released") and (config_key_value, "releasedAtMillis=1788927008574"). The
    second batch reports the same kind of charged holding for (config_key_value,
    "nonce=0ff912cf-d69b-4cd8-bf68-27293f6c0cce"), admitted at (config_key_value,
    "admittedAtMillis=1788929720160") and released at (config_key_value,
    "releasedAtMillis=1788930321941"). The recorded assertion is of conferred capacity that can
    subsequently be relinquished. If there were no grant referent beyond implementation
    encoding, that asserted holding and its relinquishment would be false. Logging is not
    claimed to allocate the capacity.
epistemic_status: proposed
