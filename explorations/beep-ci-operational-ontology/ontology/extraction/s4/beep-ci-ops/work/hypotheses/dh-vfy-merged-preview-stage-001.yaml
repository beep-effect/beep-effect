null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: 'The null falls: an attempt actually began at this stage under a stated mode and environment, so the value marks
    where a real verification occurrence ran. Whether a stage is a phase of an episode or a kind of activity is left to the
    foundational seat.'
  discriminator: 'so-3bf9cacb55b4 is an `_tag=attempt-started` row carrying `stage=merged-preview` with `mode=verify`, `envProfile=pr-posture`
    and `proofTier=full`, and po-58c65850834f retains merged-preview starts in the fleet journals: a verification attempt
    began at this stage, which would be false if the literal named no point in the verification workflow.'
