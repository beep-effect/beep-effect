proposed_referent:
  label: merged preview as a proof stage (reading b)
  description: 'One instance is the merged-preview stage: the point in the verification workflow at which evidence is produced
    against the merged tree, a member of the proof-stage kind dh:vfy-proof-stage:001. Deployed spelling: the `ProofStage`
    literal list (po-581b06759057: `repair-loop`, `pre-push`, `merged-preview`, `hosted`) and the `stage` member of attempt-started
    rows (so-3bf9cacb55b4). Individuated by its position in the stage order, not by the literal. It does not answer the Queue
    H question: the record carries `proofTier=full`, the deployed proof-tier value whose mapping into assurance tiers is open
    (dh:vfy-deployed-proof-tier:001), so it places the attempt in no assurance tier. Tier or stage is told apart in assurance-tier
    terms: a record tying a merged-preview attempt or episode to one of the three AssuranceTierId levels as the level it is
    verified toward favours a stage inside that tier, and a level of its own, with lane obligations not required for TierLocalFullProof
    (the CQ-017 asymmetry shape), favours a fourth tier. No pinned CQ needs it directly;
    it disambiguates the CQ-warranted tier class (dh:vfy-assurance-tier:001), so it is judged on evidence with no warrant.
    The stage and the admission work kind come apart on one record: the quarantined lease so-a8d270b5e19d carries `kind=merged-preview`
    at `stage=pre-push`. Merged preview is dormant in the capture window (ledger census po-563da43a9f12 and reading po-82648cf8d37a:
    no fact and no shadow on either side of the cut; fleet census po-58c65850834f: starts retained from before the cut, none
    since), never observed-and-empty.'
representation_status: domain_referent
