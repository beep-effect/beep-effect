  rationale: "The projection contract says pending requests are admitted in canonical order under named capacity, priority, class-cap, and starvation constraints, and that replay arbitrates disagreement with deployed behavior. The optional configuration type and admission timestamp are representations of that policy and its decisions, not the whole referent."
