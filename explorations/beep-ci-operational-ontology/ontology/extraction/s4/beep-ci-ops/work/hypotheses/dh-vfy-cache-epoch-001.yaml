proposed_referent:
  label: cache epoch (the environment configuration state shared by the lanes run against it)
  description: 'One instance is one epoch named by `epochDigest`: the configuration state under which facts are issued, individuated
    by its configuration surface (every fact pair sharing an epochDigest here also shares lockfileDigest, rootTsconfigDigest
    and rootTurboConfigDigest, with `bunVersion`, `nodeVersion` and `policyPackVersion` beside them), not by any one lane.
    In every fact `digest` carries the same value as `epochDigest`. Whether epoch is a referent rather than a field (Queue
    B) is not decided by the cited records (see the null rationale); key is not (see the record-envelope hypothesis). Answers CacheEpoch for CQ-005, CQ-006, CQ-014 and CQ-015; CQ-015''s
    note asks for task-hash grain, which the task-input-state hypothesis holds as a rival grain. Record pairs so-d6adeec15c79/so-fcbe894799ea
    are each one record span seen twice (the vocabulary record a strict subset of its twin): one individual, both cited.'
representation_status: unresolved
alternatives:
- label: an environment fingerprint digest (the record of the state)
  representation_status: information_artifact
  plausibility: viable
- label: task-input state at turbo task-hash grain (see the task-input-state hypothesis)
  representation_status: unresolved
  plausibility: viable
- label: a writer-stamped opaque per-attempt digest with no environment state behind it (the null reading; one epochDigest
    recurring across two attempts would discriminate)
  representation_status: implementation_artifact_only
  plausibility: viable
- label: a per-record cache key
  representation_status: implementation_artifact_only
  plausibility: weak
null_hypothesis:
  label: implementation artifact only
  rejected: false
  rationale: 'The null stands. Lanes of one attempt share one epochDigest while their commandDigest differs (so-12d5a26fbfac
    and so-d6adeec15c79 within one attempt, so-40abdcaf1156 and so-c997b4851faa within another), which rules out a per-lane
    key but is equally true of a writer-stamped opaque digest issued once per attempt: in every cited fact each epochDigest
    value belongs to one attempt, and facts of different attempts (and of different clone ledgers) carry different values,
    as do their lockfileDigest values, so no cited record shows the epoch as configuration state apart from the attempt that
    stamped it. Needed evidence: one epochDigest value on facts of two different attempts (two heads, or two clone ledgers),
    or two attempts with an equal configuration surface and different epochDigest values; also a record of an epoch change
    with its instant (CQ-014''s beganAt).'
  discriminator: ''
epistemic_status: proposed
confidence:
  value: 0.45
  use_for_acceptance: false
