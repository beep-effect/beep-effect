null_hypothesis:
  label: implementation artifact only
  rejected: true
  rationale: The null reading is that the lease is a scheduler variable. The records show a held claim with its own liveness
    condition, its own ends and a consumption reading taken over the held span, none of which belongs to the queued request.
    Whether it is a kind of its own or the held phase of one engagement stays open (dh:vfy-admission-engagement:001).
  discriminator: so-860cff0d673e carries `_tag=admission-admitted`, then `_tag=admission-lease-evicted` with `reason=owner-dead-or-reused`
    and a `lastHeartbeatAtMillis` earlier than its `evictedAtMillis`; the held admission is kept alive by its holder's heartbeat
    and revoked when the heartbeat stops, a condition the queued request rows never carry.
epistemic_status: proposed
