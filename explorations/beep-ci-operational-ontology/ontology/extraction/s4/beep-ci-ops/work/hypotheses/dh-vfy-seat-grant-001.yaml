proposed_referent:
  label: seat grant (a held admission to shared verification capacity)
  description: 'One instance is one admission held by a run: it begins at an `_tag=admission-admitted` row (`admittedAtMillis`)
    of a chain that was first enqueued, is held under the holder''s heartbeat (`lastHeartbeatAtMillis`), and ends by release
    (`_tag=admission-released`, `releasedAtMillis`, with a `memoryPeakBytes` reading on some chains) or by eviction (`_tag=admission-lease-evicted`,
    `evictedAtMillis`, `reason=owner-dead-or-reused`). It is individuated by its chain (one per `nonce`; the observation id
    is the citation) and holds a checkout (`checkoutRoot`, dh:vfy-checkout:001) at a charge (`weightTokens`, dh:vfy-admission-charge:001).
    Instances: the five admitted-and-released chains, the two lease-evicted chains, the record-0 stanza (an admitted row),
    the record-10 pair so-df1f4d8ba41f and so-3013eedf6f82 (one release span seen twice, read as one span, never two individuals),
    the record-1 release stanza, the record-249 eviction stanza, and the quarantined lease state record so-a8d270b5e19d (`schemaVersion=yeet-admission-lease/v1`,
    `support=active`, with `stage=pre-push`, `proofTier=full` and `coordinationProtocol=scheduler-origin-concurrency/v1` members).
    Answers CQ-008 (active grants holding a resource), CQ-009 (two active grants on one checkout, or the legacy-origin drain
    arm) and CQ-010 (the charge admitted against capacity). Not shown: a renewal or a transfer of a grant.'
representation_status: domain_referent
alternatives:
- label: held phase of one admission engagement (see dh:vfy-admission-engagement:001)
  representation_status: unresolved
  plausibility: viable
- label: lease file or journal row only (see dh:vfy-admission-store-record:001)
  representation_status: information_artifact
