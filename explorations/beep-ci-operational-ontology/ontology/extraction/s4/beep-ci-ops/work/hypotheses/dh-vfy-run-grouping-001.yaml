  rationale: 'The null stands: the records show attempts sharing a run id, but no episode boundary (a first red and a later
    green within one run) and no rule that one run is one episode; the runId values read as branch-derived labels. Needed
    evidence: an attempt-finished verdict with a success outcome in the same run as a failed attempt, or a record that opens
    or closes an episode.'
  discriminator: ''
