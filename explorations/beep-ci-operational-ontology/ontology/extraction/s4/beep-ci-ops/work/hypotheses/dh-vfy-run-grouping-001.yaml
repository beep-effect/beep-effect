proposed_referent:
  label: verification episode the runId grouping may carry (a multi-attempt verification streak toward certainty)
  description: 'The referent under test is the verification episode that CQ-007 and CQ-012 need in their pinned queries (one
    instance: a red-to-green streak of attempts toward certainty, whose time-to-certainty and its decomposition those queries
    read), taken under the warrant rule that a candidate carrier takes the warrant of the kind it may carry; the `runId` grouping
    is the candidate carrier tested here, not the referent. Under that carrier an instance would be individuated by one `runId`.
    In the attempt journals one run file holds a repair attempt and a later closeout attempt over one head (so-eefbf95beb8d
    with its twin so-ff071fc9a2a9, then so-10c2570fe2f6), and so-6390d5f857ae and so-3bf9cacb55b4 open attempts of other
    runs. In the proof ledger every cited fact carries a `runId`, and one value spans an attempt at `stage=pre-push` on one
    head (so-12d5a26fbfac, so-d6adeec15c79 with its twin so-fcbe894799ea) and a later attempt at `stage=repair-loop` on another
    head (so-40abdcaf1156, so-c997b4851faa). So a run groups several attempts, across stages and across trees. The KPI law
    (po-fd56d2b008d1) retains terminal attempts per run-id file and keys its M1 proxy per branch, not per (checkout, branch).
    What is open is whether one run bounds one episode. One rule is applied across the vfy records: a warrant follows need,
    not the null''s standing, so a record lists every pinned Must/Should CQ whose query needs the kind it proposes, or proposes
    a candidate carrier of, whether its null stands or falls (as dh:vfy-owning-agent:001, dh:vfy-priority-class:001, dh:vfy-coordination-protocol:001,
    dh:vfy-repository-origin:001 and dh:vfy-assurance-tier:001 keep theirs with the null standing), and the null alone carries
    the evidence question. Record pairs so-d6adeec15c79/so-fcbe894799ea and so-eefbf95beb8d/so-ff071fc9a2a9 are each one
    record span seen twice (the vocabulary record a strict subset of its twin, so-ff071fc9a2a9 lacking the `runId` key its
    twin carries): one individual, both cited.'
