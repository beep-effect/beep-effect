      proposed_iri: "https://oip.law/ontology/ci-ops#VerificationResultArtifact"
      owl_entity_kind: "class"
    definition: "An information object comprising one bounded snapshot of result assertions about a particular operational attempt, preserving the asserted aggregate outcome, component-result associations, coverage, and publication claims. Representations of the same attempt with the same full assertion content express the same snapshot; corrected content or another attempt gives a different snapshot. Omitted results and explicitly not-run results remain distinct. A report can be meaningful without newer identifier or timing fields, although such omissions limit reidentification. This snapshot is neither the attempt occurrence nor assurance already attained."
    category: "information_object"
    foundational_status: "analyzed"
    operational_warrant:
      competency_questions: []
      semantic_support_for:
        - "otp:att-verification-attempt:001"
    identity_criterion_verbatim: "Proposed at report-content snapshot grain: one bounded set of result assertions about one particular operational attempt. Two representations denote the same snapshot only when they concern the same attempt and preserve the same asserted coverage, aggregate outcome, component-result associations, and publication claims, including distinctions between an omitted result and a reported not-run result. Equivalent serialization or copying preserves this content identity; a different attempt or a correction to the asserted results yields different content. This is a proposed semantic criterion, not an assertion that the deployed report file is immutable or that its complete content is recoverable from flattened facts. An extraction observation and a report are not necessarily in one-to-one correspondence. Equal partial projections do not establish equal reports. Capture provenance supplies no part of this criterion."
