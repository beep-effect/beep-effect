    identity_criterion_verbatim: "Two carriers express the same recorded grant account when they preserve the same reported admission subject, admission assertion, and bounded set of attributed values and boundary assertions in the same journal context. Copying that account does not create another information content. A new admission assertion concerns a different reported subject; adding or correcting a boundary creates a different account version. The criterion is contextual assertion content, not nonce equality, origin, charge, file location, or uninterrupted authorization. Nonce and recorded admission time locate and correlate assertions only."
