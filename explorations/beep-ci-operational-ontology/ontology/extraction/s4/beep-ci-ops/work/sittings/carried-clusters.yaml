- id: admission-lifecycles
  name: Request and lease lifecycles, including the memory rider
  row_count: 5
  recommended_outcome: unresolved
  one_line_reason: New boundaries and heartbeat snapshots leave causal/carrier continuity, separate CQs
    and the memory rider open.
  reason: 'Run 3 supplies an organic same-root/nonce enqueue-admit-release history, plus synthetic withdrawal
    and eviction reports with two attempt-termination joins. The pure lifecycle duty still needs authoritative
    causal continuity from one request''s submission through grant and release/cancellation, and a Must/Should
    CQ requiring a lifecycle distinct from its request, grant and boundary reports. The memory rider remains
    independently parked under Ruling 6: the release now carries memoryPeakBytes, but the resource-using
    occurrence/process boundary, sampling method and interval, metric/unit, measurement provenance and
    its relationship to peakRssKb are still missing. Different capture-scoped ownerRef values and an administrative
    termination notice cannot decide either missing identity.


    Run 3 now provides a same-root/nonce organic enqueue-admit-release chain and explicit synthetic withdrawal,
    grant-eviction and ticket-eviction boundaries. Synthetic attempt-terminated records match the two
    eviction attemptIds. What remains is authoritative causal-continuity evidence connecting one submitted
    request to its grant and release/cancellation, together with a Must/Should decision CQ requiring that
    composite lifecycle separately from SeatRequest, SeatGrant and their boundary reports. The terminal-only
    synthetic eviction chains lack their own retained starts, and recordedAt is a reconciliation time
    rather than proof of actual execution cessation.


    Run 3 adds two live lease snapshots with the same nonce, grant instant and charge but different heartbeat
    instants, organic release/eviction reports, and explicitly synthetic eviction-to-attempt-termination
    joins. It still lacks one provenance chain that binds a grant''s creation, complete heartbeat-rewrite
    history, release/eviction, actual ledger decrement and carrier lineage. Capture-scoped ownerRef values
    cannot prove cross-capture owner continuity; a terminal lastHeartbeatAtMillis is not a rewrite history,
    and the synthetic evicted lease has no retained admission start. A Must/Should CQ must also require
    this lifecycle separately from SeatGrant. Keep both the provenance and separate-warrant duties open.'
  ref: null
