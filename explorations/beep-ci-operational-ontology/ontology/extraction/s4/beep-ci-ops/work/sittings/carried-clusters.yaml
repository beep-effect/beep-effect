- id: origin-and-heartbeat-policy
  name: Origin-block and heartbeat-suspicion policy
  bucket: C(iv)
  row_count: 5
  recommended_outcome: unresolved
  rationale: No run-4 observation carries blockedOnOriginAtMillis, the change ledger dates the per-origin
    lock's retirement, and CQ-009 now holds an origin arm only as a legacy drain; the two organic lease
    evictions end about 4 s and about 30 min after their last heartbeats under the same reason, so no
    single staleness threshold is visible.
  rejected_alternative: 'Retire the three origin-block rows because #929 retired the per-origin lock.
    Rejected: the ledger row is observational seed data, the rows were observed after #929 landed, and
    CQ-009''s legacy-drain arm still needs the origin regime.'
  sitting_decision: Whether origin-block semantics are now asked only through CQ-009's legacy-drain arm
    (re-word next run) or kept under CQ-023's starvation policy; heartbeat duties re-park unchanged in
    substance.
