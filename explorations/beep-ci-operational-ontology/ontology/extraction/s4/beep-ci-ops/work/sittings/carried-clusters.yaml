    joins open.
  reason: 'Run 3 now captures a ticket''s blockedOnOriginAtMillis=0 and separately records queue, withdrawal
    and eviction boundaries. dh:att-origin-block-marker:001 leaves the zero''s meaning unresolved. Under
    Ruling 6, obtain the deployed threshold rule, its unit and both true/false consequences, decide grace
