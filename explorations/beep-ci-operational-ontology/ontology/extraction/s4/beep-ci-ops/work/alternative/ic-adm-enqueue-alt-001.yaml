id: "ic:adm-enqueue-alt:001"
hypothesis_ref: "dh:adm-enqueue:001"
identity:
  supplies_identity: true
  identity_criterion: >-
    Same enqueue occurrence iff it is the same punctual entry of one request
    into admission contention, bounded by one admission-enqueued block at one
    enqueuedAtMillis. It is the entry boundary, not the waiting interval, not
    the request bearer, not a later admission or withdrawal, and not the journal
    entry. An enqueuedAtMillis carried on an admission-admitted block does not
    by itself mint a separately observed enqueue occurrence. Nonce is evidential
    join only. ownerRef and other capture members are never identity criteria.
  reidentification_key:
    - "nonce (evidential join only)"
    - "enqueuedAtMillis"
    - "_tag=admission-enqueued"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: >-
    One dated queue-entry transition per positive enqueue tag; not the whole
    wait and not a flattened file-level projection of mixed records.
  dependence: relational
ufo_analysis:
  candidate_category: event
  alternatives:
    - information_object
  existential_dependencies:
    - "seat request whose queue participation this occurrence begins"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
    - occurred
counterexamples:
  - description: >-
      Inventing a separate enqueue occurrence from an enqueue timestamp that
      merely rides on an admission report. Only chains with a positive
      _tag=admission-enqueued, such as
      so:sha256:0415a4f1590540c534d5ccc9027d36acddbfa4ffdd84445bda5155dac85ac5c6
      record 205, denote this event (CQ-007, CQ-021).
  - description: >-
      Identifying enqueue with the later grant or withdrawal of the same nonce.
      so:sha256:0415a4f1590540c534d5ccc9027d36acddbfa4ffdd84445bda5155dac85ac5c6
      distinguishes admission-enqueued at 1788926595182 from admission-admitted
      at 1788926595216;
      so:sha256:91d2cd56cb62e64ab02890e9792e172bcd9350420a034a74fda5d8c35367bb4a
      distinguishes enqueue at 1788928587012 from withdrawal at 1788928909789
      (CQ-021, CQ-023).
status: proposed
