tests:
  spec_vs_execution: not_applicable
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: false
rival_models:
- label: role of a request relative to admission ordering policy
  still_viable: true
- label: rigid subkind of admission request
  still_viable: true
- label: interchangeable handler literals with no ordering consequence
  still_viable: false
strongest_counterexample: Publish-precedes-verify is a policy consequence, which a quality,
  a role, or a subkind can all carry. No observation shows a request changing class, so anti-rigid
