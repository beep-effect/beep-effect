tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: not_applicable
  context_reification_needed: false
rival_models:
- label: event of an actually run step (excluding not-run rows)
  still_viable: true
- label: Yeet pipeline bookkeeping row with no aboutness
  still_viable: false
