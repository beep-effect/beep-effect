id: "ic:vfy-lane-execution-alt:001"
hypothesis_ref: "dh:vfy-lane-execution:001"
referent_grain: >-
  One dated run of one verification lane inside one attempt, possibly nested in a wrapper lane run, as
  against the reusable lane and the verdict entry or ledger record that reports it.
identity:
  supplies_identity: true
  identity_criterion: >-
    Two lane runs are the same iff they are the same occurrence: one execution of one lane within one attempt
    over one span of time. Sharing a lane name and attempt is not enough if the lane ran twice; laneId plus
    attempt is evidence, never the criterion.
  reidentification_key:
    - "attempt plus laneId or verdict lane id (evidence only)"
    - "durationMs agreed by a fact and its shadow (evidence only)"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: >-
    A run is unified by one process span from start to exit; a wrapper lane run (parentLaneId=full:01-pre-push on
    so-5d4b45aa3226) has inner lane runs as temporal parts, so unity is mereological as well as temporal.
  dependence: relational
ufo_analysis:
  candidate_category: event
  alternatives:
    - "the verdict lane entry or ledger record as an information object"
    - "temporal part of the attempt with no individuality of its own"
    - "the reusable lane specification"
  existential_dependencies:
    - "the attempt it runs within"
    - "the lane specification it executes"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states:
    - "passed"
    - "failed"
counterexamples:
  - description: >-
      Two namespaces name runs: verdict lane entries use step ids such as prepare:01-effect-imports and
      full:01-pre-push (so-ca8b3f90e57c, so-5d4b45aa3226), ledger records use laneId values such as fallow:audit and
      quality:coverage. No cited observed_facts pair a verdict entry and a ledger record of one run, so my
      criterion may count one run twice (once per record class) or a wrapper and its inner lanes as runs of one
      kind when the wrapper is only a grouping.
  - description: >-
      Every ledger fact of one attempt carries one recordedAt (so-40abdcaf1156 and so-c997b4851faa both at the
      attempt's write instant despite durations of about 401 s and 642 s), so recordedAt dates the write, not the
      run; a card that dates runs by recordedAt would give runs of very different length one instant.
status: proposed
