id: "ic:vfy-verification-lane-alt:001"
hypothesis_ref: "dh:vfy-verification-lane:001"
referent_grain: >-
  A repeatable verification procedure (a lane specification) that many runs execute, as against any run of it,
  the command text that implements it, and the obligation a tier places on it.
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    unresolved: whether two runs execute the same lane when the lane name persists but its command changes is not
    shown; every cited fallow:audit record carries one commandDigest, so no record separates identity by lane name
    from identity by procedure content.
  reidentification_key:
    - "laneId (evidence only)"
    - "commandDigest (evidence only)"
ontoclean:
  rigidity: rigid
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: >-
    A procedure description unified by one command; laneClass=cli-runnable is its only class value in the cited
    records and is held as a field, not a referent.
  dependence: none
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "a lane as a slot or obligation that persists across command revisions (kind individuated by name)"
    - "the command definition as a document"
    - "a label grouping ledger rows"
  existential_dependencies: []
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
  - description: >-
      Eight cited fallow:audit facts in eight clone ledgers (so-d6adeec15c79, so-1872cd0bda84, so-6c4e9189d15e,
      so-3c8a4efed3f9, so-e26c033721f6, so-a953d730c7ec, so-2816ffb640ed, so-bcccc2d7545b) share one commandDigest over
      different heads and epochs. If the lane were individuated by command content, a one-character change to its
      command would mint a new lane and orphan every tier obligation (CQ-006 requiresLane) naming the old one; if by
      name, the same lane could run a different procedure. My card cannot say which.
status: proposed
