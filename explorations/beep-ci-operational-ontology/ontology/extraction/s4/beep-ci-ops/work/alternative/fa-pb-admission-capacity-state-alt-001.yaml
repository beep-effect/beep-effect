strongest_counterexample: Capacity is computed from observed available GiB and then compared
  in activeTokenTotal + weightTokens <= capacityMaxTokens. That is a changing world quantity,
  a situation at an instant, and a recorded number. The three are observationally equivalent
  without an observation that reidentifies capacity across snapshots as one inhering quality.
