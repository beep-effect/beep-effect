id: "fa:chg-change-landing-alt:001"
hypothesis_ref: "dh:chg-change-landing:001"
identity_card_ref: "ic:chg-change-landing-alt:001"
referent_grain: >-
  A dated occurrence: one alteration of a verification mechanism becoming effective.
  Not the row that records it and not the artifact that carries it.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
  - label: >-
      Model A (this card): an event, the landing of one alteration of a verification
      mechanism, dated by landedAt. The pr and mergeCommit values are reidentification
      evidence only.
    still_viable: true
  - label: >-
      Change artifact: the class denotes the pull request and its merge commit, and
      landedAt is an attribute of that artifact (its merge time). Every one of the 44 rows
      carries exactly one pr and one mergeCommit, the 'applied'/'live' rows included. On
      current evidence this is observationally equivalent to Model A for the rows that are
      not marked 'applied'/'live'.
    still_viable: true
  - label: >-
      Merge-landing versus apply-landing: the rows titled 'applied <date>' (#1050, #1364,
      #1422) and 'live 2026-09-15' (#1141) each record two occurrences, a merge and an
      infrastructure apply or go-live. Under this reading the class needs two event
      subkinds, or the row conflates two landings.
    still_viable: true
  - label: >-
      Revision reading: a superseding row (the #1019 row 'superseded by #1022'; #870's lock
      'RETAINED (until #929)') records the revision of ONE change, not a landing of its
      own. Model A absorbs this by counting landings and leaving revision to the change
      continuant, so the readings differ only on what the change is, not on what a landing
      is.
    still_viable: true
  - label: >-
      Process: a landing is a rollout that runs from merge through apply to fleet
      adoption, not an instantaneous event. The KPI law keeps the wall-clock partition
      point apart from per-checkout adoption ('Merge time is never the fleet boundary'),
      which weakens this reading but does not exclude it for the merge-to-apply span.
    still_viable: true
  - label: >-
      Information object: the class denotes the curated ledger row. The rows carry
      knowledge written after the landing they record. The #1019 title names #1022, which
      landed later. The #870 comment names #929, which landed four days later. So a row
      and the occurrence it records come apart, and CQ-016 asks about the occurrence
      ('when did it land').
    still_viable: false
  - label: >-
      Causal control intervention: the KPI law section 2 quote forbids this reading
      without a supporting design (paired pre/post cohorts under adoption qualification),
      and no such design is among the observations.
    still_viable: false
strongest_counterexample: >-
  The hosted-runner-capacity rows. The #1141 row is titled 'live 2026-09-15' and carries a
  landedAt on 2026-09-16 UTC. The #1364 and #1422 rows are titled 'applied <date>' and carry
  whole-minute landedAt values. Each of these rows also carries a mergeCommit and a pr. If
  the infrastructure apply and the merge are distinct occurrences, a single row records two
  candidate landings, and neither landedAt nor the merge commit says which one the class
  instance is. That breaks a one-row-one-landing reading and leaves Model A's identity
  criterion incomplete.
verdict: analyzed
needed_evidence: >-
  Artifact vs landing (observationally equivalent on current evidence for the rows not
  marked 'applied'/'live'): a source record giving the merge time and the apply or live
  time separately for one change, for example the #1364 or #1422 change, set beside its
  landedAt. This also settles merge-landing versus apply-landing and whether a landing
  spans an interval. Revision vs distinct landing: a record saying whether the #1019
  alteration still holds after #1022 lands, or naming the later row a revision of the
  earlier change. Information object vs occurrence: a record of the ledger's revision
  history showing a row corrected while its landedAt and mergeCommit stay fixed would
  confirm the separation further. Context: post-period membership is adoption-qualified
  per checkout (HEAD ancestry against the event's merge commit), and that needs an
  adoption-census observation. Ruling 12 applies to the decision that needs adoption
  itself (which episodes of which checkout fall after a landing): a Must/Should CQ is
  required and run 4 admits no CQ edit beyond CQ-009.
