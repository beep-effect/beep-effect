rationale: >-
  spec_vs_execution is separated. The alteration carried by a pull request or applied
  configuration can be reverted and re-applied. Its landing is a dated occurrence of it
  becoming effective. The 'applied <date>' titles show the carrier and its taking effect
  named apart. world_vs_information is separated. The ledger rows hold content written
  after the landing they date: #1019's title names its later superseder #1022, and #870's
  comment names #929. So the row is a record about the occurrence, not the occurrence
  itself. role_vs_bearer is separated. The observational/causal standing is held relative
  to a supporting design (KPI law section 2: 'unless a supporting design ... upgrades
  it'), so it is a context-relative standing of the landing, not part of what the landing
  is. context_reification_needed is true. Whether a landing's alteration holds for an
  episode depends on the checkout's HEAD ancestry ('a checkout is in the post-period ONLY
  when its HEAD ancestry includes the event's merge commit'), and causal standing depends
  on a study design. Both are contexts outside the landing. CQ-016 is the warrant. Its
  query reads only the class and landedAt, so it is satisfied by Model A and by the
  artifact rival alike and does not decide between them. The verdict is analyzed: the
  category is ruled as event, and the open identity questions are carried as viable
  rivals with their discriminating evidence named.
