rival_models:
- label: 'kind: @beep/shared-domain as an identity-providing workspace package unit'
  still_viable: true
- label: 'information_object: @beep/shared-domain as a software information artifact'
  still_viable: true
- label: 'role: being a member of this workspace, borne by a package named @beep/shared-domain'
  still_viable: true
strongest_counterexample: The cited observation is only the capture line naming @beep/shared-domain
  plus a rank. File contents of @beep/shared-domain can change while the workspace still treats
  it as the same affected-closure participant, which the kind reading uses; a content-addressed
  tarball with another name would favor the information-object reading.
verdict: analyzed
needed_evidence: Whether CI reidentifies @beep/shared-domain across content change via the
  workspace name (kind) or treats a content-identical artifact as the same information object
  independently of the name; and whether @beep/shared-domain outside this workspace is still
  the same entity (role versus kind). The models are observationally equivalent on the topo-sort
  line alone.
