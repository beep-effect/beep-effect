id: "ic:vfy-merged-preview-work-kind-alt:001"
hypothesis_ref: "dh:vfy-merged-preview-work-kind:001"
referent_grain: >-
  The merged-preview member of the admission work kind: the category of work a seat request asks capacity for
  when it requests a merged-tree preview, as against the stage an attempt runs at.
identity:
  supplies_identity: false
  identity_criterion: >-
    Two requests fall under the merged-preview work kind iff both ask capacity for merged-tree preview work; the
    kind literal is evidence, never the criterion, and the member is the same member wherever requests fall
    under it.
  reidentification_key:
    - "kind=merged-preview on a request chain or lease state record (evidence only)"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    No unity of its own; one member of the work-kind classification. Requests under it carry weightTokens=5 in
    every cited chain and carry attemptId, branch and originKey members, as full-proof requests do and review-fix
    requests do not.
  dependence: none
ufo_analysis:
  candidate_category: subkind
  alternatives:
    - "one classifier individual of the work-kind set (powertype member)"
    - "the merged-preview proof stage (a distinct referent of the same word)"
    - "a fourth assurance-tier member"
  existential_dependencies:
    - "the seat-request kind it specializes"
temporality:
  exists_during_interval: false
  may_change_state_without_losing_identity: false
  terminal_states: []
counterexamples:
  - description: >-
      The quarantined lease so-a8d270b5e19d holds a merged-preview request whose attempt is at stage=pre-push. If
      merged-preview requests always produced merged-preview stage work, that would be false; it is consistent only
      with kind and stage being two classifications. A reader who counts merged-preview requests as merged-preview
      stage occurrences counts stage activity where the stage reads dormant.
  - description: >-
      The charge of 5 is the only kind-specific property shown; if the scheduler weight were reassigned per request
      (a merged-preview request at 3), the member would not fix the capacity claim and the discriminator would fail.
      No chain shows it, which is a sample limit, not invariance.
status: proposed
