needed_evidence: "Observationally equivalent on current evidence: independently persisting information object versus transient projection result. Discriminator: a later emission or store snapshot that re-identifies the same proposal by content/digests without re-running, versus a pure in-memory result discarded after Turtle write (po:sha256:420a8a239adca76ab424a92d99109409c629f18f044eecd35bad7102254f4a05; po:sha256:c92cd59362565eda3098e5d0828c8c377fd934ae4d4546cc190d22b25207fd9a)."
