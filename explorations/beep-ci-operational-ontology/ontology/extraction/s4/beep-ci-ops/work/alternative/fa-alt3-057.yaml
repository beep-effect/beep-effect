strongest_counterexample: diffYeetWatchSnapshots emits a transition when a check's outcome
  changes across snapshots. The world GitHub check can move while a prior snapshot still records
  pass, so the classification is not the live check state.
verdict: analyzed
needed_evidence: Whether pass is a quality/phase of the watch-check bearer or only the stored
  token. Observationally equivalent on the classifier plus the snapshot differ; a check whose
  GitHub state is success while the watch stores pending would already favor the information-object
  reading.
