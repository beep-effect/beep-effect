rival_models:
  - label: >-
      event: a removal occurrence that closes a recorded waiting segment so a
      historical enqueue is not treated as an ongoing CQ-021 queue candidate
    still_viable: true
  - label: >-
      information_object: an assertion that a request was withdrawn
