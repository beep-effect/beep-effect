id: "ic:vfy-seat-grant-alt:001"
hypothesis_ref: "dh:vfy-seat-grant:001"
referent_grain: >-
  One held admission to shared verification capacity, founded by an admission occurrence and mediating the
  holder and the capacity, as against the journal rows and lease state record about it.
identity:
  supplies_identity: true
  identity_criterion: >-
    Two grants are the same iff they are founded by the same admission occurrence and hold the same claim on
    capacity continuously between their observations; the nonce shared by a chain's rows is evidence of that
    continuity, never the criterion. A copy of the lease record elsewhere is a record of the grant, not a second
    grant.
  reidentification_key:
    - "nonce chain (evidence only)"
    - "admittedAtMillis (evidence only)"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: >-
    Unified as one claim from its admitted row to one end (release or lease eviction); rows of two journal formats
    (yeet-admission-journal/v1 and /v3 on so-95b7d78a061f, so-363f9b7f07dc) record one grant.
  dependence: relational
ufo_analysis:
  candidate_category: relator
  alternatives:
    - "held phase of one admission engagement that begins at enqueue"
    - "the lease file or journal rows only (information object)"
  existential_dependencies:
    - "the holder that keeps it alive by heartbeat"
    - "the shared admission capacity it claims"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "released"
    - "lease-evicted"
counterexamples:
  - description: >-
      The admitted row repeats the request's enqueuedAtMillis and weightTokens unchanged (so-95b7d78a061f: one
      enqueuedAtMillis value on both rows; the lease so-a8d270b5e19d also carries enqueuedAtMillis). A grant that
      carries its request's enqueue instant as its own history is what the engagement rival predicts: if request and
      grant are one admission, my card counts two individuals where there is one.
  - description: >-
      On so-a9ed1352e2bc the last heartbeat precedes the eviction by about thirty minutes, and the eviction falls 21 ms
      after an unrelated enqueue (record 330). Between the holder's last heartbeat and the eviction the grant still
      stood in the store; if a grant exists only while its holder is alive, my card overstates its span, and CQ-008
      would list a dead holder's grant as active.
status: proposed
