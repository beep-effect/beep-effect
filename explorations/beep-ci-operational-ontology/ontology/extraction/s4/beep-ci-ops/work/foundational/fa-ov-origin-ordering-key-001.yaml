id: fa:ov-origin-ordering-key:001
hypothesis_ref: dh:ov-origin-ordering-key:001
identity_card_ref: ic:ov-origin-ordering-key:001
referent_grain: Recorded origin-key assignment used as a request's comparison value in a particular projection
  input; distinct from the raw literal shared by assignments and from a repository origin.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
analysis:
  identity_and_category: The sorting rule, rather than the field spelling, supplies the value's decision
    use. The analysis is limited to recorded comparison content; it neither designates an origin sortal
    nor proves repository equality.
  rigidity: A fixed origin-key assignment remains that informational assignment after the projection becomes
    obsolete. A request's grouping or position may change in a different input without changing the request.
  dependence_and_temporality: The value assignment belongs to a projection input. The contract fixes the
    sort tuple, but the batch supplies no history of origin changes or normalization; no lifecycle for
    a repository is inferred.
  spec_vs_execution: A tie-break input helps prescribe order and does not record an execution or a grant.
  world_vs_information: An emitted origin-key value is observed. A real repository origin and its sameness
    conditions remain a separate possible referent.
  role_vs_bearer: Using a value as an ordering key is its contextual function. Neither the key nor its
    assignment is the request, repository, or grant bearer.
  context_reification: Keep the request and projection input with the value. Existing request and proposal
    records can provide this context without creating an independent assignment class.
  evidence_limit: Repeated literals establish equal illustrated comparison values only. This batch does
    not supply origin normalization, a grant binding, or active-state evidence.
rival_models:
- label: Direct scalar data property used by canonical sorting, with no independently instantiated key
    object
  still_viable: true
- label: Reference to a domain repository origin after an independently observed normalization and sameness
    contract
  still_viable: true
strongest_counterexample: The fixture repeats origin-test on three distinct requests. Treating the common
  literal as request identity merges all three; treating it as evidence of simultaneous active grants
  manufactures a grant-exclusion violation. Hypothetically, two spellings for one repository could also
  sort differently unless normalization is independently specified.
verdict: analyzed
