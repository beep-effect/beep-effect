id: "fa:ov-schedules-seat-request:001"
hypothesis_ref: "dh:ov-schedules-seat-request:001"
identity_card_ref: "ic:ov-schedules-seat-request:001"
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: not_applicable
  context_reification_needed: true
rival_models:
  - label: >-
      schedulesSeatRequest is a direct content-reference relation between the
      ScheduleStep information object and the queued SeatRequest ticket.
    still_viable: true
  - label: >-
      A scheduled-admission situation should be reified so proposal snapshot,
      order, and projection provenance do not depend on a bare binary edge.
    still_viable: true
  - label: >-
      The scheduled target is a WorkUnitSpecification rather than the
      SeatRequest carried by the journal.
    still_viable: false
  - label: >-
      The scheduled target is the SeatGrant lease produced after admission.
    still_viable: false
  - label: >-
      The edge is only a journal foreign key whose target identity has no
      scheduling semantics.
    still_viable: false
strongest_counterexample: >-
  The cited implementation report proves which ticket record the journal can
  identify, but it does not by itself decide whether a direct semantic
  scheduling relation holds or whether a proposal assertion reifies that
  content; those models preserve the SeatRequest-ticket identity equally well.
verdict: analyzed
