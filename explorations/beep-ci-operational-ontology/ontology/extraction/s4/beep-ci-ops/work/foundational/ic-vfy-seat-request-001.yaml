id: "ic:vfy-seat-request:001"
hypothesis_ref: "dh:vfy-seat-request:001"
referent_grain: >-
  A queued claim at the grain of one admission chain's waiting span: an agent run's request for
  shared verification capacity, from its enqueue to its admission, withdrawal or eviction;
  individuated by the act of enqueueing that opened it.
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    unresolved: two seat requests are the same iff they were opened by the same enqueue, and the
    chain nonce is evidence of that, never the criterion. Open is whether the request ends at
    admission and a new grant begins (two individuals) or one admission engagement persists and
    passes from waiting to held (one individual in two phases). No cited chain decides it.
  reidentification_key:
    - nonce of the admission chain (evidence)
    - enqueuedAtMillis (evidence; also repeated on the same chain's admitted row, so-95b7d78a061f)
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: >-
    One enqueue-opened waiting span, bounded by one end event.
  dependence: unresolved
ufo_analysis:
  candidate_category: unresolved
  alternatives:
    - >-
      relator: a claim mediating the submitter that placed it and a second relatum, founded by the
      enqueue and ended by admission, withdrawal or ticket eviction (rigid); the second relatum
      (the capacity a request waits on) is named by no cited record, so this reading is unshown
      on that leg
    - >-
      phase of one admission engagement (anti-rigid): the waiting phase of an individual that
      continues as the held grant under the same nonce
    - the ticket file or journal rows (information object; rejected as the referent)
  existential_dependencies:
    - >-
      the submitter that placed it: so-29a5ac8607a2 ends a queued request under
      _tag=admission-ticket-evicted with reason=queued-submitter-death. No capacity pool or queue
      is listed: no cited record states the capacity a request waits on, and such a record is the
      needed evidence.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states:
    - admitted (the chain continues as a held grant)
    - withdrawn
    - evicted while queued (reason queued-submitter-death)
counterexamples:
  - description: >-
      Admission boundary: on so-95b7d78a061f one chain carries enqueue, admit and release under one
      nonce, and its admitted row repeats the enqueue instant. Read as one
      engagement, the request survives admission as the grant; read as two relators, it ends there.
      Every cited chain fits both readings.
  - description: >-
      Resubmission: successive withdrawn chains from one checkout and branch (so-8528aeede357 and
      so-40e26d2f0672) are separate chains with separate nonces and attemptIds. If an agent's
      resubmission after a withdrawal were the same demand, the enqueue criterion would wrongly count
      two requests; the records give no member that links them.
status: proposed
evidence_refs:
  - "so:sha256:29a5ac8607a2204f5c7518e009834a017dbc947407f1c9430c0b87119c33d677"
  - "so:sha256:860cff0d673e93aaa9ec8db4d85fe43cfdd89d22b92e5ba29966346fee8a35a1"
  - "so:sha256:95b7d78a061f4eadeca7bc45379f83a3696c58770863df88b0a13e5435ede7a1"
  - "so:sha256:8fcf58cfd24c1c0a784f4b68f0eae180755b356dd9bfbde9c360624864e2ec20"
  - "so:sha256:0d75ae7174ed0d50eaeb7d137e7aa98090fa268adb4bf725eab6d41aab946382"
  - "so:sha256:8528aeede357e4f01207fa81b86236e75172b001db41d098a0268ec09a1a84c1"
  - "so:sha256:40e26d2f06727f6b3e5744a8fe251564521f144cbfab9eefc21417ec3b8cfe5c"
  - CQ-021
  - CQ-023
rationale:
  identity: >-
    The request exists over time apart from any grant: withdrawn chains never admitted
    (so-0d75ae7174ed), and a queued request ended by its submitter's death (so-29a5ac8607a2) through
    an end of its own, distinct from the lease eviction of a held grant (so-860cff0d673e).
  rigidity: >-
    Rigid under the two-relator reading and anti-rigid under the engagement reading. The deciding
    record is missing.
  dependence: >-
    Unresolved. The enqueue rows carry the requested kind, priority, weightTokens, enqueuedAtMillis,
    an attemptId, a branch and a checkout root, plus capture-surrogate owner references that are
    never a join (so-0d75ae7174ed, so-29a5ac8607a2). None of them names a capacity pool, queue or
    other party the request stands toward, so relational dependence in the relator sense (one
    individual mediating two or more) cannot be argued from them. What is shown is existential
    dependence on one external individual, the submitter: a queued request is ended when its
    submitter dies (so-29a5ac8607a2, reason=queued-submitter-death). A record stating the capacity
    a request waits on, or a second party it is founded on, would decide relational dependence.
  category: >-
    Relator or phase of a relator. Deferred: picking either would assign rigidity without evidence.
  temporality: >-
    It persists through a waiting interval and has three observed kinds of end. Whether its members
    can change while it waits (repricing) is not shown.
