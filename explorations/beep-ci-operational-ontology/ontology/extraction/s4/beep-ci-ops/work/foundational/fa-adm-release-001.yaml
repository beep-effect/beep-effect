id: fa:adm-release:001
hypothesis_ref: dh:adm-release:001
identity_card_ref: ic:adm-release:001
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
- label: A journal information object asserting release. An observed lease relinquishment paired with
    the corresponding holder-accounting transition would corroborate the occurrence reading.
  still_viable: true
- label: A grant's terminal boundary labeled released, without separately reifying the release act. Evidence
    requiring release-specific participants or effects beyond the grant endpoint would discriminate this
    domain alternative.
  still_viable: true
strongest_counterexample: A release report with a memory peak can be emitted after failed or canceled
  work, and can be replayed after its grant has already ended. Reading that record as a successful verification,
  another release, or a timeless resource census would confuse measurement, assertion, occurrence, and
  present state.
verdict: analyzed
test_rationales:
  spec_vs_execution: A release routine or authorization policy can be used repeatedly. The referent is
    one relinquishment occurrence, distinct from that repeatable procedure, its grant, and the authorized
    work execution.
  world_vs_information: The release journal assertion describes a holding endpoint. Appending, copying,
    correcting, or removing the assertion does not itself release the authorization; independent relinquishment
    and holder-accounting observations are absent.
  role_vs_bearer: The holder or beneficiary is a participant; the grant is the authorization being relinquished.
    Neither becomes the release occurrence when its holding ends.
  context_reification_needed: Release must remain attached to the particular acquired grant and its time-indexed
    capacity and origin context. CQ-008 and CQ-009 need an independently complete active-grant observation
    at their evaluation instant; historical endpoints alone are insufficient.
category_rationale: Event is a conditional classification of the proposed seat grant release occurrence,
  because its grain is one occurrence of a transition. It is not selected from the spelling of a tag.
  The cited evidence directly establishes recorded assertion content; the linked card states the proposed
  occurrence criterion, rigid event classification, participant dependence, and unresolved duration. A
  coherent conditional event shape is available, so analysis can finish while the information-only and
  boundary-only rivals remain viable. Neither rival is resolved by this seat.
evidence_refs:
- so:sha256:0415a4f1590540c534d5ccc9027d36acddbfa4ffdd84445bda5155dac85ac5c6
- so:sha256:d90be1aaa963b3e017130d2add821e59f623ac0540f9563cd9dd1d607cae8ce9
- CQ-008
- CQ-009
evidence_reading: Both cited histories positively pair admission with release. The first includes releasedAtMillis=1788927008574
  and memoryPeakBytes=9904820224; that reported measurement is associated context, not release identity,
  charge, a hard limit, or success evidence. These histories supply local reported endpoints, not a complete
  current holder census.
