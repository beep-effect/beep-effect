id: ic:sched-core:017
hypothesis_ref: dh:sched-core:018
identity:
  supplies_identity: false
  identity_criterion: 'This data property supplies no identity: one observedQueueWaitMs assertion concerns the same operational
    fact only for the same queued SeatRequest, the same enqueue boundary, and the same observation boundary; equal durations
    computed by different collectors do not create distinct quality tokens.'
  reidentification_key:
  - SeatRequest reference
  - enqueue boundary
  - observation boundary and clock basis
ontoclean:
  rigidity: unresolved
  carries_identity: false
  supplies_identity: false
  unity: One assertion relating one queued request at one observation boundary to its elapsed milliseconds since enqueue.
  dependence: relational
ufo_analysis:
  candidate_category: none
  alternatives:
  - a reified queue-wait quality
  - a transient logging value
  existential_dependencies:
  - a queued SeatRequest
  - its enqueue boundary and a later observation boundary
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
  - a later observation produces a new assertion, and the series ends when the request leaves the queue
counterexamples:
- description: Collector A and collector B can compute the same duration for the same request and boundaries; the two records
    are evidence for one assertion, while equal durations at different boundaries are different facts.
status: proposed
