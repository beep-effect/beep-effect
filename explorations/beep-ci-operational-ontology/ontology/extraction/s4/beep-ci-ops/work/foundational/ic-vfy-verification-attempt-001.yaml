id: "ic:vfy-verification-attempt:001"
hypothesis_ref: "dh:vfy-verification-attempt:001"
referent_grain: >-
  A dated occurrence: one started run of the verification pipeline, from its attempt-started event to
  its verdict or termination, as the attempt journal records it; individuated by its start, not by
  the run file it is grouped in or the request it may submit.
identity:
  supplies_identity: true
  identity_criterion: >-
    Two verification attempts are the same iff they are the same started run of the pipeline: one
    start event, with the verdict or termination that closes it. The attempt uuid is evidence of
    that run, never the criterion, and in the cited records it joins only within one record class:
    an attempt-journal start row and its verdict row share one (so-6390d5f857ae, so-ca8b3f90e57c),
    proof-ledger records share one with each other, and admission records share one with each
    other, but no cited ledger or admission attemptId equals any cited attempt-journal attemptId.
    Whether the ledger and admission records name the same attempts as the journal is therefore not
    shown; a ledger fact or admission chain whose attemptId equals an attempt-journal start row's is
    the needed evidence. Several attempts in one run file are distinct attempts; in the cited
    records two attempts of one run start at different stages.
  reidentification_key:
    - >-
      attemptId (evidence; joins an attempt-journal start row to its verdict row in the cited
      records, and no cited id joins the journal to a ledger or admission record)
    - startedAt on the attempt-started row (evidence)
ontoclean:
  rigidity: unresolved
  carries_identity: true
  supplies_identity: true
  unity: >-
    One start-to-verdict span on the attempt journal. Lane executions are its parts only if the
    ledger records that carry them name the same attempt; the cited ledger lane records share an
    attemptId with each other (so-40abdcaf1156, so-c997b4851faa) but with no cited journal row, so
    that parthood is unshown.
  dependence: relational
ufo_analysis:
  candidate_category: event
  alternatives:
    - process (while running, for CQ-022's in-flight queries)
    - the journal, ledger and admission rows about an attempt (information object; rejected)
    - >-
      an alias of the seat request (attemptId as a second identifier of one admission chain; kept
      open)
    - a grouping label over lane runs (rejected)
  existential_dependencies:
    - the checkout and tree state it runs against
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states:
    - >-
      finished with a verdict (outcome=failure on so-ca8b3f90e57c; the spelling of a passing
      outcome on an attempt verdict is not shown by a cited record)
    - terminated with a reason (for example legacy-unowned-start), counted red
counterexamples:
  - description: >-
      Request alias: each cited admission chain that carries an attemptId carries a different one,
      and successive withdrawn chains from one checkout carry fresh ones, but no cited record joins
      one attemptId across the attempt journal and the admission journal, so whether attempts and
      requests are one to one, or one individual under two names, is not shown. The quarantined lease
      so-a8d270b5e19d carries a startedAt equal to its admittedAtMillis, after its enqueue instant;
      reading that member as the attempt's start rests on its field name alone, so it does not
      separate the two. An attempt-started row sharing its attemptId with an admission chain, or two
      chains under one attemptId, would.
  - description: >-
      Retention: the KPI law (po-fd56d2b008d1) evicts whole oldest terminal attempts per run-id file
      and records the eviction. An attempt no longer in the journal still occurred, so a criterion
      tied to journal presence would make the eviction end the attempt.
status: proposed
