rationale:
  identity: >-
    so-6390d5f857ae starts at 16:59:45.919Z and the verdict so-ca8b3f90e57c ends at 17:01:07.524Z
    with elapsedMs 81605, the exact span between them, so the attempt has its own start and end.
    Two attempts of one runId start at different stages (so-eefbf95beb8d, so-10c2570fe2f6), so the
    run file groups attempts and does not individuate them.
  rigidity: >-
    Unresolved. If the attempt is an occurrence of its own, nothing that is an attempt could persist
    while ceasing to be one. Under the seat-request alias rival, the individual stamped with an
    attemptId would be one admission chain, an attempt only from its start onward, which would make
    being an attempt a phase of that chain. The cited records do not separate the two readings; the
    alias discriminator (an attempt-started row and an admission chain under one attemptId, or two
    chains under one attemptId) would.
  dependence: >-
    Marked relational: it exists only as a run over a given checkout and tree. What the records show
    of its tie to a run is membership: its start row sits in one run's attempt-journal file, which
    may hold several attempts (so-eefbf95beb8d, so-10c2570fe2f6); no cited record names an agent run
    that starts it.
  category: >-
    UFO event: one start and one verdict joined by attemptId on the attempt journal, with elapsedMs
    equal to the span between them. Two ledger lane records (so-40abdcaf1156, so-c997b4851faa) share
    one attemptId and carry separate verdicts, which fits lane executions as parts of an attempt, but
    no cited id joins those ledger records to a journal start, so parthood is not part of the ruling.
  temporality: >-
    It unfolds from start to a verdict or termination. Whether it changes state without losing
    identity is unresolved: no cited record shows an attempt while running, between its start and
    its verdict, and such a record (as CQ-022's in-flight queries need) is the evidence.
