id: fa:ov-seat-request:001
hypothesis_ref: dh:ov-seat-request:001
identity_card_ref: ic:ov-seat-request:001
referent_grain: Candidate particular request for scheduler admission, separate from its projection-local
  description, the act of submitting it, a reusable work specification, and a later grant.
tests:
  spec_vs_execution: separated
  world_vs_information: unresolved
  role_vs_bearer: unresolved
  context_reification_needed: true
analysis:
  identity_and_category: The described pending-to-admission comparison supports an operational request
    candidate beyond a type name, but it does not give a particular request's lifecycle. The batch cannot
    select between a demand, its submission event, and its informational representation.
  rigidity: The request may remain a request after it ceases to be queued, or the hypothesized class may
    concern only an outstanding demand. Pending could be a contextual role or state of an underlying request;
    no continuity trace decides.
  dependence_and_temporality: The inequality enqueuedAtMillis <= t < admittedAtMillis bounds reconstructed
    pending membership. It does not establish the full existence interval of a request, distinguish rerequest
    from persistence, or give a request-to-grant identity relation.
  spec_vs_execution: A request asks for admission. It is not a reusable WorkUnit specification, a WorkUnit
    execution, or a grant; the quoted journal limitation explicitly withholds work-unit-specification
    identity.
  world_vs_information: Typed fixture request subjects and emitted nonce literals are representations.
    They do not prove that those example requests existed in the live scheduler or provide lifecycle identity
    for actual demands.
  role_vs_bearer: The requester role and its actor are distinct from the request object. Whether PendingRequest
    itself denotes a temporary role/state of a persisting demand or the complete demand remains unresolved.
  context_reification: Keep request-handling context and any actual requester/authority relation explicit.
    A shared origin key, nonce carrier, or captured owner label cannot substitute for a continuity observation.
  evidence_limit: CQ-020 asks for scheduled requests and CQ-021 for queued requests with owners. Their
    questions do not supply missing observation of ownership, initiation, admission, cancellation, or
    re-enqueue.
rival_models:
- label: Operational demand or relator that persists through pending handling and has a distinct establishing
    act
  still_viable: true
- label: Projection-local information object describing a request without established cross-projection
    identity
  still_viable: true
- label: Submission occurrence, with pending status belonging to a distinct resulting demand or record
  still_viable: true
- label: Reusable WorkUnit specification or an issued grant merely under another name
  still_viable: false
strongest_counterexample: 'Hypothetical counterexample: the same pending request appears in two projections
  at different local indexes, while two separate requests for identical work use the same illustrative
  field values. Identity by projection subject splits the first; identity by matching nonce or work description
  can merge the second without a uniqueness-and-continuity observation. A later grant with copied values
  would not by itself be the request.'
verdict: explicitly_deferred
needed_evidence: Observe a single request from enqueue through at least two independently identified snapshots
  or projections to admission or cancellation, with its requester and handling context. Include a second
  enqueue for the same work and an explicit observation distinguishing a new request from continued handling
  of the first. This must establish continuity independently of matching nonce strings and distinguish
  any grant from the request.
