rationale:
  identity: >-
    The deployed literal list (po-581b06759057) spells four values. Whether a stage is a position in
    an order, so that a renamed literal would be the same stage, needs a record fixing that order.
  rigidity: >-
    Unresolved because it depends on the bearer: over the cited attempts each start row carries one
    stage and the stage differed between two attempts of one run; over runs, the cited ledger facts
    of one run sit at pre-push and then at repair-loop. Neither the run nor the episode has a
    surviving analysis in this batch.
  dependence: >-
    Under the phase reading the condition is intrinsic to the run's progress; under the plan-step
    reading the stage depends on the workflow specification. The test cannot run until the reading
    is chosen.
  category: >-
    Three readings fit every cited record. Picking subkind or phase would assign a meta-property the
    bearer question has not settled.
  temporality: >-
    Depends on the reading: a plan step persists unchanged, while a phase holds over an interval of
    its bearer.
