id: "ic:vfy-proof-stage:001"
hypothesis_ref: "dh:vfy-proof-stage:001"
referent_grain: >-
  A classifier at workflow grain: one of the four deployed stage values (repair-loop, pre-push,
  merged-preview, hosted) under which a verification attempt runs and its evidence is produced;
  what individuates a stage beyond its spelling (a position in a stage order or not) is unresolved.
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    unresolved: a stage could be individuated by its position in an ordered verification workflow,
    so that a renamed literal would be the same stage, but no cited record establishes a stage
    order. The deployed list (po-581b06759057) is an array, not a stated order, and the cited
    ledger facts of one run sit at pre-push and later at repair-loop, against the array order. A
    record fixing the stage order (a deployed transition rule, or a workflow specification that
    orders the stages) is the needed evidence. Whether the class supplies identity is unresolved
    with it: under the plan-step reading the stage class would supply the identity of its steps (a
    step is the same step by its position in the order), while under the categorizer and phase
    readings an attempt or run at a stage keeps its own identity and the stage supplies none. The
    stage-order record decides that too.
  reidentification_key:
    - stage (the literal on attempt-started rows, leases and ledger records; evidence)
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: ""
  dependence: unresolved
ufo_analysis:
  candidate_category: unresolved
  alternatives:
    - >-
      categorizer over verification attempts, members as rigid subkinds (an attempt started at
      pre-push stays a pre-push attempt; a stage change is a new attempt)
    - >-
      phase of a longer-lived run or episode (anti-rigid: one run's records sit at more than one
      stage)
    - >-
      step of the verification workflow specification (a plan part, an information object), with
      attempts as executions at that step
    - >-
      assurance tier under another name (not the deployed proofTier; whether a stage is an
      AssuranceTierId tier is open until a proofTier-to-AssuranceTierId mapping is evidenced)
  existential_dependencies:
    - >-
      on the plan-step reading only: the verification workflow specification it is a step of. The
      subkind and phase readings claim no workflow dependence (a phase depends on its run or
      episode, a subkind of attempt on nothing beyond its instances). The deciding evidence is a
      stage-order record (a deployed transition rule or a workflow specification that orders the
      stages); no cited record fixes that order, so this entry holds only if that reading wins.
temporality:
  exists_during_interval: unresolved
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
  - description: >-
      Bearer-relative rigidity: the attempt-started rows so-eefbf95beb8d (repair-loop) and
      so-10c2570fe2f6 (pre-push) share one runId and are two attempts, so for these cited attempts
      the stage is fixed per attempt and the stage changed with a new attempt; that is shown only for
      them. The ledger facts so-12d5a26fbfac (pre-push, 2026-09-23) and so-40abdcaf1156
      (repair-loop, 2026-09-24) share a different runId and two attemptIds, so relative to that run
      the stage changed once. No cited record shows a run returning to an earlier stage. Rigid for
      one bearer and anti-rigid for the other: no single meta-property assignment fits until the
      bearer is fixed.
  - description: >-
      Tier alias: proofTier=full occurs at repair-loop (so-eefbf95beb8d), pre-push (so-10c2570fe2f6)
      and merged-preview (so-3bf9cacb55b4), and the ledger tier member is full at both repair-loop
      and pre-push. Stage and the deployed proofTier vary apart, so a stage is not the deployed
      proofTier under another name; whether proofTier is the assurance tier is not shown here.
status: proposed
