id: ic:ov-seat-request:001
hypothesis_ref: dh:ov-seat-request:001
referent_grain: Candidate particular request for scheduler admission, separate from its projection-local
  description, the act of submitting it, a reusable work specification, and a later grant.
identity:
  supplies_identity: unresolved
  identity_criterion: 'unresolved: a particular admission demand would need continuity through its initiation
    and handling, distinguishing rerepresentation of one demand from a new demand for the same work. A
    projection-local request description instead has contextual information-content identity. The emitted
    subject, nonce carrier, and described pending interval do not establish that continuity or decide
    whether request existence ends with pending membership.'
  reidentification_key:
  - proposal-local request subject, for lookup of the representation only
  - scheduledUnitRef carrying request.nonce, with no demonstrated global uniqueness or cross-projection
    sameness contract
  - enqueuedAtMillis and admittedAtMillis as described pending-membership evidence, not an identity criterion
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: The candidate demand concerns a particular admission request, but the supplied projection view
    does not show its establishing act, requester relation, continued handling, or termination. A coherent
    request description is observed; unity of an enduring operational demand is unresolved.
  dependence: unresolved
ufo_analysis:
  candidate_category: unresolved
  alternatives:
  - 'information_object: a projection-local description of a request'
  - 'mode or relator: an outstanding demand relating a requester to admission handling'
  - 'event: the act of submitting an admission request, distinguished from its pending aftermath'
  existential_dependencies:
  - A demand or relator interpretation would depend on a requester and an admission authority or handling
    process.
  - A projection-local information description instead depends on represented input content. This batch
    does not observe the participant bindings needed to select the operational model.
temporality:
  exists_during_interval: unresolved
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
- description: 'Hypothetical counterexample: the same pending request appears in two projections at different
    local indexes, while two separate requests for identical work use the same illustrative field values.
    Identity by projection subject splits the first; identity by matching nonce or work description can
    merge the second without a uniqueness-and-continuity observation. A later grant with copied values
    would not by itself be the request.'
