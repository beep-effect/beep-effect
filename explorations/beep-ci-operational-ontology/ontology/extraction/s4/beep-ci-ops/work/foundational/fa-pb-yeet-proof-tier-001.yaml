tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: true
rival_models:
  - label: "A selected tier is an anti-rigid role or mode borne by a proof-plan specification under one planner policy."
    still_viable: true
  - label: "Each tier denotes a rigid subkind of WorkUnit specification rather than a member of a classification scheme."
    still_viable: true
  - label: "Yeet proof tiers are the ontology's AssuranceTiers because both use the word tier."
    still_viable: false
