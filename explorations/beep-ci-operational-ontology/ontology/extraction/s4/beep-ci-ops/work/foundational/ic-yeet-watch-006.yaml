id: "ic:yeet-watch:006"
hypothesis_ref: "dh:yeet-watch:027"
identity:
  supplies_identity: false
  identity_criterion: >-
    Membership check against the Yeet monitor failure-signature specification
    domain in ic:yeet-watch:005: two occurrences represent the same ci-timeout
    specification only when they preserve the same normalized failing-step-log
    scope, disjunctive timeout-pattern set, failure-family interpretation,
    classifier priority, applicability context, and version lineage. Distinct
    timeout failures may satisfy that same prescription, and the ci-timeout
    spelling is evidence rather than the criterion.
  reidentification_key:
    - "failing-step-log normalization and completeness scope"
    - "allowed timeout regular-expression set"
    - "timeout-family interpretation and classifier priority"
    - "applicability context and specification version lineage"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: >-
    One disjunctive recognition prescription groups the configured timeout text
    patterns under one policy meaning; the logs, timeout occurrences, hosted
    jobs, detector calls, and rerun attempts remain separate individuals.
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "subkind: timeout failure occurrences whose normalized logs match an allowed pattern"
    - "role: a timeout diagnostic pattern currently authorized for one bounded rerun"
    - "event: one hosted-job timeout occurrence"
    - "process: one execution of the timeout detector or rerun procedure"
    - "none: the ci-timeout token as only a lexical selector"
  existential_dependencies:
    - "At least one faithful bearer of the timeout-recognition prescription, generically rather than this token"
    - "The normalized failing-step-log vocabulary and classifier context in which its patterns are interpreted"
    - "A Yeet policy revision for its current rerun-authorized role, but no particular matching timeout or rerun"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - "superseded while retained as a historical specification"
    - "withdrawn from the current rerun policy"
    - "ceased when no faithful bearer of the specification remains"
counterexamples:
  - description: >-
      A deterministic deadlock or consistently under-budgeted test can emit
      the same configured timeout text as transient runner slowness, so a match
      does not identify an environment-only timeout cause or flaky occurrence.
  - description: >-
      Separate hosted jobs matching different timeout regular expressions still
      receive the same ci-timeout member while remaining distinct failures.
status: proposed
