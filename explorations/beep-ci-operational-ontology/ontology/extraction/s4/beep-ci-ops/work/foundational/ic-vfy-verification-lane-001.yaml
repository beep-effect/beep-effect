rationale:
  identity: >-
    Seven clone ledgers carry laneId fallow:audit with one identical command digest and different
    heads, inputs and durations, so the lane recurs across executions. fallow:health
    (so-12d5a26fbfac) and quality:docgen (so-40abdcaf1156) carry different digests from it. Name and
    content never come apart in the cited records.
  rigidity: >-
    Unresolved. An individual could lose this classification while persisting if a procedure were
    removed from the lane set yet kept as a command, or run outside any lane. The cited ledgers show
    each lane only through executions recorded under its laneId and never show the procedure before
    or after its membership, so they neither show nor rule out such a loss. A record of the deployed
    lane set over time (a lane retired while its command remains) would be the evidence.
  dependence: >-
    Unresolved. No external bearer is needed for it to be a lane, but whether it depends on a
    defining configuration (the deployed lane set) is not shown by any cited record; such a record is
    the needed evidence. No existential dependency is listed for that reason.
  category: >-
    Unresolved between UFO information object (a specification of a procedure that executions
    realize) and process type; the identity criterion is open too, so the category is not ruled. laneClass
    cli-runnable is the only value seen, so it is a field, not a lane-kind taxonomy (CQ-001's kinds
    need the full value domain).
  temporality: >-
    Whether it exists during an interval differs by reading. As an information object (a lane
    specification) it comes into being when defined and can be retired, so it exists over an
    interval; as a process type (the universal its executions instantiate) it is not bounded by an
    interval of its own. The category is unresolved, so the field is too; a deployed lane definition
    with a creation or retirement record would bear on it. Whether it can be revised and remain the
    same lane is the open identity question.
