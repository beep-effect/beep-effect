id: "ic:vfy-verification-lane:001"
hypothesis_ref: "dh:vfy-verification-lane:001"
referent_grain: >-
  A repeatable verification procedure at specification grain: one lane (fallow:audit,
  quality:coverage and the rest) that many executions run against many trees, individuated by the
  procedure, not by any run of it.
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    unresolved: two lanes are the same iff they are the same procedure, but whether a procedure is
    individuated by its name lineage (one lane whose command is revised over time) or by its command
    content (a revised command is a new lane) is not decided. No cited record shows one laneId with
    two command digests or two laneIds with one.
  reidentification_key:
    - laneId (evidence of the name lineage)
    - commandDigest (evidence of the command content)
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: >-
    One command under one lane name.
  dependence: unresolved
ufo_analysis:
  candidate_category: unresolved
  alternatives:
    - information object (a specification of a procedure that executions realize)
    - process type (the universal its executions instantiate)
    - a label grouping ledger rows (rejected)
  existential_dependencies: []
temporality:
  exists_during_interval: unresolved
  may_change_state_without_losing_identity: unresolved
  terminal_states:
    - retired from the lane set (not shown; an end only on the information-object reading)
counterexamples:
  - description: >-
      Revision: if fallow:audit's command were changed, the name criterion keeps one lane with a new
      version and the content criterion makes a new lane. CQ-006 obligations and CQ-017 asymmetries
      attach to lanes, so the choice decides whether old facts still discharge an obligation.
  - description: >-
      Shared command: two lane names bound to one command digest would be two lanes under the name
      criterion and one under the content criterion.
status: proposed
evidence_refs:
  - "so:sha256:1872cd0bda84cfd3d686e24baa1b4721cd7a76c20dd32889663221ce0f24620b"
  - "so:sha256:6c4e9189d15e0513d4e46e273bd79015b07165645bc00cb0bb962d63d467c918"
