id: "fa:vfy-seat-request:001"
hypothesis_ref: "dh:vfy-seat-request:001"
identity_card_ref: "ic:vfy-seat-request:001"
referent_grain: >-
  A queued claim at the grain of one admission chain's waiting span: an agent run's request for
  shared verification capacity, from its enqueue to its admission, withdrawal or eviction;
  individuated by the act of enqueueing that opened it.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: separated
  context_reification_needed: false
rival_models:
  - label: seat request as a rigid relator ending at admission (two-relator split)
    still_viable: true
  - label: waiting phase of one admission engagement that continues as the grant
    still_viable: true
  - label: ticket file or journal rows as the referent
    still_viable: false
  - label: the verification attempt under another name
    still_viable: true
  - label: >-
      one demand that persists across a withdrawal and a later resubmission (two chains, one
      request)
    still_viable: true
strongest_counterexample: >-
  A chain carrying enqueue, admit and release under one nonce, with the enqueue instant repeated on
  the admitted row (so-95b7d78a061f), fits one engagement passing through two phases as well as two
  successive relators, so the category hinges on a record no cited chain supplies.
verdict: explicitly_deferred
needed_evidence: >-
  An admission chain that separates the readings: a grant evicted or released and then re-queued or
  re-admitted under the same nonce (favours one engagement with phases), one request admitted into
  two grants or a lease whose nonce differs from its ticket's (favours two relators), or an admitted
  row whose charge, owner or checkout differs from the same chain's enqueue row. For the attempt
  rival: an attempt-journal end row joined to an admission chain by attemptId, showing whether the
  attempt ends where the request ends. For demand continuity: a record linking two chains, such as a
  shared demand id or a resubmission marker on a chain that follows a withdrawal. For relational
  dependence (the card leaves it unresolved): a record stating the capacity a request waits on (a
  pool, queue or capacity snapshot named on or joined to the enqueue row), which no cited record
  carries.
evidence_refs:
  - "so:sha256:95b7d78a061f4eadeca7bc45379f83a3696c58770863df88b0a13e5435ede7a1"
  - "so:sha256:0d75ae7174ed0d50eaeb7d137e7aa98090fa268adb4bf725eab6d41aab946382"
  - "so:sha256:29a5ac8607a2204f5c7518e009834a017dbc947407f1c9430c0b87119c33d677"
  - "so:sha256:860cff0d673e93aaa9ec8db4d85fe43cfdd89d22b92e5ba29966346fee8a35a1"
  - "so:sha256:8528aeede357e4f01207fa81b86236e75172b001db41d098a0268ec09a1a84c1"
  - "so:sha256:40e26d2f06727f6b3e5744a8fe251564521f144cbfab9eefc21417ec3b8cfe5c"
  - CQ-021
  - CQ-023
rationale:
  spec_vs_execution: >-
    Separated on what the records show: each request chain is a dated occurrence with its own
    enqueuedAtMillis and its own nonce, so the successive withdrawn chains from one checkout and
    branch (so-8528aeede357, so-40e26d2f0672) are two occurrences, not one repeatable description.
    That the requests fall under an admission policy (kinds, priorities, charges) is a
    presupposition; no cited record carries such a policy.
  world_vs_information: >-
    The journal rows record the request. The request is what waits and what CQ-023 bounds.
  role_vs_bearer: >-
    The submitter (the owner CQ-021 asks for; so-29a5ac8607a2 ends a queued request on its death)
    bears the requester role. The request is the claim that submitter placed, not that bearer;
    whether the claim is a relator is open with its dependence.
  context_reification_needed: >-
    The members the enqueue rows carry (kind, priority, charge, enqueue instant) hold of the request
    with no context parameter. No cited record names a queue or capacity pool, either as a
    participant or as a context.
  rivals: >-
    The attempt rival stays viable: the cited chains carry an attemptId, but no cited record shows
    how or when an attempt ends, so whether a request and an attempt coincide in extent cannot be
    tested here; an attempt-journal end row joined by attemptId is the discriminating evidence. The
    demand-continuity rival, which the card's resubmission counterexample raises, stays viable:
    successive withdrawn chains from one checkout and branch (so-8528aeede357, so-40e26d2f0672)
    carry separate nonces and attemptIds and no member that links them, which fits two demands and
    one resubmitted demand alike. The record rival confuses rows with the claim. The two-relator and
    engagement readings remain.
