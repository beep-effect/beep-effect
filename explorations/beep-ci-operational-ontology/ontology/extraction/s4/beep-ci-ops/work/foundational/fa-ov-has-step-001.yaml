id: "fa:ov-has-step:001"
hypothesis_ref: "dh:ov-has-step:001"
identity_card_ref: "ic:ov-has-step:001"
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: not_applicable
  context_reification_needed: true
rival_models:
  - label: >-
      hasStep is generic information-content parthood, while stepIndex and the
      ScheduleStep bearer independently carry all ordering semantics.
    still_viable: true
  - label: >-
      hasStep denotes proposal-relative ordered sequence membership and is not
      reducible to generic component parthood.
    still_viable: true
  - label: >-
      The proposal relates directly to represented admission-act occurrences,
      with ScheduleStep serving only as their RDF carrier.
    still_viable: true
  - label: >-
      The emitted RDF edge itself constitutes the relation independently of
      schedule content.
    still_viable: false
strongest_counterexample: >-
  A projected proposal can disagree with deployed grant order, and an
  identical serialized step can occur in two proposal outputs; consequently
  proposal membership, represented admission, actual occurrence, and RDF-edge
  token cannot share one identity.
verdict: analyzed
