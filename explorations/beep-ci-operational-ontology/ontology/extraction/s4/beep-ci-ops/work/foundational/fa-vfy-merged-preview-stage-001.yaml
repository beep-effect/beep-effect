strongest_counterexample: >-
  so-3bf9cacb55b4 is a merged-preview-stage attempt whose start row carries proofTier=full, the
  value the lease so-a8d270b5e19d also carries at pre-push. The record carries proofTier full and
  nothing more: no cited record maps proofTier values onto AssuranceTierId levels, so it neither
  places the attempt inside an existing tier nor excludes a fourth tier.
verdict: explicitly_deferred
needed_evidence: >-
  Three things. First, the proof-stage class's category (see the proof-stage pair's needed evidence:
  an attempt changing stage under one attemptId, or an analyzed run or episode). Second, a record
  fixing the stage order, without which the stage's position cannot individuate it. Third, for the
  Queue H tier question, a record that ties a merged-preview-stage attempt or episode to one of the
  three AssuranceTierId levels as its target (favours a stage inside that tier), or a lane obligation
  required at a merged-preview level and not for TierLocalFullProof (favours a fourth tier). The
  stage is dormant in the capture window, so the first merged-preview start or fact recorded after
  the cut is the observation to wait for.
