id: ic:ov-projection-specification:001
hypothesis_ref: dh:ov-projection-specification:001
referent_grain: Governing-description information object whose exact grain is unresolved between a repeatable
  projection rule specification and an input-bound application-context record.
identity:
  supplies_identity: unresolved
  identity_criterion: 'unresolved: a repeatable specification would be individuated by its governing rule
    content and intended version, remaining the same across distinct journal inputs. An application-context
    record would additionally be individuated by which rule application and input state it describes.
    The typed target and policy/journal digest carriers do not decide between these criteria; digest equality
    or change is not by itself an identity criterion.'
  reidentification_key:
  - typed specification subject in the emitted representation, for lookup only
  - policyDigest and journalPrefixDigest as input-binding evidence, never a standalone sameness rule
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: Either a coherent repeatable set of projection constraints or a coherent record of a particular
    rule-and-input binding. Both unite descriptive content, but they group applications differently.
  dependence: unresolved
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - repeatable governing specification shared by multiple projection inputs
  - input-bound description of one projection application context
  existential_dependencies:
  - A repeatable specification requires a meaningful body of governing rules, not a particular journal
    execution.
  - An application-context record semantically depends on the represented rule/policy and journal-input
    binding. The evidence does not settle whether that input is constitutive or merely described provenance.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
- description: 'Hypothetical counterexample: the same ordering and admissibility rules are applied to
    two different journal prefixes. If the specification changes identity solely because journalPrefixDigest
    changes, input provenance is promoted into rule identity. Conversely, merging all subjects with the
    same policy digest can collapse application-context records for different inputs. Both interpretations
    fit the single illustrated target.'
