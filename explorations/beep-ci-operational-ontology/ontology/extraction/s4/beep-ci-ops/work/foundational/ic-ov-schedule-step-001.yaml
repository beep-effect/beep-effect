id: ic:ov-schedule-step:001
hypothesis_ref: dh:ov-schedule-step:001
referent_grain: Represented instruction component at a place in one fixed admission prescription; distinct
  from the same request in other plans, a raw ordinal, and an actual admission event.
identity:
  supplies_identity: false
  identity_criterion: 'Proposed at immutable-component grain: the same step is the same constitutive instruction
    in the same containing prescription content, occupying the same place in its prescribed order with
    the same request assignment and scope content. A corresponding instruction in a different prescription
    is a different contextual component even when it targets the same request. The source step subject
    and integer index only help locate it.'
  reidentification_key:
  - step subject within its containing proposal and the emitted stepIndex, for lookup only
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: One instruction combines an ordered place, a represented request assignment, and a scope annotation
    as a component of one prescription. It inherits contextual information identity from that containing
    schedule.
  dependence: relational
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - a position or tuple in the containing sequence without a separately individuated step object
  - a persistent plan component that can be edited or moved across plan revisions
  existential_dependencies:
  - The containing prescription content supplies the component context.
  - The instruction refers to a request representation and scope meaning; the request need not have been
    admitted or executed.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: 'Hypothetical counterexample: the same request is first in one proposal and second in a
    later proposal after priorities change. Identity by request alone merges two different contextual
    instructions; identity by the raw number zero merges first steps from unrelated proposals. Neither
    a type assertion nor a step-0 suffix establishes the same execution occurrence.'
