  carries_identity: true
  supplies_identity: true
  unity: "One repeatable prescriptive content unit whose projection, provenance, replay, failure, and exclusion clauses share one revision boundary."
  dependence: relational
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "a separately authoritative schedule-specific contract distinct from the pa and pc chains"
    - "one schedule-projection execution occurrence"
    - "one emitted schedule information artifact"
  existential_dependencies:
    - "an authoritative specification carrier and versioning context"
    - "the referenced ontology, journal, schema, and output vocabularies for interpretation"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: false
  terminal_states:
