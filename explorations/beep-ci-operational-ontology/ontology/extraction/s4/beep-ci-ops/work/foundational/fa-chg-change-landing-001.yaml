id: "fa:chg-change-landing:001"
hypothesis_ref: "dh:chg-change-landing:001"
identity_card_ref: "ic:chg-change-landing:001"
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: not_applicable
  context_reification_needed: false
rival_models:
- label: "for infrastructure changes titled 'applied' or 'live', the landing is the apply or go-live occurrence, distinct from the merge"
  still_viable: true
- label: "one change revised or superseded across rows (#1019 and #1022, and #870 and #929, as those rows state; #891 and #894, a link inferred from the two titles alone) is one landing event at a coarser grain"
  still_viable: true
- label: "the referent is the curated ledger row, an information object, rather than the occurrence it records; discriminated by a record of a row corrected while the landed change stays the same"
  still_viable: true
- label: "the referent is the change artifact, the pull request or merge commit, rather than its landing; discriminated by a record giving one change's merge time and its applied or live time separately"
  still_viable: true
- label: "a causal control intervention"
  still_viable: false
strongest_counterexample: "The #1141 row dates its change 'live 2026-09-15', a date with no zone, and records landedAt 2026-09-16T00:18:38Z beside a mergeCommit. If the go-live date is read in UTC or a zone ahead of it, either the landing is the go-live and the recorded instant dates a different, later occurrence, or the landing is the merge and the change was operative before it landed; if the date is read in a zone behind UTC, that instant still falls on 2026-09-15 there and the two may be one occurrence. The per-row criterion cannot say which occurrence it individuates."
verdict: analyzed
needed_evidence: "To settle the viable rivals: a source record giving, for one change titled 'applied' or 'live' (#1050, #1141, #1364 or #1422), its merge time and its apply or go-live time separately beside its landedAt, with the zone of the titled date (this also discriminates the change-artifact rival); a record stating whether an earlier row's alteration still holds after a superseding or retiring row lands (#1019 against #1022, #870 against #929), or naming the later row a revision of the earlier change; a record linking #894's invariant runtime root to #891's per-user runtime root as a revision of one change, a link no cited record states; a record of a ledger row corrected while the landed change stays the same (discriminates the ledger-row rival); and a per-checkout HEAD-ancestry census for one change showing its adoption instants varying across checkouts while its landedAt stays one."
referent_grain: "Recorded-occurrence grain: one dated landing of one change set on the verification mechanisms it alters, individuated by the change set it lands and the dated act of its landing; not the ledger row that records it, not the pull request or merge commit that carries it, and not the instant that dates it."
