rationale:
  spec_vs_execution: "By the contract's general split rule (if it can be rerun, split specification from execution), a pull request's content is a repeatable specification of new behaviour that could in principle be reverted or re-landed; no cited record shows a revert or a re-land. The landing is the dated act in which that change set lands. The row keeps them apart in two fields (pr and mergeCommit against landedAt), and the referent is the dated act."
  world_vs_information: "The discriminator rows date changes to the heavy CI pool, which the ledger does not hold, and KPI law section 2 partitions KPI series at the landing, so the hypothesis keeps the world occurrence apart from the row that records it. On the row-grain reading each row pairs one-to-one with one landing, so the records allow this separation without forcing it; the supersession and retirement rows (#1019 and #1022; #870 and #929) also bear on it, since if either pair records one landing, two rows record one landing and row and landing come apart, and the records do not say which. The ledger-row reading stays a viable rival, its discriminator in needed_evidence."
  role_vs_bearer: "Not applicable: no cited record shows a role and a bearer to separate. The only role-like reading is 'control intervention' in a causal sense. The KPI law section 2 record attaches the observational-versus-causal label to partition-point comparisons and makes an upgrade depend on a supporting study design over cohorts, so causal standing, when granted, qualifies a comparison made at the landing, not the landing; this is the placement the card's rigidity rationale gives. No record makes the landing the bearer of a role, and the hypothesis claims no causal status. The rows' self-applied causalStatus value is not used as evidence."
  context_reification_needed: "The landing's identity does not vary with context. Post-period membership does vary per checkout: the KPI law section 2 record puts a checkout in the post-period only when its HEAD ancestry includes the event's merge commit, so per-checkout adoption is a second instant, a relation between the landing and a checkout, not a context of the landing itself."
  rival_ledger_row: "Kept viable. The hypothesis grades it viable and names its discriminator, a record of a row corrected while the landed change stays the same; no cited record shows a correction, and absence in the capture is not evidence, so the discriminator is needed_evidence."
  rival_change_artifact: "Kept viable. The hypothesis grades it viable: every row, the 'applied' and 'live' rows included, carries a mergeCommit and a pr, so the records do not split artifact from landing. Its discriminator, a record giving one change's merge time and its applied or live time separately, is needed_evidence."
  verdict: "The card argues event from the discriminator rows and the KPI law section 2 record, and each test ran. Four rivals stay viable, each with its discriminator in needed_evidence: two event-grain readings (apply or go-live as the act; one change across several rows) and two information-object readings (the ledger row; the pull request or merge commit). The verdict is analyzed because the card states a category with its argument and names the evidence that would overturn it; synthesis must carry the viable rivals as further proposals or a steward-choice issue."
