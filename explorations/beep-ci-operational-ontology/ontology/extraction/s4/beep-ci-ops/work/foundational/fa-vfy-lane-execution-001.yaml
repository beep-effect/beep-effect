id: "fa:vfy-lane-execution:001"
hypothesis_ref: "dh:vfy-lane-execution:001"
identity_card_ref: "ic:vfy-lane-execution:001"
referent_grain: >-
  A dated occurrence: one invocation of one verification lane's procedure inside one attempt, ended
  by a verdict; individuated by that invocation, not by the lane it runs nor by any record of it.
tests:
  spec_vs_execution: separated
  world_vs_information: separated
  role_vs_bearer: not_applicable
  context_reification_needed: false
rival_models:
  - label: lane execution as an event within one attempt (the card's reading)
    still_viable: true
  - label: verdict lane entry or ledger fact/shadow record as the referent
    still_viable: false
  - label: >-
      the attempt as a whole, lanes as unindividuated parts
    still_viable: false
  - label: the reusable lane specification
    still_viable: false
  - label: >-
      lane execution as a process counted while running (CQ-022's RunningExecution), not only as a
      completed event
    still_viable: true
  - label: >-
      two referents: the journal verdict-lane step and the ledger lane run are different occurrences
    still_viable: false
strongest_counterexample: >-
  A lane rerun inside one attempt would give two invocations under one (attempt, lane) pair, so a
  schema keyed on that pair would merge a flaky first run with its rerun. CQ-025 calibration pairs
  and CQ-022 running-state queries would then attach to the wrong occurrence. No cited record shows
  a rerun.
verdict: analyzed
needed_evidence: >-
  For the criterion's edge: a record of two invocations of one lane in one attempt (a rerun) showing
  how each is recorded. For the single-referent reading beyond the one joined pair (so-5d4b45aa3226
  with so-2601c6b77d87, lane quality:coverage): a further verdict lane entry and ledger fact of one
  attempt and lane, from another lane or clone, showing whether they agree on duration and verdict;
  a pair that disagreed would revive the two-referent rival. For the process rival: a running-state record of a lane execution (an execution recorded before its
  verdict).
evidence_refs:
  - "so:sha256:ca8b3f90e57c22461d21f2b3bf2dad01149119aa674f540e81317a908f3f0610"
  - "so:sha256:2601c6b77d878a21a244475ffb55090c13359e0d89200a9b299de931d566c713"
  - "so:sha256:b1c417f143294008bf47a9b1d6e8030b874e0644de3d12599b1f585937e4462d"
  - "so:sha256:5d4b45aa3226c4c535dbfc1d052a7d78900d8244f6417a238f327d8f6f8b8c27"
  - "so:sha256:40abdcaf1156faffb566b4978ac5ce4c70027b44eaa305a6814650a8b2bc1de6"
  - "so:sha256:c997b4851faa9689c96b4a3a55babed6e042e265088ba38423725874a5570ac8"
  - CQ-022
  - CQ-025
rationale:
  spec_vs_execution: >-
    One lane id (fallow:audit) recurs across clone ledgers with one command digest and different
    durations, so the lane is the specification and each run is an execution.
  world_vs_information: >-
    A fact record and a shadow record agree on one execution's duration and verdict; the execution
    is what both record.
  role_vs_bearer: >-
    No role is in play.
  context_reification_needed: >-
    The attempt scopes the execution as a participant, not as a context.
  rivals: >-
    The attempt-as-whole rival fails because several lanes of one attempt carry separate verdicts
    (so-40abdcaf1156 passed and so-c997b4851faa failed under one attempt). The specification rival
    fails because the lane recurs while its executions do not. The process rival stays viable: the
    absence of a running-state record in the sample decides nothing, and such a record is its
    discriminator. The two-referent rival is no longer viable on the cited records, although the
    hypothesis says no cited pair joins the two record classes: the verdict record so-5d4b45aa3226
    and the ledger fact so-2601c6b77d87 carry one attemptId, one lane (quality:coverage), one
    durationMs (618708.236225), one inputDigest and a failed verdict on each (status failed,
    outcome failed), and the fact's recordedAt falls 720 ms after the journal entry's endedAt. Two
    different occurrences would have to agree on a duration to the microsecond; one run recorded by
    the journal and then by the ledger fits without coincidence, so the pair favours the
    single-referent reading. The join values sit in the verdict record's stanza excerpt, not in its
    observed_facts, and the pair covers one lane in one attempt; a joined pair that disagreed would
    revive the rival.
