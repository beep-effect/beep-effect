rationale:
  identity: "Every row names one change set (one pull request, one merge commit) and one landedAt; that each row pairs one-to-one with one dated landing is the row-grain reading only, since under the coarser-grain rival the supersession and retirement rows (#1019 and #1022; #870 and #929) record one landing in two rows, which would also separate row from landing and so bears on the ledger-row rival. The KPI law section 2 quote partitions series at the wall-clock landedAt while it places taking effect per checkout, at the instant a checkout's HEAD ancestry comes to include the event's merge commit. Landing and per-checkout adoption are therefore two instants on that record, and the criterion is stated on the dated landing act, which occurs once, not on taking effect, which recurs per checkout. Timestamp proximity and mechanism tags fail as criteria (counterexamples 4 and 5). Whether the class supplies a finished criterion of its own is unresolved because no cited record says what makes two change sets the same apart from the pull request and merge commit that only re-identify them, because the merge-versus-apply and supersession questions change how many landings the 44 rows record, and because no cited record holds the per-checkout HEAD-ancestry census that would show adoption instants varying under one landedAt."
  carries_identity: "Unresolved. An event class carries identity only from a supplying sortal of occurrences, and no cited record names one: the rows give a landedAt, a merge commit and a pull request per row, which are re-identification evidence, and the criterion above is still open on which act lands (merge or apply) and on supersession. Discriminating evidence: a record giving one 'applied' or 'live' change's merge time and apply or go-live time separately beside its landedAt; a record saying whether #1019's alteration still holds after #1022 lands, or naming a later row a revision of an earlier change; and a per-checkout HEAD-ancestry census for one change."
  rigidity: "An occurrence that is the landing of a change cannot cease to be that landing; the observational-versus-causal label of KPI law section 2 qualifies comparisons made at the landing, not the landing itself, so a later causal upgrade would not reclassify it."
  dependence: "A landing exists only as the landing of a particular change set that alters the arrangements its row title names; it depends on those participants, which are not its parts."
  temporality: "Events do not change state: a later supersession is a further occurrence, not a state of the earlier one, so terminal_states is empty. Whether a landing is instantaneous or spans an interval is unresolved: the records give one instant per row. The #1141 row's 'live 2026-09-15' carries no zone; landedAt 2026-09-16T00:18:38Z postdates that go-live date unless the date is read in a zone behind UTC, where that instant still falls on 2026-09-15. If the gap exists, it may be the extent of a rollout or two separate acts."
  category: "Event (a dated occurrence) is argued from the discriminator rows (the heavy CI pool moving from Spot to On-Demand, contained to two Spot runners), which date changes to things outside the ledger, and from the KPI law section 2 record, which partitions KPI series at the landing; under both event-grain rivals the category holds, since merge and apply are both occurrences. The two information-object readings, the ledger row and the pull request or merge commit, are not argued away. On the row-grain reading each row pairs one-to-one with one landing and carries one pr and one mergeCommit, so on that reading no cited record separates row or artifact from landing; the supersession and retirement rows (#1019 and #1022; #870 and #929) also bear on the ledger-row rival, since if either pair records one landing, two rows record one landing and row and landing come apart, and the records do not say which. Both stay viable on this card with their discriminators (a row corrected while the landed change stays the same; one change's merge time and applied or live time given separately) named as missing evidence. Neither discriminator would by itself move the category to information_object: the merge-versus-apply record would split the merge from the apply and so favour an event reading (merge or apply as the landing act) over the change-artifact reading; the corrected-row record would show only that row and landing come apart, telling against reading them as one individual without saying which of the two the class term denotes, so it favours neither category."
