id: "ic:chg-change-landing:001"
hypothesis_ref: "dh:chg-change-landing:001"
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    Two recorded landings are the same landing when they are the same dated landing act of
    one change set, the single act a row dates by its landedAt instant and ties to its merge
    commit and pull request. The change-set leg is unresolved: the records name a change set
    only by its pull request and merge commit, which are re-identification evidence, and give
    nothing else about it but a title, so no cited record states what makes two change sets
    the same apart from those keys; the needed evidence is a record of a change set's content
    (the alteration it makes) against which two rows can be compared without them. Taking effect is not the criterion: the KPI law section 2 record
    makes taking effect per checkout (a checkout is in the post-period only when its HEAD
    ancestry includes the event's merge commit; old binaries keep old behavior), so on that
    record landing and per-checkout adoption are two instants, the landing once and each
    checkout's adoption as a further instant of its own. The class criterion survives that
    split because it rests on the landing act alone and leaves adoption to the relation
    between the landing and a checkout. A shared instant is never sufficient (#1067 and #1068
    land 16 s apart) and a shared mechanism tag is never sufficient (the same pair carries
    one tag). Open, and named as missing evidence: whether a change whose title dates an
    apply or go-live lands at its merge or at its apply; whether a later row that supersedes
    or retires an earlier change records a second landing or a revision of the first; and a
    per-checkout HEAD-ancestry census showing one change's adoption instants varying across
    checkouts while its landedAt stays one, the evidence that discriminates the landing act
    from per-checkout taking effect.
  reidentification_key:
  - "the row's mergeCommit value, one per row (re-identification evidence, never the criterion)"
  - "the row's pr number, one per row (re-identification evidence, never the criterion)"
ontoclean:
  rigidity: rigid
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: "Unified as the single dated landing act of one change set; a landing may alter several mechanisms at once (the #874 and #1049 rows bundle several lane, gate and reuse alterations under one tag), so unity follows the change set, not the mechanism tag."
  dependence: relational
ufo_analysis:
  candidate_category: event
  alternatives:
  - "information_object: the curated ledger row about the change (the hypothesis grades it viable and names dh:chg-change-record:001 beside it); kept viable here, because on the row-grain reading each row pairs one-to-one with one landing and no cited record splits the row from the landing; the supersession and retirement rows (#1019 'superseded by #1022'; the #870 lock retained until the #929 row retires it) also bear on this rival, since under the coarser-grain rival two rows record one landing, which would separate row from landing, and the records do not say which reading holds; discriminated by a record of a row corrected while the landed change stays the same, which no cited record holds"
  - "information_object: the change artifact, pull request or merge commit (the hypothesis grades it viable and names dh:chg-change-artifact:001 beside it); kept viable here, because every row, the 'applied' and 'live' rows included, carries one mergeCommit and one pr, so the records do not split artifact from landing; discriminated by a record giving one change's merge time and its applied or live time separately, which no cited record holds"
  - "event at a coarser grain: one change revised across several rows (#1019 superseded by #1022 and the #870 lock retained until #929, as those rows state; #891 then #894 runtime root, a link inferred from the two titles alone, which no cited record states and which is named as needed evidence)"
  - "event of a different act: the apply or go-live of an infrastructure change rather than its merge (#1050, #1141, #1364, #1422 rows)"
  existential_dependencies:
  - "the change set it lands (carried by the pull request and merge commit the row names)"
  - "the arrangements the row titles say the change alters, in the titles' own words: the admission queue and proof locks (#891, #894), the weighted admission scheduler (#870, #929), the pre-push wave (#1006), gates and lanes that join pre-push, cheap-gates or lint:policy (#1021, #1029, #1067, #1380), the lane-proof reuse key (#1019, #1022), Turbo task inputs (#1146), partition shards (#982), the deprecated-apis ESLint pass that shards packages/tooling by subtree (#1007), the heavy CI pool or fleet (#1050, #1141, #1364, #1422); the rows' mechanismChanged values are ledger-field governance and are not adopted as dependence targets"
temporality:
  exists_during_interval: unresolved
  may_change_state_without_losing_identity: false
  terminal_states: []
counterexamples:
- description: "The #1141 row titles its change 'live 2026-09-15', a date with no zone, and records landedAt 2026-09-16T00:18:38Z beside a mergeCommit. If the go-live date is read in UTC or a zone ahead of it and landing is the go-live, the recorded instant postdates it and the merge is a second occurrence for one change, so a per-row criterion keyed on the merge would date the wrong occurrence; if the date is read in a zone behind UTC, 00:18:38Z can still fall on 2026-09-15 there and the two may be one occurrence. The record does not say which zone the date uses (strongest counterexample)."
- description: "The #1019 row says 'superseded by #1022' and both alter the lane-proof reuse key: one criterion counts two landings, the other one change revised in two steps; no record says whether #1019's alteration still holds after #1022 lands."
- description: "The #870 row retains the per-origin proof lock 'until #929' and the #929 row retires it after drain: the retirement may be a landing of its own or the completion of the change #870 began."
- description: "The #1380 and #1384 rows land 13 seconds apart with distinct pull requests, merge commits and mechanism tags: a criterion based on the instant alone would wrongly merge them. The #1067 and #1068 rows, two pull requests 16 seconds apart, carry the same mechanism tag and both alter the cheap-gates lane list: that pair is a counterexample to both an instant-only and a mechanism-only criterion."
- description: "The #874 row bundles publish-before-admission, a CI-parity step, lane-proof reuse and new pre-push lanes under one mechanism tag: a criterion keyed on mechanism altered would wrongly split one landing into several."
status: proposed
referent_grain: "Recorded-occurrence grain: one dated landing of one change set on the verification mechanisms it alters, individuated by the change set it lands and the dated act of its landing; not the ledger row that records it, not the pull request or merge commit that carries it, and not the instant that dates it."
