rationale:
  identity: >-
    The member classifies requests through every observed end: withdrawal, ticket eviction
    (so-29a5ac8607a2), release and lease eviction (so-860cff0d673e). Under the fixed reading, no
    kind=merged-preview chain is a stage occurrence. CQ-021 warrants the work-kind class, not this
    member, and is not cited as evidence for it.
  rigidity: >-
    Inherited from the work-kind class, unresolved.
  dependence: >-
    None shown: the member depends on no particular request, and no cited record shows a policy or
    other individual it depends on; the literal-domains row (po-2f209664dde0) quotes the deployed
    list it belongs to, which is a record of the domain, not a dependence of the member.
  category: >-
    A member cannot be ruled while its class is deferred. Queue H reading (c), merged preview as a
    work kind, is held apart from reading (b), the stage, on the fixed reading. Whether it is
    work-of-a-kind or a charge code is the class's open question.
  temporality: >-
    Inherited from the class.
