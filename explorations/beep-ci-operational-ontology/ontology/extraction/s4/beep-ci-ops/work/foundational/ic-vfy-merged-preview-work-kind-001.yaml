id: "ic:vfy-merged-preview-work-kind:001"
hypothesis_ref: "dh:vfy-merged-preview-work-kind:001"
referent_grain: >-
  One member of the admission work-kind classifier over seat requests and grants: the kind
  merged-preview, carried on a ticket's kind member, individuated by its place in the closed
  work-kind domain, not by the word it shares with a proof stage.
identity:
  supplies_identity: false
  identity_criterion: >-
    unresolved: what makes two classifications by this member the same member depends on the open
    kind-of-work versus charge-code question of the work-kind class. Under the kind-of-work reading,
    two requests fall under the same member iff the work they ask capacity for is of one kind
    (merged-tree preview work); under the charge-code reading, iff their tickets carry one code that
    fixes one charge and priority treatment. The deciding record is an admission chain of kind
    merged-preview joined by attemptId to an attempt-journal start or a proof-ledger fact that shows
    the stage and tree its granted work ran at. It supplies no identity to the requests it
    classifies.
  reidentification_key:
    - kind=merged-preview on admission chains and leases (evidence)
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: false
  unity: ""
  dependence: none
ufo_analysis:
  candidate_category: unresolved
  alternatives:
    - subkind of requested work (merged-tree preview work), if the class is a categorizer
    - a code fixing charge 5 and nothing else, if the class is a controlled vocabulary
    - the proof stage merged-preview (retired as the same individual on the fixed reading)
    - an assurance tier (not this pair's to rule; see the tier and stage pairs)
  existential_dependencies: []
temporality:
  exists_during_interval: unresolved
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
  - description: >-
      so-a8d270b5e19d is a held grant of kind merged-preview whose own stage member is pre-push and
      whose proof tier is full. That is consistent with the fixed reading that the admission work
      kind is not stage activity, and so with one shared spelling over members of two domains; one
      record cannot show it, and the record is a quarantined lease that may be anomalous.
  - description: >-
      Under both priority classes the member carries charge 5 (so-d99a3c53086c verify,
      so-0d75ae7174ed publish), against 3 for full-proof (so-95b7d78a061f, so-363f9b7f07dc). If
      charge were all a member fixed, the code reading would suffice and nothing would show a kind of
      work behind the value.
status: proposed
