id: "ic:turbo-cache:007"
hypothesis_ref: "dh:turbo-cache:008"
identity:
  supplies_identity: true
  identity_criterion: "Two artifacts are the same parallel integration-test specification only when they are the same authored repeatable instruction in the same versioned configuration lineage and their complete resolved prescriptions establish the same parallel execution strategy; the lexical parallel suffix and build selector alone do not establish identity."
  reidentification_key:
    - "enclosing configuration document and revision"
    - "task key test:integration:parallel"
    - "resolved task-declaration digest"
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: true
  unity: "One versioned task declaration collects the prescriptions intended to govern repeatable parallel integration work."
  dependence: intrinsic
ufo_analysis:
  candidate_category: information_object
  alternatives:
    - "A parallel integration-test verification lane realized by the specification"
    - "A lexically specialized task whose actual execution strategy is supplied elsewhere"
  existential_dependencies:
    - "The configuration, package scripts, and runner context that give parallel its operational meaning"
    - "At least one bearer of the task instruction content"
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
  - description: "A task named parallel can invoke a serial script, while a differently named task can run concurrently; the cited dependency prescription does not prove the named execution strategy."
status: proposed
