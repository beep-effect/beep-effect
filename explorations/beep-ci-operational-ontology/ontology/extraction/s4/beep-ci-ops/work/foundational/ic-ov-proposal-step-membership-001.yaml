id: ic:ov-proposal-step-membership:001
hypothesis_ref: dh:ov-proposal-step-membership:001
referent_grain: Recorded component-membership assertion connecting one immutable prescription to one of
  its represented steps; not an admission occurrence.
identity:
  supplies_identity: false
  identity_criterion: 'Proposed at assertion-content grain: two representations express the same membership
    when the same step component belongs to the same containing prescription content and version. Membership
    is relative to that prescription; reusing a step identifier, request identifier, or ordinal in a different
    prescription does not identify the same membership.'
  reidentification_key:
  - proposal subject and hasStep target in the particular emitted proposal, for lookup only
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: One part-membership proposition with a containing prescription and a represented component. Neither
    endpoint identifier supplies a new independent relation identity.
  dependence: relational
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - structural part relation between informational prescription and component
  - ordered sequence structure with membership implicit in its entries
  existential_dependencies:
  - The containing proposal content and its represented step are constitutive participants.
  - A live request or actual grant need not exist for an illustrated membership assertion to be represented.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: 'Hypothetical counterexample: two proposals both contain a step at ordinal zero, perhaps
    scheduling the same request. Merging their membership assertions by ordinal or request erases which
    prescription each step belongs to. Adding a deferred request as a step would likewise change the prescribed
    component set, despite no actual admission having occurred.'
