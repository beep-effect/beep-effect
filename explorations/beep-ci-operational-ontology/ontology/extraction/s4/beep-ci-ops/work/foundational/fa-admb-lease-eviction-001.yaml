open_evidence_questions:
- >-
  Observe the effective lease deletion/revocation and associated active-charge change correlated with
  the eviction entry. A separate process-liveness or identifier-reuse observation is needed to discriminate
  the recorded diagnostic branches; policy-consumption evidence would be required for a timeout-rule
  interpretation.
