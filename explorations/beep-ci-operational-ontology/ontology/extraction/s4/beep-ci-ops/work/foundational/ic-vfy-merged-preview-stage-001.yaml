id: "ic:vfy-merged-preview-stage:001"
hypothesis_ref: "dh:vfy-merged-preview-stage:001"
referent_grain: >-
  One member of the proof-stage classifier: the position in the verification workflow at which an
  attempt produces evidence against the merge-preview tree, individuated by that position once a
  stage order is established (unresolved), not by the literal merged-preview.
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    unresolved: under the stage reading the merged-preview stage would be the same stage wherever
    one workflow position recurs, whatever its spelling, but no cited record establishes a stage
    order, so the position cannot be stated (the deployed list po-581b06759057 is an array, not a
    stated order). A record fixing the stage order (a deployed transition rule or a workflow
    specification that orders the stages) is the needed evidence. As a member it inherits its
    category from the proof-stage class, whose category is deferred. Whether it supplies identity
    is unresolved with the class: under the plan-step reading the stage would supply its own
    identity as a position in the order, while under the categorizer and phase readings the attempts
    it classifies keep their own identity. The stage-order record decides that too.
  reidentification_key:
    - stage=merged-preview on attempt-started rows (evidence)
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: ""
  dependence: unresolved
ufo_analysis:
  candidate_category: unresolved
  alternatives:
    - subkind of verification attempt (if the class is a categorizer over attempts)
    - phase of a run or episode (if the class is a phase partition)
    - step of the workflow specification (if the class is a plan part)
    - >-
      a fourth assurance tier: an assurance target state an episode is verified toward (the tier
      reading, dh:vfy-merged-preview-tier:001)
    - >-
      the admission work kind merged-preview (the work-kind reading, dh:vfy-merged-preview-work-kind:001;
      retired as the same individual on the fixed reading that the admission work kind is not stage
      activity)
  existential_dependencies:
    - >-
      on the stage reading in its plan-step variant only: the verification workflow specification
      whose ordered steps it would belong to. The subkind and phase variants of the stage reading,
      the fourth-tier reading and the work-kind reading claim no workflow dependence. Dependence is
      unresolved and reading-relative; the deciding evidence is a stage-order record (a deployed
      transition rule or a workflow specification that orders the stages), which no cited record
      supplies, so this entry holds only if that reading wins.
temporality:
  exists_during_interval: unresolved
  may_change_state_without_losing_identity: unresolved
  terminal_states: []
counterexamples:
  - description: >-
      Work kind and stage on one record: the lease so-a8d270b5e19d carries kind=merged-preview with
      stage=pre-push. A model that reads the shared word as one referent would put that grant at the
      merged-preview stage while its own stage member says pre-push. One quarantined record is
      consistent with the fixed reading that a work kind is not stage activity; it does not show it.
  - description: >-
      Stage inside a tier or a tier of its own: so-3bf9cacb55b4 carries stage=merged-preview with
      proofTier=full, the deployed tier value the lease so-a8d270b5e19d also carries at pre-push.
      The record carries proofTier full and nothing more: proofTier is the deployed proof-tier
      value, its mapping onto the three AssuranceTierId levels is unmapped by any cited record, and
      the record cannot place the attempt in an assurance tier or decide between a stage inside a
      tier and a tier of its own.
status: proposed
