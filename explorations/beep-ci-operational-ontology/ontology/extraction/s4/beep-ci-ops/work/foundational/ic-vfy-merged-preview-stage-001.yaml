rationale:
  identity: >-
    One attempt began at this stage under mode=verify and envProfile=pr-posture (so-3bf9cacb55b4),
    and the fleet census retains merged-preview starts (po-58c65850834f). The ledger census reads
    the stage as dormant in the capture window (po-563da43a9f12, po-82648cf8d37a), which is never
    observed-and-empty, and no argument here rests on a zero count.
  identity_under_rivals: >-
    Fourth-tier reading: two episodes would be verified to the same tier iff they discharge the same
    assurance level, individuated by the lane obligations that level requires rather than by the
    literal; a record of lane obligations required at a merged-preview level and not for
    TierLocalFullProof would supply it. Work-kind reading: two requests would fall under the same
    member iff their tickets carry the same kind of requested work or the same charge code (see the
    work-kind pair, where that question is open). Neither criterion is testable on the cited records.
  rigidity: >-
    Stage reading: inherited from the class, which is bearer-relative and unresolved (see the
    proof-stage pair).
  rigidity_under_rivals: >-
    Fourth-tier reading: unresolved; as a target state an episode is verified toward, it would be
    anti-rigid for the episode if one episode could be verified to it and later to another tier,
    which no cited record shows. Work-kind reading: unresolved; it turns on whether a request's kind
    could change without the request ending, which no cited chain shows.
  dependence: >-
    Inherited from the class.
  category: >-
    A member's category cannot be ruled while its class's category is deferred. The stage and tier
    readings are kept as alternatives. The work-kind identity is retired on the fixed reading that
    the admission work kind is not stage activity; so-a8d270b5e19d carries the work-kind literal and
    the stage literal with different values on one record, which is consistent with that reading
    and is not its ground. The KPI law's sub-partition of
    TierLocalFullProof (po-fd56d2b008d1) is a reporting rule, quoted here, not a category ruling.
  temporality: >-
    Inherited from the class.
