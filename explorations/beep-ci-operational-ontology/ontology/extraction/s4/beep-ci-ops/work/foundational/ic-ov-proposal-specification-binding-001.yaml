id: ic:ov-proposal-specification-binding:001
hypothesis_ref: dh:ov-proposal-specification-binding:001
referent_grain: Recorded proposal-to-description binding within one emitted projection; a contextual information
  assertion, not the governing description or a compliance event.
identity:
  supplies_identity: false
  identity_criterion: 'Proposed at assertion-content grain: the same binding asserts the same association
    between the same represented proposal version and the same represented descriptive target within the
    same projection context. A changed target or proposal version changes the binding content. This criterion
    identifies the represented assertion only; it does not resolve whether the target denotes reusable
    rules or an input-bound context.'
  reidentification_key:
  - proposal subject and hasProjectionSpecification target within the emitted representation, for lookup
    only
ontoclean:
  rigidity: rigid
  carries_identity: true
  supplies_identity: false
  unity: One contextual association supplying the descriptive target for a particular proposal. The assertion
    carries information-content identity without supplying identity for either participant.
  dependence: relational
ufo_analysis:
  candidate_category: information_object
  alternatives:
  - a direct governing relation between a plan and repeatable rules
  - a provenance association with an input-bound application-context record
  existential_dependencies:
  - The represented proposal version and target description are constitutive participants in the assertion.
  - A physical execution, actual compliance, or approval is not required for the assertion to exist.
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states: []
counterexamples:
- description: 'Hypothetical counterexample: a proposal points to a record containing only the policy
    and input binding, while an independent document states the reusable rules. Reading the edge as proof
    that its target is that rule specification silently merges two grains. Changing a target while keeping
    the proposal identifier can also change the asserted binding without establishing any new execution.'
