open_evidence_questions:
- >-
  Observe the demand-to-authorization transition together with the effective active-charge change
  independently of journal production. Observe whether a consumer addresses the transition separately
  from the grant boundary; a pre-conferment remaining-capacity snapshot is additionally required for
  legality.
