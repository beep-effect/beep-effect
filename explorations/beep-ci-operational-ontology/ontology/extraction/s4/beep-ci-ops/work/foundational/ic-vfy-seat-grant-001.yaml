id: "ic:vfy-seat-grant:001"
hypothesis_ref: "dh:vfy-seat-grant:001"
referent_grain: >-
  A held admission at the grain of one admission chain's held span: a run's hold on shared
  verification capacity from its admission to its release or eviction, holding one checkout at one
  charge; individuated by the admission that began it.
identity:
  supplies_identity: unresolved
  identity_criterion: >-
    unresolved: two seat grants are the same iff they were begun by the same admission, and the
    chain nonce and the lease's own members are evidence of that, never the criterion. Open is
    whether the grant is a new individual founded at admission or the held phase of one admission
    engagement that began at enqueue. A renewal or transfer, which would test persistence through a
    change of holder or term, is not shown.
  reidentification_key:
    - nonce of the admission chain (evidence)
    - admittedAtMillis (evidence)
ontoclean:
  rigidity: unresolved
  carries_identity: unresolved
  supplies_identity: unresolved
  unity: >-
    One admission-begun held span bounded by one end event. Heartbeat members appear on the cited
    lease-evicted chains and the lease state record; the cited records do not show whether every
    grant carries one.
  dependence: relational
ufo_analysis:
  candidate_category: unresolved
  alternatives:
    - >-
      relator: a lease mediating the holding run and the checkout it holds, founded by admission and
      ended by release or eviction (rigid); whether a capacity pool is also mediated is unshown
    - >-
      phase of one admission engagement (anti-rigid): the held phase of the individual that waited as
      the seat request under the same nonce
    - the lease file or journal rows (information object; rejected as the referent)
  existential_dependencies:
    - the holding run
    - the checkout it holds
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: true
  terminal_states:
    - released
    - evicted (reason owner-dead-or-reused)
counterexamples:
  - description: >-
      Liveness: so-860cff0d673e is admitted and then lease-evicted with reason owner-dead-or-reused
      and a last heartbeat instant earlier than the eviction instant. The record carries that reason
      value and the two instants, not a cause; read at its word, the grant ended on a condition of
      its owner, and its heartbeat member is one no cited queued request row carries. That favours a
      distinct grant, but the engagement reading reaches the same result by giving the held phase its
      own end conditions.
  - description: >-
      Release-only stanzas: so-badb15130ad8 and the record-10 pair so-df1f4d8ba41f and
      so-3013eedf6f82 (one release span seen twice) show a release with no admit row in the stanza.
      Counting stanzas as grants would make individuals of release rows, and the pair would become
      two grants.
status: proposed
evidence_refs:
