rationale:
  identity: >-
    Admitted-and-released chains (so-95b7d78a061f, so-363f9b7f07dc, so-8fcf58cfd24c) and
    lease-evicted chains (so-860cff0d673e, so-a9ed1352e2bc) show held spans with their own ends. The
    quarantined lease so-a8d270b5e19d carries admission members (enqueue and admit instants, charge)
    beside attempt members. Whether those were copied from the request rows is not shown, since no
    cited request chain shares its nonce. That is consistent with both readings.
  rigidity: >-
    Rigid under the relator-split reading and anti-rigid under the engagement reading. The deciding
    record is missing.
  dependence: >-
    Marked relational on what the cited records show: each grant chain names the checkout it holds
    (a checkoutRoot member) and carries owner members, so the grant is read as existing only while a
    holder and that checkout stand in the holding relation. No cited record of this hypothesis names
    a capacity pool, so a dependence on a pool is unshown; a record stating the capacity a grant is
    charged against (a pool or capacity snapshot member) is the needed evidence. The cited
    lease-evicted chains carry a last heartbeat instant before the eviction instant and the
    reason owner-dead-or-reused; no cited record states that eviction follows from a stopped
    heartbeat.
  category: >-
    Relator or phase of a relator. Deferred together with the seat-request pair, because one record
    decides both.
  temporality: >-
    It persists over its held span; heartbeat members appear on the cited lease-evicted chains and
    the lease state record, and a peak-memory reading on some release rows. Renewal and transfer are
    not shown.
