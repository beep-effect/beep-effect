rationale:
  identity: >-
    The fact so-2601c6b77d87 and the shadow so-b1c417f14329 agree on lane, duration and verdict, so
    two records of different kinds record one execution. The execution is therefore neither record.
  rigidity: >-
    Unresolved. An individual could lose this classification while persisting if one invocation
    were recorded first as a lane execution and later absorbed as an unindividuated part of a parent
    lane's execution, or re-labelled to another lane. The cited records show each execution once,
    with one lane id and one verdict, and show no re-labelling or absorption, so they neither show
    nor rule out such a loss. A record of one invocation under two lane ids, or a child entry later
    folded into its parent, would be the evidence.
  dependence: >-
    Marked relational: it exists only as the run of a given lane in a given attempt.
  category: >-
    UFO event (a perdurant with duration and a verdict-bearing end). The process alternative stays a
    rival: CQ-022 counts executions while running, and a running-state record of an execution would
    decide between them; no cited record carries one, which leaves the question open.
  temporality: >-
    It unfolds over time and ends in a verdict. Whether it changes state without losing identity is
    unresolved: no cited record shows an execution in a running state before its verdict, and a
    running-state record of a lane execution (as CQ-022's RunningExecution needs) is the evidence.
    durationMs is a per-lane wall measure, not an interval with recorded start and end instants.
