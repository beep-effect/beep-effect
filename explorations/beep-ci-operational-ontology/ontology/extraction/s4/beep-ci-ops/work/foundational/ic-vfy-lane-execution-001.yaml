id: "ic:vfy-lane-execution:001"
hypothesis_ref: "dh:vfy-lane-execution:001"
referent_grain: >-
  A dated occurrence: one invocation of one verification lane's procedure inside one attempt, ended
  by a verdict; individuated by that invocation, not by the lane it runs nor by any record of it.
identity:
  supplies_identity: true
  identity_criterion: >-
    Two lane executions are the same iff they are the same single invocation of one lane's
    procedure within one attempt over one tree: the same lane started once in the same attempt. A
    rerun of the lane inside the same attempt is a second execution. The (attempt, lane) pair is
    evidence that suffices only while no rerun occurs, and the ledger record key, attemptId and
    laneId are evidence, never the criterion.
  reidentification_key:
    - attemptId with laneId (evidence; insufficient under reruns)
    - fact and shadow records sharing durationMs and recordedAt (two records of one execution)
ontoclean:
  rigidity: unresolved
  carries_identity: true
  supplies_identity: true
  unity: >-
    One invocation from its start to its verdict. The verdict record so-5d4b45aa3226 shows lane
    executions inside a lane execution: 32 lane entries carry parentLaneId=full:01-pre-push, each
    with its own startedAt and endedAt, spanning 3133022 ms from the first child's start to the last
    child's end, and the wrapper entry full:01-pre-push carries durationMs 3137528.733036, longer
    than that span. The wrapper's duration plus its children's summed durations (2997685.775465 ms)
    come to 6135214.5 ms, more than the attempt's elapsedMs 3814445, so wrapper and children
    overlap by at least 2320769 ms and cannot have run one after another; the wrapper also fails
    with the repairCommand of its failed child quality:coverage. Containment of the children in the
    wrapper's run is shown (by durations; the wrapper carries no startedAt or endedAt of its own).
    Parthood is still to argue: whether a child execution is a part of the wrapper execution, so
    the wrapper's unity is its children plus its own work, or a separate execution only temporally
    inside it, the record does not say.
  dependence: relational
ufo_analysis:
  candidate_category: event
  alternatives:
    - process (if executions are counted while running, as CQ-022 needs for RunningExecution)
    - >-
      two referents: the journal verdict-lane step and the ledger lane run as different occurrences
      (disfavoured: so-5d4b45aa3226 and so-2601c6b77d87 join on one attempt, lane and duration)
    - the verdict lane entry or ledger record (information object; rejected as the referent)
    - a part of the attempt with no individuality of its own
  existential_dependencies:
    - the verification attempt it runs in
    - the verification lane whose procedure it invokes
    - the tree state it runs against
temporality:
  exists_during_interval: true
  may_change_state_without_losing_identity: unresolved
  terminal_states:
    - passed
    - failed
    - not shown - cancelled or obsoleted by a committed failure (CQ-022)
counterexamples:
  - description: >-
      Rerun (hypothetical): if a lane were rerun within one attempt, there would be two invocations
      with one (attempt, lane) pair; the pair would count one execution and the invocation criterion
      two. No record of this hypothesis shows a rerun; a record of two invocations of one lane in one
      attempt is the needed evidence.
  - description: >-
      Nesting on so-5d4b45aa3226: the wrapper lane full:01-pre-push (durationMs 3137528.733036,
      status failed) and the 32 lane entries carrying parentLaneId=full:01-pre-push are all lane
      executions of one attempt, and the children ran inside the wrapper's run (their span, 3133022
      ms, is shorter than the wrapper's duration, and wrapper plus children sum to 6135214.5 ms
      against the attempt's elapsedMs 3814445). Counted as peers, each entry's durationMs taken as
      one execution's wall time (the CQ-025 actualWallMs carrier) double-counts the wrapper's time.
      The criterion holds only if the wrapper's invocation is an execution of its own whose run
      contains the children's; whether the children are its parts or separate executions inside its
      interval is still to argue, and a wrapper entry with its own startedAt and endedAt, or a record
      of what the wrapper's durationMs measures, would decide it.
status: proposed
evidence_refs:
