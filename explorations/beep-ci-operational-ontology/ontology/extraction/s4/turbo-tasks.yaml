issues:
  - id: turbo-tasks-I01
    kind: assumption
    claim: "A Turbo task declaration does not by itself prove that the task denotes an in-scope VerificationLane."
    evidence: "turbo.json:237 — '\"persistent\": true,'"
    suggested_disposition: "Ratify task individuals against actual yeet/CI use; reject persistent or support tasks that are implementation artifacts only."
    status: open
  - id: turbo-tasks-I02
    kind: schema-conflict
    claim: "A task-level cache boolean is not a member of the closed CachePosture domain."
    evidence: "turbo.json:82 — '\"cache\": false,'"
    suggested_disposition: "Keep taskCacheEnabled separate from LocalOnly, LocalWriteRemoteRead, and CallerControlled."
    status: open
  - id: turbo-tasks-I03
    kind: ambiguity
    claim: "Several tasks omit explicit inputs, outputs, or cache declarations, so their effective values depend on defaults not stated in this corpus."
    evidence: "turbo.json:227-229 — '\"transit\": {'"
    suggested_disposition: "Resolve Turborepo default semantics before asserting effective hash or cache posture for omitted fields."
    status: open
  - id: turbo-tasks-I04
    kind: ambiguity
    claim: "The three enabled future flags are named and valued but their operational transformations are not defined by turbo.json."
    evidence: "turbo.json:4 — '\"affectedUsingTaskInputs\": true,'"
    suggested_disposition: "Ratify their denotation against the pinned Turbo schema before formal axiomatization."
    status: open
  - id: turbo-tasks-I05
    kind: missing-cq
    claim: "The audit task's new-only output-log mode has no Must/Should CQ warrant."
    evidence: "turbo.json:225 — '\"outputLogs\": \"new-only\"'"
    suggested_disposition: "Leave output-log presentation outside the T-Box unless a scheduling or evidence decision requires it."
    status: open
  - id: turbo-tasks-I06
    kind: ambiguity
    claim: "Turbo selector tokens and negated globs are configuration-language literals, not filesystem individuals."
    evidence: "turbo.json:38 — '\"inputs\": [\"$TURBO_DEFAULT$\", \"$TURBO_ROOT$/.env*\", \"!.beep/**\"],'"
    suggested_disposition: "Preserve selector spellings as xsd:string facts until a selector grammar is separately modeled."
    status: open
  - id: turbo-tasks-I07
    kind: ambiguity
    claim: "The source distinguishes env from passThroughEnv but does not state the latter's cache-key semantics."
    evidence: "turbo.json:19 — '\"passThroughEnv\": ['"
    suggested_disposition: "Keep pass-through variables separate from hash-environment variables and verify semantics before reasoning about transferability."
    status: open

