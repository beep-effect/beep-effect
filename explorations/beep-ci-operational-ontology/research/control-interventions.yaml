    OBSERVATIONAL: the per-origin proof lock is retained (QualityScheduler.ts module
    header; round-2 seat F + round-3 I-06) — #870 layers durable weighted admission
    over it, so contender behavior changes from bounce-fail churn + retry loops to
    queue wait (queueWaitMs). The expected association is a shift of episode
    time-to-certainty composition, not a lock removal. Attribution requires the
    pre-intervention journal snapshot (evidence/journal-snapshot-2026-08-27/) because
    the ring-buffer vein self-erases.
  measurementCaveats:
    - "ADOPTION-QUALIFIED MEMBERSHIP (round-2 seat F): merge time is NOT the fleet boundary — checkouts on pre-#870 binaries keep bounce behavior after landedAt. Post-period membership requires per-checkout HEAD ancestry >= mergeCommit (adoption census: evidence snapshot CHECKOUT_HEADS.txt)."
