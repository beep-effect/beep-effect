- id: iv-870-weighted-admission
  title: "PR #870 — machine-wide weighted admission scheduler"
  class: OperationalChangeEvent
  causalStatus: observational          # upgrade requires the §2 supporting design
  landedAt: "2026-08-27T19:52:03Z"
  mergeCommit: debbbb51f77ae10015788dec0b819f12b96c3552
  pr: 870
  mechanismChanged: admission          # per-origin proof lock RETAINED (until #929); a weighted
                                       # ticket/lease admission layer now queues
                                       # contenders that previously bounce-failed
  hypothesis: >
    OBSERVATIONAL: the per-origin proof lock is retained (QualityScheduler.ts module
    header; round-2 seat F + round-3 I-06) — #870 layers durable weighted admission
    over it, so contender behavior changes from bounce-fail churn + retry loops to
    queue wait (queueWaitMs). The expected association is a shift of episode
    time-to-certainty composition, not a lock removal. Attribution requires the
    pre-intervention journal snapshot (evidence/journal-snapshot-2026-08-27/) because
    the ring-buffer vein self-erases.
  measurementCaveats:
    - "ADOPTION-QUALIFIED MEMBERSHIP (round-2 seat F): merge time is NOT the fleet boundary — checkouts on pre-#870 binaries keep bounce behavior after landedAt. Post-period membership requires per-checkout HEAD ancestry >= mergeCommit (adoption census: evidence snapshot CHECKOUT_HEADS.txt)."
    - "Pre/post clocks differ: pre-period bounce ATTEMPTS were excluded from episode opening (--exclude-bounces), though waiting wall time remains inside episode durations; post-period queue wait is out-of-journal until the ticket/lease store is ingested."
    - "Journals on busy branches evict pre-#870 attempts (50-start ring buffer) — the snapshot is the only durable pre-period record."
    - "2026-10-01: #929 (e76c4db079, 2026-08-31T08:20:46Z) retired the per-origin lock as admission authority for current-version proofs in checkouts whose HEAD ancestry includes it, after prior-version owners drain; an exclusive fallback lease remains on hosts below the scheduler memory envelope (QualityScheduler.ts:12-15). 'RETAINED' above holds only until #929; see iv-929-origin-lock-retirement, recorded under Ruling 6 (2026-10-01 graduation sitting)."
    - "2026-10-01: granted-work queue wait is journaled since #878 (admission-admitted carries enqueuedAtMillis and admittedAtMillis); enqueue and withdrawal rows since #1025 (v3). The second caveat's out-of-journal clause is historical."
    - "2026-10-01: the attempt ring keeps the newest 50 TERMINAL attempts per run-id file since #978 (unterminated attempts are kept) and writes journal-compacted receipts since #964. The third caveat's '50-start' wording is historical."
  evidence:
    - "research/evidence/journal-snapshot-2026-08-27/ (245 journals, 28 checkouts, digests committed)"
    - "gh pr view 870 --json mergedAt,mergeCommit (verified 2026-08-27)"

- id: iv-929-origin-lock-retirement
  title: "PR #929 — weighted scheduler becomes sole admission authority; per-origin lock retired after drain"
  class: OperationalChangeEvent
  causalStatus: observational
  landedAt: "2026-08-31T08:20:46Z"
  mergeCommit: e76c4db079e62155b1c03e8b77a8b210cac6e1d2
  pr: 929
  mechanismChanged: admission
  hypothesis: >
    OBSERVATIONAL: current-version proofs admit through the weighted scheduler alone and
    same-origin proofs in distinct checkouts become capacity peers (QualityScheduler.ts
    isTicketSkippable), so lock bounces and lockWaitMs shrink toward zero outside the
    legacy-origin drain and the below-envelope fallback lease.
  measurementCaveats:
    - "ADOPTION-QUALIFIED: post-period requires checkout HEAD ancestry >= mergeCommit AND drained prior-version owners (legacy-origin-lock/v1)."
    - "Hosts below the scheduler memory envelope keep an exclusive fallback origin lease (AdmissionOriginGate.tryAcquireFallback); the lock-bounce message is still emitted (ProofState.ts)."
  evidence:
    - "gh pr view 929 --json mergedAt,mergeCommit (verified 2026-10-01)"
    - "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts module header (:12-15 at 04993ae26a)"
    - "DECISIONS.md, 2026-10-01 graduation sitting, Ruling 6 (row written in the graduation PR)"

