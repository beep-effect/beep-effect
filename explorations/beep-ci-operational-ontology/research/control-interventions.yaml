    - "Journals on busy branches evict pre-#870 attempts (50-start ring buffer) — the snapshot is the only durable pre-period record."
    - "2026-10-01: #929 (e76c4db079, 2026-08-31T08:20:46Z) retired the per-origin lock as admission authority for current-version proofs in checkouts whose HEAD ancestry includes it, after prior-version owners drain; an exclusive fallback lease remains on hosts below the scheduler memory envelope (QualityScheduler.ts:12-15). 'RETAINED' above holds only until #929; see iv-929-origin-lock-retirement, recorded under Ruling 6 (2026-10-01 graduation sitting)."
    - "2026-10-01: granted-work queue wait is journaled since #878 (admission-admitted carries enqueuedAtMillis and admittedAtMillis); enqueue and withdrawal rows since #1025 (v3). The second caveat's out-of-journal clause is historical."
    - "2026-10-01: the attempt ring keeps the newest 50 TERMINAL attempts per run-id file since #978 (unterminated attempts are kept) and writes journal-compacted receipts since #964. The third caveat's '50-start' wording is historical."
