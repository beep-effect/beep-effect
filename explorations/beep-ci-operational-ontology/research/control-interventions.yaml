- id: iv-874-publish-before-admission
  title: "PR #874 — publish before proof admission; CI-parity step, lane-proof reuse and new pre-push lanes"
  class: OperationalChangeEvent
  causalStatus: observational
  landedAt: "2026-08-30T02:39:33Z"
  mergeCommit: d324544d3a3b333b8ef1f9eb225df2d065b70338
  pr: 874
  mechanismChanged: admission
  hypothesis: >
    OBSERVATIONAL: publish proofs hold an admission lease for less of their wall time,
    because preflight, push and PR creation now run before the admitted full proof, while
    proofs that carry the CI-parity step request the heavier merged-preview weight (5
    tokens against 3) and run more work. The expected association is a smaller pre-proof
    share inside the lease and a larger admitted share on TierLocalFullProof; the net
    direction of time-to-certainty is not predicted.
  measurementCaveats:
    - "ADOPTION-QUALIFIED MEMBERSHIP: local tier. A checkout is in the post-period only when its HEAD ancestry includes mergeCommit (kpi-measurement-rules.md §2; as iv-870). landedAt is the series partition point, never the fleet boundary."
    - "CONFOUNDED AT ONE INSTANT: the squash also changes lane-assembly (new `full:02-ci-parity` step running `beep ci local --affected`; new pre-push lanes quality:coverage, quality:codegen, quality:commitlint and quality:desktop-ipc; new cheap-gates lanes cheap-gates:exploration-atlas and cheap-gates:test-tsgo), gate-selection (lane-proof reuse is introduced and set to active on yeet proof steps, so a lane with an exact-match proof record is skipped; the standalone default is off) and turbo-cache-inputs (build drops `$TURBO_ROOT$/.env*`, check and lint drop the ui-system stories glob, test-family tasks add `$TURBO_ROOT$/vitest.setup.ts`). No single mechanism can be credited with a before/after shift."
    - "Check-lane Turbo concurrency moves from 1 to 3 locally (2 hosted); that is parallelism inside one lane and is context only."
    - "HOSTED CO-MECHANISMS (P0 Ruling 2): the squash also changes hosted gate selection (goals-only lane skip), hosted Turbo cache reads (same-repo PR remote-cache read) and hosted lane assembly (cache-warm.yml on the existing beep-ec2-heavy runner); runner capacity is unchanged. For hosted runs the post-period is a run whose head includes mergeCommit (P0 Ruling 2)."
  evidence:
    - "gh pr view 874 --json mergedAt,mergeCommit (verified 2026-10-05)"
    - "packages/tooling/tool/cli/src/commands/Yeet/internal/Handler.ts:870-871 at HEAD 8b7392fe00 (ensureRequestedPullRequest precedes runWithFullProofCoordinator; :780-782 at d324544d3a)"
