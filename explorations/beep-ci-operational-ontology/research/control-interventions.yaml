- id: iv-891-per-user-runtime-root
  title: "PR #891 — admission queue and proof locks resolve one per-user runtime root"
  class: OperationalChangeEvent
  causalStatus: observational
  landedAt: "2026-08-30T09:20:21Z"
  mergeCommit: 187f72069e8dcb1bb1b7cdf6536b467e1604d38c
  pr: 891
  mechanismChanged: admission
  hypothesis: >
    OBSERVATIONAL: sessions launched with a scrubbed environment stop coordinating under a
    tmpdir root their siblings never saw and join the shared admission queue and proof-lock
    tree, so their unserialized concurrent full proofs fall and their queue wait rises;
    sessions that already resolved /run/user/<uid> keep the same tree.
  measurementCaveats:
    - "ADOPTION-QUALIFIED MEMBERSHIP: local tier. A checkout is in the post-period only when its HEAD ancestry includes mergeCommit (kpi-measurement-rules.md §2; as iv-870). landedAt is the series partition point, never the fleet boundary."
    - "WHO MOVES: before, the admission root keyed on XDG_RUNTIME_DIR (XDG/beep/admit when set, tmpdir/beep-admit-uid-<uid> otherwise) and the Yeet proof-lock root made its own choice, so env-scrubbed sessions coordinated under a different tree. After, both come from one choice: /run/user/<uid> when a child directory can be created there, else tmpdir, with XDG_RUNTIME_DIR deliberately not consulted. The PR body lists XDG_RUNTIME_DIR first in the resolution order; the merged code governs."
    - "CONFOUNDED SEQUENCE: #894 (iv-894-invariant-runtime-root, 894393a934, 2026-08-30T10:23:55Z), from the same head branch, replaced this choice about 63 minutes later, so this row's effective window is 09:20:21Z to 10:23:55Z on 2026-08-30 and covers only checkouts whose HEAD includes 187f72069e but not 894393a934. Read the two rows as one admission-root sequence."
    - "SECOND ADMISSION-STATE EDIT: `scheduler reap --apply` on a run-user root also stops leaked run scopes under the legacy tmpdir admission roots (reapLegacyAdmissionRoots); #894 removed it. The PR merged as `Merge pull request #891`, which the first pass did not parse (P0 Ruling 5)."
  evidence:
    - "gh pr view 891 --json mergedAt,mergeCommit (verified 2026-10-05)"
    - "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:441 at 187f72069e (`const choice = yield* perUserRuntimeRoot();`); :287-298 at 187f72069e^1 (the replaced admissionRuntimeRoot keyed on XDG_RUNTIME_DIR)"
    - "packages/tooling/tool/cli/src/internal/repo-run/RuntimeRoot.ts:4-7 at 187f72069e (scrubbed sessions coordinated under a different root and ran proofs unserialised); :83-86 (resolution order; XDG_RUNTIME_DIR deliberately not consulted); :116 (/run/user/<uid>); :159-162 (tmpdir maps to beep-admit-uid-<uid>, run-user to beep/admit)"
    - "packages/tooling/tool/cli/src/commands/Yeet/internal/ArtifactPaths.ts:145 at 187f72069e (the proof coordinator lock root is `(yield* perUserRuntimeRoot()).root`)"
    - "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:1567-1575 at 187f72069e (legacy admission-root reap on run-user roots)"
    - "goals/ciops-ontology-pipeline/research/decisions.md, 2026-10-05 P0 sitting: Ruling 5 (merge-subject PR numbers parsed)"

- id: iv-894-invariant-runtime-root
  title: "PR #894 — admission queue and proof locks move to one invariant runtime root"
  class: OperationalChangeEvent
  causalStatus: observational
  landedAt: "2026-08-30T10:23:55Z"
  mergeCommit: 894393a934f1e9491d005dde72bec8de68061114
  pr: 894
  mechanismChanged: admission
  hypothesis: >
    OBSERVATIONAL: sessions that #891's probe would have split (no writable /run/user/<uid>,
    or a divergent TMPDIR) now share one admission tree and one proof-lock root, so their
    unserialized concurrent proofs fall and their queue wait rises; on hosts where every
    session passed the probe the tree only moves, and no association is expected beyond
    the cutover.
  measurementCaveats:
    - "ADOPTION-QUALIFIED MEMBERSHIP: local tier. A checkout is in the post-period only when its HEAD ancestry includes mergeCommit (kpi-measurement-rules.md §2; as iv-870). landedAt is the series partition point, never the fleet boundary."
    - "RELOCATION VERSUS DECISION: the canonical root is /tmp on POSIX (a home-backed .beep/runtime directory on Windows); the admission queue moves to /tmp/beep-admit-uid-<uid> and the proof-lock coordinator moves with it. The admission decision changes only for sessions whose /run/user/<uid> probe failed or whose tmpdir differed, and at the hard cutover, where processes still running #891 keep the /run/user tree until drained (the PR body records the merge host as drained)."
    - "CONFOUNDED SEQUENCE: lands on the same head branch as #891 (iv-891-per-user-runtime-root) about 63 minutes later and supersedes it; read the two rows as one admission-root sequence. #949 (e552d7da19, 2026-09-03T14:32:02Z) later moved the POSIX base to a .beep/runtime directory under the user home, excluded by W1 as a location cutover with the same sharing, so the /tmp literal holds from 894393a934 until #949."
    - "SECOND ADMISSION-STATE EDIT: the PR deletes the run-user legacy-root branch of reapAdmissionState that #891 added, a reaper scope change that decides no admission. The PR merged as `Merge pull request #894`, which the first pass did not parse (P0 Ruling 5)."
  evidence:
    - "gh pr view 894 --json mergedAt,mergeCommit (verified 2026-10-05)"
    - "packages/tooling/tool/cli/src/internal/repo-run/RuntimeRoot.ts:46 at 894393a934 (`/tmp` on POSIX); :127 (RuntimeRootChoice kind canonical with CANONICAL_RUNTIME_ROOT); :162-164 (the canonical root maps to beep-admit-uid-<uid>); :10-14 (hard cutover; drain before adopting)"
    - "packages/tooling/tool/cli/src/internal/repo-run/QualityScheduler.ts:1567-1575 at 187f72069e (the run-user legacy-root reap branch), absent at 894393a934"
    - "packages/tooling/tool/cli/src/internal/repo-run/RuntimeRoot.ts:48-51 at HEAD 8b7392fe00 (the base under the user home after #949)"
    - "PR #894 body: the change 'removes all environment-dependent and fallible production root selection, so same-user sibling sessions cannot split admission or proof coordination across separate trees'"
    - "goals/ciops-ontology-pipeline/research/decisions.md, 2026-10-05 P0 sitting: Ruling 5 (merge-subject PR numbers parsed)"

