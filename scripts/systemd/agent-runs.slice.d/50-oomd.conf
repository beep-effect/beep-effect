# systemd-oomd guard for admitted agent work: under sustained memory pressure, kill the
# offending run scope instead of grinding the whole workstation into swap (the 2026-08-29
# freeze signature recurred 2026-09-03 with swap fully exhausted). 60% matches this
# workstation's background.slice policy; admitted work is batch — a killed proof is re-runnable
# through yeet, a frozen desktop is not. Ships as a drop-in so it can be removed independently
# of the slice's accounting/ceiling settings.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
