name: Fleet Lane Probe

# Operator-dispatched validation: runs a REAL verification lane on a chosen
# runner label. The default, beep-fleet-heavy, is the Alchemy fleet's heavy
# pool; the probe proves toolbelt parity and cold-start cost on an ephemeral
# worker and doubles as a fleet health probe.

on:
  workflow_dispatch:
    inputs:
      target_label:
        description: Runner label to dispatch the probe onto
        required: false
        type: string
        default: beep-fleet-heavy
      lane:
        description: "Verification lane id (summarize-capable: lint, check, test-unit, test-integration, coverage)"
        required: false
        type: string
        default: test-integration

permissions:
  contents: read

jobs:
  lane-probe:
    name: Lane Probe (${{ inputs.lane }})
    runs-on: ${{ inputs.target_label }}
    timeout-minutes: 120
    env:
      PROBE_LANE: ${{ inputs.lane }}
      TURBO_CACHE: "local:rw"
    steps:
      - name: Report worker identity
        shell: bash
        run: |
          echo "runner: ${RUNNER_NAME:-unset} on $(hostname)"
          nproc
          free -g

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci

      - name: Install typos
        if: inputs.lane == 'lint'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: typos-cli@1.50.3

      - name: Run verification lane
        shell: bash
        run: |
          set -euo pipefail
          bun run beep ci lane "$PROBE_LANE" --summarize

      # The gate-report projection (grouped log, annotations, step summary) and the
      # task-outcomes/v2 record that indexes the job's gate records (goals/ci-gate-reports,
      # decision report-carrier), uploaded red or green. A measurement: it never decides
      # the job, so it continues on error.
      - name: Report gate records
        if: always()
        continue-on-error: true
        uses: ./.github/actions/gate-reports
        with:
          job-name: Lane Probe (${{ inputs.lane }})
          artifact: task-outcomes-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.lane }}

      - name: Upload gate reports and task outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-outcomes-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.lane }}
          path: ${{ runner.temp }}/gate-reports/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
