name: Storybook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storybook:
    # Quality-lane audit D13: the lane body lives in the beep CLI
    # (`beep ci lane storybook`) so it replays locally and decides for itself
    # whether @beep/storybook is in Turbo's affected set; this workflow carries
    # the goals_only gate, the Playwright browser cache, and the artifact
    # upload. Non-required: never add "Storybook" to ruleset 10240248 without
    # a stable green history.
    name: Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          # Only goals_only (scripts/ci-change-profile.sh) gates here. Whether
          # @beep/storybook is affected is the lane's own decision: under
          # --affected it probes Turbo's dependency-aware plan and skips
          # itself when nothing in Storybook's closure changed. Pushes run.
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      # Storybook build + Playwright Chromium + a large monorepo checkout can
      # exhaust the runner's disk ("No space left on device"); the composite
      # action's free-disk cleanup runs before the install.
      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          free-disk: "true"
          turbo-remote-cache: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}

      # Every event restores the browser cache; only trusted pushes save it, so
      # a pull request cannot seed the entry main restores. The install step is
      # a no-op download on a hit and still provisions the OS dependencies.
      - name: Restore Playwright Chromium cache
        if: steps.lane-gate.outputs.should_run == 'true'
        id: playwright-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # --with-deps runs apt-get update, which the image's third-party apt sources
          # (Google Chrome, Microsoft) fail with "Hash Sum mismatch" / "403 Forbidden" for
          # minutes at a time; Playwright ships its own Chromium and its OS dependencies
          # come from the Ubuntu archive, so keep only that source first.
          scripts/ci-prune-apt-sources.sh
          bunx playwright install --with-deps chromium

      - name: Save Playwright Chromium cache
        if: steps.lane-gate.outputs.should_run == 'true' && github.event_name == 'push' && steps.playwright-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Run Storybook lane
        if: steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Same process-group reaping as check.yml: orphaned lane
          # grandchildren must not wedge the job after the lane exits.
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi
          shape_args+=(--summarize)
          run_lane ci lane storybook "${shape_args[@]}"

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Upload Storybook static artifact
        # The affected lane can skip successfully; a build enforces index.html itself.
        if: steps.lane-gate.outputs.should_run == 'true' && hashFiles('apps/storybook/storybook-static/index.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          if-no-files-found: error

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Storybook for this change set."
