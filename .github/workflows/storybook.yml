name: Storybook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build And Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 100
          persist-credentials: false

      # Storybook build + Playwright Chromium + a large monorepo checkout can
      # exhaust the runner's disk ("No space left on device"); the composite
      # action's free-disk cleanup runs before the install.
      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          free-disk: "true"
          turbo-remote-cache: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          repository-secrets: ${{ toJSON(secrets) }}

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        run: bunx turbo run storybook:build --filter=@beep/storybook --summarize

      - name: Run Storybook browser tests
        run: bunx turbo run test:storybook --filter=@beep/storybook

      - name: Prove static artifact
        run: test -f apps/storybook/storybook-static/index.html

      - name: Upload Storybook static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          if-no-files-found: error
