name: Fleet Missed-Event Check

# The standing, read-only check for fleet jobs GitHub queued and no runner
# served: `bun run beep ci fleet-missed-event-check`. Specification:
# goals/infra-alchemy-rebuild/decisions/2026-11-23-standing-missed-event-check.md.
#
# Triggers: the cron, a manual dispatch, and the request of a workflow that
# queues fleet jobs. GitHub throttles the cron to about one run every 7-10
# hours, so the requested workflow runs carry the cadence. The guard job
# skips the check when the latest earlier run that ran its check started less
# than 8 minutes ago (looking past guard-skipped runs); a dispatch always
# checks, and a guard read failure lets the check run.
#
# Security posture: `workflow_run` runs the default branch's copy of this file
# whatever the triggering run's pull request contains. Neither job checks out
# or executes pull-request code: each checkout is the default branch, and the
# triggering run is never read. The guard holds the job token with `actions:
# read` (plus `contents: read` for its checkout), no environment and no App
# token. The check job mints its read-only App token in the `fleet-watch`
# environment, which deploys from the default branch only.
#
# A `workflow_run` trigger takes effect only once it is on the default branch.

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Check, Heavy Admit, Cache Warm]
    types: [requested]

concurrency:
  group: fleet-missed-event-check
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    name: Fleet Missed-Event Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Decide whether this run checks
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run beep ci fleet-missed-event-check --guard

  check:
    name: Fleet Missed-Event Check
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fleet-watch
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Mint the fleet-watch App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FLEET_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_WATCH_APP_PRIVATE_KEY }}
          owner: beep-effect
          repositories: beep-effect
          permission-actions: read
          permission-organization-self-hosted-runners: read
          permission-repository-hooks: read

      - name: Check for missed fleet events
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run beep ci fleet-missed-event-check
