name: Check

on:
  pull_request:
    branches: [main]
    # Default types only. The `ready-for-heavy` label is handled by
    # heavy-admit.yml, so applying it never cancels or re-runs tier 1 here
    # (time-to-certainty B8, ruling 51).
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-size:
    name: PR Size Label
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
      - name: Replace PR size label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun run beep ci pr-size "$PR_NUMBER"

  # Tier-2 admission (time-to-certainty B8, rulings 50–57). One hosted job
  # decides, before the reusable workflow is called, whether the heavy matrix
  # runs (`run`), is called with `admitted: false` so every `Heavy / <lane>`
  # context passes without work (`skip-satisfied`, docs-only diffs), or is held (`hold`:
  # the caller job is skipped, the required contexts stay "Expected", and
  # the PR is merge-blocked until the `ready-for-heavy` label lands). The
  # decision is `bun run beep ci admission`, unit-tested in the CLI; the
  # monitor loop evaluates the same function for its `heavy-not-admitted`
  # settle wait, and heavy-admit.yml runs the same two jobs when the label
  # is applied, so the label never restarts tier 1.
  admission:
    name: Heavy Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      admitted: ${{ steps.decide.outputs.admitted }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          free-disk: "false"

      - name: Decide heavy admission
        id: decide
        shell: bash
        run: bun run beep ci admission --github-output

      # A push after the label admits the new head here, while the previous
      # head's label-triggered `Heavy Admit` matrix may still be queued or
      # running: concurrency groups never cross workflows, so cancel those
      # superseded runs explicitly instead of paying seven heavy lanes twice.
      - name: Cancel superseded Heavy Admit runs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh run list --workflow heavy-admit.yml --branch "$HEAD_REF" --status "$status" \
              --json databaseId,headSha --jq ".[] | select(.headSha != \"$HEAD_SHA\") | .databaseId" \
              | while read -r run_id; do
                  [[ -n "$run_id" ]] || continue
                  echo "cancelling superseded Heavy Admit run $run_id"
                  gh run cancel "$run_id" || true
                done
          done

  heavy:
    name: Heavy
    needs: [admission]
    # `hold` skips the caller so no `Heavy / *` check run exists and the
    # ruleset keeps the PR blocked; never pass `hold` through as
    # `admitted: false`, which would report every lane as passing without work.
    if: ${{ needs.admission.outputs.verdict != 'hold' }}
    permissions:
      contents: read
    uses: beep-effect/beep-effect/.github/workflows/heavy.yml@main
    secrets: inherit
    with:
      admitted: ${{ needs.admission.outputs.verdict == 'run' }}
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    environment: ${{ github.event_name == 'push' && matrix.uses_turbo == 'true' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: repo-sanity
            name: Repo Sanity
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
          - id: ecosystem
            name: Ecosystem Contracts
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
          # Strict @shadcn/lint design-system lane (.oxlintrc.shadcn.json,
          # docs/runbooks/design-system-lint.md). Visible and non-required
          # until a branch-ruleset action promotes it.
          - id: shadcn-lint
            name: Shadcn Lint
            runner: ubuntu-24.04
            timeout_minutes: 20
            uses_turbo: "false"
          - id: codegen
            name: Codegen Drift
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
          # lab-apps-lifecycle P2 (ratified row 10): visible, permanently
          # NON-required labs proof lane. Never add "Labs" to the required
          # ruleset (10240248).
          - id: labs
            name: Labs
            runner: ubuntu-24.04
            timeout_minutes: 40
            uses_turbo: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          if [[ "${{ matrix.id }}" == "codegen" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
            fi
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"
            # Root dependency resolution changes the resolved generator or formatter, so these files are drift inputs.
            if ! grep -Eq '(^packages/drivers/(acp|ecfr|govinfo|runpod)/(openapi[^/]*\.json|spec/|scripts/|src/_generated/)|^packages/tooling/library/codegen-kit/|^packages/tooling/tool/cli/src/commands/Ci/CiLane\.ts$|^packages/_internal/db-admin/drizzle/|^apps/professional-desktop/(package\.json|scripts/sync-migration-bundle\.ts|src/runtime/Migrations\.gen\.ts)$|^(package\.json|bun\.lock)$)' <<< "$changed_files"; then
              should_run=false
            fi
          fi

          # lab-apps-lifecycle P2 (ratified row 10): PR runs of the labs lane
          # only fire for direct labs-path or shared-toolchain changes; push
          # events always run the full labs set.
          if [[ "${{ matrix.id }}" == "labs" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
            fi
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"
            if ! grep -Eq '(^apps/labs/|^\.github/workflows/check\.yml$|^(bun\.lock|package\.json|turbo\.json)$)' <<< "$changed_files"; then
              should_run=false
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: ${{ matrix.uses_turbo }}
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.id }}
          free-disk: "true"
          turbo-remote-cache: ${{ matrix.uses_turbo }}
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && matrix.uses_turbo == 'true' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Check workflow policy
        if: matrix.id == 'repo-sanity' && steps.lane-gate.outputs.should_run == 'true'
        run: bun run beep ci workflow-lint

      - name: Verify regenerate merge-driver bootstrap
        if: matrix.id == 'codegen' && steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run beep worktree prepare
          configured="$(git config --local --get merge.regenerate.driver)"
          [[ "$configured" == *"scripts/regenerate-merge-driver.sh"* ]]
          [[ "$(git check-attr merge -- tsconfig.json)" == "tsconfig.json: merge: regenerate" ]]

      - name: Run verification lane
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          # Lane bodies live in the beep CLI (one-round-loop P0 inversion;
          # same-SHA parity proof recorded in
          # goals/one-round-loop/history/p0-parity-evidence.md). This case
          # block carries only GitHub-context orchestration: the
          # event-dependent shape flags each lane receives.
          #
          # Orphaned lane grandchildren (stuck bun wrappers, daemon sockets)
          # inherit this step's stdio pipes, and the runner does not end a
          # step until those pipes close — so a lane can print success, exit,
          # and still wedge the job for its full timeout (ship-velocity SPEC
          # A7; proven on Docgen run 31797064763). Run each lane in its own
          # session and reap the entire process group once the lane process
          # finishes, success and failure alike.
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi

          shape_args+=(--summarize)

          # Only the ids declared in this job's matrix have arms; the heavy
          # lanes (check, test-integration, coverage, lint-policy) dispatch
          # from heavy.yml.
          case "${{ matrix.id }}" in
            codegen|ecosystem)
              run_lane ci lane "${{ matrix.id }}"
              ;;
            shadcn-lint)
              run_lane ci lane shadcn-lint
              ;;
            repo-sanity)
              if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                run_lane ci lane repo-sanity --changeset-status
              else
                run_lane ci lane repo-sanity
              fi
              ;;
            labs)
              # No --affected: the lane's positive labs filter must not union
              # with an affected selector (lab-apps-lifecycle P2, row 10).
              run_lane ci lane labs --summarize
              ;;
          esac

      - name: Append Turbo summary
        if: matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && always()
        run: |
          bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.id }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping ${{ matrix.name }} for this change set."

      - name: Warn when the intended runner image is stale
        if: always() && matrix.id == 'repo-sanity' && steps.lane-gate.outputs.should_run == 'true'
        run: |
          if ! bun run beep runners bake --check --manifest infra/ci-runners/runner-image.json; then
            echo "::warning::Runner image provenance is stale or invalid. See docs/runbooks/aws-cost-operations.md before the next attended image refresh."
          fi

  lint-shard:
    name: Lint (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [lint-a, lint-b]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.partition }}
          free-disk: "true"
          free-disk-min-gib: "64"
          turbo-remote-cache: "true"
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Run Lint shard
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi
          shape_args+=(--summarize)
          run_lane ci lane lint --partition "${{ matrix.partition }}" "${shape_args[@]}"

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.partition }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Lint (${{ matrix.partition }}) for this change set."

  lint:
    name: Lint
    timeout-minutes: 5
    needs: [lint-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Lint shard
        shell: bash
        run: |
          if [[ "${{ needs.lint-shard.result }}" != "success" ]]; then
            echo "Lint shards finished with result: ${{ needs.lint-shard.result }}"
            exit 1
          fi

  test-unit-shard:
    name: Test Unit (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [repo-cli-1, repo-cli-2, unit-a, unit-b]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.partition }}
          native-pdf-tools: ${{ startsWith(matrix.partition, 'repo-cli') }}
          free-disk: "true"
          free-disk-min-gib: "64"
          turbo-remote-cache: "true"
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Run Test Unit shard
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi
          shape_args+=(--summarize)
          run_lane ci lane test-unit --partition "${{ matrix.partition }}" "${shape_args[@]}"

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.partition }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Test Unit (${{ matrix.partition }}) for this change set."

  test-unit:
    name: Test Unit
    timeout-minutes: 5
    needs: [test-unit-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Test Unit shard
        shell: bash
        run: |
          if [[ "${{ needs.test-unit-shard.result }}" != "success" ]]; then
            echo "Test Unit shards finished with result: ${{ needs.test-unit-shard.result }}"
            exit 1
          fi

  professional-desktop-ipc-stdio:
    name: Professional Desktop IPC Stdio
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          # desktop_rust_relevant (scripts/ci-change-profile.sh) gates the
          # Tauri system packages and the cargo steps: only src-tauri or this
          # workflow's changes compile the crate on pull requests; pushes
          # always compile. The toolchain itself is provisioned whenever the
          # lane runs (see "Setup Rust toolchain" below).
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          rust_should_run="$desktop_rust_relevant"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"

            if [[ -z "$changed_files" ]]; then
              should_run=false
            elif ! printf "%s\n" "$changed_files" | grep -Eq '(^apps/professional-desktop/|^packages/(foundation/|(agents|workspace|shared|epistemic)(/|-)|drivers/(pglite|postgres)/)|^\.github/(actions/setup-monorepo-ci/|workflows/check\.yml$)|^(bun\.lock|package\.json|turbo\.json)$)'; then
              should_run=false
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "rust_should_run=$rust_should_run" >> "$GITHUB_OUTPUT"

      # Tauri v2 Linux prerequisites (webkit2gtk 4.1, gtk, rsvg, appindicator)
      # for the cargo steps; build.rs also compiles the WebKit web extension
      # against webkit2gtk-web-extension-4.1.
      - name: Install Tauri Linux system dependencies
        if: steps.lane-gate.outputs.should_run == 'true' && steps.lane-gate.outputs.rust_should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The image's third-party apt sources (Google Chrome, Microsoft) fail apt-get
          # update with "Hash Sum mismatch" / "403 Forbidden" for minutes at a time;
          # keep only the Ubuntu archive, which is where these packages come from.
          scripts/ci-prune-apt-sources.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            build-essential \
            pkg-config

      # The IPC proof needs rustc on every run: build-sidecar.ts and
      # sidecar-ipc-stdio.test.ts read the host target triple from `rustc -vV`,
      # and the Rust that happens to ship on the hosted image is not a
      # contract. The toolchain is therefore provisioned on should_run alone
      # (rust-cache keeps it to seconds); only the apt packages and the cargo
      # steps wait on the crate gate.
      - name: Setup Rust toolchain
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy
          # Caches ~/.cargo and src-tauri/target keyed on Cargo.lock.
          cache: true
          cache-workspaces: apps/professional-desktop/src-tauri

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"

      # Builds the Bun sidecar first; tauri-build's build.rs requires the
      # externalBin binary to exist, so the cargo steps run after this proof.
      - name: Run desktop IPC stdio proof
        if: steps.lane-gate.outputs.should_run == 'true'
        run: bun run beep ci lane desktop-ipc

      # Quality-lane audit D15: the crate was never compiled on PR or push
      # (only release-desktop.yml built it at tag time).
      - name: Check Rust crate
        if: steps.lane-gate.outputs.should_run == 'true' && steps.lane-gate.outputs.rust_should_run == 'true'
        working-directory: apps/professional-desktop/src-tauri
        run: cargo check --locked

      - name: Lint Rust crate
        if: steps.lane-gate.outputs.should_run == 'true' && steps.lane-gate.outputs.rust_should_run == 'true'
        working-directory: apps/professional-desktop/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping desktop IPC stdio proof for this change set."

  property-laws:
    # one-round-loop P1 (D3): schema property laws for affected packages at a
    # 400-run floor. Lands NON-required; the required flip (ruleset 10240248
    # addition) is a P4 close criterion after a stable green history. The
    # nightly sweep (property-laws-nightly.yml) covers ALL suites at 1000+.
    name: Property Laws
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          turbo-remote-cache: "true"
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Run property laws lane
        shell: bash
        run: |
          set -euo pipefail
          shape_args=()

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi

          shape_args+=(--summarize)

          bun run beep ci lane property "${shape_args[@]}"

      - name: Append Turbo summary
        if: always()
        run: bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

  fallow-advisory:
    name: Fallow Advisory Envelopes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Determine audit base
        id: base
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          fetch_status=0
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}" || fetch_status=$?
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_ref="$BEFORE_SHA"
            git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1 || git fetch --quiet --no-tags --depth=100 origin "$base_ref" || fetch_status=$?
          else
            base_ref="HEAD~1"
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_fetch_status=$fetch_status" >> "$GITHUB_OUTPUT"

      # This job only needs the monorepo toolchain plus Fallow, but the shared
      # setup can still exhaust the default runner image, so the composite
      # action clears the large preinstalled stacks before installing.
      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          free-disk: "true"
          turbo-remote-cache: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}

      - name: Run Fallow envelopes
        id: fallow
        shell: bash
        run: |
          # Lane body (blocking audit/dead-code/health, advisory sweep, status.md
          # accounting, envelope existence) lives in the beep CLI; envelope
          # validation, the step summary, and artifact upload stay below.
          bun run beep ci lane fallow --base "${{ steps.base.outputs.base_ref }}"

      - name: Validate Fallow envelopes
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for lane in audit dead-code health; do
            test -s ".beep/fallow/${lane}.check.json"
          done

          for lane in boundaries flags security fix-preview; do
            bun run beep quality fallow envelope-check ".beep/fallow/${lane}.advisory.json" \
              --require schemaVersion,status,command,exitStatus,baseRef,rawOutputRef \
              --expect-subcommand "$lane" \
              --expect-report-path ".beep/fallow/${lane}.advisory.json" \
              --require-raw-output
          done

          for lane in audit dead-code health; do
            bun run beep quality fallow envelope-check ".beep/fallow/${lane}.check.json" \
              --require schemaVersion,status,command,exitStatus,baseRef,rawOutputRef \
              --expect-subcommand "$lane" \
              --expect-report-path ".beep/fallow/${lane}.check.json" \
              --require-raw-output
          done

      - name: Append Fallow summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Fallow Envelopes"
            echo
            echo "- base ref: \`${{ steps.base.outputs.base_ref }}\`"
            echo "- base fetch status: \`${{ steps.base.outputs.base_fetch_status }}\`"
            echo
            cat .beep/fallow/status.md 2>/dev/null || echo "- lane status: unavailable"
            echo
            jq -r '"- audit envelope status: `\(.status // "unknown")`\n- audit tool exit status: `\(.exitStatus // "unknown")`\n- audit finding count: `\(.report.findingCount // "unknown")`\n- audit introduced findings: `\(.findingAttributionSummary.introduced // "unknown")`\n- audit inherited-adjacent findings: `\(.findingAttributionSummary.inheritedAdjacent // "unknown")`"' .beep/fallow/audit.check.json 2>/dev/null || echo "- audit summary: unavailable"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fallow envelopes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 7
          name: fallow-envelopes-${{ github.event_name }}-${{ github.run_attempt }}
          path: .beep/fallow/**
          if-no-files-found: error

  knip:
    name: Knip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          use-node: "false"

      - name: Run Knip regression gate
        run: bun run beep ci lane knip

  jsdoc-ratchet:
    name: JSDoc Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          use-node: "false"

      - name: Run JSDoc inventory ratchet
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          bun run beep ci lane jsdoc-ratchet
          total_seconds="$SECONDS"
          {
            echo "### JSDoc Ratchet"
            echo
            echo "- command: \`bun run beep ci lane jsdoc-ratchet\` (inventory + ratchet)"
            echo "- total wall time: \`${total_seconds}s\`"
          } >> "$GITHUB_STEP_SUMMARY"

  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Determine commit range
        id: range
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mode=range
          from_ref=""
          to_ref="HEAD"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Lint only the pull request's own commits. The checkout is the merge
            # ref and `pull_request.base.sha` is frozen when the PR opens, so
            # base.sha..HEAD also linted every commit the base branch gained
            # since — including the bodies GitHub generates for squash merges.
            to_ref="${PR_HEAD_SHA:?missing pull request head sha}"
            base_branch="${PR_BASE_REF:-main}"
            git fetch --quiet --no-tags origin "+refs/heads/${base_branch}:refs/remotes/origin/${base_branch}"
            git rev-parse --verify "${to_ref}^{commit}" >/dev/null 2>&1 || git fetch --quiet --no-tags origin "$to_ref"
            from_ref="$(git merge-base "refs/remotes/origin/${base_branch}" "$to_ref")"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            from_ref="$BEFORE_SHA"
            to_ref="${GITHUB_SHA:-HEAD}"
            git rev-parse --verify "${from_ref}^{commit}" >/dev/null 2>&1 || git fetch --quiet --no-tags --depth=1 origin "$from_ref"
            git rev-parse --verify "${to_ref}^{commit}" >/dev/null 2>&1 || git fetch --quiet --no-tags --depth=1 origin "$to_ref"
          else
            mode=last
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "from_ref=$from_ref" >> "$GITHUB_OUTPUT"
          echo "to_ref=$to_ref" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          use-node: "false"

      - name: Run commitlint
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.range.outputs.mode }}" == "range" ]]; then
            bun run beep ci lane commitlint --from "${{ steps.range.outputs.from_ref }}" --to "${{ steps.range.outputs.to_ref }}"
          else
            bun run beep ci lane commitlint --last
          fi

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Authenticate Docker Hub when configured
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Gitleaks
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          log_opts="-1"
          config_path=".gitleaks.toml"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_opts="origin/${GITHUB_BASE_REF:-main}..HEAD"

            # The secret-scanning gate must NOT trust a PR-controlled scanner
            # config: a PR could broaden the allowlist (or add .gitleaksignore
            # fingerprints) in the SAME change to hide a planted secret and still
            # pass the required check. For pull_request runs, scan with the base
            # branch's already-reviewed config + ignore file instead of the PR's.
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            if git cat-file -e "${base_ref}:.gitleaks.toml" 2>/dev/null; then
              git show "${base_ref}:.gitleaks.toml" > .gitleaks.base.toml
              config_path=".gitleaks.base.toml"
            fi
            # Pin .gitleaksignore to the base too (gitleaks auto-reads it from the
            # source root): use the base version, or none if the base has none, so
            # a PR cannot add suppression fingerprints to its own scan.
            if git cat-file -e "${base_ref}:.gitleaksignore" 2>/dev/null; then
              git show "${base_ref}:.gitleaksignore" > .gitleaksignore
            else
              rm -f .gitleaksignore
            fi
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="${BEFORE_SHA}..HEAD"
          fi

          # Global allowlists and targetRules require Gitleaks >= 8.25.0.
          # Pin v8.30.1, matching the verified local scanner.
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config="/repo/${config_path}" --log-opts="$log_opts" --redact --no-banner

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Bun for installer mitigation proof
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: "true"

      - name: Setup Node.js for installer mitigation proof
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify owning-package ONNX installer regression before the OSV exception
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun x --no-install vitest run --root packages/drivers/face-detection test/OnnxRuntimeInstall.test.ts

      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=bun.lock
            --config=osv-scanner.toml

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure

      # Exercise the documented read permission with GITHUB_TOKEN on PRs too,
      # before relying on these governance reads after a main push.
      - name: Check hosted settings policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run beep ci ruleset --check
          bun run beep ci settings --check
          bun run beep ci held-group

  nix:
    name: Nix Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix (read-only)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: beep-effect
        continue-on-error: true

      - name: Run Nix checks
        run: bun run beep ci lane nix

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"

      - name: Authenticate Docker Hub when configured
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Run SAST
        run: |
          # Semgrep runs the four registry packs (p/typescript, p/javascript,
          # p/security-audit, p/secrets) plus the vendored, offline rules in
          # .semgrep/first-party.yml, with --error so findings fail the lane.
          # Config is byte-identical to the local replay (`beep ci lane sast`)
          # — no SEMGREP_APP_TOKEN, which would only exist in CI and break that
          # parity. See goals/one-round-loop/history/p0-parity-evidence.md §2.
          bun run beep ci lane sast
