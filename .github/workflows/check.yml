name: Check

on:
  pull_request:
    branches: [main]
    # Default types only. The `ready-for-heavy` label is handled by
    # heavy-admit.yml, so applying it never cancels or re-runs tier 1 here
    # (time-to-certainty B8, ruling 51).
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The event payload is fixed across jobs and partial reruns. Never bind
  # coverage identity or affected scope to a freshly fetched moving ref.
  BEEP_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  pr-size:
    name: PR Size Label
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
      - name: Replace PR size label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun run beep ci pr-size "$PR_NUMBER"

  # Tier-2 admission (time-to-certainty B8, rulings 50–57). One hosted job
  # decides, before the reusable workflow is called, whether the heavy matrix
  # runs (`run`), is called with `admitted: false` so every `Heavy / <lane>`
  # context passes without work (`skip-satisfied`, docs-only diffs), or is held (`hold`:
  # the caller job is skipped, the required contexts stay "Expected", and
  # the PR is merge-blocked until the `ready-for-heavy` label lands). The
  # decision is `bun run beep ci admission`, unit-tested in the CLI; the
  # monitor loop evaluates the same function for its `heavy-not-admitted`
  # settle wait, and heavy-admit.yml runs the same two jobs when the label
  # is applied, so the label never restarts tier 1.
  admission:
    name: Heavy Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      admitted: ${{ steps.decide.outputs.admitted }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
      legacy_coverage: ${{ steps.coverage-rollout.outputs.legacy_coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          free-disk: "false"

      - name: Decide heavy admission
        id: decide
        shell: bash
        run: bun run beep ci admission --github-output

      # Inspect the reusable revision GitHub actually resolved for this run,
      # rather than this PR's edited workflow or a moving main branch.
      - name: Determine coverage rollout context
        id: coverage-rollout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          heavy_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '[.referenced_workflows[]? | select(.path == "beep-effect/beep-effect/.github/workflows/heavy.yml@main" and .ref == "refs/heads/main")] | if length == 1 then .[0].sha else error("Expected exactly one resolved trusted Heavy workflow") end')"
          [[ "$heavy_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --no-tags origin "$heavy_sha"
          heavy_file="${RUNNER_TEMP}/coverage-heavy-${GITHUB_RUN_ID}.yml"
          git show "${heavy_sha}:.github/workflows/heavy.yml" > "$heavy_file"
          bun --eval '
            import { workflowJobContexts } from "@beep/repo-cli/commands/Ci";
            import * as A from "effect/Array";
            import * as Effect from "effect/Effect";
            await Effect.promise(() => Bun.file(Bun.argv[1]).text()).pipe(
              Effect.flatMap((text) => workflowJobContexts("heavy.yml", text)),
              Effect.map(A.contains("Heavy / Coverage Regression")),
              Effect.tap((legacy) => Effect.sync(() => console.log(`legacy_coverage=${legacy}`))),
              Effect.runPromise
            );
          ' "$heavy_file" >> "$GITHUB_OUTPUT"

      # A push after the label admits the new head here, while the previous
      # head's label-triggered `Heavy Admit` matrix may still be queued or
      # running: concurrency groups never cross workflows, so cancel those
      # superseded runs explicitly instead of paying seven heavy lanes twice.
      - name: Cancel superseded Heavy Admit runs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh run list --workflow heavy-admit.yml --branch "$HEAD_REF" --status "$status" \
              --json databaseId,headSha --jq ".[] | select(.headSha != \"$HEAD_SHA\") | .databaseId" \
              | while read -r run_id; do
                  [[ -n "$run_id" ]] || continue
                  echo "cancelling superseded Heavy Admit run $run_id"
                  gh run cancel "$run_id" || true
                done
          done

  heavy:
    name: Heavy
    needs: [admission]
    # `hold` skips the caller so no `Heavy / *` check run exists and the
    # ruleset keeps the PR blocked; never pass `hold` through as
    # `admitted: false`, which would report every lane as passing without work.
    if: ${{ needs.admission.outputs.verdict != 'hold' }}
    permissions:
      contents: read
    uses: beep-effect/beep-effect/.github/workflows/heavy.yml@main
    secrets: inherit
    with:
      admitted: ${{ needs.admission.outputs.verdict == 'run' }}
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    environment: ${{ github.event_name == 'push' && matrix.uses_turbo == 'true' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: repo-sanity
            name: Repo Sanity
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
          - id: ecosystem
            name: Ecosystem Contracts
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
          # Strict @shadcn/lint design-system lane (.oxlintrc.shadcn.json,
          # docs/runbooks/design-system-lint.md). Visible and non-required
          # until a branch-ruleset action promotes it.
          - id: shadcn-lint
            name: Shadcn Lint
            runner: ubuntu-24.04
            timeout_minutes: 20
            uses_turbo: "false"
          - id: codegen
            name: Codegen Drift
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
          # lab-apps-lifecycle P2 (ratified row 10): visible, permanently
          # NON-required labs proof lane. Never add "Labs" to the required
          # ruleset (10240248).
          - id: labs
            name: Labs
            runner: ubuntu-24.04
            timeout_minutes: 40
            uses_turbo: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "$BEEP_COVERAGE_BASE_SHA")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          if [[ "${{ matrix.id }}" == "codegen" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
            fi
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"
            # Root dependency resolution changes the resolved generator or formatter, so these files are drift inputs.
            if ! grep -Eq '(^packages/drivers/(acp|ecfr|govinfo|runpod)/(openapi[^/]*\.json|spec/|scripts/|src/_generated/)|^packages/tooling/library/codegen-kit/|^packages/tooling/tool/cli/src/commands/Ci/CiLane\.ts$|^packages/_internal/db-admin/drizzle/|^apps/professional-desktop/(package\.json|scripts/sync-migration-bundle\.ts|src/runtime/Migrations\.gen\.ts)$|^(package\.json|bun\.lock)$)' <<< "$changed_files"; then
              should_run=false
            fi
          fi

          # Labs build/check retain their direct-path gate. Coverage selection
          # still runs for transitive lab dependents and emits an empty manifest
          # when no lab test owners are selected.
          labs_checks=true
          if [[ "${{ matrix.id }}" == "labs" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "origin/${GITHUB_BASE_REF:-main}...HEAD")"
            if ! grep -Eq '(^apps/labs/|^\.github/workflows/check\.yml$|^(bun\.lock|package\.json|turbo\.json)$)' <<< "$changed_files"; then
              labs_checks=false
            fi
          fi
          echo "labs_checks=$labs_checks" >> "$GITHUB_OUTPUT"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          node-version: ${{ matrix.id == 'labs' && '22.23.4' || '' }}
          cache-turbo: ${{ matrix.uses_turbo }}
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.id }}
          free-disk: "true"
          turbo-remote-cache: ${{ matrix.uses_turbo }}
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && matrix.uses_turbo == 'true' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          r2-enabled: ${{ vars.TURBO_R2_ENABLED }}
          r2-endpoint: ${{ vars.TURBO_R2_ENDPOINT }}
          r2-bucket: ${{ vars.TURBO_R2_BUCKET }}
          r2-access-key-id: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_ACCESS_KEY_ID || (github.event_name != 'push' && secrets.TURBO_R2_READ_ACCESS_KEY_ID || '') }}
          r2-secret-access-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_SECRET_ACCESS_KEY || (github.event_name != 'push' && secrets.TURBO_R2_READ_SECRET_ACCESS_KEY || '') }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Check workflow policy
        if: matrix.id == 'repo-sanity' && steps.lane-gate.outputs.should_run == 'true'
        run: bun run beep ci workflow-lint

      - name: Verify regenerate merge-driver bootstrap
        if: matrix.id == 'codegen' && steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run beep worktree prepare
          configured="$(git config --local --get merge.regenerate.driver)"
          [[ "$configured" == *"scripts/regenerate-merge-driver.sh"* ]]
          [[ "$(git check-attr merge -- tsconfig.json)" == "tsconfig.json: merge: regenerate" ]]

      - name: Run verification lane
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          # Lane bodies live in the beep CLI (one-round-loop P0 inversion;
          # same-SHA parity proof recorded in
          # goals/one-round-loop/history/p0-parity-evidence.md). This case
          # block carries only GitHub-context orchestration: the
          # event-dependent shape flags each lane receives.
          #
          # Orphaned lane grandchildren (stuck bun wrappers, daemon sockets)
          # inherit this step's stdio pipes, and the runner does not end a
          # step until those pipes close — so a lane can print success, exit,
          # and still wedge the job for its full timeout (ship-velocity SPEC
          # A7; proven on Docgen run 31797064763). Run each lane in its own
          # session and reap the entire process group once the lane process
          # finishes, success and failure alike.
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=(--base "$BEEP_COVERAGE_BASE_SHA")

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected)
          fi

          shape_args+=(--summarize)

          # Only the ids declared in this job's matrix have arms; the heavy
          # lanes (check, test-integration, lint-policy) dispatch
          # from heavy.yml.
          case "${{ matrix.id }}" in
            codegen|ecosystem)
              run_lane ci lane "${{ matrix.id }}"
              ;;
            shadcn-lint)
              run_lane ci lane shadcn-lint
              ;;
            repo-sanity)
              if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                run_lane ci lane repo-sanity --changeset-status
              else
                run_lane ci lane repo-sanity
              fi
              ;;
            labs)
              labs_args=()
              if [[ "${{ steps.lane-gate.outputs.labs_checks }}" != "true" ]]; then
                labs_args+=(--coverage-only)
              fi
              run_lane ci lane labs --coverage-output .beep/ci-coverage/labs "${labs_args[@]}" "${shape_args[@]}"
              ;;
          esac

      - name: Upload Labs coverage evidence
        if: matrix.id == 'labs' && steps.lane-gate.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ github.run_id }}-${{ github.run_attempt }}-labs
          path: .beep/ci-coverage/labs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Append Turbo summary
        if: matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && always()
        run: |
          bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.id }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping ${{ matrix.name }} for this change set."

      - name: Warn when the intended runner image is stale
        if: always() && matrix.id == 'repo-sanity' && steps.lane-gate.outputs.should_run == 'true'
        run: |
          if ! bun run beep runners bake --check --manifest infra/ci-runners/runner-image.json; then
            echo "::warning::Runner image provenance is stale or invalid. See docs/runbooks/aws-cost-operations.md before the next attended image refresh."
          fi

      - name: Stop R2 cache adapter
        if: always()
        shell: bash
        run: |
          if [[ -x infra/r2-cache/adapter.sh ]]; then
            infra/r2-cache/adapter.sh stop-ci
          fi

  lint-shard:
    name: Lint (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [lint-a, lint-b]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.partition }}
          free-disk: "true"
          free-disk-min-gib: "64"
          turbo-remote-cache: "true"
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          r2-enabled: ${{ vars.TURBO_R2_ENABLED }}
          r2-endpoint: ${{ vars.TURBO_R2_ENDPOINT }}
          r2-bucket: ${{ vars.TURBO_R2_BUCKET }}
          r2-access-key-id: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_ACCESS_KEY_ID || (github.event_name != 'push' && secrets.TURBO_R2_READ_ACCESS_KEY_ID || '') }}
          r2-secret-access-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_SECRET_ACCESS_KEY || (github.event_name != 'push' && secrets.TURBO_R2_READ_SECRET_ACCESS_KEY || '') }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Run Lint shard
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi
          shape_args+=(--summarize)
          run_lane ci lane lint --partition "${{ matrix.partition }}" "${shape_args[@]}"

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.partition }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Lint (${{ matrix.partition }}) for this change set."

      - name: Stop R2 cache adapter
        if: always()
        shell: bash
        run: |
          if [[ -x infra/r2-cache/adapter.sh ]]; then
            infra/r2-cache/adapter.sh stop-ci
          fi

  lint:
    name: Lint
    timeout-minutes: 5
    needs: [lint-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Lint shard
        shell: bash
        run: |
          if [[ "${{ needs.lint-shard.result }}" != "success" ]]; then
            echo "Lint shards finished with result: ${{ needs.lint-shard.result }}"
            exit 1
          fi

  test-unit-shard:
    name: Test Unit (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [repo-cli-1, repo-cli-2, unit-a, unit-b]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "$BEEP_COVERAGE_BASE_SHA")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          node-version: "22.23.4"
          cache-turbo: "true"
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.partition }}
          native-pdf-tools: ${{ startsWith(matrix.partition, 'repo-cli') }}
          free-disk: "true"
          free-disk-min-gib: "64"
          turbo-remote-cache: "true"
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          r2-enabled: ${{ vars.TURBO_R2_ENABLED }}
          r2-endpoint: ${{ vars.TURBO_R2_ENDPOINT }}
          r2-bucket: ${{ vars.TURBO_R2_BUCKET }}
          r2-access-key-id: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_ACCESS_KEY_ID || (github.event_name != 'push' && secrets.TURBO_R2_READ_ACCESS_KEY_ID || '') }}
          r2-secret-access-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_SECRET_ACCESS_KEY || (github.event_name != 'push' && secrets.TURBO_R2_READ_SECRET_ACCESS_KEY || '') }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      - name: Verify coverage runtime features
        if: steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the existing coverage runtime: newer Node versions have a
          # native escaped-key round-trip defect. Float16Array is scoped to test
          # workers by vitest.shared.ts, never granted through job-wide NODE_OPTIONS.
          node --js-float16array -p "'Node ' + process.versions.node + ', ' + Float16Array.name"

      - name: Run Test Unit shard
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=(--base "$BEEP_COVERAGE_BASE_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected)
          fi
          shape_args+=(--summarize)
          run_lane ci lane test-unit --partition "${{ matrix.partition }}" --coverage-output ".beep/ci-coverage/${{ matrix.partition }}" "${shape_args[@]}"

      - name: Upload Unit coverage evidence
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: .beep/ci-coverage/${{ matrix.partition }}/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.partition }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Test Unit (${{ matrix.partition }}) for this change set."

      - name: Stop R2 cache adapter
        if: always()
        shell: bash
        run: |
          if [[ -x infra/r2-cache/adapter.sh ]]; then
            infra/r2-cache/adapter.sh stop-ci
          fi

  test-unit:
    name: Test Unit
    timeout-minutes: 5
    needs: [test-unit-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Test Unit shard
        shell: bash
        run: |
          if [[ "${{ needs.test-unit-shard.result }}" != "success" ]]; then
            echo "Test Unit shards finished with result: ${{ needs.test-unit-shard.result }}"
            exit 1
          fi

  coverage-regression:
    # Keep this PR's new artifact proof distinct while @main still runs its
    # legacy producer. After main retires that producer this becomes the exact
    # existing coverage context, without a ruleset edit or duplicate check name.
    name: ${{ needs.admission.outputs.legacy_coverage == 'true' && 'Coverage Artifact Migration' || 'Heavy / Coverage Regression' }}
    needs: [admission, test-unit, verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine comparison execution
        id: lane-gate
        shell: bash
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          LEGACY_COVERAGE: ${{ needs.admission.outputs.legacy_coverage }}
        run: |
          set -euo pipefail
          [[ "$ADMISSION_RESULT" == "success" ]]
          [[ "$LEGACY_COVERAGE" == "true" || "$LEGACY_COVERAGE" == "false" ]]
          [[ "$UNIT_RESULT" == "success" ]]
          eval "$(scripts/ci-change-profile.sh "$BEEP_COVERAGE_BASE_SHA")"
          echo "should_run=$([[ "$goals_only" == "true" ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Setup comparison toolchain
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          node-version: "22.23.4"
          cache-turbo: "false"
          cache-write: "false"
          free-disk: "true"

      # An unrelated verification matrix failure is advisory here, but the
      # latest Labs execution must succeed even when a partial rerun leaves an
      # older successful artifact available.
      - name: Authenticate latest Labs execution
        id: labs-producer
        if: steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_directory="$(mktemp -d "${RUNNER_TEMP}/coverage-producer-jobs.XXXXXX")"
          jobs_file="${RUNNER_TEMP}/coverage-producer-jobs.json"
          # Read every attempt explicitly: successful carried records have new
          # attempt numbers, but the original execution must remain available.
          for ((attempt=1; attempt<=GITHUB_RUN_ATTEMPT; attempt++)); do
            gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${attempt}/jobs?per_page=100" > "${jobs_directory}/${attempt}.json"
          done
          jq -s 'add' "${jobs_directory}/"*.json > "$jobs_file"
          labs_attempt="$(jq -er --argjson current "$GITHUB_RUN_ATTEMPT" '
            [.[].jobs[] | select(.name == "Labs")] as $jobs
            | if ($jobs | length) == 0 or any($jobs[];
                (.run_attempt | type) != "number" or .run_attempt < 1
                or (.run_attempt | floor) != .run_attempt or .run_attempt > $current)
              then error("Missing, malformed or future Labs execution") else $jobs end
            | if (map(.run_attempt) | length) != (map(.run_attempt) | unique | length)
              then error("Duplicate Labs attempt records") else . end
            | (map(.run_attempt) | max) as $latest
            | map(select(.run_attempt == $latest))
            | if length != 1 then error("Ambiguous latest Labs execution") else .[0] end
            | if .status != "completed" or .conclusion != "success"
              then error("Latest Labs execution did not succeed") else . end
            | . as $latestJob
            | if (.started_at | type) != "string" or .started_at == ""
                or (.completed_at | type) != "string" or .completed_at == ""
              then error("Missing Labs execution timestamps") else . end
            # Partial reruns can carry successful job records into a new
            # attempt without executing or uploading again. Their timestamps
            # identify the original execution whose artifact must be required.
            | [$jobs[] | select(.started_at == $latestJob.started_at
                and .completed_at == $latestJob.completed_at)] as $execution
            | if any($execution[]; .status != "completed" or .conclusion != "success")
              then error("Inconsistent carried Labs execution") else $execution end
            | (map(.run_attempt) | min) as $producer
            | map(select(.run_attempt == $producer))
            | if length != 1 then error("Ambiguous original Labs execution") else .[0].run_attempt end
          ' "$jobs_file")"
          echo "attempt=$labs_attempt" >> "$GITHUB_OUTPUT"

      - name: Download coverage evidence
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-coverage-${{ github.run_id }}-*
          path: .beep/ci-coverage-inputs
          merge-multiple: false

      - name: Compare coverage evidence
        if: steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        env:
          LABS_PRODUCER_ATTEMPT: ${{ steps.labs-producer.outputs.attempt }}
        run: |
          set -euo pipefail
          # Require the exact manifest authenticated above; an older successful
          # Labs artifact cannot mask a failed or missing newer producer.
          labs_manifest=".beep/ci-coverage-inputs/unit-coverage-${GITHUB_RUN_ID}-${LABS_PRODUCER_ATTEMPT}-labs/manifest.json"
          jq -e --arg run "$GITHUB_RUN_ID" --argjson attempt "$LABS_PRODUCER_ATTEMPT" '
            .partitionId == "labs" and .identity.runId == $run and .identity.runAttempt == $attempt
          ' "$labs_manifest" > /dev/null
          shape_args=(--base "$BEEP_COVERAGE_BASE_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected)
          fi
          bun run beep ci lane coverage --compare-only --coverage-input .beep/ci-coverage-inputs "${shape_args[@]}"

      - name: Skip comparison
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Coverage comparison passes without work for this change set."

  professional-desktop-ipc-stdio:
    name: Professional Desktop IPC Stdio
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          # desktop_rust_relevant (scripts/ci-change-profile.sh) gates the
          # Tauri system packages and the cargo steps: only src-tauri or this
          # workflow's changes compile the crate on pull requests; pushes
          # always compile. The toolchain itself is provisioned whenever the
          # lane runs (see "Setup Rust toolchain" below).
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          rust_should_run="$desktop_rust_relevant"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"

            if [[ -z "$changed_files" ]]; then
              should_run=false
            elif ! printf "%s\n" "$changed_files" | grep -Eq '(^apps/professional-desktop/|^packages/(foundation/|(agents|workspace|shared|epistemic)(/|-)|drivers/(pglite|postgres)/)|^\.github/(actions/setup-monorepo-ci/|workflows/check\.yml$)|^(bun\.lock|package\.json|turbo\.json)$)'; then
              should_run=false
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "rust_should_run=$rust_should_run" >> "$GITHUB_OUTPUT"

      # Tauri v2 Linux prerequisites (webkit2gtk 4.1, gtk, rsvg, appindicator)
      # for the cargo steps; build.rs also compiles the WebKit web extension
      # against webkit2gtk-web-extension-4.1.
      - name: Install Tauri Linux system dependencies
        if: steps.lane-gate.outputs.should_run == 'true' && steps.lane-gate.outputs.rust_should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The image's third-party apt sources (Google Chrome, Microsoft) fail apt-get
          # update with "Hash Sum mismatch" / "403 Forbidden" for minutes at a time;
          # keep only the Ubuntu archive, which is where these packages come from.
          scripts/ci-prune-apt-sources.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            build-essential \
            pkg-config

      # The IPC proof needs rustc on every run: build-sidecar.ts and
      # sidecar-ipc-stdio.test.ts read the host target triple from `rustc -vV`,
      # and the Rust that happens to ship on the hosted image is not a
      # contract. The toolchain is therefore provisioned on should_run alone
      # (rust-cache keeps it to seconds); only the apt packages and the cargo
      # steps wait on the crate gate.
      - name: Setup Rust toolchain
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy
          # Caches ~/.cargo and src-tauri/target keyed on Cargo.lock.
          cache: true
          cache-workspaces: apps/professional-desktop/src-tauri

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"

      # Builds the Bun sidecar first; tauri-build's build.rs requires the
      # externalBin binary to exist, so the cargo steps run after this proof.
      - name: Run desktop IPC stdio proof
        if: steps.lane-gate.outputs.should_run == 'true'
        run: bun run beep ci lane desktop-ipc

      # Quality-lane audit D15: the crate was never compiled on PR or push
      # (only release-desktop.yml built it at tag time).
      - name: Check Rust crate
        if: steps.lane-gate.outputs.should_run == 'true' && steps.lane-gate.outputs.rust_should_run == 'true'
        working-directory: apps/professional-desktop/src-tauri
        run: cargo check --locked

      - name: Lint Rust crate
        if: steps.lane-gate.outputs.should_run == 'true' && steps.lane-gate.outputs.rust_should_run == 'true'
        working-directory: apps/professional-desktop/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping desktop IPC stdio proof for this change set."

  property-laws:
    # one-round-loop P1 (D3): schema property laws for affected packages at a
    # 400-run floor. Lands NON-required; the required flip (ruleset 10240248
