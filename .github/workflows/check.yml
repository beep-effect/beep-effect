name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-size:
    name: PR Size Label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      pull-requests: write
    steps:
      - name: Label PR by size
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const count = files.length;
            let label = 'size/S';
            if (count > 50) label = 'size/XL';
            else if (count > 20) label = 'size/L';
            else if (count > 10) label = 'size/M';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });
            await core.summary.addRaw(`Changed files: ${count}; applied label: ${label}`).write();
  heavy:
    name: Heavy
    permissions:
      contents: read
    uses: beep-effect/beep-effect/.github/workflows/heavy.yml@main
    secrets: inherit

  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: repo-sanity
            name: Repo Sanity
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
            install_typos: "false"
          - id: ecosystem
            name: Ecosystem Contracts
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
            install_typos: "false"
          - id: codegen
            name: Codegen Drift
            runner: ubuntu-24.04
            timeout_minutes: 30
            uses_turbo: "false"
            install_typos: "false"
          # lab-apps-lifecycle P2 (ratified row 10): visible, permanently
          # NON-required labs proof lane. Never add "Labs" to the required
          # ruleset (10240248).
          - id: labs
            name: Labs
            runner: ubuntu-24.04
            timeout_minutes: 40
            uses_turbo: "true"
            install_typos: "true"
    env:
      # Same-repository pull requests receive read-only cache access; forks
      # stay local-only. Trusted main pushes receive read-write access.
      TURBO_API: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_API || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_API || '' }}
      TURBO_TOKEN: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_TEAM || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_TEAM || '' }}
      TURBO_CACHE: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && 'local:rw,remote:rw' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && 'local:rw,remote:r' || 'local:rw' }}
      # Stream task logs line-by-line so a wedged lane task shows its last
      # live output instead of buffering everything behind a group header.
      TURBO_LOG_ORDER: stream
      DATABASE_URL: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
      DATABASE_URL_UNPOOLED: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
      EMAIL_RESEND_API_KEY: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
      AUTH_SECRET: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
      BETTER_AUTH_SECRET: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
      BETTER_AUTH_URL: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
      SECURITY_TRUSTED_ORIGINS: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
      LIVEBLOCKS_SECRET_KEY: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          if [[ "${{ matrix.id }}" == "codegen" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
            fi
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"
            # Root dependency resolution changes the resolved generator or formatter, so these files are drift inputs.
            if ! grep -Eq '(^packages/drivers/(acp|ecfr|govinfo|runpod)/(openapi[^/]*\.json|spec/|scripts/|src/_generated/)|^packages/tooling/library/codegen-kit/|^packages/tooling/tool/cli/src/commands/Ci/CiLane\.ts$|^packages/_internal/db-admin/drizzle/|^apps/professional-desktop/(package\.json|scripts/sync-migration-bundle\.ts|src/runtime/Migrations\.gen\.ts)$|^(package\.json|bun\.lock)$)' <<< "$changed_files"; then
              should_run=false
            fi
          fi

          # lab-apps-lifecycle P2 (ratified row 10): PR runs of the labs lane
          # only fire for direct labs-path or shared-toolchain changes; push
          # events always run the full labs set.
          if [[ "${{ matrix.id }}" == "labs" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
            fi
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"
            if ! grep -Eq '(^apps/labs/|^\.github/workflows/check\.yml$|^(bun\.lock|package\.json|turbo\.json)$)' <<< "$changed_files"; then
              should_run=false
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Free runner disk for verification lanes
        # Destructive image cleanup runs on ephemeral hosted images (GitHub-
        # hosted and lookalikes); owned/workstation runners (beep- prefix)
        # keep their filesystem.
        if: steps.lane-gate.outputs.should_run == 'true' && runner.os == 'Linux' && !startsWith(runner.name, 'beep-')
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: ${{ matrix.uses_turbo }}
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.id }}

      - name: Install typos
        if: steps.lane-gate.outputs.should_run == 'true' && matrix.install_typos == 'true'
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: typos-cli@1.44.0

      - name: Verify regenerate merge-driver bootstrap
        if: matrix.id == 'codegen' && steps.lane-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-regenerate-merge-driver.sh "$PWD"
          configured="$(git config --local --get merge.regenerate.driver)"
          [[ "$configured" == *"scripts/regenerate-merge-driver.sh"* ]]
          [[ "$(git check-attr merge -- tsconfig.json)" == "tsconfig.json: merge: regenerate" ]]

      - name: Run verification lane
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          # Lane bodies live in the beep CLI (one-round-loop P0 inversion;
          # same-SHA parity proof recorded in
          # goals/one-round-loop/history/p0-parity-evidence.md). This case
          # block carries only GitHub-context orchestration: the
          # event-dependent shape flags each lane receives.
          #
          # Orphaned lane grandchildren (stuck bun wrappers, daemon sockets)
          # inherit this step's stdio pipes, and the runner does not end a
          # step until those pipes close — so a lane can print success, exit,
          # and still wedge the job for its full timeout (ship-velocity SPEC
          # A7; proven on Docgen run 31797064763). Run each lane in its own
          # session and reap the entire process group once the lane process
          # finishes, success and failure alike.
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi

          shape_args+=(--summarize)

          case "${{ matrix.id }}" in
            check|test-integration|coverage)
              run_lane ci lane "${{ matrix.id }}" "${shape_args[@]}"
              ;;
            lint-policy|codegen|ecosystem)
              run_lane ci lane "${{ matrix.id }}"
              ;;
            repo-sanity)
              if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                run_lane ci lane repo-sanity --changeset-status
              else
                run_lane ci lane repo-sanity
              fi
              ;;
            labs)
              # No --affected: the lane's positive labs filter must not union
              # with an affected selector (lab-apps-lifecycle P2, row 10).
              run_lane ci lane labs --summarize
              ;;
          esac

      - name: Append Turbo summary
        if: matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && always()
        run: |
          if [[ "${{ matrix.id }}" == "coverage" ]]; then
            bun run beep ci append-turbo-summary --all
          else
            bun run beep ci append-turbo-summary
          fi

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.id }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping ${{ matrix.name }} for this change set."

  lint-shard:
    name: Lint (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [lint-a, lint-b]
    env:
      # Same-repository pull requests receive read-only cache access; forks
      # stay local-only. Trusted main pushes receive read-write access.
      TURBO_API: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_API || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_API || '' }}
      TURBO_TOKEN: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_TEAM || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_TEAM || '' }}
      TURBO_CACHE: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && 'local:rw,remote:rw' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && 'local:rw,remote:r' || 'local:rw' }}
      TURBO_LOG_ORDER: stream
      DATABASE_URL: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
      DATABASE_URL_UNPOOLED: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
      EMAIL_RESEND_API_KEY: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
      AUTH_SECRET: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
      BETTER_AUTH_SECRET: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
      BETTER_AUTH_URL: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
      SECURITY_TRUSTED_ORIGINS: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
      LIVEBLOCKS_SECRET_KEY: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Free runner disk for Lint shard
        if: steps.lane-gate.outputs.should_run == 'true' && runner.os == 'Linux' && !startsWith(runner.name, 'beep-')
        shell: bash
        run: |
          set -euo pipefail
          available_gib="$(df --output=avail -B1G / | tail -n 1 | tr -d '[:space:]')"
          echo "Root free space before cleanup: ${available_gib} GiB"
          if (( available_gib >= 64 )); then
            echo "At least 64 GiB is available; skipping runner image cleanup."
            exit 0
          fi
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.partition }}

      - name: Install typos
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: typos-cli@1.44.0

      - name: Run Lint shard
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi
          shape_args+=(--summarize)
          run_lane ci lane lint --partition "${{ matrix.partition }}" "${shape_args[@]}"

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.partition }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Lint (${{ matrix.partition }}) for this change set."

  lint:
    name: Lint
    needs: [lint-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Lint shard
        shell: bash
        run: |
          if [[ "${{ needs.lint-shard.result }}" != "success" ]]; then
            echo "Lint shards finished with result: ${{ needs.lint-shard.result }}"
            exit 1
          fi

  test-unit-shard:
    name: Test Unit (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [repo-cli, unit-a, unit-b]
    env:
      # Same-repository pull requests receive read-only cache access; forks
      # stay local-only. Trusted main pushes receive read-write access.
      TURBO_API: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_API || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_API || '' }}
      TURBO_TOKEN: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_TEAM || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_TEAM || '' }}
      TURBO_CACHE: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && 'local:rw,remote:rw' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && 'local:rw,remote:r' || 'local:rw' }}
      TURBO_LOG_ORDER: stream
      DATABASE_URL: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
      DATABASE_URL_UNPOOLED: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
      EMAIL_RESEND_API_KEY: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
      AUTH_SECRET: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
      BETTER_AUTH_SECRET: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
      BETTER_AUTH_URL: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
      SECURITY_TRUSTED_ORIGINS: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
      LIVEBLOCKS_SECRET_KEY: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Free runner disk for Test Unit shard
        if: steps.lane-gate.outputs.should_run == 'true' && runner.os == 'Linux' && !startsWith(runner.name, 'beep-')
        shell: bash
        run: |
          set -euo pipefail
          available_gib="$(df --output=avail -B1G / | tail -n 1 | tr -d '[:space:]')"
          echo "Root free space before cleanup: ${available_gib} GiB"
          if (( available_gib >= 64 )); then
            echo "At least 64 GiB is available; skipping runner image cleanup."
            exit 0
          fi
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"
          turbo-cache-key-suffix: -${{ matrix.partition }}

      - name: Run Test Unit shard
        if: steps.lane-gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          run_lane() {
            setsid bun run beep "$@" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi
          shape_args+=(--summarize)
          run_lane ci lane test-unit --partition "${{ matrix.partition }}" "${shape_args[@]}"

      - name: Append Turbo summary
        if: steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Save post-lane Turbo fallback
        if: github.event_name == 'push' && steps.lane-gate.outputs.should_run == 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ matrix.partition }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}-${{ github.sha }}

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping Test Unit (${{ matrix.partition }}) for this change set."

  test-unit:
    name: Test Unit
    needs: [test-unit-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Test Unit shard
        shell: bash
        run: |
          if [[ "${{ needs.test-unit-shard.result }}" != "success" ]]; then
            echo "Test Unit shards finished with result: ${{ needs.test-unit-shard.result }}"
            exit 1
          fi

  professional-desktop-ipc-stdio:
    name: Professional Desktop IPC Stdio
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        run: |
          set -euo pipefail
          should_run=true

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            changed_files="$(git diff --name-only "${base_ref}...HEAD")"

            if [[ -z "$changed_files" ]]; then
              should_run=false
            elif ! printf "%s\n" "$changed_files" | grep -Eq '(^apps/professional-desktop/|^packages/(foundation/|(agents|workspace|shared|epistemic)(/|-)|drivers/(pglite|postgres)/)|^\.github/(actions/setup-monorepo-ci/|workflows/check\.yml$)|^(bun\.lock|package\.json|turbo\.json)$)'; then
              should_run=false
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true
          cache-workspaces: apps/professional-desktop/src-tauri

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"

      - name: Run desktop IPC stdio proof
        if: steps.lane-gate.outputs.should_run == 'true'
        run: bun run beep ci lane desktop-ipc

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "Skipping desktop IPC stdio proof for this change set."

  property-laws:
    # one-round-loop P1 (D3): schema property laws for affected packages at a
    # 400-run floor. Lands NON-required; the required flip (ruleset 10240248
    # addition) is a P4 close criterion after a stable green history. The
    # nightly sweep (property-laws-nightly.yml) covers ALL suites at 1000+.
    name: Property Laws
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    env:
      TURBO_API: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_API || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_API || '' }}
      TURBO_TOKEN: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_TEAM || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_TEAM || '' }}
      TURBO_CACHE: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && 'local:rw,remote:rw' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && 'local:rw,remote:r' || 'local:rw' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "true"
          cache-write: "false"

      - name: Run property laws lane
        shell: bash
        run: |
          set -euo pipefail
          shape_args=()

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi

          shape_args+=(--summarize)

          bun run beep ci lane property "${shape_args[@]}"

      - name: Append Turbo summary
        if: always()
        run: bun run beep ci append-turbo-summary

  fallow-advisory:
    name: Fallow Advisory Envelopes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Determine audit base
        id: base
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          fetch_status=0
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF:-main}"
            git fetch --quiet --no-tags --depth=100 origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}" || fetch_status=$?
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_ref="$BEFORE_SHA"
            git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1 || git fetch --quiet --no-tags --depth=100 origin "$base_ref" || fetch_status=$?
          else
            base_ref="HEAD~1"
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "base_fetch_status=$fetch_status" >> "$GITHUB_OUTPUT"

      - name: Free runner disk for Fallow
        # Same scoping as the verify matrix: destructive cleanup only on
        # ephemeral hosted images, never owned (beep-) runners.
        if: runner.os == 'Linux' && !startsWith(runner.name, 'beep-')
        shell: bash
        run: |
          set -euo pipefail
          # This job only needs the monorepo toolchain plus Fallow. The shared
          # setup step can exhaust the default runner image when cleanup is
          # skipped, so clear the large preinstalled stacks before installing.
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"

      - name: Run Fallow envelopes
        id: fallow
        shell: bash
        env:
          TURBO_API: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_API || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_API || '' }}
          TURBO_TOKEN: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && vars.TURBO_TEAM || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && vars.TURBO_TEAM || '' }}
          TURBO_CACHE: ${{ github.event_name == 'push' && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_TOKEN && 'local:rw,remote:rw' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TURBO_API && vars.TURBO_TEAM && secrets.TURBO_READ_TOKEN && 'local:rw,remote:r' || 'local:rw' }}
        run: |
          # Lane body (blocking audit/dead-code, advisory sweep, status.md
          # accounting, envelope existence) lives in the beep CLI; envelope
          # validation, the step summary, and artifact upload stay below.
          bun run beep ci lane fallow --base "${{ steps.base.outputs.base_ref }}"

      - name: Validate Fallow envelopes
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for lane in audit dead-code; do
            test -s ".beep/fallow/${lane}.check.json"
          done

          for lane in health boundaries flags security fix-preview; do
            bun run beep quality fallow envelope-check ".beep/fallow/${lane}.advisory.json" \
              --require schemaVersion,status,command,exitStatus,baseRef,rawOutputRef \
              --expect-subcommand "$lane" \
              --expect-report-path ".beep/fallow/${lane}.advisory.json" \
              --require-raw-output
          done

          for lane in audit dead-code; do
            bun run beep quality fallow envelope-check ".beep/fallow/${lane}.check.json" \
              --require schemaVersion,status,command,exitStatus,baseRef,rawOutputRef \
              --expect-subcommand "$lane" \
              --expect-report-path ".beep/fallow/${lane}.check.json" \
              --require-raw-output
          done

      - name: Append Fallow summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Fallow Advisory Envelopes"
            echo
            echo "- base ref: \`${{ steps.base.outputs.base_ref }}\`"
            echo "- base fetch status: \`${{ steps.base.outputs.base_fetch_status }}\`"
            echo
            cat .beep/fallow/status.md 2>/dev/null || echo "- lane status: unavailable"
            echo
            jq -r '"- audit envelope status: `\(.status // "unknown")`\n- audit tool exit status: `\(.exitStatus // "unknown")`\n- audit finding count: `\(.report.findingCount // "unknown")`\n- audit introduced findings: `\(.findingAttributionSummary.introduced // "unknown")`\n- audit inherited-adjacent findings: `\(.findingAttributionSummary.inheritedAdjacent // "unknown")`"' .beep/fallow/audit.check.json 2>/dev/null || echo "- audit summary: unavailable"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fallow envelopes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fallow-envelopes-${{ github.event_name }}-${{ github.run_attempt }}
          path: .beep/fallow/**
          if-no-files-found: error

  knip:
