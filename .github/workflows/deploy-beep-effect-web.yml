name: Deploy beep-effect-web

# Deploys the `prod` stage of the Alchemy stack in apps/beep-effect-web
# (https://beep-effect.com). State lives in the repo's shared AWS S3 state
# store (goals/infra-alchemy-rebuild); its stage lease plus this concurrency
# group serialize every prod deploy and never cancel one mid-apply. The store
# stays operator-bootstrapped because the plan step runs first without `--yes`
# and fails on a missing or outdated store; `deploy --yes` on its own would
# create or upgrade it even with `CI=true`, so keep the plan step. AWS
# credentials come from the GitHub OIDC state role
# (vars.ALCHEMY_STATE_ROLE_ARN on the beep-effect-web-prod environment);
# Cloudflare credentials stay secrets. Runbook: docs/runbooks/alchemy-infra.md.
on:
  push:
    branches: [main]
    paths:
      - apps/beep-effect-web/**
      - packages/foundation/modeling/public-site/**
      - packages/foundation/modeling/identity/**
      - bun.lock
      - .github/workflows/deploy-beep-effect-web.yml
  workflow_dispatch:
    inputs:
      adopt:
        description: >-
          Pass --adopt so resources another store already deployed are taken
          over instead of failing (one-time state-store moves only).
        type: boolean
        default: false

concurrency:
  group: alchemy-beep-effect-web-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy beep-effect-web (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: beep-effect-web-prod
      url: https://beep-effect.com
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci

      # The reserved-slug guard test reads the committed route tree; regenerate
      # it first and fail if the commit is stale, so the deployed routes are the
      # tested ones.
      - name: Check generated route tree
        working-directory: apps/beep-effect-web
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          git diff --exit-code -- generated/

      - name: Test app
        working-directory: apps/beep-effect-web
        shell: bash
        run: bun run test

      - name: Configure AWS credentials (state store)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ALCHEMY_STATE_ROLE_ARN }}
          role-session-name: alchemy-beep-effect-web-prod
          aws-region: us-east-1

      # The plan is the acceptance evidence for the shared store: after the
      # move it must show no create or replace (alchemy plan has no
      # changes-pending exit code, so the log is the record). It takes the same
      # adoption policy as the deploy: without --adopt a read that reports
      # Unowned fails the plan before the deploy could adopt it.
      - name: Plan prod stage
        working-directory: apps/beep-effect-web
        shell: bash
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADOPT: ${{ inputs.adopt == true && '--adopt' || '' }}
        run: bunx alchemy plan --stage prod --env-file /dev/null $ADOPT

      - name: Deploy prod stage
        working-directory: apps/beep-effect-web
        shell: bash
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADOPT: ${{ inputs.adopt == true && '--adopt' || '' }}
        run: bunx alchemy deploy --stage prod --yes --env-file /dev/null $ADOPT

      - name: Smoke-check the public origin
        shell: bash
        run: |
          set -euo pipefail
          apex="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors https://beep-effect.com/)"
          www="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 --retry-delay 5 --retry-all-errors https://www.beep-effect.com/)"
          echo "apex=${apex} www=${www}"
          [[ "$apex" == "200" ]]
          [[ "$www" == "301 https://beep-effect.com/" ]]
