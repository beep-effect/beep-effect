name: Heavy Admit

# Label-triggered tier-2 admission (time-to-certainty B8, ruling 51).
# Applying `ready-for-heavy` runs only the admission decision and the heavy
# matrix for the labelled head. It never restarts Check's tier-1 jobs (a
# `labeled` type on check.yml would cancel and re-run them), and it never
# skips them either: a tier-1 job skipped on a `labeled` run would report a
# skipped check run that GitHub counts as success, masking an earlier red on
# the same SHA. Other labels are ignored at job level, so `size/*` from the
# pr-size job uses GITHUB_TOKEN and does not trigger workflows. Human or
# agent labels do start runs, in a separate non-admission concurrency group. Pushes after the label go through check.yml's own admission job,
# which reads the sticky label.

on:
  pull_request:
    branches: [main]
    types: [labeled]

# No cancel-in-progress: every `labeled` event (any label, from any actor)
# starts a run. Admission labels have a distinct group so unrelated labels
# cannot replace a pending admission. Cancelling would kill the heavy matrix a
# previous `ready-for-heavy` run is executing. Runs for other labels skip at
# job level; a superseded head's matrix is cancelled by check.yml's
# admission job, never by a later label.
concurrency:
  group: heavy-admit-${{ github.ref }}-${{ github.event.label.name == 'ready-for-heavy' || github.event.label.name == 'ready-for-heavy-fork' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BEEP_CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BEEP_CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  admission:
    name: Heavy Admission
    if: github.event.label.name == 'ready-for-heavy' || github.event.label.name == 'ready-for-heavy-fork'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.decide.outputs.verdict || steps.docs.outputs.verdict }}
      admitted: ${{ steps.decide.outputs.admitted || steps.docs.outputs.admitted }}
      docs_only: ${{ steps.decide.outputs.docs_only || steps.docs.outputs.docs_only }}
      route_skips: ${{ steps.decide.outputs.route_skips }}
      route_receipt: ${{ steps.decide.outputs.route_receipt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Fetch beep CI binary
        uses: ./.github/actions/fetch-beep-ci

      - name: Classify pinned pull request diff
        id: profile
        shell: bash
        run: beep ci change-profile

      - name: Satisfy documentation-only admission
        id: docs
        if: steps.profile.outputs.docs_only == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          echo "verdict=skip-satisfied" >> "$GITHUB_OUTPUT"
          echo "admitted=false" >> "$GITHUB_OUTPUT"
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "Documentation-only diff: no dependency installation or heavy proof needed."

      - name: Setup monorepo CI
        if: steps.docs.outputs.verdict != 'skip-satisfied'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          free-disk: "false"

      - name: Decide heavy admission
        if: steps.docs.outputs.verdict != 'skip-satisfied'
        id: decide
        shell: bash
        run: bun run beep ci admission --github-output

  # Coverage evidence is produced and compared by Check even before this
  # label lands. This workflow never adds another artifact comparison. During
  # migration trusted main can still own the legacy producer; after promotion
  # its matrix no longer dispatches coverage.
  heavy:
    name: Heavy
    needs: [admission]
    if: ${{ needs.admission.outputs.verdict == 'run' || needs.admission.outputs.verdict == 'skip-satisfied' }}
    permissions:
      contents: read
      # GitHub validates every nested job, including the gated producer.
      actions: read
    uses: beep-effect/beep-effect/.github/workflows/heavy.yml@main
    secrets: inherit
    with:
      admitted: ${{ needs.admission.outputs.verdict == 'run' }}
      # Verification route: the label path is usually a PR's first admission, so it forwards the
      # same route skips and receipt as check.yml.
      route_skips: ${{ needs.admission.outputs.route_skips }}
      route_receipt: ${{ needs.admission.outputs.route_receipt }}
