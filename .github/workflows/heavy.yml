name: Heavy

on:
  workflow_call:
    inputs:
      admitted:
        description: >-
          Whether the heavy matrix runs. `false` moves the verify job to a
          GitHub-hosted runner and skips every lane step, so each
          `Heavy / <lane>` context still expands and reports success (accepted
          by the main ruleset) without consuming a beep-ec2-heavy runner.
          A job-level skip cannot do this: a skipped matrix job never expands
          and reports one context named `Heavy / matrix.name` (probe #1164).
          Callers pass `false` only for admission verdicts that must satisfy
          the ruleset without proof (docs-only pull requests).
        required: false
        type: boolean
        default: true

      producer_inspection:
        description: >-
          Run only the credential-free protected source inspection for the
          exact main manual dispatcher. Ordinary quality callers leave this off.
        required: false
        type: boolean
        default: false

      producer_preparation:
        description: >-
          Build only the credential-free candidate adapter for the exact main
          manual dispatcher. This grants no producer or cache-write authority.
        required: false
        type: boolean
        default: false

      producer_execution:
        description: Run the closed independently approved signed trial for the exact main dispatcher.
        required: false
        type: boolean
        default: false

      producer_channel:
        description: Exact native client channel for the protected signed trial.
        required: false
        type: string
        default: stable

    secrets:
      BEEP_CACHE_PRODUCER_STABLE_APPROVAL_JSON:
        required: false
      BEEP_CACHE_PRODUCER_CANARY_APPROVAL_JSON:
        required: false
      BEEP_CACHE_PRODUCER_STABLE_RUNTIME_JSON:
        required: false
      BEEP_CACHE_PRODUCER_CANARY_RUNTIME_JSON:
        required: false
      BEEP_CACHE_PRODUCER_STABLE_ISSUER_MATERIAL_BASE64:
        required: false
      BEEP_CACHE_PRODUCER_CANARY_ISSUER_MATERIAL_BASE64:
        required: false
      BEEP_CACHE_TRIAL_R2_ACCESS_KEY_ID:
        required: false
      BEEP_CACHE_TRIAL_R2_SECRET_ACCESS_KEY:
        required: false
      BEEP_CACHE_TRIAL_ARTIFACT_KEY:
        required: false
      BEEP_CACHE_TRIAL_READER_BEARER:
        required: false
      BEEP_CACHE_TRIAL_WRITER_BEARER:
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    # Not admitted: run the matrix on a GitHub-hosted runner with every step
    # but `lane-gate` skipped (no checkout; `lane-gate` says
    # `should_run=false`), so each context reports success without touching
    # the heavy pool. Every ordinary quality call must still expand the
    # matrix: skipping it leaves required contexts "Expected". Only the
    # dedicated manual inspection, preparation or execution selects a job below;
    # it does not publish quality verdicts.
    if: ${{ !inputs.producer_inspection && !inputs.producer_preparation && !inputs.producer_execution }}
    runs-on: ${{ inputs.admitted && 'beep-ec2-heavy' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    environment: ${{ github.event_name == 'push' && inputs.admitted && matrix.uses_turbo == 'true' && 'turbo-cache-write' || null }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: lint-policy
            name: Lint Policy
            timeout_minutes: 50
            uses_turbo: "true"
            install_typos: "true"
          - id: check
            name: Check
            timeout_minutes: 120
            uses_turbo: "true"
            install_typos: "false"
          - id: test-integration
            name: Test Integration
            timeout_minutes: 40
            uses_turbo: "true"
            install_typos: "false"
          - id: docgen
            name: Docgen
            timeout_minutes: 60
            uses_turbo: "true"
            install_typos: "false"
            docgen_concurrency: 6
          - id: doctest
            name: Doctest
            timeout_minutes: 60
            uses_turbo: "true"
            install_typos: "false"
          # Quality-lane audit D12: pull requests prove the tsc emit + babel
          # build affected-scoped with remote-cache read; trusted main pushes
          # run unscoped and stay the only cache writer. The lane lives here
          # rather than in check.yml because the runner group admits this
          # reusable workflow at main. check.yml calls it at @main, so its
          # jobs use the admitted definition on pull requests; a job defined
          # directly in a pull-request workflow has no fleet access.
          - id: build
            name: Build
            timeout_minutes: 40
            uses_turbo: "true"
            install_typos: "false"
    env:
      BEEP_DOCGEN_CONCURRENCY: ${{ matrix.docgen_concurrency || 3 }}
    steps:
      - name: Checkout repository
        if: inputs.admitted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        if: inputs.admitted && github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Determine lane execution
        id: lane-gate
        shell: bash
        env:
          ADMITTED: ${{ inputs.admitted }}
          LANE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [[ "${ADMITTED}" != "true" ]]; then
            echo "heavy admission: not admitted; ${LANE_NAME} passes without work"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_run=true
          eval "$(scripts/ci-change-profile.sh "origin/${GITHUB_BASE_REF:-main}")"
          if [[ "$goals_only" == "true" ]]; then
            should_run=false
          fi

          if [[ "${{ matrix.id }}" == "docgen" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "origin/${GITHUB_BASE_REF:-main}...HEAD")"
            if [[ -z "$changed_files" ]] || ! grep -Eq '(^apps/|^packages/|^infra/|/docgen\.json$|\.(ts|tsx|mts|cts|md)$)' <<< "$changed_files"; then
              should_run=false
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Setup monorepo CI
        if: steps.lane-gate.outputs.should_run == 'true'
        uses: ./.github/actions/setup-monorepo-ci
        with:
          free-disk: "true"
          turbo-remote-cache: ${{ matrix.uses_turbo }}
          app-secrets: "true"
          turbo-api: ${{ vars.TURBO_API }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          turbo-token: ${{ github.event_name == 'push' && matrix.uses_turbo == 'true' && secrets.TURBO_TOKEN || '' }}
          turbo-read-token: ${{ secrets.TURBO_READ_TOKEN }}
          r2-enabled: ${{ vars.TURBO_R2_ENABLED }}
          r2-endpoint: ${{ vars.TURBO_R2_ENDPOINT }}
          r2-bucket: ${{ vars.TURBO_R2_BUCKET }}
          r2-access-key-id: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_ACCESS_KEY_ID || (github.event_name != 'push' && secrets.TURBO_R2_READ_ACCESS_KEY_ID || '') }}
          r2-secret-access-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TURBO_R2_WRITE_SECRET_ACCESS_KEY || (github.event_name != 'push' && secrets.TURBO_R2_READ_SECRET_ACCESS_KEY || '') }}
          database-url: ${{ github.event_name == 'push' && secrets.DATABASE_URL || '' }}
          database-url-unpooled: ${{ github.event_name == 'push' && secrets.DATABASE_URL_UNPOOLED || '' }}
          email-resend-api-key: ${{ github.event_name == 'push' && secrets.EMAIL_RESEND_API_KEY || '' }}
          auth-secret: ${{ github.event_name == 'push' && secrets.AUTH_SECRET || '' }}
          better-auth-secret: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          better-auth-url: ${{ github.event_name == 'push' && secrets.BETTER_AUTH_URL || '' }}
          security-trusted-origins: ${{ github.event_name == 'push' && secrets.SECURITY_TRUSTED_ORIGINS || '' }}
          liveblocks-secret-key: ${{ github.event_name == 'push' && secrets.LIVEBLOCKS_SECRET_KEY || '' }}

      # PRs may restore the main Docgen cache without saving it. Same-
      # repository PRs can also read the remote cache; forks remain tokenless.
      - name: Restore main Docgen Turbo cache
        if: matrix.id == 'docgen' && steps.lane-gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
        id: docgen-turbo-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-docgen-main-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-docgen-main-${{ hashFiles('bun.lock') }}-

      - name: Install typos
        if: steps.lane-gate.outputs.should_run == 'true' && matrix.install_typos == 'true'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos-cli@1.50.3

      - name: Run verification lane
        if: steps.lane-gate.outputs.should_run == 'true'
        env:
          # The knowledge doctor's seal guard admits a baseline change only on the
          # mint App's pull request (C8 condition i); the App's login is
          # `<slug>[bot]`. Unset, every baseline change stays baseline-tamper.
          KNOWLEDGE_MINT_APP_SLUG: ${{ vars.KNOWLEDGE_MINT_APP_SLUG }}
        run: |
          set -euo pipefail
          # Lane bodies live in the beep CLI (one-round-loop P0 inversion;
          # same-SHA parity proof recorded in
          # goals/one-round-loop/history/p0-parity-evidence.md). This case
          # block carries only GitHub-context orchestration: the
          # event-dependent shape flags each lane receives.
          #
          # Orphaned lane grandchildren (stuck bun wrappers, daemon sockets)
          # inherit this step's stdio pipes, and the runner does not end a
          # step until those pipes close, so a lane can print success, exit,
          # and still wedge the job for its full timeout (ship-velocity SPEC
          # A7; proven on Docgen run 31797064763). Run each lane in its own
          # session and reap the entire process group once the lane process
          # finishes, success and failure alike.
          run_lane() {
            local -a lane_command=(bun run beep "$@")
            # The reusable workflow runs from main, but older PR checkouts
            # may not contain the optional measurement helper yet.
            if [[ -f scripts/ci-runner-resources.sh ]]; then
              lane_command=(bash scripts/ci-runner-resources.sh "${{ matrix.id }}" "${lane_command[@]}")
            else
              echo '::notice::Runner resource helper unavailable in this checkout; running the requested lane.'
            fi
            setsid "${lane_command[@]}" < /dev/null &
            local pgid=$!
            local status=0
            wait "$pgid" || status=$?
            kill -TERM -- "-$pgid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$pgid" 2>/dev/null || true
            return "$status"
          }

          shape_args=()

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            shape_args+=(--affected --base "origin/${GITHUB_BASE_REF:-main}")
          fi

          shape_args+=(--summarize)

          case "${{ matrix.id }}" in
            check|test-integration|build)
              run_lane ci lane "${{ matrix.id }}" "${shape_args[@]}"
              ;;
            lint-policy)
              # Perf audit K1: pull requests run the changed scope, which
              # `beep lint policy --affected` widens to the full sweep when the
              # change set escalates it; pushes get no affected shape and run
              # --full. A PR checkout whose CLI predates the affected lane
              # body accepts these flags and still runs --full.
              run_lane ci lane "${{ matrix.id }}" "${shape_args[@]}"
              ;;
            docgen)
              if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                run_lane ci lane docgen --mode auto --base "origin/${GITHUB_BASE_REF:-main}" --head HEAD
              else
                run_lane ci lane docgen --mode full
              fi
              ;;
            doctest)
              run_lane ci lane doctest
              ;;
          esac

      # Only trusted main pushes publish a cache entry. Pull requests have no
      # save step, so restored main artifacts cannot be poisoned by PR code.
      - name: Save main Docgen Turbo cache
        if: matrix.id == 'docgen' && steps.lane-gate.outputs.should_run == 'true' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-docgen-main-${{ hashFiles('bun.lock') }}-${{ github.sha }}

      - name: Append Turbo summary
        if: matrix.uses_turbo == 'true' && steps.lane-gate.outputs.should_run == 'true' && always()
        run: bun run beep ci append-turbo-summary

      - name: Upload trusted Turbo summaries
        if: github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-summary-${{ github.job }}-${{ matrix.id || matrix.partition || 'single' }}
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Skip lane
        if: steps.lane-gate.outputs.should_run != 'true'
        run: echo "${{ matrix.name }} passes without work for this change set."

      - name: Stop R2 cache adapter
        if: always() && inputs.admitted
        shell: bash
        run: |
          if [[ -x infra/r2-cache/adapter.sh ]]; then
            infra/r2-cache/adapter.sh stop-ci
          fi

  # This leaf lives in the runner group's selected heavy.yml@main path.
  # Caller-controlled inputs alone cannot admit another source or event.
  producer-inspect:
    name: Inspect producer sources and tools
    if: >-
      inputs.producer_inspection && !inputs.producer_preparation && !inputs.producer_execution &&
      github.repository == 'beep-effect/beep-effect' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'beep-effect/beep-effect/.github/workflows/cache-producer-inspect.yml@refs/heads/main'
    runs-on: beep-ec2-heavy
    timeout-minutes: 10
    environment: turbo-cache-write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup pinned toolchain without cache capabilities
        uses: ./.github/actions/setup-monorepo-ci
        with:
          turbo-remote-cache: "false"
          r2-enabled: "false"
          app-secrets: "false"

      - name: Ensure native sandbox inspection dependency
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/bin/bwrap ]]; then
            privilege=()
            if [[ "$EUID" -ne 0 ]]; then
              privilege=(sudo -n)
            fi
            if command -v dnf >/dev/null 2>&1; then
              "${privilege[@]}" dnf install -y bubblewrap
            elif command -v apt-get >/dev/null 2>&1; then
              bash scripts/ci-prune-apt-sources.sh
              "${privilege[@]}" apt-get update
              "${privilege[@]}" apt-get install -y --no-install-recommends bubblewrap
            else
              echo "::error::Producer inspection requires /usr/bin/bwrap; no supported package manager."
              exit 1
            fi
          fi
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version

      - name: Write bounded source inspection
        id: inspection
        shell: bash
        env:
          BEEP_TURBO_HOST_CACHE_DISABLED: "true"
        run: |
          umask 077
          inspection_dir="$(mktemp -d "$RUNNER_TEMP/beep-cache-producer-inspection.XXXXXX")"
          report="$inspection_dir/report.json"
          bun --no-env-file run beep cache producer-inspect --output "$report"
          test -s "$report"
          printf 'report=%s\n' "$report" >> "$GITHUB_OUTPUT"

      - name: Retain inspection for at most one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-producer-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.inspection.outputs.report }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  producer-prepare:
    name: Build candidate producer adapter
    if: >-
      inputs.producer_preparation && !inputs.producer_inspection && !inputs.producer_execution &&
      github.repository == 'beep-effect/beep-effect' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'beep-effect/beep-effect/.github/workflows/cache-producer-prepare.yml@refs/heads/main'
    runs-on: beep-ec2-heavy
    timeout-minutes: 20
    # No protected environment or secrets: this only builds a candidate.
    env:
      BEEP_TURBO_HOST_CACHE_DISABLED: "true"
      RUSTUP_TOOLCHAIN: "1.96.0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Allocate isolated build scratch
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          build_parent="${XDG_CACHE_HOME:-$HOME/.cache}/beep"
          mkdir -p "$build_parent"
          build_root="$(mktemp -d "$build_parent/cache-producer-build.XXXXXX")"
          printf 'BEEP_CACHE_PRODUCER_BUILD_ROOT=%s\n' "$build_root" >> "$GITHUB_ENV"
          printf 'root=%s\nartifact=%s/artifact\n' "$build_root" "$build_root" >> "$GITHUB_OUTPUT"
          mkdir "$build_root/artifact" "$build_root/cache" "$build_root/target"
          printf 'CARGO_HOME=%s/cargo\n' "$build_root" >> "$GITHUB_ENV"
          printf 'RUSTUP_HOME=%s/rustup\n' "$build_root" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s/cache\n' "$build_root" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target\n' "$build_root" >> "$GITHUB_ENV"

      - name: Ensure native host compiler and ELF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cc >/dev/null || ! command -v ld >/dev/null || ! command -v readelf >/dev/null; then
            privilege=()
            if [[ "$EUID" -ne 0 ]]; then
              privilege=(sudo -n)
            fi
            if command -v dnf >/dev/null 2>&1; then
              "${privilege[@]}" dnf install -y gcc binutils
            elif command -v apt-get >/dev/null 2>&1; then
              bash scripts/ci-prune-apt-sources.sh
              "${privilege[@]}" apt-get update
              "${privilege[@]}" apt-get install -y --no-install-recommends gcc binutils
            else
              echo "::error::No supported native host compiler installer."
              exit 1
            fi
          fi
          command -v cc
          command -v ld
          command -v readelf
          cc --version
          ld --version
          readelf --version

      - name: Setup pinned Rust without shared caches
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.96.0"
          target: x86_64-unknown-linux-musl
          cache: "false"
          override: "false"
          matcher: "false"

      - name: Install pinned portable build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$BEEP_CACHE_PRODUCER_BUILD_ROOT/tools"
          "$BEEP_CACHE_PRODUCER_BUILD_ROOT/tools/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes \
            -r infra/r2-cache/policy-build-requirements.txt
          # ziglang distributes the binary inside its module, without a PATH entry.
          zig_binary="$("$BEEP_CACHE_PRODUCER_BUILD_ROOT/tools/bin/python" -c \
            'import pathlib,ziglang; print(pathlib.Path(ziglang.__file__).parent/"zig")')"
          ln -s "$zig_binary" "$BEEP_CACHE_PRODUCER_BUILD_ROOT/tools/bin/zig"
          test "$("$BEEP_CACHE_PRODUCER_BUILD_ROOT/tools/bin/zig" version)" = "0.14.1"
          test "$("$BEEP_CACHE_PRODUCER_BUILD_ROOT/tools/bin/cargo-zigbuild" --version)" = "cargo-zigbuild 0.20.1"
          printf '%s/tools/bin\n' "$BEEP_CACHE_PRODUCER_BUILD_ROOT" >> "$GITHUB_PATH"

      - name: Build pinned portable candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD
          infra/r2-cache/policy.sh cargo-build-musl
          # Recheck the entire reviewed upstream patch after compilation too.
          infra/r2-cache/policy.sh prepare
          candidate="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/decay"
          test -x "$candidate"
          readelf -lW "$candidate" > "$BEEP_CACHE_PRODUCER_BUILD_ROOT/program-headers.txt"
          if grep -Eq '^[[:space:]]*INTERP[[:space:]]' "$BEEP_CACHE_PRODUCER_BUILD_ROOT/program-headers.txt"; then
            echo "::error::Candidate still needs a host ELF interpreter."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,struct,subprocess
          root=pathlib.Path(os.environ['BEEP_CACHE_PRODUCER_BUILD_ROOT'])
          candidate=pathlib.Path(os.environ['CARGO_TARGET_DIR'])/'x86_64-unknown-linux-musl/release/decay'
          size=candidate.stat().st_size
          if not 0<size<=16*1024*1024:
              raise SystemExit('Candidate exceeds the sixteen-MiB artifact bound.')
          with candidate.open('rb') as handle:
              header=handle.read(64)
          if len(header)!=64 or header[:6]!=b'\x7fELF\x02\x01' or struct.unpack_from('<H',header,18)[0]!=62:
              raise SystemExit('Candidate is not a little-endian ELF64 x86-64 executable.')
          artifact=root/'artifact'
          binary=artifact/'decay'
          shutil.copyfile(candidate,binary)
          binary.chmod(0o500)
          pins=json.loads(pathlib.Path('infra/r2-cache/patches/4.0.20-signed-policy.json').read_text())
          inputs=['infra/r2-cache/policy.sh','infra/r2-cache/policy-build-requirements.txt',
                  'infra/r2-cache/patches/4.0.20-signed-policy.patch',
                  'infra/r2-cache/patches/4.0.20-signed-policy.json']
          def executable_digest(path):
              executable=pathlib.Path(path).resolve(strict=True)
              digest=hashlib.sha256()
              with executable.open('rb') as handle:
                  for block in iter(lambda:handle.read(1024*1024),b''):
                      digest.update(block)
              return {'sha256':digest.hexdigest(),'bytes':executable.stat().st_size}
          tool_paths={
              'rustc':subprocess.check_output(['rustup','which','rustc'],text=True).strip(),
              'cargoZigbuild':shutil.which('cargo-zigbuild'),
              'zig':shutil.which('zig'),
              'hostCc':shutil.which('cc'),
              'hostLinker':shutil.which('ld'),
              'readelf':shutil.which('readelf')
          }
          report={
              'schemaVersion':'cache-producer-adapter-build/v1',
              'authority':'Candidate build only; independent approval and runtime qualification are required.',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'sourceCommit':os.environ['GITHUB_SHA'],
              'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],
              'workflowCommit':os.environ['GITHUB_WORKFLOW_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'upstreamCommit':pins['upstreamCommit'],'patchSha256':pins['patchSha256'],
              'target':'x86_64-unknown-linux-musl',
              'binary':{'file':'decay','bytes':size,'sha256':hashlib.sha256(binary.read_bytes()).hexdigest()},
              'sourceInputs':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in inputs},
              'toolExecutables':{name:executable_digest(path) for name,path in tool_paths.items()},
              'tools':{name:subprocess.check_output(args,text=True).strip() for name,args in [
                  ('rustc',['rustc','-vV']),('cargoZigbuild',['cargo-zigbuild','--version']),('zig',['zig','version']),
                  ('hostCc',['cc','--version']),('hostLinker',['ld','--version']),('readelf',['readelf','--version'])]}
          }
          encoded=(json.dumps(report,indent=2)+'\n').encode()
          if len(encoded)>64*1024 or size+len(encoded)>16*1024*1024:
              raise SystemExit('Candidate manifest or complete artifact exceeds its bound.')
          (artifact/'build.json').write_bytes(encoded)
          PY
          git diff --quiet HEAD

      - name: Retain candidate for at most one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-producer-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.artifact }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove only this job's build scratch
        if: always() && steps.scratch.outputs.root != ''
        shell: bash
        env:
          BUILD_SCRATCH_ROOT: ${{ steps.scratch.outputs.root }}
        run: |
          set -euo pipefail
          build_root="$BUILD_SCRATCH_ROOT"
          case "$build_root" in
            */beep/cache-producer-build.??????) rm -rf -- "$build_root" ;;
            *) echo "::error::Refusing unexpected build scratch path."; exit 1 ;;
          esac


  producer-execute:
    name: Execute approved signed producer
    if: >-
      inputs.producer_execution && !inputs.producer_inspection && !inputs.producer_preparation &&
      (inputs.producer_channel == 'stable' || inputs.producer_channel == 'canary') &&
      github.repository == 'beep-effect/beep-effect' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'beep-effect/beep-effect/.github/workflows/cache-producer.yml@refs/heads/main'
    runs-on: beep-ec2-heavy
    timeout-minutes: 60
    environment: turbo-cache-write
    permissions:
      contents: read
      actions: read
    env:
      BEEP_TURBO_HOST_CACHE_DISABLED: "true"
      BEEP_CACHE_PRODUCER_CHANNEL: ${{ inputs.producer_channel }}
    steps:
      - name: Require independent frozen trial selection
        id: selection
        shell: bash
        env:
          TRIAL_ENABLED: ${{ vars.BEEP_CACHE_PRODUCER_ENABLED }}
          EXPECTED_SOURCE: ${{ vars[inputs.producer_channel == 'stable' && 'BEEP_CACHE_PRODUCER_STABLE_SOURCE_SHA' || 'BEEP_CACHE_PRODUCER_CANARY_SOURCE_SHA'] }}
          ADAPTER_RUN: ${{ vars.BEEP_CACHE_PRODUCER_ADAPTER_RUN_ID }}
          ADAPTER_ARTIFACT: ${{ vars.BEEP_CACHE_PRODUCER_ADAPTER_ARTIFACT_ID }}
          ADAPTER_SHA256: ${{ vars.BEEP_CACHE_PRODUCER_ADAPTER_SHA256 }}
        run: |
          set -euo pipefail
          test "$TRIAL_ENABLED" = true
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          [[ "$ADAPTER_RUN" =~ ^[1-9][0-9]{0,14}$ ]]
          [[ "$ADAPTER_ARTIFACT" =~ ^[1-9][0-9]{0,14}$ ]]
          [[ "$ADAPTER_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf 'run=%s\nartifact=%s\nsha256=%s\n' "$ADAPTER_RUN" "$ADAPTER_ARTIFACT" "$ADAPTER_SHA256" >> "$GITHUB_OUTPUT"

      - name: Reserve exclusive private trial directory
        id: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trial_root=/var/tmp/beep-cache-producer-trial-v1
          # An old or competing directory is a refusal, never an overwrite.
          mkdir "$trial_root"
          printf 'root=%s\n' "$trial_root" >> "$GITHUB_OUTPUT"
          mkdir "$trial_root/adapter" "$trial_root/publication"
          printf 'BEEP_CACHE_PRODUCER_PRIVATE_ROOT=%s\nBEEP_CACHE_PRODUCER_STORE=%s/issuer\n' "$trial_root" "$trial_root" >> "$GITHUB_ENV"

      - name: Checkout exact approved main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup pinned toolchain without trial capabilities
        uses: ./.github/actions/setup-monorepo-ci
        with:
          turbo-remote-cache: "false"
          r2-enabled: "false"
          app-secrets: "false"

      - name: Ensure native sandbox trial dependency
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/bin/bwrap ]]; then
            privilege=()
            if [[ "$EUID" -ne 0 ]]; then
              privilege=(sudo -n)
            fi
            if command -v dnf >/dev/null 2>&1; then
              "${privilege[@]}" dnf install -y bubblewrap
            elif command -v apt-get >/dev/null 2>&1; then
              bash scripts/ci-prune-apt-sources.sh
              "${privilege[@]}" apt-get update
              "${privilege[@]}" apt-get install -y --no-install-recommends bubblewrap
            else
              echo "::error::Producer inspection requires /usr/bin/bwrap; no supported package manager."
              exit 1
            fi
          fi
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version


      - name: Download independently selected candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact }}
          run-id: ${{ steps.selection.outputs.run }}
          repository: beep-effect/beep-effect
          github-token: ${{ github.token }}
          path: ${{ steps.private.outputs.root }}/adapter
          merge-multiple: true
          digest-mismatch: error

      - name: Verify selected candidate before issuer delivery
        shell: bash
        env:
          EXPECTED_ADAPTER_SHA256: ${{ steps.selection.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat
          root=pathlib.Path(os.environ['BEEP_CACHE_PRODUCER_PRIVATE_ROOT'])/'adapter'
          files=list(root.iterdir())
          if {p.name for p in files}!={'decay','build.json'} or len(files)!=2:
              raise SystemExit('Candidate must contain exactly the approved executable and manifest.')
          if any(not stat.S_ISREG(p.lstat().st_mode) for p in files):
              raise SystemExit('Candidate members must be regular files.')
          binary=root/'decay';manifest=root/'build.json'
          if not 0<binary.stat().st_size<=16*1024*1024 or manifest.stat().st_size>64*1024 or sum(p.stat().st_size for p in files)>16*1024*1024:
              raise SystemExit('Candidate exceeds its reviewed artifact bounds.')
          digest=hashlib.sha256(binary.read_bytes()).hexdigest()
          if digest!=os.environ['EXPECTED_ADAPTER_SHA256']:
              raise SystemExit('Candidate differs from independent executable selection.')
          report=json.loads(manifest.read_text())
          if report['binary']!={'file':'decay','bytes':binary.stat().st_size,'sha256':digest}:
              raise SystemExit('Candidate manifest does not describe the selected executable.')
          inputs=['infra/r2-cache/policy.sh','infra/r2-cache/policy-build-requirements.txt',
                  'infra/r2-cache/patches/4.0.20-signed-policy.patch','infra/r2-cache/patches/4.0.20-signed-policy.json']
          if report['sourceInputs']!={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in inputs}:
              raise SystemExit('Candidate source inputs differ from the approved checkout.')
          binary.chmod(0o500)
          PY

      - name: Prepare fixed full-pilot inputs without credentials
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD
          python3 - <<'PY'
          import base64,hashlib,io,json,os,pathlib,re,shutil,tarfile,urllib.parse,urllib.request
          root=pathlib.Path.cwd()
          private=pathlib.Path(os.environ['BEEP_CACHE_PRODUCER_PRIVATE_ROOT'])
          channel=os.environ['BEEP_CACHE_PRODUCER_CHANNEL']
          if channel not in ['stable','canary']:
              raise SystemExit('Only the two reviewed native channels are supported.')
          pins=json.loads((root/'goals/turborepo-quality-cache-adoption/research/errors-only-client-pins.json').read_text())[channel]
          executable=root/'node_modules/@turbo/linux-64/bin/turbo'
          if channel=='canary':
              url=urllib.parse.urlsplit(pins['tarball'])
              if url.scheme!='https' or url.netloc!='registry.npmjs.org' or url.query or url.fragment:
                  raise SystemExit('Native canary must use its reviewed public registry source.')
              with urllib.request.urlopen(pins['tarball'],timeout=30) as response:
                  archive=response.read(64*1024*1024+1)
              if len(archive)>64*1024*1024 or 'sha512-'+base64.b64encode(hashlib.sha512(archive).digest()).decode()!=pins['integrity']:
                  raise SystemExit('Native canary archive differs from its reviewed integrity.')
              with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as package:
                  members=package.getmembers()
                  if len(members)>32 or sum(m.size for m in members)>128*1024*1024:
                      raise SystemExit('Native canary archive exceeds its reviewed extraction bounds.')
                  matches=[m for m in members if m.name==pins['archiveMember']]
                  if len(matches)!=1 or not matches[0].isfile() or not 0<matches[0].size<=64*1024*1024:
                      raise SystemExit('Native canary executable member is invalid.')
                  with package.extractfile(matches[0]) as member:
                      native=member.read(64*1024*1024+1)
              executable=private/'turbo-canary'
              with executable.open('xb') as output:
                  output.write(native)
              executable.chmod(0o500)
          if hashlib.sha256(executable.read_bytes()).hexdigest()!=pins['sha256']:
              raise SystemExit('Native client differs from its reviewed binary pin.')
          folder=root/'.beep/cache/protected-producer-trial'
          folder.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
          folder.mkdir(mode=0o700)
          before=(root/'packages/foundation/modeling/identity/turbo.json').read_bytes()
          after=json.loads(before)
          if after['tasks']['lint'].get('cache') is not False:
              raise SystemExit('The identity-lint pilot source profile changed; renew its review.')
          after['tasks']['lint']['cache']=True
          (folder/'before.json').write_bytes(before)
          (folder/'after.json').write_text(json.dumps(after,indent=2)+'\n')
          def reference(name):
              file=folder/name
              return {'path':file.relative_to(root).as_posix(),'sha256':hashlib.sha256(file.read_bytes()).hexdigest()}
          (folder/'activation-request.json').write_text(json.dumps({'computation':'@beep/identity#lint',
              'path':'packages/foundation/modeling/identity/turbo.json','before':reference('before.json'),'after':reference('after.json')})+'\n')
          if not re.fullmatch('[1-9][0-9]*',os.environ['GITHUB_RUN_ID']) or not re.fullmatch('[1-9][0-9]*',os.environ['GITHUB_RUN_ATTEMPT']):
              raise SystemExit('Hosted run identity is invalid.')
          prefix='cache-producer-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          trees=[str(root)+'-worktrees/'+prefix+'-'+suffix for suffix in ['a','b']]
          (folder/'tools.json').write_text(json.dumps({'executable':str(executable.resolve()),'client':{
              'version':pins['reportedVersion'],'sha256':pins['sha256'],'namespace':'team_beep_signed_canary_v1'},'worktrees':trees})+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('source_inputs='+str(folder)+'\nworktree_a='+trees[0]+'\nworktree_b='+trees[1]+'\n')
          PY
          bun --no-env-file run beep cache dependencies --output .beep/cache/protected-producer-trial/dependencies.json
          bun --no-env-file run beep cache activation --request .beep/cache/protected-producer-trial/activation-request.json --output .beep/cache/protected-producer-trial/activation.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path.cwd();folder=root/'.beep/cache/protected-producer-trial'
          tools=json.loads((folder/'tools.json').read_text())
          pathlib.Path(tools['worktrees'][0]).parent.mkdir(mode=0o700,exist_ok=True)
          for tree in tools['worktrees']:
              subprocess.run(['git','worktree','add','--detach',tree,os.environ['GITHUB_SHA']],check=True)
          def reference(name):
              file=folder/name
              return {'path':file.relative_to(root).as_posix(),'sha256':hashlib.sha256(file.read_bytes()).hexdigest()}
          request={'sourceRoot':str(root),'pilot':{'channel':os.environ['BEEP_CACHE_PRODUCER_CHANNEL'],
              'client':tools['client'],'executable':tools['executable'],
              'biomeExecutable':str((root/'node_modules/@biomejs/cli-linux-x64/biome').resolve(strict=True)),
              'nodeExecutable':str(pathlib.Path(shutil.which('node')).resolve(strict=True)),
              'dependencies':reference('dependencies.json'),'worktrees':tools['worktrees'],
              'activation':reference('activation.json'),'selection':'full'}}
          (folder/'request.json').write_text(json.dumps(request)+'\n')
          PY
          git diff --quiet HEAD

      - name: Install independently approved issuer only
        shell: bash
        env:
          BEEP_CACHE_PRODUCER_APPROVAL_JSON: ${{ secrets[inputs.producer_channel == 'stable' && 'BEEP_CACHE_PRODUCER_STABLE_APPROVAL_JSON' || 'BEEP_CACHE_PRODUCER_CANARY_APPROVAL_JSON'] }}
          BEEP_CACHE_PRODUCER_RUNTIME_JSON: ${{ secrets[inputs.producer_channel == 'stable' && 'BEEP_CACHE_PRODUCER_STABLE_RUNTIME_JSON' || 'BEEP_CACHE_PRODUCER_CANARY_RUNTIME_JSON'] }}
          BEEP_CACHE_PRODUCER_ISSUER_MATERIAL_BASE64: ${{ secrets[inputs.producer_channel == 'stable' && 'BEEP_CACHE_PRODUCER_STABLE_ISSUER_MATERIAL_BASE64' || 'BEEP_CACHE_PRODUCER_CANARY_ISSUER_MATERIAL_BASE64'] }}
        run: |
          set -euo pipefail
          bun --no-env-file run beep cache producer-install --from-environment

      - name: Execute closed signed trial and retain private observation
        shell: bash
        env:
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.BEEP_CACHE_TRIAL_ARTIFACT_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.BEEP_CACHE_TRIAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BEEP_CACHE_TRIAL_R2_SECRET_ACCESS_KEY }}
          BEEP_CACHE_TRIAL_READER_BEARER: ${{ secrets.BEEP_CACHE_TRIAL_READER_BEARER }}
          BEEP_CACHE_TRIAL_WRITER_BEARER: ${{ secrets.BEEP_CACHE_TRIAL_WRITER_BEARER }}
          BEEP_CACHE_TRIAL_FOREIGN_BEARER: deliberately-unrecognized-foreign
          BEEP_CACHE_TRIAL_UNKNOWN_BEARER: deliberately-unrecognized-unknown
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=30s 50m bun --no-env-file run beep cache producer-run             --request .beep/cache/protected-producer-trial/request.json             --output "$BEEP_CACHE_PRODUCER_PRIVATE_ROOT/observation.json"             --publication "$BEEP_CACHE_PRODUCER_PRIVATE_ROOT/publication/cache-producer.json"

      - name: Publish issued observation using storage capabilities only
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.BEEP_CACHE_TRIAL_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BEEP_CACHE_TRIAL_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          bun --no-env-file run beep cache producer-publish --observation "$BEEP_CACHE_PRODUCER_PRIVATE_ROOT/observation.json"

      - name: Check bounded public digest report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,stat
          folder=pathlib.Path(os.environ['BEEP_CACHE_PRODUCER_PRIVATE_ROOT'])/'publication'
          files=list(folder.iterdir())
          if len(files)!=1 or files[0].name!='cache-producer.json' or not stat.S_ISREG(files[0].lstat().st_mode) or not 0<files[0].stat().st_size<=64*1024:
              raise SystemExit('Only the bounded producer digest report may be published.')
          PY

      - name: Retain only digest publication for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.private.outputs.root }}/publication/cache-producer.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove only this trial's private files and worktrees
        if: always() && steps.private.outputs.root != ''
        shell: bash
        env:
          TRIAL_ROOT: ${{ steps.private.outputs.root }}
          TRIAL_INPUTS: ${{ steps.inputs.outputs.source_inputs }}
          TRIAL_WORKTREE_A: ${{ steps.inputs.outputs.worktree_a }}
          TRIAL_WORKTREE_B: ${{ steps.inputs.outputs.worktree_b }}
        run: |
          set -euo pipefail
          cleanup_status=0
          for tree in "$TRIAL_WORKTREE_A" "$TRIAL_WORKTREE_B"; do
            if [[ -n "$tree" && -e "$tree" ]]; then
              case "$tree" in
                "$GITHUB_WORKSPACE"-worktrees/cache-producer-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"-[ab])
                  git worktree remove -- "$tree" || cleanup_status=1 ;;
                *) echo "::error::Refusing unexpected producer worktree."; cleanup_status=1 ;;
              esac
            fi
          done
          if [[ -n "$TRIAL_INPUTS" ]]; then
            if [[ "$TRIAL_INPUTS" == "$GITHUB_WORKSPACE/.beep/cache/protected-producer-trial" ]]; then
              rm -rf -- "$TRIAL_INPUTS"
            else
              echo "::error::Refusing unexpected producer input directory."
              cleanup_status=1
            fi
          fi
          if [[ "$TRIAL_ROOT" == /var/tmp/beep-cache-producer-trial-v1 ]]; then
            rm -rf -- "$TRIAL_ROOT"
          else
            echo "::error::Refusing unexpected private producer directory."
            cleanup_status=1
          fi
          exit "$cleanup_status"
