name: Cache Producer Inspection

on:
  workflow_dispatch:

concurrency:
  group: cache-producer-inspection-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect producer sources and tools
    if: github.ref == 'refs/heads/main'
    # Runner-group workflow access is granted to the reusable Heavy leaf.
    uses: beep-effect/beep-effect/.github/workflows/heavy.yml@main
    with:
      admitted: false
      producer_inspection: true
