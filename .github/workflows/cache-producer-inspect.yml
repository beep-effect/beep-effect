name: Cache Producer Inspection

on:
  workflow_dispatch:

concurrency:
  group: cache-producer-inspection-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect producer sources and tools
    if: github.ref == 'refs/heads/main'
    # Runner-group workflow access is granted to the reusable Heavy leaf.
    # The reusable workflow's nested producer requests this validation ceiling.
    # Its selected inspection/preparation job retains contents-only permissions.
    permissions:
      contents: read
      actions: read
    uses: beep-effect/beep-effect/.github/workflows/heavy.yml@main
    with:
      admitted: false
      producer_inspection: true
