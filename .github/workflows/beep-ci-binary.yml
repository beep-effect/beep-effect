name: Beep CI Binary

# Compile the pre-toolchain `beep ci` commands (packages/tooling/tool/cli/src/bin-ci.ts)
# into a standalone linux-x64 executable and publish it as the release asset
# `beep-ci-<12-char sha>` with its sha256 checksum. Hosted jobs fetch a pinned
# tag and verify the pinned checksum before `bun install`; a pin bump is its
# own pull request (goals/scripts-to-beep-cli decision
# 2026-11-07-ci-binary-release-asset), which a main run opens on the fixed branch
# `ci/beep-ci-pin-bump` for review whenever main pins an older release than the
# newest one (PERIH-11 slice 2).
# Only main commits publish: the binary that gates a pull request is never built
# from that pull request's head.
#
# The path list below is only a coarse prefilter. A release is cut only when
# the binary's closure digest (`beep ci binary-closure`: the static import
# closure of bin-ci.ts, the workspace manifests and tsconfig chains it reaches,
# the root tsconfig, bun.lock, .bun-version, bunfig.toml, patches/, the compile
# recipe and this file) differs from
# the digest recorded on the latest `beep-ci-*` release and the compiled bytes
# differ from that release's binary; every release records its digest in its
# notes and a `beep-linux-x64.closure.json` asset, which a byte-identical
# rebuild re-records in place (goals/heavy-pool-diet PERIH-11).

on:
  push:
    branches: [main]
    paths:
      - packages/tooling/tool/cli/**
      - packages/tooling/library/**
      - packages/foundation/**
      - packages/drivers/**
      - bun.lock
      - .bun-version
      - bunfig.toml
      - patches/**
      - tsconfig.json
      - tsconfig.base.json
      - .github/workflows/beep-ci-binary.yml
  workflow_dispatch:
    inputs:
      verify_reproducible:
        description: >-
          Compile even when the closure is unchanged and require the sha256 of
          the latest release, which recorded the same closure digest.
        type: boolean
        default: false

# One run at a time, so each run compares its closure digest against the release
# the previous run published: two overlapping runs both read the older release and
# published the same closure twice (ad71f5cdb67, run 43347787888). A run in flight
# is never cancelled; a newer main push only replaces a still-pending run, and that
# newer commit's closure includes the pending one's changes. The group is keyed
# on the ref, so a dispatch from another ref (which fails without publishing)
# never takes main's pending slot and cancels a main push.
concurrency:
  group: beep-ci-binary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Beep CI Binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Read only: the pin step checks that the open pin-bump pull request
      # exists and carries ready-for-heavy before it treats the bump as done.
      pull-requests: read
    steps:
      # Publish only default-branch commits. A dispatch from another ref fails
      # here instead of skipping, so a verify_reproducible run never reports a
      # green check without comparing any bytes.
      - name: Require the default branch
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ "$RUN_REF" != "$DEFAULT_REF" ]]; then
            echo "::error::Beep CI Binary runs only on ${DEFAULT_REF}; this run is on ${RUN_REF}, so nothing was compiled, compared or published."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          use-node: "false"

      - name: Compare the closure digest with the latest release
        id: closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_REPRODUCIBLE: ${{ inputs.verify_reproducible }}
        run: |
          set -euo pipefail
          bun run beep ci binary-closure --out dist/beep-linux-x64.closure.json >/dev/null
          digest="$(jq -r .digest dist/beep-linux-x64.closure.json)"
          latest="$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("beep-ci-"))] | sort_by(.createdAt) | last | .tagName // ""')"
          recorded=""
          if [[ -n "$latest" ]] && gh release download "$latest" --pattern beep-linux-x64.closure.json \
            --dir "${RUNNER_TEMP}/latest-release" >/dev/null 2>&1; then
            recorded="$(jq -r .digest "${RUNNER_TEMP}/latest-release/beep-linux-x64.closure.json")"
          fi
          changed=true
          if [[ "$digest" == "$recorded" ]]; then changed=false; fi
          {
            echo "digest=$digest"
            echo "latest=$latest"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Beep CI binary closure"
            echo ""
            echo "- closure digest: \`$digest\`"
            echo "- latest release: \`${latest:-none}\` (recorded digest \`${recorded:-none}\`)"
            if [[ "$changed" == "true" ]]; then
              echo "- closure changed: compile and publish."
              if [[ "$VERIFY_REPRODUCIBLE" == "true" ]]; then
                echo "- not verified: the closure changed, so no release records this digest to reproduce."
              fi
            else
              echo "- closure unchanged: no compile, no release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "closure digest $digest; latest release ${latest:-none} recorded ${recorded:-none}; changed=$changed"

      - name: Compile the CI binary
        if: steps.closure.outputs.changed == 'true' || inputs.verify_reproducible
        shell: bash
        run: bun run beep ci compile-binary --outfile dist/beep-linux-x64

      - name: Verify the unchanged closure reproduces the released binary
        if: steps.closure.outputs.changed == 'false' && inputs.verify_reproducible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.closure.outputs.latest }}
        run: |
          set -euo pipefail
          gh release download "$LATEST_TAG" --pattern beep-linux-x64.sha256 --dir "${RUNNER_TEMP}/latest-release" --clobber
          released="$(cut -d' ' -f1 "${RUNNER_TEMP}/latest-release/beep-linux-x64.sha256")"
          compiled="$(cut -d' ' -f1 dist/beep-linux-x64.sha256)"
          {
            echo "- released sha256 (\`$LATEST_TAG\`): \`$released\`"
            echo "- recompiled sha256: \`$compiled\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$released" != "$compiled" ]]; then
            echo "::error::The unchanged closure compiled to $compiled, but $LATEST_TAG ships $released."
            exit 1
          fi
          echo "The unchanged closure reproduces $LATEST_TAG byte for byte ($compiled)."

      - name: Smoke-run the CI binary
        if: steps.closure.outputs.changed == 'true' || inputs.verify_reproducible
        shell: bash
        run: |
          (cd dist && sha256sum --check beep-linux-x64.sha256)
          GITHUB_EVENT_NAME=push GITHUB_OUTPUT="" dist/beep-linux-x64 ci change-profile
          dist/beep-linux-x64 ci patterns
          smoke_apt="$(mktemp -d)"
          touch "$smoke_apt/third-party.list" "$smoke_apt/ubuntu.sources"
          dist/beep-linux-x64 ci prune-apt "$smoke_apt"
          test ! -e "$smoke_apt/third-party.list" && test -e "$smoke_apt/ubuntu.sources"
          RUNNER_TEMP="$(mktemp -d)" dist/beep-linux-x64 ci runner-resources smoke -- true

      # A changed digest does not always mean changed bytes: tsconfig-sync rewrites
      # the root tsconfig.json alias table whenever a package is added or renamed,
      # and most of those edits never reach the binary. The build is reproducible
      # (run 43353769826), so identical bytes re-record the new digest on the latest
      # release instead of cutting a byte-identical one; the next run then sees the
      # closure as unchanged and skips the compile.
      - name: Compare the compiled binary with the latest release
        id: bytes
        if: steps.closure.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.closure.outputs.latest }}
        run: |
          set -euo pipefail
          compiled="$(cut -d' ' -f1 dist/beep-linux-x64.sha256)"
          released=""
          if [[ -n "$LATEST_TAG" ]] && gh release download "$LATEST_TAG" --pattern beep-linux-x64.sha256 \
            --dir "${RUNNER_TEMP}/latest-binary" --clobber >/dev/null 2>&1; then
            released="$(cut -d' ' -f1 "${RUNNER_TEMP}/latest-binary/beep-linux-x64.sha256")"
          fi
          same=false
          if [[ "$compiled" == "$released" ]]; then same=true; fi
          echo "same=$same" >> "$GITHUB_OUTPUT"
          {
            echo "- compiled sha256: \`$compiled\`; \`${LATEST_TAG:-none}\` ships \`${released:-none}\`"
            if [[ "$same" == "true" ]]; then
              echo "- identical bytes: re-record the new digest on \`$LATEST_TAG\`, no new release."
            else
              echo "- different bytes: publish a new release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-record the closure digest on the byte-identical release
        if: steps.closure.outputs.changed == 'true' && steps.bytes.outputs.same == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.closure.outputs.latest }}
          TARGET_SHA: ${{ github.sha }}
          CLOSURE_DIGEST: ${{ steps.closure.outputs.digest }}
        run: |
          set -euo pipefail
          gh release upload "$LATEST_TAG" dist/beep-linux-x64.closure.json --clobber
          notes="$(gh release view "$LATEST_TAG" --json body --jq .body)"
          gh release edit "$LATEST_TAG" --notes "${notes}
          Closure digest re-recorded: ${CLOSURE_DIGEST} at ${TARGET_SHA} (byte-identical rebuild)."
          echo "Re-recorded closure digest ${CLOSURE_DIGEST} on ${LATEST_TAG}; no new release."

      - name: Publish the release asset
        if: steps.closure.outputs.changed == 'true' && steps.bytes.outputs.same != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          CLOSURE_DIGEST: ${{ steps.closure.outputs.digest }}
        run: |
          tag="beep-ci-${TARGET_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" dist/beep-linux-x64 dist/beep-linux-x64.sha256 dist/beep-linux-x64.closure.json \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --notes "Pre-toolchain beep CI binary (linux-x64) compiled from ${TARGET_SHA}. Closure digest: ${CLOSURE_DIGEST} (beep ci binary-closure)." \
            --latest=false

      # PERIH-11 slice 2: when the newest `beep-ci-*` release is not the one
      # .github/actions/fetch-beep-ci/action.yml pins on main, open or update one
      # reviewed pull request that moves the pin to it. The decision is read from
      # state, not from this run's history, so a re-run after a failed
      # pull-request step (which takes the closure-unchanged skip path, because
      # the first attempt's release already records this digest) still opens it.
      # Once a bump merges, the pin equals the newest release, and a skipped
      # closure or a byte-identical re-record cuts no new release, so neither
      # opens anything. Nothing runs on a verify_reproducible dispatch or off the
      # default branch. The rewrite is the tested `beep ci binary-pin` command,
      # and keeping an open pin-bump branch mergeable with main is the tested
      # `beep ci binary-pin-sync` command. The pull request is opened, and a
      # merge of main is pushed, by the knowledge-mint App (its token is minted
      # in the step right before those steps and used there only), because a
      # pull request or push made with github.token starts no workflows and
      # could never pass its own Check. The App has no `workflows` permission:
      # the pin is a composite action, not a workflow file, but a merge of main
      # that changes a workflow file cannot be pushed (see the push step). The
      # pull request is never auto-merged.
      - name: Rewrite the pin to the newest release
        id: pin
        if: >-
          !inputs.verify_reproducible
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PIN_BRANCH: ci/beep-ci-pin-bump
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          releases="${RUNNER_TEMP}/beep-ci-releases.json"
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("beep-ci-"))]' > "$releases"
          tag="$(jq -r 'sort_by(.createdAt) | last | .tagName // ""' "$releases")"
          if [[ -z "$tag" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No beep-ci-* release exists; nothing to pin."
            exit 0
          fi
          # Two releases created at the same instant have no order: fail closed
          # instead of picking one.
          newest_count="$(jq '(map(.createdAt) | max) as $at | [.[] | select(.createdAt == $at)] | length' "$releases")"
          if [[ "$newest_count" -gt 1 ]]; then
            echo "::error::Beep CI pin bump: ${newest_count} beep-ci-* releases share the newest creation time, so the newest release is ambiguous; nothing was pinned."
            exit 1
          fi
          # The sha256 always comes from the release asset, never from a branch.
          release_facts() {
            local dir="${RUNNER_TEMP}/release-$1"
            gh release download "$1" --pattern beep-linux-x64.sha256 --dir "$dir" --clobber
            sha256="$(cut -d' ' -f1 "$dir/beep-linux-x64.sha256")"
            digest="none recorded"
            if gh release download "$1" --pattern beep-linux-x64.closure.json --dir "$dir" --clobber >/dev/null 2>&1; then
              digest="$(jq -r .digest "$dir/beep-linux-x64.closure.json")"
            fi
            target="$(gh release view "$1" --json targetCommitish --jq .targetCommitish)"
          }
          release_facts "$tag"
          bun run beep ci binary-pin --tag "$tag" --sha256 "$sha256" --write
          # Decide only from state actually read: a failed lookup fails the step
          # (no push, no pull request) instead of reading as "nothing there".
          lookup_failed() {
            echo "::error::Beep CI pin bump: $1 failed, so the bump state is unknown; no branch was pushed and no pull request was opened. Re-run the job."
            echo "- $1 failed: bump state unknown; nothing pushed, no pull request opened." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # Read the pin file at a ref into pin_text. A 404 is "no such branch"
          # only where $3 allows it; any other failure fails the step.
          read_error="${RUNNER_TEMP}/pin-read.err"
          read_pin() {
            local content
            pin_text=""
            if content="$(gh api "repos/${GH_REPO}/contents/.github/actions/fetch-beep-ci/action.yml?ref=$1" \
              --jq .content 2>"$read_error")"; then
              pin_text="$(base64 --decode <<<"$content")"
            elif [[ "$3" == "allow-missing" ]] && grep -q "HTTP 404" "$read_error"; then
              pin_text=""
            else
              cat "$read_error" >&2
              lookup_failed "$2"
            fi
          }
          pins_release() {
            grep -Eq "^[[:space:]]*BEEP_CI_RELEASE_TAG:[[:space:]]*${tag}[[:space:]]*$" <<<"$1" \
              && grep -Eq "^[[:space:]]*BEEP_CI_SHA256:[[:space:]]*${sha256}[[:space:]]*$" <<<"$1"
          }
          changed=false
          if ! git diff --quiet -- .github/actions/fetch-beep-ci/action.yml; then changed=true; fi
          # The checkout is this run's commit, not the branch tip: a re-run of an
          # older job after the bump merged still sees the old pin. Live main
          # pinning this release means there is nothing to bump.
          if [[ "$changed" == "true" ]]; then
            read_pin "$DEFAULT_BRANCH" "the live ${DEFAULT_BRANCH} pin read" require
            if pins_release "$pin_text"; then changed=false; fi
          fi
          # The newest release T is read from state, in this order (#3299 review):
          # - a CLOSED, unmerged pin-bump pull request titled for T that a person
          #   closed (no `superseded` label): the bump was declined on purpose, so
          #   it stays parked (no push, no reopen) until a newer release, which is
          #   a new bump. One this workflow closed as `superseded` does not park;
          # - the branch exists (whether or not its pin parses): `beep ci
          #   binary-pin-sync` decides from the branch head; an unparseable pin is
          #   stale. It never moves a pin backwards (an
          #   older or unlisted branch tag never reads as newer; an unlisted one
          #   fails). `current`: nothing to do. `merged`: main merged in with the
          #   pin file resolved to main's text and only the two pinned lines set;
          #   the push step pushes it without force, so the pull request keeps its
          #   number and review history. `supersede`: the merge, or the
          #   create-pull-request update of a stale branch, would carry workflow
          #   files, which the pin-bump App (no `workflows` permission) cannot push
          #   onto an existing branch, and the branch holds only the pin: the pull
          #   request is labelled `superseded`, its branch deleted, and the
          #   pull-request step opens a fresh one from main with the branch's pin
          #   (the newest release, for a stale branch). `blocked`: the sync cannot
          #   heal the branch (for a stale one, the reason names the newer release
          #   that is waiting); it is reported once on the pull request and as a
          #   warning, and the job stays green. `stale`: a newer release whose
          #   update carries no workflow file, which the pull-request step bumps;
          # - anything else (no branch, a pull request missing or unlabelled
          #   because creation failed after the push, a re-run after a failed
          #   pull-request step): run the pull-request step, which opens or
          #   repairs the pull request and its label.
          # Only pull requests from this repository into the default branch count:
          # a fork can use the same branch name and title (this repository is
          # public), and --head matches by branch name alone.
          bump=false
          parked=false
          push=false
          supersede=false
          report=false
          relabel=false
          sync="none"
          reason=""
          branch_tag=""
          branch_pull=""
          branch_head=""
          worktree="${RUNNER_TEMP}/pin-bump-branch"
          if [[ "$changed" == "true" ]]; then
            title="ci: bump the beep CI binary pin to ${tag}"
            pulls="$(gh pr list --head "$PIN_BRANCH" --base "$DEFAULT_BRANCH" --state all --limit 1000 \
              --json number,state,title,labels,isCrossRepository,baseRefName)" \
              || lookup_failed "the pin-bump pull request lookup"
            own='.[] | select(.isCrossRepository == false and .baseRefName == $base and .title == $title)'
            labelled='select(.state == "OPEN" and any(.labels[]; .name == "ready-for-heavy"))'
            declined='select(.state == "CLOSED" and (any(.labels[]; .name == "superseded") | not))'
            closed="$(jq --arg title "$title" --arg base "$DEFAULT_BRANCH" \
              "[${own} | ${declined}] | length" <<<"$pulls")"
            read_pin "$PIN_BRANCH" "the pin-bump branch read" allow-missing
            # Whether the bot branch exists is read from its ref: a missing or empty pin
            # file on an existing branch reads as an empty pin_text too, and that branch
            # still goes through the sync (as an unparseable pin), never a blind reset.
            branch_exists=true
            if ! gh api "repos/${GH_REPO}/git/ref/heads/${PIN_BRANCH}" --jq .object.sha >/dev/null 2>"$read_error"; then
              if grep -q "HTTP 404" "$read_error"; then
                branch_exists=false
              else
                cat "$read_error" >&2
                lookup_failed "the pin-bump branch ref lookup"
              fi
            fi
            branch_tag="$(grep -E '^[[:space:]]*BEEP_CI_RELEASE_TAG:[[:space:]]*beep-ci-[0-9a-f]{12}[[:space:]]*$' <<<"$pin_text" \
              | grep -Eo 'beep-ci-[0-9a-f]{12}' | head -n 1 || true)"
            branch_open_labelled=0
            if [[ -n "$branch_tag" ]]; then
              branch_title="ci: bump the beep CI binary pin to ${branch_tag}"
              branch_open_labelled="$(jq --arg title "$branch_title" --arg base "$DEFAULT_BRANCH" \
                "[${own} | ${labelled}] | length" <<<"$pulls")"
            fi
            # The open pull request on the bot branch, whatever its title (the branch's
            # pin may not parse), is the one a supersede closes or a report comments on.
            branch_pull="$(jq -r --arg base "$DEFAULT_BRANCH" \
              '[.[] | select(.isCrossRepository == false and .baseRefName == $base and .state == "OPEN")] | first | .number // ""' \
              <<<"$pulls")"
            if [[ "$closed" -ge 1 ]]; then
              parked=true
            elif [[ "$branch_exists" != "true" ]]; then
              # No bot branch: the pull-request step creates it from main.
              bump=true
            else
              # The checkout is shallow; a merge needs both histories.
              git fetch --no-tags --unshallow origin \
                "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" \
                "+refs/heads/${PIN_BRANCH}:refs/remotes/origin/${PIN_BRANCH}"
              branch_head="$(git rev-parse "refs/remotes/origin/${PIN_BRANCH}")"
              git worktree add --detach "$worktree" "$branch_head"
              git -C "$worktree" config user.name "beep-ci-pin-bump"
              git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C "$worktree" config pull.rebase false
              sync_output="${RUNNER_TEMP}/pin-sync.out"
              # The base is this run's own main commit (the checkout create-pull-request
              # builds from), not the fetched tip, so a supersede and its replacement
              # are decided against the same main.
              bun run beep ci binary-pin-sync --cwd "$worktree" --base "$GITHUB_SHA" \
                --tag "$tag" --sha256 "$sha256" --releases "$releases" --output "$sync_output"
              sync="$(grep -m 1 '^outcome=' "$sync_output" | cut -d = -f 2 || true)"
              kept_tag="$(grep -m 1 '^tag=' "$sync_output" | cut -d = -f 2 || true)"
              reason="$(grep -m 1 '^reason=' "$sync_output" | cut -d = -f 2- || true)"
              pin_only="$(grep -m 1 '^pin_only=' "$sync_output" | cut -d = -f 2 || true)"
              case "$sync" in
                stale) bump=true ;;
                current | merged)
                  # Decide from the pin the sync read at the checked head (kept_tag), not
                  # from the earlier contents read, which the branch may have moved past.
                  kept_title="ci: bump the beep CI binary pin to ${kept_tag}"
                  kept_labelled="$(jq --arg title "$kept_title" --arg base "$DEFAULT_BRANCH" \
                    "[${own} | ${labelled}] | length" <<<"$pulls")"
                  kept_open="$(jq -r --arg title "$kept_title" --arg base "$DEFAULT_BRANCH" \
                    "[${own} | select(.state == \"OPEN\")] | first | .number // \"\"" <<<"$pulls")"
                  if [[ "$sync" == "merged" ]]; then push=true; fi
                  if [[ "$kept_labelled" -lt 1 && -n "$kept_open" ]]; then
                    # The pull request is open but unlabelled: a metadata-only repair,
                    # so the branch (and the merge pushed below) is kept as it is.
                    relabel=true
                    branch_pull="$kept_open"
                  elif [[ "$kept_labelled" -lt 1 && "$kept_tag" == "$tag" && "$pin_only" == "true" ]]; then
                    # No pull request for T: the pull-request step opens it. The branch holds
                    # only the pin, so its rebuild from main loses nothing.
                    bump=true
                    push=false
                  elif [[ "$kept_labelled" -lt 1 && "$kept_tag" == "$tag" ]]; then
                    report=true
                    reason="the pin-bump pull request for ${tag} is missing and ${PIN_BRANCH} holds changes besides the pin, which opening it with create-pull-request would discard; open the pull request by hand"
                    echo "::warning::Beep CI pin bump: ${reason}."
                  fi
                  ;;
                supersede)
                  supersede=true
                  bump=true
                  # A newer release the branch already held stays the pin; its
                  # facts are read from that release, never from the branch.
                  if [[ -n "$kept_tag" && "$kept_tag" != "$tag" ]]; then
                    tag="$kept_tag"
                    release_facts "$tag"
                    bun run beep ci binary-pin --tag "$tag" --sha256 "$sha256" --write
                  fi
                  ;;
                blocked)
                  report=true
                  echo "::warning::Beep CI pin bump: ${PIN_BRANCH} cannot be brought up to date with ${DEFAULT_BRANCH}: ${reason}. Bring it up to date by hand."
                  ;;
                *) echo "::error::beep ci binary-pin-sync reported no outcome."; exit 1 ;;
              esac
            fi
          fi
          {
            echo "changed=$changed"
            echo "bump=$bump"
            echo "parked=$parked"
            echo "push=$push"
            echo "supersede=$supersede"
            echo "report=$report"
            echo "relabel=$relabel"
            echo "reason=$reason"
            echo "pull=$branch_pull"
            echo "branch_tag=$branch_tag"
            echo "branch_head=$branch_head"
            echo "worktree=$worktree"
            echo "tag=$tag"
            echo "sha256=$sha256"
            echo "digest=$digest"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Beep CI binary pin"
            echo ""
            echo "- pinned release: \`$tag\` (sha256 \`$sha256\`, closure digest \`$digest\`, built from \`$target\`)"
            if [[ "$changed" != "true" ]]; then
              echo "- main already pins it (checked against live \`$DEFAULT_BRANCH\`): no pin-bump pull request."
              exit 0
            fi
            if [[ "$parked" == "true" ]]; then
              echo "- main pins an older release, and a pin-bump pull request for \`$tag\` was closed unmerged: parked until a newer release; no push, no reopen."
              exit 0
            fi
            if [[ "$report" == "true" && "$push" == "true" ]]; then
              echo "- \`$PIN_BRANCH\`: ${reason}. Main was merged in, and the push step below pushes that merge without force; only the step above needs a hand, and it is reported once."
              exit 0
            fi
            if [[ "$report" == "true" ]]; then
              echo "- \`$PIN_BRANCH\` (pinning \`$branch_tag\`) cannot be brought up to date with \`$DEFAULT_BRANCH\`: ${reason}. Nothing was pushed; it is reported once on the pin-bump pull request. Bring it up to date by hand."
              exit 0
            fi
            if [[ "$relabel" == "true" ]]; then
              echo "- the pin-bump pull request #${branch_pull} for \`$kept_tag\` lost \`ready-for-heavy\`: the label is restored without rewriting \`$PIN_BRANCH\`."
            fi
            if [[ "$push" == "true" ]]; then
              echo "- \`$PIN_BRANCH\` (pinning \`$branch_tag\`) was behind \`$DEFAULT_BRANCH\` or in conflict with it: \`beep ci binary-pin-sync\` merged \`$DEFAULT_BRANCH\` in; the push step below pushes it."
              exit 0
            fi
            if [[ "$bump" != "true" ]]; then
              echo "- main pins an older release, and \`$PIN_BRANCH\` already pins \`$branch_tag\` and contains \`$DEFAULT_BRANCH\` (sync: \`$sync\`): no push, no pull-request edit."
              exit 0
            fi
            if [[ "$supersede" == "true" ]]; then
              echo "- bringing \`$PIN_BRANCH\` up to date with \`$DEFAULT_BRANCH\` would carry workflow files, which the pin-bump App cannot push onto an existing branch, and the branch holds only the pin: the open pull request is closed as \`superseded\` and a fresh one is opened for \`$tag\`."
            fi
            echo "- main pins an older release: open or update the pin-bump pull request on \`$PIN_BRANCH\`."
            echo ""
            echo "If no pull request was opened below, an agent opens it by hand from main:"
            echo ""
            echo '```bash'
            echo "git switch -c $PIN_BRANCH origin/main"
            echo "bun run beep ci binary-pin --tag $tag --sha256 $sha256 --write"
            echo "git commit -am 'ci: bump the beep CI binary pin to $tag'"
            echo "bun run beep yeet open"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail closed: without the App credential the only token left is
      # github.token, whose pull request would start no Check run.
      - name: Check the pin-bump App credential
        if: >-
          steps.pin.outputs.bump == 'true' || steps.pin.outputs.push == 'true'
          || steps.pin.outputs.supersede == 'true' || steps.pin.outputs.report == 'true'
          || steps.pin.outputs.relabel == 'true'
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.KNOWLEDGE_MINT_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            message="KNOWLEDGE_MINT_APP_CLIENT_ID is not set, so no App token can open the pin-bump pull request; a github.token pull request would start no Check run. Open it by hand with the commands above."
            echo "::error::${message}"
            echo "- ${message}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create pin-bump App token
        id: app-token
        if: >-
          steps.pin.outputs.bump == 'true' || steps.pin.outputs.push == 'true'
          || steps.pin.outputs.supersede == 'true' || steps.pin.outputs.report == 'true'
          || steps.pin.outputs.relabel == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KNOWLEDGE_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KNOWLEDGE_MINT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # create-pull-request applies `ready-for-heavy` through the Issues labels API.
          permission-issues: write

      # `supersede`: the pin step found that merging main into the branch, or
      # updating a stale branch to main, would carry workflow files (the App
      # has no `workflows` permission, so it cannot push them onto the existing
      # branch) and that the branch holds only the pin. Label the
      # open pull request `superseded` (a closed `superseded` pull request does
      # not park its release), say why, and delete the branch, which closes the
      # pull request; the pull-request step below then opens a fresh one from
      # main. The branch is deleted by a lease-protected push (the one forced
      # form this workflow allows), so only the head the sync checked is ever
      # deleted, and a failed delete takes the label off again. `relabel`: the
      # pull request for the branch's pin is open but lost `ready-for-heavy`;
      # restore the label without rewriting the branch. `report`: the sync cannot
      # heal the branch; comment once per branch head on the pull request (the pin
      # step already wrote the warning and the summary), and keep the job green.
      - name: Supersede or report on the pin-bump pull request
        if: >-
          steps.pin.outputs.supersede == 'true' || steps.pin.outputs.report == 'true'
          || steps.pin.outputs.relabel == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PIN_BRANCH: ci/beep-ci-pin-bump
          PULL: ${{ steps.pin.outputs.pull }}
          BRANCH_HEAD: ${{ steps.pin.outputs.branch_head }}
          PIN_TAG: ${{ steps.pin.outputs.tag }}
          REASON: ${{ steps.pin.outputs.reason }}
          SUPERSEDE: ${{ steps.pin.outputs.supersede }}
          RELABEL: ${{ steps.pin.outputs.relabel }}
          PUSHED: ${{ steps.pin.outputs.push }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$SUPERSEDE" == "true" ]]; then
            if [[ ! "$BRANCH_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The checked ${PIN_BRANCH} head '${BRANCH_HEAD}' is not a full sha; nothing was superseded."
              exit 1
            fi
            live="$(gh api "repos/${GH_REPO}/git/ref/heads/${PIN_BRANCH}" --jq .object.sha)"
            if [[ "$live" != "$BRANCH_HEAD" ]]; then
              echo "::error::${PIN_BRANCH} moved from ${BRANCH_HEAD} to ${live} after the sync checked it; nothing was superseded. Re-run the job."
              exit 1
            fi
            # Label first, so the close the deletion causes is never read as a person's decline. If
            # the deletion fails, the label comes off again: a `superseded` label on a still-open pull
            # request would otherwise stop a later manual close from parking the release.
            if [[ -n "$PULL" ]]; then
              gh api -X POST "repos/${GH_REPO}/issues/${PULL}/labels" -f 'labels[]=superseded' >/dev/null
            fi
            # A conditional delete: the server deletes the branch only while it still points at the
            # head the sync checked, so a push after the check above is never deleted.
            if ! git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/${PIN_BRANCH}:${BRANCH_HEAD}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" ":refs/heads/${PIN_BRANCH}"; then
              if [[ -n "$PULL" ]]; then
                gh api -X DELETE "repos/${GH_REPO}/issues/${PULL}/labels/superseded" >/dev/null || true
              fi
              echo "::error::Deleting ${PIN_BRANCH} at ${BRANCH_HEAD} failed (it may have moved); nothing was superseded. Re-run the job."
              exit 1
            fi
            if [[ -n "$PULL" ]]; then
              gh api -X POST "repos/${GH_REPO}/issues/${PULL}/comments" -f body="Superseded by [this run](${RUN_URL}): bringing \`${PIN_BRANCH}\` up to date with main would carry workflow-file changes, which the pin-bump App (no \`workflows\` permission) cannot push onto an existing branch. The branch held only the pin, so it is deleted and a fresh pin-bump pull request for \`${PIN_TAG}\` is opened from main." >/dev/null \
                || echo "::warning::The superseded comment on #${PULL} failed; the branch is deleted and the fresh pull request still opens."
            fi
            echo "- superseded the pin-bump pull request ${PULL:+#${PULL} }and deleted \`${PIN_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RELABEL" == "true" ]]; then
            gh api -X POST "repos/${GH_REPO}/issues/${PULL}/labels" -f 'labels[]=ready-for-heavy' >/dev/null
            echo "- restored \`ready-for-heavy\` on #${PULL} without touching \`${PIN_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$PULL" ]]; then
            echo "- no open pin-bump pull request to comment on." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="<!-- beep-ci-pin-sync blocked ${BRANCH_HEAD} -->"
          seen="$(gh api --paginate "repos/${GH_REPO}/issues/${PULL}/comments" \
            --jq "[.[] | select(.body | contains(\"${marker}\"))] | length" | jq -s add)"
          if [[ "${seen:-0}" -ge 1 ]]; then
            echo "- already reported on #${PULL} for \`${BRANCH_HEAD}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Say what this run does: when the merge is pushed too, only the reported step needs a hand.
          done_text="Nothing was pushed. Bring the branch up to date by hand"
          if [[ "$PUSHED" == "true" ]]; then
            done_text="This run merged main in and pushes that merge without force; only the step above needs a hand"
          fi
          gh api -X POST "repos/${GH_REPO}/issues/${PULL}/comments" -f body="${marker}
          The pin-bump workflow ([run](${RUN_URL})) reports for \`${PIN_BRANCH}\`: ${REASON}. ${done_text}; this is reported once per branch head." >/dev/null
          echo "- reported on #${PULL}." >> "$GITHUB_STEP_SUMMARY"

      # `merged`: the pin step merged main into the pin-bump branch (it was
      # behind or in conflict, and the merge carries no workflow file). Push that
      # merge with the same App token create-pull-request uses, so CI runs on the
      # new head; never force, so the pull request keeps its number and review
      # history. A branch that moved since the fetch makes this a
      # non-fast-forward push, which fails. The token is used here only, on an
      # explicit URL; it never enters git config.
      - name: Push main merged into the pin-bump branch
        if: steps.pin.outputs.push == 'true'
        shell: bash
        env:
          PIN_BRANCH: ci/beep-ci-pin-bump
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKTREE: ${{ steps.pin.outputs.worktree }}
          BRANCH_TAG: ${{ steps.pin.outputs.branch_tag }}
        run: |
          set -euo pipefail
          git -C "$WORKTREE" -c core.hooksPath=/dev/null push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PIN_BRANCH}"
          echo "- pushed main merged into \`${PIN_BRANCH}\` (pinning \`${BRANCH_TAG}\`) without force at \`$(git -C "$WORKTREE" rev-parse HEAD)\`; no pull-request edit." >> "$GITHUB_STEP_SUMMARY"

      # One fixed branch: this step runs only when the bump for the newest release
      # is neither done nor parked (see the pin step), so an open pin-bump pull
      # request is force-updated (and its title and body refreshed) by a newer
      # release or a repair only, never by a main push alone, and a second one is
      # never opened. After a supersede the branch is gone, so this opens a fresh
      # pull request from main. A pin-bump pull request a person closed unmerged
      # parks that release until a newer one. The repo's lefthook hooks are for people.
      - name: Open or update the pin-bump pull request
        if: steps.pin.outputs.bump == 'true'
        env:
          LEFTHOOK: "0"
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: ci/beep-ci-pin-bump
          delete-branch: true
          add-paths: .github/actions/fetch-beep-ci/action.yml
          labels: ready-for-heavy
          commit-message: "ci: bump the beep CI binary pin to ${{ steps.pin.outputs.tag }}"
          title: "ci: bump the beep CI binary pin to ${{ steps.pin.outputs.tag }}"
          body: |
            Opened by `.github/workflows/beep-ci-binary.yml` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) because main pins an older CI binary than the newest `beep-ci-*` release.

            - release tag: `${{ steps.pin.outputs.tag }}`
            - closure digest: `${{ steps.pin.outputs.digest }}`
            - `beep-linux-x64` sha256: `${{ steps.pin.outputs.sha256 }}`
            - release built from main commit: `${{ steps.pin.outputs.target }}`
            - opened at main commit: `${{ github.sha }}`

            The diff is the two pinned values in `.github/actions/fetch-beep-ci/action.yml`, written by
            `bun run beep ci binary-pin --write`. Every hosted job that fetches the CI binary runs the new
            pin on this pull request, so its own Check is the proof. A human or agent reviews and merges it;
            it is never auto-merged. A newer release force-updates this branch instead of opening a second
            pull request. Rollback: revert the squash commit to restore the previous pin.
