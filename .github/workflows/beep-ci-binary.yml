name: Beep CI Binary

# Compile the pre-toolchain `beep ci` commands (packages/tooling/tool/cli/src/bin-ci.ts)
# into a standalone linux-x64 executable and publish it as the release asset
# `beep-ci-<12-char sha>` with its sha256 checksum. Hosted jobs fetch a pinned
# tag and verify the pinned checksum before `bun install`; a pin bump is its
# own pull request (goals/scripts-to-beep-cli decision
# 2026-11-07-ci-binary-release-asset), which a run that publishes a new release
# opens on the fixed branch `ci/beep-ci-pin-bump` for review (PERIH-11 slice 2).
# Only main commits publish: the binary that gates a pull request is never built
# from that pull request's head.
#
# The path list below is only a coarse prefilter. A release is cut only when
# the binary's closure digest (`beep ci binary-closure`: the static import
# closure of bin-ci.ts, the workspace manifests and tsconfig chains it reaches,
# the root tsconfig, bun.lock, .bun-version, bunfig.toml, patches/, the compile
# recipe and this file) differs from
# the digest recorded on the latest `beep-ci-*` release and the compiled bytes
# differ from that release's binary; every release records its digest in its
# notes and a `beep-linux-x64.closure.json` asset, which a byte-identical
# rebuild re-records in place (goals/heavy-pool-diet PERIH-11).

on:
  push:
    branches: [main]
    paths:
      - packages/tooling/tool/cli/**
      - packages/tooling/library/**
      - packages/foundation/**
      - packages/drivers/**
      - bun.lock
      - .bun-version
      - bunfig.toml
      - patches/**
      - tsconfig.json
      - tsconfig.base.json
      - .github/workflows/beep-ci-binary.yml
  workflow_dispatch:
    inputs:
      verify_reproducible:
        description: >-
          Compile even when the closure is unchanged and require the sha256 of
          the latest release, which recorded the same closure digest.
        type: boolean
        default: false

# One run at a time, so each run compares its closure digest against the release
# the previous run published: two overlapping runs both read the older release and
# published the same closure twice (ad71f5cdb67, run 43347787888). A run in flight
# is never cancelled; a newer main push only replaces a still-pending run, and that
# newer commit's closure includes the pending one's changes. The group is keyed
# on the ref, so a dispatch from another ref (which fails without publishing)
# never takes main's pending slot and cancels a main push.
concurrency:
  group: beep-ci-binary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Beep CI Binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Publish only default-branch commits. A dispatch from another ref fails
      # here instead of skipping, so a verify_reproducible run never reports a
      # green check without comparing any bytes.
      - name: Require the default branch
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ "$RUN_REF" != "$DEFAULT_REF" ]]; then
            echo "::error::Beep CI Binary runs only on ${DEFAULT_REF}; this run is on ${RUN_REF}, so nothing was compiled, compared or published."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          use-node: "false"

      - name: Compare the closure digest with the latest release
        id: closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_REPRODUCIBLE: ${{ inputs.verify_reproducible }}
        run: |
          set -euo pipefail
          bun run beep ci binary-closure --out dist/beep-linux-x64.closure.json >/dev/null
          digest="$(jq -r .digest dist/beep-linux-x64.closure.json)"
          latest="$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("beep-ci-"))] | sort_by(.createdAt) | last | .tagName // ""')"
          recorded=""
          if [[ -n "$latest" ]] && gh release download "$latest" --pattern beep-linux-x64.closure.json \
            --dir "${RUNNER_TEMP}/latest-release" >/dev/null 2>&1; then
            recorded="$(jq -r .digest "${RUNNER_TEMP}/latest-release/beep-linux-x64.closure.json")"
          fi
          changed=true
          if [[ "$digest" == "$recorded" ]]; then changed=false; fi
          {
            echo "digest=$digest"
            echo "latest=$latest"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Beep CI binary closure"
            echo ""
            echo "- closure digest: \`$digest\`"
            echo "- latest release: \`${latest:-none}\` (recorded digest \`${recorded:-none}\`)"
            if [[ "$changed" == "true" ]]; then
              echo "- closure changed: compile and publish."
              if [[ "$VERIFY_REPRODUCIBLE" == "true" ]]; then
                echo "- not verified: the closure changed, so no release records this digest to reproduce."
              fi
            else
              echo "- closure unchanged: no compile, no release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "closure digest $digest; latest release ${latest:-none} recorded ${recorded:-none}; changed=$changed"

      - name: Compile the CI binary
        if: steps.closure.outputs.changed == 'true' || inputs.verify_reproducible
        shell: bash
        run: bun run beep ci compile-binary --outfile dist/beep-linux-x64

      - name: Verify the unchanged closure reproduces the released binary
        if: steps.closure.outputs.changed == 'false' && inputs.verify_reproducible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.closure.outputs.latest }}
        run: |
          set -euo pipefail
          gh release download "$LATEST_TAG" --pattern beep-linux-x64.sha256 --dir "${RUNNER_TEMP}/latest-release" --clobber
          released="$(cut -d' ' -f1 "${RUNNER_TEMP}/latest-release/beep-linux-x64.sha256")"
          compiled="$(cut -d' ' -f1 dist/beep-linux-x64.sha256)"
          {
            echo "- released sha256 (\`$LATEST_TAG\`): \`$released\`"
            echo "- recompiled sha256: \`$compiled\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$released" != "$compiled" ]]; then
            echo "::error::The unchanged closure compiled to $compiled, but $LATEST_TAG ships $released."
            exit 1
          fi
          echo "The unchanged closure reproduces $LATEST_TAG byte for byte ($compiled)."

      - name: Smoke-run the CI binary
        if: steps.closure.outputs.changed == 'true' || inputs.verify_reproducible
        shell: bash
        run: |
          (cd dist && sha256sum --check beep-linux-x64.sha256)
          GITHUB_EVENT_NAME=push GITHUB_OUTPUT="" dist/beep-linux-x64 ci change-profile
          dist/beep-linux-x64 ci patterns
          smoke_apt="$(mktemp -d)"
          touch "$smoke_apt/third-party.list" "$smoke_apt/ubuntu.sources"
          dist/beep-linux-x64 ci prune-apt "$smoke_apt"
          test ! -e "$smoke_apt/third-party.list" && test -e "$smoke_apt/ubuntu.sources"
          RUNNER_TEMP="$(mktemp -d)" dist/beep-linux-x64 ci runner-resources smoke -- true

      # A changed digest does not always mean changed bytes: tsconfig-sync rewrites
      # the root tsconfig.json alias table whenever a package is added or renamed,
      # and most of those edits never reach the binary. The build is reproducible
      # (run 43353769826), so identical bytes re-record the new digest on the latest
      # release instead of cutting a byte-identical one; the next run then sees the
      # closure as unchanged and skips the compile.
      - name: Compare the compiled binary with the latest release
        id: bytes
        if: steps.closure.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.closure.outputs.latest }}
        run: |
          set -euo pipefail
          compiled="$(cut -d' ' -f1 dist/beep-linux-x64.sha256)"
          released=""
          if [[ -n "$LATEST_TAG" ]] && gh release download "$LATEST_TAG" --pattern beep-linux-x64.sha256 \
            --dir "${RUNNER_TEMP}/latest-binary" --clobber >/dev/null 2>&1; then
            released="$(cut -d' ' -f1 "${RUNNER_TEMP}/latest-binary/beep-linux-x64.sha256")"
          fi
          same=false
          if [[ "$compiled" == "$released" ]]; then same=true; fi
          echo "same=$same" >> "$GITHUB_OUTPUT"
          {
            echo "- compiled sha256: \`$compiled\`; \`${LATEST_TAG:-none}\` ships \`${released:-none}\`"
            if [[ "$same" == "true" ]]; then
              echo "- identical bytes: re-record the new digest on \`$LATEST_TAG\`, no new release."
            else
              echo "- different bytes: publish a new release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-record the closure digest on the byte-identical release
        if: steps.closure.outputs.changed == 'true' && steps.bytes.outputs.same == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.closure.outputs.latest }}
          TARGET_SHA: ${{ github.sha }}
          CLOSURE_DIGEST: ${{ steps.closure.outputs.digest }}
        run: |
          set -euo pipefail
          gh release upload "$LATEST_TAG" dist/beep-linux-x64.closure.json --clobber
          notes="$(gh release view "$LATEST_TAG" --json body --jq .body)"
          gh release edit "$LATEST_TAG" --notes "${notes}
          Closure digest re-recorded: ${CLOSURE_DIGEST} at ${TARGET_SHA} (byte-identical rebuild)."
          echo "Re-recorded closure digest ${CLOSURE_DIGEST} on ${LATEST_TAG}; no new release."

      - name: Publish the release asset
        id: publish
        if: steps.closure.outputs.changed == 'true' && steps.bytes.outputs.same != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          CLOSURE_DIGEST: ${{ steps.closure.outputs.digest }}
        run: |
          set -euo pipefail
          tag="beep-ci-${TARGET_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # An earlier attempt of this run published it; pin what that release ships.
            echo "Release $tag already exists; nothing to publish."
            gh release download "$tag" --pattern beep-linux-x64.sha256 --dir "${RUNNER_TEMP}/published" --clobber
            sha256="$(cut -d' ' -f1 "${RUNNER_TEMP}/published/beep-linux-x64.sha256")"
          else
            gh release create "$tag" dist/beep-linux-x64 dist/beep-linux-x64.sha256 dist/beep-linux-x64.closure.json \
              --target "$TARGET_SHA" \
              --title "$tag" \
              --notes "Pre-toolchain beep CI binary (linux-x64) compiled from ${TARGET_SHA}. Closure digest: ${CLOSURE_DIGEST} (beep ci binary-closure)." \
              --latest=false
            sha256="$(cut -d' ' -f1 dist/beep-linux-x64.sha256)"
          fi
          {
            echo "published=true"
            echo "tag=$tag"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      # PERIH-11 slice 2: a release published by this run opens one reviewed pull
      # request that moves the pin in .github/actions/fetch-beep-ci/action.yml to
      # it. Nothing here runs for a skipped closure, a byte-identical re-record, a
      # verify_reproducible dispatch or another ref. The rewrite is the tested
      # `beep ci binary-pin` command; the pull request is opened by the
      # knowledge-mint App (its token is minted in the step right before the
      # pull-request step and used there only), because a pull request opened
      # with github.token starts no workflows and could never pass its own Check.
      # The App needs no `workflows` permission: the pin is a composite action,
      # not a workflow file. The pull request is never auto-merged.
      - name: Rewrite the pin to the new release
        id: pin
        if: >-
          steps.publish.outputs.published == 'true'
          && !inputs.verify_reproducible
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          PIN_TAG: ${{ steps.publish.outputs.tag }}
          PIN_SHA256: ${{ steps.publish.outputs.sha256 }}
          PIN_BRANCH: ci/beep-ci-pin-bump
        run: |
          set -euo pipefail
          bun run beep ci binary-pin --tag "$PIN_TAG" --sha256 "$PIN_SHA256" --write
          {
            echo "### Beep CI binary pin bump"
            echo ""
            echo "- new release: \`$PIN_TAG\` (sha256 \`$PIN_SHA256\`)"
            echo "- pull request branch: \`$PIN_BRANCH\` (one open pin-bump pull request at a time)"
            echo ""
            echo "If no pull request was opened below, an agent opens it by hand from main:"
            echo ""
            echo '```bash'
            echo "git switch -c $PIN_BRANCH origin/main"
            echo "bun run beep ci binary-pin --tag $PIN_TAG --sha256 $PIN_SHA256 --write"
            echo "git commit -am 'ci: bump the beep CI binary pin to $PIN_TAG'"
            echo "bun run beep yeet open"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail closed: without the App credential the only token left is
      # github.token, whose pull request would start no Check run.
      - name: Check the pin-bump App credential
        if: steps.pin.outcome == 'success'
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.KNOWLEDGE_MINT_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            message="KNOWLEDGE_MINT_APP_CLIENT_ID is not set, so no App token can open the pin-bump pull request; a github.token pull request would start no Check run. Open it by hand with the commands above."
            echo "::error::${message}"
            echo "- ${message}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create pin-bump App token
        id: app-token
        if: steps.pin.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KNOWLEDGE_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KNOWLEDGE_MINT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # create-pull-request applies `ready-for-heavy` through the Issues labels API.
          permission-issues: write

      # One fixed branch: when a pin-bump pull request is already open, the
      # action force-updates its branch to the newest release and refreshes the
      # title and body instead of opening a second one. The repo's lefthook
      # hooks are for people.
      - name: Open or update the pin-bump pull request
        if: steps.pin.outcome == 'success'
        env:
          LEFTHOOK: "0"
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: ci/beep-ci-pin-bump
          delete-branch: true
          add-paths: .github/actions/fetch-beep-ci/action.yml
          labels: ready-for-heavy
          commit-message: "ci: bump the beep CI binary pin to ${{ steps.publish.outputs.tag }}"
          title: "ci: bump the beep CI binary pin to ${{ steps.publish.outputs.tag }}"
          body: |
            Opened by `.github/workflows/beep-ci-binary.yml` ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) after it published a new CI binary release from main.

            - release tag: `${{ steps.publish.outputs.tag }}`
            - closure digest: `${{ steps.closure.outputs.digest }}`
            - `beep-linux-x64` sha256: `${{ steps.publish.outputs.sha256 }}`
            - main commit: `${{ github.sha }}`

            The diff is the two pinned values in `.github/actions/fetch-beep-ci/action.yml`, written by
            `bun run beep ci binary-pin --write`. Every hosted job that fetches the CI binary runs the new
            pin on this pull request, so its own Check is the proof. A human or agent reviews and merges it;
            it is never auto-merged. A newer release force-updates this branch instead of opening a second
            pull request. Rollback: revert the squash commit to restore the previous pin.
