# Queue Lab enqueue probe (goals/merge-queue-lab, observation 10c):
# enqueue a pull request with this run's GITHUB_TOKEN and see whether the
# queue still dispatches a merge-group run.
name: Queue Lab Enqueue

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to enqueue
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    name: queue-lab-enqueue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enqueue with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .node_id)
          oid=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          gh api graphql -F id="$id" -F oid="$oid" -f query='mutation($id:ID!,$oid:GitObjectID){ enqueuePullRequest(input:{pullRequestId:$id, expectedHeadOid:$oid}){ mergeQueueEntry{ state position enqueuer{login} } } }' || true
