name: Job Context Contract PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/check.yml
      - .github/workflows/heavy.yml
      - .github/workflows/job-context-contract.yml
      - .github/workflows/job-context-contract-pr.yml

permissions:
  contents: read

jobs:
  contract:
    name: Context Contract Probe
    uses: ./.github/workflows/job-context-contract.yml

  all-skipped:
    name: All Skipped Context Contract Probe
    uses: ./.github/workflows/job-context-contract.yml
    with:
      active: false
