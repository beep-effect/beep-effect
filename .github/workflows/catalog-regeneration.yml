# Hosted catalog shard regeneration for worker-profile lanes
# (goals/compute-profile-gate-routing P2, D3/D9). Its own workflow so it can
# fire on the `labeled` event: `yeet open` pushes first and labels the new PR
# `compute-profile-worker` afterwards, and `check.yml` runs only on the default
# pull_request types, which would leave a single-push worker PR without the
# regeneration. Every other PR skips the job at the `if` below.
#
# Two jobs (P3 acceptance fixes): `regenerate-catalogs` runs the pull request's
# own code with a read-only token and no secret, and hands the shard diff over
# as an artifact. `push-catalogs` runs on a fresh runner, executes nothing from
# the pull request, and pushes the diff with a GitHub App installation token
# minted in the step right before the push. A push made with `github.token`
# starts no workflows the repository will run without a maintainer's approval
# (the 2026-11-13 dankserver run ended `action_required` on every follow-up
# run); an App push starts them like a lane push.
name: Catalog Regeneration

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  # goals/compute-profile-gate-routing P2 (D3, D9): worker-profile hosts skip
  # both catalog pre-commit writers, and `yeet open` labels their PRs
  # `compute-profile-worker`. This job regenerates the scoped shards over the
  # PR diff. It runs on same-repo draft PRs only: a bot push after `yeet ready`
  # would move the verdict head and restart the review window.
  regenerate-catalogs:
    name: Catalog Regeneration
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.draft == true
      && contains(github.event.pull_request.labels.*.name, 'compute-profile-worker')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: regenerate-catalogs-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      drifted: ${{ steps.diff.outputs.drifted }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch pull request base
        shell: bash
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci

      # Same scope as the lefthook commands: ACMD with --no-renames, so a
      # deleted or moved module drops its entries too. The globs are regexes,
      # not git pathspecs: Fallow's workflow plugin reads a `'packages/**'`
      # argument as an entry-point glob and marks every matched file as used.
      - name: Regenerate catalog shards
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "origin/${GITHUB_BASE_REF:-main}" HEAD)"
          changed="$(git diff --name-only --no-renames --diff-filter=ACMD "${merge_base}...HEAD")"
          mapfile -t schema_files < <(
            grep -E '^(apps|packages|infra)/.+\.tsx?$' <<<"$changed" \
              | grep -Ev '(/docs/|\.d\.ts$|/node_modules/)' || true
          )
          mapfile -t instrumentation_files < <(
            grep -E '^(apps|packages)/(.+/)?src/.+\.tsx?$' <<<"$changed" \
              | grep -Ev '(/test/|\.d\.ts$|/node_modules/)' || true
          )
          if (( ${#schema_files[@]} > 0 )); then
            bun run beep lint schema-catalog --write "${schema_files[@]}"
          else
            echo "No schema-catalog inputs in the PR diff."
          fi
          if (( ${#instrumentation_files[@]} > 0 )); then
            bun run beep observability catalog --write "${instrumentation_files[@]}"
          else
            echo "No instrumentation-catalog inputs in the PR diff."
          fi

      # Only the two shard directories leave this job, as a binary patch.
      - name: Record the shard diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- standards/schema-catalog standards/instrumentation-catalog
          if git diff --cached --quiet; then
            echo "Catalog shards are current."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary --no-renames -- standards/schema-catalog standards/instrumentation-catalog \
            > "$RUNNER_TEMP/catalog-shards.patch"
          git diff --cached --stat -- standards/schema-catalog standards/instrumentation-catalog
          echo "drifted=true" >> "$GITHUB_OUTPUT"

      - name: Upload the shard diff
        if: steps.diff.outputs.drifted == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-shards-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-shards.patch
          if-no-files-found: error
          retention-days: 1

  # Pushes the shard diff to the head branch. Nothing here runs code from the
  # pull request: the checkout keeps no credential, no dependency is installed,
  # the patch is data checked before it is applied, and git runs with hooks
  # off. The push token is the knowledge-mint App's installation token, scoped
  # to this repository with `contents: write` only, minted in the step right
  # before the push and revoked when the job ends. The App is not a bypass
  # actor on any ruleset and holds no `workflows` permission, so the token can
  # do less than the lane's own push access. A lane push that lands first makes
  # the push non-fast-forward, and the job fails loudly.
  push-catalogs:
    name: Catalog Regeneration Push
    needs: regenerate-catalogs
    if: ${{ needs.regenerate-catalogs.outputs.drifted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: regenerate-catalogs-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download the shard diff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-shards-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-shards

      # The patch was written by pull-request code: refuse any path outside the
      # two shard directories and any symlink, submodule or mode change before
      # applying it.
      - name: Apply the shard diff
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/catalog-shards/catalog-shards.patch"
          outside="$(git apply --numstat "$patch" | cut -f3- \
            | grep -vE '^standards/(schema|instrumentation)-catalog/[^[:space:]]+$' || true)"
          if [[ -n "$outside" ]]; then
            echo "::error::The shard diff touches paths outside the catalog shard directories:"
            echo "$outside"
            exit 1
          fi
          if git apply --summary "$patch" | grep -E ' mode (120000|160000)|mode change'; then
            echo "::error::The shard diff adds a symlink, a submodule or a mode change."
            exit 1
          fi
          git apply --index "$patch"
          git -c core.hooksPath=/dev/null \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(catalogs): regenerate shards for the worker-profile lane"

      # The regeneration job saw the event's payload; a flip to ready since then
      # means a push would move the verdict head after `yeet ready` (D9).
      - name: Confirm the pull request is still a labelled draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.draft, any(.labels[]; .name == "compute-profile-worker")] | @tsv')"
          if [[ "$state" != $'true\ttrue' ]]; then
            echo "Pull request #${PR_NUMBER} is no longer a draft labelled compute-profile-worker; not pushing."
            {
              echo "### Catalog shards not pushed"
              echo
              echo "Pull request #${PR_NUMBER} is no longer a draft labelled \`compute-profile-worker\`."
              echo "Regenerate the shards by hand and push them, or move the PR back to draft."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Fail closed: without the App credential the only token left is
      # `github.token`, whose push leaves every follow-up run waiting for a
      # maintainer's approval (`action_required`).
      - name: Check the push App credential
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.KNOWLEDGE_MINT_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            message="KNOWLEDGE_MINT_APP_CLIENT_ID is not set, so no App token can push the shards. A github.token push would leave every follow-up run waiting for approval; the shards were not pushed."
            echo "::error::${message}"
            {
              echo "### Catalog shards not pushed"
              echo
              echo "${message}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create push App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KNOWLEDGE_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KNOWLEDGE_MINT_APP_PRIVATE_KEY }}
          permission-contents: write

      # The token is used here only, on an explicit URL; it never enters git
      # config (skills-update-train.yml relock pattern).
      - name: Push the regenerated shards
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
          {
            echo "### Catalog shards pushed"
            echo
            echo "Pushed \`$(git rev-parse --short=12 HEAD)\` to \`${HEAD_REF}\` as \`${APP_SLUG}[bot]\`."
            echo "Its workflow runs start without approval, like a lane push."
          } >> "$GITHUB_STEP_SUMMARY"
