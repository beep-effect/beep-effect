# one-round-loop P1 (D3): nightly full property-law sweep. Runs EVERY
# test:property suite (no --affected) at a 1000-run floor so
# seed-dependent law failures surface here instead of detonating on
# unrelated PRs. Failures open/update ONE tracking issue (stable title,
# label property-laws-nightly); triage owner is the packet operator
# until P4, then the repo default.
#
# Verify after merging via manual dispatch (workflow_dispatch) — do not
# wait for cron.

name: Property Laws Nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "BEEP_FC_NUM_RUNS floor for the sweep"
        required: false
        default: "1000"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  property-sweep:
    name: Property Laws Sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup monorepo CI
        uses: ./.github/actions/setup-monorepo-ci
        with:
          native-pdf-tools: "true"
          turbo-remote-cache: "true"
          turbo-api: ${{ vars.TURBO_CACHE_API }}
          turbo-team: ${{ vars.TURBO_CACHE_TEAM }}
          turbo-read-token: ${{ secrets.TURBO_CACHE_READ_TOKEN }}

      - name: Run full property sweep
        shell: bash
        env:
          BEEP_PROPERTY_RUNS: ${{ inputs.runs || '1000' }}
        run: |
          set -euo pipefail

          if [[ ! "${BEEP_PROPERTY_RUNS}" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::runs must be a positive integer with at most 6 digits."
            exit 1
          fi

          BEEP_PROPERTY_SEED="$((GITHUB_RUN_ID % 2147483647))"
          echo "BEEP_FC_SEED=${BEEP_PROPERTY_SEED}"
          bun run beep ci lane property \
            --runs "${BEEP_PROPERTY_RUNS}" \
            --seed "${BEEP_PROPERTY_SEED}" \
            --summarize

      - name: Append Turbo summary
        if: always()
        run: bun run beep ci append-turbo-summary

      # The gate-report projection (grouped log, annotations, step summary) and the
      # task-outcomes/v2 record that indexes the job's gate records (goals/ci-gate-reports,
      # decision report-carrier), uploaded red or green. A measurement: it never decides
      # the job, so it continues on error.
      - name: Report gate records
        if: always()
        continue-on-error: true
        uses: ./.github/actions/gate-reports
        with:
          job-name: Property Laws Sweep
          artifact: task-outcomes-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-single

      - name: Upload gate reports and task outcomes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-outcomes-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-single
          path: ${{ runner.temp }}/gate-reports/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Nightly property-law sweep failures";
            const label = "property-laws-nightly";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Nightly sweep failed on ${context.sha} (run: ${runUrl}).`,
              "",
              "Seed-dependent property-law failures belong to the PR that",
              "introduced the schema, not to unrelated later PRs — triage the",
              "failing suite, reproduce with the logged seed, and fix or",
              "seed-exclude with a ledger note",
              "(goals/one-round-loop/SPEC.md stop conditions).",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: "open",
              per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body,
              });
            }

      - name: Stop R2 cache adapter
        if: always()
        shell: bash
        run: |
          if [[ -x packages/tooling/infra/turbo-cache/r2-pilot/adapter.sh ]]; then
            packages/tooling/infra/turbo-cache/r2-pilot/adapter.sh stop-ci
          fi
