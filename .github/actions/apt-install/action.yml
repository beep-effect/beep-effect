name: Apt install with retries
description: >-
  Keep only the Ubuntu archive, then run apt-get update and apt-get install as
  one bounded, retried unit so a transient or slow mirror does not fail the job.

# Hosted Ubuntu mirrors fail for minutes at a time: `503 Service Unavailable`
# and `Connection failed` on InRelease, or `File has unexpected size ...
# Mirror sync in progress?` while a mirror resyncs. The EC2 regional mirror can
# also serve at about 50 KB/s, so one large install outlives any short timeout.
# apt's own Acquire::Retries re-fetches single files inside one run; it does
# not retry a failed update as a whole. Each attempt here runs update (with
# APT::Update::Error-Mode=any, so any failed index fails the attempt instead of
# installing against a stale or partial index) and then install. Downloaded
# archives stay in apt's cache, so a later attempt only fetches what is still
# missing. From attempt `fallback-attempt` on, the Ubuntu sources point at
# http://archive.ubuntu.com/ubuntu instead of the regional mirror. Every
# command's timeout is clamped to what is left of `budget-seconds`, so the
# step ends within that budget (plus one 15 s kill grace) whatever the
# attempt count. A failed attempt waits and starts again from update; after
# the last attempt, or when the budget cannot fit another one, the step fails
# with an error annotation. With `deb-cache: "true"` the downloaded .deb
# archives also persist across jobs through the Actions cache, keyed on the
# runner image and the package list: a hit copies them into apt's archive
# directory before the first attempt, so install fetches only what the index
# moved past, and a miss saves them after a successful install. apt checks
# every archive against the signed index's SHA256 before using it, so a stale
# or foreign cache entry is downloaded again, never installed. Requires the beep CI binary on PATH
# (./.github/actions/fetch-beep-ci) for `beep ci prune-apt`.

inputs:
  packages:
    description: Whitespace-separated apt package names to install.
    required: true
  no-install-recommends:
    description: Pass --no-install-recommends to apt-get install.
    required: false
    default: "true"
  attempts:
    description: Most update-and-install attempts before the step fails.
    required: false
    default: "5"
  backoff-seconds:
    description: Pause before the second attempt; each later pause doubles it.
    required: false
    default: "15"
  install-timeout-seconds:
    description: Longest one apt-get install may run, before the budget clamp.
    required: false
    default: "900"
  budget-seconds:
    description: Wall-clock budget for every attempt and pause together.
    required: false
    default: "1500"
  deb-cache:
    description: >-
      Restore downloaded .deb archives from the Actions cache before the first
      attempt, and save them after a successful install that missed it.
    required: false
    default: "false"
  fallback-attempt:
    description: >-
      First attempt that uses http://archive.ubuntu.com/ubuntu instead of the
      regional mirror; 0 never falls back.
    required: false
    default: "2"

runs:
  using: composite
  steps:
    - name: Resolve apt deb cache key
      id: deb-cache-key
      if: inputs.deb-cache == 'true'
      shell: bash
      env:
        APT_INSTALL_PACKAGES: ${{ inputs.packages }}
        APT_INSTALL_NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        set -euo pipefail
        read -r -d '' -a packages <<< "$APT_INSTALL_PACKAGES" || true
        digest="$(printf '%s\n' "no-install-recommends=${APT_INSTALL_NO_RECOMMENDS}" "${packages[@]}" | LC_ALL=C sort | sha256sum | cut -c1-16)"
        image_os="${ImageOS:-$(. /etc/os-release && printf '%s%s' "$ID" "$VERSION_ID")}"
        prefix="apt-debs-v1-${image_os}-${RUNNER_ARCH}-${digest}-"
        {
          echo "prefix=${prefix}"
          echo "key=${prefix}${ImageVersion:-unversioned}"
          echo "path=${RUNNER_TEMP}/apt-install-debs"
        } >> "$GITHUB_OUTPUT"

    - name: Restore apt deb cache
      id: deb-cache
      if: inputs.deb-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.deb-cache-key.outputs.path }}
        key: ${{ steps.deb-cache-key.outputs.key }}
        restore-keys: ${{ steps.deb-cache-key.outputs.prefix }}

    - name: Install apt packages with retries
      shell: bash
      env:
        APT_INSTALL_PACKAGES: ${{ inputs.packages }}
        APT_INSTALL_NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
        APT_INSTALL_ATTEMPTS: ${{ inputs.attempts }}
        APT_INSTALL_BACKOFF_SECONDS: ${{ inputs.backoff-seconds }}
        APT_INSTALL_TIMEOUT_SECONDS: ${{ inputs.install-timeout-seconds }}
        APT_INSTALL_BUDGET_SECONDS: ${{ inputs.budget-seconds }}
        APT_INSTALL_FALLBACK_ATTEMPT: ${{ inputs.fallback-attempt }}
        APT_INSTALL_DEB_CACHE_DIR: ${{ inputs.deb-cache == 'true' && steps.deb-cache-key.outputs.path || '' }}
      run: |
        set -euo pipefail
        # -d '' reads every line, so a block-scalar package list works too.
        read -r -d '' -a packages <<< "$APT_INSTALL_PACKAGES" || true
        if (( ${#packages[@]} == 0 )); then
          echo "::error::apt-install: no packages were given."
          exit 1
        fi
        positive='^[1-9][0-9]*$'
        natural='^[0-9]+$'
        if [[ ! "$APT_INSTALL_ATTEMPTS" =~ $positive || ! "$APT_INSTALL_BACKOFF_SECONDS" =~ $natural \
          || ! "$APT_INSTALL_TIMEOUT_SECONDS" =~ $positive || ! "$APT_INSTALL_BUDGET_SECONDS" =~ $positive \
          || ! "$APT_INSTALL_FALLBACK_ATTEMPT" =~ $natural ]]; then
          echo "::error::apt-install: attempts, install-timeout-seconds and budget-seconds must be positive integers; backoff-seconds and fallback-attempt non-negative integers."
          exit 1
        fi
        privilege=()
        if [[ "$EUID" -ne 0 ]]; then
          privilege=(sudo -n)
        fi
        install_flags=(-y)
        if [[ "$APT_INSTALL_NO_RECOMMENDS" == "true" ]]; then
          install_flags+=(--no-install-recommends)
        fi
        # The image's third-party apt sources (Google Chrome, Microsoft) fail apt-get
        # update with "Hash Sum mismatch" / "403 Forbidden" for minutes at a time;
        # keep only the Ubuntu archive, which is where these packages come from.
        beep ci prune-apt
        # Run timeout inside sudo so its signals also reach privileged
        # package-manager children. Network retries alone do not bound
        # mirror stalls, lock waits, or the complete operation.
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=10
          -o Acquire::https::Timeout=10
          -o DPkg::Lock::Timeout=30
        )
        deadline=$(( SECONDS + APT_INSTALL_BUDGET_SECONDS ))
        bounded() {
          local limit="$1" left=$(( deadline - SECONDS ))
          shift
          if (( left < limit )); then
            limit="$left"
          fi
          if (( limit <= 0 )); then
            return 124
          fi
          "${privilege[@]}" timeout --signal=TERM --kill-after=15s "${limit}s" "$@"
        }
        apt_update() {
          bounded 180 apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
        }
        apt_install() {
          bounded "$APT_INSTALL_TIMEOUT_SECONDS" \
            apt-get "${apt_options[@]}" install "${install_flags[@]}" "${packages[@]}"
        }
        fallback_mirror=http://archive.ubuntu.com/ubuntu/
        use_fallback_mirror() {
          local source_list="" source_parts="" sources=() source
          eval "$(apt-config shell source_list Dir::Etc::sourcelist/f source_parts Dir::Etc::sourceparts/d)"
          for source in "$source_list" "${source_parts%/}/ubuntu.sources"; do
            if [[ -f "$source" ]]; then
              sources+=("$source")
            fi
          done
          if (( ${#sources[@]} == 0 )); then
            echo "::warning::apt-install: attempt ${attempt} found no Ubuntu sources to point at ${fallback_mirror}; keeping the current mirror."
            return 0
          fi
          "${privilege[@]}" sed -E -i \
            "s#(mirror\\+file:[^[:space:]]+|https?://[A-Za-z0-9.-]+\\.archive\\.ubuntu\\.com/ubuntu/?)#${fallback_mirror}#g" \
            "${sources[@]}"
          echo "::warning::apt-install: attempt ${attempt} of ${APT_INSTALL_ATTEMPTS} falls back from the regional mirror to ${fallback_mirror} (${sources[*]})."
        }
        deb_cache="${APT_INSTALL_DEB_CACHE_DIR:-}"
        archives=""
        shopt -s nullglob
        if [[ -n "$deb_cache" ]]; then
          eval "$(apt-config shell archives Dir::Cache::archives/d)"
          mkdir -p "$deb_cache"
          cached=("$deb_cache"/*.deb)
          if (( ${#cached[@]} > 0 )); then
            "${privilege[@]}" cp -- "${cached[@]}" "$archives"
          fi
          echo "apt-install: restored ${#cached[@]} cached .deb archives into ${archives}."
        fi
        keep_debs() {
          if [[ -z "$deb_cache" ]]; then
            return 0
          fi
          local fetched=("${archives%/}"/*.deb)
          rm -f -- "$deb_cache"/*.deb
          if (( ${#fetched[@]} > 0 )); then
            cp -- "${fetched[@]}" "$deb_cache"/
          fi
          echo "apt-install: kept ${#fetched[@]} .deb archives in ${deb_cache} for the cache."
        }
        backoff="$APT_INSTALL_BACKOFF_SECONDS"
        for (( attempt = 1; attempt <= APT_INSTALL_ATTEMPTS; attempt++ )); do
          if (( attempt == APT_INSTALL_FALLBACK_ATTEMPT )); then
            use_fallback_mirror
          fi
          if apt_update && apt_install; then
            keep_debs
            exit 0
          fi
          if (( attempt == APT_INSTALL_ATTEMPTS )); then
            break
          fi
          if (( deadline - SECONDS - backoff < 60 )); then
            echo "::error::apt-install: the ${APT_INSTALL_BUDGET_SECONDS}s budget leaves no room for attempt $(( attempt + 1 )) (packages: ${packages[*]})."
            exit 1
          fi
          echo "::warning::apt-install: attempt ${attempt} of ${APT_INSTALL_ATTEMPTS} failed; retrying update and install in ${backoff}s."
          sleep "$backoff"
          backoff=$(( backoff * 2 ))
        done
        echo "::error::apt-install: apt-get update and install failed after ${APT_INSTALL_ATTEMPTS} attempts (packages: ${packages[*]})."
        exit 1

    - name: Save apt deb cache
      if: inputs.deb-cache == 'true' && steps.deb-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.deb-cache-key.outputs.path }}
        key: ${{ steps.deb-cache-key.outputs.key }}
