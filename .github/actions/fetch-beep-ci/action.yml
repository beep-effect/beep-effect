name: Fetch beep CI binary
description: >-
  Download the checksum-pinned compiled beep CI binary from its main-built
  release, verify it, and put it on PATH as `beep` before any toolchain exists.

# The binary is the pre-toolchain `beep ci` surface (change-profile,
# prune-apt, runner-resources, patterns, job-env) compiled from
# packages/tooling/tool/cli/src/bin-ci.ts by .github/workflows/beep-ci-binary.yml
# on main pushes. The release tag and its sha256 are pinned once, below; a pin
# bump is its own pull request, so the binary that gates a pull request is
# never built from that pull request's head (goals/scripts-to-beep-cli
# decision 2026-11-07-ci-binary-release-asset).

runs:
  using: composite
  steps:
    - name: Fetch and verify the pinned beep CI binary
      shell: bash
      env:
        BEEP_CI_RELEASE_TAG: beep-ci-a56516d6d309
        BEEP_CI_SHA256: 6dfe082df52d4e23ad3b2ca3270e84792c61227e9f60d7eb61b0d3900d61df5c
        BEEP_CI_REPOSITORY: ${{ github.repository }}
        BEEP_CI_API_URL: ${{ github.api_url }}
        BEEP_CI_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "$BEEP_CI_RELEASE_TAG" == *PENDING* || ! "$BEEP_CI_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::fetch-beep-ci: the release pin is not set (tag ${BEEP_CI_RELEASE_TAG}); pin a published beep-ci-<sha> release and its sha256 in .github/actions/fetch-beep-ci/action.yml."
          exit 1
        fi
        if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
          echo "::error::fetch-beep-ci: only a linux-x64 binary is published; this runner is ${RUNNER_OS}/${RUNNER_ARCH}."
          exit 1
        fi
        bin_dir="${RUNNER_TEMP}/beep-ci/bin"
        binary="${bin_dir}/beep"
        verify() { printf '%s  %s\n' "$BEEP_CI_SHA256" "$binary" | sha256sum --check --strict --quiet; }
        # A job that already fetched this pin (an earlier step or composite) reuses it.
        if [[ ! -f "$binary" ]] || ! verify; then
          mkdir -p "$bin_dir"
          rm -f "$binary"
          # github.com/.../releases/download can 504 for minutes while the REST
          # asset route stays up (2026-11-08). The sha256 pin below judges the
          # bytes, so the route they arrived on does not matter.
          if ! curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 120 \
            --output "$binary" \
            "https://github.com/${BEEP_CI_REPOSITORY}/releases/download/${BEEP_CI_RELEASE_TAG}/beep-linux-x64"; then
            echo "::warning::fetch-beep-ci: the release download failed; retrying through the REST asset route."
            release_api="${BEEP_CI_API_URL}/repos/${BEEP_CI_REPOSITORY}/releases"
            asset_id="$(
              curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 60 \
                --header "Authorization: Bearer ${BEEP_CI_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                "${release_api}/tags/${BEEP_CI_RELEASE_TAG}" |
                jq --exit-status --raw-output '.assets[] | select(.name == "beep-linux-x64") | .id'
            )"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 120 \
              --header "Authorization: Bearer ${BEEP_CI_TOKEN}" \
              --header "Accept: application/octet-stream" \
              --output "$binary" \
              "${release_api}/assets/${asset_id}"
          fi
          if ! verify; then
            rm -f "$binary"
            echo "::error::fetch-beep-ci: ${BEEP_CI_RELEASE_TAG}/beep-linux-x64 does not match the pinned sha256."
            exit 1
          fi
        fi
        chmod 0755 "$binary"
        echo "$bin_dir" >> "$GITHUB_PATH"
