name: Setup monorepo CI
description: Restore caches and install dependencies for CI jobs after checkout.

inputs:
  cache-turbo:
    description: Restore the Turbo cache for jobs that execute Turbo tasks.
    required: false
    default: "false"
  cache-write:
    description: Save restored caches after install when cache misses occur.
    required: false
    default: "true"
  use-node:
    description: Setup Node.js runtime when workflow steps require it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Record setup start
      shell: bash
      run: |
        echo "BEEP_SETUP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Detect baked runner
      id: baked
      shell: bash
      # A `beep runners bake` image ships the Bun toolchain and a warmed
      # package store, stamped with the lockfile sha and Bun version it was
      # baked against. The fast path activates only when BOTH staleness keys
      # match this checkout; any missing marker or mismatch fails OPEN into
      # the ordinary download/restore path below.
      run: |
        hit=false
        if [ -f /etc/beep-ci/baked-runner ] \
          && [ -f /etc/beep-ci/bun-lock.sha256 ] \
          && [ -f /etc/beep-ci/bun-version ] \
          && [ -x "$HOME/.bun/bin/bun" ]; then
          baked_lock="$(cat /etc/beep-ci/bun-lock.sha256)"
          checkout_lock="$(sha256sum bun.lock | cut -d ' ' -f 1)"
          baked_bun="$(cat /etc/beep-ci/bun-version)"
          checkout_bun="$(tr -d '[:space:]' < .bun-version)"
          if [ "$baked_lock" = "$checkout_lock" ] && [ "$baked_bun" = "$checkout_bun" ]; then
            hit=true
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            echo "baked runner fast path: bun $baked_bun, lockfile $baked_lock"
          else
            echo "baked runner stale (lock $baked_lock vs $checkout_lock, bun $baked_bun vs $checkout_bun); using full setup"
          fi
        fi
        echo "hit=$hit" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      if: ${{ steps.baked.outputs.hit != 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
        # The fleet is heterogeneous (GitHub-hosted + owned beep-ec2 workers):
        # setup-bun's cross-job cache stores absolute paths from the SAVING
        # runner's home, which poisons restores on runners with a different
        # layout (fleet run 31245263696: "Cache restored successfully" followed
        # by bun missing at $HOME/.bun). A fresh ~2s download is deterministic.
        no-cache: "true"

    - name: Setup Node.js
      if: ${{ inputs.use-node == 'true' }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc

    - name: Restore Bun dependencies cache
      if: ${{ steps.baked.outputs.hit != 'true' }}
      id: bun-cache-restore
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-

    - name: Restore Turbo cache (local fallback only)
      if: ${{ inputs.cache-turbo == 'true' && (env.TURBO_TOKEN == '' || env.TURBO_TEAM == '') }}
      id: turbo-cache-restore
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-
          turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-

    - name: Install dependencies
      shell: bash
      run: |
        install_started_at="$(date +%s)"
        echo "BEEP_SETUP_INSTALL_STARTED_AT=$install_started_at" >> "$GITHUB_ENV"
        bun install --frozen-lockfile
        install_finished_at="$(date +%s)"
        echo "BEEP_SETUP_INSTALL_SECONDS=$((install_finished_at - install_started_at))" >> "$GITHUB_ENV"

    - name: Save Bun dependencies cache
      if: ${{ inputs.cache-write == 'true' && steps.baked.outputs.hit != 'true' && steps.bun-cache-restore.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ hashFiles('bun.lock') }}

    - name: Save Turbo cache (local fallback only)
      if: ${{ inputs.cache-write == 'true' && inputs.cache-turbo == 'true' && (env.TURBO_TOKEN == '' || env.TURBO_TEAM == '') && steps.turbo-cache-restore.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}

    - name: Report setup timing and cache metadata
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail

        finished_at="$(date +%s)"
        setup_seconds="n/a"
        if [[ "${BEEP_SETUP_STARTED_AT:-}" =~ ^[0-9]+$ ]]; then
          setup_seconds="$((finished_at - BEEP_SETUP_STARTED_AT))"
        fi

        install_seconds="${BEEP_SETUP_INSTALL_SECONDS:-n/a}"
        bun_cache_hit="${{ steps.bun-cache-restore.outputs.cache-hit }}"
        turbo_cache_hit="${{ steps.turbo-cache-restore.outputs.cache-hit }}"
        bun_cache_hit="${bun_cache_hit:-unknown}"
        turbo_cache_hit="${turbo_cache_hit:-skipped}"
        bun_cache_size="$(du -sh ~/.bun/install/cache 2>/dev/null | awk '{ print $1 }' || true)"
        turbo_cache_size="$(du -sh .turbo/cache 2>/dev/null | awk '{ print $1 }' || true)"
        bun_cache_size="${bun_cache_size:-missing}"
        turbo_cache_size="${turbo_cache_size:-missing}"
        node_version="not requested"
        if command -v node >/dev/null 2>&1; then
          node_version="$(node --version)"
        fi

        {
          echo "### Setup monorepo CI timing"
          echo
          echo "| Metric | Value |"
          echo "| --- | --- |"
          echo "| Setup total seconds | \`${setup_seconds}\` |"
          echo "| Baked fast path | \`${{ steps.baked.outputs.hit }}\` |"
          echo "| Install seconds | \`${install_seconds}\` |"
          echo "| Bun version | \`$(bun --version)\` |"
          echo "| Node version | \`${node_version}\` |"
          echo "| Bun cache key | \`bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}\` |"
          echo "| Bun cache hit | \`${bun_cache_hit}\` |"
          echo "| Bun cache size | \`${bun_cache_size}\` |"
          echo "| Turbo cache enabled | \`${{ inputs.cache-turbo }}\` |"
          echo "| Turbo cache key | \`turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}\` |"
          echo "| Turbo cache hit | \`${turbo_cache_hit}\` |"
          echo "| Turbo cache size | \`${turbo_cache_size}\` |"
          echo "| Cache write enabled | \`${{ inputs.cache-write }}\` |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
