name: Setup monorepo CI
description: Restore caches and install dependencies for CI jobs after checkout.

inputs:
  cache-turbo:
    description: Restore the Turbo cache for jobs that execute Turbo tasks.
    required: false
    default: "false"
  cache-write:
    description: Save restored caches after install when cache misses occur.
    required: false
    default: "true"
  turbo-cache-key-suffix:
    description: Stable suffix that isolates local Turbo caches for matrix lanes sharing one job id.
    required: false
    default: ""
  use-node:
    description: Setup Node.js runtime when workflow steps require it.
    required: false
    default: "true"
  free-disk:
    description: >-
      Reclaim disk on ephemeral hosted Linux images before installing: removes
      the preinstalled GHC, Android, Boost, and .NET stacks and prunes Docker.
      Owned beep- runners always keep their filesystem.
    required: false
    default: "false"
  free-disk-min-gib:
    description: >-
      With free-disk, skip the cleanup when at least this many GiB are already
      free on /. Empty always cleans.
    required: false
    default: ""
  turbo-remote-cache:
    description: >-
      Export the Turbo remote-cache credential tuple (TURBO_API, TURBO_TEAM,
      TURBO_TOKEN, TURBO_CACHE) plus TURBO_LOG_ORDER=stream into the job
      environment. Trusted main pushes receive read-write access through
      TURBO_TOKEN; same-repository pull requests receive read-only access
      through TURBO_READ_TOKEN; forks and every other event stay local-only.
      Policy lives in scripts/ci-job-env.mjs.
    required: false
    default: "false"
  app-secrets:
    description: >-
      Export the application secret block (DATABASE_URL, AUTH_SECRET, ...) on
      trusted main pushes; every other event exports empty values so Turbo's
      hashed environment stays stable. Names live in scripts/ci-job-env.mjs.
    required: false
    default: "false"
  turbo-api:
    description: Pass vars.TURBO_API from the calling job.
    required: false
    default: ""
  turbo-team:
    description: Pass vars.TURBO_TEAM from the calling job.
    required: false
    default: ""
  # Composite actions cannot read the secrets context, so the calling job
  # passes each secret the policy needs by name. The names below are the
  # whole allowlist of scripts/ci-job-env.mjs: a `with:` block is echoed in
  # the step's log header (values masked, names intact), so passing the
  # whole secrets context serialized as JSON instead would print the
  # repository's full secret inventory on every job and hand every secret to
  # a process running the pull request's code. The script never prints a
  # value.
  turbo-token:
    description: >-
      Pass secrets.TURBO_TOKEN (read-write remote cache) from the calling job.
      Exported only on trusted pushes.
    required: false
    default: ""
  turbo-read-token:
    description: >-
      Pass secrets.TURBO_READ_TOKEN (read-only remote cache) from the calling
      job. Exported only on same-repository pull requests.
    required: false
    default: ""
  database-url:
    description: Pass secrets.DATABASE_URL from a job that sets app-secrets.
    required: false
    default: ""
  database-url-unpooled:
    description: Pass secrets.DATABASE_URL_UNPOOLED from a job that sets app-secrets.
    required: false
    default: ""
  email-resend-api-key:
    description: Pass secrets.EMAIL_RESEND_API_KEY from a job that sets app-secrets.
    required: false
    default: ""
  auth-secret:
    description: Pass secrets.AUTH_SECRET from a job that sets app-secrets.
    required: false
    default: ""
  better-auth-secret:
    description: Pass secrets.BETTER_AUTH_SECRET from a job that sets app-secrets.
    required: false
    default: ""
  better-auth-url:
    description: Pass secrets.BETTER_AUTH_URL from a job that sets app-secrets.
    required: false
    default: ""
  security-trusted-origins:
    description: Pass secrets.SECURITY_TRUSTED_ORIGINS from a job that sets app-secrets.
    required: false
    default: ""
  liveblocks-secret-key:
    description: Pass secrets.LIVEBLOCKS_SECRET_KEY from a job that sets app-secrets.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Record setup start
      shell: bash
      run: |
        echo "BEEP_SETUP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Free runner disk
      # Destructive image cleanup runs on ephemeral hosted images (GitHub-
      # hosted and lookalikes); owned/workstation runners (beep- prefix)
      # keep their filesystem. Runs before any install so the large
      # preinstalled stacks never compete with the monorepo toolchain.
      if: ${{ inputs.free-disk == 'true' && runner.os == 'Linux' && !startsWith(runner.name, 'beep-') }}
      shell: bash
      env:
        FREE_DISK_MIN_GIB: ${{ inputs.free-disk-min-gib }}
      run: |
        set -euo pipefail
        if [[ -n "$FREE_DISK_MIN_GIB" ]]; then
          available_gib="$(df --output=avail -B1G / | tail -n 1 | tr -d '[:space:]')"
          echo "Root free space before cleanup: ${available_gib} GiB"
          if (( available_gib >= FREE_DISK_MIN_GIB )); then
            echo "At least ${FREE_DISK_MIN_GIB} GiB is available; skipping runner image cleanup."
            exit 0
          fi
        fi
        echo "Disk before cleanup:"
        df -h /
        sudo rm -rf \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/local/lib/android \
          /usr/local/share/boost \
          /usr/share/dotnet
        sudo apt-get clean
        docker system prune --all --force --volumes || true
        echo "Disk after cleanup:"
        df -h /

    - name: Detect baked runner
      id: baked
      shell: bash
      # A `beep runners bake` image ships the Bun toolchain and a warmed
      # package store, stamped with the lockfile sha, the Bun version, the
      # verified Bun archive sha, and digests for the installed Bun binary and
      # sealed package-store archive. The fast path activates only when the
      # checkout keys match and both root-owned artifacts match their digests.
      # Any missing marker or mismatch fails open into the ordinary setup path.
      run: |
        set -euo pipefail
        hit=false
        # Never trust a writable cache inherited from the image or an earlier
        # step. A valid baked image restores it from the authenticated archive.
        rm -rf -- "${HOME:?}/.bun/install/cache"
        if [ -f /etc/beep-ci/baked-runner ] \
          && [ -f /etc/beep-ci/bun-lock.sha256 ] \
          && [ -f /etc/beep-ci/bun-version ] \
          && [ -f /etc/beep-ci/bun-archive.sha256 ] \
          && [ -f /etc/beep-ci/bun-binary.sha256 ] \
          && [ -f /etc/beep-ci/bun-install-cache.sha256 ] \
          && [ -x /usr/local/bin/bun ] \
          && [ -L /usr/local/bin/bunx ] \
          && [ -f /opt/beep-ci/bun-install-cache.tgz ]; then
          baked_lock="$(cat /etc/beep-ci/bun-lock.sha256)"
          checkout_lock="$(sha256sum bun.lock | cut -d ' ' -f 1)"
          baked_bun="$(cat /etc/beep-ci/bun-version)"
          checkout_bun="$(tr -d '[:space:]' < .bun-version)"
          baked_archive="$(cat /etc/beep-ci/bun-archive.sha256)"
          checkout_archive="$(tr -d '[:space:]' < .bun-linux-x64.sha256)"
          baked_binary="$(cat /etc/beep-ci/bun-binary.sha256)"
          installed_binary="$(sha256sum /usr/local/bin/bun | cut -d ' ' -f 1)"
          baked_cache="$(cat /etc/beep-ci/bun-install-cache.sha256)"
          installed_cache="$(sha256sum /opt/beep-ci/bun-install-cache.tgz | cut -d ' ' -f 1)"
          bun_owner_mode="$(stat -c '%u:%g:%a' /usr/local/bin/bun)"
          cache_owner_mode="$(stat -c '%u:%g:%a' /opt/beep-ci/bun-install-cache.tgz)"
          bunx_target="$(readlink /usr/local/bin/bunx)"
          if [ "$baked_lock" = "$checkout_lock" ] \
            && [ "$baked_bun" = "$checkout_bun" ] \
            && [ "$baked_archive" = "$checkout_archive" ] \
            && [ "$baked_binary" = "$installed_binary" ] \
            && [ "$baked_cache" = "$installed_cache" ] \
            && [ "$bun_owner_mode" = "0:0:755" ] \
            && [ "$cache_owner_mode" = "0:0:444" ] \
            && [ "$bunx_target" = "bun" ]; then
            install -d -m 0755 "$HOME/.bun/install"
            tar -xzf /opt/beep-ci/bun-install-cache.tgz -C "$HOME/.bun/install"
            hit=true
            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "baked runner fast path: bun $baked_bun, binary $baked_binary, lockfile $baked_lock, archive $baked_archive, cache $baked_cache"
          else
            echo "baked runner stale or failed integrity checks; using full setup"
          fi
        fi
        echo "hit=$hit" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      if: ${{ steps.baked.outputs.hit != 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
        # The fleet is heterogeneous (GitHub-hosted + owned beep-ec2 workers):
        # setup-bun's cross-job cache stores absolute paths from the SAVING
        # runner's home, which poisons restores on runners with a different
        # layout (fleet run 31245263696: "Cache restored successfully" followed
        # by bun missing at $HOME/.bun). A fresh ~2s download is deterministic.
        no-cache: "true"

    - name: Setup Node.js
      if: ${{ inputs.use-node == 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    # One definition of the credential policy for every Turbo-backed job.
    # Runs after the Bun setup (the script needs a runtime) and before the
    # Turbo restore below, which keys its local fallback on the exported
    # TURBO_TOKEN / TURBO_TEAM. Only trusted main pushes ever see the write
    # token or the application secrets.
    - name: Export job environment
      if: ${{ inputs.turbo-remote-cache == 'true' || inputs.app-secrets == 'true' }}
      shell: bash
      env:
        BEEP_CI_TURBO_REMOTE_CACHE: ${{ inputs.turbo-remote-cache }}
        BEEP_CI_APP_SECRETS: ${{ inputs.app-secrets }}
        BEEP_CI_TURBO_API: ${{ inputs.turbo-api }}
        BEEP_CI_TURBO_TEAM: ${{ inputs.turbo-team }}
        BEEP_CI_SECRET_TURBO_TOKEN: ${{ inputs.turbo-token }}
        BEEP_CI_SECRET_TURBO_READ_TOKEN: ${{ inputs.turbo-read-token }}
        BEEP_CI_SECRET_DATABASE_URL: ${{ inputs.database-url }}
        BEEP_CI_SECRET_DATABASE_URL_UNPOOLED: ${{ inputs.database-url-unpooled }}
        BEEP_CI_SECRET_EMAIL_RESEND_API_KEY: ${{ inputs.email-resend-api-key }}
        BEEP_CI_SECRET_AUTH_SECRET: ${{ inputs.auth-secret }}
        BEEP_CI_SECRET_BETTER_AUTH_SECRET: ${{ inputs.better-auth-secret }}
        BEEP_CI_SECRET_BETTER_AUTH_URL: ${{ inputs.better-auth-url }}
        BEEP_CI_SECRET_SECURITY_TRUSTED_ORIGINS: ${{ inputs.security-trusted-origins }}
        BEEP_CI_SECRET_LIVEBLOCKS_SECRET_KEY: ${{ inputs.liveblocks-secret-key }}
        BEEP_CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: bun scripts/ci-job-env.mjs

    - name: Restore Bun dependencies cache
      if: ${{ steps.baked.outputs.hit != 'true' }}
      id: bun-cache-restore
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-

    - name: Restore Turbo cache (local fallback only)
      if: ${{ inputs.cache-turbo == 'true' && (env.TURBO_TOKEN == '' || env.TURBO_TEAM == '') }}
      id: turbo-cache-restore
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}${{ inputs.turbo-cache-key-suffix }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}${{ inputs.turbo-cache-key-suffix }}-

    - name: Install dependencies
      shell: bash
      run: |
        install_started_at="$(date +%s)"
        echo "BEEP_SETUP_INSTALL_STARTED_AT=$install_started_at" >> "$GITHUB_ENV"
        bun install --frozen-lockfile
        install_finished_at="$(date +%s)"
        echo "BEEP_SETUP_INSTALL_SECONDS=$((install_finished_at - install_started_at))" >> "$GITHUB_ENV"

    - name: Save Bun dependencies cache
      if: ${{ inputs.cache-write == 'true' && steps.baked.outputs.hit != 'true' && steps.bun-cache-restore.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ hashFiles('bun.lock') }}

    - name: Save Turbo cache (local fallback only)
      if: ${{ inputs.cache-write == 'true' && inputs.cache-turbo == 'true' && (env.TURBO_TOKEN == '' || env.TURBO_TEAM == '') && steps.turbo-cache-restore.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ startsWith(runner.name, 'beep-ci-') && 'fleet' || 'shared' }}-${{ github.job }}${{ inputs.turbo-cache-key-suffix }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}

    - name: Report setup timing and cache metadata
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail

        finished_at="$(date +%s)"
        setup_seconds="n/a"
        if [[ "${BEEP_SETUP_STARTED_AT:-}" =~ ^[0-9]+$ ]]; then
          setup_seconds="$((finished_at - BEEP_SETUP_STARTED_AT))"
        fi

        install_seconds="${BEEP_SETUP_INSTALL_SECONDS:-n/a}"
        bun_cache_hit="${{ steps.bun-cache-restore.outputs.cache-hit }}"
        turbo_cache_hit="${{ steps.turbo-cache-restore.outputs.cache-hit }}"
        bun_cache_hit="${bun_cache_hit:-unknown}"
        turbo_cache_hit="${turbo_cache_hit:-skipped}"
        turbo_remote_mode="${BEEP_CI_TURBO_REMOTE_MODE:-not requested}"
        bun_cache_size="$(du -sh ~/.bun/install/cache 2>/dev/null | awk '{ print $1 }' || true)"
        turbo_cache_size="$(du -sh .turbo/cache 2>/dev/null | awk '{ print $1 }' || true)"
        bun_cache_size="${bun_cache_size:-missing}"
        turbo_cache_size="${turbo_cache_size:-missing}"
        node_version="not requested"
        if command -v node >/dev/null 2>&1; then
          node_version="$(node --version)"
        fi

        {
          echo "### Setup monorepo CI timing"
          echo
          echo "| Metric | Value |"
          echo "| --- | --- |"
          echo "| Setup total seconds | \`${setup_seconds}\` |"
          echo "| Baked fast path | \`${{ steps.baked.outputs.hit }}\` |"
          echo "| Install seconds | \`${install_seconds}\` |"
          echo "| Bun version | \`$(bun --version)\` |"
          echo "| Node version | \`${node_version}\` |"
          echo "| Bun cache key | \`bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}\` |"
          echo "| Bun cache hit | \`${bun_cache_hit}\` |"
          echo "| Bun cache size | \`${bun_cache_size}\` |"
          echo "| Turbo cache enabled | \`${{ inputs.cache-turbo }}\` |"
          echo "| Turbo cache key | \`turbo-${{ runner.os }}-${{ github.job }}${{ inputs.turbo-cache-key-suffix }}-${{ hashFiles('turbo.json', 'package.json', 'bun.lock') }}\` |"
          echo "| Turbo cache hit | \`${turbo_cache_hit}\` |"
          echo "| Turbo cache size | \`${turbo_cache_size}\` |"
          echo "| Turbo remote cache | \`${turbo_remote_mode}\` |"
          echo "| Cache write enabled | \`${{ inputs.cache-write }}\` |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
